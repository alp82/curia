function teleportHtml(a) {
  return `<div class="act-box">
    <div class="dim-note">On the box itself, in a terminal:</div>
    <input class="copy" type="text" readonly value="${esc(attachCmd(a.session))}" onclick="this.select()">
  </div>`;
}
function waitingCell(a) {
  const open = a.waiting_on ?? [];
  if (!open.length) return `<span class="dim-note">${a.result_received ? "its result is in" : "nothing"}</span>`;
  return open.map((w) => `<span class="mono">${esc(w.kind)}</span>`).join(" · ");
}
/* A tmux session curia does not track. It is an anomaly reconcile owns, so the
   page states it and spends no color on it. */
function untrackedLine(o) {
  if (!o.untracked?.length) return "";
  return `<p class="dim-note">Untracked sessions: <span class="mono">${o.untracked.map((s) => esc(s)).join(", ")}</span>. Reconcile adopts or sweeps these.</p>`;
}
function recentLine(o) {
  if (!o.recent?.length) return "";
  return `<p class="dim-note">Recently: ${o.recent.map((r) => `${esc(r.kind)} ${esc(ticketName(r.repo, r.ticket))}`).join(" · ")}</p>`;
}

/* ---- frontier -------------------------------------------------------------- */

/* The ticket type is the `wayfinder:` label and nothing else — a ticket with no
   such label has no type, and saying so beats guessing one from another label. */
function typeOf(item) {
  const l = (item.labels ?? []).find((x) => String(x).startsWith("wayfinder:"));
  return l ? String(l).slice("wayfinder:".length) : "untyped";
}
const shortRepo = (r) => String(r).split("/").pop();

/* The filter runs over the snapshot, never over the wire: the frontier is
   reconcile's reading and the page must not re-ask for a narrower one. */
function frFiltered(snap) {
  const f = UI.fr;
  return (snap?.repos ?? [])
    .filter((r) => f.repo === "all" || r.repo === f.repo)
    .map((r) => (r.error ? r : { ...r, items: (r.items ?? []).filter((i) => f.type === "all" || typeOf(i) === f.type) }));
}
function frTypes(snap) {
  const all = new Set();
  for (const r of snap?.repos ?? []) for (const i of r.items ?? []) all.add(typeOf(i));
  return [...all].sort();
}

/* Start (#266). The dispatch order — claim, prepare, spawn — is `start`'s own,
   and the reply that comes back is curia's sentence about what it did.

   Two facts ride beside the button. The ROUTED MODEL is the daemon's
   `resolveModel` answer, joined onto the item by reconcile, so the operator
   knows which account this press spends before spending it. And an agent
   ALREADY on this ticket replaces the button, because a second start on it is
   refused anyway and a button that only ever refuses is a worse way to say so.

   When the fleet could not be read, neither is claimed: the button stands, and
   the line under it says curia cannot tell. Null is not empty here either. */
function agentOn(o, repo, number) {
  if (o?.agents == null) return undefined;
  return o.agents.find((a) => String(a.ticket) === String(number) && (!a.repo || a.repo === repo)) ?? null;
}
function startRow(o, repo, n) {
  const live = agentOn(o, repo, n.number);
  const key = `start:${repo}#${n.number}`;
  if (live) return `<div class="act-row"><span class="dim-note mono">⧗ dispatched — ${esc(live.session)}</span></div>`;
  const model = n.model
    ? `<span class="dim-note mono">→ ${esc(n.model)} (${esc(typeOf(n))} default)</span>`
    : `<span class="dim-note">the routed model is not on this reading</span>`;
  return `<div class="act-row">
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="startTicket('${js(repo)}','${js(n.number)}')">${
        busy(key) ? "Starting…" : "Start"}</button>${model}
    </div>
    ${live === undefined ? `<div class="dim-note">the fleet could not be read, so curia cannot say whether this one is already running</div>` : ""}
    ${said(key)}`;
}

function frCards(repos, o) {
  const bigs = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).map((i) => ({ ...i, repo: r.repo })));
  const kids = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).flatMap((i) => (i.unblocks ?? []).map((k) => ({ ...k, repo: r.repo, from: i.number }))));
  return `${repos.filter((r) => r.error).map(frError).join("")}
    <div class="frx-sect"><span class="eyebrow">takeable now (${bigs.length})</span>
      ${bigs.length ? `<div class="frx-big">${bigs.map((n) => `<div class="frx-card">
        <div class="head"><span class="t">#${esc(n.number)}</span><span class="typ">${esc(typeOf(n))}</span></div>
        <div class="title">${esc(n.title)}</div>
        <div class="foot"><span>${esc(n.repo)}</span><span>${n.unblocks?.length ? `unblocks ${n.unblocks.length}` : "unblocks nothing yet"}</span></div>
        ${n.mapTitle ? `<div class="dim-note">${esc(n.mapTitle)}</div>` : ""}
        ${startRow(o, n.repo, n)}
      </div>`).join("")}</div>` : `<div class="empty">Nothing is takeable under this filter.</div>`}
    </div>
    <div class="frx-sect"><span class="eyebrow">unblocked next (${kids.length})</span>
      ${kids.length ? `<div class="frx-dim">${kids.map((k) => `<div class="frx-dimcard"><span class="t">#${esc(k.number)}</span>${esc(k.title)}
        <span class="from">↖ #${esc(k.from)} · ${esc(k.repo)}</span></div>`).join("")}</div>`
        : `<div class="empty">These tickets unblock nothing that is not already takeable.</div>`}
    </div>`;
}
function frTree(repos, o) {
  return repos.map((r) => {
    if (r.error) return frError(r);
    if (!r.items?.length) return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      <div class="empty">Nothing is takeable under this filter.</div></div>`;
    return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      ${r.items.map((n) => `<div class="fr-group">
        <div class="fr-node"><span class="typ">${esc(typeOf(n))}</span><span class="t">#${esc(n.number)}</span>${esc(n.title)}
          ${startRow(o, r.repo, n)}</div>
        ${n.unblocks?.length ? `<div class="fr-kids">${n.unblocks.map((k) => `<div class="fr-kid"><span class="t">#${esc(k.number)}</span>${esc(k.title)}</div>`).join("")}</div>` : ""}
      </div>`).join("")}</div>`;
  }).join("");
}
function frError(r) {
  return `<div class="unread"><span class="mono">${esc(r.repo)}</span> could not be read — ${esc(r.error)}. This is not an empty frontier: there may be takeable tickets there.</div>`;
}

const FR_VIEWS = { cards: ["Cards", frCards], tree: ["Tree", frTree] };

function screenFrontier(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Frontier");
  const snap = o.frontier;
  const right = `<span class="seg">${Object.entries(FR_VIEWS).map(([k, v]) =>
    `<button class="${UI.fr.view === k ? "on" : ""}" onclick="frSet('view','${k}')">${esc(v[0])}</button>`).join("")}</span>`;
  if (!snap || !snap.computed_at) {
    return `${head(p, "Frontier — two levels", right)}
      <div class="later">No frontier has been computed yet. Reconcile computes it on the credentials that pass already holds, and stamps the instant it did.</div>`;
  }
  const types = frTypes(snap);
  const filter = `<div class="frx-filter">
    <button class="fchip ${UI.fr.repo === "all" ? "on" : ""}" onclick="frSet('repo','all')">all projects</button>
    ${(snap.repos ?? []).map((r) => `<button class="fchip ${UI.fr.repo === r.repo ? "on" : ""}" onclick="frSet('repo','${esc(r.repo)}')">${esc(shortRepo(r.repo))}</button>`).join("")}
    <span class="sep">·</span>
    <select onchange="frSet('type',this.value)">
      <option value="all"${UI.fr.type === "all" ? " selected" : ""}>all types</option>
      ${types.map((t) => `<option${UI.fr.type === t ? " selected" : ""}>${esc(t)}</option>`).join("")}
    </select>
    <span class="dim-note">computed ${esc(ago(snap.computed_at))}</span>
  </div>`;
  return `${head(p, "Frontier — two levels", right)}${filter}${FR_VIEWS[UI.fr.view][1](frFiltered(snap), o)}`;
}
function frSet(key, value) {
  UI.fr[key] = value;
  /* A repo that leaves the filter takes its types with it — an unreachable
     type filter would show an empty page and name no reason. */
  if (key === "repo") UI.fr.type = "all";
  render();
}

/* ---- feed ------------------------------------------------------------------ */

function screenFeed(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Feed");
  const n = o.events?.length ?? 0;
  return `${head(p, "Feed", `<span class="dim-note">the journal's last ${esc(n)} event(s)</span>`)}
    <div style="max-width:720px">${feedList(o.events)}</div>`;
}

/* ---- settings (#265) -------------------------------------------------------

   The one screen that writes. Three facts shape all of it.

   1. IT DRAWS ITS OWN READ. `GET /api/settings` is a fresh parse of
      curia.yaml and routing.yaml off disk, never the poll snapshot: both files
      are hand-edited on the box too, and a screen that offered to save over an
      edit it had not seen would lose it.
   2. IT POSTS ONLY WHAT CHANGED. The patch is the difference between `draft`
      and `settings`, so a field nobody touched is not written — which is what
      keeps a hand edit made while this tab was open from being clobbered by a
      save of something else.
   3. A SAVE APPLIES (#362). The sidecar asks the daemon to reload after a
      write that landed, and the answer rides back with the save. So the banner
      states an outcome — applied, declined, or the daemon is not answering —
      instead of handing the operator a second button to press. What "applied"
      means is measured: the daemon reports the six settings it is RUNNING, and
      this screen compares them against the file it read. */

const SET_SECTIONS = { routing: "Routing", projects: "Projects", dispatch: "Dispatch", maintenance: "Maintenance" };
const SET_HINTS = {
  routing: "The model each ticket type gets when no label on the ticket says otherwise.",
  projects: "The repos curia watches. It dispatches against these and no others.",
  dispatch: "Whether curia starts work by itself, how many agents run at once, and how often it looks for work.",
  maintenance: "Whether the daemon runs what the files say, and the restart for the keys a save cannot apply.",
};
const DISPATCH_FIELDS = [
  ["max_concurrent", "How many agents may run at once. Each one costs a container, and three sandbox ports."],
  ["poll_interval_s", "How often curia reads the frontier of every watched repo."],
];

const clone = (x) => JSON.parse(JSON.stringify(x));

/* What the operator has changed and not yet saved. The banner counts these and
   the save posts them; both read this one function, so the count can never
   disagree with what lands on disk. */
function settingsPatch() {
  if (!settings || !draft) return {};
  const p = {};
  const d = {};
  for (const k of Object.keys(draft.dispatch)) {
    if (draft.dispatch[k] !== settings.dispatch[k]) d[k] = draft.dispatch[k];
  }
  if (Object.keys(d).length) p.dispatch = d;
  if (JSON.stringify(draft.watch) !== JSON.stringify(settings.watch)) p.watch = draft.watch;
  const defaults = {};
  draft.routing.defaults.forEach((row, i) => {
    if (row.model !== settings.routing.defaults[i]?.model) defaults[row.type] = row.model;
  });
  const models = {};
  draft.routing.models.forEach((m, i) => {
    if (m.active !== settings.routing.models[i]?.active) models[m.name] = { active: m.active };
  });
  if (Object.keys(defaults).length || Object.keys(models).length) {
    p.routing = {};
    if (Object.keys(defaults).length) p.routing.defaults = defaults;
    if (Object.keys(models).length) p.routing.models = models;
  }
  return p;
}
function changeCount() {
  const p = settingsPatch();
  return Object.keys(p.dispatch ?? {}).length
    + (p.watch ? 1 : 0)
    + Object.keys(p.routing?.defaults ?? {}).length
    + Object.keys(p.routing?.models ?? {}).length;
}

/* ---- what the daemon is running (#362) --------------------------------------

   Applied is a fact curia measured, not a claim the save made. `GET /overview`
   carries the six settings the daemon RUNS and the instant it read them; this
   compares them, key by key, against the file this screen read.

   Null means curia cannot tell — no snapshot, no file read, or a daemon that is
   not answering, whose last reading says what WAS true and not what is. Null is
   never drawn as agreement: "unknown" and "in step" are opposite facts. */
const sameJSON = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

function runningDiff(p) {
  const run = p?.overview?.daemon?.config;
  if (!run || !settings || !p.daemon_up) return null;
  const out = [];
  for (const k of Object.keys(settings.dispatch)) {
    if (!sameJSON(settings.dispatch[k], run.dispatch?.[k])) out.push("dispatch." + k);
  }
  if (!sameJSON(settings.watch, run.watch)) out.push("watch");
  const rows = (list) => new Map((list ?? []).map((r) => [r.type, r.model]));
  const [fileRows, runRows] = [rows(settings.routing.defaults), rows(run.routing?.defaults)];
  for (const type of new Set([...fileRows.keys(), ...runRows.keys()])) {
    if (!sameJSON(fileRows.get(type), runRows.get(type))) out.push("routing.defaults." + type);
  }
  const switches = (list) => new Map((list ?? []).map((m) => [m.name, m.active !== false]));
  const [fileSw, runSw] = [switches(settings.routing.models), switches(run.routing?.models)];
  for (const name of new Set([...fileSw.keys(), ...runSw.keys()])) {
    if (!sameJSON(fileSw.get(name), runSw.get(name))) out.push("routing.models." + name + ".active");
  }
  return out;
}

/* ---- the save banner: one act, at the top (#362) ---- */

function saveBanner() {
  const n = changeCount();
  const s = UI.set;
  const save = (on) => `<button class="btn${on ? " primary" : ""}" ${on && !s.busy ? "" : "disabled"} onclick="doSave()">${
    s.busy ? "Saving…" : "Save"}</button>`;
  /* One button, one shape: the banner offers a restart only where it is the
     mitigation, so the one it offers is always the loud one. */
  const restart = () => `<button class="btn restart-hot" ${s.busy ? "disabled" : ""} onclick="doRestart()">Restart to apply</button>`;
  const line = (cls, body) => `<div class="save-banner${cls ? " " + cls : ""}">${body}</div>`;

  /* The bar is just Save. The restart left this banner with #362 and lives in
     Maintenance, because it is now a rare act about a hand edit — the one place
     it still belongs here is a save the daemon declined, where it is the
     mitigation for that save. */
  if (s.phase === "unread") {
    return line("refused", `${save(false)}
      <span class="toast">The settings could not be read.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (s.phase === "refused") {
    /* The loaders refused the candidate, so nothing on disk moved. The draft
       stays on screen: the operator fixes the value they typed, they do not
       type it again. */
    return line("refused", `${save(n > 0)}
      <span class="toast">Refused — nothing was written.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (s.phase === "restarting") {
    return line("", `${save(n > 0)}
      <span class="toast">The daemon exited nonzero and the supervisor respawns it. This page serves its last snapshot meanwhile.</span>`);
  }
  /* The three outcomes a save can have. Each one states what happened to the
     daemon, and carries a button only where a button is the mitigation. */
  if (s.phase === "applied") {
    return line("saved", `<button class="btn" disabled>Saved ✓</button>
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon is running it.</span>`);
  }
  if (s.phase === "declined") {
    /* The file moved a key a reload cannot apply, so the daemon kept the config
       it booted with. The restart is the mitigation, and it is the loud one. */
    return line("saved", `<button class="btn" disabled>Saved ✓</button>${restart()}
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon did not apply it.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (s.phase === "offline") {
    /* No button: a restart is not the mitigation for a daemon that is already
       not answering, and pressing one would be an order nobody takes. */
    return line("saved", `<button class="btn" disabled>Saved ✓</button>
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon is not answering, so it takes this file at its next boot.
        If it refuses to boot, the daemon log names the key.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (n === 0) {
    return line("", `${save(false)}
      <span class="toast">${esc(s.note ?? "No unsaved changes.")}</span>`);
  }
  return line("", `${save(true)}
    <span class="toast">${n} unsaved change${n === 1 ? "" : "s"}.</span>`);
}

/* ---- the three sections ---- */

const setBlock = (title, hint, body) => `<div class="set-block"><h3>${esc(title)}</h3>
  <p class="hint">${esc(hint)}</p>${body}</div>`;

/* Routing. The ticket-type table leads and the model list sits behind one
   click, because the row an operator changes is the default, and the model
   list is the thing they set once. */
function setRouting() {
  const models = draft.routing.models;
  const active = models.filter((m) => m.active);
  const rows = draft.routing.defaults.map((row, i) => {
    const known = active.some((m) => m.name === row.model);
    return `<tr><td class="mono">${esc(row.type)}</td>
      <td><select onchange="setDefault(${i}, this.value)">
        ${active.map((m) => `<option ${m.name === row.model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        ${known ? "" : `<option selected>${esc(row.model)}</option>`}
      </select>${known ? "" : ` <span class="dim-note">switched off — the daemon refuses this config</span>`}</td></tr>`;
  }).join("");
  const mgr = `<div class="model-mgr">
    <a href="#settings" onclick="UI.set.models=!UI.set.models;render();return false">${
      active.length} of ${models.length} models active · ${UI.set.models ? "close" : "manage"}</a>
    ${UI.set.models ? `<table style="margin-top:10px"><tr><th>active</th><th>model</th><th>runs on</th></tr>
      ${models.map((m, i) => `<tr class="${m.active ? "" : "inactive"}">
        <td><input type="checkbox" id="set-model-${esc(m.name)}" ${m.active ? "checked" : ""} onchange="setModelActive(${i}, this.checked)"></td>
        <td class="mono">${esc(m.name)}${m.id ? ` <span class="dim-note">${esc(m.id)}</span>` : ""}</td>
        <td class="mono">${esc(m.provider ?? "?")} · ${esc(m.harness ?? "?")}</td></tr>`).join("")}</table>
      <p class="hint" style="margin:8px 0 0">A model switched off keeps its whole entry in routing.yaml. It leaves the
        dispatch vocabulary: no default may name it, a fallback chain steps over it, and a <code>model:</code> label on it is refused.</p>` : ""}
  </div>`;
  return setBlock("Routing", SET_HINTS.routing,
    `<table><tr><th>ticket type</th><th>default model</th></tr>${rows}</table>${mgr}`);
}

/* Projects. The repo list comes from the daemon, which holds the GitHub login;
   this page holds no credential at all. */
function setProjects() {
  const watched = draft.watch.map((w) => w.repo);
  const rows = draft.watch.map((w, i) => `<tr><td class="mono">${esc(w.repo)}</td>
    <td class="dim-note">${esc(w.mode)}</td>
    <td class="right"><button class="btn sm" ${draft.watch.length < 2 ? "disabled" : ""}
      onclick="removeRepo(${i})">remove</button></td></tr>`).join("");
  let connect;
  if (repos === null) connect = `<div class="gh-connect"><span class="dot off"></span>reading the GitHub login…</div>`;
  else if (repos.error) {
    /* Null is not empty: curia could not ask, which is a different fact from
       an account with no repos. The typed field below still works. */
    connect = `<div class="unread">curia could not read your repos from GitHub — ${esc(repos.error)}. Type a repo below instead.</div>`;
  } else {
    connect = `<div class="gh-connect"><span class="dot"></span>GitHub connected as
      <b class="mono">${esc(repos.login ?? "?")}</b>
      <span class="dim-note">the ${esc(repos.repos?.length ?? 0)} most recently pushed repos it can reach</span></div>`;
  }
  const choices = (repos?.repos ?? []).filter((r) => !watched.includes(r));
  const picker = choices.length
    ? `<select id="set-repo-pick" onchange="addRepo(this.value); this.value=''">
        <option value="">add a repo…</option>${choices.map((r) => `<option>${esc(r)}</option>`).join("")}</select>`
    : "";
  return setBlock("Projects", SET_HINTS.projects, `${connect}
    <table>${rows}
    <tr><td colspan="3">${picker}
      <input type="text" id="set-repo-typed" placeholder="owner/name" size="22">
      <button class="btn sm" onclick="addTypedRepo()">add</button></td></tr></table>
    <p class="hint" style="margin:10px 0 0">The last repo cannot be removed: curia dispatches only against watched repos.</p>`);
}

function setDispatch() {
  const auto = draft.dispatch.auto_dispatch;
  const rows = DISPATCH_FIELDS.map(([key, why]) => `<tr>
    <td class="mono">${esc(key)}<span class="hint" style="display:block;margin:2px 0 0">${esc(why)}</span></td>
    <td><input type="number" id="set-${esc(key)}" min="1" value="${esc(draft.dispatch[key] ?? "")}"
      oninput="setDispatchField('${esc(key)}', this.value)"></td></tr>`).join("");
  return setBlock("Dispatch", SET_HINTS.dispatch, `<table>
    <tr><td><label for="set-auto"><b>auto_dispatch</b></label>
      <span class="hint" style="display:block;margin:2px 0 0">On, curia starts the next takeable ticket by itself. Off, every dispatch is one the operator ordered.</span></td>
      <td><input type="checkbox" id="set-auto" ${auto ? "checked" : ""} onchange="setDispatchField('auto_dispatch', this.checked)"></td></tr>
    ${rows}</table>
    <p class="hint" style="margin:10px 0 0">A save applies at once. It cancels no running agent:
      auto_dispatch off leaves every live agent running, and a max_concurrent below the live count
      starts nothing new until the count falls. A model change reaches the next dispatch, never a
      running one.</p>`);
}

/* Maintenance (#362). Last of the four, because it is the section an operator
   reads rather than edits. It says one thing — whether the daemon runs the
   file — and carries the one act that answers a no. */
function setMaintenance(p) {
  const differs = runningDiff(p);
  const run = p?.overview?.daemon?.config;
  let state;
  if (differs === null) {
    state = `<p class="unread">curia cannot tell whether the daemon runs these files: ${
      p?.daemon_up === false ? "it is not answering." : "there is no reading of it yet."}</p>`;
  } else if (differs.length) {
    state = `<p class="unread">The daemon is NOT running the files. These differ:
      <span class="mono">${differs.map(esc).join(", ")}</span>. A restart takes them.</p>`;
  } else {
    state = `<p class="hint">The daemon is running these files. It read them ${esc(ago(run?.loaded_at))}.</p>`;
  }
  return setBlock("Maintenance", SET_HINTS.maintenance, `${state}
    <button class="btn${differs?.length ? " restart-hot" : ""}" ${UI.set.busy ? "disabled" : ""}
      onclick="doRestart()">Restart daemon</button>
    <p class="hint" style="margin:10px 0 0">A restart is for the keys a save cannot apply: the ports,
      <span class="mono">workspace_root</span>, <span class="mono">sandbox</span>,
      <span class="mono">identity</span>, and every routing key this screen does not write.
      Agent panes live in their own container, so they survive it.</p>`);
}

/* ---- the chat (#267, many conversations by #333) ----------------------------

   The console draws no chat of its own and frames none. A chat IS the timeline
   attach — the same page a phone opens against an agent — pointed at one
   browser conversation of the overseer and served under this address. One chat
   surface: the composer, the history and every future thing the timeline grows
   arrive here for free, and there is no second one to keep in step.

   So this screen is a door, and #333 made it a door with many rooms behind it.
   ADR-0016 gives the browser many conversations rather than one that grows
   forever, so this is where the operator picks one and opens a new one. A new
   conversation is the reset, the same way a new Discord thread is.

   The picker lives HERE and not in the chat page, because the chat page is the
   timeline and an agent opens the same page. A conversation switcher there
   would put console words on the agent surface.

   Every row carries its own context percent. ADR-0016 adds no warning that a
   conversation is long: that number IS the signal, and #332 is what made it
   true per conversation. */
const CHAT_PAGE = "/chat";
const chatHref = (session) => CHAT_PAGE + "?session=" + encodeURIComponent(session);

function screenChat(p) {
  /* The overseer runs in its own container (#315), but every message reaches it
     THROUGH the daemon, so a daemon that is not answering is still a chat that
     is not there. The bar above says why; this says what it means. */
  const down = p && !p.daemon_up;
  const lead = `<p class="lead">This is the overseer — the same curia that answers your prose in
      Discord. It sees every watched repo, and it holds the verbs: ask it what to start, then say
      <code>start 256</code> and it dispatches.</p>
    ${down ? `<p class="unread">The chat is down while the daemon restarts. Your message reaches the overseer through it.</p>` : ""}`;
  const count = conversations?.conversations?.length ?? null;
  return `${head(p, "Chat", count == null ? "" : `<span class="dim-note num">${count} conversation${count === 1 ? "" : "s"}</span>`)}
    <div class="door">${lead}${chatList()}
      <p class="cannot">It holds a reading shell over a checkout of every watched repo, so it can
        read a file or a diff — but it cannot write one: its GitHub token is read-only, and every
        effect still crosses the daemon. A destructive verb still posts its ✅/❌ card, and that
        card lands on Home.</p>
    </div>`;
}

/* Null is not empty, the second rule of this page. A list curia could not be
   asked for and a box with no conversations on it are opposite facts. */
function chatList() {
  if (conversations === null) return `<div class="later">Reading your conversations…</div>`;
  if (conversations.conversations === null) {
    return `<div class="unread">curia could not read your conversations — ${esc(conversations.error ?? "no reason given")}.</div>
      ${newChatButton()}`;
  }
  const rows = conversations.conversations.map(chatRow).join("");
  if (!rows) {
    /* The state after the cutover, and after the last conversation is deleted.
       Nothing is minted by looking at this screen: a page read must not spend a
       number, and numbers only go up. */
    return `<p>No conversations yet. Press below to open the first one.</p>${newChatButton()}`;
  }
  return `<table class="chats">${rows}</table>${newChatButton()}
    <p class="cannot">A new conversation is the reset — the same thing a new thread is in Discord.
      Open one when the context above reads full. Deleting one spends its number for good.</p>`;
}

function newChatButton() {
  const k = "chat-new";
  return `<p><button class="btn primary" ${anyBusy() ? "disabled" : ""} onclick="doNewConversation()">
    ${busy(k) ? "Opening…" : "New conversation"}</button></p>${said(k)}`;
}

function chatRow(c) {
  const k = "chat-del-" + c.key;
  /* The label is the operator's own first message, read off the transcript by
     the daemon. A conversation with no turn yet has none, and says so rather
     than showing a blank row. */
  const label = c.label
    ? `<b>${esc(c.label)}</b>`
    : `<span class="dim-note">no turn yet</span>`;
  const answer = said(k);
  /* A browser conversation has no thread, so the line ADR-0015 gives a killed
     turn lands here — on the row the operator picks it from. It clears itself:
     the next turn on this conversation ends the drop. */
  const dropped = c.dropped && !c.dropped.replayed
    ? `<span class="killed">⚠️ A restart killed a turn here${
      c.dropped.commands?.length ? `, and it had run ${esc(c.dropped.commands.join(", "))}` : ""
    }. curia did not send your message again${
      /* The commands are the reason when there are any: not said twice. */
      !c.dropped.commands?.length && c.dropped.why ? ` — ${esc(c.dropped.why)}` : ""}.</span>`
    : "";
  return `<tr>
    <td><a href="${esc(chatHref(c.session))}">${label}</a>
      <span class="dim-note mono" style="display:block;margin:2px 0 0">${esc(c.key)} · ${esc(ago(c.last_turn_at))}</span>${dropped}</td>
    <td class="num">${ctxCell(c)}</td>
    <td><button class="btn sm" ${anyBusy() ? "disabled" : ""} onclick="doDeleteConversation('${js(c.key)}')">
      ${busy(k) ? "…" : "delete"}</button></td>
  </tr>${answer ? `<tr><td colspan="3">${answer}</td></tr>` : ""}`;
}

/* Mint, then walk through the door. Opening a conversation you then have to
   find in a list is two acts where the operator asked for one. */
async function doNewConversation() {
  const out = await verb("chat-new", "/api/console/new", {});
  if (out?.session) location.href = chatHref(out.session);
}

async function doDeleteConversation(key) {
  const ask = `Delete ${key}? Its number is spent for good — a later conversation never reuses it. `
    + `curia stops offering the conversation, and its transcript stays on the box.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  await verb("chat-del-" + key, "/api/console/delete", { key });
  loadConversations();
}

function screenSettings(p) {
  if (!settings || !draft) {
    return `${head(p, "Settings")}${saveBanner()}
      <div class="later">Reading curia.yaml and routing.yaml…</div>`;
  }
  const bodies = { routing: setRouting, projects: setProjects, dispatch: setDispatch, maintenance: setMaintenance };
  if (!bodies[UI.set.section]) UI.set.section = "routing";
  const files = `<span class="dim-note mono">${esc(fileName(settings.files.curia))} · ${esc(fileName(settings.files.routing))}</span>`;
  /* #292: the screen reads two layers and writes only the top one. Said here,
     because "I saved and git shows nothing changed" must not be a puzzle the
     operator has to solve on the box. */
  const writes = settings.writes
    ? `<p class="dim-note" style="max-width:620px">A save writes
       <span class="mono">${esc(fileName(settings.writes.curia))}</span> and
       <span class="mono">${esc(fileName(settings.writes.routing))}</span>, beside the files above.
       Git does not track those, so the box's checkout stays clean and a deploy never collides with a
       save. They hold what this box answers differently, and nothing else.</p>`
    : "";
  return `${head(p, "Settings", files)}${saveBanner()}
    <div class="set-subnav">${Object.entries(SET_SECTIONS).map(([k, label]) =>
      `<button class="${UI.set.section === k ? "on" : ""}" onclick="setSection('${k}')">${esc(label)}</button>`).join("")}</div>
    <div style="max-width:620px">${bodies[UI.set.section](p)}</div>
    ${writes}`;
}
const fileName = (p) => String(p ?? "").split("/").pop();

/* ---- the edits ---- */

/* Every edit lands on the draft and nowhere else, so what is on screen and what
   a save would post are the same object. */
function dirty() {
  if (UI.set.phase !== "restarting") UI.set.phase = changeCount() ? "dirty" : "clean";
  UI.set.error = null;
  UI.set.note = null;
  render();
}
function setSection(k) {
  UI.set.section = k;
  if (k === "projects" && repos === null) loadRepos();
  render();
}
function setDefault(i, model) { draft.routing.defaults[i].model = model; dirty(); }
function setModelActive(i, on) { draft.routing.models[i].active = on; dirty(); }
function setDispatchField(key, value) {
  draft.dispatch[key] = typeof value === "boolean" ? value : Number(value);
  dirty();
}
function removeRepo(i) { draft.watch.splice(i, 1); dirty(); }
function addRepo(repo) {
  const name = String(repo ?? "").trim();
  if (!name || draft.watch.some((w) => w.repo === name)) return;
  draft.watch.push({ repo: name, mode: "auto" });
  dirty();
}
function addTypedRepo() {
  const el = document.getElementById("set-repo-typed");
  if (!el) return;
  const name = el.value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(name)) {
    UI.set.phase = "refused";
    UI.set.error = `"${name}" is not an owner/name repo`;
    return render();
  }
  el.value = "";
  addRepo(name);
}

/* ---- the two calls ---- */

async function loadSettings() {
  try {
    const res = await fetch("/api/settings", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    settings = await res.json();
    draft = clone(settings);
    if (UI.set.phase === "unread") UI.set.phase = "clean";
  } catch (e) {
    UI.set.phase = "unread";
    UI.set.error = e.message;
  }
  render();
}

async function loadRepos() {
  repos = null;
  try {
    const res = await fetch("/api/repos", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    repos = await res.json();
  } catch (e) {
    repos = { login: null, repos: null, error: e.message };
  }
  render();
}

/* The browser conversations (#333). Taken on arrival at the Chat screen and
   after a press that changes the list, never on the poll: a row costs the
   daemon a transcript read, and the other five screens have no use for it.

   A failure lands as `conversations: null`, which the screen draws as "curia
   could not be asked" — not as an empty list. */
async function loadConversations() {
  try {
    const res = await fetch("/api/console", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    conversations = await res.json();
  } catch (e) {
    conversations = { conversations: null, error: e.message };
  }
  render();
}

async function doSave() {
  const patch = settingsPatch();
  if (!Object.keys(patch).length) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/settings", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(patch),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    /* The answer carries the re-read file, so the screen shows what landed
       rather than what was typed. */
    settings = body.settings ?? settings;
    draft = clone(settings);
    /* The save carries the apply's own answer (#362). Three outcomes, and the
       page states the one that came back rather than guessing from the write:
       applied, declined by the daemon, or a daemon that could not be asked. */
    const r = body.reload;
    UI.set.error = null;
    if (!body.written?.length) {
      UI.set.phase = "clean";
      UI.set.note = "That was already what the files say.";
    } else {
      UI.set.note = `Wrote ${body.written.join(" and ")}, atomically, with the comments kept.`;
      if (r?.ok) UI.set.phase = "applied";
      else if (r?.reason === "daemon-down") { UI.set.phase = "offline"; UI.set.error = r.error; }
      else { UI.set.phase = "declined"; UI.set.error = r?.error ?? "the daemon gave no reason"; }
    }
  } catch (e) {
    UI.set.phase = "refused";
    UI.set.error = e.message;
  }
  UI.set.busy = false;
  render();
}

async function doRestart() {
  const ask = "Restart the daemon? Running agents keep their tmux sessions — those live in their own container. Anything unsaved here is not written.";
  if (typeof confirm === "function" && !confirm(ask)) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/restart", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: "{}",
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    UI.set.phase = "restarting";
    UI.set.error = null;
  } catch (e) {
    /* The daemon may have taken the order and died before answering. Say
       exactly that, and let the marker at the top of the page be the evidence:
       it reads the daemon, and this reads a socket. */
    UI.set.phase = "refused";
    UI.set.error = `${e.message} — the bar above says whether the daemon is answering`;
  }
  UI.set.busy = false;
  render();
}

/* ---- the shell ------------------------------------------------------------- */

function render() {
  /* No mount point, nothing to draw. The page boots only into `#app`, and its
     test drives the screens directly — an edit there must not go looking for a
     document that is not one. */
  const app = document.getElementById("app");
  if (!app) return;
  const n = needsYou(payload?.overview);
  /* The stale-daemon marker (#362). A daemon running something other than the
     files is visible from every screen, so nobody has to open Settings to find
     out. It reads the same comparison the Maintenance section draws. */
  const stale = runningDiff(payload)?.length ? ` <span class="n" title="the daemon is not running these files">●</span>` : "";
  const field = activeField();
  app.innerHTML = `<div class="shell">
    <nav><span class="brand">curia</span>
      ${NAMES.map((k) => `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">${SCREENS[k][0]}${
        k === "home" && n ? ` <span class="n">${n}</span>` : ""}${k === "settings" ? stale : ""}</button>`).join("")}
    </nav>
    <main>${SCREENS[UI.screen][1](payload)}</main>
  </div>`;
  document.title = (n ? `(${n}) ` : "") + "curia";
  restoreField(field);
  /* The hunks a card just asked for (#355). Started AFTER the page is written,
     so a renderer stays a renderer — and once each, because the marker the
     request left behind is what the next render reads. */
  drainDiffQueue();
}

/* The poll re-renders the whole page every few seconds, and the settings screen
   has fields somebody may be halfway through typing in. The VALUE is never at
   risk — every keystroke lands on the draft — so what has to survive a render
   is the cursor, by id and offset. */
function activeField() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  let caret = null;
  try { caret = el.selectionStart; } catch { caret = null; }
  return { id: el.id, caret };
}
function restoreField(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || typeof el.focus !== "function") return;
  el.focus();
  if (f.caret != null && el.setSelectionRange) {
    try { el.setSelectionRange(f.caret, f.caret); } catch { /* not a text field */ }
  }
}

/* Entering a screen, from a click or from the hash. Settings and Chat are the
   two screens with a read of their own, and each is taken on arrival rather
   than on every poll: the config files change when somebody saves them, and the
   conversations change when somebody opens or deletes one — neither happens
   every five seconds.
   Chat re-reads on EVERY arrival, unlike settings. The list carries a context
   percent and a last-turn time, and both move with every turn taken from any
   device, so a held copy would age. */
function enter(k) {
  UI.screen = k;
  if (k === "settings" && !settings) loadSettings();
  if (k === "chat") loadConversations();
}
function goto(k) { enter(k); location.hash = k; render(); }
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (NAMES.includes(k) && k !== UI.screen) { enter(k); render(); }
});

/* ---- the poll -------------------------------------------------------------
   The operator's call on #263: refresh while this tab is visible, and stop
   when it is not. Every refresh costs the daemon a whole read of the journal
   off disk, so a tab nobody is looking at must cost nothing. The interval is
   the sidecar's to state — it comes back inside the payload — so one config
   key governs both halves and they cannot drift apart. */
let timer = null;

async function tick() {
  try {
    const res = await fetch("/api/overview", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    payload = await res.json();
    reachable = true;
  } catch {
    /* Keep the last payload on screen: a page that blanks itself is worst
       exactly when the box is worst. */
    reachable = false;
  }
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  timer = setTimeout(tick, (payload?.poll_interval_s ?? 5) * 1000);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else clearTimeout(timer);
});

/* The page boots itself only in a browser. Its test loads the same source into
   a vm to call the screens directly, and a boot there would fetch nothing and
   render into no document. */
if (typeof document !== "undefined" && document.getElementById("app")) {
  enter(NAMES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home");
  /* The file read happens at boot even when the operator lands somewhere else
     (#362): the stale-daemon marker on the Settings nav item compares the two,
     and a marker that needed the section opened would be a marker nobody sees.
     `enter` already took the read on the settings screen itself. */
  if (UI.screen !== "settings") loadSettings();
  render();
  tick();
}
</script>
