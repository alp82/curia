      e.commands?.length ? `, it had run ${esc(e.commands.join(", "))}` : ""}${e.why ? ` (${esc(e.why)})` : ""}`],
  map_adopted: ["charting", "", (e) => `${who(e)} adopted map ${esc(e.map)} — ${esc(snip(e.title, 80))}`],
  charting_finished: ["charting", "", (e) => `${who(e)} finished charting ${tkt(e)} — ${esc(e.status)}`],
};

function eventLine(e) {
  const spec = EVENTS[e.type];
  if (spec) return { tag: spec[0], cls: spec[1], html: spec[2](e) };
  const s = subject(e);
  return { tag: String(e.type ?? "event").replace(/_/g, " "), cls: "", html: s || "—" };
}
/* Newest first: the operator reads the top of the page, so the last thing that
   happened must be the first thing there. */
function feedList(events, limit) {
  const rows = [...(events ?? [])].reverse().slice(0, limit ?? undefined);
  if (!rows.length) return `<div class="empty">The journal tail is empty.</div>`;
  return `<ul class="feed-list">${rows.map((e) => {
    const l = eventLine(e);
    return `<li class="${l.cls}"><time>${esc(clock(e.ts))}</time>
      <span class="ev"><span class="tag">${esc(l.tag)}</span> — ${l.html}</span></li>`;
  }).join("")}</ul>`;
}

/* ---- home ------------------------------------------------------------------ */

function tile(v, l, warn) {
  const none = v === "—" || v === 0 ? " none" : "";
  return `<div class="tile${warn && v ? " warn" : ""}"><div class="v num${none}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
}
function statTiles(o) {
  const reset = nextReset(o.usage);
  return `<div class="stat-tiles">
    ${tile(needsYou(o), "needs you", true)}
    ${tile(o.agents == null ? "—" : o.agents.length, "agents live")}
    ${tile(o.review_gate?.length ?? 0, "review gate", true)}
    ${tile(reset ? clock(reset.at) : "—", reset ? `${reset.provider} ${reset.label} rolls` : "next reset")}
  </div>`;
}

/* The all-three home (#248): tiles across the top, the attention list left, the
   fleet right, the provider strip said once under it. */
function screenHome(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Home");
  /* The list header reads `needsYou` like the tile, the badge and the tab title
     do (#677). It is the same number the column beneath it draws — both come
     off `attentionItems` — and saying it in the same word is what stops the
     next surface from growing its own arithmetic. */
  const n = needsYou(o);
  return `${head(p, "Home")}
    ${spentBanner(o)}
    ${holdBanner(o)}
    ${statTiles(o)}
    <div class="split-cols">
      <div>
        <div class="h-sect"><h3><span class="${n ? "hot" : ""}">Needs you</span> (${n})</h3>${attentionList(o)}</div>
        <div class="h-sect"><h3>Last events</h3>${feedList(o.events, 4)}
          <a class="more" href="#feed">all events →</a></div>
      </div>
      <div>
        <div class="h-sect"><h3>Fleet${o.agents == null ? "" : ` (${o.agents.length})`}</h3>${fleetTable(o)}</div>
        ${provStrip(o)}
        ${deployCard(o)}
      </div>
    </div>`;
}

/* The self-deploy card (#562). The outcome used to live in one Discord line and
   a log only ssh could read; this keeps the LAST verdict on the page — with the
   sibling's own log excerpt when it failed — and the in-flight state while one
   runs. Nothing here is a verb: `deploy` stays typed-only (#270). */
function deployCard(o) {
  const d = o.deploy;
  if (!d || (!d.in_flight && !d.last && !d.verdict_read_error)) return "";
  const sh = (s) => String(s ?? "").slice(0, 7);
  if (d.in_flight) {
    return `<div class="h-sect"><h3>Deploy</h3>
      <div class="unread">a deploy is in flight: ${esc(sh(d.in_flight.prev))} → ${esc(sh(d.in_flight.next))} — state ${esc(d.in_flight.state)}. The daemon restarts if it lands; this page keeps its last snapshot through that.</div></div>`;
  }
  if (d.verdict_read_error) {
    return `<div class="h-sect"><h3>Last deploy</h3>
      <div class="unread">${esc(d.verdict_read_error)}</div></div>`;
  }
  const l = d.last;
  const word = { landed: "landed", "rolled-back": "ROLLED BACK", "merge-refused": "refused", lockout: "LOCKOUT" }[l.state] ?? l.state;
  const line = `${esc(word)}: ${esc(sh(l.prev))} → ${esc(sh(l.next))}${l.reason ? ` — ${esc(l.reason)}` : ""}${l.resolved_at ? ` · ${esc(ago(l.resolved_at))}` : ""}${l.by ? ` · ordered by ${esc(l.by)}` : ""}`;
  const ok = l.state === "landed";
  return `<div class="h-sect"><h3>Last deploy</h3>
    <div class="${ok ? "dim-note" : "unread"}">${line}</div>
    ${!ok && l.log ? `<div class="said">${esc(l.log)}</div>` : ""}</div>`;
}

/* ---- agents ---------------------------------------------------------------- */

function screenAgents(p) {
  const o = p?.overview;
  const chat = `<button class="btn sm" onclick="goto('chat')">Chat</button>`;
  if (!o) return noSnapshot(p, "Agents", chat);
  const d = o.daemon ?? {};
  const live = o.agents == null ? "—" : o.agents.length;
  const bar = `<div class="statusbar">
    <span>agents ${esc(live)}/${esc(d.max_concurrent ?? "?")}</span>
    <span>auto dispatch ${d.auto_dispatch ? "on" : "off"}</span>
    <span>bridge ${esc(o.bridge)}</span>
    <span>daemon :${esc(d.port)} up ${esc(dur(d.uptime_s))}</span>
  </div>`;
  return `${head(p, "Agents", chat)}${bar}${agentsTable(o)}${untrackedLine(o)}${recentLine(o)}`;
}

function agentsTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. This is an unreadable tmux, not an idle box.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents wide">
    <tr><th>session</th><th>state</th><th>ticket</th><th>model</th><th>ctx</th><th>contact</th><th>up</th><th>waiting on</th><th>do</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}${a.reviewer ? ` <span class="dim-note">reviewer</span>` : ""}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span>${a.tmux_live ? "" : `<div class="dim-note">no tmux session</div>`}</td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="mono">${esc(a.model ?? "—")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${contactCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td>
      <td>${waitingCell(a)}</td>
      <td>${agentVerbs(a)}</td></tr>
    ${agentBoxes(a)}`).join("")}
  </table></div><div class="dim-note">${esc(CONTACT_NOTE)}</div>`;
}

/* The three per-agent verbs (#266). They sit in the row that already names the
   agent, and the boxes they open sit under it — so the words the operator types
   are beside the agent they are for.

   An answer is NOT here. The Needs-you list on Home is the one answer surface,
   and the `waiting on` cell beside this says where to go. */
function agentVerbs(a) {
  const key = "agent:" + a.session;
  const b = (label, call, cls) => `<button class="${cls ?? ""}" ${anyBusy() ? "disabled" : ""} onclick="${call}">${label}</button>`;
  const s = `'${js(a.session)}'`;
  return `<div class="links">
    ${b("note", `noteBox(${s})`)}
    ${b("diff", `openDiff(${s})`)}
    ${b("teleport", `teleport(${s},'${js(a.ticket ?? "")}')`)}
    ${b("cancel", `cancelAgent(${s},'${js(a.repo ?? "")}','${js(a.ticket ?? "")}')`, "bad")}
  </div>${busy(key) ? `<div class="dim-note">working…</div>` : ""}`;
}

/* One full-width row under the agent, carrying whatever it has open: the note
   box, the teleport lines, and what curia said about the last press. */
function agentBoxes(a) {
  const key = "agent:" + a.session;
  const parts = [
    UI.act.note === a.session ? noteBoxHtml(a) : "",
    UI.act.diff === a.session ? diffBoxHtml(a) : "",
    UI.act.tele === a.session ? teleportHtml(a) : "",
    said(key),
  ].filter(Boolean);
  if (!parts.length) return "";
  return `<tr><td colspan="9">${parts.join("")}</td></tr>`;
}

/* The two delivery modes, in ADR-0013's own words. Queued is the default and
   costs the agent nothing until its next tool result. Interrupt aborts the call
   in flight after a grace, which is why it is the one the operator has to
   choose. */
function noteBoxHtml(a) {
  const id = "note-" + a.session;
  const radio = (mode, label) => `<label><input type="radio" name="nm-${esc(a.session)}"
    ${UI.act.mode === mode ? "checked" : ""} onchange="noteMode('${mode}')"> ${esc(label)}</label>`;
  return `<div class="act-box">
    <div class="act-row"><input type="text" id="${esc(id)}" placeholder="say something to ${esc(a.session)}…"></div>
    <div class="act-row">
      ${radio("queue", "queue — it reads this with its next tool result")}
      ${radio("interrupt", "interrupt — a short grace, then the words land as a user turn")}
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="sendNote('${js(a.session)}','${js(id)}')">Send</button>
    </div>
  </div>`;
}

/* The digest before the gate (#355). The same card the gate carries, on a live
   row, reading the same worktree — committed and uncommitted work together,
   because that is what the work so far means. You see the shape of the change
   while a note can still steer it. */
function diffBoxHtml(a) {
  const key = "agent:" + a.session;
  const q = agentDiffQuery(a.session);
  const d = diffState(key);
  if (!d.read) return `<div class="act-box"><div class="say">counting the work so far…</div></div>`;
  return `<div class="act-box">
    <div class="act-row"><button class="btn sm" ${d.loading ? "disabled" : ""} onclick="rereadDiff('${js(key)}','${js(q)}')">re-read</button>
      <span class="dim">a snapshot of the worktree, taken when you pressed</span></div>
    ${diffCard(key, d.digest, d.error, q, null)}</div>`;
}

function teleportHtml(a) {
  return `<div class="act-box">
    <div class="dim-note">On the box itself, in a terminal:</div>
    <input class="copy" type="text" readonly value="${esc(attachCmd(a.session))}" onclick="this.select()">
  </div>`;
}
function waitingCell(a) {
  const open = a.waiting_on ?? [];
  if (!open.length) return `<span class="dim-note">${a.result_received ? "its result is in" : "nothing"}</span>`;
  return open.map((w) => `<span class="mono">${esc(w.kind)}</span>`).join(" · ");
}
/* A tmux session curia does not track. It is an anomaly reconcile owns, so the
   page states it and spends no color on it. */
function untrackedLine(o) {
  if (!o.untracked?.length) return "";
  return `<p class="dim-note">Untracked sessions: <span class="mono">${o.untracked.map((s) => esc(s)).join(", ")}</span>. Reconcile adopts or sweeps these.</p>`;
}
function recentLine(o) {
  if (!o.recent?.length) return "";
  return `<p class="dim-note">Recently: ${o.recent.map((r) => `${esc(r.kind)} ${esc(ticketName(r.repo, r.ticket))}`).join(" · ")}</p>`;
}

/* ---- frontier -------------------------------------------------------------- */

/* The ticket type is the `wayfinder:` label and nothing else — a ticket with no
   such label has no type, and saying so beats guessing one from another label. */
function typeOf(item) {
  const l = (item.labels ?? []).find((x) => String(x).startsWith("wayfinder:"));
  return l ? String(l).slice("wayfinder:".length) : "untyped";
}
const shortRepo = (r) => String(r).split("/").pop();

/* The filter runs over the snapshot, never over the wire: the frontier is
   reconcile's reading and the page must not re-ask for a narrower one. */
function frFiltered(snap) {
  const f = UI.fr;
  return (snap?.repos ?? [])
    .filter((r) => f.repo === "all" || r.repo === f.repo)
    .map((r) => (r.error ? r : { ...r, items: (r.items ?? []).filter((i) => f.type === "all" || typeOf(i) === f.type) }));
}
function frTypes(snap) {
  const all = new Set();
  for (const r of snap?.repos ?? []) for (const i of r.items ?? []) all.add(typeOf(i));
  return [...all].sort();
}

/* Start (#266). The dispatch order — claim, prepare, spawn — is `start`'s own,
   and the reply that comes back is curia's sentence about what it did.

   Two facts ride beside the button. The ROUTED MODEL is the daemon's
   `resolveModel` answer, joined onto the item by reconcile, so the operator
   knows which account this press spends before spending it. And an agent
   ALREADY on this ticket replaces the button, because a second start on it is
   refused anyway and a button that only ever refuses is a worse way to say so.

   When the fleet could not be read, neither is claimed: the button stands, and
   the line under it says curia cannot tell. Null is not empty here either. */
function agentOn(o, repo, number) {
  if (o?.agents == null) return undefined;
  return o.agents.find((a) => String(a.ticket) === String(number) && (!a.repo || a.repo === repo)) ?? null;
}
function startRow(o, repo, n) {
  const live = agentOn(o, repo, n.number);
  const key = `start:${repo}#${n.number}`;
  if (live) return `<div class="act-row"><span class="dim-note mono">⧗ dispatched — ${esc(live.session)}</span></div>`;
  const model = n.model
    ? `<span class="dim-note mono">→ ${esc(n.model)} (${esc(typeOf(n))} default)</span>`
    : `<span class="dim-note">the routed model is not on this reading</span>`;
  return `<div class="act-row">
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="startTicket('${js(repo)}','${js(n.number)}')">${
        busy(key) ? "Starting…" : "Start"}</button>${model}
    </div>
    ${live === undefined ? `<div class="dim-note">the fleet could not be read, so curia cannot say whether this one is already running</div>` : ""}
    ${said(key)}`;
}

function frCards(repos, o) {
  const bigs = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).map((i) => ({ ...i, repo: r.repo })));
  const kids = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).flatMap((i) => (i.unblocks ?? []).map((k) => ({ ...k, repo: r.repo, from: i.number }))));
  return `${repos.filter((r) => r.error).map(frError).join("")}
    <div class="frx-sect"><span class="eyebrow">takeable now (${bigs.length})</span>
      ${bigs.length ? `<div class="frx-big">${bigs.map((n) => `<div class="frx-card">
        <div class="head"><span class="t">#${esc(n.number)}</span><span class="typ">${esc(typeOf(n))}</span></div>
        <div class="title">${esc(n.title)}</div>
        <div class="foot"><span>${esc(n.repo)}</span><span>${n.unblocks?.length ? `unblocks ${n.unblocks.length}` : "unblocks nothing yet"}</span></div>
        ${n.mapTitle ? `<div class="dim-note">${esc(n.mapTitle)}</div>` : ""}
        ${startRow(o, n.repo, n)}
      </div>`).join("")}</div>` : `<div class="empty">Nothing is takeable under this filter.</div>`}
    </div>
    <div class="frx-sect"><span class="eyebrow">unblocked next (${kids.length})</span>
      ${kids.length ? `<div class="frx-dim">${kids.map((k) => `<div class="frx-dimcard"><span class="t">#${esc(k.number)}</span>${esc(k.title)}
        <span class="from">↖ #${esc(k.from)} · ${esc(k.repo)}</span></div>`).join("")}</div>`
        : `<div class="empty">These tickets unblock nothing that is not already takeable.</div>`}
    </div>`;
}
function frTree(repos, o) {
  return repos.map((r) => {
    if (r.error) return frError(r);
    if (!r.items?.length) return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      <div class="empty">Nothing is takeable under this filter.</div></div>`;
    return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      ${r.items.map((n) => `<div class="fr-group">
        <div class="fr-node"><span class="typ">${esc(typeOf(n))}</span><span class="t">#${esc(n.number)}</span>${esc(n.title)}
          ${startRow(o, r.repo, n)}</div>
        ${n.unblocks?.length ? `<div class="fr-kids">${n.unblocks.map((k) => `<div class="fr-kid"><span class="t">#${esc(k.number)}</span>${esc(k.title)}</div>`).join("")}</div>` : ""}
      </div>`).join("")}</div>`;
  }).join("");
}
function frError(r) {
  return `<div class="unread"><span class="mono">${esc(r.repo)}</span> could not be read — ${esc(r.error)}. This is not an empty frontier: there may be takeable tickets there.</div>`;
}

const FR_VIEWS = { cards: ["Cards", frCards], tree: ["Tree", frTree] };

function screenFrontier(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Maps");
  const snap = o.frontier;
  const right = `<span class="seg">${Object.entries(FR_VIEWS).map(([k, v]) =>
    `<button class="${UI.fr.view === k ? "on" : ""}" onclick="frSet('view','${k}')">${esc(v[0])}</button>`).join("")}</span>`;
  if (!snap || !snap.computed_at) {
    return `${head(p, "Maps · two levels", right)}
      <div class="later">No frontier has been computed yet. Reconcile computes it on the credentials that pass already holds, and stamps the instant it did.</div>`;
  }
  const types = frTypes(snap);
  const filter = `<div class="frx-filter">
    <button class="fchip ${UI.fr.repo === "all" ? "on" : ""}" onclick="frSet('repo','all')">all projects</button>
    ${(snap.repos ?? []).map((r) => `<button class="fchip ${UI.fr.repo === r.repo ? "on" : ""}" onclick="frSet('repo','${esc(r.repo)}')">${esc(shortRepo(r.repo))}</button>`).join("")}
    <span class="sep">·</span>
    <select onchange="frSet('type',this.value)">
      <option value="all"${UI.fr.type === "all" ? " selected" : ""}>all types</option>
      ${types.map((t) => `<option${UI.fr.type === t ? " selected" : ""}>${esc(t)}</option>`).join("")}
    </select>
    <span class="dim-note">computed ${esc(ago(snap.computed_at))}</span>
  </div>`;
  return `${head(p, "Maps · two levels", right)}${filter}${FR_VIEWS[UI.fr.view][1](frFiltered(snap), o)}`;
}
function frSet(key, value) {
  UI.fr[key] = value;
  /* A repo that leaves the filter takes its types with it — an unreachable
     type filter would show an empty page and name no reason. */
  if (key === "repo") UI.fr.type = "all";
  render();
}

/* ---- feed ------------------------------------------------------------------ */

function screenFeed(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Feed");
  const n = o.events?.length ?? 0;
  return `${head(p, "Feed", `<span class="dim-note">the journal's last ${esc(n)} event(s)</span>`)}
    <div style="max-width:720px">${feedList(o.events)}</div>`;
}

/* ---- the drill-in section frame (#699) --------------------------------------

   Settings is the first Atlas page built as a LIST OF SECTIONS, and it is not
   meant to be the last. So the frame lives here, above Settings, and Settings
   is one registration in it.

   A page registers an ordered array of sections under its screen name in
   `DRILL_PAGES`, next to where that array is written. A section is:

     key       the name the drill state and the tests use. Unique per page.
     title     the row's word, and the heading of the open section.
     gist(p)   one short line under the title on the list, already escaped, or
               "" for a section that has nothing worth saying at a glance.
     body(p)   the open section itself.
     hint      optional. The words behind the `?` beside the heading.
     enter()   optional. Runs when the operator opens the section — this is
               where a section takes a read of its own, so the page does not
               fetch for sections nobody opened.

   A page that also WRITES adds three more, and Settings is the one that does:
   `patch(out)` folds this section's unsaved edits into the save patch,
   `count(patch)` says how many changes that is in the operator's own units,
   and `restarts(patch)` names the key paths in it that a save cannot apply
   live — the dock says those before the operator presses Save.

   The state is one open key per page plus `list`, which is the phone's half of
   it. Both halves are always RENDERED — one list, one open body — and the CSS
   decides which a given width shows, so nothing here measures a viewport. */
var DRILL_PAGES = {};
const drillState = (page) => (UI.drill[page] ??= { open: null, list: true });
const drillSections = (page) => DRILL_PAGES[page] ?? [];

/* The open section, defaulted. A desktop shows a section beside the list at
   all times, so "nothing open" is a phone state only, and the first section
   sits under it. */
function drillOpen(page) {
  const sections = drillSections(page);
  const d = drillState(page);
  if (!sections.some((x) => x.key === d.open)) d.open = sections[0]?.key ?? null;
  return sections.find((x) => x.key === d.open) ?? null;
}

/* One section at a time. `enter` runs on the arrival, not on the render, so a
   read a section takes costs one call rather than one per poll. */
function openSection(page, key) {
  const section = drillSections(page).find((x) => x.key === key);
  const d = drillState(page);
  if (section) d.open = section.key;
  d.list = false;
  if (section?.enter) section.enter();
  render();
}
function backToList(page) {
  drillState(page).list = true;
  render();
}

/* The `?` and the words behind it. The id is the row's, so two sections may
   carry the same explanation without sharing one open state. */
function toggleHint(id) {
  UI.hints[id] = !UI.hints[id];
  render();
}
const qq = (id) => `<button class="qq${UI.hints[id] ? " on" : ""}" aria-expanded="${
  UI.hints[id] ? "true" : "false"}" title="explain" onclick="toggleHint('${esc(id)}')">?</button>`;
const qhint = (id, words) => (UI.hints[id] ? `<div class="qhint">${words}</div>` : "");

function drillIn(page, p) {
  const sections = drillSections(page);
  const open = drillOpen(page);
  const d = drillState(page);
  const rows = sections.map((x) => {
    const gist = x.gist ? x.gist(p) : "";
    return `<button class="drill-row${open?.key === x.key ? " on" : ""}" onclick="openSection('${esc(page)}', '${esc(x.key)}')">
      <span><span class="t">${esc(x.title)}</span>${gist ? `<span class="g">${gist}</span>` : ""}</span>
      <span class="chev" aria-hidden="true">\u203a</span></button>`;
  }).join("");
  const heading = open
    ? `<div class="drill-head"><h3>${esc(open.title)}</h3>${open.hint ? qq(page + "-" + open.key) : ""}</div>
       ${open.hint ? qhint(page + "-" + open.key, open.hint) : ""}`
    : "";
  return `<div class="drill"${d.list ? "" : ` data-open="${esc(open?.key ?? "")}"`}>
    <div class="drill-list">${rows}</div>
    <div class="drill-body">
      <a class="drill-back" href="#${esc(page)}" onclick="backToList('${esc(page)}');return false">\u2039 ${esc(SCREENS[page][0].toLowerCase())}</a>
      ${heading}${open ? open.body(p) : ""}
    </div>
  </div>`;
}

/* ---- settings (#265) -------------------------------------------------------

   The one screen that writes. Three facts shape all of it.

   1. IT DRAWS ITS OWN READ. `GET /api/settings` is a fresh parse of
      curia.yaml and routing.yaml off disk, never the poll snapshot: both files
      are hand-edited on the box too, and a screen that offered to save over an
      edit it had not seen would lose it.
   2. IT POSTS ONLY WHAT CHANGED. The patch is the difference between `draft`
      and `settings`, so a field nobody touched is not written — which is what
      keeps a hand edit made while this tab was open from being clobbered by a
      save of something else.
   3. A SAVE APPLIES (#362). The sidecar asks the daemon to reload after a
      write that landed, and the answer rides back with the save. So the banner
      states an outcome — applied, declined, or the daemon is not answering —
      instead of handing the operator a second button to press. What "applied"
      means is measured: the daemon reports the settings it is RUNNING, and
      this screen compares them against the file it read. */

/* The four sections, in the order the list draws them. Each one is a whole
   setting in the operator's vocabulary: what a section shows, what it writes,
   and what a save of it costs. A later row lands as a field inside one of
   these or as a fifth entry here — the pane and message rows (#716), the
   GitHub App rows (#705), the aistack rows (#706) — and nothing outside this
   array has to be told about it. */
const SET_SECTIONS = [
  {
    key: "routing", title: "Routing", gist: gistRouting, body: setRouting,
    hint: "The model each ticket type gets when no label on the ticket says otherwise, and how deep it thinks on it. A model: label moves the model and leaves the depth alone.",
    patch: patchRouting, count: countRouting,
  },
  {
    key: "projects", title: "Projects", gist: gistProjects, body: setProjects,
    hint: "The repos curia watches. It dispatches against these and no others.",
    patch: patchWatch, count: countWatch,
    /* The repo list costs the daemon a GitHub call, so it is taken when this
       section is opened and not before. */
    enter: () => { if (repos === null) loadRepos(); },
  },
  {
    key: "dispatch", title: "Dispatch", gist: gistDispatch, body: setDispatch,
    hint: "Whether curia starts work, how many agents run, how often it checks, and how many prototype variations it offers.",
    patch: patchDispatch, count: countDispatch,
  },
  {
    key: "maintenance", title: "Maintenance", gist: gistMaintenance, body: setMaintenance,
    hint: "Whether the daemon runs what the files say, and the restart for the keys a save cannot apply.",
  },
];
DRILL_PAGES.settings = SET_SECTIONS;

const DISPATCH_FIELDS = [
  ["max_concurrent", "How many agents may run at once. Each one costs a container, and three sandbox ports."],
  ["poll_interval_s", "How often curia reads the frontier of every watched repo."],
  ["prototype_variations", "How many variations each prototype round offers by default."],
];

const clone = (x) => JSON.parse(JSON.stringify(x));

/* What the operator has changed and not yet saved. The dock counts these and
   the save posts them; both read this one function, so the count can never
   disagree with what lands on disk.

   Each section folds in its OWN keys. A section that adds a row adds it here
   and nowhere else, and a section that writes nothing — Maintenance — declares
   no `patch` and contributes none. */
function settingsPatch() {
  if (!settings || !draft) return {};
  const out = {};
  for (const section of SET_SECTIONS) if (section.patch) section.patch(out);
  return out;
}

function patchDispatch(out) {
  const d = {};
  for (const k of Object.keys(draft.dispatch)) {
    if (draft.dispatch[k] !== settings.dispatch[k]) d[k] = draft.dispatch[k];
  }
  if (Object.keys(d).length) out.dispatch = d;
}
function patchWatch(out) {
  if (JSON.stringify(draft.watch) !== JSON.stringify(settings.watch)) out.watch = draft.watch;
}
function patchRouting(out) {
  const defaults = {};
  draft.routing.defaults.forEach((row, i) => {
    if (row.model !== settings.routing.defaults[i]?.model) defaults[row.type] = row.model;
  });
  const effort = {};
  (draft.routing.effort ?? []).forEach((row, i) => {
    if (row.effort !== settings.routing.effort?.[i]?.effort) effort[row.type] = row.effort;
  });
  const models = {};
  draft.routing.models.forEach((m, i) => {
    if (m.active !== settings.routing.models[i]?.active) models[m.name] = { active: m.active };
  });
  if (Object.keys(defaults).length || Object.keys(effort).length || Object.keys(models).length) {
    out.routing = {};
    if (Object.keys(defaults).length) out.routing.defaults = defaults;
    if (Object.keys(effort).length) out.routing.effort = effort;
    if (Object.keys(models).length) out.routing.models = models;
  }
}

/* The count the dock says, in the operator's units rather than in yaml keys:
   the watch list replaces whole (config.mjs states that rule), so it is one
   change however many repos moved inside it. */
function countDispatch(p) { return Object.keys(p.dispatch ?? {}).length; }
function countWatch(p) { return p.watch ? 1 : 0; }
function countRouting(p) {
  return Object.keys(p.routing?.defaults ?? {}).length + Object.keys(p.routing?.effort ?? {}).length
    + Object.keys(p.routing?.models ?? {}).length;
}

function changeCount() {
  const p = settingsPatch();
  let n = 0;
  for (const section of SET_SECTIONS) n += section.count ? section.count(p) : 0;
  return n;
}

/* What this save cannot apply without a restart, named BEFORE the operator
   presses Save. Every row the screen writes today is inside the reload's
   closed set (settings.mjs LIVE_PATHS), so this is empty — and it is a seam
   rather than an absence because the rows landing next are not all live, and
   an operator must never learn about a restart from the outcome.

   A hand edit that rode along outside the live set is a different fact: this
   screen cannot see it, and the daemon's own refusal is what names it, in the
   dock's declined state below. */
function restartNeeds() {
  const p = settingsPatch();
  const out = [];
  for (const section of SET_SECTIONS) for (const key of (section.restarts ? section.restarts(p) : [])) out.push(key);
  return out;
}

/* ---- what the daemon is running (#362) --------------------------------------

   Applied is a fact curia measured, not a claim the save made. `GET /overview`
   carries the settings the daemon RUNS and the instant it read them; this
   compares them, key by key, against the file this screen read.

   Null means curia cannot tell — no snapshot, no file read, or a daemon that is
   not answering, whose last reading says what WAS true and not what is. Null is
   never drawn as agreement: "unknown" and "in step" are opposite facts. */
const sameJSON = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

function runningDiff(p) {
  const run = p?.overview?.daemon?.config;
  if (!run || !settings || !p.daemon_up) return null;
  const out = [];
  for (const k of Object.keys(settings.dispatch)) {
    if (!sameJSON(settings.dispatch[k], run.dispatch?.[k])) out.push("dispatch." + k);
  }
  if (!sameJSON(settings.watch, run.watch)) out.push("watch");
  const rows = (list) => new Map((list ?? []).map((r) => [r.type, r.model]));
  const [fileRows, runRows] = [rows(settings.routing.defaults), rows(run.routing?.defaults)];
  for (const type of new Set([...fileRows.keys(), ...runRows.keys()])) {
    if (!sameJSON(fileRows.get(type), runRows.get(type))) out.push("routing.defaults." + type);
  }
  const switches = (list) => new Map((list ?? []).map((m) => [m.name, m.active !== false]));
  const [fileSw, runSw] = [switches(settings.routing.models), switches(run.routing?.models)];
  for (const name of new Set([...fileSw.keys(), ...runSw.keys()])) {
    if (!sameJSON(fileSw.get(name), runSw.get(name))) out.push("routing.models." + name + ".active");
  }
  return out;
}

/* ---- the save dock: one act, at the bottom (#525's decision, #699) ---------

   A clean screen carries no save chrome at all. The dock rises on the first
   edit with the count, the Save and a discard, and it names the restart the
   pending edits will need. After the press it stays in the same place and
   states the outcome the daemon reported — applied, declined, offline — or the
   refusal, which moved nothing on disk. A button appears only where it IS the
   mitigation, so the one the dock offers is always the one to press. */

function saveDock() {
  const n = changeCount();
  const s = UI.set;
  const dock = (cls, body) => `<div class="dock${cls ? " " + cls : ""}">${body}</div>`;
  const save = `<button class="btn primary" ${s.busy ? "disabled" : ""} onclick="doSave()">Save</button>`;
  const discard = `<a href="#settings" onclick="discardEdits();return false">discard</a>`;
  const restart = `<button class="btn restart-hot" ${s.busy ? "disabled" : ""} onclick="doRestart()">Restart to apply</button>`;

  /* The file could not be read, which is the one state with no draft behind
     it. It stands whatever else is true. */
  if (s.phase === "unread") {
    return dock("refused", `<span class="toast bad">The settings could not be read.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  if (s.busy) return dock("", `<button class="btn" disabled>Saving\u2026</button>`);
  if (s.phase === "restarting") {
    return dock("", `<span class="toast">The daemon exited nonzero and the supervisor respawns it.
      This page serves its last snapshot meanwhile.</span>`);
  }
  if (s.phase === "refused") {
    /* The loaders refused the candidate, so nothing on disk moved. The draft
       stays on screen: the operator fixes the value they typed, they do not
       type it again. */
    return dock("refused", `<span class="toast bad">Refused \u2014 nothing was written.</span>
      ${n ? save : ""}<span class="why">${esc(s.error)}</span>`);
  }
  if (n > 0) {
    const needs = restartNeeds();
    return dock("", `<span class="toast"><b class="num">${n}</b> unsaved change${n === 1 ? "" : "s"}</span>
      ${save}${discard}
      <span class="why">${needs.length
        ? `a restart applies ${needs.map(esc).join(", ")} \u2014 every other change lands at once`
        : "every change here lands at once, with no restart"}</span>`);
  }
  if (s.phase === "applied") {
    return dock("saved", `<span class="ok-word">saved \u2713</span>
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon is running it.</span>`);
  }
  if (s.phase === "declined") {
    /* The file moved a key a reload cannot apply, so the daemon kept the config
       it booted with. The restart is the mitigation, and it is the loud one. */
    return dock("saved", `<span class="ok-word">saved \u2713</span>${restart}
      <span class="toast">The daemon did not apply it.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  if (s.phase === "offline") {
    /* No button: a restart is not the mitigation for a daemon that is already
       not answering, and pressing one would be an order nobody takes. */
    return dock("saved", `<span class="ok-word">saved \u2713</span>
      <span class="toast">The daemon is not answering, so it takes this file at its next boot.
        If it refuses to boot, the daemon log names the key.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  /* A save that found the files already saying it. Worth one sentence, and
     nothing to press. */
  if (s.note) return dock("", `<span class="toast">${esc(s.note)}</span>`);
  /* Clean, and nothing has been pressed. No dock at all. */
  return "";
}

/* ---- the four sections ------------------------------------------------------

   Each one is a body and a gist. The gist is what the list row says at a
   glance, so an operator picks the section they want without opening three. */

const activeModels = () => draft.routing.models.filter((m) => m.active);

function gistRouting() {
  const untyped = draft.routing.defaults.find((r) => r.type === "untyped");
  const models = draft.routing.models;
  return esc(`${untyped ? untyped.model + " untyped \u00b7 " : ""}${activeModels().length} of ${models.length} models on`);
}

/* Routing. The ticket-type rows lead and the model list sits behind one click,
   because the row an operator changes is the default, and the model list is
   the thing they set once. */
function setRouting() {
  const models = draft.routing.models;
  const active = activeModels();
  const rows = draft.routing.defaults.map((row, i) => {
    const known = active.some((m) => m.name === row.model);
    return `<div class="row"><span class="key grow">${esc(row.type)}</span>
      <select onchange="setDefault(${i}, this.value)">
        ${active.map((m) => `<option ${m.name === row.model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        ${known ? "" : `<option selected>${esc(row.model)}</option>`}
      </select>${effortPick(row.type)}${known ? "" : `<span class="dim-note">switched off \u2014 the daemon refuses this config</span>`}</div>`;
  }).join("");
  const mgr = `<div class="row"><span class="grow"><a href="#settings"
      onclick="UI.set.models=!UI.set.models;render();return false">${
      active.length} of ${models.length} models active \u00b7 ${UI.set.models ? "close" : "manage"}</a></span>
    ${qq("set-models")}</div>
    ${qhint("set-models", `A model switched off keeps its whole entry in <span class="mono">routing.yaml</span>. It leaves the
      dispatch vocabulary: no default may name it, a fallback chain steps over it, and a <code>model:</code> label on it is refused.`)}`;
  const table = UI.set.models
    ? `<div class="rows model-mgr">${models.map((m, i) => `<div class="row${m.active ? "" : " inactive"}">
        <input type="checkbox" id="set-model-${esc(m.name)}" ${m.active ? "checked" : ""} onchange="setModelActive(${i}, this.checked)">
        <span class="key grow">${esc(m.name)}${m.id ? ` <span class="dim-note">${esc(m.id)}</span>` : ""}</span>
        <span class="key dim-note">runs on ${esc(m.provider ?? "?")} \u00b7 ${esc(m.harness ?? "?")}</span></div>`).join("")}</div>`
    : "";
  return `<div class="rows">${rows}${mgr}</div>${table}`;
}

/* The depth beside the model (#707). One ticket type is one decision made of
   two halves — which model, and how hard it thinks — so they sit on one row
   rather than in two lists an operator would have to read together.

   A type with no `effort` row in routing.yaml gets no picker: the screen edits
   the rows that are there and adds none, which is the same rule the model
   column and the daemon's own refusal already keep. */
function effortRow(type) {
  return (draft.routing.effort ?? []).findIndex((r) => r.type === type);
}
function effortPick(type) {
  const i = effortRow(type);
  if (i < 0) return "";
  const row = draft.routing.effort[i];
  const words = settings.routing.efforts ?? [];
  const known = words.includes(row.effort);
  return `<select title="reasoning effort" onchange="setEffort(${i}, this.value)">
    ${words.map((e) => `<option ${e === row.effort ? "selected" : ""}>${esc(e)}</option>`).join("")}
    ${known ? "" : `<option selected>${esc(row.effort)}</option>`}</select>`;
}

function gistProjects() { return esc(`${draft.watch.length} repo${draft.watch.length === 1 ? "" : "s"} watched`); }

/* Projects. The repo list comes from the daemon, which holds the GitHub login;
   this page holds no credential at all. */
function setProjects() {
  const watched = draft.watch.map((w) => w.repo);
  const rows = draft.watch.map((w, i) => `<div class="row"><span class="key grow">${esc(w.repo)}</span>
    <span class="dim-note">${esc(w.mode)}</span>
    <button class="btn sm" ${draft.watch.length < 2 ? "disabled" : ""} onclick="removeRepo(${i})">remove</button></div>`).join("");
  let connect;
  if (repos === null) connect = `<div class="gh-connect"><span class="dot off"></span>reading the GitHub login\u2026</div>`;
  else if (repos.error) {
    /* Null is not empty: curia could not ask, which is a different fact from
       an account with no repos. The typed field below still works. */
    connect = `<div class="unread">curia could not read your repos from GitHub \u2014 ${esc(repos.error)}. Type a repo below instead.</div>`;
  } else {
    connect = `<div class="gh-connect"><span class="dot"></span>GitHub connected as
      <b class="mono">${esc(repos.login ?? "?")}</b>
      <span class="dim-note">the ${esc(repos.repos?.length ?? 0)} most recently pushed repos it can reach</span></div>`;
  }
  const choices = (repos?.repos ?? []).filter((r) => !watched.includes(r));
  const picker = choices.length
    ? `<select id="set-repo-pick" onchange="addRepo(this.value); this.value=''">
        <option value="">add a repo\u2026</option>${choices.map((r) => `<option>${esc(r)}</option>`).join("")}</select>`
    : "";
  return `${connect}<div class="rows">${rows}
    <div class="row"><span class="grow">${picker}
      <input type="text" id="set-repo-typed" placeholder="owner/name" size="20">
      <button class="btn sm" onclick="addTypedRepo()">add</button></span>${qq("set-watch")}</div>
    ${qhint("set-watch", "The last repo cannot be removed: curia dispatches only against watched repos.")}</div>`;
}

function gistDispatch() {
  const d = draft.dispatch;
  return esc(`${d.auto_dispatch ? "auto" : "manual"} \u00b7 ${d.max_concurrent} agents \u00b7 ${d.poll_interval_s}s`);
}

function setDispatch() {
  const rows = DISPATCH_FIELDS.map(([key, why]) => `<div class="row">
    <label class="key grow" for="set-${esc(key)}">${esc(key)}</label>
    <input type="number" id="set-${esc(key)}" min="1" value="${esc(draft.dispatch[key] ?? "")}"
      oninput="setDispatchField('${esc(key)}', this.value)">${qq("set-" + key)}</div>
    ${qhint("set-" + key, esc(why))}`).join("");
  return `<div class="rows">
    <div class="row"><label class="key grow" for="set-auto">auto_dispatch</label>
      <input type="checkbox" id="set-auto" ${draft.dispatch.auto_dispatch ? "checked" : ""}
        onchange="setDispatchField('auto_dispatch', this.checked)">${qq("set-auto")}</div>
    ${qhint("set-auto", "On, curia starts the next takeable ticket by itself. Off, every dispatch is one the operator ordered.")}
    ${rows}</div>
    <p class="qhint" style="padding-top:10px">A save applies at once. It cancels no running agent:
      auto_dispatch off leaves every live agent running, and a max_concurrent below the live count
      starts nothing new until the count falls. A model change reaches the next dispatch, never a
      running one.</p>`;
}

/* Maintenance (#362). Last of the four, because it is the section an operator
   reads rather than edits. It says one thing — whether the daemon runs the
   file — and carries the one act that answers a no. */
function gistMaintenance(p) {
  const differs = runningDiff(p);
  if (differs === null) return `<span class="dim-note">curia cannot tell</span>`;
  if (differs.length) return `<span style="color:var(--warn)">${esc(differs.length)} key${differs.length === 1 ? "" : "s"} not running</span>`;
  return `<span style="color:var(--ok)">in step</span>`;
}

function setMaintenance(p) {
  const differs = runningDiff(p);
  const run = p?.overview?.daemon?.config;
  let state;
  if (differs === null) {
    state = `<p class="unread">curia cannot tell whether the daemon runs these files: ${
      p?.daemon_up === false ? "it is not answering." : "there is no reading of it yet."}</p>`;
  } else if (differs.length) {
    state = `<p class="unread">The daemon is NOT running the files. These differ:
      <span class="mono">${differs.map(esc).join(", ")}</span>. A restart takes them.</p>`;
  } else {
    state = `<p class="qhint">The daemon is running these files. It read them ${esc(ago(run?.loaded_at))}.</p>`;
  }
  /* #292: the screen reads two layers and writes only the top one. Said here,
     because "I saved and git shows nothing changed" must not be a puzzle the
     operator has to solve on the box. */
  const writes = settings.writes
    ? `A save writes <span class="mono">${esc(fileName(settings.writes.curia))}</span> and
       <span class="mono">${esc(fileName(settings.writes.routing))}</span>, beside the tracked files.
       Git does not track those, so the box's checkout stays clean and a deploy never collides with a
       save. They hold what this box answers differently, and nothing else.`
    : "";
  return `${state}<div class="rows">
    <div class="row"><span class="grow"><button class="btn${differs?.length ? " restart-hot" : ""}"
      ${UI.set.busy ? "disabled" : ""} onclick="doRestart()">Restart daemon</button></span>${qq("set-restart")}</div>
    ${qhint("set-restart", `A restart is for the keys a save cannot apply: the ports,
      <span class="mono">workspace_root</span>, <span class="mono">sandbox</span>,
      <span class="mono">identity</span>, and every routing key this screen does not write.
      Agent panes live in their own container, so they survive it.`)}
    ${writes ? `<div class="row"><span class="grow dim-note">where a save lands</span>${qq("set-writes")}</div>${qhint("set-writes", writes)}` : ""}
  </div>`;
}

/* ---- the chat (#267, many conversations by #333) ----------------------------

   The console draws no chat of its own and frames none. A chat IS the timeline
   attach — the same page a phone opens against an agent — pointed at one
   browser conversation of the overseer and served under this address. One chat
   surface: the composer, the history and every future thing the timeline grows
   arrive here for free, and there is no second one to keep in step.

   So this screen is a door, and #333 made it a door with many rooms behind it.
   ADR-0016 gives the browser many conversations rather than one that grows
   forever, so this is where the operator picks one and opens a new one. A new
   conversation is the reset, the same way a new Discord thread is.

   The picker lives HERE and not in the chat page, because the chat page is the
   timeline and an agent opens the same page. A conversation switcher there
   would put console words on the agent surface.

   Every row carries its own context percent. ADR-0016 adds no warning that a
   conversation is long: that number IS the signal, and #332 is what made it
   true per conversation. */
const CHAT_PAGE = "/chat";
const chatHref = (session) => CHAT_PAGE + "?session=" + encodeURIComponent(session);

function screenChat(p) {
  /* The overseer runs in its own container (#315), but every message reaches it
     THROUGH the daemon, so a daemon that is not answering is still a chat that
     is not there. The bar above says why; this says what it means. */
  const down = p && !p.daemon_up;
  const lead = `<p class="lead">This is the overseer — the same curia that answers your prose in
      Discord. It sees every watched repo, and it holds the verbs: ask it what to start, then say
      <code>start 256</code> and it dispatches.</p>
    ${down ? `<p class="unread">The chat is down while the daemon restarts. Your message reaches the overseer through it.</p>` : ""}`;
  const count = conversations?.conversations?.length ?? null;
  return `${head(p, "Chat", count == null ? "" : `<span class="dim-note num">${count} conversation${count === 1 ? "" : "s"}</span>`)}
    <div class="door">${lead}${chatList()}
      <p class="cannot">It holds a reading shell over a checkout of every watched repo, so it can
        read a file or a diff — but it cannot write one: its GitHub token is read-only, and every
        effect still crosses the daemon. A destructive verb still posts its ✅/❌ card, and that
        card lands on Home.</p>
    </div>`;
}

/* Null is not empty, the second rule of this page. A list curia could not be
   asked for and a box with no conversations on it are opposite facts. */
function chatList() {
  if (conversations === null) return `<div class="later">Reading your conversations…</div>`;
  if (conversations.conversations === null) {
    return `<div class="unread">curia could not read your conversations — ${esc(conversations.error ?? "no reason given")}.</div>
      ${newChatButton()}`;
  }
  const rows = conversations.conversations.map(chatRow).join("");
  if (!rows) {
    /* The state after the cutover, and after the last conversation is deleted.
       Nothing is minted by looking at this screen: a page read must not spend a
       number, and numbers only go up. */
    return `<p>No conversations yet. Press below to open the first one.</p>${newChatButton()}`;
  }
  return `<table class="chats">${rows}</table>${newChatButton()}
    <p class="cannot">A new conversation is the reset — the same thing a new thread is in Discord.
      Open one when the context above reads full. Deleting one spends its number for good.</p>`;
}

function newChatButton() {
  const k = "chat-new";
  return `<p><button class="btn primary" ${anyBusy() ? "disabled" : ""} onclick="doNewConversation()">
    ${busy(k) ? "Opening…" : "New conversation"}</button></p>${said(k)}`;
}

function chatRow(c) {
  const k = "chat-del-" + c.key;
  /* The label is the operator's own first message, read off the transcript by
     the daemon. A conversation with no turn yet has none, and says so rather
     than showing a blank row. */
  const label = c.label
    ? `<b>${esc(c.label)}</b>`
    : `<span class="dim-note">no turn yet</span>`;
  const answer = said(k);
  /* A browser conversation has no thread, so the line ADR-0015 gives a killed
     turn lands here — on the row the operator picks it from. It clears itself:
     the next turn on this conversation ends the drop. */
  const dropped = c.dropped && !c.dropped.replayed
    ? `<span class="killed">⚠️ A restart killed a turn here${
      c.dropped.commands?.length ? `, and it had run ${esc(c.dropped.commands.join(", "))}` : ""
    }. curia did not send your message again${
      /* The commands are the reason when there are any: not said twice. */
      !c.dropped.commands?.length && c.dropped.why ? ` — ${esc(c.dropped.why)}` : ""}.</span>`
    : "";
  return `<tr>
    <td><a href="${esc(chatHref(c.session))}">${label}</a>
      <span class="dim-note mono" style="display:block;margin:2px 0 0">${esc(c.key)} · ${esc(ago(c.last_turn_at))}</span>${dropped}</td>
    <td class="num">${ctxCell(c)}</td>
    <td><button class="btn sm" ${anyBusy() ? "disabled" : ""} onclick="doDeleteConversation('${js(c.key)}')">
      ${busy(k) ? "…" : "delete"}</button></td>
  </tr>${answer ? `<tr><td colspan="3">${answer}</td></tr>` : ""}`;
}

/* Mint, then walk through the door. Opening a conversation you then have to
   find in a list is two acts where the operator asked for one. */
async function doNewConversation() {
  const out = await verb("chat-new", "/api/console/new", {});
  if (out?.session) location.href = chatHref(out.session);
}

async function doDeleteConversation(key) {
  const ask = `Delete ${key}? Its number is spent for good — a later conversation never reuses it. `
    + `curia stops offering the conversation, and its transcript stays on the box.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  await verb("chat-del-" + key, "/api/console/delete", { key });
  loadConversations();
}

/* ---- credentials (#661, the shape the #645 prototype settled) ---------------

   THE SCREEN THAT ANSWERS "WHAT IS THE STATE OF ALL THREE?" — the question no
   other surface could take. The attention list is built to be empty: `valid`
   and `expiring` are silent by design, so before this screen existed there was
   nowhere to look when nothing was wrong, and "when does this expire?" had no
   answer short of an incident. `unowned` in particular was an ABSENCE, and an
   absence reads as nothing rather than as a fact about what this daemon owns.

   Three rows, two stores. The claude containers and the overseer run on one
   value from one account, so each row names its provider rather than leaving an
   operator to infer the sharing from two identical dates — and one Sign-in
   press serves both, which the second row says instead of offering a second
   button for the same act.

   NO API-KEY FIELD, here or anywhere. Subscription only, and this page offers
   nothing to type a credential into. */

/* WHAT IS BROKEN BEHIND THE CREDENTIAL (#645 finding 2). A dead credential is a
   fact about the box, not about a file. The wire carries the two facts — the
   lane is not dispatching, and these agents are on it — and the sentence is
   composed here, once, for every surface that needs it. */
function credBlast(c, said) {
  const lane = c.lane;
  if (!lane || lane.dispatching) return "";
  /* ONE LANE, ONE SENTENCE. Two of the three rows are anthropic and answer the
     same lane, so a held anthropic lane would otherwise say the same thing
     twice — which reads as two incidents. */
  if (said.has(lane.provider)) return "";
  said.add(lane.provider);
  const frozen = lane.agents ?? [];
  return `the ${esc(lane.provider ?? c.provider ?? "")} lane is held — nothing new dispatches to it`
    + (frozen.length
      ? `, and ${esc(frozen.length)} live agent(s) are frozen mid-ticket, not lost: ${esc(frozen.join(", "))}.
         They keep their pane, claim and worktree, and heal on the tick after a fresh credential lands.`
      : ", and no agent was running on it.");
}

/* How long a token has, said the way an operator asks it. */
function until(iso) {
  if (!iso) return "no stated expiry";
  const ms = Date.parse(iso) - Date.now();
  if (!Number.isFinite(ms)) return "no stated expiry";
  if (ms <= 0) return "expired";
  const d = ms / 86400000;
  if (d >= 1) return d.toFixed(1) + " days";
  const h = ms / 3600000;
  if (h >= 1) return h.toFixed(1) + " hours";
  return Math.round(ms / 60000) + " min";
}
const mmss = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

/* The live login, as a PANEL above the table and not a row inside it: a flow
   with a countdown, a copyable code and a terminal fallback is a panel whatever
   it is called.

   IT DEGRADES, NEVER DEAD-ENDS. The link and the code are scraped off a pane,
   and a scrape is a guess about somebody else's wording. When either is missing
   the panel says so and hands over the terminal, which is the path that always
   works — the scrape is an optimization over it and never a replacement.

   TWO LANES (#660), differing in one step. `typed` says whether the operator
   puts a code IN rather than reads one OUT: openai shows a code to enter in the
   browser, anthropic asks for one to be pasted back into the terminal. The
   token that lane produces reaches this page from nowhere. */
function credFlow(r) {
  if (!r || r.state !== "waiting") return "";
  const blind = !r.url || (!r.typed && !r.code);
  const second = r.typed
    ? `<div class="flow-step"><span class="n">2</span><div>
         <div>Paste the code the browser shows back into the terminal</div>
         <div class="dim-note">curia cannot type it for you: the login pane refuses every write curia can make, which is what keeps the stall ladder out of a login prompt.</div>
       </div></div>`
    : `<div class="flow-step"><span class="n">2</span><div>
         <div>Enter this code</div>
         <code class="reauth-code">${esc(r.code)}</code>
       </div></div>`;
  const third = r.typed
    ? `<div class="flow-step"><span class="n">3</span><div>
         <div>Nothing else to do</div>
         <div class="dim-note">curia reads the token out of the pane, asks Anthropic whether it authenticates, and adopts it only on a yes.</div>
       </div></div>`
    : `<div class="flow-step"><span class="n">3</span><div>
         <div>Nothing is pasted back</div>
         <div class="dim-note">curia watches the scratch config dir and adopts the credential the moment it lands.</div>
       </div></div>`;
  return `<div class="flow${blind ? " blind" : ""}">
    <div class="eyebrow">${esc(r.provider)} · signing in · ${esc(mmss(r.seconds_left ?? 0))} left</div>
    ${blind
      ? `<h3>curia could not read the login off the pane</h3>
         <p class="dim-note" style="margin:0 0 10px">The wording changed, or the pane has not printed it yet. The terminal always works.</p>`
      : `<div class="flow-step"><span class="n">1</span><div>
           <div>Open the link</div>
           <a class="flow-link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
         </div></div>
         ${second}
         ${third}`}
    <div class="flow-fall">
      ${/* THE PATH THAT ALWAYS WORKS (#645 finding 4). The card named the
            terminal and never linked it, and the daemon had composed the link
            for Discord since the first commit. It rides the payload now. */
        r.terminal_url
          ? `<a href="${esc(r.terminal_url)}" target="_blank" rel="noopener">Open the terminal instead →</a>`
          : `<span class="dim-note">curia could not publish a terminal link for this session.</span>`}
      <span class="dim">session <code>${esc(r.session)}</code>${r.expires_at ? `, torn down at ${esc(clock(r.expires_at))}` : ""}</span>
    </div>
  </div>`;
}

/* One consumer. `signer` is the provider whose Sign-in button has already been
   drawn on this table, so one login is offered once however many rows it heals.

   `ended` is the login that finished without a credential (#721), and it is
   drawn HERE rather than as an item of its own: this row is the one that already
   stands and already offers the way back, so an operator who pressed Sign in and
   watched the attempt disappear needs one more sentence, not one more place to
   look. It shows only on the rows of the provider it belongs to. */
function credRow(c, signer, flow, ended) {
  const st = credState(c);
  /* A login already running on this provider is the act. Offering a second
     Sign-in press beside the panel that is mid-flow would start nothing — the
     flow hands back the session it already has — and would read as two ways in
     where there is one. */
  const signing = flow && flow.state === "waiting" && flow.provider === c.provider;
  const act = signing
    ? `<span class="dim-note">signing in now — the link is in the panel above</span>`
    : credWants(c)
      ? (c.provider && signer.has(c.provider)
        ? `<span class="dim-note">the same login signs this in</span>`
        : credSignIn(c, signer))
      : `<span class="dim-note">${c.state === "unowned" ? "nothing to press" : "nothing to do"}</span>`;
  /* The state word LIES on a held lane (#646) and only there: the access token
     can be valid for another two days and the lane still be unrecoverable. So
     the chip names the lane instead of the token, and the reason sits under it. */
  const chip = c.held
    ? `<span class="chip bad">held</span>`
    : `<span class="chip ${st.tone}">${esc(c.state)}</span>`;
  const why = c.held?.why ?? c.last_error ?? c.why ?? st.says;
  const last = ended && ended.provider === c.provider && ended.why
    ? `<div class="dim-note">the last login ended at ${esc(clock(ended.ended_at))}: ${esc(ended.why)}</div>`
    : "";
  return `<tr>
    <td class="c-who"><span class="who">${esc(c.consumer)}</span>
      <span class="dim-note mono" style="display:block;margin-top:2px">${esc(c.provider ?? "no provider")}</span></td>
    <td data-label="state">${chip}</td>
    <td class="num" data-label="expires">${c.expires_at
      ? `${esc(until(c.expires_at))}<div class="dim-note">${esc(clock(c.expires_at))}</div>`
      : `<span class="dim-note">—</span>`}</td>
    <td class="num" data-label="last refresh">${c.last_refresh_at
      ? esc(clock(c.last_refresh_at))
      : `<span class="dim-note">never</span>`}</td>
    <td class="why" data-label="why">${esc(why)}${last}</td>
    <td class="c-act">${act}</td>
  </tr>`;
}

/* The one press on this screen, and the reason the screen exists: the recovery
   from a dead credential has to reach a phone. It runs the operator's own
   `reauth <provider>` through the command seam, so a press and a typed line are
   one act — and what it shows afterwards is curia's own sentence about what
   happened, including a refusal. */
function credSignIn(c, signer) {
  if (!c.provider) return `<span class="dim-note">no provider to sign in</span>`;
  signer.add(c.provider);
  const k = "reauth:" + c.provider;
  /* What curia answered sits at the control that asked, once — the press was on
     this row, and the other row of a shared provider offers no button to hang a
     second copy of it on. */
  return `<button class="btn primary" ${anyBusy() ? "disabled" : ""} onclick="startReauth('${js(c.provider)}')">
    ${busy(k) ? "…" : "Sign in from a browser"}</button>${said(k)}`;
}
const startReauth = (provider) => verb("reauth:" + provider, "/api/reauth", { provider });

function screenCredentials(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Credentials");
  /* Null is not empty (rule 2). A daemon that answered with no credentials
     section at all is not a box that owns no credentials. */
  const c = o.credentials;
  if (!c) {
    return `${head(p, "Credentials")}
      <div class="unread">This snapshot carries no credentials section — the daemon answering it is older than this page.</div>`;
  }
  const rows = c.consumers ?? [];
  /* Two passes over the rows, each with a set that keeps one lane and one login
     from being said twice: `lanes` for the sentences above the table, `signer`
     for the button inside it. */
  const lanes = new Set();
  const signer = new Set();
  const held = rows.map((r) => credBlast(r, lanes)).filter(Boolean);
  return `${head(p, "Credentials")}
    ${held.map((b) => `<div class="lane-held">${b}</div>`).join("")}
    ${credFlow(c.reauth)}
    <div class="h-sect"><h3>Model credentials (${esc(rows.length)})</h3>
      ${rows.length ? `<div class="tbl-wrap"><table class="creds">
        <thead><tr>
          <th>consumer</th><th>state</th><th>expires</th><th>last refresh</th><th>why</th><th></th>
        </tr></thead>
        <tbody>${rows.map((r) => credRow(r, signer, c.reauth, c.reauth_ended)).join("")}</tbody>
      </table></div>` : `<div class="empty">This daemon brokers no model credential.</div>`}
      <p class="dim-note" style="margin-top:10px">Subscription credentials only. curia holds no API key, and this page offers no field for one.</p>
    </div>`;
}

function screenSettings(p) {
  if (!settings || !draft) {
    return `${head(p, "Settings")}
      <div class="later">Reading curia.yaml and routing.yaml\u2026</div>${saveDock()}`;
  }
  const files = `<span class="dim-note mono">${esc(fileName(settings.files.curia))} \u00b7 ${esc(fileName(settings.files.routing))}</span>`;
  return `${head(p, "Settings", files)}${drillIn("settings", p)}${saveDock()}`;
}
const fileName = (p) => String(p ?? "").split("/").pop();

/* ---- the edits ---- */

/* Every edit lands on the draft and nowhere else, so what is on screen and what
   a save would post are the same object. */
function dirty() {
  if (UI.set.phase !== "restarting") UI.set.phase = changeCount() ? "dirty" : "clean";
  UI.set.error = null;
  UI.set.note = null;
  render();
}
/* The discard the dock offers. It throws away the draft rather than the file:
   nothing was written, so there is nothing on disk to put back. */
function discardEdits() {
  draft = clone(settings);
  UI.set.phase = "clean";
  UI.set.error = null;
  UI.set.note = null;
  render();
}
function setDefault(i, model) { draft.routing.defaults[i].model = model; dirty(); }
function setEffort(i, effort) { draft.routing.effort[i].effort = effort; dirty(); }
function setModelActive(i, on) { draft.routing.models[i].active = on; dirty(); }
function setDispatchField(key, value) {
  draft.dispatch[key] = typeof value === "boolean" ? value : Number(value);
  dirty();
}
function removeRepo(i) { draft.watch.splice(i, 1); dirty(); }
function addRepo(repo) {
  const name = String(repo ?? "").trim();
  if (!name || draft.watch.some((w) => w.repo === name)) return;
  draft.watch.push({ repo: name, mode: "auto" });
  dirty();
}
function addTypedRepo() {
  const el = document.getElementById("set-repo-typed");
  if (!el) return;
  const name = el.value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(name)) {
    UI.set.phase = "refused";
    UI.set.error = `"${name}" is not an owner/name repo`;
    return render();
  }
  el.value = "";
  addRepo(name);
}

/* ---- the two calls ---- */

async function loadSettings() {
  try {
    const res = await fetch("/api/settings", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    settings = await res.json();
    draft = clone(settings);
    if (UI.set.phase === "unread") UI.set.phase = "clean";
  } catch (e) {
    UI.set.phase = "unread";
    UI.set.error = e.message;
  }
  render();
}

async function loadRepos() {
  repos = null;
  try {
    const res = await fetch("/api/repos", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    repos = await res.json();
  } catch (e) {
    repos = { login: null, repos: null, error: e.message };
  }
  render();
}

/* The browser conversations (#333). Taken on arrival at the Chat screen and
   after a press that changes the list, never on the poll: a row costs the
   daemon a transcript read, and the other five screens have no use for it.

   A failure lands as `conversations: null`, which the screen draws as "curia
   could not be asked" — not as an empty list. */
async function loadConversations() {
  try {
    const res = await fetch("/api/console", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    conversations = await res.json();
  } catch (e) {
    conversations = { conversations: null, error: e.message };
  }
  render();
}

async function doSave() {
  const patch = settingsPatch();
  if (!Object.keys(patch).length) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/settings", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(patch),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    /* The answer carries the re-read file, so the screen shows what landed
       rather than what was typed. */
    settings = body.settings ?? settings;
    draft = clone(settings);
    /* The save carries the apply's own answer (#362). Three outcomes, and the
       page states the one that came back rather than guessing from the write:
       applied, declined by the daemon, or a daemon that could not be asked. */
    const r = body.reload;
    UI.set.error = null;
    if (!body.written?.length) {
      UI.set.phase = "clean";
      UI.set.note = "That was already what the files say.";
    } else {
      UI.set.note = `Wrote ${body.written.join(" and ")}, atomically, with the comments kept.`;
      if (r?.ok) UI.set.phase = "applied";
      else if (r?.reason === "daemon-down") { UI.set.phase = "offline"; UI.set.error = r.error; }
      else { UI.set.phase = "declined"; UI.set.error = r?.error ?? "the daemon gave no reason"; }
    }
  } catch (e) {
    UI.set.phase = "refused";
    UI.set.error = e.message;
  }
  UI.set.busy = false;
  render();
}

async function doRestart() {
  const ask = "Restart the daemon? Running agents keep their tmux sessions — those live in their own container. Anything unsaved here is not written.";
  if (typeof confirm === "function" && !confirm(ask)) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/restart", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: "{}",
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    UI.set.phase = "restarting";
    UI.set.error = null;
  } catch (e) {
    /* The daemon may have taken the order and died before answering. Say
       exactly that, and let the marker at the top of the page be the evidence:
       it reads the daemon, and this reads a socket. */
    UI.set.phase = "refused";
    UI.set.error = `${e.message} — the bar above says whether the daemon is answering`;
  }
  UI.set.busy = false;
  render();
}

/* ---- the shell ------------------------------------------------------------- */

function render() {
  /* No mount point, nothing to draw. The page boots only into `#app`, and its
     test drives the screens directly — an edit there must not go looking for a
     document that is not one. */
  const app = document.getElementById("app");
  if (!app) return;
  const n = needsYou(payload?.overview);
  /* The stale-daemon marker (#362). A daemon running something other than the
     files is visible from every screen, so nobody has to open Settings to find
     out. It reads the same comparison the Maintenance section draws. */
  const stale = runningDiff(payload)?.length ? `<span class="nav-marker">stale</span>` : "";
  const field = activeField();
  app.innerHTML = `<div class="shell">
    ${desktopNav(n, stale)}
    <main>${SCREENS[UI.screen][1](payload)}</main>
    ${mobileNav(n, stale)}
  </div>`;
  document.title = (n ? `(${n}) ` : "") + "Atlas · Curia";
  restoreField(field);
  /* The hunks a card just asked for (#355). Started AFTER the page is written,
     so a renderer stays a renderer — and once each, because the marker the
     request left behind is what the next render reads. */
  drainDiffQueue();
}

function navMarker(k, needs, stale) {
  if (k === "home" && needs) return `<span class="nav-marker num">${needs}</span>`;
  if (k === "settings") return stale;
  return "";
}
function desktopNav(needs, stale) {
  return `<nav class="drawer" aria-label="Atlas pages"><span class="brand">curia · atlas</span>
    ${NAMES.map((k) => `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">
      <span class="nav-label">${SCREENS[k][0]}</span>${navMarker(k, needs, stale)}</button>`).join("")}
  </nav>`;
}
function mobileTab(k, icon, marker) {
  return `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">
    <span class="nav-icon" aria-hidden="true">${icon}</span><span class="nav-label">${SCREENS[k][0]}</span>${marker ?? ""}</button>`;
}
function mobileNav(needs, stale) {
  return `<nav class="notchbar" aria-label="Atlas pages">
    ${mobileTab("home", "⌂", navMarker("home", needs, stale))}
    ${mobileTab("maps", "▦")}
    <button class="agents-key ${UI.screen === "agents" || UI.screen === "chat" ? "on" : ""}" onclick="goto('agents')">
      <span class="nav-icon num">${needs}</span><span class="nav-label">Agents</span></button>
    ${mobileTab("feed", "≡")}
    ${mobileTab("settings", "⚙", navMarker("settings", needs, stale))}
  </nav>`;
}

/* The poll re-renders the whole page every few seconds, and the settings screen
   has fields somebody may be halfway through typing in. The VALUE is never at
   risk — every keystroke lands on the draft — so what has to survive a render
   is the cursor, by id and offset. */
function activeField() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  let caret = null;
  try { caret = el.selectionStart; } catch { caret = null; }
  return { id: el.id, caret };
}
function restoreField(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || typeof el.focus !== "function") return;
  el.focus();
  if (f.caret != null && el.setSelectionRange) {
    try { el.setSelectionRange(f.caret, f.caret); } catch { /* not a text field */ }
  }
}

/* Entering a screen, from a click or from the hash. Settings and Chat are the
   two screens with a read of their own, and each is taken on arrival rather
   than on every poll: the config files change when somebody saves them, and the
   conversations change when somebody opens or deletes one — neither happens
   every five seconds.
   Chat re-reads on EVERY arrival, unlike settings. The list carries a context
   percent and a last-turn time, and both move with every turn taken from any
   device, so a held copy would age. */
function routeName(k) { return k === "frontier" ? "maps" : k; }
function enter(k) {
  k = routeName(k);
  UI.screen = k;
  if (k === "settings" && !settings) loadSettings();
  if (k === "chat") loadConversations();
}
function goto(k) { enter(k); location.hash = k; render(); }
window.addEventListener("hashchange", () => {
  const k = routeName(location.hash.slice(1));
  if (NAMES.includes(k) && k !== UI.screen) { enter(k); render(); }
});

/* ---- the poll -------------------------------------------------------------
   The operator's call on #263: refresh while this tab is visible, and stop
   when it is not. Every refresh costs the daemon a whole read of the journal
   off disk, so a tab nobody is looking at must cost nothing. The interval is
   the sidecar's to state — it comes back inside the payload — so one config
   key governs both halves and they cannot drift apart. */
let timer = null;

async function tick() {
  try {
    const res = await fetch("/api/overview", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    payload = await res.json();
    reachable = true;
  } catch {
    /* Keep the last payload on screen: a page that blanks itself is worst
       exactly when the box is worst. */
    reachable = false;
  }
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  timer = setTimeout(tick, (payload?.poll_interval_s ?? 5) * 1000);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else clearTimeout(timer);
});

/* The page boots itself only in a browser. Its test loads the same source into
   a vm to call the screens directly, and a boot there would fetch nothing and
   render into no document. */
if (typeof document !== "undefined" && document.getElementById("app")) {
  const initial = routeName(location.hash.slice(1));
  enter(NAMES.includes(initial) ? initial : "home");
  /* The file read happens at boot even when the operator lands somewhere else
     (#362): the stale-daemon marker on the Settings nav item compares the two,
     and a marker that needed the section opened would be a marker nobody sees.
     `enter` already took the read on the settings screen itself. */
  if (UI.screen !== "settings") loadSettings();
  render();
  if (document.visibilityState === "visible") tick();
}
</script>
