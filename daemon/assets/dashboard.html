<!doctype html>
<meta charset="utf-8">
<!-- The console (#263 the shell, #264 the read screens, #265 the settings write,
     #266 the operator verbs), on the look settled by the prototype (#248):
     dark-first tokens, system mono for data, one accent.

     THE STAMP BELOW IS LOAD-BEARING. This page and daemon/src/dashboard.mjs are
     two halves of one protocol, and there is no build step — the file on disk IS
     the reviewed source. A pull that changes both halves with no sidecar restart
     would leave an old server serving a new page, so the page declares what it
     speaks and the server refuses anything else (#70's rule, as timeline.html
     carries it).

     The four read screens draw one payload: `GET /api/overview`, which is the
     sidecar's held snapshot of the daemon's own `GET /overview` (#262). A chat
     (#267) draws nothing: it is the timeline page, served at /chat. What the
     Chat screen draws is the PICKER over the browser conversations (#333), off
     a read of its own — `GET /api/console`, taken on arrival, not on the poll.

     THE VERBS (#266) POST to the sidecar, never to the daemon. It composes each
     daemon call from the fields the page sends, so this page names a ticket, an
     escalation id or an agent — never a command line.

     TWO RULES RUN THROUGH EVERY SCREEN HERE.

     1. Color marks attention, and nothing else. Warn and bad are spent on an
        open question, the review gate and a spent usage window. A state, a
        ticket type and a repo are told in words.
     2. Null is not empty. An unreadable fleet is not an idle box, and a frontier
        nobody has computed is not an empty frontier. Every section that can fail
        on its own says which of the two it is. -->
<meta name="curia-dashboard" content="proto=4">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curia</title>
<style>
  /* ---------- tokens: dark-first (#248) ---------- */

    :root:not([data-theme="dark"]) {
      --bg: #f2f4f3; --bg-raise: #ffffff; --bg-inset: #e8ebe9;
      --line: #d5dad6; --ink: #1d2420; --ink-dim: #5b6570; --ink-faint: #8b939e;
      --accent: #157a5f; --accent-ink: #f2fdf9;
      --warn: #9a6a10; --bad: #b03a32; --ok: #157a5f; --idle: #5b6570;

    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .num { font-variant-numeric: tabular-nums; }

  a:hover { text-decoration: underline; }

  h1, h2, h3 { margin: 0; text-wrap: balance; }

  /* ---------- shell ---------- */

  }
  .shell nav button.on { background: var(--bg-raise); color: var(--ink); font-weight: 600; }

  .shell main { padding: 18px 22px; min-width: 0; }
  .shell main h2 { font-size: 15px; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }

    .shell nav .brand { padding: 0 10px 0 4px; }
    .shell nav button { flex: none; gap: 6px; }
    .shell main { padding: 14px; }
  }

  /* ---------- the reading's own age ---------- */
  .readbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

  .readbar.down { border-color: var(--warn); background: var(--chip-warn-bg); color: var(--warn); }
  .readbar.down .dot { background: var(--warn); }

  /* ---------- shared atoms (#248) ---------- */
  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .dim-note { font-size: 12px; color: var(--ink-faint); }
  .empty { font-size: 13px; color: var(--ink-dim); padding: 6px 0; }
  /* An unreadable section. It is a fact about the READ, so it is marked. */
  .unread {

    border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 13px; margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
  .dot.attn { background: var(--warn); }

  .bar { position: relative; height: 7px; border-radius: 4px; background: var(--bg-inset); overflow: hidden; min-width: 60px; display: inline-block; }

  .meter-row { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
  .meter-row .lbl { width: 2.2em; flex: none; font-family: ui-monospace, Menlo, monospace; }
  .meter-row .pct { width: 3.4em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- home ---------- */

  .tile .v { font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }

  .tile.warn { border-color: var(--warn); } .tile.warn .v { color: var(--warn); }
  .tile .v.none { color: var(--ink-faint); }

  .split-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 22px; align-items: start; margin-top: 16px; }
  .split-cols > div { min-width: 0; }
  @media (max-width: 900px) { .split-cols { grid-template-columns: 1fr; } }
  .h-sect { margin: 16px 0; }
  .h-sect:first-child { margin-top: 0; }
  .h-sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 700; }

  .h-sect .more { display: block; margin-top: 8px; font-size: 12.5px; }

  /* ---------- feed ---------- */
  .feed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

  .frx-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .frx-filter .fchip.on { border-color: var(--accent); color: var(--accent); background: var(--chip-ok-bg); font-weight: 600; }
  .frx-filter select { padding: 3px 8px; }
  .frx-filter .sep { color: var(--ink-faint); }
  select {

  .frx-card {
    border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px;

  .frx-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

  .frx-card .typ { font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }

  .frx-dimcard .t { font-family: ui-monospace, Menlo, monospace; margin-right: 5px; }

  .fr-repo > .eyebrow { margin-bottom: 6px; display: block; }

  .fr-kid { position: relative; margin-top: 6px; font-size: 12.5px; color: var(--ink-dim); }

  .fr-kid .t { font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }

  /* ---------- settings (#265, on the #248 look) ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--bg-raise); color: var(--ink);
    border-radius: 7px; padding: 6px 14px;
  }
  .btn:hover { border-color: var(--accent); }

  .btn.restart-hot { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: default; }

  input[type=text], input[type=number] {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }

  .set-subnav { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }

  .set-subnav button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .set-block { border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); padding: 12px 14px; }
  .set-block h3 { font-size: 13px; margin-bottom: 8px; }
  .set-block .hint { font-size: 12px; color: var(--ink-dim); margin: 0 0 10px; }
  .set-block table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .set-block td, .set-block th { padding: 5px 8px 5px 0; text-align: left; vertical-align: middle; }
  .set-block th { color: var(--ink-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .set-block tr.inactive td { color: var(--ink-faint); }
  .set-block .right { text-align: right; }
  .model-mgr { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; }

  .save-banner {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;

  .save-banner .toast { font-size: 12.5px; color: var(--ink-dim); }

  .save-banner .toast.why { font-family: ui-monospace, Menlo, monospace; font-size: 12px; flex-basis: 100%; }

  /* ---------- the operator verbs (#266, on the #248 shapes) ----------
     No new color. A verb sits inside the card that already carries the fact it

  .act-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .act-row input[type=text] { flex: 1; min-width: 130px; }
  .act-box { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-inset); padding: 9px 11px; }

  .act-box .act-row:first-child { margin-top: 0; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; align-items: baseline; }

  .links button:hover { text-decoration: underline; }
  .links button.bad { color: var(--bad); }
  .links button[disabled] { color: var(--ink-faint); cursor: default; text-decoration: none; }
  /* What curia said back about the press. It is curia's OWN sentence, so it

  .said { margin-top: 7px; font-size: 12.5px; border-left: 3px solid var(--line); padding: 3px 0 3px 9px; white-space: pre-wrap; color: var(--ink-dim); }

  .door { max-width: 620px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); padding: 14px 16px; }
