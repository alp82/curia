  if (!list.length) return Promise.resolve([]);
  const total = list.reduce((n, f) => n + f.size, 0);
  if (total > MAX_REPLY_FILE_BYTES) return Promise.reject(new Error(`A reply carries at most ${MAX_REPLY_FILE_BYTES / 1048576} MB of files.`));
  return Promise.all(list.map((f) => new Promise((ok, no) => {
    const rd = new FileReader();
    rd.onload = () => ok({ name: f.name, data: String(rd.result).replace(/^data:[^,]*,/, "") });
    rd.onerror = () => no(new Error(`Could not read ${f.name}.`));
    rd.readAsDataURL(f);
  })));
}

function answerTyped(id, field, r) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "Type the answer first — an empty reply answers nothing.");
  const i = r ? markerIndex(r, v) : null;
  if (i !== null) return answerIndex(id, i);
  answerEsc(id, v);
}
/* The record the typed answer resolves its marker against: the open list on
   Home, or the Chat room's own open list. */
function escRecord(id) {
  const home = (payload?.overview?.escalations ?? []).find((r) => r.id === id);
  return home ?? (chat.open ?? []).find((r) => r.id === id) ?? null;
}
/* A rejection IS feedback (#48): the agent gets the operator's own words and
   fixes what they name. So an empty one is refused here rather than sent as a
   rejection nobody can act on. */
function rejectGate(id, field) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "A rejection carries your words — say what to change, then press Reject.");
  answerEsc(id, v);
}

function reconcileAnswerActions(o) {
  const open = new Set([...(o?.escalations ?? []), ...(o?.review_gate ?? [])].map((record) => record.id));
  for (const action of [...actions.values()]) {
    if (action.kind !== "escalation-answer" || !TERMINAL_ACTION.has(action.status)) continue;
    const key = "esc:" + action.target;
    if (action.status !== "confirmed") {
      UI.act.said = {
        key, ok: false,
        text: action.receipt ? receiptLine(action.receipt) : action.error || action.reason || "Curia could not answer this escalation.",
      };
      finishAction(action.action_id);
    } else if (!open.has(action.target)) {
      finishAction(action.action_id);
      UI.act.handoff = action.target;
    }
  }
}

/* ---- the reading's own age ------------------------------------------------- */

/* Three states, and they are three different facts: the sidecar is
   unreachable, the service is not answering it, or all is well. */
function readbar(p) {
  if (!reachable) {
    return `<div class="readbar down"><span class="dot"></span><b>the console is offline</b>
      <span class="why">this page cannot reach the sidecar that serves it</span></div>`;
  }
  if (!p) return `<div class="readbar"><span class="dot"></span>reading…</div>`;
  if (!p.daemon_up) {
    /* The sidecar is up and holding the last good reading — which is exactly
       what it exists for. Say which reading, and why it is not moving. */
    return `<div class="readbar down"><span class="dot"></span><b>service restarting</b>
      <span>showing the snapshot from ${esc(ago(p.read_at))}</span>
      <span class="spacer"></span>
      <span class="why">not answering on :${esc(p.daemon_port)} since ${esc(ago(p.error_since))} — ${esc(p.error)}</span></div>`;
  }
  return `<div class="readbar"><span class="dot"></span>read ${esc(ago(p.read_at))}
    <span class="spacer"></span>
    <span class="why">refreshing every ${esc(p.poll_interval_s)}s while this tab is visible</span></div>`;
}

/* Every screen opens the same way, and no screen draws before the first read
   lands. */
function head(p, title, right) {
  return `<div class="screen-head"><h2>${esc(title)}</h2><div class="screen-actions">${right ?? ""}
    <button class="search-lens" onclick="openSearch()">⌕ Search</button></div></div>${readbar(p)}`;
}

function searchMark(value, query) {
  const source = esc(value);
  const q = String(query ?? "").trim();
  if (!q) return source;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
  return source.replace(re, (hit) => `<mark>${hit}</mark>`);
}

/* Where a row lands (#713). The wire names the surface and its key; this is
   the whole routing table, and every row shows its landing word. A ticket and
   a chat hit open the Chat room, a map hit opens the Maps detail route, a
   journal hit opens the Feed on that event, and a decision opens its
   resolution comment on GitHub in a new tab, so the search stays behind it. */
function searchLanding(row) {
  const landing = row.landing ?? {};
  if (landing.surface === "chat") return { href: chatHref(landing.conversation), word: "Chat", action: `searchGo('chat','${js(landing.conversation)}')` };
  if (landing.surface === "maps") return { href: "#maps", word: "Maps", action: `searchGo('maps','${js(landing.map)}')` };
  if (landing.surface === "feed") return { href: "#feed", word: "Feed", action: `searchGo('feed','${js(landing.event)}')` };
  return { href: landing.url ?? "#", word: "GitHub", external: true };
}

/* The attention word a row shows instead of its kind (#713). The sources hand
   over what they know: the search module's `needs_you`, the tracker's own
   `needs-info` and `ready-for-human` labels, and the journal's `warning`. Only
   a state that asks something of the operator replaces the kind word. `open`
   and `closed` are not attention, so those rows keep their kind. */
const SEARCH_ATTENTION_WORDS = {
  needs_you: "needs you", "ready-for-human": "needs you", "needs-info": "needs info", warning: "warning",
};
function searchAttentionWord(row) {
  return SEARCH_ATTENTION_WORDS[String(row.attention ?? "")] ?? null;
}

function searchOverlay() {
  const state = UI.search;
  if (!state.open) return "";
  let body = `<div class="dim-note">Search tickets, maps, decisions, the journal, and Chat.</div>`;
  if (state.loading) body = `<div class="later">Searching…</div>`;
  else if (state.error) body = `<div class="unread">${esc(state.error)}</div>`;
  else if (state.result) {
    const rows = state.result.results;
    if (rows === null) body = `<div class="unread">Search could not reach Curia.</div>`;
    else body = rows.length ? `<div class="search-results">${rows.map((row) => {
      const landing = searchLanding(row);
      const attention = searchAttentionWord(row);
      const kind = attention || row.kind;
      const opens = landing.action ? ` onclick="${landing.action};return false"` : landing.external ? ` target="_blank" rel="noopener"` : "";
      return `<a class="search-result" href="${esc(landing.href)}"${opens}><span class="kind${attention ? " needs" : ""}">${esc(kind)}</span>
        <span><span class="title">${searchMark(row.title, state.q)}</span><span class="snippet">${searchMark(row.snippet, state.q)}</span></span>
        <span class="meta"><span>${esc(dur(row.age_s))}</span><span>${esc(landing.word)}</span></span></a>`;
    }).join("")}</div>` : `<div class="empty">Nothing matches.</div>`;
  }
  return `<section class="search-sheet" role="dialog" aria-label="Global search"><div class="search-box">
    <input id="app-search" type="search" value="${esc(state.q)}" placeholder="tickets · decisions · journal · Chat" oninput="searchType(this.value)" autofocus>
    <button class="btn" onclick="closeSearch()">Close</button></div>${body}</section>`;
}

let searchTimer = null;
let searchGeneration = 0;
function openSearch() { UI.search.open = true; render(); }
function closeSearch() {
  UI.search.open = false;
  UI.search.loading = false;
  searchGeneration += 1;
  clearTimeout(searchTimer);
  render();
}
function searchGo(surface, ref) {
  if (surface === "maps") {
    const map = mapsOf(payload?.overview).find((row) => String(row.number) === String(ref));
    if (map) {
      UI.maps.repo = "all";
      UI.maps.selected = { repo: map.repo, map: map.number };
      UI.maps.open = true;
      UI.search.open = false;
      enter("maps");
      location.hash = mapRoute(map.repo, map.number);
      render();
      return false;
    }
  }
  if (surface === "feed") UI.feed.focus = { id: String(ref), query: UI.search.q.trim().toLowerCase() };
  UI.search.open = false;
  enter(surface);
  if (surface === "chat" && ref) {
    applyChatRoute(["chat", encodeURIComponent(String(ref))]);
    location.hash = chatRoute(String(ref));
  } else {
    location.hash = surface;
  }
  render();
  return false;
}
function searchType(query) {
  UI.search.q = query;
  const generation = ++searchGeneration;
  clearTimeout(searchTimer);
  if (!String(query).trim()) { UI.search.result = null; UI.search.error = null; UI.search.loading = false; render(); return; }
  searchTimer = setTimeout(() => runSearch(generation), 220);
}
async function runSearch(generation = ++searchGeneration) {
  const query = UI.search.q.trim();
  if (!query) return;
  UI.search.loading = true;
  UI.search.error = null;
  render();
  try {
    const res = await fetch("/api/search?q=" + encodeURIComponent(query), { headers: { accept: "application/json" }, cache: "no-store" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    if (generation !== searchGeneration) return;
    UI.search.result = body;
  } catch (error) {
    if (generation !== searchGeneration) return;
    UI.search.result = null;
    UI.search.error = error.message;
  }
  if (generation !== searchGeneration) return;
  UI.search.loading = false;
  render();
}
function noSnapshot(p, title, right) {
  return `${head(p, title, right)}<div class="later">No snapshot yet. The sidecar is up and has not read the service successfully even once.</div>`;
}
function later(p, what, ticket) {
  return `${head(p, SCREENS[UI.screen][0])}
    <div class="later"><b>${esc(what)}</b> lands on ${esc(ticket)}. It draws the same snapshot the bar above reads.</div>`;
}

/* ---- the fleet ------------------------------------------------------------- */

/* The state in the vocabulary the status line already uses (statusline.mjs):
   `ready` and `working` are one state, and an agent with an open question is
   waiting whatever its record says. */
function stateWord(a) {
  if (a.state === "awaiting-review") return "awaiting review";
  if (waitingOn(a).length) return "waiting";
  return { ready: "working", spawning: "dispatched", failed: "failed", "cross-checking": "cross-checking" }[a.state] ?? String(a.state ?? "unknown");
}
/* The questions bound to this agent, minus the gate — the gate is its own list
   and its own card, never a row's footnote. */
const waitingOn = (a) => (a.waiting_on ?? []).filter((w) => w.kind !== REVIEW_KIND);
/* Attention is one test, used by the dot, the row tint and nothing else. */
const wantsYou = (a) => waitingOn(a).length > 0;

function agentDot(a) {
  return `<span class="dot ${wantsYou(a) ? "attn" : a.state === "failed" ? "off" : ""}"></span>`;
}

/* The context meter (#264, usage.mjs ctxOnWire). No reading is "—", never 0%.
   A figure above 100% is the service's own complaint about the denominator, not
   a reading about the agent, so it is marked rather than drawn flat. */
function ctxCell(a) {
  if (a.ctx_pct == null) return `<span class="dim-note">—</span>`;
  return `${esc(a.ctx_pct)}%${a.ctx_over ? ` <span class="over">⚠</span>` : ""}`;
}

/* How long ago the agent last reached curia (#370, dispatch.mjs onMcpCall). The
   daemon holds the reading in memory, so this column speaks for the live daemon
   process and for nothing before it.

   The two nulls are two different facts, and the cell says which one it is. An
   agent this process spawned and never heard is "never". An agent it adopted
   after a restart has no uptime either, and it is "adopted": the silence
   belongs to the restart. Neither word is a verdict — a working agent and a
   deaf one are both silent (#341), so the operator judges the silence. */
function contactCell(a) {
  if (a.last_contact_s != null) return esc(dur(a.last_contact_s));
  return `<span class="dim-note">${a.uptime_s == null ? "adopted" : "never"}</span>`;
}
const CONTACT_NOTE = "contact is how long ago the agent last reached curia on its side channel, as this service process heard it. never is an agent that has said nothing since it spawned. adopted is an agent this process never spawned, so its silence belongs to the service restart.";

/* The fleet, narrow: the home's right column. `agents: null` is an unreadable
   tmux, which is the opposite fact from an idle box, so it renders as neither a
   table nor an empty line. */
function fleetTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. Every other section below is still a live reading.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents narrow">
    <tr><th>session</th><th>state</th><th>ticket</th><th>ctx</th><th>contact</th><th>up</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span></td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${contactCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td></tr>`).join("")}
  </table></div>`;
}

/* ---- the provider strip ---------------------------------------------------- */

/* One reading per provider, said once (#248). It is an account fact, not an
   agent fact, so no agent row repeats it (CONTEXT.md, usage windows).

   The bar is neutral until the window is worth attention: a fill that ran ahead
   of its own clock, and bad once the window is spent. The thin mark is where
   the clock stands, so "62% of the window at 48% of the time" is one glance. */
function meterBar(label, w) {
  const pct = Number(w.pct ?? 0);
  const elapsed = w.elapsed_pct == null ? null : Number(w.elapsed_pct);
  const cls = pct >= SPENT_PCT ? "bad" : elapsed != null && pct > elapsed ? "warn" : "";
  return `<span class="meter-row"><span class="lbl">${esc(label)}</span>
    <span class="bar"><span class="fill ${cls}" style="width:${Math.min(100, Math.max(0, pct))}%"></span>
      ${elapsed == null ? "" : `<span class="clock" style="left:${Math.min(100, Math.max(0, elapsed))}%"></span>`}</span>
    <span class="pct num">${esc(pct)}%</span></span>`;
}
function provStrip(o) {
  const usage = o.usage ?? [];
  /* A provider with no probe and no live agent says NOTHING rather than zero
     (#262): an unmeasured window and an unspent one are not the same fact. */
  if (!usage.length) return `<div class="prov-strip">No usage window is measured. A window is read from the account probe, or from a live agent's own transcript.</div>`;
  return `<div class="prov-strip">${usage.map((p) => {
    const note = spentNote(p) ?? nextReset([p]);
    return `<span class="prov"><b>${esc(p.provider)}</b>
      ${(p.windows ?? []).map((w) => meterBar(w.label, w)).join("")}
      ${note ? `<span class="pnote ${note.spent ? "hot" : ""}">${note.at ? `${esc(note.label)} rolls ${esc(clock(note.at))}` : `${esc(note.label)} is spent — no reset instant is stated`}</span>` : ""}
      <span class="pnote">from the ${esc(p.from)}${p.session ? ` of ${esc(p.session)}` : ""}</span></span>`;
  }).join("")}</div>`;
}
/* The pre-emptive hold, said once at the top (#384). It names the provider and
   the lift time, which are the two things an operator watching an idle box
   needs: WHICH lane stopped, and WHEN it starts again.

   It is not on the Needs-you list, for the reason a spent window is not: the
   test is whether an operator act ends it, and this one ends on its own clock.
   A model label on the ticket steps over it, which the line says, because that
   is the one act there is. */
function holdBanner(o) {
  const holds = o?.pre_cooling ?? [];
  if (!holds.length) return "";
  return holds.map((h) => `<div class="hold-banner">
    <span class="who">${esc(h.provider)}</span>
    <span>held before the limit — the ${esc(h.window)} window is at ${esc(h.pct)}%, and it lifts at ${esc(clock(h.reset_at))}</span>
    <span class="dim">curia dispatches on the other lanes. A <code>model:</code> label on a ticket still starts it here.</span>
  </div>`).join("");
}
/* THE SPENT WINDOW, SAID AT THE TOP (#677). It stood on the Needs-you list for
   a while, which was the wrong surface twice over: that list is where a question
   is ANSWERED, and this one was never answerable. Leaving it there also made the
   count and the column disagree, because the count knew it was not an act.

   So it is a promotion rather than a demotion. The pre-emptive hold at 93% had a
   standing banner and the window actually spent had a feed line that scrolls
   away — the harder failure was the quieter one. It is `bad` where the hold is
   `warn`, for the same reason: the hold is curia choosing to wait, and this is
   the account refusing.

   It names the SPENT window's own roll, never the provider's soonest. */
function spentBanner(o) {
  const spent = spentWindows(o?.usage);
  if (!spent.length) return "";
  return spent.map((w) => `<div class="hold-banner spent-banner">
    <span class="who">${esc(w.provider)}</span>
    <span>the ${esc(w.label)} window is spent at ${esc(w.pct)}% — ${w.at ? `it rolls at ${esc(clock(w.at))}` : "no reset instant is stated"}</span>
    <span class="dim">Nothing you can press ends this. curia dispatches on the other lanes until the window rolls.</span>
  </div>`).join("");
}
function spentWindows(usage) {
  return (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => Number(w.pct ?? 0) >= SPENT_PCT)
    .map((w) => ({ provider: p.provider, label: w.label, pct: w.pct, at: w.resets_at })));
}
/* WHEN A PROVIDER IS SPENT, ITS NOTE IS ABOUT THE SPENT WINDOW (#677). The note
   used to be marked hot by one window and worded by another: `nextReset` names
   the provider's SOONEST roll, so a 5h window spent for another four hours read
   as "7d rolls 14:20" in red. It also drops a window whose instant has already
   passed, so a spent one awaiting its next probe lost its note entirely.

   The LATEST spent window is the one the operator waits on — the rule the service
   already runs (`spentReset`, usage.mjs rule 4): two spent windows are two caps,
   and the earlier one rolling changes nothing. Where this page DIVERGES from it
   is that rule about a reset already past. Cooling drops it, because waiting for
   an instant behind us waits for nothing; the strip keeps it, because a note
   that disappears is the operator learning the lane is fine when it is not. */
function spentNote(p) {
  const spent = spentWindows([p]);
  if (!spent.length) return null;
  const dated = spent.filter((w) => w.at).sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  const w = dated[0] ?? spent[0];
  return { provider: w.provider, label: w.label, at: w.at ?? null, spent: true };
}
/* The soonest window still ahead of us, which is the one the operator waits on. */
function nextReset(usage) {
  const all = (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => w.resets_at && Date.parse(w.resets_at) > Date.now())
    .map((w) => ({ provider: p.provider, label: w.label, at: w.resets_at })));
  all.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  return all[0] ?? null;
}

/* ---- the attention list ---------------------------------------------------- */

/* Everything that wants the operator, in one column, warn-marked because that
   is what the color is for — and the ONE place an open question is answered
   (#266). The Agents table states the same questions and answers none of them:
   one answer surface, so no operator has to remember which of two they are
   looking at. */

/* The buttons a kind carries, in the vocabulary every other surface sends
   (bridge.mjs #buttons). A choice sends its option's own label; an
   approve-reject pair sends the two literals; a recommended round sends the one
   fixed word its ✅ carries (#285), and it has no ❌ beside it because the
   opposite of that tap is the operator's own reply. */
function answerButtons(r) {
  const key = "esc:" + r.id;
  const btn = (label, answer, cls) => `<button class="btn sm${cls ? " " + cls : ""}"
    ${busy(key) ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${js(answer)}')">${esc(label)}</button>`;
  const b = [];
  if (r.kind === "approve-reject" || r.kind === "preview-review") {
    b.push(btn("✅ Approve", APPROVE, "primary"), btn("❌ Reject", REJECT, "danger"));
  }
  if (r.kind === "confirm") b.push(btn("✅ Approve", APPROVE, "danger"), btn("❌ Decline", REJECT));
  if (r.kind === "free-text" && r.recommended) b.push(btn("✅ All as recommended", ALL_AS_RECOMMENDED, "primary"));
  const rows = [];
  if (b.length) rows.push(`<div class="act-row">${b.join("")}</div>`);
  if (r.kind === "choice") rows.push(choiceControls(r));
  return rows.join("");
}

/* The option bands (ADR-0025): two to four options are buttons, five to 25 are
   one select, and past 25 the numbered list stays and a reply names a number.
   Every control sends the INDEX, and the button says the marker and the
   handle while the card body keeps the consequence. */
const MAX_BUTTON_OPTIONS = 4, MAX_SELECT_OPTIONS = 25;
function choiceControls(r) {
  const opts = r.options ?? [];
  if (!opts.length) return "";
  const handle = (i) => r.option_handles?.[i] || opts[i];
  const label = (i) => `${optMarker(r, i)} · ${snip(handle(i), 80)}`;
  if (opts.length <= MAX_BUTTON_OPTIONS) {
    return `<div class="act-row">${opts.map((_, i) => `<button class="btn sm" ${busy("answer:" + r.id) ? "disabled" : ""}
      onclick="answerIndex('${js(r.id)}',${i})">${esc(label(i))}</button>`).join("")}</div>`;
  }
  if (opts.length <= MAX_SELECT_OPTIONS) {
    const id = "sel-" + r.id;
    return `<div class="act-row"><select id="${esc(id)}" ${busy("answer:" + r.id) ? "disabled" : ""}>
      <option value="">pick one…</option>${opts.map((_, i) => `<option value="${i}">${esc(label(i))}</option>`).join("")}</select>
      <button class="btn sm primary" ${busy("answer:" + r.id) ? "disabled" : ""} onclick="answerSelect('${js(r.id)}','${js(id)}')">Answer</button></div>`;
  }
  return `<ol class="opts numbered">${opts.map((o, i) => `<li><b>${esc(optMarker(r, i))}.</b> ${esc(snip(handle(i), 120))}</li>`).join("")}</ol>
    <div class="dim">Reply with ${r.typed ? "a letter or " : ""}a number.</div>`;
}

/* Every card names the file path (ADR-0025): a reply may carry files, and
   this line says where they land. */
function replyFilesRow(r) {
  const where = r.files_dir ? ` They land under <code>${esc(r.files_dir)}/</code> and reach the agent as paths.` : "";
  return `<div class="act-row files"><input type="file" id="files-${esc(r.id)}" multiple ${busy("answer:" + r.id) ? "disabled" : ""}>
    <span class="dim">A reply may carry files.${where}</span></div>`;
}

/* Free-form, on every kind. A choice can be answered in words the options do
   not carry, and a round is answered by naming the exceptions (#285) — so the
   field is never the fallback for a kind, it is the reply. */
function answerField(r) {
  const id = "ans-" + r.id;
  return `<div class="act-row">
    <input type="text" id="${esc(id)}" placeholder="answer in your own words…" ${busy("answer:" + r.id) ? "disabled" : ""}>
    <button class="btn sm primary" ${busy("answer:" + r.id) ? "disabled" : ""} onclick="answerTyped('${js(r.id)}','${js(id)}',escRecord('${js(r.id)}'))">Answer</button>
  </div>${replyFilesRow(r)}`;
}

function escCard(r) {
  return `<div class="att-item">
    <span class="who">${esc(r.agent)}</span>${esc(snip(r.prompt, 260))}
    <div class="dim">${esc(r.kind)} · ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}${r.agent_died ? " · the agent died holding it" : ""}${r.rendered ? "" : " · not rendered in Discord yet"}</div>
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview it asks about</a></div>` : ""}
    ${answerProjection(r.id)}${answerButtons(r)}${answerField(r)}${said("esc:" + r.id)}</div>`;
}

function answerProjection(id) {
  const action = actionFor({ conflict_key: "answer:" + id });
  if (!action) return "";
  const selected = action.projection?.answer;
  return `<div class="say">${selected ? `Answering: ${esc(selected)}…` : "Sending your file reply…"}</div>`;
}

/* ---- the diff digest (#355) ------------------------------------------------

   The card answers "how big is this, and what did it touch" without carrying
   the whole diff. Every number on it is a fact curia MEASURED — the agent's
   gate summary stays the only account of the work (#343).

   A review gate's digest was counted when the gate opened and rides
   `/overview`, so drawing it costs no read at all.

   THE HUNKS NEVER RIDE THE POLL. They are fetched per file, once, and cached
   here — a card the operator never opened costs nothing, and a card left open
   is not re-fetched every five seconds. */

/* key -> the card's own state. `open` starts with the top file expanded, which
   is the one thing the rank rule decides. */
var diffs = {};
/* Hunk reads the next render will start. A renderer must not fetch, so it
   records what it needs and `render()` drains this after the page is written. */
var diffQueue = [];

function diffState(key) {
  if (!diffs[key]) diffs[key] = { open: { 0: true }, hunks: {}, digest: null, error: null, read: false, loading: false };
  return diffs[key];
}

async function loadHunks(key, i, query) {
  const d = diffState(key);
  try {
    const res = await fetch(query + "&file=" + i, { headers: { accept: "application/json" }, cache: "no-store" });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the console answered " + res.status));
    d.hunks[i] = b.hunks ?? { text: null, error: b.error ?? "curia said nothing about this file" };
  } catch (e) {
    d.hunks[i] = { text: null, error: e.message };
  }
  render();
}

function drainDiffQueue() {
  const q = diffQueue;
  diffQueue = [];
  for (const j of q) loadHunks(j.key, j.i, j.query);
}

function toggleDiffFile(key, i, query) {
  const d = diffState(key);
  d.open[i] = !d.open[i];
  render();
}

const gateDiffQuery = (id) => "/api/diff?esc=" + encodeURIComponent(id);

/* The caption under a path: facts, in words, so a state is never told by color
   alone. `hunks` is absent on a change too big to have been counted, and the
   caption then says nothing rather than saying zero. */
function fileCaption(f) {
  const w = [];
  if (f.untracked) w.push("new, not committed yet");
  else if (f.status === "A") w.push("new");
  else if (f.status === "D") w.push("deleted");
  else if (f.status === "R") w.push(f.from ? "renamed from " + f.from : "renamed");
  else if (f.status === "C") w.push(f.from ? "copied from " + f.from : "copied");
  else if (f.status === "T") w.push("type changed");
  if (f.binary) w.push("binary");
  else if (f.hunks != null) w.push(f.hunks + " hunk" + (f.hunks === 1 ? "" : "s"));
  return w.join(" · ");
}

const num = (n) => (n == null ? "?" : n);

/* A patch, colored by its own vocabulary. No highlighting beyond the four line
   kinds: this is a read, not an editor. */
function hunkHtml(text) {
  return String(text ?? "").split("\n").map((l) => {
    let c = "";
    if (/^(@@)/.test(l)) c = "at";
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity |rename |old mode|new mode|Binary files)/.test(l)) c = "meta";
    else if (l.startsWith("+")) c = "add";
    else if (l.startsWith("-")) c = "del";
    return `<span class="hl ${c}">${esc(l)}</span>`;
  }).join("\n");
}

/* A file that is open. The read is asked for HERE — the first render that wants
   it queues it, and the marker it leaves behind is what stops the second render
   asking again. */
function hunkBody(key, f, i, query, prUrl) {
  const d = diffState(key);
  const h = d.hunks[i];
  const files = prUrl ? ` <a href="${esc(prUrl)}/files">Read it on GitHub</a>` : "";
  if (h === undefined) {
    d.hunks[i] = "loading";
    diffQueue.push({ key, i, query });
    return `<div class="say">reading the hunks…</div>`;
  }
  if (h === "loading") return `<div class="say">reading the hunks…</div>`;
  if (h.text == null || h.text === "") {
    return `<div class="say">curia could not read this file's hunks${h.error ? " — " + esc(h.error) : ""}.${files}</div>`;
  }
  const said = h.source === "pull-request"
    ? `<div class="say">the worktree is gone — this comes from the pull request's own diff</div>` : "";
  const missed = h.lines_total - h.lines_shown;
  const tail = h.truncated
    ? `<div class="say">the card stopped at ${h.lines_shown} lines and did not show ${missed} more.${
      prUrl ? files : " There is no pull request to read the rest on."}</div>`
    : "";
  return `${said}<pre class="hunks">${hunkHtml(h.text)}</pre>${tail}`;
}

function diffFileRow(key, f, i, query, prUrl) {
  const open = Boolean(diffState(key).open[i]);
  const cap = fileCaption(f);
  return `<div class="diff-file">
    <button class="diff-row" onclick="toggleDiffFile('${js(key)}',${i},'${js(query)}')">
      <span class="mono path">${open ? "▾" : "▸"} ${esc(f.path)}</span>
      <span class="nums"><span class="add">+${num(f.added)}</span> <span class="del">−${num(f.deleted)}</span></span>
    </button>
    ${cap ? `<div class="cap">${esc(cap)}</div>` : ""}
    ${open ? hunkBody(key, f, i, query, prUrl) : ""}
  </div>`;
}

/* Null is not empty, here as everywhere: a digest curia could not take says so
   with its reason, and a branch that really changed nothing says that instead.
   The two must never render the same. */
function diffCard(key, digest, error, query, prUrl) {
  if (!digest) {
    return `<div class="unread">curia could not count this diff${error ? " — " + esc(error) : ""}.${
      prUrl ? ` <a href="${esc(prUrl)}/files">GitHub still has it</a>` : ""}</div>`;
  }
  if (!digest.files) return `<div class="empty">No file changed against the default branch.</div>`;
  const shown = digest.list ?? [];
  return `<div class="diff">
    <div class="diff-sum"><b>${digest.files} file${digest.files === 1 ? "" : "s"}</b>
      <span class="add">+${digest.added}</span> <span class="del">−${digest.deleted}</span>${
  digest.uncommitted ? ` <span class="dim">— committed and uncommitted work together</span>` : ""}</div>
    <div class="diff-rule">ranked ${esc(digest.rank_rule ?? RANK_RULE)}${
  digest.capped ? ` · the list stops at ${shown.length} of ${digest.files} files` : ""}</div>
    ${shown.map((f, i) => diffFileRow(key, f, i, query, prUrl)).join("")}
  </div>`;
}

/* The same words the service prints on the Discord card (diffdigest.mjs
   RANK_RULE), for a digest journalled before the rule rode the record. */
const RANK_RULE = "source first, then tests, then docs, generated and lock files last — largest first inside each class";

/* The gate's three answers (#165, ADR-0010). Approve merges and resolves;
   cross-check answers NOTHING and puts a reviewer on the other provider onto
   the diff, with the builder parked where it stands; a rejection carries the
   operator's words back to the builder. */
function gateCard(r) {
  return `<div class="att-item gate">
    <span class="who">${esc(r.agent)}</span>review gate — ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}
    <div class="dim">${esc(snip(r.prompt, 220))}</div>
    ${gateControls(r)}</div>`;
}
/* The gate's answer surface, on Home's card and under the Test run's
   preview of the gate (#891): the pull request, the digest, and the three
   answers. */
function gateControls(r) {
  const id = "rej-" + r.id;
  return `${r.pull_request ? `<div class="opts"><a href="${esc(r.pull_request)}">${esc(r.pull_request)}</a></div>` : `<div class="opts">no pull request on this gate</div>`}
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview</a></div>` : ""}
    ${diffCard("esc:" + r.id, r.diff ?? null, r.diff_error ?? null, gateDiffQuery(r.id), r.pull_request)}
    ${answerProjection(r.id)}
    <div class="act-row">
      <button class="btn sm primary" ${busy("answer:" + r.id) ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${APPROVE}')">✅ Approve · merge</button>
      <button class="btn sm" ${busy("answer:" + r.id) ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${CROSS_CHECK}')">🔎 Cross-check</button>
    </div>
    <div class="act-row">
      <input type="text" id="${esc(id)}" placeholder="what to change — a rejection carries your words…" ${busy("answer:" + r.id) ? "disabled" : ""}>
      <button class="btn sm danger" ${busy("answer:" + r.id) ? "disabled" : ""} onclick="rejectGate('${js(r.id)}','${js(id)}')">Reject</button>
    </div>
    ${said("esc:" + r.id)}`;
}

/* A credential warning (#380). It sits above the spent windows because it is
   the only item on this list nobody else will fix: a window rolls by itself,
   and a grant does not. The words are the service's own measurement — what it
   could not reach and the act that ends it — so this composes no second account
   of them.

   ONE FAULT SINCE #466: a repo the app installation does not cover. The expiry
   half went with the last PAT. A warning the journal kept from before that reads
   through this shape too, which is why the message and the act are read
   defensively rather than assumed. */
function tokenCard(w) {
  return `<div class="att-item token">
    <span class="who">${esc(w.key)}</span>cannot reach ${esc(w.repo)}${w.message ? ` — ${esc(w.message)}` : ""}
    <div class="dim">${esc(w.refusal)}${w.fix ? ` — ${esc(w.fix)}` : ""}</div></div>`;
}

function dispatchHoldCard(h) {
  const cause = h.kind === "stall-watchdog"
    ? "needs operator action after automatic stall recovery stopped"
    : h.kind === "death-resume"
      ? "died after it spoke, and its automatic resume also died"
      : `died at the spawn ${esc(h.failures)} times`;
  const act = h.kind === "stall-watchdog"
    ? `type <code>resume ${esc(h.ticket)}</code> to use the surviving worktree`
    : "a <code>start</code> or <code>resume</code> you type dispatches it again and clears the count";
  return `<div class="att-item limit">
    <span class="who">${esc(ticketName(h.repo, h.ticket))}</span>${cause}, so auto-dispatch steps over it
    <div class="dim">${act}</div></div>`;
}

/* The model credentials, as ONE POINTER (#642, ADR-0027; moved here by #661).

   THE DETAIL LIVES ON THE SCREEN THAT OWNS IT. Until #661 this list carried the
   whole flow — the link, the one-time code, a card per dead consumer — because
   there was no other surface. There is one now, and saying it in both places is
   how two surfaces drift apart. So what stays here is the pointer: enough to
   know a credential wants you, and the way to the screen that says everything
   else.

   AT MOST TWO LINES, and never one that hides the other. A login in flight is
   the act, so it speaks for its own provider; a dead credential on any OTHER
   provider still gets its own line, because a running openai login is no news
   at all about a dead anthropic one. */

/* The five states the wire can carry, and what each means for the box. `valid`
   and `expiring` are silent on this list: the service refreshes inside the last
   quarter of a token's life and says nothing about work it is already doing.
   `unowned` is silent because there is nothing to press, and `unknown` because
   a credential seeded from an env file states no date — that is a fact for the
   Credentials screen, not a permanent nudge on the list an operator reads to
   find what is actually wrong. */
const CRED_STATE = {
  valid:      { tone: "ok",   says: "healthy" },
  expiring:   { tone: "ok",   says: "inside the last quarter of its life — the service refreshes it on a tick" },
  expired:    { tone: "bad",  says: "dead: no agent on this lane can take a turn", act: true },
  unreadable: { tone: "bad",  says: "on disk but unparseable — curia cannot judge its life", act: true },
  absent:     { tone: "bad",  says: "there is no credential file at all", act: true },
  unknown:    { tone: "idle", says: "seeded from an env file, so curia knows no date for it" },
  unowned:    { tone: "idle", says: "not brokered by this service" },
};
const credState = (c) => CRED_STATE[c.state] ?? { tone: "idle", says: c.why ?? "" };
/* A consumer the operator has to act on. A HELD lane counts whatever the state
   word says (#646): the access token can be perfectly valid for another two
   days and the lane still be unrecoverable. */
const credWants = (c) => Boolean(credState(c).act || c.held || c.last_error);
const deadCredentials = (o) => (o?.credentials?.consumers ?? []).filter(credWants);
const reauthWaiting = (o) => (o?.credentials?.reauth?.state === "waiting" ? o.credentials.reauth : null);

/* THE VERB NAMES THE PROVIDER (#660). Two of the three rows are anthropic, and
   a bare `reauth` on either of them would start the openai login instead. */
const credProviders = (rows) => [...new Set(rows.map((c) => c.provider).filter(Boolean))];

function credentialPointers(o) {
  const flow = reauthWaiting(o);
  const items = [];
  if (flow) {
    const mins = Math.floor((flow.seconds_left ?? 0) / 60);
    items.push(`<div class="att-item token"><span class="who">${esc(flow.provider)}</span>is signing in —
      the link${flow.typed ? "" : " and the code"} ${credLink("are on Credentials")} (${esc(mins)} min left)</div>`);
  }
  /* A dead consumer on the provider now signing in is the SAME news as the line
     above, so it is not said twice. One on any other provider is not. */
  const rest = deadCredentials(o).filter((c) => !flow || c.provider !== flow.provider);
  if (rest.length) {
    items.push(`<div class="att-item token"><span class="who">${esc(rest.map((c) => c.consumer).join(", "))}</span>the model
      credential ${rest.length > 1 ? "cannot be used" : credSays(rest[0])} — ${credLink("open Credentials")} to sign in</div>`);
  }
  return items;
}
/* One consumer, in the vocabulary the screen uses, so the pointer and the row
   cannot say different words about one fault. */
function credSays(c) {
  return c.held ? "cannot be refreshed and the lane is held" : `is ${esc(c.state)}`;
}
/* The hash IS the route (#661): the Discord alarm sends an operator to the same
   `#credentials` this link does, so somebody arriving through the front door
   pays one tap and somebody arriving through Discord pays none. */
function credLink(words) {
  return `<a href="#credentials" onclick="goto('credentials');return false">${esc(words)}</a>`;
}

/* THE ONE SOURCE OF THE ATTENTION SET (#677). `needsYou` counts what this
   returns and `attentionList` draws it, so the badge and the column cannot
   disagree about what an item is — the drift that shipped twice.

   A spent usage window is NOT here. It never was answerable, and this is the
   answer surface: it rolls on its own clock, and no operator act ends it. It
   reaches the top of Home as a banner instead, beside the pre-emptive hold.

   Waiting time and downstream work rank the answerable items. The first three
   keep their full controls, while later items remain visible as compact rows. */
function attentionItems(o) {
  const waitMinutes = (opened) => opened ? Math.max(0, Math.floor((Date.now() - Date.parse(opened)) / 60_000)) : 0;
  /* THE UNBLOCK TERM READS THE WIRE (#761). No row on `escalations` or
     `review_gate` ever carried an `unblocks` field: the service builds them in
     `wireEscalation` and the review-gate mapper, and neither writes one. What
     the service does emit is the blocked set of every map, which names its
     blockers, and the frontier's takeable items, each naming what it unblocks.
     Both are keyed on the bare ticket number: an escalation carries no repo,
     so a repo-qualified key would match nothing and score zero for ever, which
     is the defect this replaces. The bonus is FLAT: one item that unblocks
     other work is 90 minutes ahead, however many tickets wait behind it. */
  const unblockers = unblockSet(o);
  const effectiveWait = (row, gate = false) =>
    waitMinutes(row?.opened_at ?? row?.at) + (unblockers.has(String(row?.ticket)) ? 90 : 0) + (gate ? 20 : 0);
  /* Each item also carries an `id`, a one-line `line`, and a `landing` (#718):
     the handoff sheet names the next items with these and lands the operator
     on the card itself. It never carries an answer control of its own.

     Amber follows the SCORE, not the raw wait (#761): an item that ranks as
     overdue is marked as overdue, and the mark says the wait in minutes and
     names the unblock when one is there, so 90 minutes of rank is never
     unaccountable. */
  const need = (row, gate = false) => {
    const score = effectiveWait(row, gate);
    const waited = waitMinutes(row?.opened_at);
    const unblocks = unblockers.has(String(row?.ticket));
    return { score, aged: score >= 240, why: score >= 240 ? `waited ${waited} min · overdue${unblocks ? " · unblocks other work" : ""}` : (unblocks ? "unblocks other work" : "") };
  };
  const items = [
    ...credentialPointers(o).map((html, i) => ({ id: "cred-" + i, line: "a model credential wants you", landing: "credentials", html, score: 100_000, aged: false, why: "" })),
    ...(o?.escalations ?? []).map((row) => ({ id: row.id, line: `${row.agent} · ${row.kind} · ${ticketName(null, row.ticket)}: ${snip(row.prompt, 90)}`, landing: "home", html: escCard(row), ...need(row) })),
    ...(o?.review_gate ?? []).map((row) => ({ id: row.id, line: `${row.agent} · review gate · ${ticketName(null, row.ticket)}: ${snip(row.prompt, 90)}`, landing: "home", html: gateCard(row), ...need(row, true) })),
    ...(o?.token_warnings ?? []).map((row) => ({ id: "token-" + row.key, line: `${row.key} cannot reach ${row.repo}`, landing: "home", html: tokenCard(row), score: 50_000, aged: false, why: "" })),
    /* The tickets the auto loop steps over (#444). On this list where a spent
       window is not, by this list's own test: an operator act is what ends one.
       Nothing lifts it on a clock, and the ticket sits on the frontier
       untouched until somebody fixes the cause and dispatches it. */
    ...(o?.dispatch_holds ?? []).map((row) => ({ id: `hold-${row.repo}-${row.ticket}`, line: `${ticketName(row.repo, row.ticket)} is held from auto-dispatch`, landing: "home", html: dispatchHoldCard(row), score: 50_000, aged: false, why: "" })),
  ];
  items.sort((a, b) => b.score - a.score);
  return items;
}

/* The column itself. It carries no count of its own any more: the number has one
   home, `needsYou`, and a second one here is how the two drifted. */
/* The bare ticket numbers whose answer frees other work, from the two places
   the wire says so: a map's blocked children name their blockers, and a
   frontier item names what it unblocks. A repo's failed frontier read carries
   no items and adds nothing. */
function unblockSet(o) {
  const set = new Set();
  for (const m of o?.maps?.maps ?? []) for (const b of m?.blocked ?? []) for (const k of b?.blockers ?? []) if (k?.number != null) set.add(String(k.number));
  for (const r of o?.frontier?.repos ?? []) for (const i of r?.items ?? []) if (i?.unblocks?.length && i.number != null) set.add(String(i.number));
  return set;
}
function attentionList(o) {
  const items = attentionItems(o);
  return items.length
    ? items.map((item, index) => `<div class="need-rank ${index < 3 ? "full" : "compact"}${item.aged ? " aged" : ""}" id="need-${esc(item.id)}">${item.why ? `<div class="need-why">${esc(item.why)}</div>` : ""}${item.html}</div>`).join("")
    : `<div class="empty">Nothing wants you.</div>`;
}

/* ---- the handoff sheet (#718) ----------------------------------------------

   After one answer lands, the sheet says how many items still want the operator
   and names the next three, IN HOME'S ORDER: it reads `attentionItems`, the one
   source the ring and the column read, so the sheet and Home cannot rank
   differently. It re-reads on every render, so the poll after the answer
   updates it, and the answered id is left out until that poll lands.

   THE SHEET ANSWERS NOTHING. Each item is a landing on its own card, where its
   own first valid answer is taken. A sheet with answer buttons on it is a batch
   answer, and a batch answer is what ADR-0025's first-valid-wins refuses. */
function nextNeeds(o, answered) {
  return attentionItems(o).filter((item) => item.id !== answered);
}
function handoffSheet() {
  const answered = UI.act.handoff;
  if (answered == null) return "";
  const items = nextNeeds(payload?.overview, answered);
  const n = items.length;
  const next = items.slice(0, 3);
  const head = n
    ? `<strong>Answered.</strong> ${esc(n)} ${n === 1 ? "item still needs" : "items still need"} you.`
    : `<strong>Answered.</strong> Nothing else wants you.`;
  const list = next.length
    ? `<div class="dim-note">Next ${next.length === 1 ? "up" : next.length}, as Home ranks ${next.length === 1 ? "it" : "them"}. Each takes its own answer.</div>
    <div class="handoff-list">${next.map((item, i) => `<button class="handoff-item${item.aged ? " aged" : ""}" onclick="handoffGo(${i})"><span class="rank">${i + 1}</span>${esc(item.line)}</button>`).join("")}</div>`
    : "";
  return `<div class="handoff-scrim" onclick="handoffClose()"></div><div class="handoff" role="dialog" aria-label="What needs you next">
    <div class="handoff-head">${head}</div>${list}
    <div class="act-row"><button class="btn sm" onclick="handoffClose()">Close</button></div></div>`;
}
function handoffClose() {
  UI.act.handoff = null;
  render();
}
/* The tap lands on the item's own card. The sheet closes first, so the card is
   what the operator sees, with its own controls and nothing else's. */
function handoffGo(i) {
  const item = nextNeeds(payload?.overview, UI.act.handoff)[i];
  UI.act.handoff = null;
  if (!item) return render();
  goto(item.landing);
  const card = typeof document.getElementById === "function" ? document.getElementById("need-" + item.id) : null;
  if (card && typeof card.scrollIntoView === "function") card.scrollIntoView({ block: "start" });
}

/* ---- the feed -------------------------------------------------------------- */

/* The journal speaks in types and fields. The page speaks in sentences.
   A type this table does not name still reads: the fallback says the type in
   words and names whatever subject the event carries, so an event the service
   grows tomorrow is legible the day it ships instead of rendering blank. */
const who = (e) => (e.agent ? `<b>${esc(e.agent)}</b>` : "");
const tkt = (e) => (e.ticket == null || e.ticket === "" ? "" : `<span class="mono">${esc(ticketName(e.repo, e.ticket))}</span>`);
const subject = (e) => [who(e), tkt(e)].filter(Boolean).join(" · ");

const EVENTS = {
  dispatch_claimed: ["claim", "", (e) => `${tkt(e)} claimed for ${who(e)} by ${esc(e.by)}`],
  dispatch_unclaimed: ["claim", "", (e) => `${tkt(e)} unclaimed — back on the frontier`],
  /* The failed spawn and the step-over it arms (#444). Two lines, because they
     are two facts: one dispatch died, and the loop has stopped taking this
     ticket. */
  dispatch_failed: ["spawn", "bad", (e) => `${tkt(e)} died at the spawn${e.reason ? ` — ${esc(snip(e.reason, 120))}` : ""}`],
  dispatch_held: ["spawn", "warn", (e) => `auto-dispatch steps over ${tkt(e)} — it died at the spawn ${esc(e.failures)} times. A start or a resume you type clears the count`],
  agent_died_released: ["death", "bad", (e) => `${tkt(e)} returned to the frontier after its agent died following tool traffic`],
  death_resume_held: ["death", "warn", (e) => `auto-dispatch steps over ${tkt(e)} — its automatic resume also died. A start or a resume you type clears the count`],
  stall_detected: ["stall", "warn", (e) => `${who(e)} has no transcript growth and its pane confirms a stall`],
  stall_nudge_started: ["stall", "warn", (e) => `curia reserved stall nudge ${esc(e.attempt)} for ${who(e)}`],

function eventLine(e) {
  const spec = EVENTS[e.type];
  if (spec) return { tag: spec[0], cls: spec[1], html: spec[2](e) };
  const s = subject(e);
  return { tag: String(e.type ?? "event").replace(/_/g, " "), cls: "", html: s || "—" };
}
/* Newest first: the operator reads the top of the page, so the last thing that
   happened must be the first thing there. */
function feedList(events, limit) {
  const rows = [...(events ?? [])].reverse().slice(0, limit ?? undefined);
  if (!rows.length) return `<div class="empty">The journal tail is empty.</div>`;
  return `<ul class="feed-list">${rows.map((e) => {
    const l = eventLine(e);
    return `<li class="${l.cls}"><time>${esc(clock(e.ts))}</time>
      <span class="ev"><span class="tag">${esc(l.tag)}</span> — ${l.html}</span></li>`;
  }).join("")}</ul>`;
}

/* ---- home ------------------------------------------------------------------ */

function tile(v, l, warn) {
  const none = v === "—" || v === 0 ? " none" : "";
  return `<div class="tile${warn && v ? " warn" : ""}"><div class="v num${none}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
}
function statTiles(o) {
  const reset = nextReset(o.usage);
  return `<div class="stat-tiles">
    ${tile(needsYou(o), "needs you", true)}
    ${tile(o.agents == null ? "—" : o.agents.length, "agents live")}
    ${tile(o.review_gate?.length ?? 0, "review gate", true)}
    ${tile(reset ? clock(reset.at) : "—", reset ? `${reset.provider} ${reset.label} rolls` : "next reset")}
  </div>`;
}

/* The all-three home (#248): tiles across the top, the attention list left, the
   fleet right, the provider strip said once under it. */
function screenHome(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Home");
  /* The list header reads `needsYou` like the tile, the badge, and the tab title
     do. Both the count and the column come from `attentionItems`. */
  const n = needsYou(o);
  const maps = mapsOf(o);
  const event24h = (o.events ?? []).filter((event) => Date.now() - Date.parse(event.ts ?? 0) <= 86_400_000).length;
  const types = new Map();
  maps.flatMap((map) => map.takeable ?? []).forEach((item) => types.set(item.type ?? typeOf(item), (types.get(item.type ?? typeOf(item)) ?? 0) + 1));
  const typeMix = [...types.entries()].map(([type, count]) => `${count} ${esc(type)}`).join(" · ") || "no takeable work";
  const progress = maps.map((map) => {
    const total = mapTotal(map);
    const closed = map.counts?.walked ?? 0;
    const pct = total ? Math.round(closed * 100 / total) : 0;
    return `<div class="home-map"><div class="line"><span>${esc(map.title)}</span><span class="mono">${closed}/${total} · ${esc(map.counts?.fog ?? 0)} fog</span></div>
      <div class="track" aria-label="${closed} of ${total} walked"><i style="width:${pct}%"></i></div></div>`;
  }).join("") || `<div class="empty">No open map.</div>`;
  return `${head(p, "Home")}
    ${runPointer()}
    ${setupPointer()}
    ${spentBanner(o)}
    ${holdBanner(o)}
    <div class="home-verdict"><div class="verdict-ring"><div><span class="v">${esc(needsYou(o))}</span><span class="k">needs you</span></div></div>
      <div class="home-glance"><div><span class="v">${esc(o.agents?.length ?? "unknown")}</span><span class="k">agents live</span></div>
      <div><span class="v">${esc(maps.length)}</span><span class="k">open maps</span></div>
      <div><span class="v">${esc(event24h)}</span><span class="k">events in 24h</span></div></div></div>
    ${statTiles(o)}
    <div class="split-cols">
      <div>
        <div class="h-sect"><h3><span class="${n ? "hot" : ""}">Needs you</span> (${n})</h3>${attentionList(o)}</div>
        <div class="h-sect"><h3>Last events</h3>${feedList(o.events, 4)}
          <a class="more" href="#feed">all events →</a></div>
      </div>
      <div>
        <div class="h-sect"><h3>Fleet${o.agents == null ? "" : ` (${o.agents.length})`}</h3>${fleetTable(o)}</div>
        <div class="h-sect"><h3>Maps</h3>${progress}</div>
        <div class="h-sect"><h3>Momentum</h3><div class="dim-note">${event24h} events in 24h · ${esc(o.recent?.length ?? 0)} recent endings</div></div>
        <div class="h-sect"><h3>Type mix</h3><div class="dim-note">${typeMix}</div></div>
        ${provStrip(o)}
        ${deployCard(o)}
      </div>
    </div>`;
}

/* The self-deploy card (#562). The outcome used to live in one Discord line and
   a log only ssh could read; this keeps the LAST verdict on the page — with the
   sibling's own log excerpt when it failed — and the in-flight state while one
   runs. Nothing here is a verb: `deploy` stays typed-only (#270). */
function deployCard(o) {
  const d = o.deploy;
  if (!d || (!d.in_flight && !d.last && !d.verdict_read_error)) return "";
  const version = (record, side) => record?.[`${side}_version`] ?? "version unavailable";
  if (d.in_flight) {
    return `<div class="h-sect"><h3>Deploy</h3>
      <div class="unread">a deploy is in flight: ${esc(version(d.in_flight, "prev"))} → ${esc(version(d.in_flight, "next"))} — state ${esc(d.in_flight.state)}. The service restarts if it lands; this page keeps its last snapshot through that.</div></div>`;
  }
  if (d.verdict_read_error) {
    return `<div class="h-sect"><h3>Last deploy</h3>
      <div class="unread">${esc(d.verdict_read_error)}</div></div>`;
  }
  const l = d.last;
  const word = { landed: "landed", "rolled-back": "ROLLED BACK", "merge-refused": "refused", lockout: "LOCKOUT" }[l.state] ?? l.state;
  const line = `${esc(word)}: ${esc(version(l, "prev"))} → ${esc(version(l, "next"))}${l.reason ? ` — ${esc(l.reason)}` : ""}${l.resolved_at ? ` · ${esc(ago(l.resolved_at))}` : ""}${l.by ? ` · ordered by ${esc(l.by)}` : ""}`;
  const ok = l.state === "landed";
  return `<div class="h-sect"><h3>Last deploy</h3>
    <div class="${ok ? "dim-note" : "unread"}">${line}</div>
    ${!ok && l.log ? `<div class="said">${esc(l.log)}</div>` : ""}</div>`;
}

/* ---- agents ----------------------------------------------------------------

   FOCUS (#521, #709). One roster, one opened agent, and every act on an agent
   hands off to Chat: this page holds no verb of its own. The roster lists the
   agents that need the operator first, then the rest, and today's endings sit
   under it so a finished session stays findable. Every fact here is read off
   the one overview payload the tab polls; nothing is fetched on the side.

   The phone shows the roster OR the opened agent, and which one is a route
   fact (`#agents/<session>`), never a width fact — the same rule Maps follows,
   so a back press returns to the list and a reload lands where it left. */

const agentRoute = (session) => `agents/${encodeURIComponent(session)}`;
function applyAgentsRoute(parts) {
  if (parts.length >= 2) {
    UI.agents.selected = decodeURIComponent(parts[1]);
    UI.agents.open = true;
  } else {
    UI.agents.open = false;
  }
}
function agentSelect(session) {
  UI.agents.selected = session;
  UI.agents.open = true;
  location.hash = agentRoute(session);
  render();
}
function agentBack() {
  UI.agents.open = false;
  location.hash = "agents";
  render();
}

function screenAgents(p) {
  const o = p?.overview;
  const chat = `<button class="btn sm" onclick="goto('chat')">Chat</button>`;
  if (!o) return noSnapshot(p, "Agents", chat);
  const d = o.daemon ?? {};
  const live = o.agents == null ? "—" : o.agents.length;
  const needs = o.agents == null ? 0 : o.agents.filter(needsOperator).length;
  const bar = `<div class="statusbar">
    <span>agents ${esc(live)}/${esc(d.max_concurrent ?? "?")}</span>
    ${needs ? `<span class="hot">${esc(needs)} need you</span>` : ""}
    <span>auto dispatch ${d.auto_dispatch ? "on" : "off"}</span>
    <span>bridge ${esc(o.bridge)}</span>
    <span>service :${esc(d.port)} up ${esc(dur(d.uptime_s))}</span>
  </div>`;
  return `${head(p, "Agents", chat)}${bar}${agentFocus(o)}${untrackedLine(o)}`;
}

/* The gate is a need too on this page: Home keeps it as its own card, but a
   roster that buried a gated agent under calm work would hide the one session
   the operator can end. The open question still outranks it, because it is
   the one that stops the agent cold. */
const atGate = (a) => (a.waiting_on ?? []).some((w) => w.kind === REVIEW_KIND);
const needsOperator = (a) => wantsYou(a) || atGate(a);
const needRank = (a) => (wantsYou(a) ? 0 : atGate(a) ? 1 : 2);

/* The chip is a word beside the color, never the color alone (spec rule). */
function agentChip(a) {
  const asks = waitingOn(a).length;
  if (asks) return `<span class="chip warn">Ask${asks > 1 ? ` · ${esc(asks)}` : ""}</span>`;
  if (atGate(a)) return `<span class="chip warn">Gate</span>`;
  return agentDot(a);
}

/* How long the operator has been asked: the oldest open item bound to the
   agent, gate included, read off the same records Home's needs list reads. */
function waitedFor(o, a) {
  const opened = [...(o.escalations ?? []), ...(o.review_gate ?? [])]
    .filter((r) => r.agent === a.session && r.opened_at)
    .map((r) => Date.parse(r.opened_at)).filter((t) => !Number.isNaN(t));
  if (!opened.length) return null;
  return Math.max(0, Math.round((Date.now() - Math.min(...opened)) / 1000));
}

const kTokens = (n) => n == null ? "—" : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n);

/* Today's endings, newest first. An ending without a stamp is one journalled
   before the stamp rode along; it is kept rather than dropped, because losing
   an ending is worse than an old one on the list. */
const ENDED_WINDOW_S = 24 * 3600;
function endedToday(o) {
  const now = Date.now();
  return [...(o.recent ?? [])]
    .filter((r) => !r.at || now - Date.parse(r.at) <= ENDED_WINDOW_S * 1000)
    .sort((a, b) => Date.parse(b.at ?? 0) - Date.parse(a.at ?? 0));
}
function endedList(o) {
  const rows = endedToday(o).map((r) => `<div class="line"><time>${esc(clock(r.at))}</time>
    <span>${esc(r.kind)} ${esc(ticketName(r.repo, r.ticket))}</span>
    ${r.agent ? `<a href="${chatHref(r.agent)}">chat →</a>` : `<span class="dim-note">no session</span>`}</div>`).join("");
  return `<div class="agent-ended"><h3>Ended today</h3>${rows || `<div class="empty">No agent ended today.</div>`}</div>`;
}

function agentFocus(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. This is an unreadable tmux, not an idle box.</div>${endedList(o)}`;
  }
  const roster = [...o.agents].sort((a, b) => needRank(a) - needRank(b));
  if (!roster.length) return `<div class="empty">No agent is running.</div>${endedList(o)}`;
  const selected = roster.find((agent) => agent.session === UI.agents.selected) ?? roster[0];
  const open = UI.agents.open && roster.some((agent) => agent.session === UI.agents.selected);
  const rows = roster.map((agent) => {
    const wait = needsOperator(agent) ? waitedFor(o, agent) : null;
    const sub = [agent.harness, stateWord(agent), wait != null ? `waits ${dur(wait)}` : agent.ctx_pct != null ? `${agent.ctx_pct}%` : null].filter(Boolean).join(" · ");
    return `<button class="agent-pick${agent.session === selected.session ? " on" : ""}${needsOperator(agent) ? " need" : ""}" onclick="agentSelect('${js(agent.session)}')">
    ${agentChip(agent)}
    <span class="main"><b>${esc(agent.title ?? agent.session)}</b><span>${esc(sub)}</span></span>
    <span class="num">${esc(dur(agent.uptime_s))}</span></button>`;
  }).join("");
  return `<div class="agent-focus"${open ? ` data-open="${esc(selected.session)}"` : ""}>
    <div class="agent-roster"><h3>Agents</h3>${rows}<div class="phone-hint dim-note">tap an agent to open it</div></div>
    ${agentDetail(o, selected)}
    ${endedList(o)}</div>`;
}

function agentDetail(o, a) {
  const story = [...(o.events ?? [])]
    .filter((event) => event.agent === a.session || (event.ticket != null && String(event.ticket) === String(a.ticket)))
    .reverse().slice(0, 8);
  const storyRows = story.map((event) => {
    const line = eventLine(event);
    return `<div class="line"><time>${esc(clock(event.ts))}</time><span>${line.html}</span></div>`;
  }).join("") || `<div class="empty">No recent story is on this reading.</div>`;
  const wait = needsOperator(a) ? waitedFor(o, a) : null;
  const state = needsOperator(a)
    ? `<span class="needs">${esc(stateWord(a))}</span> · waiting for you${wait != null ? ` · waits ${esc(dur(wait))}` : ""}`
    : `<span>${esc(stateWord(a))}</span> · ${a.last_contact_s != null ? `contact ${esc(dur(a.last_contact_s))} ago` : a.uptime_s == null ? "adopted after a restart" : "no contact yet"}`;
  const meter = (v, k, cls) => `<div><span class="v${cls ? ` ${cls}` : ""}">${v}</span><span class="k">${k}</span></div>`;
  const ctx = a.ctx_pct == null ? "—" : `${esc(a.ctx_pct)}%${a.ctx_over ? ` <span class="over">⚠</span>` : ""}`;
  const gate = (o.review_gate ?? []).find((r) => r.agent === a.session);
  const links = [
    `<a href="${chatHref(a.session)}">open Chat →</a>`,
    a.ticket ? `<a href="https://github.com/${esc(a.repo)}/issues/${esc(a.ticket)}">ticket →</a>` : "",
    gate?.pull_request ? `<a href="${esc(gate.pull_request)}">pull request →</a>` : "",
  ].filter(Boolean).join("");
  return `<article class="agent-detail">
      <a class="agent-back" href="#agents" onclick="agentBack();return false">← agents</a>
      <span class="eyebrow">Selected</span><div class="agent-title">${esc(a.title ?? a.session)}</div>
      <div class="dim-note">${esc(ticketName(a.repo, a.ticket))} · ${esc(a.session)}${a.reviewer ? " · reviewer" : ""}${a.tmux_live ? "" : " · no tmux session"}</div>
      <div class="state-line">${state}</div>
      <div class="agent-meters">
        ${meter(esc(a.harness ?? "—"), "lane")}
        ${meter(esc(a.model ?? "unknown"), "model")}
        ${meter(esc(a.effort ?? "—"), "effort")}
        ${meter(ctx, "context", a.ctx_pct >= 80 ? "hot" : "")}
        ${meter(esc(kTokens(a.ctx_tokens)), "tokens")}
        ${meter(esc(dur(a.uptime_s)), "elapsed")}
        ${meter(contactCell(a), "contact")}</div>
      <div class="agent-story"><h3>Story</h3>${storyRows}</div>
      <div class="links" style="margin-top:16px">${links}</div>
      <div class="dim-note" style="margin-top:12px">Notes, cancels and the terminal live in Chat. ${esc(CONTACT_NOTE)}</div></article>`;
}

/* A tmux session curia does not track. It is an anomaly reconcile owns, so the
   page states it and spends no color on it. */
function untrackedLine(o) {
  if (!o.untracked?.length) return "";
  return `<p class="dim-note">Untracked sessions: <span class="mono">${o.untracked.map((s) => esc(s)).join(", ")}</span>. Reconcile adopts or sweeps these.</p>`;
}

/* ---- maps -----------------------------------------------------------------

   ONE MAP READING (#700). Every map fact on this page comes from
   `overview.maps` — the complete snapshot `readMapSnapshot` computes (#687) —
   and from nowhere else. `overview.frontier` is the takeable reading the start
   controls sit on; it says nothing about walked work, blockers, or fog.

   The snapshot is three fields: `computed_at`, `maps`, and `error`. Null maps
   with an error is NOT an empty map set — it is a reading curia could not take,
   and the page says which of the two it is holding. */

function mapSnapshot(o) {
  return o?.maps ?? { computed_at: null, maps: null, error: null };
}
function mapsOf(o) {
  return mapSnapshot(o).maps ?? [];
}

function startActionFor(repo, number) {
  const action = actionFor({ target: `${repo}#${number}` });
  return action?.kind === "dispatch" ? action : null;
}

function projectedMap(map) {
  const inFlight = (map.in_flight ?? []).map((item) => ({
    ...item, action: startActionFor(map.repo, item.number),
  }));
  const promoted = [];
  const takeable = (map.takeable ?? []).filter((item) => {
    const action = startActionFor(map.repo, item.number);
    if (!action || action.status === "refused" || action.status === "failed") return true;
    if (!inFlight.some((running) => String(running.number) === String(item.number))) {
      promoted.push({ ...item, action });
    }
    return false;
  });
  if (!promoted.length && takeable.length === (map.takeable ?? []).length) {
    return { ...map, in_flight: inFlight };
  }
  return {
    ...map,
    in_flight: [...inFlight, ...promoted],
    takeable,
    counts: {
      ...map.counts,
      in_flight: Number(map.counts?.in_flight ?? inFlight.length) + promoted.length,
      takeable: Math.max(0, Number(map.counts?.takeable ?? takeable.length) - promoted.length),
    },
  };
}

function reconcileStartActions(o) {
  for (const action of [...actions.values()]) {
    if (action.kind !== "dispatch" || !TERMINAL_ACTION.has(action.status)) continue;
    const split = /^(.*)#([^#]+)$/.exec(action.target);
    if (!split) continue;
    const [, repo, ticket] = split;
    const key = `start:${action.target}`;
    if (action.status === "refused" || action.status === "failed") {
      UI.act.said = { key, text: action.reason ?? (action.status === "refused" ? "Start was refused." : "Start failed."), ok: false };
      finishAction(action.action_id);
      continue;
    }
    const running = agentOn(o, repo, ticket)
      || mapsOf(o).some((map) => map.repo === repo
        && (map.in_flight ?? []).some((item) => String(item.number) === ticket));
    if (running) finishAction(action.action_id);
  }
}

function startPhase(action) {
  if (!action) return null;
  if (action.status === "pending") return "starting";
  if (action.status === "accepted") return "claimed · opening the thread";
  if (action.status === "progress") return action.progress ?? "preparing the agent workspace";
  if (action.status === "confirmed") return "running";
  return null;
}
/* The fog is a list of facts, each with its own text — never a bare string,
   so a later reading can hang more on a patch without moving this page. */
const fogText = (note) => String(note?.text ?? note ?? "");
/* The snapshot names each ticket's type, and a ticket with no `wayfinder:`
   label has none. `untyped` is what the page says then, and it is a word about
   the label rather than a type guessed from somewhere else. */
const mapType = (item) => item?.type ?? "untyped";

function mapNeeds(o, map) {
  const tickets = new Set([
    ...(o.escalations ?? []).map((row) => String(row.ticket)),
    ...(o.review_gate ?? []).map((row) => String(row.ticket)),
    ...(o.agents ?? []).filter(wantsYou).map((agent) => String(agent.ticket)),
  ]);
  return (map.in_flight ?? []).some((item) => tickets.has(String(item.number)));
}

function visibleMaps(o) {
  return mapsOf(o)
    .filter((map) => UI.maps.repo === "all" || map.repo === UI.maps.repo)
    .sort((a, b) => Number(mapNeeds(o, b)) - Number(mapNeeds(o, a))
      || Date.parse(b.latest_event_at ?? 0) - Date.parse(a.latest_event_at ?? 0))
    .map(projectedMap);
}

function selectedMap(o, maps) {
  const chosen = UI.maps.selected;
  const map = maps.find((row) => row.repo === chosen?.repo && String(row.number) === String(chosen?.map));
  return map ?? maps[0] ?? null;
}

const MAP_GROUPS = [
  ["walked", "done"],
  ["in_flight", "running"],
  ["takeable", "frontier"],
  ["blocked", "blocked"],
  ["fog", "fog"],
];

function mapBand(o, map, hero = false) {
  const total = Math.max(1, MAP_GROUPS.reduce((sum, [key]) => sum + Number(map.counts?.[key] ?? 0), 0));
  return `<div class="map-band${hero ? " map-band-hero" : ""}" style="grid-template-columns:repeat(${total},minmax(0,1fr))" aria-label="${esc(total)} map items">${MAP_GROUPS.map(([key, word]) => {
    const count = Number(map.counts?.[key] ?? 0);
    if (!count) return "";
    const needs = key === "in_flight" && mapNeeds(o, map);
    return `<span class="map-seg ${key.replace("_", "-")}${needs ? " needs" : ""}" style="grid-column:span ${esc(count)}"
      aria-label="${esc(count)} ${esc(word)}">${esc(count)}<span>${needs ? "running · needs you" : esc(word)}</span></span>`;
  }).join("")}</div>`;
}

function mapDetailRows(o, map, group) {
  if (group === "fog") {
    return (map.fog ?? []).map((note) => `<div class="map-detail-row">${esc(fogText(note))}<span class="sub">not yet specified</span></div>`).join("")
      || `<div class="empty">No retained fog.</div>`;
  }
  const items = map[group] ?? [];
  /* An empty frontier is a sentence, not a blank (#588). The way is elsewhere,
     and saying where beats leaving the operator to guess it. */
  if (!items.length) {
    if (group === "takeable") return `<div class="empty">Nothing is on the frontier. The way is running or behind a blocker.</div>`;
    const word = MAP_GROUPS.find(([key]) => key === group)?.[1] ?? group.replace("_", " ");
    return `<div class="empty">Nothing is ${esc(word)}.</div>`;
  }
  return items.map((item) => {
    const issue = `<a href="https://github.com/${esc(map.repo)}/issues/${esc(item.number)}">#${esc(item.number)}</a> ${esc(item.title)}`;
    if (group === "takeable") {
      /* A PAUSED MAP OFFERS NO START. `wayfinder:deferred` means the map is
         paused, and a pause is only ever ended by hand (github.mjs
         `mapCloseBlockers`). The tickets stay listed, because hiding a pause
         is how a pause becomes a disappearance - it is the BUTTON that goes. */
      const start = map.deferred
        ? `<div class="act-row"><span class="dim-note">this map is paused (<span class="mono">wayfinder:deferred</span>), and a pause is only ever ended by hand</span></div>`
        : startRow(o, map.repo, item, false);
      /* LEVEL TWO (#768). The snapshot names what each takeable ticket
         directly unblocks, one level down and never a closure, so the
         operator reads which press opens the most of this way. A ticket that
         opens nothing says so, because a missing line reads as an unread one. */
      const kids = item.unblocks?.length
        ? `<div class="fr-kids">${item.unblocks.map((kid) => `<div class="fr-kid"><a href="https://github.com/${esc(map.repo)}/issues/${esc(kid.number)}"><span class="t">#${esc(kid.number)}</span></a>${esc(kid.title)}</div>`).join("")}</div>`
        : "";
      const model = item.model ? `routed to ${esc(item.model)}` : "the routed model is not on this reading";
      return `<div class="map-detail-row frontier-ticket"><span class="frontier-copy">${issue}
      <span class="frontier-meta">${esc(mapType(item))} · ${model} · ${
        item.unblocks?.length ? `unblocks ${esc(item.unblocks.length)}` : "unblocks nothing yet"}</span>${kids}</span>${start}</div>`;
    }
    if (group === "blocked") {
      /* EVERY blocker, never a count of them: the operator's next question is
         which ticket to take, and only the names answer it. */
      const blockers = (item.blockers ?? []).map((blocker) => `#${esc(blocker.number)} ${esc(blocker.title)}`).join(", ");
      return `<div class="map-detail-row">${issue}<span class="sub">behind ${blockers || "an unread blocker"}</span></div>`;
    }
    if (group === "in_flight") {
      /* The snapshot names the agent on the ticket and the model it runs on
         (#687); the fleet reading is the fallback when it holds neither. */
      const agent = item.agent ?? agentOn(o, map.repo, item.number);
      const who = (item.assignees ?? []).join(", ");
      return `<div class="map-detail-row">${issue}<span class="sub">${
        startPhase(item.action) ?? (mapNeeds(o, { ...map, in_flight: [item] }) ? "needs you" : "working")}${
        who ? ` · ${esc(who)}` : ""}${agent?.model ? ` · ${esc(agent.model)}` : ""}</span></div>`;
    }
    return `<div class="map-detail-row">${issue}<span class="sub">done</span></div>`;
  }).join("");
}

/* The detail half carries every state in one rail. The desktop keeps the map
   selectors beside it; the phone opens this same element on a map route. */
function mapDetail(o, map) {
  if (!map) return "";
  return `<aside class="map-detail">
    <a class="map-back" href="#maps" onclick="mapBack();return false">\u2039 maps</a>
    <h3>${esc(map.title)} · full map</h3>${mapBand(o, map, true)}<div class="map-rail">${MAP_GROUPS.map(([group, word]) => {
      const needs = group === "in_flight" && mapNeeds(o, map);
      const working = group === "in_flight" && (map.in_flight ?? []).some((item) => item.action ?? item.agent ?? agentOn(o, map.repo, item.number));
      const count = Number(map.counts?.[group] ?? 0);
      return `<section class="map-stage ${group.replace("_", "-")}${needs ? " needs" : ""}" style="--stage:${
        group === "walked" ? "var(--map-done-ink)" : group === "in_flight" ? "var(--map-run-line)" : group === "takeable" ? "var(--accent)" : group === "blocked" ? "color-mix(in srgb, var(--bad) 72%, var(--ink-dim))" : "var(--ink-dim)"}">
        <header class="map-stage-head"><b>${esc(word)}</b><span class="map-stage-status">${
          group === "in_flight" && working ? `<span class="activity">working</span>` : ""}${needs ? `<span class="needs-badge">needs you</span>` : ""}<span>${esc(count)} ${esc(word)}</span></span></header>
        <div class="map-detail-list ${group.replace("_", "-")}">${mapDetailRows(o, map, group)}</div></section>`;
    }).join("")}</div></aside>`;
}

/* The walked fraction is the snapshot's own total (#687), never a sum this
   page adds up. Fog is not part of it: an uncharted patch is not a ticket, so
   counting it would move the denominator every time the fog was written. */
const mapTotal = (map) => map.counts?.total ?? ["walked", "in_flight", "takeable", "blocked"]
  .reduce((sum, key) => sum + Number(map.counts?.[key] ?? 0), 0);

function screenMaps(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Maps");
  const snap = mapSnapshot(o);
  /* A reading curia could not take is not an empty map set, and this page must
     not draw one as the other. The error stands with the last stamp beside it,
     so the operator knows how old the maps under it are. */
  const failed = snap.error
    ? `<div class="unread">The map snapshot could not be read \u2014 ${esc(snap.error)}. This is not an empty map set: there may be open maps curia cannot see right now.</div>`
    : "";
  if (!snap.computed_at && !snap.maps) {
    return `${head(p, "Curia \u00b7 Maps")}${failed}${
      failed ? "" : `<div class="later">No map snapshot has been computed yet. Reconcile computes it on the credentials that pass already holds, and stamps the instant it did.</div>`}`;
  }
  const maps = visibleMaps(o);
  const selected = selectedMap(o, maps);
  const repos = [...new Set(mapsOf(o).map((map) => map.repo))];
  const filters = `<div class="map-filter"><button class="${UI.maps.repo === "all" ? "on" : ""}" onclick="mapRepo('all')">all projects</button>
    ${repos.map((repo) => `<button class="${UI.maps.repo === repo ? "on" : ""}" onclick="mapRepo('${js(repo)}')">${esc(shortRepo(repo))}</button>`).join("")}
    <span class="dim-note">computed ${esc(ago(snap.computed_at))}</span></div>`;
  const cards = maps.map((map) => {
    const total = mapTotal(map);
    const walked = map.counts?.walked ?? 0;
    const on = selected?.repo === map.repo && String(selected?.number) === String(map.number);
    return `<section class="map-card${on ? " on" : ""}" role="button" tabindex="0" aria-pressed="${on}" onclick="mapSelect('${js(map.repo)}','${js(map.number)}')" onkeydown="mapCardKey(event,'${js(map.repo)}','${js(map.number)}')"><div class="map-head">
      <div class="map-fraction">${esc(walked)}<span class="total">/${esc(total)}</span>${map.counts?.fog ? `<span class="fog-count">+${esc(map.counts.fog)}</span>` : ""}</div>
      <div class="map-title"><b>${esc(map.title)}</b><span class="meta">${esc(map.repo)} · ${esc(ago(map.latest_event_at))} · <a href="${esc(mapUrl(map))}" onclick="event.stopPropagation()">#${esc(map.number)}</a>${map.deferred ? " · paused" : ""}</span></div>
      </div>${mapBand(o, map)}</section>`;
  }).join("") || `<div class="empty">No open map matches this project.</div>`;
  return `${head(p, "Curia \u00b7 Maps")} ${filters}${failed}<div class="map-layout"${
    UI.maps.open && selected ? " data-open" : ""}><div class="map-cards">${cards}</div>${mapDetail(o, selected)}</div>`;
}

const mapUrl = (map) => map.url ?? `https://github.com/${map.repo}/issues/${map.number}`;

/* THE DETAIL IS A ROUTE (#700). `#maps/<owner>/<name>/<number>` names one map,
   so the phone's full rail has a back, a refresh, and a link an operator can
   send. The optional group keeps older feed links and bookmarks working; the
   full rail ignores it. `#maps` on its own is the list. */
const mapRoute = (repo, number, group) => `maps/${repo}/${number}${group ? `/${group}` : ""}`;

function applyMapRoute(parts) {
  if (parts.length >= 4) {
    UI.maps.selected = { repo: `${parts[1]}/${parts[2]}`, map: parts[3] };
    UI.maps.open = true;
  } else {
    UI.maps.open = false;
  }
}

function mapSelect(repo, map) {
  UI.maps.selected = { repo, map };
  UI.maps.open = true;
  location.hash = mapRoute(repo, map);
  render();
}
function mapCardKey(event, repo, map) {
  if (event.target !== event.currentTarget || (event.key !== "Enter" && event.key !== " ")) return;
  event.preventDefault();
  mapSelect(repo, map);
}
function mapBack() {
  UI.maps.open = false;
  location.hash = "maps";
  render();
}
function mapRepo(repo) {
  UI.maps.repo = repo;
  UI.maps.selected = null;
  UI.maps.open = false;
  location.hash = "maps";
  render();
}

/* ---- the start control --------------------------------------------------- */

/* The ticket type is the `wayfinder:` label and nothing else — a ticket with no
   such label has no type, and saying so beats guessing one from another label. */
function typeOf(item) {
  /* The map snapshot names the type outright (#700); the frontier items carry
     labels instead. Either way the answer is the `wayfinder:` label and
     nothing else, and a ticket without one is untyped rather than guessed. */
  if (item?.type) return String(item.type);
  const l = (item.labels ?? []).find((x) => String(x).startsWith("wayfinder:"));
  return l ? String(l).slice("wayfinder:".length) : "untyped";
}
const shortRepo = (r) => String(r).split("/").pop();

/* Start (#266). The dispatch order — claim, prepare, spawn — is `start`'s own,
   and the reply that comes back is curia's sentence about what it did.

   Two facts ride beside the button. The ROUTED MODEL is the service's
   `resolveModel` answer, joined onto the item by reconcile, so the operator
   knows which account this press spends before spending it. And an agent
   ALREADY on this ticket replaces the button, because a second start on it is
   refused anyway and a button that only ever refuses is a worse way to say so.

   When the fleet could not be read, neither is claimed: the button stands, and
   the line under it says curia cannot tell. Null is not empty here either. */
function agentOn(o, repo, number) {
  if (o?.agents == null) return undefined;
  return o.agents.find((a) => String(a.ticket) === String(number) && (!a.repo || a.repo === repo)) ?? null;
}
function startRow(o, repo, n, showModel = true) {
  const live = agentOn(o, repo, n.number);
  const key = `start:${repo}#${n.number}`;
  if (live) return `<div class="act-row"><span class="dim-note mono">⧗ dispatched — ${esc(live.session)}</span></div>`;
  const model = n.model
    ? `<span class="dim-note mono">→ ${esc(n.model)} (${esc(typeOf(n))} default)</span>`
    : `<span class="dim-note">the routed model is not on this reading</span>`;
  return `<div class="act-row map-start">
      <button class="btn sm primary" ${busy(key) ? "disabled" : ""} onclick="startTicket('${js(repo)}','${js(n.number)}')">${
