  const options = r.options?.length ? `<div class="meta">options: ${esc(r.options.join(" | "))}</div>` : "";
  let ans;
  if (r.status === "answered") {
    ans = `<div class="ans">${esc(receiptLine({ by: r.answered_by, via: r.answered_via, at: r.closed_at, answer: r.answer }))}</div>`;
  } else if (r.status === "open") {
    ans = `<div class="meta">waiting on you</div>`;
  } else {
    ans = `<div class="meta">${esc(r.status)} ${clock(r.closed_at)}</div>`;
  }
  return `<div class="item chat-esc" id="esc-h-${esc(r.id)}"><div class="kind">${r.status === "open" ? "⏳" : "❓"} ${esc(r.kind)} (${esc(r.id)}) · asked ${clock(r.opened_at)}</div>
    <div class="q">${esc(r.prompt ?? "")}</div>${options}${ans}</div>`;
}

/* #715: a measured native choice is a typed card. An unmeasured dialog keeps
   the guard and the terminal fallback. */
function chatDialog(c) {
  const terminal = `<a href="/terminal/?arg=${encodeURIComponent(c.session)}" target="_blank">Open the terminal</a>`;
  if (c.receipt) {
    return `<div class="chat-dialog card">✔ answered · ${esc(c.receipt.by)} · ${clock(c.receipt.at)} · ${esc(c.receipt.marker)} · ${esc(c.receipt.answer)}</div>`;
  }
  const d = c.dialog;
  if (!d) return "";
  if (!d.card) {
    return `<div class="chat-dialog">⚠ A native dialog owns the terminal. ${esc(d.reason || "Curia cannot parse its controls.")} ${terminal}
      <div class="dialog-note">Chat sends stay blocked while this dialog is open.</div></div>`;
  }
  const dialogAction = actionFor({ conflict_key: `dialog:${c.session}:${d.card.id}` });
  const options = d.card.options.map((o) => `<button class="btn sm ${o.index === d.card.selected_index ? "selected" : ""}" ${dialogAction ? "disabled" : ""}
      onclick="doDialogAnswer('${js(d.card.id)}', ${Number(o.index)})">${esc(o.marker)} · ${esc(o.handle || o.label)}${o.index === d.card.selected_index ? " · selected now" : ""}</button>`).join("");
  const progress = dialogAction
    ? `<div class="dialog-note">${esc(dialogAction.progress || `Choosing ${dialogAction.projection?.marker ?? ""} · ${dialogAction.projection?.answer ?? ""}…`)}</div>`
    : "";
  return `<div class="chat-dialog card"><div class="dialog-kind">native dialog · choice</div>
    <strong class="dialog-headline">${esc(d.card.headline)}</strong>
    <div class="dialog-options">${options}</div>
    ${progress}<div class="dialog-note">The first valid tap wins. The same receipt reaches every open Chat.</div>${terminal}${said("chat-dialog")}</div>`;
}

function chatComposer(c, role, ended) {
  if (ended) return `<div class="composer ended"><span class="dim-note">${esc(ENDED_SENTENCE(c.session))}</span></div>`;
  const k = `turn:${chatConversationKey(c.session)}`;
  const messageAction = actionFor({ conflict_key: k });
  const messageProgress = messageAction
    ? `<div class="dialog-note">${esc(messageAction.progress || (messageAction.kind === "chat-take-back"
      ? messageAction.projection?.mode === "note-recovery" ? "Recovering your note…" : "Rewinding the conversation…"
      : "Sending your message…"))}</div>`
    : "";
  const paneKey = actionFor({ conflict_key: `pane:${c.session}` });
  return `<div class="composer">
    ${c.mirror ? `<div class="dim-note">the other device is typing…</div>` : ""}
    <textarea id="chat-box" rows="1" placeholder="type here, shared box" oninput="chatTyped(this.value)" onkeydown="chatKey(event)">${esc(c.draft)}</textarea>
    <div class="composer-row">
      <button class="btn sm" ${messageAction ? "disabled" : ""} onclick="doTakeBack()" title="take back your last message">${messageAction?.kind === "chat-take-back" ? "Rewinding…" : "Take back"}</button>
      ${role === "ticket" ? `<button class="btn sm" ${paneKey ? "disabled" : ""} onclick="doChatKey('escape')" title="send Escape to the agent">${paneKey ? "Sending Esc…" : "Esc"}</button>` : ""}
      <span class="grow"></span>
      <button class="btn primary" ${messageAction ? "disabled" : ""} onclick="doChatSend()">${messageAction ? "Sending…" : "Send"}</button>
    </div>${messageProgress}${said(k)}${said("chat-take-back")}${said("chat-key")}</div>`;
}

function chatConversationKey(session) {
  const match = /^curia-(console-[1-9][0-9]*)$/.exec(String(session ?? ""));
  return match ? match[1] : String(session ?? "");
}

/* The shared composer (#73): the draft goes to the other device, 200ms after
   the last keystroke. The value never rides the DOM across a render. */
let chatDraftTimer = null;
function chatTyped(value) {
  chat.draft = value;
  chat.lastEdit = Date.now();
  chat.mirror = false;
  clearTimeout(chatDraftTimer);
  chatDraftTimer = setTimeout(() => chatPost("/draft", { text: chat.draft }), 200);
}
function chatKey(e) {
  /* Desktop: Enter sends, Shift+Enter newlines. On a phone the on-screen return
     key inserts a newline and the Send button is the only submit. */
  const coarse = typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
  if (e.key === "Enter" && !e.shiftKey && !coarse) { e.preventDefault(); doChatSend(); }
}
function chatPost(p, extra) {
  return fetch(p, {
    method: "POST",
    headers: { "content-type": "application/json", accept: "application/json" },
    body: JSON.stringify({ session: chat.session, client: chat.client, ...extra }),
  }).then((r) => r.json()).catch((e) => ({ error: e.message }));
}
/* The room's presses ride the same busy/said seam every other page uses: one
   press in flight, its answer shown at the control it came from. A send that
   failed keeps the words in the composer. */
async function doChatSend() {
  const text = chat.draft;
  if (!text.trim()) return;
  if (chatEnded()) return refuse("chat-send", ENDED_SENTENCE(chat.session));
  const conversation = chatConversationKey(chat.session);
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "chat-message", target: conversation,
    conflict_key: `turn:${conversation}`, projection: { text },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/send", { text, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcileChatMessageActions();
  if (!r.action && r.error) {
    UI.act.said = { key: `turn:${conversation}`, ok: false, text: `Curia could not check the outcome yet: ${r.error}` };
  }
  chat.stick = true;
  render();
}
function reconcileChatMessageActions() {
  for (const action of [...actions.values()]) {
    if (!["chat-message", "chat-message-correction"].includes(action.kind)) continue;
    if (action.target !== chatConversationKey(chat.session)) continue;
    const outcome = action.receipt?.outcome;
    if (["delivered", "sent_unconfirmed"].includes(outcome) || action.status === "confirmed") {
      if (chat.draft === action.projection?.text) chat.draft = "";
    }
    if (!TERMINAL_ACTION.has(action.status)) continue;
    if (action.status !== "confirmed") {
      UI.act.said = { key: action.conflict_key, ok: false, text: action.reason || "Curia could not deliver the message." };
    }
    finishAction(action.action_id);
  }
}
async function doTakeBack(target = null) {
  if (chatEnded()) return refuse("chat-take-back", ENDED_SENTENCE(chat.session));
  const warning = "Take back your last message? Curia rewinds the conversation, but commands, commits, and other effects that already ran still stand.";
  if (typeof confirm === "function" && !confirm(warning)) return null;
  const conversation = chatConversationKey(chat.session);
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "chat-take-back", target: conversation,
    conflict_key: `turn:${conversation}`,
    projection: { mode: target?.kind === "note" ? "note-recovery" : "rewind" },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/take-back", { target, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcileChatTakeBackActions();
  if (actionFor({ action_id: actionId }) && !r.action && r.error) {
    UI.act.said = { key: `turn:${conversation}`, ok: false, text: `Curia could not check the take back yet: ${r.error}` };
  }
  render();
}
function reconcileChatTakeBackActions() {
  const conversation = chatConversationKey(chat.session);
  for (const action of [...actions.values()]) {
    if (action.kind !== "chat-take-back" || action.target !== conversation || !TERMINAL_ACTION.has(action.status)) continue;
    const receipt = action.receipt;
    if (action.status === "confirmed" && receipt) {
      chat.draft = receipt.composer || "";
      const taken = receipt.take_back;
      chatNote([taken?.headline, taken?.landing, ...(taken?.remains || [])].filter(Boolean).join(" "));
    } else {
      UI.act.said = { key: action.conflict_key, ok: false, text: action.reason || "Curia could not take back the message." };
    }
    settledChatTakeBackActions.add(action.action_id);
    finishAction(action.action_id);
  }
}
function recoverTerminalChatTakeBackActions(observed) {
  const conversation = chatConversationKey(chat.session);
  for (const evidence of observed ?? []) {
    if (evidence?.kind !== "chat-take-back" || evidence.target !== conversation
      || !TERMINAL_ACTION.has(evidence.status) || settledChatTakeBackActions.has(evidence.action_id)
      || actionFor({ action_id: evidence.action_id })) continue;
    actions.set(String(evidence.action_id), { ...evidence, action_id: String(evidence.action_id) });
  }
}
async function doChatKey(key) {
  const session = chat.session;
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "pane-key", target: session,
    conflict_key: `pane:${session}`, projection: { key },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/key", { key, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcilePaneKeyActions();
  if (actionFor({ action_id: actionId }) && !r.action) {
    finishAction(actionId);
    if (r.error) UI.act.said = { key: "chat-key", ok: false, text: r.error };
  }
  render();
}
function reconcilePaneKeyActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "pane-key" || !TERMINAL_ACTION.has(action.status)) continue;
    if (action.target === chat.session && action.status !== "confirmed") {
      UI.act.said = { key: "chat-key", ok: false, text: action.reason || "Curia could not send the pane key." };
    }
    finishAction(action.action_id);
  }
}
async function doDialogAnswer(dialog, index) {
  const session = chat.session;
  const option = chat.dialog?.card?.id === dialog
    ? chat.dialog.card.options.find((candidate) => candidate.index === index)
    : null;
  if (!option) return;
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "native-dialog-answer", target: `${session}:${dialog}`,
    conflict_key: `dialog:${session}:${dialog}`,
    projection: { index, marker: option.marker, answer: option.handle || option.label },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/dialog-answer", { dialog, index, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcileDialogAnswerActions();
  if (actionFor({ action_id: actionId }) && !r.action) {
    finishAction(actionId);
    if (r.receipt) chatReceive("dialog", { up: false, receipt: r.receipt });
    else UI.act.said = { key: "chat-dialog", ok: false, text: r.error || "Curia could not answer this native dialog." };
  }
  render();
}
function reconcileDialogAnswerActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "native-dialog-answer" || !TERMINAL_ACTION.has(action.status)) continue;
    const receipt = action.receipt;
    if (receipt && action.target === `${chat.session}:${receipt.dialog}`) {
      chatReceive("dialog", { up: false, receipt });
    } else if (action.target.startsWith(`${chat.session}:`) && action.status !== "confirmed") {
      UI.act.said = { key: "chat-dialog", ok: false, text: action.reason || "Curia could not answer this native dialog." };
    }
    finishAction(action.action_id);
  }
}
function chatScrolled(el) {
  chat.stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}
/* After a render: the log follows its tail unless the reader scrolled up. */
function chatAfterRender() {
  const el = document.getElementById("chat-log");
  if (el && chat.stick) el.scrollTop = el.scrollHeight;
}

async function doGitHubAppRefresh() {
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "github-app-installations", target: "github-app-installations",
    conflict_key: "github-app:installations", projection: { phase: "reading" },
  });
  if (!action) return null;
  UI.act.said = null;
  render();
  return githubAppAction("github-app-refresh", "/api/github-app/refresh", actionId, {});
}

async function doGitHubAppSetup() {
  const name = document.getElementById("github-app-name")?.value?.trim();
  if (!name) return refuse("github-app", "Enter a GitHub App name.");
  return startGitHubApp(name, "settings");
}

/* The GitHub card's one press (#875): the name is the card's safe checkpoint
   for a reopen, and the handoff is the same manifest flow the Settings
   section runs, told to land back on Setup. */
async function doSetupGitHubApp() {
  const name = document.getElementById("setup-github-app-name")?.value?.trim();
  if (!name) return refuse("github-app", "Enter a GitHub App name.");
  await rememberSetupProgress("github", { app_name: name });
  return startGitHubApp(name, "setup");
}

/* The manifest handoff (#694). The service prepares the manifest and the
   state; the browser posts the manifest to GitHub's own page, where the
   operator reviews it and presses once. Nothing about the account crosses
   here. `screen` is where GitHub's redirect lands afterwards. */
async function startGitHubApp(name, screen) {
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "github-app-setup", target: "github-app-setup",
    conflict_key: "github-app:setup", projection: { phase: "opening-github" },
  });
  if (!action) return null;
  UI.act.said = null;
  render();
  const out = await githubAppAction("github-app", "/api/github-app/start", actionId, { name, screen });
  const setup = out?.setup;
  if (!setup?.action || !setup?.manifest) return;
  const form = document.createElement("form");
  form.method = "POST";
  form.action = setup.action;
  const manifest = document.createElement("input");
  manifest.type = "hidden";
  manifest.name = "manifest";
  manifest.value = JSON.stringify(setup.manifest);
  form.appendChild(manifest);
  document.body.appendChild(form);
  form.submit();
}

async function githubAppAction(key, path, actionId, body) {
  try {
    const res = await fetch(path, {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ ...body, action_id: actionId }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the console answered " + res.status));
    observeActions(out.action ? [out.action] : []);
    reconcileGitHubAppActions();
    render();
    tick();
    return out;
  } catch (error) {
    const current = actionFor({ action_id: actionId });
    if (!current || current.status === "pending") {
      finishAction(actionId);
      UI.act.said = { key, text: error.message, ok: false };
    }
    render();
    return null;
  }
}

function reconcileGitHubAppActions() {
  for (const action of [...actions.values()]) {
    if (!["github-app-setup", "github-app-installations"].includes(action.kind) || !TERMINAL_ACTION.has(action.status)) continue;
    const key = action.kind === "github-app-setup" ? "github-app" : "github-app-refresh";
    if (action.status !== "confirmed") {
      UI.act.said = { key, ok: false, text: action.reason || "The GitHub App action failed." };
    } else if (action.receipt?.reply) {
      UI.act.said = { key, ok: true, text: action.receipt.reply };
    }
    finishAction(action.action_id);
  }
}

/* ---- credentials (#661, the shape the #645 prototype settled) ---------------

   THE SCREEN THAT ANSWERS "WHAT IS THE STATE OF ALL THREE?" — the question no
   other surface could take. The attention list is built to be empty: `valid`
   and `expiring` are silent by design, so before this screen existed there was
   nowhere to look when nothing was wrong, and "when does this expire?" had no
   answer short of an incident. `unowned` in particular was an ABSENCE, and an
   absence reads as nothing rather than as a fact about what this service owns.

   Three rows, two stores. The claude containers and the overseer run on one
   value from one account, so each row names its provider rather than leaving an
   operator to infer the sharing from two identical dates — and one Sign-in
   press serves both, which the second row says instead of offering a second
   button for the same act.

   NO API-KEY FIELD, here or anywhere. Subscription only, and this page offers
   nothing to type a credential into. */

/* WHAT IS BROKEN BEHIND THE CREDENTIAL (#645 finding 2). A dead credential is a
   fact about the box, not about a file. The wire carries the two facts — the
   lane is not dispatching, and these agents are on it — and the sentence is
   composed here, once, for every surface that needs it. */
function credBlast(c, said) {
  const lane = c.lane;
  if (!lane || lane.dispatching) return "";
  /* ONE LANE, ONE SENTENCE. Two of the three rows are anthropic and answer the
     same lane, so a held anthropic lane would otherwise say the same thing
     twice — which reads as two incidents. */
  if (said.has(lane.provider)) return "";
  said.add(lane.provider);
  const frozen = lane.agents ?? [];
  return `the ${esc(lane.provider ?? c.provider ?? "")} lane is held — nothing new dispatches to it`
    + (frozen.length
      ? `, and ${esc(frozen.length)} live agent(s) are frozen mid-ticket, not lost: ${esc(frozen.join(", "))}.
         They keep their pane, claim and worktree, and heal on the tick after a fresh credential lands.`
      : ", and no agent was running on it.");
}

/* How long a token has, said the way an operator asks it. */
function until(iso) {
  if (!iso) return "no stated expiry";
  const ms = Date.parse(iso) - Date.now();
  if (!Number.isFinite(ms)) return "no stated expiry";
  if (ms <= 0) return "expired";
  const d = ms / 86400000;
  if (d >= 1) return d.toFixed(1) + " days";
  const h = ms / 3600000;
  if (h >= 1) return h.toFixed(1) + " hours";
  return Math.round(ms / 60000) + " min";
}
const mmss = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

/* The live login, as a PANEL above the table and not a row inside it: a flow
   with a countdown, a copyable code and a terminal fallback is a panel whatever
   it is called.

   IT DEGRADES, NEVER DEAD-ENDS. The link and the code are scraped off a pane,
   and a scrape is a guess about somebody else's wording. When either is missing
   the panel says so and hands over the terminal, which is the path that always
   works — the scrape is an optimization over it and never a replacement.

   TWO LANES (#660), differing in one step. `typed` says whether the operator
   puts a code IN rather than reads one OUT: openai shows a code to enter in the
   browser, anthropic asks for one to be pasted back into the terminal. The
   token that lane produces reaches this page from nowhere. */
/* HOW LONG THE PANE GETS TO PRINT THE LINK (#891). The rehearsal read "could
   not read the login off the pane" for the first minute of every login,
   before the pane had printed anything: a scrape that has found nothing yet
   is progress, not a failure, until this wait is spent. Measured, the
   container starts and codex prints the link in under a second; the wait is
   generous so a slow pull or a slow box never reads as a broken login. */
const LINK_WAIT_MS = 3 * 60 * 1000;
const LINK_WAIT_WORDS = "3 minutes";
const copyButton = (value, label) => `<button class="btn sm copy" type="button" onclick="copyText(this, '${js(value)}')">${esc(label)}</button>`;

/* The session is being started: the image is ensured, the container spawned.
   Nothing to open yet, and nothing wrong. */
function credStarting(r) {
  return `<div class="flow starting">
    <div class="eyebrow">${esc(r.provider)} · starting the sign-in session</div>
    <h3>Starting the sign-in session</h3>
    <p class="dim-note" style="margin:0">Curia is starting the login session on this host. The link${r.typed ? "" : " and the one-time code"} show here the moment the session prints them.</p>
  </div>`;
}

function credFlow(r) {
  if (!r) return "";
  if (r.state === "starting") return credStarting(r);
  if (r.state !== "waiting") return "";
  const missing = !r.url || (!r.typed && !r.code);
  const waited = r.started_at ? Date.now() - new Date(r.started_at).getTime() : Infinity;
  const blind = missing && waited >= LINK_WAIT_MS;
  const pending = missing && !blind;
  /* The typed lane takes the code on the card (#891). The rehearsal found the
     operator with the code and nowhere to enter it: the flow types it into its
     own login pane, and the terminal below stays the fallback. The field keeps
     the `setup-` prefix so a poll's re-render keeps what was typed. */
  const codeBusy = UI.setup.anthropicBusy === "anthropic-setup:code";
  const codeNote = r.refusal
    ? `<div class="setup-note">The login refused the code: ${esc(r.refusal.why)}. Curia asked it for a fresh link; open the link again and paste the new code.</div>`
    : r.delivered_at
      ? `<div class="dim-note">Code delivered ${esc(ago(r.delivered_at))}. Curia reads the token off the login and verifies it from here; paste again only if the login asks for a new code.</div>`
      : "";
  const second = r.typed
    ? `<div class="flow-step"><span class="n">2</span><div>
         <div>Paste the code the browser shows</div>
         <p><input id="setup-anthropic-code" type="text" autocomplete="off" spellcheck="false" placeholder="Code" aria-label="Authorization code" ${codeBusy ? "disabled" : ""}>
           <button class="btn primary" ${codeBusy ? "disabled" : ""} onclick="doSetupAnthropicCode(document.getElementById('setup-anthropic-code').value)">${codeBusy ? "Delivering…" : "Submit"}</button></p>
         ${codeNote}${said("anthropic-setup:code")}
       </div></div>`
    : `<div class="flow-step"><span class="n">2</span><div>
         <div>Enter this code</div>
         <code class="reauth-code">${esc(r.code)}</code>${copyButton(r.code, "Copy code")}
       </div></div>`;
  const third = r.typed
    ? `<div class="flow-step"><span class="n">3</span><div>
         <div>Nothing else to do</div>
         <div class="dim-note">curia types the code into the login, reads the token out of the pane, asks Anthropic whether it authenticates, and adopts it only on a yes. The code never reaches a log.</div>
       </div></div>`
    : `<div class="flow-step"><span class="n">3</span><div>
         <div>Nothing is pasted back</div>
         <div class="dim-note">curia watches the scratch config dir and adopts the credential the moment it lands.</div>
       </div></div>`;
  return `<div class="flow${blind ? " blind" : pending ? " starting" : ""}">
    <div class="eyebrow">${esc(r.provider)} · signing in · ${esc(mmss(r.seconds_left ?? 0))} left</div>
    ${blind
      ? `<h3>curia could not read the login off the pane</h3>
         <p class="dim-note" style="margin:0 0 10px">The pane has not printed the link in ${LINK_WAIT_WORDS}, or its wording changed. Open the terminal and finish the sign-in there.</p>`
      : pending
        ? `<h3>Waiting for the sign-in link</h3>
           <p class="dim-note" style="margin:0 0 10px">The session is running and Curia is reading its pane. The link${r.typed ? "" : " and the one-time code"} show here the moment the pane prints them, usually within a few seconds.</p>`
        : `<div class="flow-step"><span class="n">1</span><div>
           <div>Open the link</div>
           <a class="flow-link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>${copyButton(r.url, "Copy link")}
         </div></div>
         ${second}
         ${third}`}
    <div class="flow-fall">
      ${/* THE PATH THAT ALWAYS WORKS (#645 finding 4). The card named the
            terminal and never linked it, and the service had composed the link
            for Discord since the first commit. It rides the payload now. */
        r.terminal_url
          ? `<a href="${esc(r.terminal_url)}" target="_blank" rel="noopener">Open the terminal instead →</a>`
          : `<span class="dim-note">curia could not publish a terminal link for this session.</span>`}
      <span class="dim">session <code>${esc(r.session)}</code>${r.expires_at ? `, torn down at ${esc(clock(r.expires_at))}` : ""}</span>
    </div>
  </div>`;
}

/* One consumer. `signer` is the provider whose Sign-in button has already been
   drawn on this table, so one login is offered once however many rows it heals.

   `ended` is the login that finished without a credential (#721), and it is
   drawn HERE rather than as an item of its own: this row is the one that already
   stands and already offers the way back, so an operator who pressed Sign in and
   watched the attempt disappear needs one more sentence, not one more place to
   look. It shows only on the rows of the provider it belongs to. */
function credRow(c, signer, flow, ended) {
  const st = credState(c);
  const signInAction = actionFor({ conflict_key: "reauth:" + c.provider });
  /* A login already running on this provider is the act. Offering a second
     Sign-in press beside the panel that is mid-flow would start nothing — the
     flow hands back the session it already has — and would read as two ways in
     where there is one. */
  const signing = (flow && flow.state === "waiting" && flow.provider === c.provider)
    || (signInAction && !TERMINAL_ACTION.has(signInAction.status));
  const signingProgress = signInAction?.progress ?? (signInAction ? "Starting sign-in" : "signing in now");
  const act = signing
    ? `<span class="dim-note">${esc(signingProgress)}${flow?.provider === c.provider ? " — the link is in the panel above" : "…"}</span>`
    : credWants(c)
      ? (c.provider && signer.has(c.provider)
        ? `<span class="dim-note">the same login signs this in</span>`
        : credSignIn(c, signer))
      : `<span class="dim-note">${c.state === "unowned" ? "nothing to press" : "nothing to do"}</span>`;
  /* The state word LIES on a held lane (#646) and only there: the access token
     can be valid for another two days and the lane still be unrecoverable. So
     the chip names the lane instead of the token, and the reason sits under it. */
  const chip = c.held
    ? `<span class="chip bad">held</span>`
    : `<span class="chip ${st.tone}">${esc(c.state)}</span>`;
  const why = c.held?.why ?? c.last_error ?? c.why ?? st.says;
  const last = ended && ended.provider === c.provider && ended.why
    ? `<div class="dim-note">the last login ended at ${esc(clock(ended.ended_at))}: ${esc(ended.why)}</div>`
    : "";
  return `<tr>
    <td class="c-who"><span class="who">${esc(c.consumer)}</span>
      <span class="dim-note mono" style="display:block;margin-top:2px">${esc(c.provider ?? "no provider")}</span></td>
    <td data-label="state">${chip}</td>
    <td class="num" data-label="expires">${c.expires_at
      ? `${esc(until(c.expires_at))}<div class="dim-note">${esc(clock(c.expires_at))}</div>`
      : `<span class="dim-note">—</span>`}</td>
    <td class="num" data-label="last refresh">${c.last_refresh_at
      ? esc(clock(c.last_refresh_at))
      : `<span class="dim-note">never</span>`}</td>
    <td class="why" data-label="why">${esc(why)}${last}</td>
    <td class="c-act">${act}</td>
  </tr>`;
}

/* The one press on this screen, and the reason the screen exists: the recovery
   from a dead credential has to reach a phone. It runs the operator's own
   `reauth <provider>` through the command seam, so a press and a typed line are
   one act — and what it shows afterwards is curia's own sentence about what
   happened, including a refusal. */
function credSignIn(c, signer) {
  if (!c.provider) return `<span class="dim-note">no provider to sign in</span>`;
  signer.add(c.provider);
  const k = "reauth:" + c.provider;
  /* What curia answered sits at the control that asked, once — the press was on
     this row, and the other row of a shared provider offers no button to hang a
     second copy of it on. */
  return `<button class="btn primary" ${busy(k) ? "disabled" : ""} onclick="startReauth('${js(c.provider)}')">
    ${busy(k) ? "…" : "Sign in from a browser"}</button>${said(k)}`;
}

async function startReauth(provider) {
  const key = "reauth:" + provider;
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "credential-sign-in", target: provider, conflict_key: key,
    projection: { phase: "starting" },
  });
  if (!action) return null;
  UI.act.said = null;
  render();
  try {
    const res = await fetch("/api/reauth", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ provider, action_id: actionId }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the console answered " + res.status));
    observeActions(body.action ? [body.action] : []);
    reconcileCredentialActions();
  } catch (error) {
    const current = actionFor({ action_id: actionId });
    // Shared daemon progress outranks a sidecar timeout on the older request.
    if (!current || current.status === "pending") {
      UI.act.said = { key, text: error.message, ok: false };
      finishAction(actionId);
    }
  }
  render();
  tick();
  return actionFor({ action_id: actionId });
}

function reconcileCredentialActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "credential-sign-in" || !TERMINAL_ACTION.has(action.status)) continue;
    if (action.status !== "confirmed") {
      UI.act.said = {
        key: action.conflict_key,
        text: action.reason || "Curia could not complete this credential sign-in.",
        ok: false,
      };
    }
    finishAction(action.action_id);
  }
}

function screenCredentials(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Credentials");
  /* Null is not empty (rule 2). A service that answered with no credentials
     section at all is not a box that owns no credentials. */
  const c = o.credentials;
  if (!c) {
    return `${head(p, "Credentials")}
      <div class="unread">This snapshot carries no credentials section — the service answering it is older than this page.</div>`;
  }
  const rows = c.consumers ?? [];
  /* Two passes over the rows, each with a set that keeps one lane and one login
     from being said twice: `lanes` for the sentences above the table, `signer`
     for the button inside it. */
  const lanes = new Set();
  const signer = new Set();
  const held = rows.map((r) => credBlast(r, lanes)).filter(Boolean);
  return `${head(p, "Credentials")}
    ${held.map((b) => `<div class="lane-held">${b}</div>`).join("")}
    ${credFlow(c.reauth)}
    <div class="h-sect"><h3>Model credentials (${esc(rows.length)})</h3>
      ${rows.length ? `<div class="tbl-wrap"><table class="creds">
        <thead><tr>
          <th>consumer</th><th>state</th><th>expires</th><th>last refresh</th><th>why</th><th></th>
        </tr></thead>
        <tbody>${rows.map((r) => credRow(r, signer, c.reauth, c.reauth_ended)).join("")}</tbody>
      </table></div>` : `<div class="empty">This service brokers no model credential.</div>`}
      <p class="dim-note" style="margin-top:10px">Subscription credentials only. curia holds no API key, and this page offers no field for one.</p>
    </div>`;
}

/* ---- integration setup (#874, the frame the #853 prototype settled) --------

   ONE RAIL, FOUR CARDS, ANY ORDER. GitHub, Discord, Tailscale and the model
   provider are independently selectable; the Full loop is the one dependent
   step and sits under the rail as an action, not a card. The selected card is
   the record's `step`, kept by the service, so closing the tab and coming back
   lands on the same card.

   A CARD'S STATE IS THIS READ'S VERIFICATION. `GET /api/setup` verifies every
   integration fresh and the page draws what came back. Nothing here remembers
   "connected": Try again is a fresh read, and so is arriving.

   THE SEAMS. `SETUP_CONTENT[key].content(card, progress, p)` is each card's
   configuration slot; #875 to #879 replace the stub with the real connect
   flow, and their verifier on the service side is what turns the card. The
   GitHub card (#875) is `setupGitHub`, the Discord card (#876) `setupDiscord`,
   the Tailscale card (#877) `setupTailscale`, the model card `setupModel` with
   one row per provider, OpenAI (#878) in `setupOpenAI` and Anthropic (#879)
   in `setupAnthropic`. Safe progress a step wants back after
   a close goes through `rememberSetupProgress`, never into browser storage.
   The Full loop's action enables on the service's gate alone (#880):
   `full_loop.ready` with the verified facts under `full_loop.facts`, which
   the panel names. `runFullLoop` (#882) presses the run through the sidecar
   and `setupLoopRun` draws the run the service reads off its journal: one
   row per leg, the linked artifacts, the elapsed time, and on a failure the
   leg, the cause, the action, and Try again. */

const SETUP_ORDER = ["github", "discord", "tailscale", "model"];

/* WHAT CURIA IS DOING, THE ONE MECHANISM (#891). The rehearsal pressed a
   card's action and read the pre-action content, the sign-in steps or the
   old failure, for the seconds until the next read landed. `UI.setup.working`
   is one record, `{ card, what }`: the card whose action is in flight and
   the sentence for it. A press sets it before anything else and the render
   draws it in place of the card's footer and the whole panel; nothing that
   stood before survives. Only the next read for that card clears it
   (`setupSettled`): the frame read clears every card, a row's own read
   clears its card, and a write that is refused before any read clears it
   with the refusal beside the form. The Full loop is the card `loop`. */
function setupWorking(card, what) {
  UI.setup.working = { card, what };
  UI.act.said = null;
  render();
}
function setupSettled(card = null) {
  if (!UI.setup.working) return;
  if (card === null || UI.setup.working.card === card) UI.setup.working = null;
}
const setupWork = (card) => (UI.setup.working?.card === card ? UI.setup.working : null);
const sentence = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function setupProgress(work) {
  return `<div class="setup-working-panel" role="status" aria-live="polite">
    <div class="setup-progress" aria-hidden="true"></div>
    <b>${esc(sentence(work.what))}…</b>
    <div class="dim-note">The result replaces this as soon as Curia has it.</div>
  </div>`;
}

/* THE GUIDED STEPS (#891). The rehearsal read the GitHub card's expected
   states, no App yet, no installation yet, nothing watched yet, as a red
   failure with a Try again that never helped, and pressed the Discord card
   more than once where one press was due. A card that has steps names the
   one the operator is at, from the verifier's own detail (`detail.step` on
   GitHub, `detail.stage` on Discord), and while the card is plain the rail
   badge counts the step and the footer names what the step waits for.
   Nothing here turns a card: the state is still the read's. */
var SETUP_GUIDES = {
  github: {
    labels: ["Create the App", "Install the App", "Choose repositories and continue"],
    pending: [null, "Waiting for an installation that covers a repository", "Choose the repositories to watch, then continue"],
    at: (card) => ({ create: 1, install: 2, watch: 3 })[card.detail?.step] ?? (card.state === "failed" ? 2 : 1),
  },
  discord: {
    labels: ["Connect the bot", "Add the bot to a server", "Choose the channel"],
    pending: [null, "Waiting for the bot to join a server", "Choose the server and the channel, then connect"],
    at: (card) => {
      const stage = card.detail?.stage ?? null;
      if (!stage || DISCORD_STAGES_WITH_TOKEN_FORM.includes(stage)) return 1;
      return stage === "server" && !(card.detail?.guilds?.length) ? 2 : 3;
    },
  },
};
function setupStepAt(card) {
  const guide = SETUP_GUIDES[card?.key];
  if (!guide || card.state === "connected" || card.state === "unavailable") return null;
  return { n: guide.at(card), total: guide.labels.length, labels: guide.labels, pending: guide.pending };
}
function setupStepper(card) {
  const step = setupStepAt(card);
  if (!step) return "";
  return `<ol class="setup-stepper" aria-label="Steps">${step.labels.map((label, i) => {
    const n = i + 1;
    const cls = n < step.n ? "done" : n === step.n ? "current" : "todo";
    return `<li class="${cls}"${cls === "current" ? ` aria-current="step"` : ""}><span class="setup-step-mark" aria-hidden="true">${cls === "done" ? "✓" : n}</span><span>${esc(label)}</span></li>`;
  }).join("")}</ol>`;
}
function setupCardBadge(card) {
  const step = card.state === "unconnected" ? setupStepAt(card) : null;
  return step && step.n > 1 ? `Step ${step.n} of ${step.total}` : card.badge;
}
function setupCardPending(card) {
  const step = card.state === "unconnected" ? setupStepAt(card) : null;
  return step?.pending[step.n - 1] || card.pending;
}

/* The content slot, per card: the body of the configuration panel, given
   the card, its remembered progress, and the held overview reading. A stub
   says what the step will do and that it is not available in this release
   yet, so an operator who lands here early reads a fact and not an empty
   form. */
var SETUP_CONTENT = {
  github: {
    content: (card, progress, p) => `<p>Curia creates a dedicated GitHub App. You review and approve it on GitHub, then install it for at least one repository owner.</p>
      <div class="setup-note">You sign in and grant access on GitHub. Curia never sees your password or browser session.</div>
      ${card.state === "unavailable" ? setupUnavailable(card) : setupGitHub(card, progress, p)}`,
  },
  discord: {
    content: (card, progress) => `<p>Curia connects a dedicated Discord bot you create, then finds or creates its command channel in the server you choose.</p>
      <div class="setup-note">The bot token is written once to its protected secret file. Curia never shows it again.</div>
      ${card.state === "unavailable" ? setupUnavailable(card) : setupDiscord(card, progress)}`,
  },
  tailscale: {
    content: (card, progress) => `<p>Curia verifies the Tailscale installation this host already runs, shows the identity that opened this app, and makes that identity the initial allowed operator after you confirm it.</p>
      <div class="setup-note">Curia never installs or reconfigures Tailscale. It publishes one Serve route of its own, the Curia app.</div>
      ${card.state === "unavailable" ? setupUnavailable(card) : setupTailscale(card, progress)}`,
  },
  model: {
    content: (card, progress) => `<p>One verified provider is required. Sign in with your subscription, and Curia completes one minimal model request and applies a working routing preset. Add the second provider here whenever you like.</p>
      <div class="setup-note">Subscription sign-in only. Curia holds no API key, and this panel offers no field for one.</div>
      ${card.state === "unavailable" ? setupUnavailable(card) : setupModel(card, progress)}`,
  },
};

/* The GitHub card's own panel (#875), a guide of three steps since the
   rehearsal (#891). Step 1, no App yet: Create GitHub App, with the name as
   the only input. Step 2, the App exists and no installation covers a
   repository: the install link per watched owner or the App's own, and a
   wait that re-reads the frame on the page's refresh interval until one
   does. Step 3, installations cover repositories: the list with every
   repository ticked and the one press that writes the watch list, verifies,
   and continues setup. Connected: the App, the real ticket the service
   discovered or the honest zero, and the choice behind a fold. A failed
   card draws the step the detail names beside the failure, so the action is
   at hand, and the frame's Try again.

   EVERYTHING HERE IS THIS READ'S (#891). The owner rows are the verifier's
   own reading of the installations (`card.detail.owners`), never the held
   overview's: the overview is a different read at a different time, and the
   rehearsal saw it draw an owner as installed beside a verification that
   called the same owner missing. The overview lends the install link per
   owner and nothing else. The watch choice is the verifier's `available`
   list, the repositories every installation covers, and the press writes
   the ticked ones as the watch list through the settings save. */
function setupGitHub(card, progress, p) {
  const app = p?.overview?.github_app ?? null;
  const detail = card.detail ?? null;
  const facts = app?.app ?? null;
  const identity = facts
    ? `<div class="rows"><div class="row"><span class="key grow">GitHub App</span><span>${facts.settings_url
      ? `<a href="${esc(facts.settings_url)}" target="_blank" rel="noopener">${esc(facts.slug || facts.id)}</a>`
      : esc(facts.slug || facts.id)}</span></div></div>` : "";
  if (card.state === "connected") {
    const found = !detail ? "" : detail.ticket
      ? `<div class="setup-note">Ready for an agent: <a href="${esc(detail.ticket.url)}" target="_blank" rel="noopener">#${esc(detail.ticket.number)} · ${esc(detail.ticket.title)}</a>
        <span class="dim-note">${esc(detail.open_tickets)} open ticket${detail.open_tickets === 1 ? "" : "s"} in ${esc((detail.covered ?? []).join(", "))}.</span></div>`
      : `<div class="setup-note">No open ticket is ready for an agent in ${esc((detail.covered ?? []).join(", "))}. Curia starts work when one carries <code>ready-for-agent</code>.</div>`;
    const owners = setupGitHubOwners(detail, app);
    return `${identity}${owners ? `<div class="rows">${owners}</div>` : ""}${found}${setupGitHubRepos(card, detail)}`;
  }
  const guide = setupStepper(card);
  const step = setupStepAt(card)?.n ?? 1;
  if (step === 1) {
    const action = actionFor({ conflict_key: "github-app:setup" });
    const pending = app?.status === "pending"
      ? `<p class="qhint">A GitHub App setup is pending until ${esc(ago(app.expires_at))}. Finish it on GitHub, or start again with a new name.</p>` : "";
    return `${guide}<p><input id="setup-github-app-name" value="${esc(progress?.app_name || "curia-box")}" aria-label="GitHub App name">
      <button class="btn primary" ${action ? "disabled" : ""} onclick="doSetupGitHubApp()">Create GitHub App</button></p>
      ${action ? `<p class="qhint">${esc(action.progress || "Starting GitHub App setup")}</p>` : ""}
      ${pending}${said("github-app")}
      <p class="qhint">GitHub slugifies the name, and Curia posts as <code>&lt;slug&gt;[bot]</code>. The name must be free across GitHub.</p>`;
  }
  if (step === 2) return `${guide}${identity}${setupGitHubInstall(card, detail, app)}`;
  return `${guide}${identity}${setupGitHubRepos(card, detail)}`;
}

/* Step 2: the installation. The owner rows are this read's fact; the
   overview lends the install link per owner. While the card is plain the
   panel waits and the frame re-reads on the refresh interval, so the
   repositories appear on their own once an installation covers one. On a
   failed card the operator has Try again. */
function setupGitHubOwners(detail, app) {
  const installUrl = detail?.install_url || "https://github.com/settings/installations";
  const links = new Map((app?.owners ?? []).map((owner) => [owner.owner, owner.install_url]));
  return (detail?.owners ?? []).map((owner) => `<div class="row">
    <span class="key grow">${esc(owner.owner)}</span>
    <span>${owner.installed ? "installed" : "missing access"}</span>
    <span><a href="${esc(links.get(owner.owner) || installUrl)}" target="_blank" rel="noopener">${owner.installed ? "Manage installation" : `Install on ${esc(owner.owner)}`}</a></span></div>`).join("");
}
function setupGitHubInstall(card, detail, app) {
  const installUrl = detail?.install_url || "https://github.com/settings/installations";
  const owners = setupGitHubOwners(detail, app);
  const every = payload?.poll_interval_s ?? 5;
  const wait = card.state === "unconnected"
    ? `<p class="qhint">Waiting for an installation that covers a repository. Curia checks again every ${esc(every)} seconds while this panel is open, and the repositories appear here on their own.</p>`
    : "";
  const then = card.state === "failed" ? " Then select <b>Try again</b>." : "";
  if (owners) return `<p>Install the App for each owner you watch, and grant it the watched repositories.${then}</p><div class="rows">${owners}</div>${wait}`;
  return `<p>Install the App on the account that owns your repositories: <a href="${esc(installUrl)}" target="_blank" rel="noopener">Install the App on GitHub</a>. On GitHub, <b>Only select repositories</b> is enough.${then}</p>${wait}`;
}
function githubSetupWaiting() {
  const card = setupCardOf("github");
  return card?.state === "unconnected" && setupStepAt(card)?.n === 2;
}
function ensureGitHubSetupWait() {
  clearTimeout(UI.setup.githubTimer);
  UI.setup.githubTimer = null;
  const onCard = UI.screen === "setup" && setupSelected() === "github";
  if (onCard && githubSetupWaiting()) UI.setup.githubTimer = setTimeout(loadSetup, (payload?.poll_interval_s ?? 5) * 1000);
}

/* The repositories the card offers to watch (#891): every repository the
   App's installations cover, in the order the verifier read them, then any
   watched repository no installation covers, so a press never drops a
   repository the operator chose by hand without showing it. */
function setupGitHubRepoList(detail) {
  const available = detail?.available ?? [];
  const watched = detail?.watched ?? [];
  return [...available, ...watched.filter((repo) => !available.includes(repo))];
}

function setupGitHubRepos(card, detail) {
  const repos = setupGitHubRepoList(detail);
  if (!repos.length) return "";
  const available = new Set(detail?.available ?? []);
  const watched = detail?.watched ?? [];
  const busy = UI.setup.githubBusy;
  const connected = card.state === "connected";
  const rows = repos.map((repo, i) => `<div class="row"><label class="grow"><input type="checkbox" id="setup-github-repo-${i}" value="${esc(repo)}"${!watched.length || watched.includes(repo) ? " checked" : ""}> ${esc(repo)}</label>
    ${available.has(repo) ? "" : `<span class="dim-note">not covered by an installation</span>`}</div>`).join("");
  const form = `<div class="rows">${rows}</div>
    <p><button class="btn primary" ${busy ? "disabled" : ""} onclick="doSetupGitHubWatch()">${busy ? "Saving…" : connected ? "Watch these repositories" : "Watch these repositories and continue"}</button></p>
    ${said("github-setup:watch")}
    <p class="qhint">The ticked repositories become the watch list in <code>config/config.yaml</code>, and the verification runs again on them${connected ? "" : ". When it passes, setup continues to the next card"}.</p>`;
  if (connected) return `<details><summary>Change the watched repositories</summary>${form}</details>`;
  return `<p>Choose the repositories Curia watches. The list is what the App's installations cover, every one ticked. Untick any Curia shouldn't work on.</p>${form}`;
}

/* The one press of the watch choice (#891): the ticked repositories go to
   the sidecar, which lands them through the validated settings save and the
   reload, and then the card verifies fresh on the new list. A read that
   connects a card that was not connected continues setup, so the press is
   the guide's last step and nothing else is asked. A refusal is the
   sidecar's sentence and takes no fresh read, so the choice stays on the
   page for the operator to correct. */
async function doSetupGitHubWatch() {
  const wasConnected = setupCardOf("github")?.state === "connected";
  const detail = setupCardOf("github")?.detail ?? null;
  const repos = setupGitHubRepoList(detail).filter((repo, i) => document.getElementById(`setup-github-repo-${i}`)?.checked);
  UI.act.said = null;
  if (!repos.length) {
    UI.act.said = { key: "github-setup:watch", text: "Tick at least one repository for Curia to watch.", ok: false };
    render();
    return null;
  }
  UI.setup.githubBusy = true;
  setupWorking("github", "saving the watch list and verifying the repositories");
  try {
    const res = await fetch("/api/setup/github/watch", {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ repos }),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the sidecar answered " + res.status));
  } catch (error) {
    UI.act.said = { key: "github-setup:watch", text: error.message, ok: false };
    UI.setup.githubBusy = false;
    setupSettled("github");
    render();
    return null;
  }
  UI.setup.githubBusy = false;
  await retrySetup();
  if (!wasConnected && setupCardOf("github")?.state === "connected") return continueSetup();
  return null;
}

/* The Discord card's own panel (#876), in the states the verifier reports.
   Before the token exists: the guide to the application and the bot, and
   the one form, the token and the operator's user ID, which is the only time
   the token crosses. After: the bot's name and the invite link, then a wait
   until the bot is in a server (#891: the panel re-reads on the page's own
   refresh interval, so the server appears on its own after the invite, and
   no select or channel field is drawn before there is a server to pick).
   Then the server list the service read on the token and the channel name,
   which is the second and last press, and the only one that creates
   anything. Connected: the channel, the delivered confirmation, and the
   registered commands, all from this read. */
const DISCORD_STAGES_WITH_TOKEN_FORM = ["token", "operator"];
function setupDiscord(card, progress) {
  const d = UI.setup.discord;
  const detail = card.detail ?? null;
  const stage = card.state === "connected" ? null : (detail?.stage ?? null);
  if (card.state === "connected" && detail) {
    /* The bridge starts when the token lands (#891): on this connect, and on
       any read that finds the token and no bridge. No restart is asked for. */
    const bridge = detail.bridge === "up"
      ? `<span class="dim-note">The bridge is running.</span>`
      : detail.bridge === "starting"
        ? `<span class="dim-note">The bridge is starting.</span>`
        : `<span class="dim-note">The bridge isn't running yet. Curia starts it on its own on the next read; if it stays down, read the service log.</span>`;
    return `<div class="rows">
      <div class="row"><span class="key grow">Channel</span><span><a href="${esc(detail.channel?.url)}" target="_blank" rel="noopener">#${esc(detail.channel?.name)}</a> in ${esc(detail.guild?.name)}${detail.channel?.created ? " · created by Curia" : ""}</span></div>
      <div class="row"><span class="key grow">Confirmation</span><span><a href="${esc(detail.confirmation?.url)}" target="_blank" rel="noopener">${detail.confirmation?.posted ? "Posted" : "Delivered"} ${esc(ago(detail.confirmation?.at))}</a></span></div>
      <div class="row"><span class="key grow">Operator</span><span>${esc(detail.operator?.name || detail.operator?.username || detail.operator?.id)} <span class="dim-note">${esc(detail.operator?.id)}</span></span></div>
      <div class="row"><span class="key grow">Commands</span><span>${(detail.commands ?? []).map((c) => `<code>/${esc(c)}</code>`).join(" ")}</span></div>
    </div><p>${bridge}</p>
    <details><summary>Change the server or the channel</summary>${setupDiscordChannelForm(d, progress, detail)}</details>`;
  }
  /* A stage in the detail means the token is on disk: the wait for a server
     and the channel choice are plain steps since #891, not failures. */
  const secretPresent = card.state === "failed" || Boolean(stage) || d?.secret === "present" || d?.secret === "refused";
  if (!secretPresent) return `${setupDiscordGuide()}${setupDiscordTokenForm(d, true)}`;
  if (!d || d.loading) return `<p class="qhint">Reading the bot's servers…</p>`;
  /* A rate limit (#891) is a wait, not a refused token: the token form stays behind its fold. */
  const tokenFirst = DISCORD_STAGES_WITH_TOKEN_FORM.includes(stage) || d.secret === "refused" || (Boolean(d.error) && !d.retry_after);
  const bot = d.bot ? `<div class="rows"><div class="row"><span class="key grow">Bot</span><span>${esc(d.bot.username)}${d.invite_url ? ` · <a href="${esc(d.invite_url)}" target="_blank" rel="noopener">Add the bot to a server</a>` : ""}</span></div></div>` : "";
  const problem = d.error && (!stage || stage === "rate_limit") ? `<p class="qhint">${esc(d.error)}</p>` : "";
  return `${bot}${problem}
    ${tokenFirst ? setupDiscordTokenForm(d, true) : ""}
    ${stage === "commands" ? setupDiscordCommandsForm() : ""}
    ${setupDiscordChannelForm(d, progress, detail)}
    ${tokenFirst ? "" : `<details><summary>Replace the bot token</summary>${setupDiscordTokenForm(d, false)}</details>`}`;
}

function setupDiscordGuide() {
  return `<ol class="setup-steps">
    <li>Open the <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">Discord developer portal</a> and select <b>New Application</b>. Name it for this installation, for example <code>curia-box</code>.</li>
    <li>Under <b>Bot</b>, turn on <b>Message Content Intent</b>, then select <b>Reset Token</b> and copy the token. Discord shows it once.</li>
    <li>In Discord, turn on <b>Developer Mode</b> under <b>Settings</b> &gt; <b>Advanced</b>, then copy your user ID from your profile menu.</li>
  </ol>`;
}

function setupDiscordTokenForm(d, open) {
  const busy = UI.setup.discordBusy === "discord-setup:token";
  const settings = d?.settings ?? null;
  return `<p><input id="setup-discord-token" type="password" autocomplete="off" placeholder="Bot token" aria-label="Bot token">
    <input id="setup-discord-user" type="text" value="${esc(settings?.allowed_users?.[0] ?? "")}" placeholder="Your Discord user ID" aria-label="Discord user ID" inputmode="numeric">
    <button class="btn primary" ${busy ? "disabled" : ""} onclick="doSetupDiscordToken()">${busy ? "Connecting…" : "Connect bot"}</button></p>
    ${open ? said("discord-setup:token") : ""}
    <p class="qhint">The token goes straight to <code>secrets/discord-bot-token</code>. The user ID is the whole access check: only that account may command Curia.</p>`;
}

function setupDiscordChannelForm(d, progress, detail) {
  const busy = UI.setup.discordBusy === "discord-setup:channel";
  const settings = d?.settings ?? null;
  const guilds = d?.guilds?.length ? d.guilds : (detail?.guilds ?? (detail?.guild ? [detail.guild] : []));
  const chosen = progress?.guild_id || settings?.guild_id || detail?.guild?.id || guilds[0]?.id || "";
  const channel = progress?.channel || settings?.channel || detail?.channel?.name || "curia";
  const options = guilds.map((g) => `<option value="${esc(g.id)}" ${g.id === chosen ? "selected" : ""}>${esc(g.name)}</option>`).join("");
  if (!guilds.length) return setupDiscordWait(d, detail);
  return `<p><select id="setup-discord-guild" aria-label="Server">${options}</select>
    <input id="setup-discord-channel" type="text" value="${esc(channel)}" placeholder="curia" aria-label="Command channel">
    <button class="btn primary" ${busy ? "disabled" : ""} onclick="doSetupDiscordChannel()">${busy ? "Verifying…" : "Connect channel"}</button></p>
    ${said("discord-setup:channel")}
    <p class="qhint">Curia reuses a top-level text channel of that name when the bot can use it, and creates one when you select <b>Connect channel</b>. Nothing is created before that. The name is yours to choose. <code>curia</code> is only a suggestion.</p>`;
}

/* The wait for a server (#891): the invite link and the interval the panel
   re-reads on. No select and no channel field, because there is no server
   to pick yet and no name to give before there is. */
/* Register commands (#891): the one press that registers Curia's slash
   commands on the selected server again. A read compares what is registered
   with Curia's manifest and never registers, so a difference is fixed here. */
function setupDiscordCommandsForm() {
  const busy = UI.setup.discordBusy === "discord-setup:commands";
  return `<p><button class="btn primary" ${busy ? "disabled" : ""} onclick="doSetupDiscordCommands()">${busy ? "Registering…" : "Register commands"}</button>
    <span class="dim-note">Registers Curia's slash commands in the selected server, replacing what is registered there.</span></p>
    ${said("discord-setup:commands")}`;
}

function setupDiscordWait(d, detail) {
  const invite = d?.invite_url || detail?.invite_url;
  const every = payload?.poll_interval_s ?? 5;
  return `<p class="qhint">Waiting for the bot to join a server. ${invite ? `<a href="${esc(invite)}" target="_blank" rel="noopener">Add the bot to your server</a> and approve it in Discord. The link asks for every permission Curia uses in the command channel, Manage Webhooks among them, which is what speaker identity needs. Approve them all.` : ""}
    Curia checks again every ${esc(every)} seconds while this panel is open, and the server appears here on its own.</p>`;
}

/* The Discord card's reads and writes (#876). The panel's own read is what
   the service knows on the token from disk; it runs when the card is
   selected and after every write. The token itself is read off its field,
   sent once, and the field is cleared before the answer comes back. */
async function loadDiscordSetup() {
  const before = UI.setup.discord?.loading ? null : UI.setup.discord;
  UI.setup.discord = { ...(UI.setup.discord ?? {}), loading: true };
  render();
  try {
    const res = await fetch("/api/setup/discord", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    UI.setup.discord = await res.json();
  } catch (error) {
    UI.setup.discord = { secret: null, settings: null, bot: null, guilds: [], invite_url: null, error: error.message };
  }
  setupSettled("discord");
  render();
  return ensureDiscordSetupWait(before);
}
/* The wait for a server (#891): while the token is accepted and the bot is
   in no server, the panel's own read repeats on the page's refresh interval
   and stops itself the moment a server is there, on a connected card, or
   when the operator leaves the card. The read that finds the first server
   verifies the frame fresh, so the card says what it now needs: the server
   and the channel, chosen here. */
function discordSetupWaiting(d) {
  return Boolean(d && !d.loading && d.secret === "present" && d.bot && !d.error && !(d.guilds?.length));
}
function ensureDiscordSetupWait(before = null) {
  clearTimeout(UI.setup.discordTimer);
  UI.setup.discordTimer = null;
  const d = UI.setup.discord;
  const onCard = UI.screen === "setup" && setupSelected() === "discord" && setupCardOf("discord")?.state !== "connected";
  if (onCard && discordSetupWaiting(d)) {
    UI.setup.discordTimer = setTimeout(loadDiscordSetup, (payload?.poll_interval_s ?? 5) * 1000);
    return null;
  }
  if (onCard && discordSetupWaiting(before) && d?.guilds?.length) return loadSetup();
  return null;
}
function ensureDiscordSetupRead() {
  if (!setup?.cards || setupSelected() !== "discord") return ensureDiscordSetupWait();
  const card = setupCardOf("discord");
  if (!card || card.state === "unavailable" || card.state === "connected") return ensureDiscordSetupWait();
  if (UI.setup.discord === null) return loadDiscordSetup();
  return ensureDiscordSetupWait();
}
async function doSetupDiscordToken() {
  const tokenField = document.getElementById("setup-discord-token");
  const token = String(tokenField?.value ?? "").trim();
  if (tokenField) tokenField.value = "";
  const userId = document.getElementById("setup-discord-user")?.value?.trim() ?? "";
  if (!token) return refuse("discord-setup:token", "Paste the bot token.");
  if (!userId) return refuse("discord-setup:token", "Enter your Discord user ID.");
  setupWorking("discord", "verifying the bot token and reading the bot's servers");
  const out = await discordSetupWrite("discord-setup:token", "/api/setup/discord/token", { token, user_id: userId });
  if (out) UI.setup.discord = out;
  /* The answer is the card's own read, so it settles the work either way. */
  setupSettled("discord");
  render();
  ensureDiscordSetupWait();
  return out;
}
async function doSetupDiscordChannel() {
  const guildId = document.getElementById("setup-discord-guild")?.value ?? "";
  const channel = document.getElementById("setup-discord-channel")?.value?.trim() ?? "";
  if (!guildId) return refuse("discord-setup:channel", "Select a server.");
  if (!channel) return refuse("discord-setup:channel", "Enter a channel name.");
  setupWorking("discord", "registering commands and posting the confirmation");
  await rememberSetupProgress("discord", { guild_id: guildId, channel });
  const out = await discordSetupWrite("discord-setup:channel", "/api/setup/discord/channel", { guild_id: guildId, channel });
  if (out) UI.setup.discord = null;
  else { setupSettled("discord"); render(); return null; }
  return loadSetup();
}
async function doSetupDiscordCommands() {
  const out = await discordSetupWrite("discord-setup:commands", "/api/setup/discord/commands", {});
  if (out) UI.setup.discord = null;
  return loadSetup();
}
async function discordSetupWrite(key, path, body) {
  UI.setup.discordBusy = key;
  UI.act.said = null;
  render();
  try {
    const res = await fetch(path, {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the sidecar answered " + res.status));
    return out;
  } catch (error) {
    UI.act.said = { key, text: error.message, ok: false };
    return null;
  } finally {
    UI.setup.discordBusy = null;
  }
}

/* The Tailscale card's own panel (#877; the machine-name field dropped
   after #891), in the three states the verifier reports. Unconnected: no
   operator is recorded, so the panel names the identity Serve stamped on
   the request that opened this app and the node, both facts, and the one
   press is the confirmation. Failed: the failed verification with its
   action, and the confirmation again. Connected: the private address, the
   operator, the node, the Serve route, and the timed admission, from this
   read. The node's name is the tailnet's fact: it was chosen at
   installation with `--name`, and the card never edits it, because the
   sidecar reads the hosts it serves at start and a rename under a running
   app breaks it (#891). */
function setupTailscale(card, progress) {
  const t = UI.setup.tailscale;
  const detail = card.detail ?? null;
  if (card.state === "connected" && detail) {
    const op = detail.operator ?? {};
    const seen = op.last_seen_at ? `Arrived through Tailscale ${esc(ago(op.last_seen_at))}` : "Not seen through Tailscale since the service started";
    return `<div class="rows">
      <div class="row"><span class="key grow">Private address</span><span><a href="${esc(detail.app_url)}" target="_blank" rel="noopener">${esc(detail.app_url)}</a></span></div>
      <div class="row"><span class="key grow">Operator</span><span>${esc(op.login)} <span class="dim-note">confirmed ${esc(ago(op.confirmed_at))}</span></span></div>
      <div class="row"><span class="key grow">Node</span><span>${esc(detail.address)} · online · ${(detail.node?.ips ?? []).map(esc).join(", ")}${detail.node?.version ? ` · Tailscale ${esc(detail.node.version)}` : ""}</span></div>
      <div class="row"><span class="key grow">Serve</span><span><code>:${esc(detail.serve?.route?.https)}</code> → <code>${esc(detail.serve?.route?.target)}</code>${detail.serve?.created ? " · created by Curia" : ""}</span></div>
      <div class="row"><span class="key grow">Reachability</span><span>Admitted ${esc(op.login)} in ${esc(detail.app?.ms)} ms · ${seen}</span></div>
    </div>`;
  }
  if (!t || t.loading) return `<p class="qhint">Reading the node…</p>`;
  return `${setupTailscaleNode(t, detail)}${setupTailscaleForm(t, progress, detail, card)}`;
}

function setupTailscaleNode(t, detail) {
  const node = t.node ?? detail?.node ?? null;
  if (t.error && !node) return `<p class="qhint">${esc(t.error)}</p>`;
  if (!node) return "";
  const state = !node.installed ? "not installed on this host"
    : node.error ? `not answering (${node.error})`
      : node.backend_state !== "Running" ? `${node.backend_state}` : node.online ? "online" : "offline";
  const name = node.dns_name ? `<b>${esc(node.dns_name)}</b> · ` : "";
  return `<div class="rows"><div class="row"><span class="key grow">This node</span><span>${name}${esc(state)}${(node.ips ?? []).length ? ` · ${node.ips.map(esc).join(", ")}` : ""}</span></div></div>`;
}

function setupTailscaleForm(t, progress, detail, card) {
  const busy = UI.setup.tailscaleBusy === "tailscale-setup:operator";
  const requester = t?.requester ?? null;
  const operator = t?.operator ?? detail?.operator ?? null;
  const current = (t?.node?.dns_name ?? detail?.address ?? "").split(".")[0] || t?.machine_name || null;
  const who = requester
    ? `<div class="setup-note"><b>You opened Curia as ${esc(requester)}</b> through Tailscale.${operator && operator.login !== requester ? ` The recorded operator is ${esc(operator.login)}.` : ""}${operator && operator.login === requester ? " This identity is the recorded operator." : ""}${!operator ? " Confirm to make this identity the allowed operator. Until then, nobody is." : ""}</div>`
    : `<div class="setup-note">This request carried no Tailscale identity. Open the Curia app through its Tailscale address to confirm the operator.</div>`;
  /* The identity that is already the recorded operator has nothing to
     confirm again (#891): the read Try again takes is the whole check. A
     different identity at the card is a real write, so it keeps the press. */
  const same = Boolean(requester && operator && operator.login === requester);
  const label = operator ? `Confirm ${requester ?? "this identity"} as the operator` : "Confirm operator and verify";
  const press = same ? "" : `<p><button class="btn primary" ${busy || !requester ? "disabled" : ""} onclick="doSetupTailscaleOperator()">${busy ? "Verifying…" : esc(label)}</button></p>`;
  return `${who}
    ${press}
    ${said("tailscale-setup:operator")}
    <p class="qhint">${current ? `This node is named <code>${esc(current)}</code> on the tailnet. ` : ""}The name was chosen at installation with <code>--name</code>. To change it, reinstall with another <code>--name</code>, or run <code>sudo tailscale set --hostname &lt;name&gt;</code> on the host and then <a href="#" onclick="doRestart();return false">Restart Curia</a>. Curia never installs or reconfigures Tailscale.</p>`;
}

/* The Tailscale card's reads and writes (#877). The panel's own read carries
   the identity this request arrived with; the confirmation sends no field
   at all, and the sidecar names the login off the request itself. */
async function loadTailscaleSetup() {
  UI.setup.tailscale = { ...(UI.setup.tailscale ?? {}), loading: true };
  render();
  try {
    const res = await fetch("/api/setup/tailscale", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    UI.setup.tailscale = await res.json();
  } catch (error) {
    UI.setup.tailscale = { requester: null, operator: null, node: null, serve: null, app_url: null, first_operator: null, error: error.message };
  }
  render();
}
function ensureTailscaleSetupRead() {
  if (!setup?.cards || setupSelected() !== "tailscale") return;
  const card = setupCardOf("tailscale");
  if (!card || card.state === "unavailable" || card.state === "connected") return;
  if (UI.setup.tailscale === null) loadTailscaleSetup();
}
async function doSetupTailscaleOperator() {
  UI.setup.tailscaleBusy = "tailscale-setup:operator";
  setupWorking("tailscale", "verifying the operator");
  try {
    const res = await fetch("/api/setup/tailscale/operator", {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({}),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the sidecar answered " + res.status));
    UI.setup.tailscale = null;
  } catch (error) {
    UI.act.said = { key: "tailscale-setup:operator", text: error.message, ok: false };
    UI.setup.tailscaleBusy = null;
    setupSettled("tailscale");
    render();
    return null;
  }
  UI.setup.tailscaleBusy = null;
  return loadSetup();
}

/* The model-provider card (#852: one provider is required, the second is
   optional). ONE CARD, ONE ROW PER PROVIDER, so the second provider lands
   beside the first without restructuring: each row draws its own state
   badge and its own panel, and the card's state is what the service
   composed out of both. OpenAI (#878) is `setupOpenAI`; Anthropic (#879)

function setupModel(card, progress) {

    const badge = p.state === "connected" ? "Connected and verified" : p.state === "failed" ? "Action required"
      : p.state === "unavailable" ? "Not available" : "Ready to connect";
    const body = p.state === "unavailable"
      ? `<p class="qhint">Connecting ${esc(p.title ?? key)} isn't available yet in this release. This row lights up when it lands.</p>`
      : key === "openai" ? setupOpenAI(p, card, progress) : setupAnthropic(p, card, progress);
    return `<div class="setup-provider ${esc(key)} ${esc(p.state)}">
      <div class="setup-provider-head"><b>${esc(p.title ?? key)}</b><span class="setup-badge">${esc(badge)}</span></div>

}

/* The OpenAI row (#878). One press, the subscription sign-in curia already

function setupOpenAI(p, card, progress) {
  const o = UI.setup.openai;

function setupOpenAIForm(o, flow, label) {
  if (flow?.state === "waiting" || flow?.state === "starting") return credFlow(flow);

    ? `<div class="setup-note">The last OpenAI sign-in ended: ${esc(o.ending.why ?? o.ending.state)}. Start it again whenever you're ready.</div>` : "";

  return `${ended}${problem}

/* The OpenAI row's reads and writes (#878). The panel's own read is polled

async function loadOpenAISetup() {

  const before = UI.setup.openai?.login ?? null;
  UI.setup.openai = { ...(UI.setup.openai ?? {}), loading: !UI.setup.openai };
  render();
  try {
    const res = await fetch("/api/setup/openai", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    UI.setup.openai = await res.json();
  } catch (error) {
    UI.setup.openai = { provider: "openai", secret: null, identity: null, login: null, ending: null, said: null, routing: null, error: error.message };
  }
  const now = UI.setup.openai.login ?? null;
  /* A login that is gone means the credential landed or the login ended:
     the frame read says which, and until it does the row shows the
     verification, never the steps again (#891). */
  if (before && !now) setupWorking("model", "completing one minimal model request and applying the routing preset");
  else setupSettled("model");
  render();
  if (now && UI.screen === "setup") {

function ensureOpenAISetupRead() {

  try {

      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({}),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the sidecar answered " + res.status));
    UI.setup.openai = out;

    UI.act.said = { key: "openai-setup:login", text: error.message, ok: false };

const setupCards = () => (setup?.cards ?? []);

/* The one dependent step, under the rail. The button is enabled by the

const setupRun = () => {

const LOOP_STATE_WORDS = { running: "Running", complete: "Verified", failed: "Action required" };

    : missing.length ? `Waiting for ${missing.map((k) => esc(setupCardOf(k)?.title ?? k)).join(", ")}.`
      : esc(gate?.reason ?? "The Test run isn't available yet in this release.");
  return `<div class="setup-loop${on ? " on" : ""}"><div><b>Test run</b><div class="dim-note">${why}</div>${ready ? setupLoopFacts(gate?.facts) : ""}</div>

}
/* Where the run is (#891): the repository and the ticket in flight, named
   as 1 of 2 or 2 of 2, because the run makes two tickets of its own. */
function runWhere(run) {
  if (!run.ticket) return esc(run.repo ?? "");
  const n = run.ticket.index && run.ticket.of ? ` · ticket ${esc(run.ticket.index)} of ${esc(run.ticket.of)}` : "";
  return `${esc(run.repo)}#${esc(run.ticket.number)}${n}`;
}

/* The run's panel in the main area (#891): what Curia is doing from the

function setupRunPanel() {

  else if (run) body = setupLoopRun(run);
  else {

    const missing = gate?.missing ?? SETUP_ORDER.filter((k) => !setupConnected().includes(k));
    const why = ready ? "Every integration is connected and verified. The Test run creates a small map with two tickets in the covered repository, one that adds a line to the README and one that removes it, and takes each through every leg of the Full loop. The map closes on your verdict, and the repository is left as it was."
