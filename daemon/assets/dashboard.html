    body = `<p>${why}</p>${ready ? setupLoopFacts(gate?.facts) : ""}
      <div class="loop-actions"><button class="btn primary" ${ready && !UI.setup.loopBusy ? `onclick="runFullLoop()"` : "disabled"}>Start Test run</button>${UI.setup.note ? `<span class="dim-note">${esc(UI.setup.note)}</span>` : ""}</div>`;
  }
  return `<div class="setup-panel${work ? " working" : ""}" id="setup-run">
    <div class="eyebrow">Installation acceptance · ${esc(state)}</div>
    <h2>Test run</h2>
    ${body}
  </div>`;
}

/* The facts the gate hands the loop, named where the action is: the
   repository or the discovered ticket, the channel, the private address, the
   leading provider and its model. Drawn from this read's gate and nothing
   remembered, so what the button would run on is what the rail verified. */
const SETUP_PROVIDER_NAMES = { openai: "OpenAI", anthropic: "Anthropic" };
function setupLoopFacts(facts) {
  if (!facts) return "";
  const bits = [];
  const ticket = facts.github?.ticket;
  if (ticket) bits.push(`🎫 #${esc(ticket.number)} · ${esc(ticket.repo)}`);
  else if (facts.github?.repo) bits.push(`📦 ${esc(facts.github.repo)}`);
  if (facts.discord?.channel?.name) bits.push(`💬 #${esc(facts.discord.channel.name)}`);
  if (facts.tailscale?.address) bits.push(`🔒 ${esc(facts.tailscale.address)}`);
  if (facts.model?.provider) {
    const name = SETUP_PROVIDER_NAMES[facts.model.provider] ?? facts.model.provider;
    bits.push(`${facts.model.provider === "anthropic" ? "🧠" : "⚡"} ${esc(name)} · ${esc(facts.model.model ?? "")}`);
  }
  return bits.length ? `<div class="dim-note setup-loop-facts">${bits.join(" · ")}</div>` : "";
}

/* The run (#882, #891): the installation's acceptance. The press asks the
   service to create the Test run's map and two tickets and drive each through
   one real Full loop; from then on the panel draws the run the service reads
   off its journal, one row per leg, with the real GitHub and Discord
   artifacts linked and the elapsed time.
   A failure names the leg, one cause, and one action, and Try again reruns
   that leg. Nothing here decides anything: the service's read is the run. */
const LOOP_MARK = { complete: "✓", running: "…", failed: "✗", pending: "·" };
function loopDur(ms) {
  if (ms == null || !Number.isFinite(ms)) return "";
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} min ${s % 60} s`;
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}
/* What a running leg waits for (#891), so the wait is never mistaken for
   a hang: the question the run carries, with the time since it opened, or
   the agent's own work. */
function loopWaitWords(run, key) {
  const w = run.waiting;
  if (w && w.leg === key) return w.review ? "waiting for your approval of the review gate" : key === "map_closed" ? "waiting for your verdict on the map" : "waiting for your answer";
  if (key === "map_closed") return "waiting for Curia's question about the empty map";
  if (key === "escalation") return "waiting for the agent's question";
  return "waiting for the agent";
}
/* The question the run waits for, drawn with the same card and controls Home
   draws for it, so the answer goes through the daemon's own answer route (the
   one the Discord bridge uses) and the journal sees one `esc_answer` whichever
   surface it came from. The Discord thread keeps working in parallel. The
   overview's record leads when the poll has it (it carries the diff digest and
   the option handles); the run's own copy stands in until then. */
function loopWaitCard(run) {
  const w = run.waiting;
  if (!w) return "";
  const known = [...(payload?.overview?.escalations ?? []), ...(payload?.overview?.review_gate ?? [])].find((r) => r.id === w.id);
  const row = { ...w, options: w.options ?? null, pull_request: w.pull_request ?? run.links?.pull_request ?? null, ...(known ?? {}) };
  /* The human step is unmistakable (#891): the message the bridge posted,
     as Discord shows it, with this page's answer controls under it. A run
     read that carries no message draws the plain card. */
  if (!w.message) return `<div class="loop-wait">${w.review ? gateCard(row) : escCard(row)}</div>`;
  const controls = w.review ? gateControls(row) : `${answerProjection(row.id)}${answerButtons(row)}${answerField(row)}${said("esc:" + row.id)}`;
  return `<div class="loop-wait"><div class="dim-note">Your turn. Curia posted this in Discord; answer there or here.</div>
    ${discordEmbed(w.message)}<div class="loop-answer">${controls}</div></div>`;
}
/* Discord's message markdown, the subset the bridge writes: bold, italics,
   inline code, fences, spoilers, and small print. The text is escaped first;
   the marks are added to the escaped text and nothing else is. */
function mdLite(text) {
  let h = esc(String(text ?? ""));
  h = h.replace(/```[^\n]*\n?([\s\S]*?)```/g, (_, code) => `<span class="dc-code">${code}</span>`);
  h = h.replace(/\|\|([^|]+)\|\|/g, '<span class="dc-spoiler">$1</span>');
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, "$1<i>$2</i>");
  h = h.replace(/^-# (.*)$/gm, '<span class="dc-small">$1</span>');
  return h;
}
function discordEmbed(m) {
  const fields = (m.fields ?? []).map((f) => `<div class="dc-field"><div class="dc-field-name">${esc(f.name)}</div><div class="dc-field-value">${mdLite(f.value)}</div></div>`).join("");
  return `<div class="dc-msg" aria-label="The message Curia posted in Discord">
    <div class="dc-avatar" aria-hidden="true">C</div>
    <div class="dc-body"><div class="dc-head"><span class="dc-name">${esc(m.author ?? "curia")}</span><span class="dc-bot">APP</span></div>
      <div class="dc-embed">${m.title ? `<div class="dc-title">${esc(m.title)}</div>` : ""}<div class="dc-desc">${mdLite(m.description)}</div>${fields}${m.footer ? `<div class="dc-footer">${mdLite(m.footer)}</div>` : ""}</div></div></div>`;
}
/* A terminal per live session (#891): the agent's while it lives and the
   overseer's while it is in a turn, each at the link the service composed. */
function loopTerminals(run) {
  const sessions = run.sessions ?? [];
  if (!sessions.length) return "";
  return `<div class="loop-links loop-terminals"><span class="dim-note">Terminals</span>${sessions.map((s) => `<a href="${esc(s.terminal_url)}" target="_blank" rel="noopener">${esc(s.session)}</a>`).join("")}</div>`;
}
function setupLoopRun(run) {
  const where = runWhere(run);
  const elapsed = loopDur(run.elapsed_ms);
  const head = run.state === "complete" ? `<b>Test run verified.</b><div class="dim-note">${where} · every leg completed in ${elapsed}.</div>`
    : run.state === "failed" ? `<b>The Test run did not complete.</b><div class="dim-note">${where} · stopped after ${elapsed}.</div>`
      : `<b>Running the Test run.</b><div class="dim-note">${where} · ${elapsed} so far. The page follows the service's read every 5 seconds. Leaving Setup keeps the run going.</div>`;
  const legs = (run.legs ?? []).map((l) => {
    const wait = l.state === "running" ? ` · ${loopWaitWords(run, l.key)}${run.waiting?.leg === l.key ? ` · open ${esc(ago(run.waiting.opened_at))}` : ""}` : "";
    return `<li class="loop-leg ${esc(l.state)}"><span class="loop-mark" aria-hidden="true">${LOOP_MARK[l.state] ?? "·"}</span><span>${esc(l.title)} · ${esc(l.state)}${wait}</span>${l.link ? ` <a href="${esc(l.link)}" target="_blank" rel="noopener">open</a>` : ""}${l.ms != null ? `<span class="dim-note">${loopDur(l.ms)}</span>` : ""}</li>`;
  }).join("");
  const links = run.links ?? {};
  const names = { ticket: "Ticket", pull_request: "Pull request", map: "Map", thread: "Discord thread", channel: "Command channel" };
  const linkRow = Object.keys(names).filter((k) => links[k]).map((k) => `<a href="${esc(links[k])}" target="_blank" rel="noopener">${names[k]} ↗</a>`).join("");
  const problem = run.failed
    ? `<div class="setup-problem"><b>${esc(run.failed.title)} failed: ${esc(run.failed.cause)}</b>${esc(run.failed.action)}</div>`
    : "";
  const busy = UI.setup.loopBusy;
  const actions = run.state === "failed"
    ? `<button class="btn primary" ${busy ? "disabled" : ""} onclick="retryFullLoop()">${busy ? "Retrying…" : "Try again"}</button>`
    : run.state === "complete"
      ? `<a class="btn primary" href="#home" onclick="goto('home');return false">Open Curia</a>`
      : `<button class="btn primary" disabled>Running…</button>`;
  return `<div class="setup-run-body">${head}<ul class="loop-legs">${legs}</ul>${run.state === "running" ? loopWaitCard(run) : ""}${linkRow ? `<div class="loop-links">${linkRow}</div>` : ""}${run.state === "running" ? loopTerminals(run) : ""}${problem}
    <div class="loop-actions">${actions}${UI.setup.note ? `<span class="dim-note">${esc(UI.setup.note)}</span>` : ""}</div></div>`;
}
/* The press (#891): the run becomes the selected panel at once, in progress,
   and the page brings it into view, because the rail's card was below the

async function pressFullLoop(path, what) {
  UI.setup.loopBusy = true;

  document.getElementById("setup-run")?.scrollIntoView?.({ block: "start", behavior: "smooth" });
  try {
    const res = await fetch(path, {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({}),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error ?? `the sidecar answered ${res.status}`);
    if (setup?.full_loop && out.run) setup.full_loop.run = out.run;
  } catch (error) {

}
function runFullLoop() { return pressFullLoop("/api/setup/full-loop", "starting the Test run"); }
function retryFullLoop() {
  const leg = setupRun()?.failed?.title;
  return pressFullLoop("/api/setup/full-loop/retry", leg ? `retrying ${leg}` : "retrying the Test run");
}
/* While a run is live the panel follows the service's read; the timer stops
   itself when the run ends or the operator leaves for a screen that does not
   show the run. Home shows it (#891), so closing Setup keeps following. */
function ensureFullLoopRead() {
  const live = (UI.screen === "setup" || UI.screen === "home") && setup?.full_loop?.run?.state === "running";
  if (!live) {
    if (UI.setup.loopTimer) { clearTimeout(UI.setup.loopTimer); UI.setup.loopTimer = null; }
    return;
  }
  if (UI.setup.loopTimer) return;
  UI.setup.loopTimer = setTimeout(async () => {
    UI.setup.loopTimer = null;
    try {
      const res = await fetch("/api/setup/full-loop", { headers: { accept: "application/json" }, cache: "no-store" });
      const run = await res.json();
      if (setup?.full_loop && run?.state) setup.full_loop.run = run;
    } catch { /* the next read asks again */ }
    render();
    ensureFullLoopRead();
  }, 5000);
}

/* The panel: the selected card's own configuration, the error treatment
   when its verification failed, and the frame's one forward action. */
function setupPanel(card, p) {
  const work = setupWork(card.key);
  if (work) {
    return `<div class="setup-panel working">
    <div class="eyebrow">Independent connection · Working</div>
    <h2>${esc(card.title)}</h2>
    ${setupProgress(work)}
  </div>`;
  }
  const slot = SETUP_CONTENT[card.key];
  const progress = setup?.progress?.[card.key] ?? {};
  const problem = card.state === "failed"
    ? `<div class="setup-problem"><b>${esc(card.error?.failed)}</b>${esc(card.error?.action)}</div>`
    : "";
  const busy = UI.setup.busy;

    ? `<button class="btn primary" ${busy ? "disabled" : ""} onclick="retrySetup()">${busy ? "Verifying…" : "Try again"}</button>`
    : "";

     is not connected, or the run once every card is. The run's own presses

  const forward = card.state === "connected" ? `<button class="btn primary" onclick="continueSetup()">Continue</button>` : "";
  return `<div class="setup-panel">
    <div class="eyebrow">Independent connection · ${esc(setupCardBadge(card))}</div>

  </div>`;
}

function screenSetup(p) {
  const top = head(p, "Setup");

  /* Null is not empty (rule 2): a service that could not be asked is not four
     unconnected cards. */

      <button class="btn sm" ${UI.setup.busy ? "disabled" : ""} onclick="retrySetup()">${UI.setup.busy ? "Verifying…" : "Try again"}</button></div>`;
  }

        <div class="dim-note">Connect the four in any order. Each card shows this read's verification, not a saved result.</div></div>
      ${cards.map((c) => setupCard(c, c.key === selected)).join("")}
      ${setupFullLoop()}

  </div>`;
}

/* The Home pointer for a live Test run (#891): leaving Setup never cancels
   or detaches the run, so Home says it runs, names the leg and what it waits
   for, and Open returns to the run panel. */
function runPointer() {
  const run = setup?.full_loop?.run;

  const where = runWhere(run);

function openFullLoop() {
  UI.setup.panel = "run";

/* The Home pointer: on a fresh installation the one thing Home has to say is

function setupPointer() {

/* ---- the reads and writes ---- */

async function loadSetup() {
  UI.setup.busy = true;
  render();
  try {
    const res = await fetch("/api/setup", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    setup = await res.json();
    /* A card's panel shows this read's result only (#891): a write refusal
       a card said before the read is not part of what the read found. */
    if (/^(github-app|github-setup:|discord-setup:)/.test(UI.act.said?.key ?? "")) UI.act.said = null;
  } catch (error) {
    setup = { step: setup?.step ?? null, progress: setup?.progress ?? null, cards: null, full_loop: null, error: error.message };
  }
  UI.setup.busy = false;
  /* The frame read verifies every card, so it settles whatever was in
     flight: what it found, a failure or the connected state, is the answer. */
  setupSettled();
  render();
  ensureGitHubSetupWait();
  ensureDiscordSetupRead();
  ensureTailscaleSetupRead();
  ensureOpenAISetupRead();
  ensureAnthropicSetupRead();
  ensureFullLoopRead();
}
/* Try again is a fresh verification of everything, which is the only kind of
   verification there is. */
function retrySetup() {
  UI.setup.note = null;
  if (!UI.setup.working && setup?.cards) {
    const key = setupSelected();
    setupWorking(key, `verifying ${setupCardOf(key)?.title ?? key} again`);
  }
  return loadSetup();
}

/* Selecting a card: the rail moves now, and the service keeps the choice so
   a reopen lands here. A write that fails leaves the selection on the page
   and says so; nothing about it is a secret and nothing about it is lost. */
async function selectSetupCard(key) {
  if (!SETUP_ORDER.includes(key) || !setup) return;
  setup.step = key;
  UI.setup.panel = "card";
  UI.setup.note = null;
  render();
  ensureGitHubSetupWait();
  ensureDiscordSetupRead();
  ensureTailscaleSetupRead();
  ensureOpenAISetupRead();
  ensureAnthropicSetupRead();
  await writeSetup({ step: key });
}
function continueSetup() {
  const next = SETUP_ORDER.find((k) => setupCardOf(k)?.state !== "connected");
  if (!next) return selectSetupRun();
  return selectSetupCard(next);
}
/* The safe checkpoint a step keeps for a reopen (#875 to #879 call this):
   the fields the service allows for that card, never a secret. The service
   refuses any other key by name. */
async function rememberSetupProgress(card, fields) {
  if (!setup) return null;
  setup.progress = { ...(setup.progress ?? {}), [card]: { ...(setup.progress?.[card] ?? {}), ...fields } };
  return writeSetup({ progress: { [card]: fields } });
}
async function writeSetup(body) {
  try {
    const res = await fetch("/api/setup", {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || ("the sidecar answered " + res.status));
    return out;
  } catch (error) {
    UI.setup.note = `curia could not keep this step for a reopen: ${error.message}`;
    render();
    return null;
  }
}

function screenSettings(p) {

const fileName = (p) => String(p ?? "").split("/").pop();

/* ---- the edits ---- */

/* Every edit lands on the draft and nowhere else, so what is on screen and what
   a save would post are the same object. */
function dirty() {
  if (UI.set.phase !== "restarting") UI.set.phase = changeCount() ? "dirty" : "clean";
  UI.set.error = null;
  UI.set.note = null;
  render();
}
/* The discard the dock offers. It throws away the draft rather than the file:
   nothing was written, so there is nothing on disk to put back. */
function discardEdits() {
  draft = clone(settings);

  UI.set.error = null;
  UI.set.note = null;

}
function setDefault(i, model) { draft.routing.defaults[i].model = model; dirty(); }
function setDefaultEffort(i, effort) { draft.routing.defaults[i].effort = effort || null; dirty(); }
function setModelActive(i, on) { draft.routing.models[i].active = on; dirty(); }

  draft.dispatch[key] = typeof value === "boolean" ? value : Number(value);
  dirty();

  draft.watch.push({ repo: name, mode: "auto" });

  const el = document.getElementById("set-repo-typed");

    UI.set.phase = "refused";
    UI.set.error = `"${name}" is not an owner/name repo`;
    return render();
  }
  el.value = "";
  addRepo(name);
}

/* ---- the two calls ---- */

async function loadSettings() {

/* The browser conversations (#333). Taken on arrival at the Chat screen and
   after a press that changes the list, never on the poll: a row costs the
   daemon a transcript read, and the other five screens have no use for it.

   A failure lands as `conversations: null`, which the screen draws as "curia
   could not be asked" — not as an empty list. */
async function loadConversations() {

    if (!res.ok) throw new Error("the sidecar answered " + res.status);

function reconcileSettingsActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "settings-save" || !TERMINAL_ACTION.has(action.status)) continue;
    if (action.status === "refused" || action.status === "failed") {
      UI.set.phase = "refused";
      UI.set.error = action.reason || "The settings save did not finish.";
      finishAction(action.action_id);
      continue;
    }
    const receipt = action.receipt ?? {};
    const written = receipt.written ?? [];
    UI.set.error = null;
    if (!written.length) {
      UI.set.phase = "clean";
      UI.set.note = "That was already what the files say.";
    } else {
      UI.set.note = `Wrote ${written.join(" and ")}, atomically, with the comments kept.`;
      if (receipt.reload?.ok === false) {
        UI.set.phase = "declined";
        UI.set.error = receipt.reload.error || "the service gave no reason";
      } else {
        UI.set.phase = "applied";
      }
    }
    finishAction(action.action_id);
  }
}

function reconcileDaemonRestartActions(p) {
  const shared = (p?.overview?.actions ?? [])
    .filter((action) => action.kind === "daemon-restart")
    .sort((a, b) => Number(b.revision ?? -1) - Number(a.revision ?? -1))[0] ?? null;
  const local = daemonRestartAction();
  const action = local ?? shared;
  if (!action) return;

  if (action.status === "refused" || action.status === "failed") {
    UI.set.phase = "refused";
    UI.set.error = action.reason || "The service restart did not finish.";
    if (local) finishAction(local.action_id);
    return;
  }

  const uptime = p?.overview?.daemon?.uptime_s;
  const before = action.receipt?.uptime_s ?? action.projection?.uptime_s;
  const freshLife = Number.isFinite(uptime) && (
    action.receipt?.booted_at != null || (Number.isFinite(before) && uptime < before)
  );
  if (p?.daemon_up && freshLife && (action.status === "confirmed" || action.receipt?.requested_at)) {
    UI.set.phase = "restarted";
    UI.set.error = null;
    UI.set.note = `The service restarted and is answering. Up ${dur(uptime)}.`;
    if (local) finishAction(local.action_id);
  }
}

async function doSave() {
  const patch = settingsPatch();
  if (!Object.keys(patch).length) return;
  const paths = settingsActionPaths(patch);
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId,
    kind: "settings-save",
    target: paths.join(","),
    conflict_key: `settings:${paths.join("+")}`,
    projection: { paths },
  });
  if (!action) return;
  render();
  try {
    const res = await fetch("/api/settings", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ action_id: actionId, ...patch }),
    });
    const body = await res.json().catch(() => ({}));
    const evidence = body.action ?? body.receipt?.action ?? null;
    observeActions(evidence ? [evidence] : []);
    if (!res.ok) {
      const current = actionFor({ action_id: actionId });
      UI.set.phase = "refused";
      UI.set.error = current?.reason || body.error || ("the sidecar answered " + res.status);
      finishAction(actionId);
      return render();
    }
    const current = actionFor({ action_id: actionId });
    if (current?.status === "refused" || current?.status === "failed") {
      UI.set.phase = "refused";
      UI.set.error = current.reason || "The settings save was refused.";
      finishAction(actionId);
      return render();
    }
    /* The answer carries the re-read file, so the screen shows what landed
       rather than what was typed. */
    settings = body.settings ?? settings;
    draft = clone(settings);
    /* The save carries the apply's own answer (#362). Three outcomes, and the
       page states the one that came back rather than guessing from the write:
       applied, declined by the service, or a service that could not be asked. */
    const r = body.reload;
    UI.set.error = null;
    if (!body.written?.length) {
      UI.set.phase = "clean";
      UI.set.note = "That was already what the files say.";
    } else {
      UI.set.note = `Wrote ${body.written.join(" and ")}, atomically, with the comments kept.`;
      if (r?.ok) UI.set.phase = "applied";
      else if (r?.reason === "daemon-down") { UI.set.phase = "offline"; UI.set.error = r.error; }
      else { UI.set.phase = "declined"; UI.set.error = r?.error ?? "the service gave no reason"; }
    }
    if (TERMINAL_ACTION.has(actionFor({ action_id: actionId })?.status) || !body.action || r?.reason === "daemon-down") {
      finishAction(actionId);
    }
  } catch (e) {
    UI.set.phase = "refused";
    UI.set.error = e.message;
  }
  render();
}

async function doRestart() {
  const ask = "Restart the service? Running agents keep their tmux sessions — those live in their own container. Anything unsaved here is not written.";
  if (typeof confirm === "function" && !confirm(ask)) return;
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const uptime = payload?.overview?.daemon?.uptime_s;
  const action = beginAction({
    action_id: actionId,
    kind: "daemon-restart",
    target: "daemon",
    conflict_key: "daemon:lifecycle",
    projection: { uptime_s: Number.isFinite(uptime) ? uptime : null },
  });
  if (!action) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/restart", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ action_id: actionId }),
    });
    const body = await res.json().catch(() => ({}));
    observeActions(body.action ? [body.action] : []);
    if (!res.ok) {
      const current = actionFor({ action_id: actionId });
      UI.set.phase = "refused";
      UI.set.error = current?.reason || body.error || ("the sidecar answered " + res.status);
      finishAction(actionId);
      UI.set.busy = false;
      return render();
    }
    UI.set.error = null;
  } catch (e) {
    /* The service may have taken the order and died before answering. Say
       exactly that, and let the marker at the top of the page be the evidence:
       it reads the service, and this reads a socket. */
    UI.set.phase = "restart-unknown";
    UI.set.error = `${e.message} — the bar above says whether the service is answering`;
    action.projection.transport_error = e.message;
  }
  UI.set.busy = false;
  render();
}

/* ---- the shell ------------------------------------------------------------- */

function render() {
  /* No mount point, nothing to draw. The page boots only into `#app`, and its
     test drives the screens directly — an edit there must not go looking for a
     document that is not one. */
  const app = document.getElementById("app");
  if (!app) return;
  const n = needsYou(payload?.overview);
  /* The stale-daemon marker (#362). A service running something other than the
     files is visible from every screen, so nobody has to open Settings to find
     out. It reads the same comparison the Maintenance section draws. */
  const stale = runningDiff(payload)?.length ? `<span class="nav-marker">stale</span>` : "";
  const field = activeField();
  const typed = typedFields(app);
  app.innerHTML = `<div class="shell">
    ${desktopNav(n, stale)}
    <main>${SCREENS[UI.screen][1](payload)}</main>
    ${mobileNav(n, stale)}
    ${searchOverlay()}
    ${handoffSheet()}
  </div>`;
  document.title = (n ? `(${n}) ` : "") + "Curia app";
  restoreTyped(typed);
  restoreField(field);
  if (UI.screen === "chat") chatAfterRender();
  /* The hunks a card just asked for (#355). Started AFTER the page is written,
     so a renderer stays a renderer — and once each, because the marker the
     request left behind is what the next render reads. */
  drainDiffQueue();
}

function navMarker(k, needs, stale) {
  if (k === "home" && needs) return `<span class="nav-marker num">${needs}</span>`;
  if (k === "settings") return stale;
  return "";
}
function desktopNav(needs, stale) {
  return `<nav class="drawer" aria-label="Curia app pages"><span class="brand">curia · app</span>
    ${NAMES.map((k) => `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">
      <span class="nav-label">${SCREENS[k][0]}</span>${navMarker(k, needs, stale)}</button>`).join("")}
  </nav>`;
}
function mobileTab(k, icon, marker) {
  return `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">
    <span class="nav-icon" aria-hidden="true">${icon}</span><span class="nav-label">${SCREENS[k][0]}</span>${marker ?? ""}</button>`;
}
function mobileNav(needs, stale) {
  return `<nav class="notchbar" aria-label="Curia app pages">
    ${mobileTab("home", "⌂", navMarker("home", needs, stale))}
    ${mobileTab("maps", "▦")}
    <button class="agents-key ${UI.screen === "agents" || UI.screen === "chat" ? "on" : ""}" onclick="goto('agents')">
      <span class="nav-icon num">${needs}</span><span class="nav-label">Agents</span></button>
    ${mobileTab("feed", "≡")}
    ${mobileTab("settings", "⚙", navMarker("settings", needs, stale))}
  </nav>`;
}

/* The poll re-renders the whole page every few seconds, and the settings screen
   has fields somebody may be halfway through typing in. There the VALUE is
   never at risk — every keystroke lands on the draft — so what has to survive
   a render is the cursor, by id and offset. The setup forms (#874 to #879)
   and the GitHub App name have no draft: a token or a machine name lives in
   its field until the press sends it, and the rehearsal (#891) watched the
   poll clear it. So a render also carries over each of THOSE fields whose
   value is not the one the page drew, because that difference IS the
   operator's typing, by id. A field nobody touched takes the fresh render's
   value, so a read that moves a default is not undone. Only the draftless
   forms qualify: the chat box is drawn from its draft, and a send clears the
   draft, so carrying its element's text over would undo the send. */
const DRAFTLESS_FIELDS = 'input[id^="setup-"], select[id^="setup-"], textarea[id^="setup-"], #github-app-name';
function typedFields(app) {
  if (typeof app?.querySelectorAll !== "function") return [];
  const kept = [];
  for (const el of app.querySelectorAll(DRAFTLESS_FIELDS)) {
    if (el.type === "checkbox" || el.type === "radio") continue;
    const drawn = el.tagName === "SELECT"
      ? (Array.from(el.options ?? []).find((o) => o.defaultSelected)?.value ?? "")
      : String(el.defaultValue ?? "");
    if (String(el.value ?? "") !== drawn) kept.push({ id: el.id, value: el.value });
  }
  return kept;
}
function restoreTyped(kept) {
  for (const f of kept) {
    const el = document.getElementById(f.id);
    if (el && "value" in el) el.value = f.value;
  }
}
function activeField() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  let caret = null;
  try { caret = el.selectionStart; } catch { caret = null; }
  return { id: el.id, caret };
}
function restoreField(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || typeof el.focus !== "function") return;
  el.focus();
  if (f.caret != null && el.setSelectionRange) {
    try { el.setSelectionRange(f.caret, f.caret); } catch { /* not a text field */ }
  }
}

/* Entering a screen, from a click or from the hash. Settings and Chat are the
   two screens with a read of their own, and each is taken on arrival rather
   than on every poll: the config files change when somebody saves them, and the
   conversations change when somebody opens or deletes one — neither happens
   every five seconds.
   Chat re-reads on EVERY arrival, unlike settings. The list carries a context
   percent and a last-turn time, and both move with every turn taken from any
   device, so a held copy would age. */
function routeParts() { return location.hash.slice(1).split("/").filter(Boolean); }
function routeName(k) { return k === "frontier" ? "maps" : k; }
function enter(k) {
  k = routeName(k);
  if (UI.screen === "chat" && k !== "chat") applyChatRoute([]);
  UI.screen = k;
  if (k === "settings" && !settings) loadSettings();
  /* Reopening Setup during a run lands on the run (#891). */
  if (k === "setup" && setup?.full_loop?.run?.state === "running") UI.setup.panel = "run";
  if (k === "setup") loadSetup();
  if (k === "chat") loadConversations();
  if (k === "feed") recordFeedVisit();
}
/* The since-you-left marker's fact comes from the service (#704): the journal
   holds the instant each login last opened the Feed, so a phone and a laptop
   under one login agree, and a cleared browser forgets nothing. Entering the
   Feed draws the marker at the PREVIOUS stamp and posts this visit; the marker
   holds still until the next visit, so the page does not move it under the
   reader on every poll. */
async function recordFeedVisit() {
  const operator = payload?.operator;
  if (!operator) return;
  const previous = payload?.overview?.feed_reads?.[operator] ?? UI.feed.lastRead ?? null;
  UI.feed = { ...UI.feed, lastRead: previous, operator };
  const actionId = `app-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "feed-read", target: operator,
    conflict_key: "feed-read:" + operator, projection: { previous },
  });
  if (!action) return;
  UI.feed.note = null;
  try {
    const res = await fetch("/api/feed/read", {
      method: "POST", headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify({ action_id: actionId }),
    });
    const body = await res.json().catch(() => ({}));
    observeActions(body.action ? [body.action] : []);
    if (!body.action && !res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    reconcileFeedReadActions();
  } catch (error) {
    const current = actionFor({ action_id: actionId });
    if (!current || current.status === "pending") {
      UI.feed.note = `Could not confirm this Feed visit: ${error.message}. Your next visit will try again.`;
      finishAction(actionId);
    } else {
      UI.feed.note = `Checking whether this Feed visit was recorded: ${error.message}`;
    }
  }
  render();
}

function reconcileFeedReadActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "feed-read" || !TERMINAL_ACTION.has(action.status)) continue;
    if (action.status === "confirmed") UI.feed.note = null;
    else UI.feed.note = `Feed visit was not recorded: ${action.reason || "curia gave no reason"}.`;
    finishAction(action.action_id);
  }
}
/* Arriving at Maps from the nav is the LIST, always. The detail is a route of
   its own, so a tab press that did not name one must not land on the last one
   the operator happened to open. */
function goto(k) {
  enter(k);
  if (routeName(k) === "maps") UI.maps.open = false;
  if (k === "agents") UI.agents.open = false;
  /* The tab press is the picker (#711): a room is a route of its own. */
  if (k === "chat") applyChatRoute([]);
  location.hash = k;
  render();
}
window.addEventListener("hashchange", () => {
  const parts = routeParts();
  const k = routeName(parts[0] ?? "");
  if (!NAMES.includes(k)) return;
  /* Maps carries its detail in the hash (#700), so its route is re-read on
     every hash change and not only on a change of screen: back out of a detail
     view and the list must come back under the same tab. */
  const moved = k !== UI.screen;
  if (k === "maps") applyMapRoute(parts);
  if (k === "agents") applyAgentsRoute(parts);
  if (k === "chat") applyChatRoute(parts);
  if (moved) enter(k);
  if (moved || k === "maps" || k === "agents" || k === "chat") render();
});

/* ---- the poll -------------------------------------------------------------
   The operator's call on #263: refresh while this tab is visible, and stop
   when it is not. Every refresh costs the service a whole read of the journal
   off disk, so a tab nobody is looking at must cost nothing. The interval is
   the sidecar's to state — it comes back inside the payload — so one config
   key governs both halves and they cannot drift apart. */
let timer = null;

async function tick() {
  try {
    const res = await fetch("/api/overview", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    payload = await res.json();
    observeActions(payload?.overview?.actions);
    reconcileDaemonRestartActions(payload);
    recoverTerminalChatTakeBackActions(payload?.overview?.actions);
    reconcileStartActions(payload?.overview);
    reconcileAnswerActions(payload?.overview);
    reconcileChatMessageActions();
    reconcileChatTakeBackActions();
    reconcilePaneKeyActions();
    reconcileDialogAnswerActions();
    reconcileGitHubAppActions();
    reconcileAistackActions();
    reconcileConversationActions();
    reconcileSettingsActions();
    reconcileCredentialActions();
    reconcileFeedReadActions();
    reachable = true;
    if (UI.screen === "feed" && UI.feed.operator !== payload.operator) recordFeedVisit();
  } catch {
    /* Keep the last payload on screen: a page that blanks itself is worst
       exactly when the box is worst. */
    reachable = false;
  }
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  timer = setTimeout(tick, (payload?.poll_interval_s ?? 5) * 1000);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else clearTimeout(timer);
});

/* The page boots itself only in a browser. Its test loads the same source into
   a vm to call the screens directly, and a boot there would fetch nothing and
   render into no document. */
if (typeof document !== "undefined" && document.getElementById("app")) {
  const initialParts = routeParts();
  if (routeName(initialParts[0] ?? "") === "maps") applyMapRoute(initialParts);
  if (initialParts[0] === "agents") applyAgentsRoute(initialParts);
  if (initialParts[0] === "chat") applyChatRoute(initialParts);
  const initial = routeName(initialParts[0] ?? "");
  enter(NAMES.includes(initial) ? initial : "home");
  /* The file read happens at boot even when the operator lands somewhere else
     (#362): the stale-daemon marker on the Settings nav item compares the two,
     and a marker that needed the section opened would be a marker nobody sees.
     `enter` already took the read on the settings screen itself. */
  if (UI.screen !== "settings") loadSettings();
  /* The setup read at boot serves the Home pointer (#874): a fresh
     installation lands on Home, and the one thing it has to say there is
     which integrations are not connected yet. */
  if (UI.screen !== "setup") loadSetup();
  render();
  if (document.visibilityState === "visible") tick();
}
</script>
