function applyMapRoute(parts) {
  if (parts.length >= 4) {
    UI.maps.selected = { repo: `${parts[1]}/${parts[2]}`, map: parts[3] };
    UI.maps.open = true;
  } else {
    UI.maps.open = false;
  }
}

function mapSelect(repo, map) {
  UI.maps.selected = { repo, map };
  UI.maps.open = true;
  location.hash = mapRoute(repo, map);
  render();
}
function mapCardKey(event, repo, map) {
  if (event.target !== event.currentTarget || (event.key !== "Enter" && event.key !== " ")) return;
  event.preventDefault();
  mapSelect(repo, map);
}
function mapBack() {
  UI.maps.open = false;
  location.hash = "maps";
  render();
}
function mapRepo(repo) {
  UI.maps.repo = repo;
  UI.maps.selected = null;
  UI.maps.open = false;
  location.hash = "maps";
  render();
}

/* ---- the start control --------------------------------------------------- */

/* The ticket type is the `wayfinder:` label and nothing else — a ticket with no
   such label has no type, and saying so beats guessing one from another label. */
function typeOf(item) {
  /* The map snapshot names the type outright (#700); the frontier items carry
     labels instead. Either way the answer is the `wayfinder:` label and
     nothing else, and a ticket without one is untyped rather than guessed. */
  if (item?.type) return String(item.type);
  const l = (item.labels ?? []).find((x) => String(x).startsWith("wayfinder:"));
  return l ? String(l).slice("wayfinder:".length) : "untyped";
}
const shortRepo = (r) => String(r).split("/").pop();

/* Start (#266). The dispatch order — claim, prepare, spawn — is `start`'s own,
   and the reply that comes back is curia's sentence about what it did.

   Two facts ride beside the button. The ROUTED MODEL is the daemon's
   `resolveModel` answer, joined onto the item by reconcile, so the operator
   knows which account this press spends before spending it. And an agent
   ALREADY on this ticket replaces the button, because a second start on it is
   refused anyway and a button that only ever refuses is a worse way to say so.

   When the fleet could not be read, neither is claimed: the button stands, and
   the line under it says curia cannot tell. Null is not empty here either. */
function agentOn(o, repo, number) {
  if (o?.agents == null) return undefined;
  return o.agents.find((a) => String(a.ticket) === String(number) && (!a.repo || a.repo === repo)) ?? null;
}
function startRow(o, repo, n, showModel = true) {
  const live = agentOn(o, repo, n.number);
  const key = `start:${repo}#${n.number}`;
  if (live) return `<div class="act-row"><span class="dim-note mono">⧗ dispatched — ${esc(live.session)}</span></div>`;
  const model = n.model
    ? `<span class="dim-note mono">→ ${esc(n.model)} (${esc(typeOf(n))} default)</span>`
    : `<span class="dim-note">the routed model is not on this reading</span>`;
  return `<div class="act-row map-start">
      <button class="btn sm primary" ${busy(key) ? "disabled" : ""} onclick="startTicket('${js(repo)}','${js(n.number)}')">${
        busy(key) ? "Starting…" : "Start"}</button>${showModel ? model : ""}
    </div>
    ${live === undefined ? `<div class="dim-note">the fleet could not be read, so curia cannot say whether this one is already running</div>` : ""}
    ${said(key)}`;
}


/* ---- feed ------------------------------------------------------------------ */

function screenFeed(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Feed");
  const n = o.events?.length ?? 0;
  return `${head(p, "Feed", `<span class="dim-note">the journal's last ${esc(n)} event(s)</span>`)}
    ${atlasFeed(o)}<details class="legacy-feed"><summary>Journal rows</summary>${feedList(o.events)}</details>`;
}

/* The Wire (#523): news at full size, everything else compressed between.
   News is what the operator would want to have read: a gate, an ask, a
   verdict, a death, a deploy, a hold. */
const FEED_NEWS = new Set([
  "esc_open", "agent_blocked_on_human", "review_requested", "review_answered", "ticket_resolved",
  "lifecycle_closed", "agent_died", "agent_died_released", "agent_cancelled", "agent_abnormal_exit",
  "result", "deploy_landed", "deploy_rolled_back", "deploy_merge_refused", "dispatch_held",
  "death_resume_held", "stall_escalated", "provider_precooling", "token_warned", "bridge_wedged",
]);
const FEED_NEEDS = new Set(["esc_open", "agent_blocked_on_human", "review_requested", "stall_escalated"]);
/* The family chips (#523). One family visible, or all. `need` is a family of
   its own because it is the one the operator narrows to first. */
const FEED_FAMILIES = [["all", "all"], ["agent", "agents"], ["need", "needs you"], ["deploy", "deploys"], ["command", "commands"], ["system", "system"]];
const FEED_SYSTEM_RE = /^(config_|bridge_|token_|credential_|reauth_|journal_|restart_|reconcile$|aistack_|provider_|model_cooling|github_app_|deploy_unresolved)/;
function feedFamily(event) {
  const type = String(event.type ?? "");
  if (FEED_NEEDS.has(type)) return "need";
  if (type === "command") return "command";
  if (/^deploy_(requested|landed|rolled_back|merge_refused)$/.test(type)) return "deploy";
  if (FEED_SYSTEM_RE.test(type)) return "system";
  return "agent";
}

function feedDensity(events) {
  const bins = Array(24).fill(0);
  const now = Date.now();
  for (const event of events ?? []) {
    const age = now - Date.parse(event.ts ?? 0);
    if (age < 0 || age >= 86_400_000) continue;
    bins[23 - Math.floor(age / 3_600_000)] += 1;
  }
  const total = bins.reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...bins);
  return `<div class="feed-pulse"><span class="k">24 h · ${esc(total)} event${total === 1 ? "" : "s"}</span><div class="feed-density" aria-label="24-hour event density">${bins.map((count) => `<span class="density-cell${count ? " active" : ""}" style="height:${Math.max(3, Math.round(count * 100 / max))}%" aria-label="${count} event${count === 1 ? "" : "s"}"></span>`).join("")}</div></div>`;
}

function feedChips() {
  const on = UI.feed.family ?? "all";
  return `<div class="feed-chips" role="group" aria-label="Event family">${FEED_FAMILIES.map(([key, label]) =>
    `<button class="feed-chip${on === key ? " on" : ""}" onclick="feedFilter('${key}')" aria-pressed="${on === key}">${label}</button>`).join("")}</div>`;
}
function feedFilter(family) {
  UI.feed = { ...UI.feed, family };
  render();
}

/* Where an entry lands (#526, #704): the owning Chat when it names an agent,
   the map when it names one, else the GitHub record. */
function feedLink(event) {
  if (event.agent) return `<a href="${chatHref(event.agent)}">Chat →</a>`;
  if (event.map != null && event.repo) return `<a href="#${mapRoute(event.repo, event.map, "walked")}">Map →</a>`;
  if (event.url) return `<a href="${esc(event.url)}">GitHub →</a>`;
  if (event.repo && event.ticket != null) return `<a href="https://github.com/${esc(event.repo)}/issues/${esc(event.ticket)}">GitHub →</a>`;
  return "";
}

/* The second line of a news row: who, which ticket, how long ago. */
function feedDetail(event) {
  const parts = [];
  if (event.ticket != null && event.ticket !== "") parts.push(esc(ticketName(event.repo, event.ticket)));
  if (event.agent) parts.push(esc(event.agent));
  if (event.model) parts.push(esc(event.model));
  if (event.by) parts.push(esc(event.by));
  parts.push(esc(ago(event.ts)));
  return parts.join(" · ");
}

/* Consecutive mechanics fold when there are enough to hide news (#523).
   Nothing is dropped, only paced: the group names its count, its span and
   its kinds, and opens on a press. A family filter opens every group. */
const FEED_FOLD_AT = 4;
function feedMechanics(group, open) {
  const rows = group.map(({ event, line, focus }) =>
    `<div class="feed-mechanic${focus ? " focus" : ""}" data-family="${feedFamily(event)}"><time>${esc(clock(event.ts))}</time><span>${esc(line.tag)} · ${line.html}</span></div>`);
  if (group.length < FEED_FOLD_AT || group.some((g) => g.focus)) return rows.join("");
  const kinds = [...new Set(group.map((g) => g.line.tag))].slice(0, 5).join(", ");
  const last = group[group.length - 1].event.ts, first = group[0].event.ts;
  return `<details class="feed-fold"${open ? " open" : ""}><summary>${group.length} mechanics · ${esc(clock(last))} – ${esc(clock(first))} — ${esc(kinds)}</summary>${rows.join("")}</details>`;
}

function atlasFeed(o) {
  const family = UI.feed.family ?? "all";
  const all = [...(o.events ?? [])].reverse();
  const events = family === "all" ? all : all.filter((e) => feedFamily(e) === family);
  const top = feedDensity(o.events) + feedChips();
  if (!events.length) return `<div class="feed-wire">${top}<div class="empty">${all.length ? "No " + esc(FEED_FAMILIES.find(([k]) => k === family)?.[1] ?? family) + " events in the journal tail." : "The journal tail is empty."}</div></div>`;
  const lastRead = UI.feed?.lastRead ? Date.parse(UI.feed.lastRead) : null;
  const marker = `<div class="since-marker">Since you left · your last visit ${esc(ago(UI.feed.lastRead))} at ${esc(clock(UI.feed.lastRead))}</div>`;
  let marked = false;
  const rows = [];
  let pending = [];
  const flush = () => { if (pending.length) rows.push(feedMechanics(pending, family !== "all")); pending = []; };
  for (const event of events) {
    const stamp = Date.parse(event.ts ?? 0);
    if (!marked && lastRead && stamp <= lastRead) { flush(); rows.push(marker); marked = true; }
    const line = eventLine(event);
    const focus = Boolean(UI.feed.focus && (String(event.id ?? "") === UI.feed.focus.id
      || (UI.feed.focus.query && JSON.stringify(event).toLowerCase().includes(UI.feed.focus.query))));
    if (!FEED_NEWS.has(event.type)) { pending.push({ event, line, focus }); continue; }
    flush();
    const needs = FEED_NEEDS.has(event.type);
    rows.push(`<div class="feed-news${needs ? " needs" : ""}${focus ? " focus" : ""}${!needs && line.cls ? " " + line.cls : ""}" data-family="${feedFamily(event)}"><time>${esc(clock(event.ts))}</time>
        <div class="story"><span class="word">${needs ? "Needs you" : esc(line.tag)}</span>${line.html}<div class="l2">${feedDetail(event)}</div></div>${feedLink(event)}</div>`);
  }
  flush();
  if (!marked && lastRead) rows.push(marker);
  return `<div class="feed-wire">${top}${rows.join("")}</div>`;
}

/* ---- the drill-in section frame (#699) --------------------------------------

   Settings is the first Atlas page built as a LIST OF SECTIONS, and it is not
   meant to be the last. So the frame lives here, above Settings, and Settings
   is one registration in it.

   A page registers an ordered array of sections under its screen name in
   `DRILL_PAGES`, next to where that array is written. A section is:

     key       the name the drill state and the tests use. Unique per page.
     title     the row's word, and the heading of the open section.
     gist(p)   one short line under the title on the list, already escaped, or
               "" for a section that has nothing worth saying at a glance.
     body(p)   the open section itself.
     hint      optional. The words behind the `?` beside the heading.
     enter()   optional. Runs when the operator opens the section — this is
               where a section takes a read of its own, so the page does not
               fetch for sections nobody opened.

   A page that also WRITES adds three more, and Settings is the one that does:
   `patch(out)` folds this section's unsaved edits into the save patch,
   `count(patch)` says how many changes that is in the operator's own units,
   and `restarts(patch)` names the key paths in it that a save cannot apply
   live — the dock says those before the operator presses Save.

   The state is one open key per page plus `list`, which is the phone's half of
   it. Both halves are always RENDERED — one list, one open body — and the CSS
   decides which a given width shows, so nothing here measures a viewport. */
var DRILL_PAGES = {};
const drillState = (page) => (UI.drill[page] ??= { open: null, list: true });
const drillSections = (page) => DRILL_PAGES[page] ?? [];

/* The open section, defaulted. A desktop shows a section beside the list at
   all times, so "nothing open" is a phone state only, and the first section
   sits under it. */
function drillOpen(page) {
  const sections = drillSections(page);
  const d = drillState(page);
  if (!sections.some((x) => x.key === d.open)) d.open = sections[0]?.key ?? null;
  return sections.find((x) => x.key === d.open) ?? null;
}

/* One section at a time. `enter` runs on the arrival, not on the render, so a
   read a section takes costs one call rather than one per poll. */
function openSection(page, key) {
  const section = drillSections(page).find((x) => x.key === key);
  const d = drillState(page);
  if (section) d.open = section.key;
  d.list = false;
  if (section?.enter) section.enter();
  render();
}
function backToList(page) {
  drillState(page).list = true;
  render();
}

/* The `?` and the words behind it. The id is the row's, so two sections may
   carry the same explanation without sharing one open state. */
function toggleHint(id) {
  UI.hints[id] = !UI.hints[id];
  render();
}
const qq = (id) => `<button class="qq${UI.hints[id] ? " on" : ""}" aria-expanded="${
  UI.hints[id] ? "true" : "false"}" title="explain" onclick="toggleHint('${esc(id)}')">?</button>`;
const qhint = (id, words) => (UI.hints[id] ? `<div class="qhint">${words}</div>` : "");

function drillIn(page, p) {
  const sections = drillSections(page);
  const open = drillOpen(page);
  const d = drillState(page);
  const rows = sections.map((x) => {
    const gist = x.gist ? x.gist(p) : "";
    return `<button class="drill-row${open?.key === x.key ? " on" : ""}" onclick="openSection('${esc(page)}', '${esc(x.key)}')">
      <span><span class="t">${esc(x.title)}</span>${gist ? `<span class="g">${gist}</span>` : ""}</span>
      <span class="chev" aria-hidden="true">\u203a</span></button>`;
  }).join("");
  const heading = open
    ? `<div class="drill-head"><h3>${esc(open.title)}</h3>${open.hint ? qq(page + "-" + open.key) : ""}</div>
       ${open.hint ? qhint(page + "-" + open.key, open.hint) : ""}`
    : "";
  return `<div class="drill"${d.list ? "" : ` data-open="${esc(open?.key ?? "")}"`}>
    <div class="drill-list">${rows}</div>
    <div class="drill-body">
      <a class="drill-back" href="#${esc(page)}" onclick="backToList('${esc(page)}');return false">\u2039 ${esc(SCREENS[page][0].toLowerCase())}</a>
      ${heading}${open ? open.body(p) : ""}
    </div>
  </div>`;
}

/* ---- settings (#265) -------------------------------------------------------

   The one screen that writes. Three facts shape all of it.

   1. IT DRAWS ITS OWN READ. `GET /api/settings` is a fresh parse of
      curia.yaml and routing.yaml off disk, never the poll snapshot: both files
      are hand-edited on the box too, and a screen that offered to save over an
      edit it had not seen would lose it.
   2. IT POSTS ONLY WHAT CHANGED. The patch is the difference between `draft`
      and `settings`, so a field nobody touched is not written — which is what
      keeps a hand edit made while this tab was open from being clobbered by a
      save of something else.
   3. A SAVE APPLIES (#362). The sidecar asks the daemon to reload after a
      write that landed, and the answer rides back with the save. So the banner
      states an outcome — applied, declined, or the daemon is not answering —
      instead of handing the operator a second button to press. What "applied"
      means is measured: the daemon reports the settings it is RUNNING, and
      this screen compares them against the file it read. */

/* The six sections, in the order the list draws them. Each one is a whole
   setting in the operator's vocabulary: what a section shows, what it writes,
   and what a save of it costs. A later row lands as a field inside one of
   these or as another entry here — the pane and message rows (#716), the
   GitHub App rows (#705) — and nothing outside this array has to be told
   about it. */
const SET_SECTIONS = [
  {
    key: "routing", title: "Routing", gist: gistRouting, body: setRouting,
    hint: "The model each ticket type gets when no label on the ticket says otherwise.",
    patch: patchRouting, count: countRouting,
  },
  {
    key: "projects", title: "Projects", gist: gistProjects, body: setProjects,
    hint: "The repos curia watches. It dispatches against these and no others.",
    patch: patchWatch, count: countWatch,
    /* The repo list costs the daemon a GitHub call, so it is taken when this
       section is opened and not before. */
    enter: () => { if (repos === null) loadRepos(); },
  },
  {
    key: "dispatch", title: "Dispatch", gist: gistDispatch, body: setDispatch,
    hint: "Whether curia starts work, how many agents run, how often it checks, and how many prototype variations it offers.",
    patch: patchDispatch, count: countDispatch,
  },
  {
    key: "connections", title: "Connections", gist: gistConnections, body: setConnections,
    hint: "The GitHub App and repository access for each watched owner.",
  },
  {
    key: "aistack", title: "aistack", gist: gistAistack, body: setAistack,
    hint: "Whether this box publishes its token usage to your aistack stack, and the registration that decides it.",
    /* Its own read, and only when asked for: it is a daemon file read that the
       other sections have no use for. Re-read on every arrival rather than
       once, because the thing it reports can be changed on aistack.to. */
    enter: () => { loadAistack(); },
  },
  {
    key: "maintenance", title: "Maintenance", gist: gistMaintenance, body: setMaintenance,
    hint: "Whether the daemon runs what the files say, and the restart for the keys a save cannot apply.",
  },
];
DRILL_PAGES.settings = SET_SECTIONS;
const DISPATCH_FIELDS = [
  ["max_concurrent", "How many agents may run at once. Each one costs a container, and three sandbox ports."],
  ["poll_interval_s", "How often curia reads the frontier of every watched repo."],
  ["prototype_variations", "How many variations each prototype round offers by default."],
  ["messages_per_send", "How many typed messages one composite send may contain. The maximum is four."],
];

const clone = (x) => JSON.parse(JSON.stringify(x));

/* What the operator has changed and not yet saved. The dock counts these and
   the save posts them; both read this one function, so the count can never
   disagree with what lands on disk.

   Each section folds in its OWN keys. A section that adds a row adds it here
   and nowhere else, and a section that writes nothing — Maintenance — declares
   no `patch` and contributes none. */
function settingsPatch() {
  if (!settings || !draft) return {};
  const out = {};
  for (const section of SET_SECTIONS) if (section.patch) section.patch(out);
  return out;
}

function patchDispatch(out) {
  const d = {};
  for (const k of Object.keys(draft.dispatch)) {
    if (draft.dispatch[k] !== settings.dispatch[k]) d[k] = draft.dispatch[k];
  }
  if (Object.keys(d).length) out.dispatch = d;
  if ((draft.overseer?.live_pane_cap ?? 3) !== (settings.overseer?.live_pane_cap ?? 3)) {
    out.overseer = { live_pane_cap: draft.overseer.live_pane_cap };
  }
}
function patchWatch(out) {
  if (JSON.stringify(draft.watch) !== JSON.stringify(settings.watch)) out.watch = draft.watch;
}
function patchRouting(out) {
  const defaults = {};
  draft.routing.defaults.forEach((row, i) => {
    const before = settings.routing.defaults[i];
    if (row.model !== before?.model || (row.effort ?? null) !== (before?.effort ?? null)) {
      defaults[row.type] = row.effort ? { model: row.model, effort: row.effort } : row.model;
    }
  });
  const models = {};
  draft.routing.models.forEach((m, i) => {
    if (m.active !== settings.routing.models[i]?.active) models[m.name] = { active: m.active };
  });
  if (Object.keys(defaults).length || Object.keys(models).length) {
    out.routing = {};
    if (Object.keys(defaults).length) out.routing.defaults = defaults;
    if (Object.keys(models).length) out.routing.models = models;
  }
}

/* The count the dock says, in the operator's units rather than in yaml keys:
   the watch list replaces whole (config.mjs states that rule), so it is one
   change however many repos moved inside it. */
function countDispatch(p) { return Object.keys(p.dispatch ?? {}).length + (p.overseer ? 1 : 0); }
function countWatch(p) { return p.watch ? 1 : 0; }
function countRouting(p) { return Object.keys(p.routing?.defaults ?? {}).length + Object.keys(p.routing?.models ?? {}).length; }

function changeCount() {
  const p = settingsPatch();
  let n = 0;
  for (const section of SET_SECTIONS) n += section.count ? section.count(p) : 0;
  return n;
}

/* What this save cannot apply without a restart, named BEFORE the operator
   presses Save. Every row the screen writes today is inside the reload's
   closed set (settings.mjs LIVE_PATHS), so this is empty — and it is a seam
   rather than an absence because the rows landing next are not all live, and
   an operator must never learn about a restart from the outcome.

   A hand edit that rode along outside the live set is a different fact: this
   screen cannot see it, and the daemon's own refusal is what names it, in the
   dock's declined state below. */
function restartNeeds() {
  const p = settingsPatch();
  const out = [];
  for (const section of SET_SECTIONS) for (const key of (section.restarts ? section.restarts(p) : [])) out.push(key);
  return out;
}

/* ---- what the daemon is running (#362) --------------------------------------

   Applied is a fact curia measured, not a claim the save made. `GET /overview`
   carries the settings the daemon RUNS and the instant it read them; this
   compares them, key by key, against the file this screen read.

   Null means curia cannot tell — no snapshot, no file read, or a daemon that is
   not answering, whose last reading says what WAS true and not what is. Null is
   never drawn as agreement: "unknown" and "in step" are opposite facts. */
const sameJSON = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

function runningDiff(p) {
  const run = p?.overview?.daemon?.config;
  if (!run || !settings || !p.daemon_up) return null;
  const out = [];
  for (const k of Object.keys(settings.dispatch)) {
    if (!sameJSON(settings.dispatch[k], run.dispatch?.[k])) out.push("dispatch." + k);
  }
  if (!sameJSON(settings.overseer?.live_pane_cap, run.overseer?.live_pane_cap)) out.push("overseer.live_pane_cap");
  if (!sameJSON(settings.watch, run.watch)) out.push("watch");
  const rows = (list) => new Map((list ?? []).map((r) => [r.type, {
    model: typeof r.model === "object" ? r.model?.model : r.model,
    effort: r.effort ?? (typeof r.model === "object" ? r.model?.effort : null) ?? null,
  }]));
  const [fileRows, runRows] = [rows(settings.routing.defaults), rows(run.routing?.defaults)];
  for (const type of new Set([...fileRows.keys(), ...runRows.keys()])) {
    if (!sameJSON(fileRows.get(type), runRows.get(type))) out.push("routing.defaults." + type);
  }
  const switches = (list) => new Map((list ?? []).map((m) => [m.name, m.active !== false]));
  const [fileSw, runSw] = [switches(settings.routing.models), switches(run.routing?.models)];
  for (const name of new Set([...fileSw.keys(), ...runSw.keys()])) {
    if (!sameJSON(fileSw.get(name), runSw.get(name))) out.push("routing.models." + name + ".active");
  }
  return out;
}

/* ---- the save dock: one act, at the bottom (#525's decision, #699) ---------

   A clean screen carries no save chrome at all. The dock rises on the first
   edit with the count, the Save and a discard, and it names the restart the
   pending edits will need. After the press it stays in the same place and
   states the outcome the daemon reported — applied, declined, offline — or the
   refusal, which moved nothing on disk. A button appears only where it IS the
   mitigation, so the one the dock offers is always the one to press. */

function saveDock() {
  const n = changeCount();
  const s = UI.set;
  const dock = (cls, body) => `<div class="dock${cls ? " " + cls : ""}">${body}</div>`;
  const save = `<button class="btn primary" ${s.busy ? "disabled" : ""} onclick="doSave()">Save</button>`;
  const discard = `<a href="#settings" onclick="discardEdits();return false">discard</a>`;
  const restart = `<button class="btn restart-hot" ${s.busy ? "disabled" : ""} onclick="doRestart()">Restart to apply</button>`;

  /* The file could not be read, which is the one state with no draft behind
     it. It stands whatever else is true. */
  if (s.phase === "unread") {
    return dock("refused", `<span class="toast bad">The settings could not be read.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  if (s.busy) return dock("", `<button class="btn" disabled>Saving\u2026</button>`);
  if (s.phase === "restarting") {
    return dock("", `<span class="toast">The daemon exited nonzero and the supervisor respawns it.
      This page serves its last snapshot meanwhile.</span>`);
  }
  if (s.phase === "refused") {
    /* The loaders refused the candidate, so nothing on disk moved. The draft
       stays on screen: the operator fixes the value they typed, they do not
       type it again. */
    return dock("refused", `<span class="toast bad">Refused \u2014 nothing was written.</span>
      ${n ? save : ""}<span class="why">${esc(s.error)}</span>`);
  }
  if (n > 0) {
    const needs = restartNeeds();
    return dock("", `<span class="toast"><b class="num">${n}</b> unsaved change${n === 1 ? "" : "s"}</span>
      ${save}${discard}
      <span class="why">${needs.length
        ? `a restart applies ${needs.map(esc).join(", ")} \u2014 every other change lands at once`
        : "every change here lands at once, with no restart"}</span>`);
  }
  if (s.phase === "applied") {
    return dock("saved", `<span class="ok-word">saved \u2713</span>
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon is running it.</span>`);
  }
  if (s.phase === "declined") {
    /* The file moved a key a reload cannot apply, so the daemon kept the config
       it booted with. The restart is the mitigation, and it is the loud one. */
    return dock("saved", `<span class="ok-word">saved \u2713</span>${restart}
      <span class="toast">The daemon did not apply it.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  if (s.phase === "offline") {
    /* No button: a restart is not the mitigation for a daemon that is already
       not answering, and pressing one would be an order nobody takes. */
    return dock("saved", `<span class="ok-word">saved \u2713</span>
      <span class="toast">The daemon is not answering, so it takes this file at its next boot.
        If it refuses to boot, the daemon log names the key.</span>
      <span class="why">${esc(s.error)}</span>`);
  }
  /* A save that found the files already saying it. Worth one sentence, and
     nothing to press. */
  if (s.note) return dock("", `<span class="toast">${esc(s.note)}</span>`);
  /* Clean, and nothing has been pressed. No dock at all. */
  return "";
}

/* ---- the five sections ------------------------------------------------------

   Each one is a body and a gist. The gist is what the list row says at a
   glance, so an operator picks the section they want without opening three. */

const activeModels = () => draft.routing.models.filter((m) => m.active);

function gistRouting() {
  const untyped = draft.routing.defaults.find((r) => r.type === "untyped");
  const models = draft.routing.models;
  return esc(`${untyped ? untyped.model + " untyped \u00b7 " : ""}${activeModels().length} of ${models.length} models on`);
}

/* Routing. The ticket-type rows lead and the model list sits behind one click,
   because the row an operator changes is the default, and the model list is
   the thing they set once. */
function setRouting() {
  const models = draft.routing.models;
  const active = activeModels();
  const rows = draft.routing.defaults.map((row, i) => {
    const known = active.some((m) => m.name === row.model);
    return `<div class="row"><span class="key grow">${esc(row.type)}</span>
      <select onchange="setDefault(${i}, this.value)">
        ${active.map((m) => `<option ${m.name === row.model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        ${known ? "" : `<option selected>${esc(row.model)}</option>`}
      </select>
      <select aria-label="${esc(row.type)} reasoning effort" onchange="setDefaultEffort(${i}, this.value)">
        <option value="" ${row.effort ? "" : "selected"}>model default</option>
        ${["low", "medium", "high", "xhigh", "max", "ultra"].map((effort) =>
          `<option ${row.effort === effort ? "selected" : ""}>${effort}</option>`).join("")}
      </select>${known ? "" : `<span class="dim-note">Switched off. The daemon refuses this config.</span>`}</div>`;
  }).join("");
  const mgr = `<div class="row"><span class="grow"><a href="#settings"
      onclick="UI.set.models=!UI.set.models;render();return false">${
      active.length} of ${models.length} models active \u00b7 ${UI.set.models ? "close" : "manage"}</a></span>
    ${qq("set-models")}</div>
    ${qhint("set-models", `A model switched off keeps its whole entry in <span class="mono">routing.yaml</span>. It leaves the
      dispatch vocabulary: no default may name it, a fallback chain steps over it, and a <code>model:</code> label on it is refused.`)}`;
  const table = UI.set.models
    ? `<div class="rows model-mgr">${models.map((m, i) => `<div class="row${m.active ? "" : " inactive"}">
        <input type="checkbox" id="set-model-${esc(m.name)}" ${m.active ? "checked" : ""} onchange="setModelActive(${i}, this.checked)">
        <span class="key grow">${esc(m.name)}${m.id ? ` <span class="dim-note">${esc(m.id)}</span>` : ""}</span>
        <span class="key dim-note">runs on ${esc(m.provider ?? "?")} \u00b7 ${esc(m.harness ?? "?")}</span></div>`).join("")}</div>`
    : "";
  return `<div class="rows">${rows}${mgr}</div>${table}`;
}

function gistProjects() { return esc(`${draft.watch.length} repo${draft.watch.length === 1 ? "" : "s"} watched`); }

/* Projects. The repo list comes from the daemon, which holds the GitHub login;
   this page holds no credential at all. */
function setProjects() {
  const watched = draft.watch.map((w) => w.repo);
  const rows = draft.watch.map((w, i) => `<div class="row"><span class="key grow">${esc(w.repo)}</span>
    <span class="dim-note">${esc(w.mode)}</span>
    <button class="btn sm" ${draft.watch.length < 2 ? "disabled" : ""} onclick="removeRepo(${i})">remove</button></div>`).join("");
  let connect;
  if (repos === null) connect = `<div class="gh-connect"><span class="dot off"></span>reading the GitHub login\u2026</div>`;
  else if (repos.error) {
    /* Null is not empty: curia could not ask, which is a different fact from
       an account with no repos. The typed field below still works. */
    connect = `<div class="unread">curia could not read your repos from GitHub \u2014 ${esc(repos.error)}. Type a repo below instead.</div>`;
  } else {
    connect = `<div class="gh-connect"><span class="dot"></span>GitHub connected as
      <b class="mono">${esc(repos.login ?? "?")}</b>
      <span class="dim-note">the ${esc(repos.repos?.length ?? 0)} most recently pushed repos it can reach</span></div>`;
  }
  const choices = (repos?.repos ?? []).filter((r) => !watched.includes(r));
  const picker = choices.length
    ? `<select id="set-repo-pick" onchange="addRepo(this.value); this.value=''">
        <option value="">add a repo\u2026</option>${choices.map((r) => `<option>${esc(r)}</option>`).join("")}</select>`
    : "";
  return `${connect}<div class="rows">${rows}
    <div class="row"><span class="grow">${picker}
      <input type="text" id="set-repo-typed" placeholder="owner/name" size="20">
      <button class="btn sm" onclick="addTypedRepo()">add</button></span>${qq("set-watch")}</div>
    ${qhint("set-watch", "The last repo cannot be removed: curia dispatches only against watched repos.")}</div>`;
}

function gistDispatch() {
  const d = draft.dispatch;
  return esc(`${d.auto_dispatch ? "auto" : "manual"} \u00b7 ${d.max_concurrent} agents \u00b7 ${d.poll_interval_s}s`);
}

function setDispatch() {
  const rows = DISPATCH_FIELDS.map(([key, why]) => `<div class="row">
    <label class="key grow" for="set-${esc(key)}">${esc(key)}</label>
    <input type="number" id="set-${esc(key)}" min="1" value="${esc(draft.dispatch[key] ?? "")}"
      oninput="setDispatchField('${esc(key)}', this.value)">${qq("set-" + key)}</div>
    ${qhint("set-" + key, esc(why))}`).join("");
  return `<div class="rows">
    <div class="row"><label class="key grow" for="set-auto">auto_dispatch</label>
      <input type="checkbox" id="set-auto" ${draft.dispatch.auto_dispatch ? "checked" : ""}
        onchange="setDispatchField('auto_dispatch', this.checked)">${qq("set-auto")}</div>
    ${qhint("set-auto", "On, curia starts the next takeable ticket by itself. Off, every dispatch is one the operator ordered.")}
    ${rows}
    <div class="row"><label class="key grow" for="set-live_pane_cap">live_pane_cap</label>
      <input type="number" id="set-live_pane_cap" min="1" value="${esc(draft.overseer?.live_pane_cap ?? 3)}"
        oninput="setOverseerField('live_pane_cap', this.value)">${qq("set-live_pane_cap")}</div>
    ${qhint("set-live_pane_cap", "How many overseer conversations keep a live pane. Curia rehydrates parked conversations when needed.")}</div>
    <p class="qhint" style="padding-top:10px">A save applies at once. It cancels no running agent:
      auto_dispatch off leaves every live agent running, and a max_concurrent below the live count
      starts nothing new until the count falls. A model change reaches the next dispatch, never a
      running one.</p>`;
}

function gistConnections(p) {
  const app = p?.overview?.github_app;
  if (!app) return `<span class="dim-note">state unavailable</span>`;
  if (!app.configured) return `<span style="color:var(--warn)">setup needed</span>`;
  if (app.installations?.state !== "read") return `<span class="dim-note">installations unread</span>`;
  const missing = (app.owners ?? []).filter((owner) => owner.installed === false).length;
  return missing
    ? `<span style="color:var(--warn)">${esc(missing)} owner${missing === 1 ? "" : "s"} missing access</span>`
    : `<span style="color:var(--ok)">installed</span>`;
}

/* The owner row's third state (#762). `installed` is null when the reading
   has not landed or failed, and that must never read as "missing access":
   an operator sent to install on an owner that already has the app would
   be repairing a fact about GitHub's reachability. */
function ownerState(owner, reading) {
  if (owner.installed === true) return "installed";
  if (owner.installed === false) return "missing access";
  return reading?.state === "failed" ? "unknown (read failed)" : "unknown (not read yet)";
}

function setConnections(p) {
  const app = p?.overview?.github_app;
  if (!app) return `<p class="unread">Curia hasn't reported the GitHub App state.</p>`;
  const facts = app.app;
  const state = app.configured
    ? `<div class="rows">
    <div class="row"><span class="key grow">App id</span><span>${esc(facts?.id ?? "")}</span></div>
    <div class="row"><span class="key grow">Slug</span><span>${facts?.slug ? esc(facts.slug) : `<span class="dim-note">not read yet</span>`}</span></div>
    <div class="row"><span class="key grow">Bot login</span><span>${facts?.bot_login ? esc(facts.bot_login) : `<span class="dim-note">not read yet</span>`}</span></div>
    <div class="row"><span class="key grow">Key file</span><span>${esc(facts?.key_file ?? "")}</span></div>
    ${facts?.settings_url ? `<div class="row"><span class="key grow">Settings</span><span><a href="${esc(facts.settings_url)}" target="_blank" rel="noopener">App settings page on GitHub</a></span></div>` : ""}
    </div>
    <p class="qhint">Curia adopts new credentials without exposing the private key to Atlas.</p>`
    : app.status === "pending"
      ? `<p class="unread">GitHub App setup is pending until ${esc(ago(app.expires_at))}.</p>`
      : `<p class="unread">No GitHub App is configured. Create one from Atlas.</p>`;
  const setupAction = actionFor({ conflict_key: "github-app:setup" });
  const refreshAction = actionFor({ conflict_key: "github-app:installations" });
  const create = app.configured ? "" : `<p><input id="github-app-name" value="curia-box" aria-label="GitHub App name">
    <button class="btn primary" ${setupAction ? "disabled" : ""} onclick="doGitHubAppSetup()">Create GitHub App</button></p>
    ${setupAction ? `<p class="qhint">${esc(setupAction.progress || "Starting GitHub App setup")}</p>` : ""}
    ${said("github-app")}`;
  const manual = app.manual_url
    ? `<p class="qhint"><a href="${esc(app.manual_url)}" target="_blank" rel="noopener">Set up a GitHub App by hand on GitHub</a></p>` : "";
  const reading = app.installations ?? null;
  const readLine = !app.configured ? "" : reading?.state === "read"
    ? `<p class="qhint">Installations read ${esc(ago(reading.at))}.</p>`
    : reading?.state === "failed"
      ? `<p class="unread">The installation read failed ${esc(ago(reading.at))}: ${esc(reading.error ?? "")}</p>`
      : `<p class="unread">Installations have not been read yet.</p>`;
  const refresh = !app.configured ? "" : `<p><button class="btn" ${refreshAction ? "disabled" : ""} onclick="doGitHubAppRefresh()">Re-read installations</button></p>
    ${refreshAction ? `<p class="qhint">${esc(refreshAction.progress || "Starting the installation read")}</p>` : ""}
    ${said("github-app-refresh")}`;
  const owners = (app.owners ?? []).map((owner) => `<div class="row">
    <span class="key grow">${esc(owner.owner)}</span>
    <span>${esc(ownerState(owner, reading))}</span>
    <span><a href="${esc(owner.install_url)}" target="_blank" rel="noopener">${owner.installed === true ? "Manage installation" : "Install on this owner"}</a></span></div>`).join("");
  return `${state}${create}${manual}${readLine}<div class="rows">${owners}</div>${refresh}`;
}

/* Maintenance (#362). Last, because it is the section an operator
   reads rather than edits. It says one thing — whether the daemon runs the
   file — and carries the one act that answers a no. */
function gistMaintenance(p) {
  const differs = runningDiff(p);
  if (differs === null) return `<span class="dim-note">curia cannot tell</span>`;
  if (differs.length) return `<span style="color:var(--warn)">${esc(differs.length)} key${differs.length === 1 ? "" : "s"} not running</span>`;
  return `<span style="color:var(--ok)">in step</span>`;
}

function setMaintenance(p) {
  const differs = runningDiff(p);
  const run = p?.overview?.daemon?.config;
  let state;
  if (differs === null) {
    state = `<p class="unread">curia cannot tell whether the daemon runs these files: ${
      p?.daemon_up === false ? "it is not answering." : "there is no reading of it yet."}</p>`;
  } else if (differs.length) {
    state = `<p class="unread">The daemon is NOT running the files. These differ:
      <span class="mono">${differs.map(esc).join(", ")}</span>. A restart takes them.</p>`;
  } else {
    state = `<p class="qhint">The daemon is running these files. It read them ${esc(ago(run?.loaded_at))}.</p>`;
  }
  /* #292: the screen reads two layers and writes only the top one. Said here,
     because "I saved and git shows nothing changed" must not be a puzzle the
     operator has to solve on the box. */
  const writes = settings.writes
    ? `A save writes <span class="mono">${esc(fileName(settings.writes.curia))}</span> and
       <span class="mono">${esc(fileName(settings.writes.routing))}</span>, beside the tracked files.
       Git does not track those, so the box's checkout stays clean and a deploy never collides with a
       save. They hold what this box answers differently, and nothing else.`
    : "";
  return `${state}<div class="rows">
    <div class="row"><span class="grow"><button class="btn${differs?.length ? " restart-hot" : ""}"
      ${UI.set.busy ? "disabled" : ""} onclick="doRestart()">Restart daemon</button></span>${qq("set-restart")}</div>
    ${qhint("set-restart", `A restart is for the keys a save cannot apply: the ports,
      <span class="mono">workspace_root</span>, <span class="mono">sandbox</span>,
      <span class="mono">identity</span>, and every routing key this screen does not write.
      Agent panes live in their own container, so they survive it.`)}
    ${writes ? `<div class="row"><span class="grow dim-note">where a save lands</span>${qq("set-writes")}</div>${qhint("set-writes", writes)}` : ""}
  </div>`;
}

/* ---- aistack (#706) ---------------------------------------------------------

   The section that guides a headless registration and then reports what came
   of it. Three facts shape it, and each one is a thing this section does NOT
   do.

   1. IT DOES NOT APPROVE. #695 settled that the approval is a human act in a
      signed-in browser, and nothing on the box can perform it. So this section
      starts the CLI's device flow and shows the two things only the box knows
      — the code and the link — and the operator finishes it on whatever screen
      they are already holding. That deletes the ssh from the ceremony without
      moving the approval anywhere.
   2. IT DOES NOT SEE THE CREDENTIAL. The token lives in a file under curia's
      HOME and never leaves the daemon. What arrives here is a code meant to be
      read aloud, a link meant to be opened, a proposed machine name, and the
      hosts the credential file is keyed by. There is no field on this wire
      that could carry a bearer.
   3. IT WRITES NO CONFIGURATION, so it declares no `patch`, `count` or
      `restarts` and the save dock never rises for it. The credential IS the
      switch (#695): an `enabled` key here would be a second answer to a
      question that already has one.

   The read is its own, taken when the section is opened and after every press,
   never on the poll: it costs the daemon a file read and the other sections
   have no use for it. While a login waits for approval the section re-reads on
   a short timer, because the thing it is waiting for happens on a different
   device and nothing else would tell it. */

const AISTACK_MACHINES_URL = "https://aistack.to/settings/machines";
/* The approval window is the CLI's own: it polls for three minutes. */
const AISTACK_WAIT_MS = 5000;

const agoMs = (ms) => (ms ? ago(new Date(ms).toISOString()) : "never");

async function loadAistack() {
  try {
    const res = await fetch("/api/aistack", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    aistack = await res.json();
  } catch (e) {
    aistack = { ok: false, error: e.message };
  }
  aistackWatch();
  render();
}

/* One timer, armed only while a login is actually waiting. The section is a
   settings row on a page that re-renders on every poll, so a timer armed per
   render would multiply. */
function aistackWatch() {
  if (aistackAct.poll) { clearTimeout(aistackAct.poll); aistackAct.poll = null; }
  if (aistack?.flow?.phase !== "waiting") return;
  aistackAct.poll = setTimeout(() => { aistackAct.poll = null; loadAistack(); }, AISTACK_WAIT_MS);
}

async function aistackDo(act) {
  if (aistackAct.busy) return;
  aistackAct.busy = act;
  aistackAct.said = null;
  render();
  try {
    const res = await fetch("/api/aistack/" + act, {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: "{}",
    });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the sidecar answered " + res.status));
    aistack = b;
    if (b.said) aistackAct.said = { ok: true, text: b.said };
  } catch (e) {
    aistackAct.said = { ok: false, text: e.message };
  }
  aistackAct.busy = null;
  aistackWatch();
  render();
}

/* What the last sync attempt came to, in one clause. Absent is not the same as
   failing and neither is the same as never having run, so all three have their
   own words. */
function aistackVerdict(a) {
  const last = a?.sync?.last ?? null;
  if (a?.sync?.alarm) return { ok: false, text: "the last sync failed " + agoMs(a.sync.alarm.at) };
  if (!last) return { ok: null, text: "no sync has run yet" };
  if (!last.ok) return { ok: false, text: "the last sync failed " + agoMs(last.at) };
  return { ok: true, text: (last.published ? "published " : "synced ") + agoMs(last.at) };
}

function gistAistack() {
  if (!aistack) return `<span class="dim-note">not read yet</span>`;
  if (aistack.ok === false) return `<span class="dim-note">curia cannot tell</span>`;
  if (aistack.flow?.phase === "waiting") return `<span style="color:var(--warn)">waiting for approval</span>`;
  if (!aistack.registered) return `<span class="dim-note">not registered</span>`;
  const v = aistackVerdict(aistack);
  return `<span style="color:${v.ok === false ? "var(--warn)" : v.ok ? "var(--ok)" : "var(--ink-dim)"}">${esc(v.text)}</span>`;
}

function setAistack() {
  if (!aistack) return `<p class="qhint">reading…</p>`;
  if (aistack.ok === false) {
    return `<p class="unread">curia cannot say whether this box is registered: ${esc(aistack.error ?? "the daemon is not answering")}.
      The registration lives on the daemon, so this section is blank exactly while the daemon is.</p>`;
  }
  const said = aistackAct.said
    ? `<p class="${aistackAct.said.ok ? "qhint" : "unread"}">${esc(aistackAct.said.text)}</p>`
    : "";
  const flow = aistack.flow ?? {};
  const busy = aistackAct.busy;
  const btn = (act, label, extra) => `<button class="btn${extra ? " " + extra : ""}"${
    busy ? " disabled" : ""} onclick="aistackDo('${esc(act)}')">${esc(busy === act ? "…" : label)}</button>`;

  /* The waiting half. The code and the link are the whole of what the operator
     needs, so they are the whole of what is on the screen — big enough to read
     off a phone across a room, and the link is the one the CLI printed rather
     than one this page composed. */
  if (flow.phase === "waiting") {
    return `${said}<p class="unread">Approve this box on aistack. The code below is live for about three minutes;
      after that, start a new registration.</p>
      <div class="rows">
        <div class="row"><span class="key">code</span><span class="grow mono" style="font-size:22px;letter-spacing:2px">${esc(flow.code ?? "—")}</span></div>
        <div class="row"><span class="key">approve at</span><span class="grow"><a href="${esc(flow.url ?? "#")}" target="_blank" rel="noopener">${esc(flow.url ?? "—")}</a></span></div>
        <div class="row"><span class="grow">${btn("cancel", "Stop waiting")}</span>${qq("set-aistack-wait")}</div>
        ${qhint("set-aistack-wait", `Open the link on any signed-in machine, name this box, pick the stack, and approve.
          The approval cannot happen here: it needs a browser signed in to aistack, and the box has none.
          This section re-reads itself while it waits, so it will say so on its own.`)}
      </div>`;
  }

  /* The unregistered half. One button, plus the same two commands over ssh for
     the operator who would rather type them — they are the daemon README's,
     and curia states them rather than making anyone go and find them. */
  if (!aistack.registered) {
    const why = ["failed", "expired", "cancelled"].includes(flow.phase)
      ? `<p class="unread">The last registration ${esc(flow.phase)}: ${esc(flow.message ?? "no reason given")}.
         ${flow.phase === "failed" ? `Read <span class="mono">${esc(aistack.log_file ?? "")}</span> on the box.` : ""}
         Start a new one — a new login mints a new code.</p>`
      : `<p class="qhint">This box is not an aistack machine, so curia publishes nothing and says nothing about it.
         Registering it puts the agents' rolling 30-day token spend on your measured layer.</p>`;
    return `${said}${why}<div class="rows">
      <div class="row"><span class="grow">${btn("register", "Register this box")}</span>${qq("set-aistack-reg")}</div>
      ${qhint("set-aistack-reg", `Curia runs the aistack CLI's device login on the box and shows you its code and link.
        You approve in a browser that is signed in to aistack. The token it hands back is written to a file under curia's
        own home, outside every checkout — it never reaches this page and no commit ever carries it.`)}
      ${aistackCommands(aistack)}
    </div>`;
  }

  /* The registered half: who this box is on aistack, and what the recurring
     sync last did. */
  const m = aistack.machine ?? {};
  const v = aistackVerdict(aistack);
  const alarm = aistack.sync?.alarm ?? null;
  const state = alarm
    ? `<p class="unread">The sync is failing: ${esc(alarm.message ?? "no reason given")}.
       Read <span class="mono">${esc(aistack.log_file ?? "")}</span> on the box. If the machine is gone from
       <a href="${esc(AISTACK_MACHINES_URL)}" target="_blank" rel="noopener">aistack.to/settings/machines</a>,
       delete the credential on the box and register it again; if it is still there, grant the standing permission below.</p>`
    : `<p class="qhint">This box is registered. Curia checks every
       ${esc(aistack.sync?.interval_hours ?? "?")}h; the stack's own frequency decides how often a check actually publishes.</p>`;
  const published = aistack.sync?.last?.published ?? null;
  return `${said}${state}<div class="rows">
    <div class="row"><span class="key">machine</span><span class="grow mono">${esc(m.proposed ?? "unknown")}</span>${qq("set-aistack-machine")}</div>
    ${qhint("set-aistack-machine", `The name this box PROPOSED at registration, which is its hostname. The approval page can rename a
      machine and the credential file records no name, so the name aistack shows is the one on
      <a href="${esc(AISTACK_MACHINES_URL)}" target="_blank" rel="noopener">aistack.to/settings/machines</a>. That page is also where you revoke it.`)}
    <div class="row"><span class="key">stack</span><span class="grow mono">${esc((m.servers ?? []).join(", ") || "—")}</span></div>
    <div class="row"><span class="key">registered</span><span class="grow dim-note">${esc(m.at ? agoMs(m.at) : "before curia started recording it")}</span></div>
    <div class="row"><span class="key">last sync</span><span class="grow" style="color:${
      v.ok === false ? "var(--warn)" : v.ok ? "var(--ok)" : "var(--ink-dim)"}">${esc(v.text)}${
      published ? ` — <a href="${esc(published)}" target="_blank" rel="noopener">the stack</a>` : ""}</span></div>
    <div class="row"><span class="grow">${btn("optin", "Grant standing permission")}</span>${qq("set-aistack-optin")}</div>
    ${qhint("set-aistack-optin", `The second half of the ceremony, and the one a registration alone does not do: it tells the stack this
      machine may publish without anyone present. A box that is registered but never granted this syncs nothing and fails
      with a permission message. Pressing it twice is harmless.`)}
    ${aistackCommands(aistack)}
  </div>`;
}

/* The same two acts as shell lines, for the operator at a terminal. Behind a
   `?`, because the point of this section is that nobody has to type them. */
function aistackCommands(a) {
  const c = a?.commands;
  if (!c) return "";
  return `<div class="row"><span class="grow dim-note">the same thing over ssh</span>${qq("set-aistack-ssh")}</div>
    ${qhint("set-aistack-ssh", `<span class="mono">${esc(c.login)}</span><br><span class="mono">${esc(c.opt_in)}</span><br>
      Run them as curia's own HOME, which is what those lines say. Curia picks the credential up on its next tick either way.`)}`;
}

/* ---- the chat (#267, many conversations by #333, a page of Atlas by #711) ----

   Chat is two views under one route. `#chat` is the PICKER: every ticket
   conversation and every overseer conversation curia holds, in two sections,
   because the two roles own different work (ADR-0024). `#chat/<session>` is
   the ROOM: one transcript, read through the daemon's active-branch tailer
   (#689) over server-sent events, and one composer.

   The room renders from STATE, never from the DOM. The whole page is redrawn
   on every poll, so the stream writes into `chat` and the screen is a pure
   function of it - which is also what lets the test drive the room without a
   browser: it feeds `chatReceive` the same events the stream carries.

   A parked conversation is a conversation (ADR-0024): the pane returns on its
   next message, and nothing here says "parked". An ENDED agent is different -
   the pane is gone for good - so its transcript stays readable and the
   composer says why it takes nothing. Both facts come from curia: `live` on
   the picker row, `ended` on the stream's hello. */
const CHAT_PAGE = "/chat";
const chatRoute = (session) => "chat/" + encodeURIComponent(session);
const chatHref = (session) => "#" + chatRoute(session);
const OVERSEER_SESSION_RE = /^curia-console-\d+$/;
const chatRole = (session) => (OVERSEER_SESSION_RE.test(session ?? "") ? "overseer" : "ticket");
const ENDED_SENTENCE = (session) => `${session} has ended. Its transcript stays readable, and it takes no new message.`;

function chatFresh(session) {
  return {
    session, conn: "connecting", file: null, harness: null, ended: null, clients: 0,
    items: [], open: [], history: [], parse: null, dialog: null, receipt: null,
    draft: "", mirror: false, notes: [], lastEdit: 0, stick: true, terminal: false,
    client: Math.random().toString(36).slice(2, 8), es: null,
  };
}
var chat = chatFresh(null);

/* The route decides the view (#700's rule): a reload and a back press land
   where they were, and the tab press lands on the picker. */
function applyChatRoute(parts) {
  const session = parts.length >= 2 ? decodeURIComponent(parts[1]) : null;
  if (session === chat.session) return;
  chatClose();
  chat = chatFresh(session);
  chatMountTerminal();
  chatConnect();
}
function chatClose() {
  if (chat.es) { try { chat.es.close(); } catch { /* already closed */ } }
  chat.es = null;
}
const CHAT_EVENTS = ["hello", "items", "reset", "parse", "dialog", "escalations", "esc_history", "clients", "draft", "sent"];
function chatConnect() {
  if (!chat.session || typeof EventSource === "undefined") return;
  const es = new EventSource(`/events?session=${encodeURIComponent(chat.session)}&client=${chat.client}`);
  for (const name of CHAT_EVENTS) {
    es.addEventListener(name, (e) => { chatReceive(name, JSON.parse(e.data)); });
  }
  es.onerror = () => { chat.conn = "reconnecting"; render(); };
  chat.es = es;
}

/* One stream event into the state. The event names are the timeline's
   (timeline.mjs), and a name this page does not know is dropped rather than
   drawn wrong. */
function chatReceive(name, d) {
  const c = chat;
  if (name === "hello") {
    c.conn = "live"; c.file = d.file ?? null; c.harness = d.harness ?? null;
    c.ended = d.ended === true; c.clients = d.clients ?? c.clients;
    if (d.draft && !c.draft) c.draft = d.draft;
  } else if (name === "items") {
    for (const it of d) {
      if (it.kind === "result") {
        const tool = c.items.find((x) => x.kind === "tool" && x.id && x.id === it.forId);
        if (tool) { tool.result = it; continue; }
      }
      c.items.push(it);
    }
    c.stick = true;
  } else if (name === "reset") {
    c.items = []; c.parse = null; c.file = d.file ?? null;
  } else if (name === "parse") {
    c.parse = d;
  } else if (name === "dialog") {
    if (d.receipt) {
      c.receipt = d.receipt; c.dialog = null;
      for (const action of [...actions.values()]) {
        if (action.kind === "native-dialog-answer" && action.target === `${c.session}:${d.receipt.dialog}`) {
          finishAction(action.action_id);
        }
      }
    }
    else if (!d.up) { c.dialog = null; }
    else { c.dialog = d; c.receipt = null; }
  } else if (name === "escalations") {
    c.open = d;
  } else if (name === "esc_history") {
    c.history = d;
  } else if (name === "clients") {
    c.clients = d.clients;
  } else if (name === "draft") {
    if (d.by === c.client) return;
    if (Date.now() - c.lastEdit < 1500) return;
    c.draft = d.text; c.mirror = !!d.text;
  } else if (name === "sent") {
    c.mirror = false;
    if (d.by !== c.client) chatNote(`sent from the other device: ${snip(d.text, 80)}`);
    return render();
  } else {
    return;
  }
  render();
}
function chatNote(text, warn = false) {
  chat.notes.push({ text, warn, at: new Date().toISOString() });
  chat.stick = true;
}

function screenChat(p) {
  if (chat.session) return chatRoom(p);
  return chatPicker(p);
}

/* ---- the picker ---- */
function chatPicker(p) {
  const down = p && !p.daemon_up;
  const count = conversations?.conversations?.length ?? null;
  const tools = count == null ? "" : `<span class="dim-note num">${count} conversation${count === 1 ? "" : "s"}</span>`;
  return `${head(p, "Chat", tools)}
    ${down ? `<p class="unread">The chat is down while the daemon restarts. Your message reaches every conversation through it.</p>` : ""}
    ${chatList()}`;
}

/* ---- the terminal (#714) ----
   The room's header opens the live terminal for ITS conversation, and only
   for one that still runs: an ended agent has no pane to show. The dock is
   one element under document.body, mounted once per opening and removed on
   close or on leaving the room, so the attached tmux client goes away with
   it rather than holding a stale size on the shared window. */
const terminalSrc = (session) => `/terminal/?arg=${encodeURIComponent(session)}`;
function terminalDock() {
  if (!chat.terminal || !chat.session) return "";
  return `<div class="dock-head mono"><span class="grow">terminal · ${esc(chat.session)}</span>
      <button class="btn sm" type="button" onclick="chatToggleTerminal()">Close</button></div>
    <iframe src="${terminalSrc(chat.session)}" title="Terminal for ${esc(chat.session)}"></iframe>`;
}
function chatToggleTerminal() {
  chat.terminal = !chat.terminal && !chatEnded();
  chatMountTerminal();
  render();
}
function chatMountTerminal() {
  if (typeof document.createElement !== "function" || !document.body) return;
  let dock = document.getElementById("terminal-dock");
  if (!chat.terminal) { dock?.remove(); return; }
  if (dock) return;
  dock = document.createElement("div");
  dock.id = "terminal-dock";
  dock.className = "terminal-dock";
  dock.innerHTML = terminalDock();
  document.body.appendChild(dock);
}

/* Null is not empty, the second rule of this page. A list curia could not be
   asked for and a box with no conversations on it are opposite facts. */
function chatList() {
  if (conversations === null) return `<div class="later">Reading your conversations…</div>`;
  if (conversations.conversations === null) {
    return `<div class="unread">curia could not read your conversations — ${esc(conversations.error ?? "no reason given")}.</div>
      ${newChatButton()}`;
  }
  const all = conversations.conversations;
  const tickets = all.filter((c) => c.kind !== "overseer");
  const overseer = all.filter((c) => c.kind === "overseer");
  return `<section class="chat-section">
      <h3>Tickets</h3>
      <p class="dim-note">One conversation per agent. An ended agent stays readable.</p>
      ${tickets.length ? `<table class="chats">${tickets.map(chatRow).join("")}</table>` : `<p class="dim-note">No agent is running or recently ended.</p>`}
    </section>
    <section class="chat-section">
      <h3>Overseer</h3>
      <p class="dim-note">curia itself: it sees every watched repo and holds the verbs. Ask it what to start, then say <code>start 256</code>.</p>
      ${overseer.length
        ? `<table class="chats">${overseer.map(chatRow).join("")}</table>`
        : `<p>No overseer conversation yet. Press below to open the first one.</p>`}
      ${newChatButton()}
      <p class="cannot">A new conversation is the reset — the same thing a new thread is in Discord.
        Open one when the context above reads full. Deleting one spends its number for good.
        The overseer holds a reading shell over a checkout of every watched repo, so it can
        read a file or a diff — but it cannot write one: its GitHub token is read-only, and every
        effect still crosses the daemon.</p>
    </section>`;
}

function newChatButton() {
  const k = "chat-new";
  return `<p><button class="btn primary" ${busy(k) ? "disabled" : ""} onclick="doNewConversation()">
    ${busy(k) ? "Opening…" : "New conversation"}</button></p>${said(k)}`;
}

/* A row's title is role-specific: a ticket reads as its tracker name and
   title, an overseer conversation as the operator's own first message. */
function chatTitle(c) {
  if (c.kind === "overseer") return c.label ? c.label : null;
  return c.label || ticketName(c.repo, c.ticket) || c.session;
}
function chatRow(c) {
  const k = "chat-del-" + c.key;
  const title = chatTitle(c);
  const label = title ? `<b>${esc(title)}</b>` : `<span class="dim-note">no turn yet</span>`;
  const answer = said(k);
  /* A browser conversation has no thread, so the line ADR-0015 gives a killed
     turn lands here — on the row the operator picks it from. It clears itself:
     the next turn on this conversation ends the drop. */
  const dropped = c.dropped && !c.dropped.replayed
    ? `<span class="killed">⚠️ A restart killed a turn here${
      c.dropped.commands?.length ? `, and it had run ${esc(c.dropped.commands.join(", "))}` : ""
    }. curia did not send your message again${
      !c.dropped.commands?.length && c.dropped.why ? ` — ${esc(c.dropped.why)}` : ""}.</span>`
    : "";
  const facts = c.kind === "overseer"
    ? [c.key, ago(c.last_turn_at)]
    : [ticketName(c.repo, c.ticket), c.reviewer ? "reviewer" : null, c.live === false ? `ended · ${c.state ?? "archive"}` : (c.state ?? "working"), ago(c.last_turn_at)];
  const remove = c.deletable === false ? "" : `<button class="btn sm" ${busy(k) ? "disabled" : ""} onclick="doDeleteConversation('${js(c.key)}')">
      ${busy(k) ? "…" : "delete"}</button>`;
  return `<tr class="${c.live === false ? "ended" : ""}">
    <td><a href="${esc(chatHref(c.session))}">${label}</a>
      <span class="dim-note mono" style="display:block;margin:2px 0 0">${facts.filter(Boolean).map(esc).join(" · ")}</span>${dropped}</td>
    <td class="num">${ctxCell(c)}</td>
    <td>${remove}</td>
  </tr>${answer ? `<tr><td colspan="3">${answer}</td></tr>` : ""}`;
}

/* Mint, then walk through the door. Opening a conversation you then have to
   find in a list is two acts where the operator asked for one. */
async function doNewConversation() {
  const out = await verb("chat-new", "/api/console/new", {});
  if (out?.session) location.hash = chatRoute(out.session);
}

async function doDeleteConversation(key) {
  const ask = `Delete ${key}? Its number is spent for good — a later conversation never reuses it. `
    + `curia stops offering the conversation, and its transcript stays on the box.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  await verb("chat-del-" + key, "/api/console/delete", { key });
  loadConversations();
}

/* ---- the room ---- */
const chatRowFor = (session) => conversations?.conversations?.find((c) => c.session === session) ?? null;
/* Ended is curia's word, from either of its two mouths: the picker row's
   `live`, or the stream's `ended`. Either one says so, and the room refuses. */
const chatEnded = () => chat.ended === true || chatRowFor(chat.session)?.live === false;

function chatRoom(p) {
  const c = chat;
  const row = chatRowFor(c.session);
  const role = row?.kind === "overseer" || chatRole(c.session) === "overseer" ? "overseer" : "ticket";
  const title = row ? (chatTitle(row) ?? c.session) : c.session;
  const ended = chatEnded();
  const conn = c.conn === "live" ? `<span class="chat-conn ok">live</span>` : `<span class="chat-conn bad">${esc(c.conn)}</span>`;
  const watching = c.clients > 1 ? `<span class="dim-note">${c.clients} devices watching</span>` : "";
  const terminal = ended ? ""
    : `<button class="btn sm ${c.terminal ? "on" : ""}" type="button" onclick="chatToggleTerminal()">${c.terminal ? "Hide terminal" : "Terminal"}</button>`;
  const tools = `<a class="btn sm" href="#chat">← Chat</a>${terminal}`;
  return `${head(p, title, tools)}
    <div class="room" data-role="${role}">
      <div class="room-facts dim-note mono">${esc(role)} · ${esc(c.session)} ${conn} ${watching}
        ${c.file ? `<span class="chat-file">${esc(c.file.split("/").pop())}</span>` : `<span>no transcript yet</span>`}</div>
      ${ended ? `<p class="unread chat-ended">${esc(ENDED_SENTENCE(c.session))}</p>` : ""}
      ${c.parse ? `<p class="unread">⚠ This transcript is INCOMPLETE — ${esc(c.parse.reason)} (${c.parse.dropped} line${c.parse.dropped > 1 ? "s" : ""} dropped). The agent may not be quiet; check the terminal.</p>` : ""}
      ${chatDialog(c)}
      ${c.open.map(chatOpenEscalation).join("")}
      <div class="chat-log" id="chat-log" onscroll="chatScrolled(this)">${chatLog(c)}</div>
      ${chatComposer(c, role, ended)}
    </div>`;
}

/* The open question is the same typed card Home and Discord draw (#712,
   ADR-0025): one payload, the same markers, and the answer controls in the
   room. The composer below still queues a message; the card answers. */
function chatOpenEscalation(r) {
  const bits = [`since ${clock(r.opened_at)}`];
  if (r.preview_url) bits.push(r.preview_url);
  return `<div class="chat-esc"><div class="kind">⏳ waiting on you — ${esc(r.kind)} (${esc(r.id)})</div>
    <div class="q">${esc(r.prompt ?? "")}</div><div class="meta">${esc(bits.join(" · "))}</div>
    ${answerButtons(r)}${answerField(r)}${said("esc:" + r.id)}</div>`;
}

/* The transcript items and the daemon's own escalation record, interleaved by
   instant (#108 item 1): the record keeps the full question, the answer and
   who gave it, where the transcript's tool line is a clipped brief. The page's
   own notes (a failed send, a take-back receipt) land at their instant too. */
function chatLog(c) {
  const rows = [
    ...c.items.map((it) => ({ at: it.at ?? null, html: chatItem(it) })),
    ...c.history.map((r) => ({ at: r.opened_at ?? null, html: chatHistoryCard(r) })),
    ...c.notes.map((n) => ({ at: n.at, html: `<div class="item note ${n.warn ? "warn" : ""}">${esc(n.text)}</div>` })),
  ].filter((r) => r.html);
  /* A stable sort by instant, and an item with no instant keeps its place. */
  const timed = rows.map((r, i) => ({ ...r, i }));
  timed.sort((a, b) => (a.at && b.at && a.at !== b.at) ? (a.at < b.at ? -1 : 1) : a.i - b.i);
  if (!timed.length) return `<div class="item note">${c.conn === "live" ? "Nothing in this transcript yet." : "Connecting…"}</div>`;
  return timed.map((r) => r.html).join("");
}
function chatItem(it) {
  const at = it.at ? `<span class="at">${clock(it.at)}</span>` : "";
  if (it.kind === "say") return `<div class="item say">${at}${esc(it.text)}</div>`;
  if (it.kind === "prompt" || it.kind === "queued") {
    const text = String(it.text ?? "");
    if (text.length > 400) {
      return `<div class="item ${it.kind}"><details><summary>${it.kind === "queued" ? "queued: " : "sent: "}${esc(text.slice(0, 90))}…</summary><div class="pre">${esc(text)}</div></details></div>`;
    }
    return `<div class="item ${it.kind}">${esc(text)}</div>`;
  }
  if (it.kind === "think") return `<div class="item think"><details><summary>thinking…</summary><div class="pre">${esc(it.text)}</div></details></div>`;
  if (it.kind === "tool") {
    const name = String(it.name ?? "").replace("mcp__curia__", "curia.");
    /* Full curia prose replaces the one-line brief (#108 item 1); ask_human
       stays a brief here — its escalation card carries the full body. A
       composite send (#716) draws its sequence under the same rails Discord
       posts, and its deciding message is the card, drawn from the record. */
    const body = it.send ? chatSend(it.send)
      : it.text && !/ask_human$/.test(it.name ?? "")
      ? `<span class="full">${esc(it.text)}</span>` : `<span class="brief">${esc(it.brief ?? "")}</span>`;
    const r = it.result;
    const res = r ? `<span class="res ${r.ok ? "" : "err"}">${r.ok ? "→ " : "✗ "}${esc(r.brief)}${r.lines > 1 ? ` (${r.lines} lines)` : ""}</span>` : "";
    return `<div class="item tool">${at}<span class="name">${esc(name)}</span> ${body}${res}</div>`;
  }
  if (it.kind === "result") return `<div class="item tool">${it.ok ? "→ " : "✗ "}${esc(it.brief)}</div>`;
  return `<div class="item note">${esc(it.text ?? "")}</div>`;
}
/* The messages of one send, in the order the reader reads them. The rail is
   curia's count and the agent's label; a send of one carries none. The
   deciding message posts last and is the card, so here it is only named. */
function chatSend(send) {
  const rows = send.map((m) => {
    const rail = m.rail ? `<span class="rail">${esc(String(m.rail).replace(/^-# /, ""))}</span>` : "";
    if (m.deciding) return `<div class="send-msg deciding">${rail}<span class="dim-note">the card follows</span></div>`;
    return `<div class="send-msg">${rail}<div class="pre">${esc(m.body ?? "")}</div></div>`;
  });
  return `<div class="send">${rows.join("")}</div>`;
}
function chatHistoryCard(r) {
  const options = r.options?.length ? `<div class="meta">options: ${esc(r.options.join(" | "))}</div>` : "";
  let ans;
  if (r.status === "answered") {
    ans = `<div class="ans">${esc(receiptLine({ by: r.answered_by, via: r.answered_via, at: r.closed_at, answer: r.answer }))}</div>`;
  } else if (r.status === "open") {
    ans = `<div class="meta">waiting on you</div>`;
  } else {
    ans = `<div class="meta">${esc(r.status)} ${clock(r.closed_at)}</div>`;
  }
  return `<div class="item chat-esc" id="esc-h-${esc(r.id)}"><div class="kind">${r.status === "open" ? "⏳" : "❓"} ${esc(r.kind)} (${esc(r.id)}) · asked ${clock(r.opened_at)}</div>
    <div class="q">${esc(r.prompt ?? "")}</div>${options}${ans}</div>`;
}

/* #715: a measured native choice is a typed card. An unmeasured dialog keeps
   the guard and the terminal fallback. */
function chatDialog(c) {
  const terminal = `<a href="/terminal/?arg=${encodeURIComponent(c.session)}" target="_blank">Open the terminal</a>`;
  if (c.receipt) {
    return `<div class="chat-dialog card">✔ answered · ${esc(c.receipt.by)} · ${clock(c.receipt.at)} · ${esc(c.receipt.marker)} · ${esc(c.receipt.answer)}</div>`;
  }
  const d = c.dialog;
  if (!d) return "";
  if (!d.card) {
    return `<div class="chat-dialog">⚠ A native dialog owns the terminal. ${esc(d.reason || "Curia cannot parse its controls.")} ${terminal}
      <div class="dialog-note">Chat sends stay blocked while this dialog is open.</div></div>`;
  }
  const dialogAction = actionFor({ conflict_key: `dialog:${c.session}:${d.card.id}` });
  const options = d.card.options.map((o) => `<button class="btn sm ${o.index === d.card.selected_index ? "selected" : ""}" ${dialogAction ? "disabled" : ""}
      onclick="doDialogAnswer('${js(d.card.id)}', ${Number(o.index)})">${esc(o.marker)} · ${esc(o.handle || o.label)}${o.index === d.card.selected_index ? " · selected now" : ""}</button>`).join("");
  const progress = dialogAction
    ? `<div class="dialog-note">${esc(dialogAction.progress || `Choosing ${dialogAction.projection?.marker ?? ""} · ${dialogAction.projection?.answer ?? ""}…`)}</div>`
    : "";
  return `<div class="chat-dialog card"><div class="dialog-kind">native dialog · choice</div>
    <strong class="dialog-headline">${esc(d.card.headline)}</strong>
    <div class="dialog-options">${options}</div>
    ${progress}<div class="dialog-note">The first valid tap wins. The same receipt reaches every open Chat.</div>${terminal}${said("chat-dialog")}</div>`;
}

function chatComposer(c, role, ended) {
  if (ended) return `<div class="composer ended"><span class="dim-note">${esc(ENDED_SENTENCE(c.session))}</span></div>`;
  const k = "chat-send";
  const paneKey = actionFor({ conflict_key: `pane:${c.session}` });
  return `<div class="composer">
    ${c.mirror ? `<div class="dim-note">the other device is typing…</div>` : ""}
    <textarea id="chat-box" rows="1" placeholder="type here, shared box" oninput="chatTyped(this.value)" onkeydown="chatKey(event)">${esc(c.draft)}</textarea>
    <div class="composer-row">
      <button class="btn sm" ${busy("chat-take-back") ? "disabled" : ""} onclick="doTakeBack()" title="take back your last message">${busy("chat-take-back") ? "…" : "Take back"}</button>
      ${role === "ticket" ? `<button class="btn sm" ${paneKey ? "disabled" : ""} onclick="doChatKey('escape')" title="send Escape to the agent">${paneKey ? "Sending Esc…" : "Esc"}</button>` : ""}
      <span class="grow"></span>
      <button class="btn primary" ${busy(k) ? "disabled" : ""} onclick="doChatSend()">${busy(k) ? "Sending…" : "Send"}</button>
    </div>${said(k)}${said("chat-take-back")}${said("chat-key")}</div>`;
}

/* The shared composer (#73): the draft goes to the other device, 200ms after
   the last keystroke. The value never rides the DOM across a render. */
let chatDraftTimer = null;
function chatTyped(value) {
  chat.draft = value;
  chat.lastEdit = Date.now();
  chat.mirror = false;
  clearTimeout(chatDraftTimer);
  chatDraftTimer = setTimeout(() => chatPost("/draft", { text: chat.draft }), 200);
}
function chatKey(e) {
  /* Desktop: Enter sends, Shift+Enter newlines. On a phone the on-screen return
     key inserts a newline and the Send button is the only submit. */
  const coarse = typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
  if (e.key === "Enter" && !e.shiftKey && !coarse) { e.preventDefault(); doChatSend(); }
}
function chatPost(p, extra) {
  return fetch(p, {
    method: "POST",
    headers: { "content-type": "application/json", accept: "application/json" },
    body: JSON.stringify({ session: chat.session, client: chat.client, ...extra }),
  }).then((r) => r.json()).catch((e) => ({ error: e.message }));
}
/* The room's presses ride the same busy/said seam every other page uses: one
   press in flight, its answer shown at the control it came from. A send that
   failed keeps the words in the composer. */
async function doChatSend() {
  const text = chat.draft;
  if (!text.trim()) return;
  if (chatEnded()) return refuse("chat-send", ENDED_SENTENCE(chat.session));
  const action = beginLocalAction("chat-send");
  if (!action) return;
  UI.act.said = null;
  chat.draft = "";
  render();
  const r = await chatPost("/send", { text });
  finishAction(action.action_id);
  if (r.error) {
    if (!r.unconfirmed) chat.draft = text;
    UI.act.said = { key: "chat-send", ok: false, text: (r.unconfirmed ? "send unconfirmed: " : "send failed: ") + r.error };
  }
  chat.stick = true;
  render();
}
async function doTakeBack() {
  const action = beginLocalAction("chat-take-back");
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/take-back", { target: null });
  finishAction(action.action_id);
  if (r.error) {
    UI.act.said = { key: "chat-take-back", ok: false, text: `take back failed: ${r.error}` };
  } else {
    chat.draft = r.composer || "";
    chatPost("/draft", { text: chat.draft });
    chatNote([r.receipt?.headline, r.receipt?.landing, ...(r.receipt?.remains || [])].filter(Boolean).join(" "));
  }
  render();
}
async function doChatKey(key) {
  const session = chat.session;
  const actionId = `atlas-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "pane-key", target: session,
    conflict_key: `pane:${session}`, projection: { key },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/key", { key, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcilePaneKeyActions();
  if (actionFor({ action_id: actionId }) && !r.action) {
    finishAction(actionId);
    if (r.error) UI.act.said = { key: "chat-key", ok: false, text: r.error };
  }
  render();
}
function reconcilePaneKeyActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "pane-key" || !TERMINAL_ACTION.has(action.status)) continue;
    if (action.target === chat.session && action.status !== "confirmed") {
      UI.act.said = { key: "chat-key", ok: false, text: action.reason || "Curia could not send the pane key." };
    }
    finishAction(action.action_id);
  }
}
async function doDialogAnswer(dialog, index) {
  const session = chat.session;
  const option = chat.dialog?.card?.id === dialog
    ? chat.dialog.card.options.find((candidate) => candidate.index === index)
    : null;
  if (!option) return;
  const actionId = `atlas-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "native-dialog-answer", target: `${session}:${dialog}`,
    conflict_key: `dialog:${session}:${dialog}`,
    projection: { index, marker: option.marker, answer: option.handle || option.label },
  });
  if (!action) return;
  UI.act.said = null;
  render();
  const r = await chatPost("/dialog-answer", { dialog, index, action_id: actionId });
  observeActions(r.action ? [r.action] : []);
  reconcileDialogAnswerActions();
  if (actionFor({ action_id: actionId }) && !r.action) {
    finishAction(actionId);
    if (r.receipt) chatReceive("dialog", { up: false, receipt: r.receipt });
    else UI.act.said = { key: "chat-dialog", ok: false, text: r.error || "Curia could not answer this native dialog." };
  }
  render();
}
function reconcileDialogAnswerActions() {
  for (const action of [...actions.values()]) {
    if (action.kind !== "native-dialog-answer" || !TERMINAL_ACTION.has(action.status)) continue;
    const receipt = action.receipt;
    if (receipt && action.target === `${chat.session}:${receipt.dialog}`) {
      chatReceive("dialog", { up: false, receipt });
    } else if (action.target.startsWith(`${chat.session}:`) && action.status !== "confirmed") {
      UI.act.said = { key: "chat-dialog", ok: false, text: action.reason || "Curia could not answer this native dialog." };
    }
    finishAction(action.action_id);
  }
}
function chatScrolled(el) {
  chat.stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}
/* After a render: the log follows its tail unless the reader scrolled up. */
function chatAfterRender() {
  const el = document.getElementById("chat-log");
  if (el && chat.stick) el.scrollTop = el.scrollHeight;
}

async function doGitHubAppRefresh() {
  const actionId = `atlas-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "github-app-installations", target: "github-app-installations",
    conflict_key: "github-app:installations", projection: { phase: "reading" },
  });
  if (!action) return null;
  UI.act.said = null;
  render();
  return githubAppAction("github-app-refresh", "/api/github-app/refresh", actionId, {});
}

async function doGitHubAppSetup() {
  const name = document.getElementById("github-app-name")?.value?.trim();
  if (!name) return refuse("github-app", "Enter a GitHub App name.");
  const actionId = `atlas-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  const action = beginAction({
    action_id: actionId, kind: "github-app-setup", target: "github-app-setup",
    conflict_key: "github-app:setup", projection: { phase: "opening-github" },
  });
  if (!action) return null;
  UI.act.said = null;
  render();
  const out = await githubAppAction("github-app", "/api/github-app/start", actionId, { name });
