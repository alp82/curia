<div id="app"></div>

<script>
/* The console's own code. One classic script, no build step and no module
   boundary: the file on disk is the reviewed source and the served page at once.
   Its test drives these same functions in a vm, which is why the screens take
   the payload as an ARGUMENT and the page state sits on one plain object —
   nothing here reads a global the test cannot set. */

/* Every screen this shell carries. The four read screens are #264; the two
   named tickets below draw their own. */
const SCREENS = {
  home:     ["Home",     screenHome],
  agents:   ["Agents",   screenAgents],
  frontier: ["Frontier", screenFrontier],
  feed:     ["Feed",     screenFeed],
  chat:     ["Chat",     screenChat],
  settings: ["Settings", screenSettings],
};
const NAMES = Object.keys(SCREENS);

/* A usage window is spent at the same number the daemon calls spent
   (usage.mjs SPENT_PCT). One name for one thing: the page must not invent a
   second threshold for the same fact. */
const SPENT_PCT = 95;
/* The gate is its own escalation kind (lifecycle.mjs REVIEW_KIND). */
const REVIEW_KIND = "review-gate";

/* The page's whole mutable state. `var` on purpose — the test reaches it. */
var UI = {
  screen: "home",
  fr: { view: "cards", repo: "all", type: "all" },
  /* The settings screen's own state (#265). `phase` is the save banner's two
     phases plus the two that can interrupt them: clean, dirty, saved,
     restarting, refused, unread. */
  set: { section: "routing", models: false, phase: "clean", error: null, busy: false, note: null },
  /* The operator verbs (#266). `busy` names the ONE press in flight, keyed to
     the control it came from; `said` is what curia answered, shown at that same
     control. `note` and `tele` name the agent whose box is open, and `mode` is
     the delivery ADR-0013 defaults to. */
  act: { busy: null, said: null, note: null, mode: "queue", tele: null },
};
var payload = null;   /* the sidecar's last answer */
var reachable = true; /* is the SIDECAR itself answering — a different fact from daemon_up */
var settings = null;  /* the last read of curia.yaml + routing.yaml off disk */
var draft = null;     /* the same, with the operator's unsaved edits on it */
var repos = null;     /* the watchable repos, read through the daemon on demand */
var conversations = null; /* the browser conversations (#333), read on the Chat screen only */

/* ---- words ---------------------------------------------------------------- */

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const snip = (s, n) => { const t = String(s ?? "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}
function dur(s) {
  if (s == null) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function clock(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || Number.isNaN(d.getTime())) return "—";
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* A ticket as the tracker names it: `owner/repo#12`, or `#12` when the event
   carries no repo. */
function ticketName(repo, ticket) {
  if (ticket == null || ticket === "") return "";
  return (repo ? repo + "#" : "#") + ticket;
}

/* How many things want the operator. The nav badge, the tab title and the tile
   read one function, so they can never disagree. Usage limits are NOT counted:
   a spent window is on the attention list because it explains a slow box, but
   nobody can answer it. */
function needsYou(o) {
  return (o?.escalations?.length ?? 0) + (o?.review_gate?.length ?? 0);
}

/* ---- the operator verbs (#266) ----------------------------------------------

   Every verb is ONE POST to the sidecar, which composes the daemon call from
   the fields sent here. This page never sends a command line: it names a repo,
   a ticket, an escalation id or an agent, and the sidecar builds the rest.

   Four rules run through all of them.

   1. ONE ACT AT A TIME. `UI.act.busy` names the press in flight, keyed to the
      control it came from, so a second press starts nothing and the control
      that is working says so.
   2. CURIA'S OWN WORDS ARE THE OUTCOME. A command reply is a sentence the
      daemon composed. It is shown where the press was, as it stands. This page
      never writes its own account of what an act did.
   3. THE READING MOVES AT ONCE. The sidecar drops its snapshot age on every
      verb, so the poll right after a press is a fresh read rather than the held
      one. A button that appears to do nothing for five seconds is a button
      pressed twice.
   4. A REFUSAL IS A FACT. First-valid-wins, an agent that is not running, a
      ticket already claimed: each comes back in words, under the control that
      asked, and none of them is a failure of this page. */

/* The literal answers every surface sends. The daemon classifies the ANSWER
   (lifecycle.mjs classifyReviewAnswer, bridge.mjs #buttons), so this page must
   not teach it a second vocabulary for the same act. */
const APPROVE = "approve";
const REJECT = "reject";
const CROSS_CHECK = "cross-check";
const ALL_AS_RECOMMENDED = "all-as-recommended";

/* A value going into an onclick handler crosses TWO escapings: the HTML
   attribute, and the single-quoted JS string inside it. `esc` answers only the
   first. An escalation option is an agent's own words — the one value on this
   page that can carry a quote — and a bare `esc` would leave it able to close
   that string and open code instead. So the JS escaping runs first and the HTML
   escaping over it. */
const js = (s) => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));

const busy = (key) => UI.act.busy === key;
const anyBusy = () => UI.act.busy !== null;
function said(key) {
  const s = UI.act.said;
  return s && s.key === key ? `<div class="said${s.ok ? "" : " bad"}">${mdLite(s.text)}</div>` : "";
}
/* Curia speaks Discord markdown everywhere else, and one reply reaching two
   surfaces is the point of the command seam — so the page renders the little of
   it a reply uses rather than asking the daemon for a second wording. */
function mdLite(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, x) => `<code>${x}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, x) => `<b>${x}</b>`)
    .replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}">${u}</a>`);
}

async function verb(key, path, body) {
  if (anyBusy()) return null;
  UI.act.busy = key;
  UI.act.said = null;
  render();
  let out = null;
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(body),
    });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the console answered " + res.status));
    out = b;
    UI.act.said = { key, text: outcome(b), ok: b.ok !== false };
  } catch (e) {
    UI.act.said = { key, text: e.message, ok: false };
  }
  UI.act.busy = null;
  render();
  tick();
  return out;
}
function refuse(key, text) {
  UI.act.said = { key, text, ok: false };
  render();
}

function outcome(b) {
  if (typeof b.reply === "string") return b.reply;
  if (b.mode) return noteOutcome(b);
  if (b.ok) return "Answered — it is with the agent.";
  return "Done.";
}
/* A note says which delivery it got, because the delivery is the half the
   operator chose. An interrupt curia refused leaves the words QUEUED — the
   operator asked for these words to reach the agent, and only the speed of it
   failed (ADR-0013). */
function noteOutcome(b) {
  if (b.ok === false) {
    const why = b.why ?? "curia could not put those words to the agent.";
    return b.still_queued ? `${why}\nThe words stay queued: the agent reads them with its next tool result.` : why;
  }
  if (b.mode === "interrupt") {
    return `Interrupting \`${b.session ?? b.agent}\` — ${Math.round((b.graceMs ?? 0) / 1000)}s of grace, then the words land as a user turn.`;
  }
  return `Queued for \`${b.agent}\` — it reads this with its next tool result${b.after ? ` (noted as after ${b.after})` : ""}.`;
}

/* What the operator typed. It is NOT cleared here: a refused answer has to
   leave its words on screen, or the operator types them twice. */
function typed(id) {
  const el = document.getElementById(id);
  return el ? String(el.value ?? "").trim() : "";
}

/* ---- the verbs themselves ---- */

const startTicket = (repo, ticket) => verb(`start:${repo}#${ticket}`, "/api/start", { repo, ticket: String(ticket) });
const answerEsc = (id, answer) => verb("esc:" + id, "/api/answer", { id, answer });

function answerTyped(id, field) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "Type the answer first — an empty reply answers nothing.");
  answerEsc(id, v);
}
/* A rejection IS feedback (#48): the agent gets the operator's own words and
   fixes what they name. So an empty one is refused here rather than sent as a
   rejection nobody can act on. */
function rejectGate(id, field) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "A rejection carries your words — say what to change, then press Reject.");
  answerEsc(id, v);
}

/* Cancel names its consequences before it runs. They are the teardown's own
   (dispatch.mjs #teardown), not a warning this page invented. */
function cancelAgent(session, repo, ticket) {
  const ask = `Cancel ${session}?\n\n`
    + `• The tmux session is killed and its worktree removed. Anything uncommitted there is lost.\n`
    + `• The claim on ${ticketName(repo, ticket) || "its ticket"} is released, so the ticket returns to the frontier.\n`
    + `• Any question it is holding closes unanswered.\n`
    + `• A cross-check reviewer on the same ticket ends too.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  verb("agent:" + session, "/api/cancel", { ticket: String(ticket) });
}

/* Teleport. The two links are curia's own (#68): `attach <n>` composes them
   from its records, so the page asks for them instead of building a URL it
   cannot vouch for. The shell line beside them is for a terminal on the box —
   the tmux server lives in its own container (#260), so the command goes in
   through that one. */
function teleport(session, ticket) {
  UI.act.tele = UI.act.tele === session ? null : session;
  UI.act.said = null;
  render();
  if (UI.act.tele) verb("agent:" + session, "/api/teleport", { ticket: String(ticket) });
}
function attachCmd(session) {
  return `docker compose -f deploy/compose.yaml exec tmux tmux -S /run/curia-tmux/default attach -t ${session}`;
}

function noteBox(session) {
  UI.act.note = UI.act.note === session ? null : session;
  UI.act.said = null;
  render();
}
function noteMode(mode) { UI.act.mode = mode; render(); }
async function sendNote(session, field) {
  const text = typed(field);
  if (!text) return refuse("agent:" + session, "A note with no words is not a note.");
  const out = await verb("agent:" + session, "/api/note", { agent: session, text, mode: UI.act.mode });
  /* Queued or interrupted, the words are with curia — so the box closes. It
     stays open only when nothing was taken at all. */
  if (out && out.id) { UI.act.note = null; render(); }
}

/* ---- the reading's own age ------------------------------------------------- */

/* Three states, and they are three different facts: the sidecar is
   unreachable, the daemon is not answering it, or all is well. */
function readbar(p) {
  if (!reachable) {
    return `<div class="readbar down"><span class="dot"></span><b>the console is offline</b>
      <span class="why">this page cannot reach the sidecar that serves it</span></div>`;
  }
  if (!p) return `<div class="readbar"><span class="dot"></span>reading…</div>`;
  if (!p.daemon_up) {
    /* The sidecar is up and holding the last good reading — which is exactly
       what it exists for. Say which reading, and why it is not moving. */
    return `<div class="readbar down"><span class="dot"></span><b>daemon restarting</b>
      <span>showing the snapshot from ${esc(ago(p.read_at))}</span>
      <span class="spacer"></span>
      <span class="why">not answering on :${esc(p.daemon_port)} since ${esc(ago(p.error_since))} — ${esc(p.error)}</span></div>`;
  }
  return `<div class="readbar"><span class="dot"></span>read ${esc(ago(p.read_at))}
    <span class="spacer"></span>
    <span class="why">refreshing every ${esc(p.poll_interval_s)}s while this tab is visible</span></div>`;
}

/* Every screen opens the same way, and no screen draws before the first read
   lands. */
function head(p, title, right) {
  return `<div class="screen-head"><h2>${esc(title)}</h2>${right ?? ""}</div>${readbar(p)}`;
}
function noSnapshot(p, title) {
  return `${head(p, title)}<div class="later">No snapshot yet. The sidecar is up and has not read the daemon successfully even once.</div>`;
}
function later(p, what, ticket) {
  return `${head(p, SCREENS[UI.screen][0])}
    <div class="later"><b>${esc(what)}</b> lands on ${esc(ticket)}. It draws the same snapshot the bar above reads.</div>`;
}

/* ---- the fleet ------------------------------------------------------------- */

/* The state in the vocabulary the status line already uses (statusline.mjs):
   `ready` and `working` are one state, and an agent with an open question is
   waiting whatever its record says. */
function stateWord(a) {
  if (a.state === "awaiting-review") return "awaiting review";
  if (waitingOn(a).length) return "waiting";
  return { ready: "working", spawning: "dispatched", failed: "failed", "cross-checking": "cross-checking" }[a.state] ?? String(a.state ?? "unknown");
}
/* The questions bound to this agent, minus the gate — the gate is its own list
   and its own card, never a row's footnote. */
const waitingOn = (a) => (a.waiting_on ?? []).filter((w) => w.kind !== REVIEW_KIND);
/* Attention is one test, used by the dot, the row tint and nothing else. */
const wantsYou = (a) => waitingOn(a).length > 0;

function agentDot(a) {
  return `<span class="dot ${wantsYou(a) ? "attn" : a.state === "failed" ? "off" : ""}"></span>`;
}

/* The context meter (#264, usage.mjs ctxOnWire). No reading is "—", never 0%.
   A figure above 100% is the daemon's own complaint about the denominator, not
   a reading about the agent, so it is marked rather than drawn flat. */
function ctxCell(a) {
  if (a.ctx_pct == null) return `<span class="dim-note">—</span>`;
  return `${esc(a.ctx_pct)}%${a.ctx_over ? ` <span class="over">⚠</span>` : ""}`;
}

/* The fleet, narrow: the home's right column. `agents: null` is an unreadable
   tmux, which is the opposite fact from an idle box, so it renders as neither a
   table nor an empty line. */
function fleetTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. Every other section below is still a live reading.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents narrow">
    <tr><th>session</th><th>state</th><th>ticket</th><th>ctx</th><th>up</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span></td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td></tr>`).join("")}
  </table></div>`;
}

/* ---- the provider strip ---------------------------------------------------- */

/* One reading per provider, said once (#248). It is an account fact, not an
   agent fact, so no agent row repeats it (CONTEXT.md, usage windows).

   The bar is neutral until the window is worth attention: a fill that ran ahead
   of its own clock, and bad once the window is spent. The thin mark is where
   the clock stands, so "62% of the window at 48% of the time" is one glance. */
function meterBar(label, w) {
  const pct = Number(w.pct ?? 0);
  const elapsed = w.elapsed_pct == null ? null : Number(w.elapsed_pct);
  const cls = pct >= SPENT_PCT ? "bad" : elapsed != null && pct > elapsed ? "warn" : "";
  return `<span class="meter-row"><span class="lbl">${esc(label)}</span>
    <span class="bar"><span class="fill ${cls}" style="width:${Math.min(100, Math.max(0, pct))}%"></span>
      ${elapsed == null ? "" : `<span class="clock" style="left:${Math.min(100, Math.max(0, elapsed))}%"></span>`}</span>
    <span class="pct num">${esc(pct)}%</span></span>`;
}
function provStrip(o) {
  const usage = o.usage ?? [];
  /* A provider with no probe and no live agent says NOTHING rather than zero
     (#262): an unmeasured window and an unspent one are not the same fact. */
  if (!usage.length) return `<div class="prov-strip">No usage window is measured. A window is read from the account probe, or from a live agent's own transcript.</div>`;
  return `<div class="prov-strip">${usage.map((p) => {
    const soonest = nextReset([p]);
    return `<span class="prov"><b>${esc(p.provider)}</b>
      ${(p.windows ?? []).map((w) => meterBar(w.label, w)).join("")}
      ${soonest ? `<span class="pnote ${spentWindows([p]).length ? "hot" : ""}">${esc(soonest.label)} rolls ${esc(clock(soonest.at))}</span>` : ""}
      <span class="pnote">from the ${esc(p.from)}${p.session ? ` of ${esc(p.session)}` : ""}</span></span>`;
  }).join("")}</div>`;
}
function spentWindows(usage) {
  return (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => Number(w.pct ?? 0) >= SPENT_PCT)
    .map((w) => ({ provider: p.provider, label: w.label, pct: w.pct, at: w.resets_at })));
}
/* The soonest window still ahead of us, which is the one the operator waits on. */
function nextReset(usage) {
  const all = (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => w.resets_at && Date.parse(w.resets_at) > Date.now())
    .map((w) => ({ provider: p.provider, label: w.label, at: w.resets_at })));
  all.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  return all[0] ?? null;
}

/* ---- the attention list ---------------------------------------------------- */

/* Everything that wants the operator, in one column, warn-marked because that
   is what the color is for — and the ONE place an open question is answered
   (#266). The Agents table states the same questions and answers none of them:
   one answer surface, so no operator has to remember which of two they are
   looking at. */

/* The buttons a kind carries, in the vocabulary every other surface sends
   (bridge.mjs #buttons). A choice sends its option's own label; an
   approve-reject pair sends the two literals; a recommended round sends the one
   fixed word its ✅ carries (#285), and it has no ❌ beside it because the
   opposite of that tap is the operator's own reply. */
function answerButtons(r) {
  const key = "esc:" + r.id;
  const btn = (label, answer, cls) => `<button class="btn sm${cls ? " " + cls : ""}"
    ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${js(answer)}')">${esc(label)}</button>`;
  const b = [];
  if (r.kind === "approve-reject" || r.kind === "preview-review") {
    b.push(btn("✅ Approve", APPROVE, "primary"), btn("❌ Reject", REJECT, "danger"));
  }
  if (r.kind === "confirm") b.push(btn("✅ Approve", APPROVE, "danger"), btn("❌ Decline", REJECT));
  if (r.kind === "choice") for (const o of r.options ?? []) b.push(btn(snip(o, 80), o));
  if (r.kind === "free-text" && r.recommended) b.push(btn("✅ All as recommended", ALL_AS_RECOMMENDED, "primary"));
  return b.length ? `<div class="act-row">${b.join("")}</div>` : "";
}

/* Free-form, on every kind. A choice can be answered in words the options do
   not carry, and a round is answered by naming the exceptions (#285) — so the
   field is never the fallback for a kind, it is the reply. */
function answerField(r) {
  const id = "ans-" + r.id;
  return `<div class="act-row">
    <input type="text" id="${esc(id)}" placeholder="answer in your own words…" ${anyBusy() ? "disabled" : ""}>
    <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="answerTyped('${js(r.id)}','${js(id)}')">Answer</button>
  </div>`;
}

function escCard(r) {
  return `<div class="att-item">
    <span class="who">${esc(r.agent)}</span>${esc(snip(r.prompt, 260))}
    <div class="dim">${esc(r.kind)} · ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}${r.agent_died ? " · the agent died holding it" : ""}${r.rendered ? "" : " · not rendered in Discord yet"}</div>
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview it asks about</a></div>` : ""}
    ${answerButtons(r)}${answerField(r)}${said("esc:" + r.id)}</div>`;
}

/* The gate's three answers (#165, ADR-0010). Approve merges and resolves;
   cross-check answers NOTHING and puts a reviewer on the other provider onto
   the diff, with the builder parked where it stands; a rejection carries the
   operator's words back to the builder. */
function gateCard(r) {
  const id = "rej-" + r.id;
  return `<div class="att-item gate">
    <span class="who">${esc(r.agent)}</span>review gate — ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}
    <div class="dim">${esc(snip(r.prompt, 220))}</div>
    ${r.pull_request ? `<div class="opts"><a href="${esc(r.pull_request)}">${esc(r.pull_request)}</a></div>` : `<div class="opts">no pull request on this gate</div>`}
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview</a></div>` : ""}
    <div class="act-row">
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${APPROVE}')">✅ Approve · merge</button>
      <button class="btn sm" ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${CROSS_CHECK}')">🔎 Cross-check</button>
    </div>
    <div class="act-row">
      <input type="text" id="${esc(id)}" placeholder="what to change — a rejection carries your words…" ${anyBusy() ? "disabled" : ""}>
      <button class="btn sm danger" ${anyBusy() ? "disabled" : ""} onclick="rejectGate('${js(r.id)}','${js(id)}')">Reject</button>
    </div>
    ${said("esc:" + r.id)}</div>`;
}

function attentionList(o) {
  const items = [
    ...(o.escalations ?? []).map(escCard),
    ...(o.review_gate ?? []).map(gateCard),
    ...spentWindows(o.usage).map((w) => `<div class="att-item limit">
      <span class="who">${esc(w.provider)}</span>the ${esc(w.label)} window is spent at ${esc(w.pct)}%
      <div class="dim">${w.at ? `it rolls at ${esc(clock(w.at))}` : "no reset instant is stated"}</div></div>`),
  ];
  return { count: items.length, html: items.length ? items.join("") : `<div class="empty">Nothing wants you.</div>` };
}

/* ---- the feed -------------------------------------------------------------- */

/* The journal speaks in types and fields. The page speaks in sentences.
   A type this table does not name still reads: the fallback says the type in
   words and names whatever subject the event carries, so an event the daemon
   grows tomorrow is legible the day it ships instead of rendering blank. */
const who = (e) => (e.agent ? `<b>${esc(e.agent)}</b>` : "");
const tkt = (e) => (e.ticket == null || e.ticket === "" ? "" : `<span class="mono">${esc(ticketName(e.repo, e.ticket))}</span>`);
const subject = (e) => [who(e), tkt(e)].filter(Boolean).join(" · ");

const EVENTS = {
  dispatch_claimed: ["claim", "", (e) => `${tkt(e)} claimed for ${who(e)} by ${esc(e.by)}`],
  dispatch_unclaimed: ["claim", "", (e) => `${tkt(e)} unclaimed — back on the frontier`],
  dispatch_exhausted: ["cooling", "bad", (e) => `${tkt(e)} could not be dispatched — every model is cooling${e.earliest_reset ? `, the earliest rolls ${esc(clock(e.earliest_reset))}` : ""}`],
  agent_spawned: ["spawn", "", (e) => `${who(e)} spawned on ${esc(e.model)}${e.harness ? ` — ${esc(e.harness)}` : ""}${e.kind ? `, ${esc(e.kind)}` : ""} · ${tkt(e)}`],
  agent_ready: ["spawn", "", (e) => `${who(e)} is at work on ${tkt(e)}`],
  agent_done: ["ending", "", (e) => `${who(e)} ended its turn`],
  agent_died: ["death", "bad", (e) => `${who(e)} died — ${tkt(e)}${e.kind ? ` (${esc(e.kind)})` : ""}`],
  agent_cancelled: ["cancel", "bad", (e) => `${who(e)} cancelled by ${esc(e.by)} — ${tkt(e)} back on the frontier`],
  agent_abnormal_exit: ["death", "bad", (e) => `${who(e)} exited abnormally — ${tkt(e)}`],
  agent_blocked_on_human: ["escalation", "warn", (e) => `${who(e)} is blocked on you — ${tkt(e)}`],
  agent_note: ["note", "", (e) => `note for ${who(e)}${e.by ? ` from ${esc(e.by)}` : ""}: ${esc(snip(e.text, 120))}`],
  agent_notes_drained: ["note", "", (e) => `${who(e)} took ${esc(e.count)} queued note(s)`],
  agent_note_refused: ["note", "warn", (e) => `a note for ${who(e)} was refused — ${esc(e.reason)}`],
  agent_notes_expired: ["note", "", (e) => `${esc(e.count ?? "some")} note(s) for ${who(e)} died with the agent they were typed at`],
  note_interrupt: ["note", "warn", (e) => `${who(e)} interrupted by ${esc(e.by)} — ${esc(Math.round((e.grace_ms ?? 0) / 1000))}s of grace, then the words land`],
  note_interrupt_delivered: ["note", "", (e) => `the interrupted words are in ${who(e)}'s pane`],
  note_interrupt_failed: ["note", "bad", (e) => `the interrupt of ${who(e)} failed — ${esc(e.reason)}`],
  esc_open: ["escalation", "warn", (e) => `${who(e)} asks — ${esc(e.kind)}: ${esc(snip(e.prompt, 160))}`],
  esc_answer: ["answer", "", (e) => `escalation ${esc(e.id)} answered by ${esc(e.by)}${e.via ? ` via ${esc(e.via)}` : ""}`],
  esc_cancel: ["answer", "", (e) => `escalation ${esc(e.id)} cancelled by ${esc(e.by)}`],
  esc_lapse: ["answer", "", (e) => `escalation ${esc(e.id)} lapsed — ${esc(e.reason)}`],
  esc_supersede: ["escalation", "", (e) => `escalation ${esc(e.id)} superseded by ${esc(e.successor)}`],
  review_requested: ["gate", "warn", (e) => `review gate opened for ${tkt(e)} by ${who(e)}`],
  review_answered: ["gate", "", (e) => `${tkt(e)} ${e.approved ? "approved" : "rejected"} at the gate${e.outcome ? ` — ${esc(e.outcome)}` : ""}`],
  cross_check_requested: ["cross-check", "", (e) => `cross-check pressed on ${tkt(e)} — ${who(e)} parks`],
  reviewer_spawned: ["cross-check", "", (e) => `${who(e)} spawned to read ${tkt(e)}${e.builder ? ` for ${esc(e.builder)}` : ""}`],
  cross_check_returned: ["cross-check", "", (e) => `cross-check on ${tkt(e)} returned${e.ok === false ? ` — it carried no verdict${e.why ? `: ${esc(e.why)}` : ""}` : ""}`],
  verdict_captured: ["cross-check", "", (e) => `verdict captured for ${tkt(e)} from ${esc(e.model)}`],
  verdict_commented: ["cross-check", "", (e) => `verdict posted on ${tkt(e)}`],
  verdict_failed: ["cross-check", "bad", (e) => `the cross-check of ${tkt(e)} failed`],
  verdict_undelivered: ["cross-check", "bad", (e) => `a verdict for ${tkt(e)} reached no reader`],
  ticket_resolved: ["resolve", "", (e) => `${tkt(e)} resolved by ${who(e)}${e.pr ? ` — ${esc(e.pr)}` : ""}`],
  lifecycle_closed: ["ending", "", (e) => `${who(e)} finished ${tkt(e)}`],
  land_failed: ["landing", "bad", (e) => `${tkt(e)} could not land — ${esc(snip(e.error, 120))}`],
  result: ["result", "", (e) => `${who(e)} reported ${esc(e.status ?? "a result")}${e.summary ? ` — ${esc(snip(e.summary, 120))}` : ""}`],
  result_parked: ["result", "", (e) => `${who(e)} parked its ending — ${esc(e.reason)}`],
  notify: ["notify", "", (e) => `${who(e)}: ${esc(snip(e.message, 160))}`],
  preview: ["preview", "", (e) => `${who(e)} published a preview${e.path ? ` at ${esc(e.path)}` : ""}${e.ok === false ? ` — refused: ${esc(e.reason)}` : ""}`],
  model_cooling: ["cooling", "bad", (e) => `${esc(e.model)} is cooling${e.reset_at ? ` — it rolls ${esc(clock(e.reset_at))}` : ""}`],
  provider_cooling: ["cooling", "bad", (e) => `${esc(e.provider)} is cooling${e.reset_at ? ` — it rolls ${esc(clock(e.reset_at))}` : ""}`],
  restart_requested: ["restart", "warn", (e) => `restart ordered by ${esc(e.by)} — the daemon exits ${esc(e.exit_code)} and the supervisor respawns it`],
  deploy_requested: ["deploy", "", (e) => `deploy ordered by ${esc(e.by)}`],
  deploy_landed: ["deploy", "", (e) => `deploy landed${e.next ? ` at ${esc(String(e.next).slice(0, 7))}` : ""}`],
  deploy_rolled_back: ["deploy", "bad", (e) => `deploy rolled back — ${esc(e.reason ?? "the health check failed")}`],
  bridge_wedged: ["bridge", "bad", (e) => `the Discord bridge is wedged`],
  bridge_recovered: ["bridge", "", (e) => `the Discord bridge is back`],
  bridge_health: ["bridge", "", (e) => `bridge ${esc(e.previous)} → ${esc(e.state)} — ${esc(e.reason)}`],
  reconcile: ["reconcile", "", (e) => `reconcile pass${e.boot ? " at boot" : ""}`],
  command: ["command", "", (e) => `${esc(snip(e.canonical, 120))} — by ${esc(e.by)}`],
  /* The browser conversations (#333). The delete says the number is spent,
     because that is the half of it nobody can undo. */
  console_conversation_opened: ["chat", "", (e) => `${esc(e.key)} opened — a new browser conversation`],
  console_conversation_deleted: ["chat", "", (e) => `${esc(e.key)} deleted — its number is spent, and the next one counts past it`],
  map_adopted: ["charting", "", (e) => `${who(e)} adopted map ${esc(e.map)} — ${esc(snip(e.title, 80))}`],
  charting_finished: ["charting", "", (e) => `${who(e)} finished charting ${tkt(e)} — ${esc(e.status)}`],
};

function eventLine(e) {
  const spec = EVENTS[e.type];
  if (spec) return { tag: spec[0], cls: spec[1], html: spec[2](e) };
  const s = subject(e);
  return { tag: String(e.type ?? "event").replace(/_/g, " "), cls: "", html: s || "—" };
}
/* Newest first: the operator reads the top of the page, so the last thing that
   happened must be the first thing there. */
function feedList(events, limit) {
  const rows = [...(events ?? [])].reverse().slice(0, limit ?? undefined);
  if (!rows.length) return `<div class="empty">The journal tail is empty.</div>`;
  return `<ul class="feed-list">${rows.map((e) => {
    const l = eventLine(e);
    return `<li class="${l.cls}"><time>${esc(clock(e.ts))}</time>
      <span class="ev"><span class="tag">${esc(l.tag)}</span> — ${l.html}</span></li>`;
  }).join("")}</ul>`;
}

/* ---- home ------------------------------------------------------------------ */

function tile(v, l, warn) {
  const none = v === "—" || v === 0 ? " none" : "";
  return `<div class="tile${warn && v ? " warn" : ""}"><div class="v num${none}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
}
function statTiles(o) {
  const reset = nextReset(o.usage);
  return `<div class="stat-tiles">
    ${tile(needsYou(o), "needs you", true)}
    ${tile(o.agents == null ? "—" : o.agents.length, "agents live")}
    ${tile(o.review_gate?.length ?? 0, "review gate", true)}
    ${tile(reset ? clock(reset.at) : "—", reset ? `${reset.provider} ${reset.label} rolls` : "next reset")}
  </div>`;
}

/* The all-three home (#248): tiles across the top, the attention list left, the
   fleet right, the provider strip said once under it. */
function screenHome(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Home");
  const att = attentionList(o);
  return `${head(p, "Home")}
    ${statTiles(o)}
    <div class="split-cols">
      <div>
        <div class="h-sect"><h3><span class="${att.count ? "hot" : ""}">Needs you</span> (${att.count})</h3>${att.html}</div>
        <div class="h-sect"><h3>Last events</h3>${feedList(o.events, 4)}
          <a class="more" href="#feed">all events →</a></div>
      </div>
      <div>
        <div class="h-sect"><h3>Fleet${o.agents == null ? "" : ` (${o.agents.length})`}</h3>${fleetTable(o)}</div>
        ${provStrip(o)}
      </div>
    </div>`;
}

/* ---- agents ---------------------------------------------------------------- */

function screenAgents(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Agents");
  const d = o.daemon ?? {};
  const live = o.agents == null ? "—" : o.agents.length;
  const bar = `<div class="statusbar">
    <span>agents ${esc(live)}/${esc(d.max_concurrent ?? "?")}</span>
    <span>auto dispatch ${d.auto_dispatch ? "on" : "off"}</span>
    <span>bridge ${esc(o.bridge)}</span>
    <span>daemon :${esc(d.port)} up ${esc(dur(d.uptime_s))}</span>
  </div>`;
  return `${head(p, "Agents")}${bar}${agentsTable(o)}${untrackedLine(o)}${recentLine(o)}`;
}

function agentsTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. This is an unreadable tmux, not an idle box.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents wide">
    <tr><th>session</th><th>state</th><th>ticket</th><th>model</th><th>ctx</th><th>up</th><th>waiting on</th><th>do</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}${a.reviewer ? ` <span class="dim-note">reviewer</span>` : ""}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span>${a.tmux_live ? "" : `<div class="dim-note">no tmux session</div>`}</td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="mono">${esc(a.model ?? "—")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td>
      <td>${waitingCell(a)}</td>
      <td>${agentVerbs(a)}</td></tr>
    ${agentBoxes(a)}`).join("")}
  </table></div>`;
}

/* The three per-agent verbs (#266). They sit in the row that already names the
   agent, and the boxes they open sit under it — so the words the operator types
   are beside the agent they are for.

   An answer is NOT here. The Needs-you list on Home is the one answer surface,
   and the `waiting on` cell beside this says where to go. */
function agentVerbs(a) {
  const key = "agent:" + a.session;
  const b = (label, call, cls) => `<button class="${cls ?? ""}" ${anyBusy() ? "disabled" : ""} onclick="${call}">${label}</button>`;
  const s = `'${js(a.session)}'`;
  return `<div class="links">
    ${b("note", `noteBox(${s})`)}
    ${b("teleport", `teleport(${s},'${js(a.ticket ?? "")}')`)}
    ${b("cancel", `cancelAgent(${s},'${js(a.repo ?? "")}','${js(a.ticket ?? "")}')`, "bad")}
  </div>${busy(key) ? `<div class="dim-note">working…</div>` : ""}`;
}

/* One full-width row under the agent, carrying whatever it has open: the note
   box, the teleport lines, and what curia said about the last press. */
function agentBoxes(a) {
  const key = "agent:" + a.session;
  const parts = [
    UI.act.note === a.session ? noteBoxHtml(a) : "",
    UI.act.tele === a.session ? teleportHtml(a) : "",
    said(key),
  ].filter(Boolean);
  if (!parts.length) return "";
  return `<tr><td colspan="8">${parts.join("")}</td></tr>`;
}

/* The two delivery modes, in ADR-0013's own words. Queued is the default and
   costs the agent nothing until its next tool result. Interrupt aborts the call
   in flight after a grace, which is why it is the one the operator has to
   choose. */
function noteBoxHtml(a) {
  const id = "note-" + a.session;
  const radio = (mode, label) => `<label><input type="radio" name="nm-${esc(a.session)}"
    ${UI.act.mode === mode ? "checked" : ""} onchange="noteMode('${mode}')"> ${esc(label)}</label>`;
  return `<div class="act-box">
    <div class="act-row"><input type="text" id="${esc(id)}" placeholder="say something to ${esc(a.session)}…"></div>
    <div class="act-row">
      ${radio("queue", "queue — it reads this with its next tool result")}
      ${radio("interrupt", "interrupt — a short grace, then the words land as a user turn")}
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="sendNote('${js(a.session)}','${js(id)}')">Send</button>
    </div>
  </div>`;
}

function teleportHtml(a) {
  return `<div class="act-box">
    <div class="dim-note">On the box itself, in a terminal:</div>
    <input class="copy" type="text" readonly value="${esc(attachCmd(a.session))}" onclick="this.select()">
  </div>`;
}
function waitingCell(a) {
  const open = a.waiting_on ?? [];
  if (!open.length) return `<span class="dim-note">${a.result_received ? "its result is in" : "nothing"}</span>`;
  return open.map((w) => `<span class="mono">${esc(w.kind)}</span>`).join(" · ");
}
/* A tmux session curia does not track. It is an anomaly reconcile owns, so the
   page states it and spends no color on it. */
function untrackedLine(o) {
  if (!o.untracked?.length) return "";
  return `<p class="dim-note">Untracked sessions: <span class="mono">${o.untracked.map((s) => esc(s)).join(", ")}</span>. Reconcile adopts or sweeps these.</p>`;
}
function recentLine(o) {
  if (!o.recent?.length) return "";
  return `<p class="dim-note">Recently: ${o.recent.map((r) => `${esc(r.kind)} ${esc(ticketName(r.repo, r.ticket))}`).join(" · ")}</p>`;
}

/* ---- frontier -------------------------------------------------------------- */

/* The ticket type is the `wayfinder:` label and nothing else — a ticket with no
   such label has no type, and saying so beats guessing one from another label. */
function typeOf(item) {
  const l = (item.labels ?? []).find((x) => String(x).startsWith("wayfinder:"));
  return l ? String(l).slice("wayfinder:".length) : "untyped";
}
const shortRepo = (r) => String(r).split("/").pop();

/* The filter runs over the snapshot, never over the wire: the frontier is
   reconcile's reading and the page must not re-ask for a narrower one. */
function frFiltered(snap) {
  const f = UI.fr;
  return (snap?.repos ?? [])
    .filter((r) => f.repo === "all" || r.repo === f.repo)
    .map((r) => (r.error ? r : { ...r, items: (r.items ?? []).filter((i) => f.type === "all" || typeOf(i) === f.type) }));
}
function frTypes(snap) {
  const all = new Set();
  for (const r of snap?.repos ?? []) for (const i of r.items ?? []) all.add(typeOf(i));
  return [...all].sort();
}

/* Start (#266). The dispatch order — claim, prepare, spawn — is `start`'s own,
   and the reply that comes back is curia's sentence about what it did.

   Two facts ride beside the button. The ROUTED MODEL is the daemon's
   `resolveModel` answer, joined onto the item by reconcile, so the operator
   knows which account this press spends before spending it. And an agent
   ALREADY on this ticket replaces the button, because a second start on it is
   refused anyway and a button that only ever refuses is a worse way to say so.

   When the fleet could not be read, neither is claimed: the button stands, and
   the line under it says curia cannot tell. Null is not empty here either. */
function agentOn(o, repo, number) {
  if (o?.agents == null) return undefined;
  return o.agents.find((a) => String(a.ticket) === String(number) && (!a.repo || a.repo === repo)) ?? null;
}
function startRow(o, repo, n) {
  const live = agentOn(o, repo, n.number);
  const key = `start:${repo}#${n.number}`;
  if (live) return `<div class="act-row"><span class="dim-note mono">⧗ dispatched — ${esc(live.session)}</span></div>`;
  const model = n.model
    ? `<span class="dim-note mono">→ ${esc(n.model)} (${esc(typeOf(n))} default)</span>`
    : `<span class="dim-note">the routed model is not on this reading</span>`;
  return `<div class="act-row">
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="startTicket('${js(repo)}','${js(n.number)}')">${
        busy(key) ? "Starting…" : "Start"}</button>${model}
    </div>
    ${live === undefined ? `<div class="dim-note">the fleet could not be read, so curia cannot say whether this one is already running</div>` : ""}
    ${said(key)}`;
}

function frCards(repos, o) {
  const bigs = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).map((i) => ({ ...i, repo: r.repo })));
  const kids = repos.filter((r) => !r.error).flatMap((r) => (r.items ?? []).flatMap((i) => (i.unblocks ?? []).map((k) => ({ ...k, repo: r.repo, from: i.number }))));
  return `${repos.filter((r) => r.error).map(frError).join("")}
    <div class="frx-sect"><span class="eyebrow">takeable now (${bigs.length})</span>
      ${bigs.length ? `<div class="frx-big">${bigs.map((n) => `<div class="frx-card">
        <div class="head"><span class="t">#${esc(n.number)}</span><span class="typ">${esc(typeOf(n))}</span></div>
        <div class="title">${esc(n.title)}</div>
        <div class="foot"><span>${esc(n.repo)}</span><span>${n.unblocks?.length ? `unblocks ${n.unblocks.length}` : "unblocks nothing yet"}</span></div>
        ${n.mapTitle ? `<div class="dim-note">${esc(n.mapTitle)}</div>` : ""}
        ${startRow(o, n.repo, n)}
      </div>`).join("")}</div>` : `<div class="empty">Nothing is takeable under this filter.</div>`}
    </div>
    <div class="frx-sect"><span class="eyebrow">unblocked next (${kids.length})</span>
      ${kids.length ? `<div class="frx-dim">${kids.map((k) => `<div class="frx-dimcard"><span class="t">#${esc(k.number)}</span>${esc(k.title)}
        <span class="from">↖ #${esc(k.from)} · ${esc(k.repo)}</span></div>`).join("")}</div>`
        : `<div class="empty">These tickets unblock nothing that is not already takeable.</div>`}
    </div>`;
}
function frTree(repos, o) {
  return repos.map((r) => {
    if (r.error) return frError(r);
    if (!r.items?.length) return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      <div class="empty">Nothing is takeable under this filter.</div></div>`;
    return `<div class="fr-repo"><span class="eyebrow mono">${esc(r.repo)}</span>
      ${r.items.map((n) => `<div class="fr-group">
        <div class="fr-node"><span class="typ">${esc(typeOf(n))}</span><span class="t">#${esc(n.number)}</span>${esc(n.title)}
          ${startRow(o, r.repo, n)}</div>
        ${n.unblocks?.length ? `<div class="fr-kids">${n.unblocks.map((k) => `<div class="fr-kid"><span class="t">#${esc(k.number)}</span>${esc(k.title)}</div>`).join("")}</div>` : ""}
      </div>`).join("")}</div>`;
  }).join("");
}
function frError(r) {
  return `<div class="unread"><span class="mono">${esc(r.repo)}</span> could not be read — ${esc(r.error)}. This is not an empty frontier: there may be takeable tickets there.</div>`;
}

const FR_VIEWS = { cards: ["Cards", frCards], tree: ["Tree", frTree] };

function screenFrontier(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Frontier");
  const snap = o.frontier;
  const right = `<span class="seg">${Object.entries(FR_VIEWS).map(([k, v]) =>
    `<button class="${UI.fr.view === k ? "on" : ""}" onclick="frSet('view','${k}')">${esc(v[0])}</button>`).join("")}</span>`;
  if (!snap || !snap.computed_at) {
    return `${head(p, "Frontier — two levels", right)}
      <div class="later">No frontier has been computed yet. Reconcile computes it on the credentials that pass already holds, and stamps the instant it did.</div>`;
  }
  const types = frTypes(snap);
  const filter = `<div class="frx-filter">
    <button class="fchip ${UI.fr.repo === "all" ? "on" : ""}" onclick="frSet('repo','all')">all projects</button>
    ${(snap.repos ?? []).map((r) => `<button class="fchip ${UI.fr.repo === r.repo ? "on" : ""}" onclick="frSet('repo','${esc(r.repo)}')">${esc(shortRepo(r.repo))}</button>`).join("")}
    <span class="sep">·</span>
    <select onchange="frSet('type',this.value)">
      <option value="all"${UI.fr.type === "all" ? " selected" : ""}>all types</option>
      ${types.map((t) => `<option${UI.fr.type === t ? " selected" : ""}>${esc(t)}</option>`).join("")}
    </select>
    <span class="dim-note">computed ${esc(ago(snap.computed_at))}</span>
  </div>`;
  return `${head(p, "Frontier — two levels", right)}${filter}${FR_VIEWS[UI.fr.view][1](frFiltered(snap), o)}`;
}
function frSet(key, value) {
  UI.fr[key] = value;
  /* A repo that leaves the filter takes its types with it — an unreachable
     type filter would show an empty page and name no reason. */
  if (key === "repo") UI.fr.type = "all";
  render();
}

/* ---- feed ------------------------------------------------------------------ */

function screenFeed(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Feed");
  const n = o.events?.length ?? 0;
  return `${head(p, "Feed", `<span class="dim-note">the journal's last ${esc(n)} event(s)</span>`)}
    <div style="max-width:720px">${feedList(o.events)}</div>`;
}

/* ---- settings (#265) -------------------------------------------------------

   The one screen that writes. Three facts shape all of it.

   1. IT DRAWS ITS OWN READ. `GET /api/settings` is a fresh parse of
      curia.yaml and routing.yaml off disk, never the poll snapshot: both files
      are hand-edited on the box too, and a screen that offered to save over an
      edit it had not seen would lose it.
   2. IT POSTS ONLY WHAT CHANGED. The patch is the difference between `draft`
      and `settings`, so a field nobody touched is not written — which is what
      keeps a hand edit made while this tab was open from being clobbered by a
      save of something else.
   3. SAVE AND APPLY ARE TWO ACTS. A save writes the file. The daemon goes on
      running the config it booted with until it restarts, and the banner says
      so rather than letting a saved page look like a changed daemon. */

const SET_SECTIONS = { routing: "Routing", projects: "Projects", dispatch: "Dispatch" };
const SET_HINTS = {
  routing: "The model each ticket type gets when no label on the ticket says otherwise.",
  projects: "The repos curia watches. It dispatches against these and no others.",
  dispatch: "Whether curia starts work by itself, how many agents run at once, and how often it looks for work.",
};
const DISPATCH_FIELDS = [
  ["max_concurrent", "How many agents may run at once. Each one costs a container, and three sandbox ports."],
  ["poll_interval_s", "How often curia reads the frontier of every watched repo."],
];

const clone = (x) => JSON.parse(JSON.stringify(x));

/* What the operator has changed and not yet saved. The banner counts these and
   the save posts them; both read this one function, so the count can never
   disagree with what lands on disk. */
function settingsPatch() {
  if (!settings || !draft) return {};
  const p = {};
  const d = {};
  for (const k of Object.keys(draft.dispatch)) {
    if (draft.dispatch[k] !== settings.dispatch[k]) d[k] = draft.dispatch[k];
  }
  if (Object.keys(d).length) p.dispatch = d;
  if (JSON.stringify(draft.watch) !== JSON.stringify(settings.watch)) p.watch = draft.watch;
  const defaults = {};
  draft.routing.defaults.forEach((row, i) => {
    if (row.model !== settings.routing.defaults[i]?.model) defaults[row.type] = row.model;
  });
  const models = {};
  draft.routing.models.forEach((m, i) => {
    if (m.active !== settings.routing.models[i]?.active) models[m.name] = { active: m.active };
  });
  if (Object.keys(defaults).length || Object.keys(models).length) {
    p.routing = {};
    if (Object.keys(defaults).length) p.routing.defaults = defaults;
    if (Object.keys(models).length) p.routing.models = models;
  }
  return p;
}
function changeCount() {
  const p = settingsPatch();
  return Object.keys(p.dispatch ?? {}).length
    + (p.watch ? 1 : 0)
    + Object.keys(p.routing?.defaults ?? {}).length
    + Object.keys(p.routing?.models ?? {}).length;
}

/* ---- the save banner: two phases, at the top (#248) ---- */

function saveBanner() {
  const n = changeCount();
  const s = UI.set;
  const save = (on) => `<button class="btn${on ? " primary" : ""}" ${on && !s.busy ? "" : "disabled"} onclick="doSave()">${
    s.busy ? "Saving…" : "Save"}</button>`;
  const restart = (loud) => `<button class="btn${loud ? " restart-hot" : ""}" ${s.busy ? "disabled" : ""} onclick="doRestart()">${
    loud ? "Restart to apply" : "Restart daemon"}</button>`;
  const line = (cls, body) => `<div class="save-banner${cls ? " " + cls : ""}">${body}</div>`;

  if (s.phase === "unread") {
    return line("refused", `${save(false)}${restart(false)}
      <span class="toast">The settings could not be read.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (s.phase === "refused") {
    /* The loaders refused the candidate, so nothing on disk moved. The draft
       stays on screen: the operator fixes the value they typed, they do not
       type it again. */
    return line("refused", `${save(n > 0)}${restart(false)}
      <span class="toast">Refused — nothing was written.</span>
      <span class="toast why">${esc(s.error)}</span>`);
  }
  if (s.phase === "restarting") {
    return line("", `${save(n > 0)}${restart(false)}
      <span class="toast">The daemon exited nonzero and the supervisor respawns it. This page serves its last snapshot meanwhile.</span>`);
  }
  if (s.phase === "saved") {
    /* Phase two. The restart is the loud button now, because the file on disk
       and the running daemon disagree until it is pressed. */
    return line("saved", `<button class="btn" disabled>Saved ✓</button>${restart(true)}
      <span class="toast">${esc(s.note ?? "Saved.")} The daemon still runs the config it booted with.</span>`);
  }
  if (n === 0) {
    return line("", `${save(false)}${restart(false)}
      <span class="toast">${esc(s.note ?? "No unsaved changes.")}</span>`);
  }
  return line("", `${save(true)}${restart(false)}
    <span class="toast">${n} unsaved change${n === 1 ? "" : "s"}.</span>`);
}

/* ---- the three sections ---- */

const setBlock = (title, hint, body) => `<div class="set-block"><h3>${esc(title)}</h3>
  <p class="hint">${esc(hint)}</p>${body}</div>`;

/* Routing. The ticket-type table leads and the model list sits behind one
   click, because the row an operator changes is the default, and the model
   list is the thing they set once. */
function setRouting() {
  const models = draft.routing.models;
  const active = models.filter((m) => m.active);
  const rows = draft.routing.defaults.map((row, i) => {
    const known = active.some((m) => m.name === row.model);
    return `<tr><td class="mono">${esc(row.type)}</td>
      <td><select onchange="setDefault(${i}, this.value)">
        ${active.map((m) => `<option ${m.name === row.model ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
        ${known ? "" : `<option selected>${esc(row.model)}</option>`}
      </select>${known ? "" : ` <span class="dim-note">switched off — the daemon refuses this config</span>`}</td></tr>`;
  }).join("");
  const mgr = `<div class="model-mgr">
    <a href="#settings" onclick="UI.set.models=!UI.set.models;render();return false">${
      active.length} of ${models.length} models active · ${UI.set.models ? "close" : "manage"}</a>
    ${UI.set.models ? `<table style="margin-top:10px"><tr><th>active</th><th>model</th><th>runs on</th></tr>
      ${models.map((m, i) => `<tr class="${m.active ? "" : "inactive"}">
        <td><input type="checkbox" id="set-model-${esc(m.name)}" ${m.active ? "checked" : ""} onchange="setModelActive(${i}, this.checked)"></td>
        <td class="mono">${esc(m.name)}${m.id ? ` <span class="dim-note">${esc(m.id)}</span>` : ""}</td>
        <td class="mono">${esc(m.provider ?? "?")} · ${esc(m.harness ?? "?")}</td></tr>`).join("")}</table>
      <p class="hint" style="margin:8px 0 0">A model switched off keeps its whole entry in routing.yaml. It leaves the
        dispatch vocabulary: no default may name it, a fallback chain steps over it, and a <code>model:</code> label on it is refused.</p>` : ""}
  </div>`;
  return setBlock("Routing", SET_HINTS.routing,
    `<table><tr><th>ticket type</th><th>default model</th></tr>${rows}</table>${mgr}`);
}

/* Projects. The repo list comes from the daemon, which holds the GitHub login;
   this page holds no credential at all. */
function setProjects() {
  const watched = draft.watch.map((w) => w.repo);
  const rows = draft.watch.map((w, i) => `<tr><td class="mono">${esc(w.repo)}</td>
    <td class="dim-note">${esc(w.mode)}</td>
    <td class="right"><button class="btn sm" ${draft.watch.length < 2 ? "disabled" : ""}
      onclick="removeRepo(${i})">remove</button></td></tr>`).join("");
  let connect;
  if (repos === null) connect = `<div class="gh-connect"><span class="dot off"></span>reading the GitHub login…</div>`;
  else if (repos.error) {
    /* Null is not empty: curia could not ask, which is a different fact from
       an account with no repos. The typed field below still works. */
    connect = `<div class="unread">curia could not read your repos from GitHub — ${esc(repos.error)}. Type a repo below instead.</div>`;
  } else {
    connect = `<div class="gh-connect"><span class="dot"></span>GitHub connected as
      <b class="mono">${esc(repos.login ?? "?")}</b>
      <span class="dim-note">the ${esc(repos.repos?.length ?? 0)} most recently pushed repos it can reach</span></div>`;
  }
  const choices = (repos?.repos ?? []).filter((r) => !watched.includes(r));
  const picker = choices.length
    ? `<select id="set-repo-pick" onchange="addRepo(this.value); this.value=''">
        <option value="">add a repo…</option>${choices.map((r) => `<option>${esc(r)}</option>`).join("")}</select>`
    : "";
  return setBlock("Projects", SET_HINTS.projects, `${connect}
    <table>${rows}
    <tr><td colspan="3">${picker}
      <input type="text" id="set-repo-typed" placeholder="owner/name" size="22">
      <button class="btn sm" onclick="addTypedRepo()">add</button></td></tr></table>
    <p class="hint" style="margin:10px 0 0">The last repo cannot be removed: curia dispatches only against watched repos.</p>`);
}

function setDispatch() {
  const auto = draft.dispatch.auto_dispatch;
  const rows = DISPATCH_FIELDS.map(([key, why]) => `<tr>
    <td class="mono">${esc(key)}<span class="hint" style="display:block;margin:2px 0 0">${esc(why)}</span></td>
    <td><input type="number" id="set-${esc(key)}" min="1" value="${esc(draft.dispatch[key] ?? "")}"
      oninput="setDispatchField('${esc(key)}', this.value)"></td></tr>`).join("");
  return setBlock("Dispatch", SET_HINTS.dispatch, `<table>
    <tr><td><label for="set-auto"><b>auto_dispatch</b></label>
      <span class="hint" style="display:block;margin:2px 0 0">On, curia starts the next takeable ticket by itself. Off, every dispatch is one the operator ordered.</span></td>
      <td><input type="checkbox" id="set-auto" ${auto ? "checked" : ""} onchange="setDispatchField('auto_dispatch', this.checked)"></td></tr>
    ${rows}</table>`);
}

/* ---- the chat (#267, many conversations by #333) ----------------------------

   The console draws no chat of its own and frames none. A chat IS the timeline
   attach — the same page a phone opens against an agent — pointed at one
   browser conversation of the overseer and served under this address. One chat
   surface: the composer, the history and every future thing the timeline grows
   arrive here for free, and there is no second one to keep in step.

   So this screen is a door, and #333 made it a door with many rooms behind it.
   ADR-0016 gives the browser many conversations rather than one that grows
   forever, so this is where the operator picks one and opens a new one. A new
   conversation is the reset, the same way a new Discord thread is.

   The picker lives HERE and not in the chat page, because the chat page is the
   timeline and an agent opens the same page. A conversation switcher there
   would put console words on the agent surface.

   Every row carries its own context percent. ADR-0016 adds no warning that a
   conversation is long: that number IS the signal, and #332 is what made it
   true per conversation. */
const CHAT_PAGE = "/chat";
const chatHref = (session) => CHAT_PAGE + "?session=" + encodeURIComponent(session);

function screenChat(p) {
  /* The overseer runs INSIDE the daemon, so a daemon that is not answering is a
     chat that is not there. The bar above says why; this says what it means. */
  const down = p && !p.daemon_up;
  const lead = `<p class="lead">This is the overseer — the same curia that answers your prose in
      Discord. It sees every watched repo, and it holds the verbs: ask it what to start, then say
      <code>start 256</code> and it dispatches.</p>
    ${down ? `<p class="unread">The chat is down while the daemon restarts. The overseer runs inside it.</p>` : ""}`;
  const count = conversations?.conversations?.length ?? null;
  return `${head(p, "Chat", count == null ? "" : `<span class="dim-note num">${count} conversation${count === 1 ? "" : "s"}</span>`)}
    <div class="door">${lead}${chatList()}
      <p class="cannot">It has no shell and no checkout, so it cannot read a file or a diff. It tells
        you what curia knows, and it acts. A destructive verb still posts its ✅/❌ card, and that
        card lands on Home.</p>
    </div>`;
}

/* Null is not empty, the second rule of this page. A list curia could not be
   asked for and a box with no conversations on it are opposite facts. */
function chatList() {
  if (conversations === null) return `<div class="later">Reading your conversations…</div>`;
  if (conversations.conversations === null) {
    return `<div class="unread">curia could not read your conversations — ${esc(conversations.error ?? "no reason given")}.</div>
      ${newChatButton()}`;
  }
  const rows = conversations.conversations.map(chatRow).join("");
  if (!rows) {
    /* The state after the cutover, and after the last conversation is deleted.
       Nothing is minted by looking at this screen: a page read must not spend a
       number, and numbers only go up. */
    return `<p>No conversations yet. Press below to open the first one.</p>${newChatButton()}`;
  }
  return `<table class="chats">${rows}</table>${newChatButton()}
    <p class="cannot">A new conversation is the reset — the same thing a new thread is in Discord.
      Open one when the context above reads full. Deleting one spends its number for good.</p>`;
}

function newChatButton() {
  const k = "chat-new";
  return `<p><button class="btn primary" ${anyBusy() ? "disabled" : ""} onclick="doNewConversation()">
    ${busy(k) ? "Opening…" : "New conversation"}</button></p>${said(k)}`;
}

function chatRow(c) {
  const k = "chat-del-" + c.key;
  /* The label is the operator's own first message, read off the transcript by
     the daemon. A conversation with no turn yet has none, and says so rather
     than showing a blank row. */
  const label = c.label
    ? `<b>${esc(c.label)}</b>`
    : `<span class="dim-note">no turn yet</span>`;
  const answer = said(k);
  return `<tr>
    <td><a href="${esc(chatHref(c.session))}">${label}</a>
      <span class="dim-note mono" style="display:block;margin:2px 0 0">${esc(c.key)} · ${esc(ago(c.last_turn_at))}</span></td>
    <td class="num">${ctxCell(c)}</td>
    <td><button class="btn sm" ${anyBusy() ? "disabled" : ""} onclick="doDeleteConversation('${js(c.key)}')">
      ${busy(k) ? "…" : "delete"}</button></td>
  </tr>${answer ? `<tr><td colspan="3">${answer}</td></tr>` : ""}`;
}

/* Mint, then walk through the door. Opening a conversation you then have to
   find in a list is two acts where the operator asked for one. */
async function doNewConversation() {
  const out = await verb("chat-new", "/api/console/new", {});
  if (out?.session) location.href = chatHref(out.session);
}

async function doDeleteConversation(key) {
  const ask = `Delete ${key}? Its number is spent for good — a later conversation never reuses it. `
    + `curia stops offering the conversation, and its transcript stays on the box.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  await verb("chat-del-" + key, "/api/console/delete", { key });
  loadConversations();
}

function screenSettings(p) {
  if (!settings || !draft) {
    return `${head(p, "Settings")}${saveBanner()}
      <div class="later">Reading curia.yaml and routing.yaml…</div>`;
  }
  const bodies = { routing: setRouting, projects: setProjects, dispatch: setDispatch };
  if (!bodies[UI.set.section]) UI.set.section = "routing";
  const files = `<span class="dim-note mono">${esc(fileName(settings.files.curia))} · ${esc(fileName(settings.files.routing))}</span>`;
  /* #292: the screen reads two layers and writes only the top one. Said here,
     because "I saved and git shows nothing changed" must not be a puzzle the
     operator has to solve on the box. */
  const writes = settings.writes
    ? `<p class="dim-note" style="max-width:620px">A save writes
       <span class="mono">${esc(fileName(settings.writes.curia))}</span> and
       <span class="mono">${esc(fileName(settings.writes.routing))}</span>, beside the files above.
       Git does not track those, so the box's checkout stays clean and a deploy never collides with a
       save. They hold what this box answers differently, and nothing else.</p>`
    : "";
  return `${head(p, "Settings", files)}${saveBanner()}
    <div class="set-subnav">${Object.entries(SET_SECTIONS).map(([k, label]) =>
      `<button class="${UI.set.section === k ? "on" : ""}" onclick="setSection('${k}')">${esc(label)}</button>`).join("")}</div>
    <div style="max-width:620px">${bodies[UI.set.section]()}</div>
    ${writes}`;
}
const fileName = (p) => String(p ?? "").split("/").pop();

/* ---- the edits ---- */

/* Every edit lands on the draft and nowhere else, so what is on screen and what
   a save would post are the same object. */
function dirty() {
  if (UI.set.phase !== "restarting") UI.set.phase = changeCount() ? "dirty" : "clean";
  UI.set.error = null;
  UI.set.note = null;
  render();
}
function setSection(k) {
  UI.set.section = k;
  if (k === "projects" && repos === null) loadRepos();
  render();
}
function setDefault(i, model) { draft.routing.defaults[i].model = model; dirty(); }
function setModelActive(i, on) { draft.routing.models[i].active = on; dirty(); }
function setDispatchField(key, value) {
  draft.dispatch[key] = typeof value === "boolean" ? value : Number(value);
  dirty();
}
function removeRepo(i) { draft.watch.splice(i, 1); dirty(); }
function addRepo(repo) {
  const name = String(repo ?? "").trim();
  if (!name || draft.watch.some((w) => w.repo === name)) return;
  draft.watch.push({ repo: name, mode: "auto" });
  dirty();
}
function addTypedRepo() {
  const el = document.getElementById("set-repo-typed");
  if (!el) return;
  const name = el.value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(name)) {
    UI.set.phase = "refused";
    UI.set.error = `"${name}" is not an owner/name repo`;
    return render();
  }
  el.value = "";
  addRepo(name);
}

/* ---- the two calls ---- */

async function loadSettings() {
  try {
    const res = await fetch("/api/settings", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    settings = await res.json();
    draft = clone(settings);
    if (UI.set.phase === "unread") UI.set.phase = "clean";
  } catch (e) {
    UI.set.phase = "unread";
    UI.set.error = e.message;
  }
  render();
}

async function loadRepos() {
  repos = null;
  try {
    const res = await fetch("/api/repos", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    repos = await res.json();
  } catch (e) {
    repos = { login: null, repos: null, error: e.message };
  }
  render();
}

/* The browser conversations (#333). Taken on arrival at the Chat screen and
   after a press that changes the list, never on the poll: a row costs the
   daemon a transcript read, and the other five screens have no use for it.

   A failure lands as `conversations: null`, which the screen draws as "curia
   could not be asked" — not as an empty list. */
async function loadConversations() {
  try {
    const res = await fetch("/api/console", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    conversations = await res.json();
  } catch (e) {
    conversations = { conversations: null, error: e.message };
  }
  render();
}

async function doSave() {
  const patch = settingsPatch();
  if (!Object.keys(patch).length) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/settings", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(patch),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    /* The answer carries the re-read file, so the screen shows what landed
       rather than what was typed. */
    settings = body.settings ?? settings;
    draft = clone(settings);
    UI.set.phase = body.written?.length ? "saved" : "clean";
    UI.set.note = body.written?.length
      ? `Wrote ${body.written.join(" and ")}, atomically, with the comments kept.`
      : "That was already what the files say.";
    UI.set.error = null;
  } catch (e) {
    UI.set.phase = "refused";
    UI.set.error = e.message;
  }
  UI.set.busy = false;
  render();
}

async function doRestart() {
  const ask = "Restart the daemon? Running agents keep their tmux sessions — those live in their own container. Anything unsaved here is not written.";
  if (typeof confirm === "function" && !confirm(ask)) return;
  UI.set.busy = true;
  render();
  try {
    const res = await fetch("/api/restart", {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: "{}",
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("the sidecar answered " + res.status));
    UI.set.phase = "restarting";
    UI.set.error = null;
  } catch (e) {
    /* The daemon may have taken the order and died before answering. Say
       exactly that, and let the marker at the top of the page be the evidence:
       it reads the daemon, and this reads a socket. */
    UI.set.phase = "refused";
    UI.set.error = `${e.message} — the bar above says whether the daemon is answering`;
  }
  UI.set.busy = false;
  render();
}

/* ---- the shell ------------------------------------------------------------- */

function render() {
  /* No mount point, nothing to draw. The page boots only into `#app`, and its
     test drives the screens directly — an edit there must not go looking for a
     document that is not one. */
  const app = document.getElementById("app");
  if (!app) return;
  const n = needsYou(payload?.overview);
  const field = activeField();
  app.innerHTML = `<div class="shell">
    <nav><span class="brand">curia</span>
      ${NAMES.map((k) => `<button class="${UI.screen === k ? "on" : ""}" onclick="goto('${k}')">${SCREENS[k][0]}${
        k === "home" && n ? ` <span class="n">${n}</span>` : ""}</button>`).join("")}
    </nav>
    <main>${SCREENS[UI.screen][1](payload)}</main>
  </div>`;
  document.title = (n ? `(${n}) ` : "") + "curia";
  restoreField(field);
}

/* The poll re-renders the whole page every few seconds, and the settings screen
   has fields somebody may be halfway through typing in. The VALUE is never at
   risk — every keystroke lands on the draft — so what has to survive a render
   is the cursor, by id and offset. */
function activeField() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  let caret = null;
  try { caret = el.selectionStart; } catch { caret = null; }
  return { id: el.id, caret };
}
function restoreField(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || typeof el.focus !== "function") return;
  el.focus();
  if (f.caret != null && el.setSelectionRange) {
    try { el.setSelectionRange(f.caret, f.caret); } catch { /* not a text field */ }
  }
}

/* Entering a screen, from a click or from the hash. Settings and Chat are the
   two screens with a read of their own, and each is taken on arrival rather
   than on every poll: the config files change when somebody saves them, and the
   conversations change when somebody opens or deletes one — neither happens
   every five seconds.
   Chat re-reads on EVERY arrival, unlike settings. The list carries a context
   percent and a last-turn time, and both move with every turn taken from any
   device, so a held copy would age. */
function enter(k) {
  UI.screen = k;
  if (k === "settings" && !settings) loadSettings();
  if (k === "chat") loadConversations();
}
function goto(k) { enter(k); location.hash = k; render(); }
window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (NAMES.includes(k) && k !== UI.screen) { enter(k); render(); }
});

/* ---- the poll -------------------------------------------------------------
   The operator's call on #263: refresh while this tab is visible, and stop
   when it is not. Every refresh costs the daemon a whole read of the journal
   off disk, so a tab nobody is looking at must cost nothing. The interval is
   the sidecar's to state — it comes back inside the payload — so one config
   key governs both halves and they cannot drift apart. */
let timer = null;

async function tick() {
  try {
    const res = await fetch("/api/overview", { headers: { accept: "application/json" }, cache: "no-store" });
    if (!res.ok) throw new Error("the sidecar answered " + res.status);
    payload = await res.json();
    reachable = true;
  } catch {
    /* Keep the last payload on screen: a page that blanks itself is worst
       exactly when the box is worst. */
    reachable = false;
  }
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  timer = setTimeout(tick, (payload?.poll_interval_s ?? 5) * 1000);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else clearTimeout(timer);
});

/* The page boots itself only in a browser. Its test loads the same source into

if (typeof document !== "undefined" && document.getElementById("app")) {
