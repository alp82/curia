<!doctype html>
<meta charset="utf-8">
<!-- The console (#263 the shell, #264 the read screens, #265 the settings write,
     #266 the operator verbs, #661 the Credentials screen, #686 the Atlas frame,
     #699 the drill-in sections and the save dock), on the look settled by the
     prototypes (#248, #525): dark-first tokens, system mono for data, one
     accent.

     THE STAMP BELOW IS LOAD-BEARING. This page and daemon/src/dashboard.mjs are
     two halves of one protocol, and there is no build step — the file on disk IS
     the reviewed source. A pull that changes both halves with no sidecar restart
     would leave an old server serving a new page, so the page declares what it
     speaks and the server refuses anything else (#70's rule, as timeline.html
     carries it).

     The read screens draw one payload: `GET /api/overview`, which is the
     sidecar's held snapshot of the daemon's own `GET /overview` (#262).
     Credentials (#661) is one of them: it draws the poll and takes no read of
     its own, and its single button goes through the verb seam below. A chat
     (#267) draws nothing: it is the timeline page, served at /chat. What the
     Chat screen draws is the PICKER over the browser conversations (#333), off
     a read of its own — `GET /api/console`, taken on arrival, not on the poll.

     THE VERBS (#266) POST to the sidecar, never to the daemon. It composes each
     daemon call from the fields the page sends, so this page names a ticket, an
     escalation id or an agent — never a command line.

     THE DIFF DIGEST (#355) follows that same seam and is the one read off the
     poll: `GET /api/diff` names an escalation id or an agent, and a file only
     by its place in the digest curia itself measured. Hunks are fetched per
     file, once, when a card is opened.

     TWO RULES RUN THROUGH EVERY SCREEN HERE.

     1. Color marks attention, and nothing else. Warn and bad are spent on an
        open question, the review gate and a spent usage window. A state, a
        ticket type and a repo are told in words. The Maps progress rail is the
        narrow exception: muted color and texture separate its adjacent stages,
        and every stage still carries its name and count.
     2. Null is not empty. An unreadable fleet is not an idle box, and a frontier
        nobody has computed is not an empty frontier. Every section that can fail
        on its own says which of the two it is. -->
<meta name="curia-dashboard" content="proto=14">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Atlas · Curia</title>
<style>
  /* ---------- tokens: dark-first (#248) ---------- */
  :root {
    color-scheme: dark;
    --bg: #0b0c10; --bg-raise: #13161d; --bg-inset: #08090c;
    --line: #20242c; --ink: #e6e9ef; --ink-dim: #8a93a3; --ink-faint: #687180;
    --accent: #5ec8e5; --accent-ink: #08090c;
    --warn: #ffb454; --bad: #f07a7a; --ok: #41d98d; --idle: #8a93a3;
    --chip-warn-bg: #2b2114; --chip-bad-bg: #2b1715; --chip-ok-bg: #12241f;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
    /* The diff's own two colors (#355) — a patch's vocabulary, not the
       attention marking. Deliberately not --ok/--bad. */
    --diff-add: #6fbf73; --diff-del: #d98b84;
    --map-done-bg: #29463b; --map-done-ink: #a9cabc;
    --map-run-bg: #142b38; --map-run-ink: #a9ddf3; --map-run-line: #65b8db;
    --map-front-bg: #10252d; --map-fog-a: #2b3037; --map-fog-b: #20242a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f6f6f4; --bg-raise: #ffffff; --bg-inset: #eeeeeb;
      --line: #e3e3e0; --ink: #17181c; --ink-dim: #6b7280; --ink-faint: #8a93a3;
      --accent: #0b6f8f; --accent-ink: #ffffff;
      --warn: #b97900; --bad: #b3323a; --ok: #1fbf6b; --idle: #6b7280;
      --chip-warn-bg: #f4e8cf; --chip-bad-bg: #f6ddda; --chip-ok-bg: #d9efe7;
      --shadow: 0 6px 24px rgba(30,40,35,.12);
      --diff-add: #1f7a34; --diff-del: #a3352c;
      --map-done-bg: #dcebe4; --map-done-ink: #315f4b;
      --map-run-bg: #e0f0f7; --map-run-ink: #276a86; --map-run-line: #3f91b2;
      --map-front-bg: #e4f3f6; --map-fog-a: #d9dde0; --map-fog-b: #eef0f1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .mono, code { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .drawer {
    position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line);
    padding: 22px 20px; background: var(--bg-inset); display: flex; flex-direction: column; gap: 2px;
  }
  .drawer .brand {
    padding: 0 10px 18px; color: var(--ink-dim); font: 700 11px ui-monospace, Menlo, monospace;
    letter-spacing: .16em;
  }
  .drawer button {
    text-align: left; border: 0; background: none; color: var(--ink-dim);
    padding: 11px 10px; border-radius: 7px; font: 600 12px ui-monospace, Menlo, monospace;
    letter-spacing: .08em;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .drawer button.on { background: var(--bg-raise); color: var(--accent); }
  .nav-marker { color: var(--warn); font-weight: 700; }
  .notchbar { display: none; }
  .shell main { padding: 18px 22px; min-width: 0; }
  .shell main h2 { font-size: 15px; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .screen-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search-lens { border: 1px solid var(--line); border-radius: 999px; background: var(--bg-raise); color: var(--ink-dim); padding: 5px 11px; font-size: 12px; }
  .search-sheet { position: fixed; z-index: 50; inset: 0; overflow-y: auto; background: color-mix(in srgb, var(--bg) 96%, transparent); padding: 22px max(16px, calc((100vw - 820px) / 2)); }
  .search-box { display: flex; gap: 8px; position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 8px 0 14px; }
  .search-box input { flex: 1; width: 100%; font-size: 17px; padding: 10px 14px; }
  .search-results { border-top: 1px solid var(--line); }
  .search-result { display: grid; grid-template-columns: 82px 1fr auto; gap: 14px; align-items: start; color: var(--ink); padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .search-result:hover { text-decoration: none; background: var(--bg-raise); }
  .search-result .kind { color: var(--ink-faint); font: 700 10px ui-monospace, Menlo, monospace; text-transform: uppercase; }
  .search-result .kind.needs { color: var(--warn); }
  .search-result .title { display: block; font-weight: 700; }
  .search-result .snippet { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-dim); font-size: 12px; margin-top: 3px; }
  .search-result .meta { text-align: right; color: var(--ink-faint); font: 10px ui-monospace, Menlo, monospace; }
  .search-result .meta span { display: block; }
  .search-result mark { background: transparent; color: var(--accent); font-weight: 700; }
  @media (max-width: 620px) {
    .search-result { grid-template-columns: 70px 1fr; }
    .search-result .meta { grid-column: 2; display: flex; gap: 8px; text-align: left; }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .drawer { display: none; }
    .shell main { padding: 14px 14px calc(104px + env(safe-area-inset-bottom)); }
    .notchbar {
      position: fixed; z-index: 20; right: 0; bottom: 0; left: 0;
      display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr;
      border-top: 1px solid var(--line); padding: 9px 6px calc(10px + env(safe-area-inset-bottom));
      background: var(--bg-inset); box-shadow: 0 -8px 28px rgba(0,0,0,.24);
    }
    .notchbar button {
      min-width: 0; border: 0; background: none; color: var(--ink-dim);
      padding: 4px 1px; font: 700 9px ui-monospace, Menlo, monospace;
      letter-spacing: .04em;
    }
    .notchbar button.on { color: var(--accent); }
    .notchbar .nav-icon { display: block; min-height: 20px; margin-bottom: 3px; font-size: 17px; line-height: 20px; }
    .notchbar .agents-key {
      position: relative; width: 62px; height: 62px; align-self: end; justify-self: center;
      margin-top: -28px; border: 1px solid var(--line); border-radius: 50%;
      background: var(--bg-raise); box-shadow: var(--shadow);
    }
    .notchbar .agents-key.on { outline: 2px solid var(--accent); outline-offset: 2px; }
    .notchbar .agents-key .nav-icon { color: var(--warn); font-size: 16px; }
    .notchbar .agents-key .nav-label { display: block; color: var(--ink-dim); font-size: 7px; }
  }

  /* ---------- the drill-in section frame (#699, on the #525 decision) ----------
     A page that is a LIST OF SECTIONS draws one list and one open section. A
     phone shows the list, and a pick replaces it with that section and a way
     back. A desktop shows both, and the back link is the only thing width
     changes — the HTML is the same on either, so nothing in the script reads a
     viewport. Settings is the first page here; Maps, Agents, Feed and Chat
     land in the same frame. */
  .drill { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 0 44px; align-items: start; }
  .drill-row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink);
    padding: 15px 2px;
  }
  .drill-list .drill-row:first-child { border-top: 0; }
  .drill-row .t { display: block; font-size: 15px; font-weight: 600; }
  .drill-row .g { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace; }
  .drill-row.on .t { color: var(--accent); }
  .drill-row .chev { margin-left: auto; color: var(--ink-faint); font-size: 17px; }
  .drill-body { min-width: 0; max-width: 620px; }
  .drill-body h3 { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-dim); }
  .drill-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .drill-back { display: none; }
  @media (max-width: 760px) {
    .drill { grid-template-columns: 1fr; }
    .drill[data-open] .drill-list { display: none; }
    .drill:not([data-open]) .drill-body { display: none; }
    .drill-back { display: inline-block; margin: 2px 0 16px; font-size: 13.5px; }
    .dock { bottom: calc(88px + env(safe-area-inset-bottom)); }
  }

  /* One row of controls, roomy, with its explanation behind a `?` (#525): the
     row stays short, and the words arrive when they are asked for. */
  .rows .row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .rows .row:first-child { border-top: 0; }
  .rows .key { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .rows .grow { flex: 1; min-width: 0; }
  .qq {
    flex: none; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%;
    background: none; color: var(--ink-dim); font: 600 12px ui-monospace, Menlo, monospace;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .qq:hover, .qq.on { color: var(--ink); border-color: var(--ink-dim); }
  .qhint { font-size: 12.5px; line-height: 1.6; color: var(--ink-dim); padding: 0 0 12px; max-width: 520px; }

  /* ---------- the reading's own age ---------- */
  .readbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise);
    padding: 8px 12px; margin-bottom: 14px;
  }
  .readbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .readbar.down { border-color: var(--warn); background: var(--chip-warn-bg); color: var(--warn); }
  .readbar.down .dot { background: var(--warn); }
  .readbar .why { color: var(--ink-dim); }
  .readbar.down .why { color: var(--warn); opacity: .85; }
  .readbar .spacer { flex: 1; }

  /* ---------- shared atoms (#248) ---------- */
  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .dim-note { font-size: 12px; color: var(--ink-faint); }
  .empty { font-size: 13px; color: var(--ink-dim); padding: 6px 0; }
  /* An unreadable section. It is a fact about the READ, so it is marked. */
  .unread {
    border-left: 3px solid var(--warn); background: var(--chip-warn-bg); color: var(--warn);
    border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 13px; margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
  .dot.attn { background: var(--warn); }
  .dot.off { background: var(--ink-faint); }

  .bar { position: relative; height: 7px; border-radius: 4px; background: var(--bg-inset); overflow: hidden; min-width: 60px; display: inline-block; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink-dim); }
  .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
  .bar .clock { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-faint); }
  .meter-row { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
  .meter-row .lbl { width: 2.2em; flex: none; font-family: ui-monospace, Menlo, monospace; }
  .meter-row .pct { width: 3.4em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- home ---------- */
  .stat-tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .v { font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .tile .l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-top: 2px; }
  .tile.warn { border-color: var(--warn); } .tile.warn .v { color: var(--warn); }
  .tile .v.none { color: var(--ink-faint); }
  .home-verdict { display: grid; grid-template-columns: 190px 1fr; gap: 28px; align-items: center; margin: 6px 0 20px; }
  .verdict-ring { width: 172px; height: 172px; border: 3px solid var(--line); border-top-color: var(--warn); border-radius: 50%; display: grid; place-items: center; text-align: center; }
  .verdict-ring .v { display: block; font: 700 42px ui-monospace, Menlo, monospace; color: var(--warn); }
  .verdict-ring .k { display: block; color: var(--ink-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .home-glance { display: grid; grid-template-columns: repeat(3, minmax(100px, 1fr)); gap: 18px; }
  .home-glance .v { font: 700 22px ui-monospace, Menlo, monospace; }
  .home-glance .k { color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .home-map { padding: 8px 0; }
  .home-map .line { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; }
  .home-map .track { height: 6px; background: var(--bg-inset); border-radius: 5px; margin-top: 6px; overflow: hidden; }
  .home-map .track i { display: block; height: 100%; background: var(--accent); }
  @media (max-width: 620px) {
    .home-verdict { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .home-glance { width: 100%; }
  }

  .split-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 22px; align-items: start; margin-top: 16px; }
  .split-cols > div { min-width: 0; }
  @media (max-width: 900px) { .split-cols { grid-template-columns: 1fr; } }
  .h-sect { margin: 16px 0; }
  .h-sect:first-child { margin-top: 0; }
  .h-sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 700; }
  .h-sect > h3 .hot { color: var(--warn); }
  .h-sect .more { display: block; margin-top: 8px; font-size: 12.5px; }

  .att-item { border-left: 3px solid var(--warn); background: var(--chip-warn-bg); border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 13px; margin-bottom: 8px; }
  .att-item .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; margin-right: 8px; }
  .att-item .dim { color: var(--ink-dim); font-size: 12px; }
  .att-item .opts { margin-top: 5px; font-size: 12.5px; color: var(--ink-dim); }
  .att-item.gate { border-left-color: var(--accent); background: var(--chip-ok-bg); }
  .att-item.limit { border-left-color: var(--bad); background: var(--chip-bad-bg); }
  .need-rank.compact .att-item { padding: 6px 10px; background: transparent; border-left-color: var(--line); color: var(--ink-dim); }
  .need-rank.compact .att-item .diff, .need-rank.compact .att-item .act-row, .need-rank.compact .att-item .opts { display: none; }
  .need-rank.aged .att-item { border-left-color: var(--warn); }
  .need-rank .need-why { font-size: 11.5px; color: var(--ink-dim); padding: 0 0 2px 4px; }
  .need-rank.aged .need-why { color: var(--warn); }
  /* The handoff sheet (#718): a bottom sheet on the phone, a centered dialog
     on the desktop. Its rows are landings, not answers, so they are plain. */
  .handoff-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
  .handoff { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg-raise); box-shadow: var(--shadow); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
  @media (min-width: 900px) { .handoff { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: 520px; border-radius: 14px; border: 1px solid var(--line); } }
  .handoff-head { font-size: 15px; }
  .handoff-list { display: grid; gap: 6px; }
  .handoff-item { text-align: left; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .handoff-item.aged { border-left-color: var(--warn); }
  .handoff-item .rank { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); }
  /* A credential that is dying reads as bad, not as a warning: nothing on this
     page fixes it, and an agent meets it as a failed first `gh` call (#380). */
  .att-item.token { border-left-color: var(--bad); background: var(--chip-bad-bg); }
  /* #642: the one-time code, sized for the phone this is read on. Wide letter
     spacing because the operator retypes it into another device by eye, and
     `83CC-A4ZTO` is four characters that all rhyme at 13px. */
  .reauth-code { display: inline-block; margin-top: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 22px; font-weight: 700; letter-spacing: 3px; user-select: all; }

  /* ---------- credentials (#661, on the shape the #645 prototype settled) ----
     One row per consumer, and the live login as a PANEL above the table. The
     login is a flow with a clock on it — a countdown, a link, a code to read or
     to type, and a fallback — and a table row carrying all four is a panel that
     has not admitted it yet. */
  table.creds { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg-raise); }
  table.creds th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-faint); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.creds td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.creds tr:last-child td { border-bottom: 0; }
  table.creds .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  table.creds .why { color: var(--ink-dim); font-size: 12px; }
  .chip { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.ok { background: var(--chip-ok-bg); color: var(--ok); }
  .chip.bad { background: var(--chip-bad-bg); color: var(--bad); }
  .chip.idle { background: var(--bg-inset); color: var(--ink-faint); }
  .chip.warn { background: var(--chip-warn-bg); color: var(--warn); }

  /* A held lane is BAD, not warn, and not the `.unread` marking: nothing here
     is a fact about the read. One lane has stopped dispatching and every agent
     on it is frozen, which is the worst thing this page ever has to say. */
  .lane-held {
    border-left: 3px solid var(--bad); background: var(--chip-bad-bg);
    border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 13px; margin-bottom: 10px;
  }

  .flow { border: 1px solid var(--accent); background: var(--chip-ok-bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  /* The scrape missed. Warn and not bad: nothing is broken, curia just could
     not read somebody else's wording, and the terminal below still works. */
  .flow.blind { border-color: var(--warn); background: var(--chip-warn-bg); }
  .flow h3 { font-size: 15px; margin: 8px 0; }
  .flow-step { display: flex; gap: 11px; align-items: flex-start; margin-bottom: 11px; }
  .flow-step .n {
    flex: none; width: 21px; height: 21px; border-radius: 50%; background: var(--accent);
    color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }
  .flow-link { display: inline-block; margin-top: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .flow-fall { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 9px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; font-size: 12.5px; }
  .flow-fall .dim { color: var(--ink-dim); font-size: 12px; }

  /* FOUND BY LOOKING, NOT BY REASONING (#645 finding 6). At 390px the six-column
     table did not wrap — it overflowed, and the column it pushed off the screen
     was the one holding the one button. So the Sign-in press was unreachable at
     the alarm, on the device the whole no-ssh requirement exists for.

     Below 640px every row restacks as a card: the consumer and its state first,
     the rest labelled by the header the row no longer has, and the action full
     width at the bottom where a thumb is. */
  @media (max-width: 640px) {
    table.creds, table.creds tbody, table.creds tr, table.creds td { display: block; width: 100%; }
    table.creds thead { display: none; }
    table.creds tr { border-bottom: 1px solid var(--line); padding: 12px; }
    table.creds tr:last-child { border-bottom: 0; }
    table.creds td { border: 0; padding: 2px 0; }
    table.creds td.c-who { font-size: 15px; margin-bottom: 4px; }
    table.creds td[data-label]::before {
      content: attr(data-label) " ";
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--ink-faint); font-weight: 700; margin-right: 6px;
    }
    table.creds td.c-act { margin-top: 10px; }
    table.creds td.c-act .btn { display: block; width: 100%; padding: 13px; font-size: 15px; }
  }

  /* The pre-emptive hold (#384). It sits at the top of Home, above everything,
     because it explains a box that looks idle and is not: curia is dispatching
     nothing on that provider on purpose. Warn and not bad — nothing is broken,
     and it lifts on its own clock. */
  .hold-banner {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    border: 1px solid var(--warn); background: var(--chip-warn-bg); border-radius: 9px;
    padding: 9px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .hold-banner .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .hold-banner .dim { color: var(--ink-dim); font-size: 12px; }
  /* The spent window (#677). The same shape as the hold above it and a harder
     color: the hold is curia choosing to wait, and this is the account
     refusing. */
  .spent-banner { border-color: var(--bad); background: var(--chip-bad-bg); }

  .prov-strip { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 12px; color: var(--ink-dim); }
  .prov { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .prov > b { font-family: ui-monospace, Menlo, monospace; color: var(--ink); font-size: 12.5px; }
  .prov .meter-row .bar { flex: none; width: 76px; }
  .prov .pnote { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .prov .pnote.hot { color: var(--bad); }

  /* ---------- tables ---------- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; }
  table.agents { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg-raise); }
  table.agents.wide { min-width: 760px; }
  table.agents.narrow { min-width: 520px; }
  table.agents th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.agents td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.agents tr:last-child td { border-bottom: 0; }
  table.agents .sess { font-family: ui-monospace, Menlo, monospace; font-weight: 700; white-space: nowrap; }
  table.agents .t { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-right: 6px; }
  table.agents .state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  table.agents .over { color: var(--warn); }
  .esc-row td { background: var(--chip-warn-bg); }
  .statusbar { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 14px; font-family: ui-monospace, Menlo, monospace; flex-wrap: wrap; }
  .agent-focus { display: grid; grid-template-columns: minmax(260px, 5fr) minmax(320px, 7fr); gap: 0 48px; align-items: start; }
  .agent-roster .agent-pick { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; padding: 11px 6px; }
  .agent-roster .agent-pick.on { border-left: 3px solid var(--accent); padding-left: 10px; background: var(--bg-raise); }
  .agent-pick .main { flex: 1; min-width: 0; }
  .agent-pick .main b, .agent-pick .main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-pick .main span { color: var(--ink-dim); font-size: 11px; margin-top: 3px; }
  .agent-detail { position: sticky; top: 24px; border-left: 1px solid var(--line); padding-left: 28px; }
  .agent-detail .agent-title { font-size: 18px; font-weight: 700; }
  .agent-detail .state-line { margin-top: 8px; color: var(--ink-dim); }
  .agent-detail .state-line .needs { color: var(--warn); font-weight: 700; }
  .agent-meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)); gap: 16px; margin: 20px 0; }
  .agent-meters .v { font: 700 16px ui-monospace, Menlo, monospace; }
  .agent-meters .k { color: var(--ink-faint); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
  .agent-story { margin-top: 20px; }
  .agent-story .line { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .agent-story time { color: var(--ink-faint); }
  .agent-ended { grid-column: 1; margin-top: 24px; }
  .agent-ended .line { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; font-size: 12px; color: var(--ink-dim); padding: 6px 0; border-bottom: 1px solid var(--line); }
  .agent-ended time { color: var(--ink-faint); }
  .agent-pick .num { color: var(--ink-faint); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .agent-pick.need { background: var(--chip-warn-bg); }
  .agent-meters .v.hot, .statusbar .hot { color: var(--warn); }
  .agent-back, .agent-roster .phone-hint { display: none; }
  @media (max-width: 800px) {
    .agent-focus { grid-template-columns: 1fr; }
    .agent-detail { position: static; border-left: 0; padding: 0; }
    .agent-back { display: inline-block; margin: 2px 0 16px; font-size: 13.5px; }
    .agent-roster .phone-hint { display: block; margin-top: 10px; font-size: 11px; }
    /* The route decides which half the phone shows (#709), the same way the
       drill frame and Maps do. */
    .agent-focus[data-open] .agent-roster, .agent-focus[data-open] .agent-ended { display: none; }
    .agent-focus:not([data-open]) .agent-detail { display: none; }
  }

  /* ---------- feed ---------- */
  .feed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed-list li { display: grid; grid-template-columns: 3.9em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed-list li:last-child { border-bottom: 0; }
  .feed-list time { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding-top: 1px; }
  .feed-list .ev b { font-weight: 600; }
  .feed-list .tag { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-dim); }
  .feed-list li.warn .tag { color: var(--warn); }
  .feed-list li.bad .tag { color: var(--bad); }
  .feed-density { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 34px; align-items: end; margin: 10px 0 6px; }
  .density-cell { min-height: 3px; border-radius: 2px; background: var(--line); }
  .density-cell.active { background: var(--accent); }
  .feed-wire { max-width: 760px; }
  .feed-pulse { display: flex; align-items: flex-end; gap: 14px; margin-top: 10px; }
  .feed-pulse .k { flex: none; font: 10px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); padding-bottom: 2px; }
  .feed-pulse .feed-density { flex: 1; margin: 0; }
  .feed-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .feed-chip { border: 1px solid var(--line); background: none; color: var(--ink-dim); border-radius: 999px; padding: 4px 10px; font: 600 10px ui-monospace, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .feed-chip.on { color: var(--ink); border-color: var(--ink-dim); background: var(--bg-raise); }
  .feed-news .l2 { font: 11px ui-monospace, Menlo, monospace; color: var(--ink-faint); margin-top: 3px; }
  .feed-news.ok { border-left: 2px solid var(--ok); padding-left: 12px; margin-left: -14px; }
  .feed-news.bad { border-left: 2px solid var(--bad); padding-left: 12px; margin-left: -14px; }
  .feed-news.warn:not(.needs) { border-left: 2px solid var(--warn); padding-left: 12px; margin-left: -14px; }
  .feed-fold { padding: 2px 0; }
  .feed-fold summary { cursor: pointer; color: var(--ink-faint); font: 11px ui-monospace, Menlo, monospace; padding: 5px 0 5px 60px; list-style: none; }
  .feed-fold summary::before { content: "▸ "; }
  .feed-fold[open] summary::before { content: "▾ "; }
  .feed-news { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .feed-news.needs { background: var(--chip-warn-bg); margin: 0 -10px; padding: 13px 10px; }
  .feed-news.focus, .feed-mechanic.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .feed-news time, .feed-mechanic time { color: var(--ink-faint); font: 11px ui-monospace, Menlo, monospace; }
  .feed-news .story { font-size: 13px; }
  .feed-news .word { display: block; color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .feed-news.needs .word { color: var(--warn); font-weight: 700; }
  .feed-mechanic { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 4px 0; color: var(--ink-faint); font-size: 11px; }
  .since-marker { color: var(--warn); font: 700 10px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; border-top: 1px solid var(--warn); padding-top: 5px; margin: 10px 0; }
  .legacy-feed { margin-top: 24px; color: var(--ink-faint); }

  /* ---------- the start control and level two ---------- */
  select {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }
  /* Level two of a takeable row on Maps (#768): what the ticket directly unblocks. */
  .fr-kids { margin: 0 0 10px 14px; padding-left: 14px; border-left: 1px dashed var(--line); }
  .fr-kid { position: relative; margin-top: 6px; font-size: 12.5px; color: var(--ink-dim); }
  .fr-kid::before { content: "└─"; position: absolute; left: -16px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .fr-kid .t { font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }

  /* ---------- maps ---------- */
  .map-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .map-filter button { border: 1px solid var(--line); border-radius: 999px; background: var(--bg-raise); color: var(--ink-dim); padding: 4px 12px; font-size: 12px; }
  .map-filter button.on { border-color: var(--accent); color: var(--accent); }
  .map-layout { display: grid; grid-template-columns: minmax(340px, 370px) minmax(420px, 1fr); gap: 0 42px; align-items: start; }
  .map-cards { position: sticky; top: 18px; padding-right: 20px; border-right: 1px solid var(--line); }
  .map-card { margin-top: 8px; padding: 14px 13px 12px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
  .map-card:first-child { margin-top: 0; }
  .map-card:hover { background: var(--bg-raise); }
  .map-card.on { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--bg-raise); box-shadow: inset 3px 0 var(--accent); }
  .map-head { display: flex; gap: 16px; align-items: center; }
  .map-fraction { flex: none; font: 700 23px ui-monospace, Menlo, monospace; }
  .map-fraction .total, .map-fraction .fog-count { color: var(--ink-dim); font-weight: 400; }
  .map-fraction .fog-count { font-size: 14px; }
  .map-title { min-width: 0; }
  .map-title b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-title .meta { display: block; color: var(--ink-faint); font: 10px ui-monospace, Menlo, monospace; margin-top: 4px; }
  .map-band { display: grid; gap: 0; margin-top: 11px; height: 25px; }
  .map-seg { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; padding: 3px; font: 700 9px ui-monospace, Menlo, monospace; }
  .map-seg + .map-seg { border-left: 3px solid var(--bg); }
  .map-seg span { display: none; }
  .map-seg.walked { color: var(--map-done-ink); background: var(--map-done-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--map-done-ink) 16%, transparent); }
  .map-seg.in-flight { color: var(--map-run-ink); background: var(--map-run-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--map-run-line) 40%, transparent); }
  .map-seg.in-flight::before { content: ""; position: absolute; inset: 0; transform: translateX(-110%); background: linear-gradient(100deg, transparent 25%, color-mix(in srgb, var(--map-run-line) 28%, transparent) 48%, transparent 72%); animation: map-working 3.1s ease-in-out infinite; }
  .map-seg.in-flight.needs::after { content: "!"; position: absolute; right: 4px; top: 3px; display: grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; background: var(--warn); color: var(--accent-ink); font-size: 9px; }
  .map-seg.takeable { color: var(--accent); background: var(--map-front-bg); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 72%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 8%, transparent); }
  .map-seg.blocked { color: color-mix(in srgb, var(--bad) 70%, var(--ink-dim)); background-color: color-mix(in srgb, var(--bad) 5%, var(--bg)); background-image: repeating-linear-gradient(0deg, transparent 0 8px, color-mix(in srgb, var(--bad) 25%, transparent) 8px 10px); }
  .map-seg.fog { color: var(--ink-dim); background: repeating-linear-gradient(45deg, var(--map-fog-a) 0 8px, var(--map-fog-b) 8px 16px); }
  .map-band-hero { height: 56px; margin: 0 0 30px; }
  .map-band-hero .map-seg { border-radius: 5px; font-size: 11px; }
  .map-band-hero .map-seg span { display: block; margin-left: 6px; font-size: 9px; font-weight: 500; }
  @keyframes map-working { 0%, 22% { transform: translateX(-110%); } 72%, 100% { transform: translateX(110%); } }
  .map-detail { position: sticky; top: 24px; }
  .map-detail h3 { color: var(--ink-faint); font: 600 10px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 16px; }
  .map-rail { position: relative; padding-left: 30px; }
  .map-rail::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 2px; background: var(--line); }
  .map-stage { position: relative; padding: 0 0 24px 18px; }
  .map-stage:last-child { padding-bottom: 0; }
  .map-stage::before { content: ""; position: absolute; left: -28px; top: 4px; z-index: 1; width: 13px; height: 13px; border: 3px solid var(--stage); border-radius: 50%; background: var(--bg); }
  .map-stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .map-stage-head b { color: var(--stage); font: 700 11px ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
  .map-stage-status { display: flex; align-items: center; justify-content: flex-end; gap: 8px; color: var(--ink-dim); font: 11px ui-monospace, Menlo, monospace; }
  .activity { display: inline-flex; align-items: center; gap: 6px; color: var(--map-run-line); }
  .activity::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--map-run-line); box-shadow: 0 0 0 0 color-mix(in srgb, var(--map-run-line) 40%, transparent); animation: map-online 2s ease-out infinite; }
  .needs-badge { border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 999px; padding: 2px 7px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--bg)); font: 700 9px ui-monospace, Menlo, monospace; text-transform: uppercase; }
  @keyframes map-online { 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  .map-stage.walked { opacity: .72; }
  .map-stage.takeable { margin: 2px 0 24px; padding: 13px 14px 15px 18px; border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .map-stage.takeable::before { left: -28px; }
  .map-detail-list { padding-left: 0; }
  .map-detail-row { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .map-detail-row:last-child { border-bottom: 0; }
  .map-detail-row .sub { display: block; color: var(--ink-dim); font-size: 11px; margin-top: 4px; }
  .frontier-ticket { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: stretch; min-height: 76px; padding: 12px 0; }
  .frontier-copy { min-width: 0; }
  .frontier-meta { display: block; margin-top: 7px; color: var(--ink-dim); font: 10px ui-monospace, Menlo, monospace; }
  .frontier-ticket .map-start { margin: 0; align-self: stretch; }
  .frontier-ticket .map-start .btn { min-width: 68px; height: 100%; }
  .map-stage.in-flight .map-detail-row { border-left: 2px solid var(--map-run-line); padding-left: 9px; }
  .map-stage.blocked .map-detail-list { padding: 4px 14px; border: 1px solid color-mix(in srgb, var(--bad) 24%, var(--line)); border-radius: 8px; background: repeating-linear-gradient(0deg, transparent 0 8px, color-mix(in srgb, var(--bad) 9%, transparent) 8px 10px); }
  .map-stage.blocked .map-detail-row { border-bottom-color: color-mix(in srgb, var(--bad) 20%, var(--line)); opacity: .78; }
  .map-stage.fog { opacity: .68; }
  .map-stage.fog .map-detail-list { padding: 4px 14px; border: 1px solid var(--line); border-radius: 8px; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--line) 65%, transparent) 0 8px, transparent 8px 16px); }
  .map-back { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .map-seg.in-flight::before, .activity::before { animation: none; }
  }
  @media (max-width: 900px) {
    .map-layout { grid-template-columns: 1fr; }
    .map-cards { position: static; padding-right: 0; border-right: 0; }
    .map-card { margin-top: 8px; }
    /* The phone's half of the split is a ROUTE (#700): the detail is its own
       hash, so it opens over the list and the browser's back leaves it. Both
       halves are always rendered and this decides which the width shows —
       nothing in the script measures a viewport. */
    .map-detail { display: none; }
    .map-layout[data-open] .map-cards { display: none; }
    .map-layout[data-open] .map-detail { display: block; position: static; margin-top: 8px; }
    .map-back { display: inline-block; margin-bottom: 10px; color: var(--ink-dim); font-size: 12px; }
  }

  /* ---------- settings (#265, on the #248 look) ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--bg-raise); color: var(--ink);
    border-radius: 7px; padding: 6px 14px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  /* The restart where it is the mitigation (#362): a save the daemon declined,
     and the Maintenance button while the daemon and the files disagree. */
  .btn.restart-hot { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: default; }

  input[type=text], input[type=number] {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }
  input[type=number] { width: 5.5em; }
  input[type=checkbox] { accent-color: var(--accent); }

  .model-mgr { margin-top: 6px; }
  .model-mgr .row.inactive .key { color: var(--ink-faint); }
  .gh-connect { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 10px; flex-wrap: wrap; }

  /* ---------- the save dock (#699, on the #525 decision) ----------
     A clean screen carries NO save chrome. The dock rises on the first edit,
     sticks to the bottom of the screen, and every outcome speaks in that same
     place: unsaved, saved, declined, refused, offline. A button appears only
     where it is the mitigation. */
  .dock {
    position: sticky; bottom: 14px; z-index: 6; width: max-content; max-width: 100%;
    margin: 26px auto 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--bg-raise); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; box-shadow: var(--shadow);
  }
  .dock.saved { border-color: var(--ok); }
  .dock.refused { border-color: var(--bad); background: var(--chip-bad-bg); }
  .dock .toast { font-size: 12.5px; color: var(--ink-dim); }
  .dock .toast.bad { color: var(--bad); }
  .dock .ok-word { font: 600 12.5px ui-monospace, Menlo, monospace; color: var(--ok); }
  .dock .why { flex-basis: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-dim); }
  .dock.refused .why { color: var(--bad); }

<script>
/* The console's own code. One classic script, no build step and no module
   boundary: the file on disk is the reviewed source and the served page at once.
   Its test drives these same functions in a vm, which is why the screens take
   the payload as an ARGUMENT and the page state sits on one plain object —
   nothing here reads a global the test cannot set. */

/* Every screen this shell carries. The four read screens are #264; the two
   named tickets below draw their own. */
const SCREENS = {
  home:     ["Home",     screenHome],
  maps:     ["Maps",     screenMaps],
  agents:   ["Agents",   screenAgents],
  feed:     ["Feed",     screenFeed],
  chat:     ["Chat",     screenChat],

     read most of the time and acted on rarely — and because the one act it

     which map the complete detail rail shows, and whether the phone is on that
     detail instead of the list. `open` is the route's, never a width's. */
  maps: { repo: "all", selected: null, open: false },
  /* Which agent the detail half shows, and whether the phone is on it (#709).
     `open` is the route's, never a width's. */
  agents: { selected: null, open: false },
  feed: { lastRead: null, operator: null, focus: null, family: "all" },
  search: { open: false, q: "", loading: false, error: null, result: null },
  /* The settings screen's own state (#265). `phase` is what the banner says:
     clean and dirty before a save, then the three outcomes a save can have
     (#362) — applied, declined, offline — plus the three that interrupt them:
     restarting, refused, unread. */
  set: { models: false, phase: "clean", error: null, busy: false, note: null },
  /* The drill-in frame's own state (#699), one entry per page that is a list
     of sections: which section is open, and whether the phone is on the list
     in front of it. */
  drill: {},
  /* Which `?` explanations are open, by row id. Page-wide, because the frame
     hands the same affordance to every section on every page. */
  hints: {},
  /* The operator verbs (#266). `said` is what curia answered, shown at the
     control that asked. In-flight bookkeeping lives in the Action map below.
     `note` and `tele` name the agent whose box is open, and `mode` is the
     delivery ADR-0013 defaults to. */

    /* The handoff sheet (#718): the id of the item the operator just answered,
       or null when no sheet is up. The sheet draws nothing of its own — it
       reads the same `attentionItems` Home reads, minus this one id. */
    handoff: null },

var reachable = true; /* is the SIDECAR itself answering — a different fact from daemon_up */
var settings = null;  /* the last read of curia.yaml + routing.yaml off disk */
var draft = null;     /* the same, with the operator's unsaved edits on it */
var repos = null;     /* the watchable repos, read through the daemon on demand */
var conversations = null; /* the browser conversations (#333), read on the Chat screen only */
var aistack = null;   /* the aistack registration and sync verdict (#706), read on that section only */

/* Browser-local Action bookkeeping (#804). This map is the seam shared by
   controls. It owns identity, conflict reservations, and evidence ordering.
   Callers still own their projection, words, request, and reconciliation. */
var actions = new Map(); /* action_id -> the latest visible Action */
const TERMINAL_ACTION = new Set(["confirmed", "refused", "failed"]);
const SHARED_ACTION = new Set(["accepted", "progress", ...TERMINAL_ACTION]);

function beginAction(action) {
  const actionId = String(action?.action_id ?? "");
  const conflictKey = String(action?.conflict_key ?? "");
  const target = String(action?.target ?? "");
  if (!actionId || !conflictKey || !target || !String(action?.kind ?? "")) return null;
  if (actions.has(actionId) || actionFor({ conflict_key: conflictKey })) return null;
  const pending = { ...action, action_id: actionId, conflict_key: conflictKey, target, status: "pending", revision: null };
  actions.set(actionId, pending);
  return pending;
}

function observeActions(observed) {
  for (const evidence of observed ?? []) {
    const actionId = String(evidence?.action_id ?? "");
    const revision = Number(evidence?.revision);
    if (!actionId || !SHARED_ACTION.has(evidence?.status) || !Number.isFinite(revision)) continue;
    const prior = actions.get(actionId);
    if (!prior) {

      if (!String(evidence.kind ?? "") || !String(evidence.target ?? "") || !String(evidence.conflict_key ?? "")) continue;
      actions.set(actionId, { ...evidence, action_id: actionId, revision });
      continue;
    }
    if (TERMINAL_ACTION.has(prior.status)) continue;
    if (prior.revision != null && revision <= prior.revision) continue;
    actions.set(actionId, { ...prior, ...evidence, action_id: actionId, revision });

function actionFor({ action_id: actionId = null, target = null, conflict_key: conflictKey = null } = {}) {
  if (actionId != null) return actions.get(String(actionId)) ?? null;
  const matches = [...actions.values()].filter((action) =>
    (target != null && action.target === String(target))
      || (conflictKey != null && action.conflict_key === String(conflictKey)));
  return matches.sort((a, b) => Number(b.revision ?? -1) - Number(a.revision ?? -1))[0] ?? null;

function finishAction(actionId) {
  return actions.delete(String(actionId));
}

let localActionSequence = 0;
function beginLocalAction(key) {
  const actionId = `atlas-${Date.now().toString(36)}-${(++localActionSequence).toString(36)}`;
  return beginAction({ action_id: actionId, kind: "browser", target: key, conflict_key: key });

/* ---- words ---------------------------------------------------------------- */

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

  if (s == null) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";

/* How many things want the operator. The nav badge, the tab title and the tile
   read one function, so they can never disagree. Usage limits are NOT counted:
   a spent window is on the attention list because it explains a slow box, but
   nobody can answer it.

   A credential warning IS counted (#380). The test is whether an operator act
   ends it, which is exactly what separates it from a spent window: a window
   rolls on its own clock, and a token that nobody mints stays dead and takes
   every agent's first `gh` call with it. So the badge stays hot until the act
   happens, which is the whole point of moving this off a log line. */
/* A MODEL CREDENTIAL IS COUNTED SINCE #661, and it was the one failure most in
   need of a hot badge: nothing rolls it on a clock, one lane stops dispatching,
   and every live agent on that lane freezes mid-ticket. By this function's own
   stated test it is the strongest member of the set, and it was the only member
   missing — so the badge stayed cold at 3am on the worst thing the box can do.

   IT COUNTS POINTERS, NOT CONSUMERS, and that is the loose end #661 was asked to
   pick. Three dead rows behind one provider are one act — a login — reached by
   one visit to one screen, and the list shows exactly one line for them. This
   number and that list must agree on what an item is, or the badge teaches the
   operator that it means less than it says. What the collapse could have hidden
   is not hidden: the pointer names every consumer behind it, and the screen it
   points at states each one's own row.

   A GitHub credential warning IS counted (#380), by the same test — a token
   nobody mints stays dead and takes every agent's first `gh` call with it.

   THE COUNT IS THE LIST, SINCE #677. This used to be its own sum beside
   `attentionList`, and twice the two drifted: once when the credential pointer
   reached the list and not the sum, and once on the spent window, which the
   list carried and the sum did not. Two functions that happen to agree is not
   an invariant. There is one function that yields the items now, and both
   surfaces read it, so a member class cannot be added to one of them alone. */
function needsYou(o) {
  return attentionItems(o).length;
}

/* ---- the operator verbs (#266) ----------------------------------------------

   Every verb is ONE POST to the sidecar, which composes the daemon call from
   the fields sent here. This page never sends a command line: it names a repo,
   a ticket, an escalation id or an agent, and the sidecar builds the rest.

   Four rules run through all of them.

   1. ONE ACT PER CONFLICT. The Action map reserves a control's conflict key,
      so a duplicate starts nothing while unrelated controls remain available.
   2. CURIA'S OWN WORDS ARE THE OUTCOME. A command reply is a sentence the
      daemon composed. It is shown where the press was, as it stands. This page
      never writes its own account of what an act did.
   3. THE READING MOVES AT ONCE. The sidecar drops its snapshot age on every
      verb, so the poll right after a press is a fresh read rather than the held
      one. A button that appears to do nothing for five seconds is a button
      pressed twice.
   4. A REFUSAL IS A FACT. First-valid-wins, an agent that is not running, a
      ticket already claimed: each comes back in words, under the control that
      asked, and none of them is a failure of this page. */

/* The literal answers every surface sends. The daemon classifies the ANSWER
   (lifecycle.mjs classifyReviewAnswer, bridge.mjs #buttons), so this page must
   not teach it a second vocabulary for the same act. */
const APPROVE = "approve";
const REJECT = "reject";
const CROSS_CHECK = "cross-check";
const ALL_AS_RECOMMENDED = "all-as-recommended";

/* A value going into an onclick handler crosses TWO escapings: the HTML
   attribute, and the single-quoted JS string inside it. `esc` answers only the
   first. An escalation option is an agent's own words — the one value on this
   page that can carry a quote — and a bare `esc` would leave it able to close
   that string and open code instead. So the JS escaping runs first and the HTML
   escaping over it. */
const js = (s) => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));

/* Curia speaks Discord markdown everywhere else, and one reply reaching two
   surfaces is the point of the command seam — so the page renders the little of
   it a reply uses rather than asking the daemon for a second wording. */

  return esc(s)
    .replace(/`([^`]+)`/g, (_, x) => `<code>${x}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, x) => `<b>${x}</b>`)
    .replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}">${u}</a>`);

      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(body),
