<!doctype html>
<meta charset="utf-8">
<!-- The console (#263 the shell, #264 the read screens, #265 the settings write,
     #266 the operator verbs), on the look settled by the prototype (#248):
     dark-first tokens, system mono for data, one accent.

     THE STAMP BELOW IS LOAD-BEARING. This page and daemon/src/dashboard.mjs are
     two halves of one protocol, and there is no build step — the file on disk IS
     the reviewed source. A pull that changes both halves with no sidecar restart
     would leave an old server serving a new page, so the page declares what it
     speaks and the server refuses anything else (#70's rule, as timeline.html
     carries it).

     The four read screens draw one payload: `GET /api/overview`, which is the
     sidecar's held snapshot of the daemon's own `GET /overview` (#262). A chat
     (#267) draws nothing: it is the timeline page, served at /chat. What the
     Chat screen draws is the PICKER over the browser conversations (#333), off
     a read of its own — `GET /api/console`, taken on arrival, not on the poll.

     THE VERBS (#266) POST to the sidecar, never to the daemon. It composes each
     daemon call from the fields the page sends, so this page names a ticket, an
     escalation id or an agent — never a command line.

     THE DIFF DIGEST (#355) follows that same seam and is the one read off the
     poll: `GET /api/diff` names an escalation id or an agent, and a file only
     by its place in the digest curia itself measured. Hunks are fetched per
     file, once, when a card is opened.

     TWO RULES RUN THROUGH EVERY SCREEN HERE.

     1. Color marks attention, and nothing else. Warn and bad are spent on an
        open question, the review gate and a spent usage window. A state, a
        ticket type and a repo are told in words.
     2. Null is not empty. An unreadable fleet is not an idle box, and a frontier
        nobody has computed is not an empty frontier. Every section that can fail
        on its own says which of the two it is. -->
<meta name="curia-dashboard" content="proto=5">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curia</title>
<style>
  /* ---------- tokens: dark-first (#248) ---------- */
  :root {
    --bg: #111417; --bg-raise: #191e22; --bg-inset: #0c0f11;
    --line: #262d33; --ink: #dde3e0; --ink-dim: #8a94a6; --ink-faint: #5a6472;
    --accent: #4cc2a0; --accent-ink: #0c1512;
    --warn: #e0a83c; --bad: #d95f57; --ok: #4cc2a0; --idle: #8a94a6;
    --chip-warn-bg: #2b2114; --chip-bad-bg: #2b1715; --chip-ok-bg: #12241f;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
    /* The diff's own two colors (#355) — a patch's vocabulary, not the
       attention marking. Deliberately not --ok/--bad. */
    --diff-add: #6fbf73; --diff-del: #d98b84;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f4f3; --bg-raise: #ffffff; --bg-inset: #e8ebe9;
      --line: #d5dad6; --ink: #1d2420; --ink-dim: #5b6570; --ink-faint: #8b939e;
      --accent: #157a5f; --accent-ink: #f2fdf9;
      --warn: #9a6a10; --bad: #b03a32; --ok: #157a5f; --idle: #5b6570;
      --chip-warn-bg: #f4e8cf; --chip-bad-bg: #f6ddda; --chip-ok-bg: #d9efe7;
      --shadow: 0 6px 24px rgba(30,40,35,.12);
      --diff-add: #1f7a34; --diff-del: #a3352c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .mono, code { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 172px 1fr; min-height: 100vh; }
  .shell nav {
    border-right: 1px solid var(--line); padding: 16px 10px; background: var(--bg-inset);
    display: flex; flex-direction: column; gap: 2px;
  }
  .shell nav .brand { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14px; padding: 0 10px 12px; }
  .shell nav button {
    text-align: left; border: 0; background: none; color: var(--ink-dim);
    padding: 8px 10px; border-radius: 7px; font-size: 13.5px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .shell nav button.on { background: var(--bg-raise); color: var(--ink); font-weight: 600; }
  .shell nav button .n { color: var(--warn); font-weight: 700; }
  .shell main { padding: 18px 22px; min-width: 0; }
  .shell main h2 { font-size: 15px; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .shell nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; align-items: center; }
    .shell nav .brand { padding: 0 10px 0 4px; }
    .shell nav button { flex: none; gap: 6px; }
    .shell main { padding: 14px; }
  }

  /* ---------- the reading's own age ---------- */
  .readbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise);
    padding: 8px 12px; margin-bottom: 14px;
  }
  .readbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .readbar.down { border-color: var(--warn); background: var(--chip-warn-bg); color: var(--warn); }
  .readbar.down .dot { background: var(--warn); }
  .readbar .why { color: var(--ink-dim); }
  .readbar.down .why { color: var(--warn); opacity: .85; }
  .readbar .spacer { flex: 1; }

  /* ---------- shared atoms (#248) ---------- */
  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .dim-note { font-size: 12px; color: var(--ink-faint); }
  .empty { font-size: 13px; color: var(--ink-dim); padding: 6px 0; }
  /* An unreadable section. It is a fact about the READ, so it is marked. */
  .unread {
    border-left: 3px solid var(--warn); background: var(--chip-warn-bg); color: var(--warn);
    border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 13px; margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
  .dot.attn { background: var(--warn); }
  .dot.off { background: var(--ink-faint); }

  .bar { position: relative; height: 7px; border-radius: 4px; background: var(--bg-inset); overflow: hidden; min-width: 60px; display: inline-block; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink-dim); }
  .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
  .bar .clock { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-faint); }
  .meter-row { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
  .meter-row .lbl { width: 2.2em; flex: none; font-family: ui-monospace, Menlo, monospace; }
  .meter-row .pct { width: 3.4em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- home ---------- */
  .stat-tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .v { font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .tile .l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-top: 2px; }
  .tile.warn { border-color: var(--warn); } .tile.warn .v { color: var(--warn); }
  .tile .v.none { color: var(--ink-faint); }

  .split-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 22px; align-items: start; margin-top: 16px; }
  .split-cols > div { min-width: 0; }
  @media (max-width: 900px) { .split-cols { grid-template-columns: 1fr; } }
  .h-sect { margin: 16px 0; }
  .h-sect:first-child { margin-top: 0; }
  .h-sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 700; }
  .h-sect > h3 .hot { color: var(--warn); }
  .h-sect .more { display: block; margin-top: 8px; font-size: 12.5px; }

  .att-item { border-left: 3px solid var(--warn); background: var(--chip-warn-bg); border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 13px; margin-bottom: 8px; }
  .att-item .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; margin-right: 8px; }
  .att-item .dim { color: var(--ink-dim); font-size: 12px; }
  .att-item .opts { margin-top: 5px; font-size: 12.5px; color: var(--ink-dim); }
  .att-item.gate { border-left-color: var(--accent); background: var(--chip-ok-bg); }
  .att-item.limit { border-left-color: var(--bad); background: var(--chip-bad-bg); }
  /* A credential that is dying reads as bad, not as a warning: nothing on this
     page fixes it, and an agent meets it as a failed first `gh` call (#380). */
  .att-item.token { border-left-color: var(--bad); background: var(--chip-bad-bg); }

  /* The pre-emptive hold (#384). It sits at the top of Home, above everything,
     because it explains a box that looks idle and is not: curia is dispatching
     nothing on that provider on purpose. Warn and not bad — nothing is broken,
     and it lifts on its own clock. */
  .hold-banner {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    border: 1px solid var(--warn); background: var(--chip-warn-bg); border-radius: 9px;
    padding: 9px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .hold-banner .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .hold-banner .dim { color: var(--ink-dim); font-size: 12px; }

  .prov-strip { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; margin-top: 14px; font-size: 12px; color: var(--ink-dim); }
  .prov { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .prov > b { font-family: ui-monospace, Menlo, monospace; color: var(--ink); font-size: 12.5px; }
  .prov .meter-row .bar { flex: none; width: 76px; }
  .prov .pnote { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .prov .pnote.hot { color: var(--bad); }

  /* ---------- tables ---------- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; }
  table.agents { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg-raise); }
  table.agents.wide { min-width: 760px; }
  table.agents.narrow { min-width: 520px; }
  table.agents th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.agents td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.agents tr:last-child td { border-bottom: 0; }
  table.agents .sess { font-family: ui-monospace, Menlo, monospace; font-weight: 700; white-space: nowrap; }
  table.agents .t { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-right: 6px; }
  table.agents .state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  table.agents .over { color: var(--warn); }
  .esc-row td { background: var(--chip-warn-bg); }
  .statusbar { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 14px; font-family: ui-monospace, Menlo, monospace; flex-wrap: wrap; }

  /* ---------- feed ---------- */
  .feed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed-list li { display: grid; grid-template-columns: 3.9em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed-list li:last-child { border-bottom: 0; }
  .feed-list time { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding-top: 1px; }
  .feed-list .ev b { font-weight: 600; }
  .feed-list .tag { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-dim); }
  .feed-list li.warn .tag { color: var(--warn); }
  .feed-list li.bad .tag { color: var(--bad); }

  /* ---------- frontier ---------- */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg-raise); }
  .seg button { border: 0; background: none; color: var(--ink-dim); padding: 5px 12px; font-size: 12.5px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .frx-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .frx-filter .fchip { border: 1px solid var(--line); border-radius: 999px; background: var(--bg-raise); color: var(--ink-dim); padding: 3px 12px; font-size: 12.5px; }
  .frx-filter .fchip.on { border-color: var(--accent); color: var(--accent); background: var(--chip-ok-bg); font-weight: 600; }
  .frx-filter select { padding: 3px 8px; }
  .frx-filter .sep { color: var(--ink-faint); }
  select {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }
  .frx-sect { margin: 4px 0 18px; }
  .frx-sect > .eyebrow { display: block; margin-bottom: 8px; }
  .frx-big { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .frx-card {
    border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px;
    background: var(--bg-raise); padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px;
  }
  .frx-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .frx-card .t { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--accent); }
  .frx-card .typ { font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .frx-card .title { font-size: 13.5px; font-weight: 600; }
  .frx-card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace; flex-wrap: wrap; }
  .frx-dim { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .frx-dimcard { border: 1px solid var(--line); border-radius: 8px; background: var(--bg-inset); padding: 8px 11px; font-size: 12.5px; color: var(--ink-dim); }
  .frx-dimcard .t { font-family: ui-monospace, Menlo, monospace; margin-right: 5px; }
  .frx-dimcard .from { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .fr-repo { margin-bottom: 14px; }
  .fr-repo > .eyebrow { margin-bottom: 6px; display: block; }
  .fr-group { margin-bottom: 10px; }
  .fr-node { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--bg-raise); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
  .fr-node .t { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-right: 6px; }
  .fr-node .typ { float: right; font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; margin-left: 8px; }
  .fr-kids { margin: 0 0 10px 14px; padding-left: 14px; border-left: 1px dashed var(--line); }
  .fr-kid { position: relative; margin-top: 6px; font-size: 12.5px; color: var(--ink-dim); }
  .fr-kid::before { content: "└─"; position: absolute; left: -16px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .fr-kid .t { font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }

  /* ---------- settings (#265, on the #248 look) ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--bg-raise); color: var(--ink);
    border-radius: 7px; padding: 6px 14px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  /* The restart where it is the mitigation (#362): a save the daemon declined,
     and the Maintenance button while the daemon and the files disagree. */
  .btn.restart-hot { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: default; }

  input[type=text], input[type=number] {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }
  input[type=number] { width: 5.5em; }
  input[type=checkbox] { accent-color: var(--accent); }

  .set-subnav { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .set-subnav button { border: 0; background: none; color: var(--ink-dim); padding: 7px 14px; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .set-subnav button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .set-block { border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); padding: 12px 14px; }
  .set-block h3 { font-size: 13px; margin-bottom: 8px; }
  .set-block .hint { font-size: 12px; color: var(--ink-dim); margin: 0 0 10px; }
  .set-block table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .set-block td, .set-block th { padding: 5px 8px 5px 0; text-align: left; vertical-align: middle; }
  .set-block th { color: var(--ink-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .set-block tr.inactive td { color: var(--ink-faint); }
  .set-block .right { text-align: right; }
  .model-mgr { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .gh-connect { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 10px; flex-wrap: wrap; }

  /* The banner sits at the TOP and states one act (#248, collapsed by #362):
     the save, and what the daemon did with it. */
  .save-banner {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--bg-raise); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 14px; margin-bottom: 14px;
  }
  .save-banner.saved { border-color: var(--accent); background: var(--chip-ok-bg); }
  .save-banner.refused { border-color: var(--bad); background: var(--chip-bad-bg); }
  .save-banner .toast { font-size: 12.5px; color: var(--ink-dim); }
  .save-banner.saved .toast { color: var(--ok); }
  .save-banner.refused .toast { color: var(--bad); }
  .save-banner .toast.why { font-family: ui-monospace, Menlo, monospace; font-size: 12px; flex-basis: 100%; }

  /* ---------- the operator verbs (#266, on the #248 shapes) ----------
     No new color. A verb sits inside the card that already carries the fact it
     acts on, so the attention marking around it is the marking rule's, not a
     second one this section invents. */
  .act-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .act-row input[type=text] { flex: 1; min-width: 130px; }
  .act-box { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-inset); padding: 9px 11px; }
  .act-box label { font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 5px; }
  .act-box .act-row:first-child { margin-top: 0; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; align-items: baseline; }
  .links button {
    color: var(--accent); background: none; border: 0; padding: 0;
    font-size: 12px; text-decoration: none;
  }
  .links button:hover { text-decoration: underline; }
  .links button.bad { color: var(--bad); }
  .links button[disabled] { color: var(--ink-faint); cursor: default; text-decoration: none; }
  /* What curia said back about the press. It is curia's OWN sentence, so it
     sits where the press was rather than becoming a banner somewhere else. */
  .said { margin-top: 7px; font-size: 12.5px; border-left: 3px solid var(--line); padding: 3px 0 3px 9px; white-space: pre-wrap; color: var(--ink-dim); }
  .said.bad { border-left-color: var(--bad); color: var(--bad); }
  .said code { background: var(--bg-inset); border-radius: 4px; padding: 0 4px; }
  .said a { word-break: break-all; }
  .copy { width: 100%; font: 12px ui-monospace, Menlo, monospace; }

  /* ---------- the diff digest (#355, on #343's Diff-then-ship) ----------
     Green and red here are NOT the attention marking. They are the diff's own
     two-hundred-year-old vocabulary, and a reader who has ever seen a patch
     reads them without a legend — so they stay off the warn/bad tokens that
     mean "this wants you", and take their own dimmer pair. */
  .diff { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-inset); overflow: hidden; }
  .diff-sum { padding: 8px 11px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .diff-rule { padding: 6px 11px; font-size: 11.5px; color: var(--ink-faint); border-bottom: 1px solid var(--line); }
  .diff-file { border-bottom: 1px solid var(--line); }
  .diff-file:last-child { border-bottom: 0; }
  .diff-row {
    display: flex; width: 100%; gap: 10px; align-items: baseline; justify-content: space-between;
    background: none; border: 0; padding: 7px 11px 2px; color: var(--ink);
    font: inherit; text-align: left; cursor: pointer;
  }
  .diff-row:hover { background: var(--bg-raise); }
  .diff-row .path { font-size: 12.5px; word-break: break-all; }
  .diff-row .nums { white-space: nowrap; font-size: 12px; }
  .diff .cap { padding: 0 11px 7px; font-size: 11.5px; color: var(--ink-faint); }
  .diff .say { padding: 0 11px 9px; font-size: 12px; color: var(--ink-dim); }
  .diff .say a { word-break: break-all; }
  .add { color: var(--diff-add); }
  .del { color: var(--diff-del); }
  pre.hunks {
    margin: 0; padding: 8px 11px; overflow-x: auto; background: var(--bg);
    border-top: 1px solid var(--line); font-size: 11.5px; line-height: 1.4;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  pre.hunks .hl { display: block; white-space: pre; }
  pre.hunks .hl.add { color: var(--diff-add); }
  pre.hunks .hl.del { color: var(--diff-del); }
  pre.hunks .hl.at { color: var(--accent); }
  pre.hunks .hl.meta { color: var(--ink-faint); }

  /* ---------- the chat (#267) ----------
     A door, not a room: the chat itself is the timeline page, served under this
     surface's own address. Nothing here draws a message. */
  .door { max-width: 620px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); padding: 14px 16px; }
  .door p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-dim); }
  .door p.lead { color: var(--ink); }
  .door a.btn { display: inline-block; text-decoration: none; }
  .door a.btn:hover { text-decoration: none; }
  .door .cannot { font-size: 12.5px; color: var(--ink-faint); margin: 10px 0 0; }
  /* The conversation picker (#333). A row is a tap target on a phone before it
     is a table row, so the label runs full width and the two columns beside it
     stay as narrow as their content. */
  table.chats { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0 0 12px; }
  table.chats td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.chats td + td { padding-left: 12px; text-align: right; white-space: nowrap; width: 1%; }
  table.chats tr:last-child td { border-bottom: 0; }
  table.chats a { display: block; }
  table.chats .over { color: var(--warn); }
  /* The turn a restart killed on this conversation (#388). A browser
     conversation has no thread, so its row is where that line goes. */
  table.chats .killed { display: block; margin: 3px 0 0; font-size: 12px; color: var(--warn); }

  /* ---------- the screens that land later ---------- */
  .later {
    border: 1px dashed var(--line); border-radius: 9px; padding: 12px 14px;
    color: var(--ink-dim); font-size: 13px; background: var(--bg-inset);

  .later b { color: var(--ink); }
</style>

<div id="app"></div>

<script>
/* The console's own code. One classic script, no build step and no module
   boundary: the file on disk is the reviewed source and the served page at once.
   Its test drives these same functions in a vm, which is why the screens take
   the payload as an ARGUMENT and the page state sits on one plain object —
   nothing here reads a global the test cannot set. */

/* Every screen this shell carries. The four read screens are #264; the two
   named tickets below draw their own. */
const SCREENS = {
  home:     ["Home",     screenHome],
  agents:   ["Agents",   screenAgents],
  frontier: ["Frontier", screenFrontier],
  feed:     ["Feed",     screenFeed],
  chat:     ["Chat",     screenChat],
  settings: ["Settings", screenSettings],
};
const NAMES = Object.keys(SCREENS);

/* A usage window is spent at the same number the daemon calls spent
   (usage.mjs SPENT_PCT). One name for one thing: the page must not invent a
   second threshold for the same fact. */
const SPENT_PCT = 95;
/* The gate is its own escalation kind (lifecycle.mjs REVIEW_KIND). */
const REVIEW_KIND = "review-gate";

/* The page's whole mutable state. `var` on purpose — the test reaches it. */
var UI = {
  screen: "home",
  fr: { view: "cards", repo: "all", type: "all" },
  /* The settings screen's own state (#265). `phase` is what the banner says:
     clean and dirty before a save, then the three outcomes a save can have
     (#362) — applied, declined, offline — plus the three that interrupt them:
     restarting, refused, unread. */
  set: { section: "routing", models: false, phase: "clean", error: null, busy: false, note: null },
  /* The operator verbs (#266). `busy` names the ONE press in flight, keyed to
     the control it came from; `said` is what curia answered, shown at that same
     control. `note` and `tele` name the agent whose box is open, and `mode` is
     the delivery ADR-0013 defaults to. */
  act: { busy: null, said: null, note: null, mode: "queue", tele: null, diff: null },
};
var payload = null;   /* the sidecar's last answer */
var reachable = true; /* is the SIDECAR itself answering — a different fact from daemon_up */
var settings = null;  /* the last read of curia.yaml + routing.yaml off disk */
var draft = null;     /* the same, with the operator's unsaved edits on it */
var repos = null;     /* the watchable repos, read through the daemon on demand */
var conversations = null; /* the browser conversations (#333), read on the Chat screen only */

/* ---- words ---------------------------------------------------------------- */

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const snip = (s, n) => { const t = String(s ?? "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}
function dur(s) {
  if (s == null) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function clock(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || Number.isNaN(d.getTime())) return "—";
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* A ticket as the tracker names it: `owner/repo#12`, or `#12` when the event
   carries no repo. */
function ticketName(repo, ticket) {
  if (ticket == null || ticket === "") return "";
  return (repo ? repo + "#" : "#") + ticket;
}

/* How many things want the operator. The nav badge, the tab title and the tile
   read one function, so they can never disagree. Usage limits are NOT counted:
   a spent window is on the attention list because it explains a slow box, but
   nobody can answer it.

   A credential warning IS counted (#380). The test is whether an operator act
   ends it, which is exactly what separates it from a spent window: a window
   rolls on its own clock, and a token that nobody mints stays dead and takes
   every agent's first `gh` call with it. So the badge stays hot until the act
   happens, which is the whole point of moving this off a log line. */
function needsYou(o) {
  return (o?.escalations?.length ?? 0) + (o?.review_gate?.length ?? 0)
    + (o?.token_warnings?.length ?? 0) + (o?.dispatch_holds?.length ?? 0);
}

/* ---- the operator verbs (#266) ----------------------------------------------

   Every verb is ONE POST to the sidecar, which composes the daemon call from
   the fields sent here. This page never sends a command line: it names a repo,
   a ticket, an escalation id or an agent, and the sidecar builds the rest.

   Four rules run through all of them.

   1. ONE ACT AT A TIME. `UI.act.busy` names the press in flight, keyed to the
      control it came from, so a second press starts nothing and the control
      that is working says so.
   2. CURIA'S OWN WORDS ARE THE OUTCOME. A command reply is a sentence the
      daemon composed. It is shown where the press was, as it stands. This page
      never writes its own account of what an act did.
   3. THE READING MOVES AT ONCE. The sidecar drops its snapshot age on every
      verb, so the poll right after a press is a fresh read rather than the held
      one. A button that appears to do nothing for five seconds is a button
      pressed twice.
   4. A REFUSAL IS A FACT. First-valid-wins, an agent that is not running, a
      ticket already claimed: each comes back in words, under the control that
      asked, and none of them is a failure of this page. */

/* The literal answers every surface sends. The daemon classifies the ANSWER
   (lifecycle.mjs classifyReviewAnswer, bridge.mjs #buttons), so this page must
   not teach it a second vocabulary for the same act. */
const APPROVE = "approve";
const REJECT = "reject";
const CROSS_CHECK = "cross-check";
const ALL_AS_RECOMMENDED = "all-as-recommended";

/* A value going into an onclick handler crosses TWO escapings: the HTML
   attribute, and the single-quoted JS string inside it. `esc` answers only the
   first. An escalation option is an agent's own words — the one value on this
   page that can carry a quote — and a bare `esc` would leave it able to close
   that string and open code instead. So the JS escaping runs first and the HTML
   escaping over it. */
const js = (s) => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));

const busy = (key) => UI.act.busy === key;
const anyBusy = () => UI.act.busy !== null;
function said(key) {
  const s = UI.act.said;
  return s && s.key === key ? `<div class="said${s.ok ? "" : " bad"}">${mdLite(s.text)}</div>` : "";
}
/* Curia speaks Discord markdown everywhere else, and one reply reaching two
   surfaces is the point of the command seam — so the page renders the little of
   it a reply uses rather than asking the daemon for a second wording. */
function mdLite(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, x) => `<code>${x}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, x) => `<b>${x}</b>`)
    .replace(/(https?:\/\/[^\s<]+)/g, (u) => `<a href="${u}">${u}</a>`);
}

async function verb(key, path, body) {
  if (anyBusy()) return null;
  UI.act.busy = key;
  UI.act.said = null;
  render();
  let out = null;
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: JSON.stringify(body),
    });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the console answered " + res.status));
    out = b;
    UI.act.said = { key, text: outcome(b), ok: b.ok !== false };
  } catch (e) {
    UI.act.said = { key, text: e.message, ok: false };
  }
  UI.act.busy = null;
  render();
  tick();
  return out;
}
function refuse(key, text) {
  UI.act.said = { key, text, ok: false };
  render();
}

function outcome(b) {
  if (typeof b.reply === "string") return b.reply;
  if (b.mode) return noteOutcome(b);
  if (b.ok) return "Answered — it is with the agent.";
  return "Done.";
}
/* A note says which delivery it got, because the delivery is the half the
   operator chose. An interrupt curia refused leaves the words QUEUED — the
   operator asked for these words to reach the agent, and only the speed of it
   failed (ADR-0013). */
function noteOutcome(b) {
  if (b.ok === false) {
    const why = b.why ?? "curia could not put those words to the agent.";
    return b.still_queued ? `${why}\nThe words stay queued: the agent reads them with its next tool result.` : why;
  }
  if (b.mode === "interrupt") {
    return `Interrupting \`${b.session ?? b.agent}\` — ${Math.round((b.graceMs ?? 0) / 1000)}s of grace, then the words land as a user turn.`;
  }
  return `Queued for \`${b.agent}\` — it reads this with its next tool result${b.after ? ` (noted as after ${b.after})` : ""}.`;
}

/* What the operator typed. It is NOT cleared here: a refused answer has to
   leave its words on screen, or the operator types them twice. */
function typed(id) {
  const el = document.getElementById(id);
  return el ? String(el.value ?? "").trim() : "";
}

/* ---- the verbs themselves ---- */

const startTicket = (repo, ticket) => verb(`start:${repo}#${ticket}`, "/api/start", { repo, ticket: String(ticket) });
const answerEsc = (id, answer) => verb("esc:" + id, "/api/answer", { id, answer });

function answerTyped(id, field) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "Type the answer first — an empty reply answers nothing.");
  answerEsc(id, v);
}
/* A rejection IS feedback (#48): the agent gets the operator's own words and
   fixes what they name. So an empty one is refused here rather than sent as a
   rejection nobody can act on. */
function rejectGate(id, field) {
  const v = typed(field);
  if (!v) return refuse("esc:" + id, "A rejection carries your words — say what to change, then press Reject.");
  answerEsc(id, v);
}

/* Cancel names its consequences before it runs. They are the teardown's own
   (dispatch.mjs #teardown), not a warning this page invented. */
function cancelAgent(session, repo, ticket) {
  const ask = `Cancel ${session}?\n\n`
    + `• The tmux session is killed and its worktree removed. Anything uncommitted there is lost.\n`
    + `• The claim on ${ticketName(repo, ticket) || "its ticket"} is released, so the ticket returns to the frontier.\n`
    + `• Any question it is holding closes unanswered.\n`
    + `• A cross-check reviewer on the same ticket ends too.`;
  if (typeof confirm === "function" && !confirm(ask)) return;
  verb("agent:" + session, "/api/cancel", { ticket: String(ticket) });
}

/* Teleport. The two links are curia's own (#68): `attach <n>` composes them
   from its records, so the page asks for them instead of building a URL it
   cannot vouch for. The shell line beside them is for a terminal on the box —
   the tmux server lives in its own container (#260), so the command goes in
   through that one. */
function teleport(session, ticket) {
  UI.act.tele = UI.act.tele === session ? null : session;
  UI.act.said = null;
  render();
  if (UI.act.tele) verb("agent:" + session, "/api/teleport", { ticket: String(ticket) });
}
function attachCmd(session) {
  return `docker compose -f deploy/compose.yaml exec tmux tmux -S /run/curia-tmux/default attach -t ${session}`;
}

function noteBox(session) {
  UI.act.note = UI.act.note === session ? null : session;
  UI.act.said = null;
  render();
}
function noteMode(mode) { UI.act.mode = mode; render(); }
async function sendNote(session, field) {
  const text = typed(field);
  if (!text) return refuse("agent:" + session, "A note with no words is not a note.");
  const out = await verb("agent:" + session, "/api/note", { agent: session, text, mode: UI.act.mode });
  /* Queued or interrupted, the words are with curia — so the box closes. It
     stays open only when nothing was taken at all. */
  if (out && out.id) { UI.act.note = null; render(); }
}

/* ---- the reading's own age ------------------------------------------------- */

/* Three states, and they are three different facts: the sidecar is
   unreachable, the daemon is not answering it, or all is well. */
function readbar(p) {
  if (!reachable) {
    return `<div class="readbar down"><span class="dot"></span><b>the console is offline</b>
      <span class="why">this page cannot reach the sidecar that serves it</span></div>`;
  }
  if (!p) return `<div class="readbar"><span class="dot"></span>reading…</div>`;
  if (!p.daemon_up) {
    /* The sidecar is up and holding the last good reading — which is exactly
       what it exists for. Say which reading, and why it is not moving. */
    return `<div class="readbar down"><span class="dot"></span><b>daemon restarting</b>
      <span>showing the snapshot from ${esc(ago(p.read_at))}</span>
      <span class="spacer"></span>
      <span class="why">not answering on :${esc(p.daemon_port)} since ${esc(ago(p.error_since))} — ${esc(p.error)}</span></div>`;
  }
  return `<div class="readbar"><span class="dot"></span>read ${esc(ago(p.read_at))}
    <span class="spacer"></span>
    <span class="why">refreshing every ${esc(p.poll_interval_s)}s while this tab is visible</span></div>`;
}

/* Every screen opens the same way, and no screen draws before the first read
   lands. */
function head(p, title, right) {
  return `<div class="screen-head"><h2>${esc(title)}</h2>${right ?? ""}</div>${readbar(p)}`;
}
function noSnapshot(p, title) {
  return `${head(p, title)}<div class="later">No snapshot yet. The sidecar is up and has not read the daemon successfully even once.</div>`;
}
function later(p, what, ticket) {
  return `${head(p, SCREENS[UI.screen][0])}
    <div class="later"><b>${esc(what)}</b> lands on ${esc(ticket)}. It draws the same snapshot the bar above reads.</div>`;
}

/* ---- the fleet ------------------------------------------------------------- */

/* The state in the vocabulary the status line already uses (statusline.mjs):
   `ready` and `working` are one state, and an agent with an open question is
   waiting whatever its record says. */
function stateWord(a) {
  if (a.state === "awaiting-review") return "awaiting review";
  if (waitingOn(a).length) return "waiting";
  return { ready: "working", spawning: "dispatched", failed: "failed", "cross-checking": "cross-checking" }[a.state] ?? String(a.state ?? "unknown");
}
/* The questions bound to this agent, minus the gate — the gate is its own list
   and its own card, never a row's footnote. */
const waitingOn = (a) => (a.waiting_on ?? []).filter((w) => w.kind !== REVIEW_KIND);
/* Attention is one test, used by the dot, the row tint and nothing else. */
const wantsYou = (a) => waitingOn(a).length > 0;

function agentDot(a) {
  return `<span class="dot ${wantsYou(a) ? "attn" : a.state === "failed" ? "off" : ""}"></span>`;
}

/* The context meter (#264, usage.mjs ctxOnWire). No reading is "—", never 0%.
   A figure above 100% is the daemon's own complaint about the denominator, not
   a reading about the agent, so it is marked rather than drawn flat. */
function ctxCell(a) {
  if (a.ctx_pct == null) return `<span class="dim-note">—</span>`;
  return `${esc(a.ctx_pct)}%${a.ctx_over ? ` <span class="over">⚠</span>` : ""}`;
}

/* How long ago the agent last reached curia (#370, dispatch.mjs onMcpCall). The
   daemon holds the reading in memory, so this column speaks for the live daemon
   process and for nothing before it.

   The two nulls are two different facts, and the cell says which one it is. An
   agent this process spawned and never heard is "never". An agent it adopted
   after a restart has no uptime either, and it is "adopted": the silence
   belongs to the restart. Neither word is a verdict — a working agent and a
   deaf one are both silent (#341), so the operator judges the silence. */
function contactCell(a) {
  if (a.last_contact_s != null) return esc(dur(a.last_contact_s));
  return `<span class="dim-note">${a.uptime_s == null ? "adopted" : "never"}</span>`;
}
const CONTACT_NOTE = "contact is how long ago the agent last reached curia on its side channel, as this daemon process heard it. never is an agent that has said nothing since it spawned. adopted is an agent this process never spawned, so its silence belongs to the daemon restart.";

/* The fleet, narrow: the home's right column. `agents: null` is an unreadable
   tmux, which is the opposite fact from an idle box, so it renders as neither a
   table nor an empty line. */
function fleetTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. Every other section below is still a live reading.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents narrow">
    <tr><th>session</th><th>state</th><th>ticket</th><th>ctx</th><th>contact</th><th>up</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span></td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${contactCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td></tr>`).join("")}
  </table></div>`;
}

/* ---- the provider strip ---------------------------------------------------- */

/* One reading per provider, said once (#248). It is an account fact, not an
   agent fact, so no agent row repeats it (CONTEXT.md, usage windows).

   The bar is neutral until the window is worth attention: a fill that ran ahead
   of its own clock, and bad once the window is spent. The thin mark is where
   the clock stands, so "62% of the window at 48% of the time" is one glance. */
function meterBar(label, w) {
  const pct = Number(w.pct ?? 0);
  const elapsed = w.elapsed_pct == null ? null : Number(w.elapsed_pct);
  const cls = pct >= SPENT_PCT ? "bad" : elapsed != null && pct > elapsed ? "warn" : "";
  return `<span class="meter-row"><span class="lbl">${esc(label)}</span>
    <span class="bar"><span class="fill ${cls}" style="width:${Math.min(100, Math.max(0, pct))}%"></span>
      ${elapsed == null ? "" : `<span class="clock" style="left:${Math.min(100, Math.max(0, elapsed))}%"></span>`}</span>
    <span class="pct num">${esc(pct)}%</span></span>`;
}
function provStrip(o) {
  const usage = o.usage ?? [];
  /* A provider with no probe and no live agent says NOTHING rather than zero
     (#262): an unmeasured window and an unspent one are not the same fact. */
  if (!usage.length) return `<div class="prov-strip">No usage window is measured. A window is read from the account probe, or from a live agent's own transcript.</div>`;
  return `<div class="prov-strip">${usage.map((p) => {
    const soonest = nextReset([p]);
    return `<span class="prov"><b>${esc(p.provider)}</b>
      ${(p.windows ?? []).map((w) => meterBar(w.label, w)).join("")}
      ${soonest ? `<span class="pnote ${spentWindows([p]).length ? "hot" : ""}">${esc(soonest.label)} rolls ${esc(clock(soonest.at))}</span>` : ""}
      <span class="pnote">from the ${esc(p.from)}${p.session ? ` of ${esc(p.session)}` : ""}</span></span>`;
  }).join("")}</div>`;
}
/* The pre-emptive hold, said once at the top (#384). It names the provider and
   the lift time, which are the two things an operator watching an idle box
   needs: WHICH lane stopped, and WHEN it starts again.

   It is not on the Needs-you list, for the reason a spent window is not: the
   test is whether an operator act ends it, and this one ends on its own clock.
   A model label on the ticket steps over it, which the line says, because that
   is the one act there is. */
function holdBanner(o) {
  const holds = o?.pre_cooling ?? [];
  if (!holds.length) return "";
  return holds.map((h) => `<div class="hold-banner">
    <span class="who">${esc(h.provider)}</span>
    <span>held before the limit — the ${esc(h.window)} window is at ${esc(h.pct)}%, and it lifts at ${esc(clock(h.reset_at))}</span>
    <span class="dim">curia dispatches on the other lanes. A <code>model:</code> label on a ticket still starts it here.</span>
  </div>`).join("");
}
function spentWindows(usage) {
  return (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => Number(w.pct ?? 0) >= SPENT_PCT)
    .map((w) => ({ provider: p.provider, label: w.label, pct: w.pct, at: w.resets_at })));
}
/* The soonest window still ahead of us, which is the one the operator waits on. */
function nextReset(usage) {
  const all = (usage ?? []).flatMap((p) => (p.windows ?? [])
    .filter((w) => w.resets_at && Date.parse(w.resets_at) > Date.now())
    .map((w) => ({ provider: p.provider, label: w.label, at: w.resets_at })));
  all.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  return all[0] ?? null;
}

/* ---- the attention list ---------------------------------------------------- */

/* Everything that wants the operator, in one column, warn-marked because that
   is what the color is for — and the ONE place an open question is answered
   (#266). The Agents table states the same questions and answers none of them:
   one answer surface, so no operator has to remember which of two they are
   looking at. */

/* The buttons a kind carries, in the vocabulary every other surface sends
   (bridge.mjs #buttons). A choice sends its option's own label; an
   approve-reject pair sends the two literals; a recommended round sends the one
   fixed word its ✅ carries (#285), and it has no ❌ beside it because the
   opposite of that tap is the operator's own reply. */
function answerButtons(r) {
  const key = "esc:" + r.id;
  const btn = (label, answer, cls) => `<button class="btn sm${cls ? " " + cls : ""}"
    ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${js(answer)}')">${esc(label)}</button>`;
  const b = [];
  if (r.kind === "approve-reject" || r.kind === "preview-review") {
    b.push(btn("✅ Approve", APPROVE, "primary"), btn("❌ Reject", REJECT, "danger"));
  }
  if (r.kind === "confirm") b.push(btn("✅ Approve", APPROVE, "danger"), btn("❌ Decline", REJECT));
  if (r.kind === "choice") for (const o of r.options ?? []) b.push(btn(snip(o, 80), o));
  if (r.kind === "free-text" && r.recommended) b.push(btn("✅ All as recommended", ALL_AS_RECOMMENDED, "primary"));
  return b.length ? `<div class="act-row">${b.join("")}</div>` : "";
}

/* Free-form, on every kind. A choice can be answered in words the options do
   not carry, and a round is answered by naming the exceptions (#285) — so the
   field is never the fallback for a kind, it is the reply. */
function answerField(r) {
  const id = "ans-" + r.id;
  return `<div class="act-row">
    <input type="text" id="${esc(id)}" placeholder="answer in your own words…" ${anyBusy() ? "disabled" : ""}>
    <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="answerTyped('${js(r.id)}','${js(id)}')">Answer</button>
  </div>`;
}

function escCard(r) {
  return `<div class="att-item">
    <span class="who">${esc(r.agent)}</span>${esc(snip(r.prompt, 260))}
    <div class="dim">${esc(r.kind)} · ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}${r.agent_died ? " · the agent died holding it" : ""}${r.rendered ? "" : " · not rendered in Discord yet"}</div>
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview it asks about</a></div>` : ""}
    ${answerButtons(r)}${answerField(r)}${said("esc:" + r.id)}</div>`;
}

/* ---- the diff digest (#355) ------------------------------------------------

   The card answers "how big is this, and what did it touch" without carrying
   the whole diff. Every number on it is a fact curia MEASURED — the agent's
   gate summary stays the only account of the work (#343).

   TWO SOURCES, one card. A review gate's digest was counted when the gate
   opened and rides `/overview`, so drawing it costs no read at all. A live
   agent row is counted on demand, committed and uncommitted work together,
   when the operator presses the button.

   THE HUNKS NEVER RIDE THE POLL. They are fetched per file, once, and cached
   here — a card the operator never opened costs nothing, and a card left open
   is not re-fetched every five seconds. */

/* key -> the card's own state. `open` starts with the top file expanded, which
   is the one thing the rank rule decides. */
var diffs = {};
/* Hunk reads the next render will start. A renderer must not fetch, so it
   records what it needs and `render()` drains this after the page is written. */
var diffQueue = [];

function diffState(key) {
  if (!diffs[key]) diffs[key] = { open: { 0: true }, hunks: {}, digest: null, error: null, read: false, loading: false };
  return diffs[key];
}

/* The digest for a LIVE agent row. A gate never comes through here: its numbers
   are already on the payload. */
async function loadDigest(key, query) {
  const d = diffState(key);
  if (d.loading) return;
  d.loading = true;
  render();
  try {
    const res = await fetch(query, { headers: { accept: "application/json" }, cache: "no-store" });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the console answered " + res.status));
    d.digest = b.digest ?? null;
    d.error = b.error ?? null;
  } catch (e) {
    d.digest = null;
    d.error = e.message;
  }
  d.read = true;
  d.loading = false;
  render();
}

async function loadHunks(key, i, query) {
  const d = diffState(key);
  try {
    const res = await fetch(query + "&file=" + i, { headers: { accept: "application/json" }, cache: "no-store" });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || ("the console answered " + res.status));
    d.hunks[i] = b.hunks ?? { text: null, error: b.error ?? "curia said nothing about this file" };
  } catch (e) {
    d.hunks[i] = { text: null, error: e.message };
  }
  render();
}

function drainDiffQueue() {
  const q = diffQueue;
  diffQueue = [];
  for (const j of q) loadHunks(j.key, j.i, j.query);
}

function toggleDiffFile(key, i, query) {
  const d = diffState(key);
  d.open[i] = !d.open[i];
  render();
}

/* The agent row's button (#355). It presses once and the read is a snapshot of
   that moment, so `re-read` is beside it: the work moves while you look. */
function openDiff(session) {
  UI.act.diff = UI.act.diff === session ? null : session;
  render();
  if (!UI.act.diff) return;
  const key = "agent:" + session;
  if (!diffState(key).read) loadDigest(key, agentDiffQuery(session));
}
function rereadDiff(key, query) {
  delete diffs[key];
  loadDigest(key, query);
}
const agentDiffQuery = (session) => "/api/diff?agent=" + encodeURIComponent(session);
const gateDiffQuery = (id) => "/api/diff?esc=" + encodeURIComponent(id);

/* The caption under a path: facts, in words, so a state is never told by color
   alone. `hunks` is absent on a change too big to have been counted, and the
   caption then says nothing rather than saying zero. */
function fileCaption(f) {
  const w = [];
  if (f.untracked) w.push("new, not committed yet");
  else if (f.status === "A") w.push("new");
  else if (f.status === "D") w.push("deleted");
  else if (f.status === "R") w.push(f.from ? "renamed from " + f.from : "renamed");
  else if (f.status === "C") w.push(f.from ? "copied from " + f.from : "copied");
  else if (f.status === "T") w.push("type changed");
  if (f.binary) w.push("binary");
  else if (f.hunks != null) w.push(f.hunks + " hunk" + (f.hunks === 1 ? "" : "s"));
  return w.join(" · ");
}

const num = (n) => (n == null ? "?" : n);

/* A patch, colored by its own vocabulary. No highlighting beyond the four line
   kinds: this is a read, not an editor. */
function hunkHtml(text) {
  return String(text ?? "").split("\n").map((l) => {
    let c = "";
    if (/^(@@)/.test(l)) c = "at";
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity |rename |old mode|new mode|Binary files)/.test(l)) c = "meta";
    else if (l.startsWith("+")) c = "add";
    else if (l.startsWith("-")) c = "del";
    return `<span class="hl ${c}">${esc(l)}</span>`;
  }).join("\n");
}

/* A file that is open. The read is asked for HERE — the first render that wants
   it queues it, and the marker it leaves behind is what stops the second render
   asking again. */
function hunkBody(key, f, i, query, prUrl) {
  const d = diffState(key);
  const h = d.hunks[i];
  const files = prUrl ? ` <a href="${esc(prUrl)}/files">Read it on GitHub</a>` : "";
  if (h === undefined) {
    d.hunks[i] = "loading";
    diffQueue.push({ key, i, query });
    return `<div class="say">reading the hunks…</div>`;
  }
  if (h === "loading") return `<div class="say">reading the hunks…</div>`;
  if (h.text == null || h.text === "") {
    return `<div class="say">curia could not read this file's hunks${h.error ? " — " + esc(h.error) : ""}.${files}</div>`;
  }
  const said = h.source === "pull-request"
    ? `<div class="say">the worktree is gone — this comes from the pull request's own diff</div>` : "";
  const missed = h.lines_total - h.lines_shown;
  const tail = h.truncated
    ? `<div class="say">the card stopped at ${h.lines_shown} lines and did not show ${missed} more.${
      prUrl ? files : " There is no pull request to read the rest on."}</div>`
    : "";
  return `${said}<pre class="hunks">${hunkHtml(h.text)}</pre>${tail}`;
}

function diffFileRow(key, f, i, query, prUrl) {
  const open = Boolean(diffState(key).open[i]);
  const cap = fileCaption(f);
  return `<div class="diff-file">
    <button class="diff-row" onclick="toggleDiffFile('${js(key)}',${i},'${js(query)}')">
      <span class="mono path">${open ? "▾" : "▸"} ${esc(f.path)}</span>
      <span class="nums"><span class="add">+${num(f.added)}</span> <span class="del">−${num(f.deleted)}</span></span>
    </button>
    ${cap ? `<div class="cap">${esc(cap)}</div>` : ""}
    ${open ? hunkBody(key, f, i, query, prUrl) : ""}
  </div>`;
}

/* Null is not empty, here as everywhere: a digest curia could not take says so
   with its reason, and a branch that really changed nothing says that instead.
   The two must never render the same. */
function diffCard(key, digest, error, query, prUrl) {
  if (!digest) {
    return `<div class="unread">curia could not count this diff${error ? " — " + esc(error) : ""}.${
      prUrl ? ` <a href="${esc(prUrl)}/files">GitHub still has it</a>` : ""}</div>`;
  }
  if (!digest.files) return `<div class="empty">No file changed against the default branch.</div>`;
  const shown = digest.list ?? [];
  return `<div class="diff">
    <div class="diff-sum"><b>${digest.files} file${digest.files === 1 ? "" : "s"}</b>
      <span class="add">+${digest.added}</span> <span class="del">−${digest.deleted}</span>${
  digest.uncommitted ? ` <span class="dim">— committed and uncommitted work together</span>` : ""}</div>
    <div class="diff-rule">ranked ${esc(digest.rank_rule ?? RANK_RULE)}${
  digest.capped ? ` · the list stops at ${shown.length} of ${digest.files} files` : ""}</div>
    ${shown.map((f, i) => diffFileRow(key, f, i, query, prUrl)).join("")}
  </div>`;
}

/* The same words the daemon prints on the Discord card (diffdigest.mjs
   RANK_RULE), for a digest journalled before the rule rode the record. */
const RANK_RULE = "source first, then tests, then docs, generated and lock files last — largest first inside each class";

/* The gate's three answers (#165, ADR-0010). Approve merges and resolves;
   cross-check answers NOTHING and puts a reviewer on the other provider onto
   the diff, with the builder parked where it stands; a rejection carries the
   operator's words back to the builder. */
function gateCard(r) {
  const id = "rej-" + r.id;
  return `<div class="att-item gate">
    <span class="who">${esc(r.agent)}</span>review gate — ${esc(ticketName(null, r.ticket))} · open ${esc(ago(r.opened_at))}
    <div class="dim">${esc(snip(r.prompt, 220))}</div>
    ${r.pull_request ? `<div class="opts"><a href="${esc(r.pull_request)}">${esc(r.pull_request)}</a></div>` : `<div class="opts">no pull request on this gate</div>`}
    ${r.preview_url ? `<div class="opts"><a href="${esc(r.preview_url)}">the preview</a></div>` : ""}
    ${diffCard("esc:" + r.id, r.diff ?? null, r.diff_error ?? null, gateDiffQuery(r.id), r.pull_request)}
    <div class="act-row">
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${APPROVE}')">✅ Approve · merge</button>
      <button class="btn sm" ${anyBusy() ? "disabled" : ""} onclick="answerEsc('${js(r.id)}','${CROSS_CHECK}')">🔎 Cross-check</button>
    </div>
    <div class="act-row">
      <input type="text" id="${esc(id)}" placeholder="what to change — a rejection carries your words…" ${anyBusy() ? "disabled" : ""}>
      <button class="btn sm danger" ${anyBusy() ? "disabled" : ""} onclick="rejectGate('${js(r.id)}','${js(id)}')">Reject</button>
    </div>
    ${said("esc:" + r.id)}</div>`;
}

/* A credential warning (#380). It sits above the spent windows because it is
   the only item on this list nobody else will fix: a window rolls by itself,
   and a grant does not. The words are the daemon's own measurement — what it
   could not reach and the act that ends it — so this composes no second account
   of them.

   ONE FAULT SINCE #466: a repo the app installation does not cover. The expiry
   half went with the last PAT. A warning the journal kept from before that reads
   through this shape too, which is why the message and the act are read
   defensively rather than assumed. */
function tokenCard(w) {
  return `<div class="att-item token">
    <span class="who">${esc(w.key)}</span>cannot reach ${esc(w.repo)}${w.message ? ` — ${esc(w.message)}` : ""}
    <div class="dim">${esc(w.refusal)}${w.fix ? ` — ${esc(w.fix)}` : ""}</div></div>`;
}

function dispatchHoldCard(h) {
  const cause = h.deaths != null
    ? "died after it spoke, and its automatic resume also died"
    : `died at the spawn ${esc(h.failures)} times`;
  return `<div class="att-item limit">
    <span class="who">${esc(ticketName(h.repo, h.ticket))}</span>${cause}, so auto-dispatch steps over it
    <div class="dim">a <code>start</code> or <code>resume</code> you type dispatches it again and clears the count</div></div>`;
}

function attentionList(o) {
  const items = [
    ...(o.escalations ?? []).map(escCard),
    ...(o.review_gate ?? []).map(gateCard),
    ...(o.token_warnings ?? []).map(tokenCard),
    ...spentWindows(o.usage).map((w) => `<div class="att-item limit">
      <span class="who">${esc(w.provider)}</span>the ${esc(w.label)} window is spent at ${esc(w.pct)}%
      <div class="dim">${w.at ? `it rolls at ${esc(clock(w.at))}` : "no reset instant is stated"}</div></div>`),
    /* The tickets the auto loop steps over (#444). On this list where a spent
       window is not, by this list's own test: an operator act is what ends one.
       Nothing lifts it on a clock, and the ticket sits on the frontier
       untouched until somebody fixes the cause and dispatches it. */
    ...(o.dispatch_holds ?? []).map(dispatchHoldCard),
  ];
  return { count: items.length, html: items.length ? items.join("") : `<div class="empty">Nothing wants you.</div>` };
}

/* ---- the feed -------------------------------------------------------------- */

/* The journal speaks in types and fields. The page speaks in sentences.
   A type this table does not name still reads: the fallback says the type in
   words and names whatever subject the event carries, so an event the daemon
   grows tomorrow is legible the day it ships instead of rendering blank. */
const who = (e) => (e.agent ? `<b>${esc(e.agent)}</b>` : "");
const tkt = (e) => (e.ticket == null || e.ticket === "" ? "" : `<span class="mono">${esc(ticketName(e.repo, e.ticket))}</span>`);
const subject = (e) => [who(e), tkt(e)].filter(Boolean).join(" · ");

const EVENTS = {
  dispatch_claimed: ["claim", "", (e) => `${tkt(e)} claimed for ${who(e)} by ${esc(e.by)}`],
  dispatch_unclaimed: ["claim", "", (e) => `${tkt(e)} unclaimed — back on the frontier`],
  /* The failed spawn and the step-over it arms (#444). Two lines, because they
     are two facts: one dispatch died, and the loop has stopped taking this
     ticket. */
  dispatch_failed: ["spawn", "bad", (e) => `${tkt(e)} died at the spawn${e.reason ? ` — ${esc(snip(e.reason, 120))}` : ""}`],
  dispatch_held: ["spawn", "warn", (e) => `auto-dispatch steps over ${tkt(e)} — it died at the spawn ${esc(e.failures)} times. A start or a resume you type clears the count`],
  agent_died_released: ["death", "bad", (e) => `${tkt(e)} returned to the frontier after its agent died following tool traffic`],
  death_resume_held: ["death", "warn", (e) => `auto-dispatch steps over ${tkt(e)} — its automatic resume also died. A start or a resume you type clears the count`],
  dispatch_exhausted: ["cooling", "bad", (e) => `${tkt(e)} could not be dispatched — every model is cooling${e.earliest_reset ? `, the earliest rolls ${esc(clock(e.earliest_reset))}` : ""}`],
  agent_spawned: ["spawn", "", (e) => `${who(e)} spawned on ${esc(e.model)}${e.harness ? ` — ${esc(e.harness)}` : ""}${e.kind ? `, ${esc(e.kind)}` : ""} · ${tkt(e)}`],
  agent_ready: ["spawn", "", (e) => `${who(e)} is at work on ${tkt(e)}`],
  agent_done: ["ending", "", (e) => `${who(e)} ended its turn`],
  agent_died: ["death", "bad", (e) => `${who(e)} died — ${tkt(e)}${e.kind ? ` (${esc(e.kind)})` : ""}`],
  agent_cancelled: ["cancel", "bad", (e) => `${who(e)} cancelled by ${esc(e.by)} — ${tkt(e)} back on the frontier`],
  agent_abnormal_exit: ["death", "bad", (e) => `${who(e)} exited abnormally — ${tkt(e)}`],
  agent_blocked_on_human: ["escalation", "warn", (e) => `${who(e)} is blocked on you — ${tkt(e)}`],
  agent_note: ["note", "", (e) => `note for ${who(e)}${e.by ? ` from ${esc(e.by)}` : ""}: ${esc(snip(e.text, 120))}`],
  agent_notes_drained: ["note", "", (e) => `${who(e)} took ${esc(e.count)} queued note(s)`],
  agent_note_refused: ["note", "warn", (e) => `a note for ${who(e)} was refused — ${esc(e.reason)}`],
  agent_notes_expired: ["note", "", (e) => `${esc(e.count ?? "some")} note(s) for ${who(e)} died with the agent they were typed at`],
  note_interrupt: ["note", "warn", (e) => `${who(e)} interrupted by ${esc(e.by)} — ${esc(Math.round((e.grace_ms ?? 0) / 1000))}s of grace, then the words land`],
  note_interrupt_delivered: ["note", "", (e) => `the interrupted words are in ${who(e)}'s pane`],
  note_interrupt_failed: ["note", "bad", (e) => `the interrupt of ${who(e)} failed — ${esc(e.reason)}`],
  esc_open: ["escalation", "warn", (e) => `${who(e)} asks — ${esc(e.kind)}: ${esc(snip(e.prompt, 160))}`],
  esc_answer: ["answer", "", (e) => `escalation ${esc(e.id)} answered by ${esc(e.by)}${e.via ? ` via ${esc(e.via)}` : ""}`],
  esc_cancel: ["answer", "", (e) => `escalation ${esc(e.id)} cancelled by ${esc(e.by)}`],
  esc_lapse: ["answer", "", (e) => `escalation ${esc(e.id)} lapsed — ${esc(e.reason)}`],
  esc_supersede: ["escalation", "", (e) => `escalation ${esc(e.id)} superseded by ${esc(e.successor)}`],
  esc_replayed: ["answer", "", (e) => `${who(e)} asked ${esc(e.id)} again and took the recorded answer — nobody was asked twice`],
  review_requested: ["gate", "warn", (e) => `review gate opened for ${tkt(e)} by ${who(e)}`],
  review_answered: ["gate", "", (e) => `${tkt(e)} ${e.approved ? "approved" : "rejected"} at the gate${e.outcome ? ` — ${esc(e.outcome)}` : ""}`],
  cross_check_requested: ["cross-check", "", (e) => `cross-check pressed on ${tkt(e)} — ${who(e)} parks`],
  reviewer_spawned: ["cross-check", "", (e) => `${who(e)} spawned to read ${tkt(e)}${e.builder ? ` for ${esc(e.builder)}` : ""}`],
  cross_check_returned: ["cross-check", "", (e) => `cross-check on ${tkt(e)} returned${e.ok === false ? ` — it carried no verdict${e.why ? `: ${esc(e.why)}` : ""}` : ""}`],
  verdict_captured: ["cross-check", "", (e) => `verdict captured for ${tkt(e)} from ${esc(e.model)}`],
  verdict_commented: ["cross-check", "", (e) => `verdict posted on ${tkt(e)}`],
  verdict_failed: ["cross-check", "bad", (e) => `the cross-check of ${tkt(e)} failed`],
  verdict_undelivered: ["cross-check", "bad", (e) => `a verdict for ${tkt(e)} reached no reader`],
  ticket_resolved: ["resolve", "", (e) => `${tkt(e)} resolved by ${who(e)}${e.pr ? ` — ${esc(e.pr)}` : ""}`],
  lifecycle_closed: ["ending", "", (e) => `${who(e)} finished ${tkt(e)}`],
  land_failed: ["landing", "bad", (e) => `${tkt(e)} could not land — ${esc(snip(e.error, 120))}`],
  result: ["result", "", (e) => `${who(e)} reported ${esc(e.status ?? "a result")}${e.summary ? ` — ${esc(snip(e.summary, 120))}` : ""}`],
  result_parked: ["result", "", (e) => `${who(e)} parked its ending — ${esc(e.reason)}`],
  notify: ["notify", "", (e) => `${who(e)}: ${esc(snip(e.message, 160))}`],
  preview: ["preview", "", (e) => `${who(e)} published a preview${e.path ? ` at ${esc(e.path)}` : ""}${e.ok === false ? ` — refused: ${esc(e.reason)}` : ""}`],
  model_cooling: ["cooling", "bad", (e) => `${esc(e.model)} is cooling${e.reset_at ? ` — it rolls ${esc(clock(e.reset_at))}` : ""}`],
  provider_cooling: ["cooling", "bad", (e) => `${esc(e.provider)} is cooling${e.reset_at ? ` — it rolls ${esc(clock(e.reset_at))}` : ""}`],
  /* The pre-emptive hold (#384). Its own two lines, never the landed cap's: one
     says a wall was hit, this says curia stopped short of one. */
  provider_precooling: ["cooling", "warn", (e) => `${esc(e.provider)} is held before the limit — the ${esc(e.window)} window is at ${esc(e.pct)}%${e.reset_at ? `, and it lifts ${esc(clock(e.reset_at))}` : ""}`],
  provider_precooling_lifted: ["cooling", "", (e) => `${esc(e.provider)} is dispatching again${e.pct == null ? "" : ` — its fullest window reads ${esc(e.pct)}%`}`],
  restart_requested: ["restart", "warn", (e) => `restart ordered by ${esc(e.by)} — the daemon exits ${esc(e.exit_code)} and the supervisor respawns it`],
  /* The live reload (#362). A save applies, so the feed says what moved — and
     a reload the daemon would not take says which key needs the restart. */
  config_reloaded: ["config", "", (e) => `config reloaded by ${esc(e.by)}${
    e.keys?.length ? ` — ${esc(e.keys.join(", "))}` : " — nothing moved"}`],
  config_reload_declined: ["config", "warn", (e) => `config reload declined for ${esc(e.by)} — ${esc(snip(e.error, 160))}`],
  deploy_requested: ["deploy", "", (e) => `deploy ordered by ${esc(e.by)}`],
  deploy_landed: ["deploy", "", (e) => `deploy landed${e.next ? ` at ${esc(String(e.next).slice(0, 7))}` : ""}`],
  deploy_rolled_back: ["deploy", "bad", (e) => `deploy rolled back — ${esc(e.reason ?? "the health check failed")}`],
  /* The refused merge (#562): nothing was recreated, so this must not read
     like the rollback above — the running daemon never stopped. */
  deploy_merge_refused: ["deploy", "bad", (e) => `deploy refused — ${esc(e.reason ?? "git could not fast-forward")}; nothing was recreated`],
  deploy_untracked_dup_discarded: ["deploy", "", (e) => `deploy preflight removed untracked ${esc((e.files ?? []).join(", "))} — byte-identical to files the deploy adds`],
  deploy_lockfile_churn_discarded: ["deploy", "", (e) => `deploy preflight discarded npm lockfile churn in ${esc((e.files ?? []).join(", "))}`],
  /* The credential watch (#380). The feed says what curia measured; the
     Needs-you item beside it says the condition still stands. */
  token_warned: ["credential", "bad", (e) => (e.fault === "unreachable"
    ? `${esc(e.key)} cannot reach ${esc(e.repo)} — ${esc(e.message)}`
    : `${esc(e.key)} ${e.days <= 0 ? "has expired" : `expires in ${esc(e.days)} day(s)`}`)],
  token_cleared: ["credential", "", (e) => (e.fault === "unreachable"
    ? `${esc(e.key)} reaches ${esc(e.repo)} again`
    : `${esc(e.key)} is renewed`)],
  bridge_wedged: ["bridge", "bad", (e) => `the Discord bridge is wedged`],
  bridge_recovered: ["bridge", "", (e) => `the Discord bridge is back`],
  bridge_health: ["bridge", "", (e) => `bridge ${esc(e.previous)} → ${esc(e.state)} — ${esc(e.reason)}`],
  reconcile: ["reconcile", "", (e) => `reconcile pass${e.boot ? " at boot" : ""}`],
  command: ["command", "", (e) => `${esc(snip(e.canonical, 120))} — by ${esc(e.by)}`],
  /* The browser conversations (#333). The delete says the number is spent,
     because that is the half of it nobody can undo. */
  console_conversation_opened: ["chat", "", (e) => `${esc(e.key)} opened — a new browser conversation`],
  console_conversation_deleted: ["chat", "", (e) => `${esc(e.key)} deleted — its number is spent, and the next one counts past it`],
  /* The replay (#388, ADR-0015). The turn's own start and end are not in the
     feed — they are bookkeeping, one pair per message. This is the news. */
  overseer_turn_dropped: ["chat", "warn", (e) => e.replayed
    ? `a restart killed the turn on ${esc(e.key)} — curia sent the message again`
    : `a restart killed the turn on ${esc(e.key)} — not sent again${
      e.commands?.length ? `, it had run ${esc(e.commands.join(", "))}` : ""}${e.why ? ` (${esc(e.why)})` : ""}`],
  map_adopted: ["charting", "", (e) => `${who(e)} adopted map ${esc(e.map)} — ${esc(snip(e.title, 80))}`],
  charting_finished: ["charting", "", (e) => `${who(e)} finished charting ${tkt(e)} — ${esc(e.status)}`],
};

function eventLine(e) {
  const spec = EVENTS[e.type];
  if (spec) return { tag: spec[0], cls: spec[1], html: spec[2](e) };
  const s = subject(e);
  return { tag: String(e.type ?? "event").replace(/_/g, " "), cls: "", html: s || "—" };
}
/* Newest first: the operator reads the top of the page, so the last thing that
   happened must be the first thing there. */
function feedList(events, limit) {
  const rows = [...(events ?? [])].reverse().slice(0, limit ?? undefined);
  if (!rows.length) return `<div class="empty">The journal tail is empty.</div>`;
  return `<ul class="feed-list">${rows.map((e) => {
    const l = eventLine(e);
    return `<li class="${l.cls}"><time>${esc(clock(e.ts))}</time>
      <span class="ev"><span class="tag">${esc(l.tag)}</span> — ${l.html}</span></li>`;
  }).join("")}</ul>`;
}

/* ---- home ------------------------------------------------------------------ */

function tile(v, l, warn) {
  const none = v === "—" || v === 0 ? " none" : "";
  return `<div class="tile${warn && v ? " warn" : ""}"><div class="v num${none}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
}
function statTiles(o) {
  const reset = nextReset(o.usage);
  return `<div class="stat-tiles">
    ${tile(needsYou(o), "needs you", true)}
    ${tile(o.agents == null ? "—" : o.agents.length, "agents live")}
    ${tile(o.review_gate?.length ?? 0, "review gate", true)}
    ${tile(reset ? clock(reset.at) : "—", reset ? `${reset.provider} ${reset.label} rolls` : "next reset")}
  </div>`;
}

/* The all-three home (#248): tiles across the top, the attention list left, the
   fleet right, the provider strip said once under it. */
function screenHome(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Home");
  const att = attentionList(o);
  return `${head(p, "Home")}
    ${holdBanner(o)}
    ${statTiles(o)}
    <div class="split-cols">
      <div>
        <div class="h-sect"><h3><span class="${att.count ? "hot" : ""}">Needs you</span> (${att.count})</h3>${att.html}</div>
        <div class="h-sect"><h3>Last events</h3>${feedList(o.events, 4)}
          <a class="more" href="#feed">all events →</a></div>
      </div>
      <div>
        <div class="h-sect"><h3>Fleet${o.agents == null ? "" : ` (${o.agents.length})`}</h3>${fleetTable(o)}</div>
        ${provStrip(o)}
        ${deployCard(o)}
      </div>
    </div>`;
}

/* The self-deploy card (#562). The outcome used to live in one Discord line and
   a log only ssh could read; this keeps the LAST verdict on the page — with the
   sibling's own log excerpt when it failed — and the in-flight state while one
   runs. Nothing here is a verb: `deploy` stays typed-only (#270). */
function deployCard(o) {
  const d = o.deploy;
  if (!d || (!d.in_flight && !d.last && !d.verdict_read_error)) return "";
  const sh = (s) => String(s ?? "").slice(0, 7);
  if (d.in_flight) {
    return `<div class="h-sect"><h3>Deploy</h3>
      <div class="unread">a deploy is in flight: ${esc(sh(d.in_flight.prev))} → ${esc(sh(d.in_flight.next))} — state ${esc(d.in_flight.state)}. The daemon restarts if it lands; this page keeps its last snapshot through that.</div></div>`;
  }
  if (d.verdict_read_error) {
    return `<div class="h-sect"><h3>Last deploy</h3>
      <div class="unread">${esc(d.verdict_read_error)}</div></div>`;
  }
  const l = d.last;
  const word = { landed: "landed", "rolled-back": "ROLLED BACK", "merge-refused": "refused", lockout: "LOCKOUT" }[l.state] ?? l.state;
  const line = `${esc(word)}: ${esc(sh(l.prev))} → ${esc(sh(l.next))}${l.reason ? ` — ${esc(l.reason)}` : ""}${l.resolved_at ? ` · ${esc(ago(l.resolved_at))}` : ""}${l.by ? ` · ordered by ${esc(l.by)}` : ""}`;
  const ok = l.state === "landed";
  return `<div class="h-sect"><h3>Last deploy</h3>
    <div class="${ok ? "dim-note" : "unread"}">${line}</div>
    ${!ok && l.log ? `<div class="said">${esc(l.log)}</div>` : ""}</div>`;
}

/* ---- agents ---------------------------------------------------------------- */

function screenAgents(p) {
  const o = p?.overview;
  if (!o) return noSnapshot(p, "Agents");
  const d = o.daemon ?? {};
  const live = o.agents == null ? "—" : o.agents.length;
  const bar = `<div class="statusbar">
    <span>agents ${esc(live)}/${esc(d.max_concurrent ?? "?")}</span>
    <span>auto dispatch ${d.auto_dispatch ? "on" : "off"}</span>
    <span>bridge ${esc(o.bridge)}</span>
    <span>daemon :${esc(d.port)} up ${esc(dur(d.uptime_s))}</span>
  </div>`;
  return `${head(p, "Agents")}${bar}${agentsTable(o)}${untrackedLine(o)}${recentLine(o)}`;
}

function agentsTable(o) {
  if (o.agents == null) {
    return `<div class="unread">the fleet could not be read${o.fleet_error ? ` — ${esc(o.fleet_error)}` : ""}. This is an unreadable tmux, not an idle box.</div>`;
  }
  if (!o.agents.length) return `<div class="empty">No agent is running.</div>`;
  const rows = [...o.agents].sort((a, b) => (wantsYou(b) ? 1 : 0) - (wantsYou(a) ? 1 : 0));
  return `<div class="tbl-wrap"><table class="agents wide">
    <tr><th>session</th><th>state</th><th>ticket</th><th>model</th><th>ctx</th><th>contact</th><th>up</th><th>waiting on</th><th>do</th></tr>
    ${rows.map((a) => `<tr class="${wantsYou(a) ? "esc-row" : ""}">
      <td class="sess">${esc(a.session)}${a.reviewer ? ` <span class="dim-note">reviewer</span>` : ""}</td>
      <td><span class="state">${agentDot(a)} ${esc(stateWord(a))}</span>${a.tmux_live ? "" : `<div class="dim-note">no tmux session</div>`}</td>
      <td><span class="t">${esc(ticketName(a.repo, a.ticket))}</span>${esc(a.title ?? "")}</td>
      <td class="mono">${esc(a.model ?? "—")}</td>
      <td class="num">${ctxCell(a)}</td>
      <td class="num">${contactCell(a)}</td>
      <td class="num">${esc(dur(a.uptime_s))}</td>
      <td>${waitingCell(a)}</td>
      <td>${agentVerbs(a)}</td></tr>
    ${agentBoxes(a)}`).join("")}
  </table></div><div class="dim-note">${esc(CONTACT_NOTE)}</div>`;
}

/* The three per-agent verbs (#266). They sit in the row that already names the
   agent, and the boxes they open sit under it — so the words the operator types
   are beside the agent they are for.

   An answer is NOT here. The Needs-you list on Home is the one answer surface,
   and the `waiting on` cell beside this says where to go. */
function agentVerbs(a) {
  const key = "agent:" + a.session;
  const b = (label, call, cls) => `<button class="${cls ?? ""}" ${anyBusy() ? "disabled" : ""} onclick="${call}">${label}</button>`;
  const s = `'${js(a.session)}'`;
  return `<div class="links">
    ${b("note", `noteBox(${s})`)}
    ${b("diff", `openDiff(${s})`)}
    ${b("teleport", `teleport(${s},'${js(a.ticket ?? "")}')`)}
    ${b("cancel", `cancelAgent(${s},'${js(a.repo ?? "")}','${js(a.ticket ?? "")}')`, "bad")}
  </div>${busy(key) ? `<div class="dim-note">working…</div>` : ""}`;
}

/* One full-width row under the agent, carrying whatever it has open: the note
   box, the teleport lines, and what curia said about the last press. */
function agentBoxes(a) {
  const key = "agent:" + a.session;
  const parts = [
    UI.act.note === a.session ? noteBoxHtml(a) : "",
    UI.act.diff === a.session ? diffBoxHtml(a) : "",
    UI.act.tele === a.session ? teleportHtml(a) : "",
    said(key),
  ].filter(Boolean);
  if (!parts.length) return "";
  return `<tr><td colspan="9">${parts.join("")}</td></tr>`;
}

/* The two delivery modes, in ADR-0013's own words. Queued is the default and
   costs the agent nothing until its next tool result. Interrupt aborts the call
   in flight after a grace, which is why it is the one the operator has to
   choose. */
function noteBoxHtml(a) {
  const id = "note-" + a.session;
  const radio = (mode, label) => `<label><input type="radio" name="nm-${esc(a.session)}"
    ${UI.act.mode === mode ? "checked" : ""} onchange="noteMode('${mode}')"> ${esc(label)}</label>`;
  return `<div class="act-box">
    <div class="act-row"><input type="text" id="${esc(id)}" placeholder="say something to ${esc(a.session)}…"></div>
    <div class="act-row">
      ${radio("queue", "queue — it reads this with its next tool result")}
      ${radio("interrupt", "interrupt — a short grace, then the words land as a user turn")}
      <button class="btn sm primary" ${anyBusy() ? "disabled" : ""} onclick="sendNote('${js(a.session)}','${js(id)}')">Send</button>
    </div>
  </div>`;
}

/* The digest before the gate (#355). The same card the gate carries, on a live
   row, reading the same worktree — committed and uncommitted work together,
   because that is what the work so far means. You see the shape of the change
   while a note can still steer it. */
function diffBoxHtml(a) {
  const key = "agent:" + a.session;
  const q = agentDiffQuery(a.session);
  const d = diffState(key);
  if (!d.read) return `<div class="act-box"><div class="say">counting the work so far…</div></div>`;
  return `<div class="act-box">
    <div class="act-row"><button class="btn sm" ${d.loading ? "disabled" : ""} onclick="rereadDiff('${js(key)}','${js(q)}')">re-read</button>
      <span class="dim">a snapshot of the worktree, taken when you pressed</span></div>
    ${diffCard(key, d.digest, d.error, q, null)}</div>`;
}
