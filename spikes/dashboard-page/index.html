<title>curia — dashboard prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ---------- tokens: dark-first ---------- */
  :root {
    --bg: #111417;
    --bg-raise: #191e22;
    --bg-inset: #0c0f11;
    --line: #262d33;
    --ink: #dde3e0;
    --ink-dim: #8a94a6;
    --ink-faint: #5a6472;
    --accent: #4cc2a0;
    --accent-ink: #0c1512;
    --warn: #e0a83c;
    --bad: #d95f57;
    --ok: #4cc2a0;
    --idle: #8a94a6;
    --chip-warn-bg: #2b2114;
    --chip-bad-bg: #2b1715;
    --chip-ok-bg: #12241f;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f4f3; --bg-raise: #ffffff; --bg-inset: #e8ebe9;
      --line: #d5dad6; --ink: #1d2420; --ink-dim: #5b6570; --ink-faint: #8b939e;
      --accent: #157a5f; --accent-ink: #f2fdf9;
      --warn: #9a6a10; --bad: #b03a32; --ok: #157a5f; --idle: #5b6570;
      --chip-warn-bg: #f4e8cf; --chip-bad-bg: #f6ddda; --chip-ok-bg: #d9efe7;
      --shadow: 0 6px 24px rgba(30,40,35,.12);
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f4f3; --bg-raise: #ffffff; --bg-inset: #e8ebe9;
    --line: #d5dad6; --ink: #1d2420; --ink-dim: #5b6570; --ink-faint: #8b939e;
    --accent: #157a5f; --accent-ink: #f2fdf9;
    --warn: #9a6a10; --bad: #b03a32; --ok: #157a5f; --idle: #5b6570;
    --chip-warn-bg: #f4e8cf; --chip-bad-bg: #f6ddda; --chip-ok-bg: #d9efe7;
    --shadow: 0 6px 24px rgba(30,40,35,.12);
  }
  :root[data-theme="dark"] {
    --bg: #111417; --bg-raise: #191e22; --bg-inset: #0c0f11;
    --line: #262d33; --ink: #dde3e0; --ink-dim: #8a94a6; --ink-faint: #5a6472;
    --accent: #4cc2a0; --accent-ink: #0c1512;
    --warn: #e0a83c; --bad: #d95f57; --ok: #4cc2a0; --idle: #8a94a6;
    --chip-warn-bg: #2b2114; --chip-bad-bg: #2b1715; --chip-ok-bg: #12241f;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .mono, code { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shared atoms ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.working { color: var(--ok); background: var(--chip-ok-bg); }
  .pill.needs-you { color: var(--warn); background: var(--chip-warn-bg); }
  .pill.parked { color: var(--idle); background: var(--bg-inset); }
  .pill.reading { color: var(--ink-dim); background: var(--bg-inset); }
  .pill.cooling { color: var(--bad); background: var(--chip-bad-bg); }

  .bar { position: relative; height: 7px; border-radius: 4px; background: var(--bg-inset); overflow: hidden; min-width: 60px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .bar .fill.ok { background: var(--ok); } .bar .fill.warn { background: var(--warn); } .bar .fill.bad { background: var(--bad); }
  .bar .clock { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-dim); }
  .meter-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
  .meter-row .lbl { width: 2.2em; flex: none; font-family: ui-monospace, Menlo, monospace; }
  .meter-row .pct { width: 3em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .meter-row .bar { flex: 1; }

  .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
  .btn {
    border: 1px solid var(--line); background: var(--bg-raise); color: var(--ink);
    border-radius: 7px; padding: 6px 14px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
  .btn.sm { padding: 2px 8px; font-size: 12px; }

  .esc {
    border-left: 3px solid var(--warn); background: var(--chip-warn-bg);
    padding: 8px 10px; border-radius: 0 7px 7px 0; font-size: 13px;
  }
  .esc .kind { color: var(--warn); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .esc .age { color: var(--ink-dim); font-size: 12px; }

  .eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }

  /* feed */
  .feed-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed-list li { display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed-list li:last-child { border-bottom: 0; }
  .feed-list time { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding-top: 1px; }
  .feed-list .ev b { font-weight: 600; }
  .feed-list .tag { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-dim); }
  .feed-list li.warn .tag { color: var(--warn); }
  .feed-list li.bad .tag { color: var(--bad); }

  /* settings */
  .set-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .set-block { border: 1px solid var(--line); border-radius: 9px; background: var(--bg-raise); padding: 12px 14px; }
  .set-block h3 { font-size: 13px; margin-bottom: 8px; }
  .set-block .hint { font-size: 12px; color: var(--ink-dim); margin: 0 0 8px; }
  .set-block table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .set-block td, .set-block th { padding: 4px 6px 4px 0; text-align: left; vertical-align: middle; }
  .set-block th { color: var(--ink-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .set-block tr.inactive td { color: var(--ink-faint); }
  input[type=text], input[type=number], select {
    background: var(--bg-inset); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: 12.5px ui-monospace, Menlo, monospace; max-width: 100%;
  }
  input[type=number] { width: 4.5em; }
  input[type=checkbox] { accent-color: var(--accent); }
  .set-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .toast { font-size: 12.5px; color: var(--ink-dim); }
  .gh-connect { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 8px; }
  .gh-connect .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 172px 1fr; min-height: 100vh; }
  .shell nav { border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg-inset); }
  .shell nav .brand { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14px; padding: 0 10px 12px; }
  .shell nav button { text-align: left; border: 0; background: none; color: var(--ink-dim); padding: 8px 10px; border-radius: 7px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: baseline; }
  .shell nav button.on { background: var(--bg-raise); color: var(--ink); font-weight: 600; }
  .shell nav button .n { color: var(--warn); font-weight: 700; }
  .shell main { padding: 18px 22px; min-width: 0; }
  .shell main h2 { font-size: 15px; margin-bottom: 12px; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .screen-head h2 { margin-bottom: 0; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .shell nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; align-items: center; }
    .shell nav .brand { padding: 0 10px 0 4px; }
    .shell nav button { flex: none; gap: 6px; }
    .shell main { padding: 14px; }
  }

  /* segmented control */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg-raise); }
  .seg button { border: 0; background: none; color: var(--ink-dim); padding: 5px 12px; font-size: 12.5px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ---------- home ---------- */
  .band { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--bg-raise); }
  .band h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; color: var(--ink-faint); }
  .band.needs { border-color: var(--warn); background: var(--chip-warn-bg); }
  .band.needs h3 { color: var(--warn); }
  .band.limits { border-color: var(--bad); background: var(--chip-bad-bg); }
  .band.limits h3 { color: var(--bad); }
  .band-item { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 13.5px; padding: 3px 0; }
  .band-item .q { font-weight: 600; }
  .band-item .dim { color: var(--ink-dim); }
  .home-cols { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .home-cols { grid-template-columns: 1fr; } }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .sess { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 13.5px; }
  .card .ticket { font-size: 13px; }
  .card .ticket .t { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-right: 6px; }
  .card .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace; }
  .rail { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 12px 14px; }
  .rail h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .rail .more { display: block; margin-top: 8px; font-size: 12.5px; }

  /* ---------- home variations ---------- */
  .prov-strip { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 12px; color: var(--ink-dim); }
  .prov { display: flex; gap: 10px; align-items: center; }
  .prov > b { font-family: ui-monospace, Menlo, monospace; color: var(--ink); font-size: 12.5px; }
  .prov .meter-row .bar { flex: none; width: 76px; }
  .prov .pnote { color: var(--bad); font-family: ui-monospace, Menlo, monospace; }
  .h-sect { margin: 16px 0; }
  .h-sect > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 700; }
  .h-sect > h3 .hot { color: var(--warn); }
  .h-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
  .h-row:last-child { border-bottom: 0; }
  .h-row .dot { align-self: center; }
  .h-row .sess { font-weight: 700; }
  .h-row .ticket { flex: 1; min-width: 180px; color: var(--ink-dim); }
  .h-row .ctx { color: var(--ink-faint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.working { background: var(--ok); }
  .dot.needs-you { background: var(--warn); }
  .dot.reading, .dot.parked { background: var(--ink-faint); }
  .att-item { border-left: 3px solid var(--warn); background: var(--chip-warn-bg); border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 13px; margin-bottom: 8px; }
  .att-item .who { font-family: ui-monospace, Menlo, monospace; font-weight: 700; margin-right: 8px; }
  .att-item .dim { color: var(--ink-dim); font-size: 12px; }
  .att-item .links { margin-top: 5px; }
  .att-item.limit { border-left-color: var(--bad); background: var(--chip-bad-bg); }
  .stat-tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 4px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 12px 14px; }
  .tile .v { font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .tile .l { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin-top: 2px; }
  .tile.warn { border-color: var(--warn); } .tile.warn .v { color: var(--warn); }
  .split-cols { display: grid; grid-template-columns: 5fr 7fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .split-cols { grid-template-columns: 1fr; } }
  .ticker { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-dim); }
  .ticker time { color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-right: 8px; }
  .qcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .qcard { border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raise); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
  .qcard.hot { border-color: var(--warn); }
  .qcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .qcard .sess { font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 13px; }
  .qcard .state { font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px; }
  .qcard .state.hot { color: var(--warn); font-weight: 600; }
  .qcard .ticket { font-size: 12.5px; color: var(--ink-dim); }
  .qcard .ticket .t { font-family: ui-monospace, Menlo, monospace; margin-right: 5px; }
  .loglines { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--ink-dim); display: flex; flex-direction: column; }
  .loglines .h-row { font-size: 12.5px; }

  /* ---------- agents table ---------- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; }
  table.agents { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px; background: var(--bg-raise); }
  table.agents th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.agents td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.agents tr:last-child td { border-bottom: 0; }
  table.agents .sess { font-family: ui-monospace, Menlo, monospace; font-weight: 700; white-space: nowrap; }
  .esc-row td { background: var(--chip-warn-bg); }
  .statusbar { display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 14px; font-family: ui-monospace, Menlo, monospace; flex-wrap: wrap; }

  /* ---------- frontier: tree ---------- */
  .fr-repo { margin-bottom: 14px; }
  .fr-repo > .eyebrow { margin-bottom: 6px; display: block; }
  .fr-node {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: var(--bg-raise); border-radius: 7px; padding: 7px 10px; font-size: 13px;
  }
  .fr-node .t { font-family: ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-right: 6px; }
  .fr-node .typ { float: right; font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; margin-left: 8px; }
  .fr-kids { margin: 0 0 10px 14px; padding-left: 14px; border-left: 1px dashed var(--line); }
  .fr-kid { position: relative; margin-top: 6px; font-size: 12.5px; color: var(--ink-dim); }
  .fr-kid::before { content: "└─"; position: absolute; left: -16px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .fr-kid .t { font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }
  .fr-group { margin-bottom: 10px; }

  /* ---------- frontier: columns ---------- */
  .frc-head { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-bottom: 6px; }
  .frc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-bottom: 12px; }
  .frc-left { position: relative; }
  .frc-left::after {
    content: ""; position: absolute; right: -26px; top: 50%; width: 26px; height: 1px;
    background: var(--line);
  }
  .frc-left.no-kids::after { display: none; }
  .frc-kids { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .frc-kid {
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg-inset);
    padding: 6px 10px; font-size: 12.5px; color: var(--ink-dim); position: relative;
  }
  .frc-kid::before { content: ""; position: absolute; left: -14px; top: 50%; width: 14px; height: 1px; background: var(--line); }
  .frc-kid .t { margin-right: 6px; color: var(--ink-faint); }
  .frc-none { color: var(--ink-faint); font-size: 12.5px; align-self: center; }
  @media (max-width: 700px) {
    .frc-head { display: none; }
    .frc-row { grid-template-columns: 1fr; gap: 8px; }
    .frc-left::after, .frc-kid::before { display: none; }
    .frc-kids { margin-left: 18px; }
  }

  /* ---------- frontier: filter bar ---------- */
  .frx-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .frx-filter .fchip {
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg-raise);
    color: var(--ink-dim); padding: 3px 12px; font-size: 12.5px;
  }
  .frx-filter .fchip.on { border-color: var(--accent); color: var(--accent); background: var(--chip-ok-bg); font-weight: 600; }
  .frx-filter select { padding: 3px 8px; }
  .frx-filter .sep { color: var(--ink-faint); }

  /* ---------- frontier: cards ---------- */
  .frx-sect { margin: 4px 0 18px; }
  .frx-sect > .eyebrow { display: block; margin-bottom: 8px; }
  .frx-big { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .frx-card {
    border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 10px;
    background: var(--bg-raise); padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px;
  }
  .frx-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .frx-card .t { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--accent); }
  .frx-card .typ { font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }
  .frx-card .title { font-size: 13.5px; font-weight: 600; }
  .frx-card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-dim); font-family: ui-monospace, Menlo, monospace; }
  .frx-dim { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .frx-dimcard {
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg-inset);
    padding: 8px 11px; font-size: 12.5px; color: var(--ink-dim); opacity: .8;
  }
  .frx-dimcard .t { font-family: ui-monospace, Menlo, monospace; margin-right: 5px; }
  .frx-dimcard .from { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-faint); font-family: ui-monospace, Menlo, monospace; }

  /* ---------- frontier: graph ---------- */
  .frg-wrap { position: relative; }
  .frg-svg { position: absolute; inset: 0; pointer-events: none; }
  .frg-band { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; }
  .frg-band.kids { margin-top: 56px; }
  .frg-node {
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
    background: var(--bg-raise); padding: 8px 12px; font-size: 13px; max-width: 240px;
  }

function frGraph(repos) {

  return `<div class="frg-wrap" id="frg-wrap"><svg class="frg-svg" id="frg-svg"></svg>
    <div class="frg-band">${bigs.map(n => `<div class="frg-node" data-node="${n.repo}${n.t}">
      <span class="t">${n.t}</span>${escT(n.title)}<span class="repo">${n.repo} · ${n.typ}</span></div>`).join("")}</div>
    <div class="frg-band kids">${kids.map(k => `<div class="frg-node kid" data-kid-of="${k.repo}${k.from}">
      <span class="t">${k.t}</span>${escT(k.title)}</div>`).join("")}</div></div>`;
}
function drawEdges() {
  const wrap = document.getElementById("frg-wrap");
  if (!wrap) return;
  const svg = document.getElementById("frg-svg");
  const wr = wrap.getBoundingClientRect();
  svg.setAttribute("width", wr.width); svg.setAttribute("height", wr.height);
  let paths = "";
  wrap.querySelectorAll("[data-kid-of]").forEach(k => {
    const p = wrap.querySelector(`[data-node="${CSS.escape(k.dataset.kidOf)}"]`);
    if (!p) return;
    const pr = p.getBoundingClientRect(), kr = k.getBoundingClientRect();
    const x1 = pr.left - wr.left + pr.width / 2, y1 = pr.bottom - wr.top;
    const x2 = kr.left - wr.left + kr.width / 2, y2 = kr.top - wr.top;
    const my = (y1 + y2) / 2;
    paths += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
  });
  svg.innerHTML = paths;
}
window.addEventListener("resize", drawEdges);

function frFiltered() {
  return FRONTIER
    .filter(r => frFilter.repo === "all" || r.repo === frFilter.repo)
    .map(r => ({ ...r, nodes: r.nodes.filter(n => frFilter.typ === "all" || n.typ === frFilter.typ) }))
    .filter(r => r.nodes.length);
}
function screenFrontier() {
  const types = [...new Set(FRONTIER.flatMap(r => r.nodes.map(n => n.typ)))];
  return `<div class="screen-head"><h2>Frontier — two levels</h2>
    <span class="seg">${Object.entries(FR_VARIANTS).map(([k, v]) =>
      `<button class="${frVariant === k ? "on" : ""}" onclick="frVariant='${k}';render()">${v[0]}</button>`).join("")}</span></div>
    <div class="frx-filter">
      <button class="fchip ${frFilter.repo === "all" ? "on" : ""}" onclick="frFilter.repo='all';render()">all projects</button>
      ${FRONTIER.map(r => `<button class="fchip ${frFilter.repo === r.repo ? "on" : ""}"
        onclick="frFilter.repo='${r.repo}';render()">${r.repo.split("/")[1]}</button>`).join("")}
      <span class="sep">·</span>
      <select onchange="frFilter.typ=this.value;render()">
        <option value="all" ${frFilter.typ === "all" ? "selected" : ""}>all types</option>
        ${types.map(t => `<option ${frFilter.typ === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
    </div>
    ${FR_VARIANTS[frVariant][1](frFiltered())}`;
}

function screenFeed() {
  return `<h2>Feed</h2><div style="max-width:640px">${feedList(FEED)}</div>`;
}

function screenSettings() {
  const act = activeModels();
  return `<h2>Settings</h2>
  <div class="set-grid">
    <div class="set-block"><h3>Models</h3>
      <p class="hint">All models the harnesses can reach. Active models join the dispatch vocabulary.</p>
      <table><tr><th>active</th><th>model</th><th>harness</th></tr>
      ${MODELS.map((m, i) => `<tr class="${m.active ? "" : "inactive"}">
        <td><input type="checkbox" ${m.active ? "checked" : ""} onchange="MODELS[${i}].active=this.checked;render()"></td>
        <td class="mono">${m.id}</td><td class="mono">${m.harness}</td></tr>`).join("")}
      </table>
      <table style="margin-top:10px"><tr><th>ticket type</th><th>default model</th></tr>
      ${DEFAULTS.map((d, i) => `<tr><td class="mono">${d.type}</td>
        <td><select onchange="DEFAULTS[${i}].model=this.value">${act.map(m =>
          `<option ${m.id === d.model ? "selected" : ""}>${m.id}</option>`).join("")}
          ${act.some(m => m.id === d.model) ? "" : `<option selected>${d.model} (inactive)</option>`}</select></td></tr>`).join("")}
      </table></div>
    <div class="set-block"><h3>Projects</h3>
      <div class="gh-connect"><span class="dot"></span>GitHub connected as <b class="mono">${GH.login}</b> <a href="#">manage</a></div>
      <table>${GH.projects.map(p => `<tr><td class="mono">${p}</td><td style="text-align:right"><button class="btn sm">remove</button></td></tr>`).join("")}
      <tr><td><select><option>add a repo…</option>${GH.repos.filter(r => !GH.projects.includes(r)).map(r => `<option>${r}</option>`).join("")}</select></td>
      <td style="text-align:right"><button class="btn sm">add</button></td></tr></table></div>
    <div class="set-block"><h3>Dispatch</h3>
      <table><tr><td>max_concurrent</td><td><input type="number" value="${SETTINGS.maxConcurrent}"></td></tr>
      <tr><td>nudge (minutes)</td><td><input type="number" value="${SETTINGS.nudgeMin}"></td></tr></table></div>
  </div>
  <div class="set-actions">
    <button class="btn primary" onclick="fakeSave()">Save to curia.yaml</button>
    <button class="btn danger" onclick="fakeRestart()">Restart daemon</button>
    <span class="toast" id="toast"></span>
  </div>`;
}
function fakeSave() {
  document.getElementById("toast").textContent = "Validated with the daemon loaders. Written atomically. Comments kept.";
}
function fakeRestart() {
  if (!confirm("Restart the daemon? Running agents keep their tmux sessions.")) return;
  document.getElementById("toast").textContent = "Daemon exits nonzero. The supervisor respawns it. This page serves the last snapshot.";
}

/* ================= shell ================= */
const SCREENS = {
  home: ["Home", screenHome],
  agents: ["Agents", screenAgents],
  frontier: ["Frontier", screenFrontier],
  feed: ["Feed", screenFeed],
  settings: ["Settings", screenSettings]
};
const _h = new URLSearchParams(location.hash.slice(1));
let screen = SCREENS_KEYS(_h.get("s"));
frVariant = FR_VARIANTS[_h.get("f")] ? _h.get("f") : frVariant;
homeVariant = HOME_VARIANTS[_h.get("h")] ? _h.get("h") : homeVariant;
function SCREENS_KEYS(s) { return ["home","agents","frontier","feed","settings"].includes(s) ? s : "home"; }
function render() {
  const ny = needsYou().length;
  document.getElementById("app").innerHTML = `<div class="shell">
    <nav><span class="brand">curia</span>
      ${Object.entries(SCREENS).map(([k, v]) =>
        `<button class="${screen === k ? "on" : ""}" onclick="goto('${k}')">${v[0]}${k === "home" && ny ? ` <span class="n">${ny}</span>` : ""}</button>`).join("")}
    </nav>
    <main>${SCREENS[screen][1]()}</main>
  </div>`;
  document.title = (ny ? `(${ny}) ` : "") + "curia — dashboard prototype";
  requestAnimationFrame(drawEdges);
}
render();
</script>
