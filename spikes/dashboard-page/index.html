}
function bar(lbl, b) {

  return `<div class="meter-row"><span class="lbl">ctx</span>

function agentLinks(a) {

    <a href="${L.thread}">thread</a></div>`;
}
function escBlock(a) {
  if (!a.esc) return "";
  return `<div class="esc"><span class="kind">${a.esc.kind}</span> <span class="age">· open ${a.esc.age}</span><br>${esc(a.esc.q)}
    <div class="links" style="margin-top:6px"><a href="#">answer in thread</a><a href="#">open timeline</a></div></div>`;
}
function feedList(items) {
  return `<ul class="feed-list">${items.map(f =>
    `<li class="${f.cls}"><time>${f.t}</time><span class="ev"><span class="tag">${f.tag}</span> — ${f.ev}</span></li>`).join("")}</ul>`;
}
function frontierRepo(r) {
  return `<div class="fr-repo"><span class="eyebrow mono">${r.repo}</span>
    ${r.nodes.map(n => `<div class="fr-group"><div class="fr-node"><span class="typ">${n.typ}</span><span class="t">${n.t}</span>${esc(n.title)}</div>
      ${n.kids.length ? `<div class="fr-kids">${n.kids.map(k => `<div class="fr-kid"><span class="t">${k.t}</span>${esc(k.title)}</div>`).join("")}</div>` : ""}
    </div>`).join("")}</div>`;
}
function settingsForm(idPrefix) {
  return `<div class="set-grid">
    <div class="set-block"><h3>Model routing</h3>
      <table><tr><th>label</th><th>model id</th><th>harness</th></tr>
      ${SETTINGS.routing.map(r => `<tr><td class="mono">${r.label}</td><td><input type="text" value="${r.id}" size="16"></td><td class="mono">${r.harness}</td></tr>`).join("")}
      </table>
      <table style="margin-top:8px"><tr><th>ticket type</th><th>default label</th></tr>
      ${SETTINGS.defaults.map(d => `<tr><td class="mono">${d.type}</td><td><select>${SETTINGS.routing.map(r => `<option ${r.label===d.label?"selected":""}>${r.label}</option>`).join("")}</select></td></tr>`).join("")}
      </table></div>
    <div class="set-block"><h3>Dispatch</h3>
      <table><tr><td>max_concurrent</td><td><input type="number" value="${SETTINGS.maxConcurrent}"></td></tr>
      <tr><td>nudge (minutes)</td><td><input type="number" value="${SETTINGS.nudgeMin}"></td></tr></table></div>
    <div class="set-block"><h3>Watch list</h3>
      <table>${SETTINGS.watch.map(w => `<tr><td><input type="text" value="${w}" size="18"></td><td><button class="btn" style="padding:2px 8px;font-size:12px">remove</button></td></tr>`).join("")}
      <tr><td><input type="text" placeholder="owner/repo" size="18"></td><td><button class="btn" style="padding:2px 8px;font-size:12px">add</button></td></tr></table></div>
  </div>
  <div class="set-actions">
    <button class="btn primary" onclick="fakeSave('${idPrefix}')">Save to curia.yaml</button>
    <button class="btn danger" onclick="fakeRestart('${idPrefix}')">Restart daemon</button>
    <span class="toast" id="${idPrefix}-toast"></span>
  </div>`;
}
function fakeSave(p) {
  document.getElementById(p + "-toast").textContent = "Validated with the daemon loaders. Written atomically. Comments kept.";
}
function fakeRestart(p) {
  const t = document.getElementById(p + "-toast");
  if (!confirm("Restart the daemon? Running agents keep their tmux sessions.")) return;
  t.textContent = "Daemon exits nonzero. The supervisor respawns it. This page serves the last snapshot.";
}
const needsYou = () => AGENTS.filter(a => a.esc);

/* ================= variant A: fleet ================= */
function renderA(root) {
  const ny = needsYou();
  root.innerHTML = `<div class="vA">
    <header><h1>curia</h1><span class="sub num">4 agents · 2 repos · reconcile clean · 13:12</span></header>
    ${ny.length ? `<div class="needs-band"><h2>Needs you (${ny.length})</h2>
      ${ny.map(a => `<div class="needs-item"><span class="mono"><b>${a.sess}</b></span>
        <span class="q">${esc(a.esc.q)}</span><span class="esc-age" style="color:var(--ink-dim)">open ${a.esc.age}</span>
        <a href="#">answer</a></div>`).join("")}</div>` : ""}
    <div class="vA-cols">
      <div class="cards">
        ${AGENTS.map(a => `<div class="card">
          <div class="top"><span class="sess">${a.sess}</span>${statePill(a)}</div>
          <div class="ticket"><span class="t">${a.ticket}</span>${esc(a.title)}</div>
          <div class="facts"><span>${a.repo.split("/")[1]}</span><span>${a.model}</span><span>${paceSq(a.bars.h5.pace)} 5h ${a.bars.h5.pct}%</span></div>
          ${meters(a)}
          ${escBlock(a)}
          ${agentLinks(a)}
        </div>`).join("")}
      </div>
      <aside class="rail"><h2>Feed</h2>${feedList(FEED)}</aside>
    </div>
    <section class="wide"><h2>Frontier — two levels</h2><div class="fr-flex">${FRONTIER.map(frontierRepo).join("")}</div></section>
    <section class="wide"><h2>Settings</h2>${settingsForm("a")}</section>
  </div>`;
}

/* ================= variant B: wire ================= */
function renderB(root) {
  const escFeed = needsYou().map(a =>
    `<li class="warn"><time>now</time><span class="ev"><span class="tag">open question</span> — <b>${a.sess}</b>${escBlock(a)}</span></li>`).join("");
  root.innerHTML = `<div class="vB">
    <header><h1>curia — the wire</h1><span class="sub num">4 agents · 13:12 reconcile clean</span></header>
    <div class="strip">
      ${AGENTS.map(a => `<div class="chip ${a.esc ? "alert" : ""}">
        <span class="sess">${a.sess}</span>${statePill(a)}
        <div class="meter-row" style="margin-top:5px"><span class="lbl">ctx</span><span class="bar"><span class="fill ok" style="width:${a.ctx}%"></span></span><span class="pct num">${a.ctx}%</span></div>
        <div class="links" style="margin-top:5px"><a href="#">attach</a><a href="#">timeline</a>${a.links.pr ? `<a href="#">PR</a>` : ""}</div>
      </div>`).join("")}
    </div>
    <div class="spine">
      <h2>Open questions</h2>
      <ul class="feed-list">${escFeed || `<li><time></time><span class="ev" style="color:var(--ink-dim)">none — nothing waits on you</span></li>`}</ul>
      <h2>Feed</h2>
      ${feedList(FEED)}
      <details><summary>Frontier — two levels</summary><div class="inner">${FRONTIER.map(frontierRepo).join("")}</div></details>
      <details><summary>Settings</summary><div class="inner">${settingsForm("b")}</div></details>
    </div>
  </div>`;
}

/* ================= variant C: console ================= */
let cScreen = "agents";
function renderC(root) {
  const ny = needsYou().length;
  const screens = { agents: "Agents", frontier: "Frontier", feed: "Feed", settings: "Settings" };
  let body = "";
  if (cScreen === "agents") {
    body = `<h2>Agents</h2>
    <div class="statusbar num"><span>agents 4/${SETTINGS.maxConcurrent + 1}</span><span>🟨 anthropic 5h 58%</span><span>🟥 openai 5h 62%</span><span>cooling: none</span></div>
    <div class="tbl-wrap"><table class="agents">
      <tr><th>session</th><th>state</th><th>ticket</th><th>model</th><th>ctx</th><th>5h</th><th>7d</th><th>links</th></tr>
      ${AGENTS.map(a => `<tr class="${a.esc ? "esc-row" : ""}">
        <td class="sess">${a.sess}</td><td>${statePill(a)}</td>
        <td><span class="mono" style="color:var(--ink-dim)">${a.ticket}</span> ${esc(a.title)}${a.esc ? `<div class="esc" style="margin-top:6px">${esc(a.esc.q)} <span class="age">· ${a.esc.age}</span></div>` : ""}</td>
        <td class="mono">${a.model}</td>
        <td class="num">${a.ctx}%</td><td class="num">${paceSq(a.bars.h5.pace)} ${a.bars.h5.pct}%</td><td class="num">${paceSq(a.bars.d7.pace)} ${a.bars.d7.pct}%</td>
        <td>${agentLinks(a)}</td></tr>`).join("")}
    </table></div>`;
  } else if (cScreen === "frontier") {
    body = `<h2>Frontier — two levels</h2>${FRONTIER.map(frontierRepo).join("")}`;
  } else if (cScreen === "feed") {
    body = `<h2>Feed</h2><div style="max-width:640px">${feedList(FEED)}</div>`;
  } else {
    body = `<h2>Settings</h2>${settingsForm("c")}`;
  }
  root.innerHTML = `<div class="vC">
    <nav><span class="brand">curia</span>
      ${Object.entries(screens).map(([k, v]) =>
        `<button class="${cScreen === k ? "on" : ""}" onclick="cScreen='${k}';render()">${v}${k === "agents" && ny ? ` <span class="n">${ny}</span>` : ""}</button>`).join("")}
    </nav>
    <main>${body}</main>
  </div>`;
}

/* ================= switcher ================= */
const VARIANTS = { A: ["Fleet", renderA], B: ["Wire", renderB], C: ["Console", renderC] };
const KEYS = Object.keys(VARIANTS);
function currentVariant() {
  const q = new URLSearchParams(location.search).get("variant");
  const h = (location.hash.match(/v=([A-C])/) || [])[1];
  const v = (q || h || "A").toUpperCase();
  return KEYS.includes(v) ? v : "A";
}
function setVariant(v) {
  try {
    if (location.protocol.startsWith("http")) {
      const u = new URL(location); u.searchParams.set("variant", v); history.replaceState(null, "", u);
    } else { location.hash = "v=" + v; }
  } catch (e) { location.hash = "v=" + v; }
  render();
}
function render() {
  const v = currentVariant();
  VARIANTS[v][1](document.getElementById("app"));
  document.getElementById("sw-label").textContent = `${v} — ${VARIANTS[v][0]}`;
  const ny = needsYou().length;
  document.title = (ny ? `(${ny}) ` : "") + "curia — dashboard prototype";
}
function cycle(d) {
  const i = (KEYS.indexOf(currentVariant()) + d + KEYS.length) % KEYS.length;
  setVariant(KEYS[i]);
}
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.matches("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
window.addEventListener("hashchange", render);
render();
</script>
