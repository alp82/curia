}
function bar(lbl, b) {
  const cls = b.pace === "ahead" ? "bad" : b.pace === "on" ? "warn" : "ok";
  return `<div class="meter-row"><span class="lbl">${lbl}</span>
    <span class="bar"><span class="fill ${cls}" style="width:${b.pct}%"></span><span class="clock" style="left:${b.clock}%"></span></span>
    <span class="pct num">${b.pct}%</span></div>`;
}
function meters(a) {
  return `<div class="meter-row"><span class="lbl">ctx</span>
      <span class="bar"><span class="fill ${a.ctx > 80 ? "warn" : "ok"}" style="width:${Math.min(a.ctx,100)}%"></span></span>
      <span class="pct num">${a.ctx}%</span></div>
    ${bar("5h", a.bars.h5)}${bar("7d", a.bars.d7)}`;
}
function agentLinks(a) {
  const L = a.links;
  return `<div class="links">
    <a href="${L.attach}">attach</a><a href="${L.timeline}">timeline</a>
    ${L.preview ? `<a href="#">preview ${L.preview}</a>` : ""}
    ${L.pr ? `<a href="#">PR ${L.pr}</a>` : `<span style="color:var(--ink-faint)">no PR yet</span>`}
    <a href="${L.thread}">thread</a></div>`;
}
function escBlock(a) {
  if (!a.esc) return "";
  return `<div class="esc"><span class="kind">${a.esc.kind}</span> <span class="age">· open ${a.esc.age}</span><br>${escT(a.esc.q)}
    <div class="links" style="margin-top:6px"><a href="#">answer in thread</a><a href="#">open timeline</a></div></div>`;
}
function feedList(items) {
  return `<ul class="feed-list">${items.map(f =>
    `<li class="${f.cls}"><time>${f.t}</time><span class="ev"><span class="tag">${f.tag}</span> — ${f.ev}</span></li>`).join("")}</ul>`;
}
const needsYou = () => AGENTS.filter(a => a.esc);
const activeModels = () => MODELS.filter(m => m.active);
const goto = (s) => { screen = s; render(); };

/* ================= screens ================= */
function screenHome() {
  const ny = needsYou();
  return `
    ${ny.length ? `<div class="band needs"><h3>Needs you (${ny.length})</h3>
      ${ny.map(a => `<div class="band-item"><span class="mono"><b>${a.sess}</b></span>
        <span class="q">${escT(a.esc.q)}</span><span class="dim">open ${a.esc.age}</span>
        <a href="#">answer</a><a href="#" onclick="goto('agents');return false">agent</a></div>`).join("")}</div>` : ""}
    ${LIMITS.length ? `<div class="band limits"><h3>Approaching limits</h3>
      ${LIMITS.map(l => `<div class="band-item"><span class="mono">${paceSq(l.pace)} <b>${l.provider}</b> ${l.win} ${l.pct}%</span>
        <span class="dim">${l.note}</span>
        <a href="#" onclick="goto('agents');return false">who burns it</a></div>`).join("")}</div>` : ""}
    <div class="home-cols">
      <div class="cards">
        ${AGENTS.map(a => `<div class="card">
          <div class="top"><span class="sess">${a.sess}</span>${statePill(a)}</div>
          <div class="ticket"><span class="t">${a.ticket}</span>${escT(a.title)}</div>
          <div class="facts"><span>${a.repo.split("/")[1]}</span><span>${a.model}</span><span>${paceSq(a.bars.h5.pace)} 5h ${a.bars.h5.pct}%</span></div>
          ${meters(a)}
          ${escBlock(a)}
          ${agentLinks(a)}
        </div>`).join("")}
      </div>
      <aside class="rail"><h3>Last events</h3>${feedList(FEED.slice(0, 5))}
        <a class="more" href="#" onclick="goto('feed');return false">all events →</a></aside>
    </div>`;
}

function screenAgents() {
  return `<h2>Agents</h2>
    <div class="statusbar num"><span>agents 4/${SETTINGS.maxConcurrent + 1}</span><span>🟨 anthropic 5h 58%</span><span>🟥 openai 5h 62%</span><span>cooling: none</span></div>
    <div class="tbl-wrap"><table class="agents">
      <tr><th>session</th><th>state</th><th>ticket</th><th>model</th><th>ctx</th><th>5h</th><th>7d</th><th>links</th></tr>
      ${AGENTS.map(a => `<tr class="${a.esc ? "esc-row" : ""}">
        <td class="sess">${a.sess}</td><td>${statePill(a)}</td>
        <td><span class="mono" style="color:var(--ink-dim)">${a.ticket}</span> ${escT(a.title)}${a.esc ? `<div class="esc" style="margin-top:6px">${escT(a.esc.q)} <span class="age">· ${a.esc.age}</span></div>` : ""}</td>
        <td class="mono">${a.model}</td>
        <td class="num">${a.ctx}%</td><td class="num">${paceSq(a.bars.h5.pace)} ${a.bars.h5.pct}%</td><td class="num">${paceSq(a.bars.d7.pace)} ${a.bars.d7.pct}%</td>
        <td>${agentLinks(a)}</td></tr>`).join("")}
    </table></div>`;
}

/* --- frontier variations --- */
function frTree(r) {
  return `<div class="fr-repo"><span class="eyebrow mono">${r.repo}</span>
    ${r.nodes.map(n => `<div class="fr-group"><div class="fr-node"><span class="typ">${n.typ}</span><span class="t">${n.t}</span>${escT(n.title)}</div>
      ${n.kids.length ? `<div class="fr-kids">${n.kids.map(k => `<div class="fr-kid"><span class="t">${k.t}</span>${escT(k.title)}</div>`).join("")}</div>` : ""}
    </div>`).join("")}</div>`;
}
function frColumns(r) {
  return `<div class="fr-repo"><span class="eyebrow mono">${r.repo}</span>
    <div class="frc-head"><span class="eyebrow">takeable now</span><span class="eyebrow">unblocked by it</span></div>
    ${r.nodes.map(n => `<div class="frc-row">
      <div class="frc-left ${n.kids.length ? "" : "no-kids"}"><div class="fr-node"><span class="typ">${n.typ}</span><span class="t">${n.t}</span>${escT(n.title)}</div></div>
      ${n.kids.length
        ? `<div class="frc-kids">${n.kids.map(k => `<div class="frc-kid"><span class="t mono">${k.t}</span>${escT(k.title)}</div>`).join("")}</div>`
        : `<div class="frc-none">unblocks nothing yet</div>`}
    </div>`).join("")}</div>`;
}
function frRail(r) {
  return `<div class="fr-repo"><span class="eyebrow mono">${r.repo}</span>
    ${r.nodes.map(n => `<div class="frr-row">
      <span class="frr-node"><span class="t">${n.t}</span>${escT(n.title)}</span>
      ${n.kids.length ? `<span class="frr-arrow">─▶</span>` : ""}
      ${n.kids.map(k => `<span class="frr-kid"><span class="t">${k.t}</span>${escT(k.title)}</span>`).join("")}
    </div>`).join("")}</div>`;
}
const FR_VARIANTS = { tree: ["Tree", frTree], columns: ["Columns", frColumns], rail: ["Rail", frRail] };
let frVariant = "tree";
function screenFrontier() {
  return `<div class="screen-head"><h2>Frontier — two levels</h2>
    <span class="seg">${Object.entries(FR_VARIANTS).map(([k, v]) =>
      `<button class="${frVariant === k ? "on" : ""}" onclick="frVariant='${k}';render()">${v[0]}</button>`).join("")}</span></div>
    ${FRONTIER.map(FR_VARIANTS[frVariant][1]).join("")}`;
}

function screenFeed() {
  return `<h2>Feed</h2><div style="max-width:640px">${feedList(FEED)}</div>`;
}

function screenSettings() {
  const act = activeModels();
  return `<h2>Settings</h2>
  <div class="set-grid">
    <div class="set-block"><h3>Models</h3>
      <p class="hint">All models the harnesses can reach. Active models join the dispatch vocabulary.</p>
      <table><tr><th>active</th><th>model</th><th>harness</th></tr>
      ${MODELS.map((m, i) => `<tr class="${m.active ? "" : "inactive"}">
        <td><input type="checkbox" ${m.active ? "checked" : ""} onchange="MODELS[${i}].active=this.checked;render()"></td>
        <td class="mono">${m.id}</td><td class="mono">${m.harness}</td></tr>`).join("")}
      </table>
      <table style="margin-top:10px"><tr><th>ticket type</th><th>default model</th></tr>
      ${DEFAULTS.map((d, i) => `<tr><td class="mono">${d.type}</td>
        <td><select onchange="DEFAULTS[${i}].model=this.value">${act.map(m =>
          `<option ${m.id === d.model ? "selected" : ""}>${m.id}</option>`).join("")}
          ${act.some(m => m.id === d.model) ? "" : `<option selected>${d.model} (inactive)</option>`}</select></td></tr>`).join("")}
      </table></div>
    <div class="set-block"><h3>Projects</h3>
      <div class="gh-connect"><span class="dot"></span>GitHub connected as <b class="mono">${GH.login}</b> <a href="#">manage</a></div>
      <table>${GH.projects.map(p => `<tr><td class="mono">${p}</td><td style="text-align:right"><button class="btn sm">remove</button></td></tr>`).join("")}
      <tr><td><select><option>add a repo…</option>${GH.repos.filter(r => !GH.projects.includes(r)).map(r => `<option>${r}</option>`).join("")}</select></td>
      <td style="text-align:right"><button class="btn sm">add</button></td></tr></table></div>
    <div class="set-block"><h3>Dispatch</h3>
      <table><tr><td>max_concurrent</td><td><input type="number" value="${SETTINGS.maxConcurrent}"></td></tr>
      <tr><td>nudge (minutes)</td><td><input type="number" value="${SETTINGS.nudgeMin}"></td></tr></table></div>
  </div>
  <div class="set-actions">
    <button class="btn primary" onclick="fakeSave()">Save to curia.yaml</button>
    <button class="btn danger" onclick="fakeRestart()">Restart daemon</button>
    <span class="toast" id="toast"></span>
  </div>`;
}
function fakeSave() {
  document.getElementById("toast").textContent = "Validated with the daemon loaders. Written atomically. Comments kept.";
}
function fakeRestart() {
  if (!confirm("Restart the daemon? Running agents keep their tmux sessions.")) return;
  document.getElementById("toast").textContent = "Daemon exits nonzero. The supervisor respawns it. This page serves the last snapshot.";
}

/* ================= shell ================= */
const SCREENS = {
  home: ["Home", screenHome],
  agents: ["Agents", screenAgents],
  frontier: ["Frontier", screenFrontier],
  feed: ["Feed", screenFeed],
  settings: ["Settings", screenSettings]
};
const _h = new URLSearchParams(location.hash.slice(1));
let screen = SCREENS_KEYS(_h.get("s"));
frVariant = FR_VARIANTS[_h.get("f")] ? _h.get("f") : frVariant;
function SCREENS_KEYS(s) { return ["home","agents","frontier","feed","settings"].includes(s) ? s : "home"; }
function render() {
  const ny = needsYou().length;
  document.getElementById("app").innerHTML = `<div class="shell">
    <nav><span class="brand">curia</span>
      ${Object.entries(SCREENS).map(([k, v]) =>
        `<button class="${screen === k ? "on" : ""}" onclick="goto('${k}')">${v[0]}${k === "home" && ny ? ` <span class="n">${ny}</span>` : ""}</button>`).join("")}
    </nav>
    <main>${SCREENS[screen][1]()}</main>
  </div>`;
  document.title = (ny ? `(${ny}) ` : "") + "curia — dashboard prototype";
}
render();
</script>
