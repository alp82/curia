# The box's supervisor (#259, executed by #260). Five services since #327, all
# built locally. Four run on the host network. The overseer does not, and the
# comment on that service says why. systemd and /etc/sudoers.d/curia retired.
#
# THE DEPLOY RULE OUTRANKS THE RESTART FLAGS: `docker compose up -d` recreates
# any changed service, and a recreated `tmux` service kills every live agent
# (wayfinder #132 in compose clothes). A deploy names its targets:
#
#     docker compose up -d --build --no-deps daemon dashboard overseer
#
# Recreating `tmux`/`ttyd` is a deliberate act at zero live agents.
#
# Interpolated variables come from an uncommitted `.env` file beside this one.
# `DOCKER_GID` is the host's `docker` group id — read it with
# `getent group docker | cut -d: -f3`.
#
# THE TWO ROOTS ARE VARIABLES, NOT THIS BOX'S PATHS (#473). `CURIA_REPO_ROOT` is
# the checkout and `CURIA_WORKSPACE_ROOT` is `dispatch.workspace_root` from
# config/curia.yaml. They move independently, so they are two keys and not one.
# A box that says neither takes this box's answers, which is what keeps the
# deploy of this change a deploy rather than an ssh session.
#
# A wrong workspace root is the one mount error nothing would notice: the daemon
# writes its worktrees where no mount covers, so they land inside the container
# and die with it. So every service that reads curia.yaml is handed
# `CURIA_WORKSPACE_ROOT` back, and the daemon refuses to boot when the two
# disagree (daemon/src/config.mjs).
#
# CURIA OWNS ITS HOME AND NEVER THE OPERATOR'S (#473). HOME is `home/` inside
# the workspace root, so the four trees the containers used to take out of
# `/home/alp` — `.claude`, `.codex`, `.config/gh`, `.gitconfig` — are curia's own
# now. It needs no mount of its own: it rides the workspace mount that is
# already there. Seed it before the first `up`, the way docs/deploy.md says.

name: curia

# THE NODE PIN (ruled by #357, first value applied by #409). One patch version
# runs every curia image, and this anchor is that version for the three images
# built here. The fourth is the agent image, pinned by `sandbox.node_version` in
# config/curia.yaml. Move both in one commit.
#
# It is an anchor and not an interpolated variable on purpose: the pin is
# committed, and `.env` beside this file is not. No Dockerfile carries a default
# for it, so a build that forgets the arg fails rather than picking a Node.
#
# The journal runs on `node:sqlite`, which Node marks Stability 1.2, so a patch
# update can change the API, the defaults and the bundled SQLite engine. The
# upgrade recipe is in the daemon README, under "The Node pin".
x-node-version: &node-version "24.19.0"

volumes:
  # The tmux server socket. The server lives in the `tmux` container; the
  # daemon and ttyd are clients over this shared path. Same path in every
  # container: /run/curia-tmux/default.
  tmux-sock:

services:
  daemon:
    build:
      context: ..
      dockerfile: deploy/daemon/Dockerfile
      args:
        NODE_VERSION: *node-version
        CURIA_HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
    image: curia-daemon
    # The #249 restart contract: POST /restart journals and exits nonzero,
    # docker respawns. A clean exit stays down until the next deploy.
    restart: on-failure
    # host networking is load-bearing three times over: tailscale Serve targets
    # host loopback, the preview identity proxies bind dynamic ports, and the
    # daemon binds a listener on the docker bridge gateway for
    # host.docker.internal:4271.
    network_mode: host
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?host docker group id — getent group docker | cut -d: -f3}"
    working_dir: ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon
    # npm install at start, not baked into the image: the code runs from the
    # repo mount, so a deploy is `git pull` plus a restart. With a satisfied
    # tree the install is a fast no-op.
    command: ["bash", "-c", "npm install --no-fund --no-audit && exec node src/index.mjs"]
    environment:
      HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
      CURIA_TMUX_SOCKET: /run/curia-tmux/default
      # The second answer to `dispatch.workspace_root`, handed back so the
      # daemon can refuse a boot where the two disagree (#473).
      CURIA_WORKSPACE_ROOT: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
    # Renamed by #313, which gave the overseer container its own `.env.overseer`
    # beside this one. Compose refuses a missing env_file, so a box that still
    # carries the old `daemon/.env` fails this recreate and rolls back, rather
    # than starting a daemon with no Discord token.
    env_file:
      - ../daemon/.env.daemon
    volumes:
      # docker-outside-of-docker: agent containers are siblings on host dockerd.
      - /var/run/docker.sock:/var/run/docker.sock
      # Serve state stays in host tailscaled; the CLI talks over this socket.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      # The same-path principle: host paths are data in this repo (curia.yaml,
      # workspace_root, every composed `docker run -v` line), so every tree
      # mounts at its identical path and no translation layer exists. A variable
      # moves BOTH sides at once, which is what keeps that principle true (#473).
      - ${CURIA_REPO_ROOT:-/home/alp/curia}:${CURIA_REPO_ROOT:-/home/alp/curia}
      # This one carries curia's HOME as well, at `home/` inside it: the usage
      # meter cache (#146), the `gh` auth the tracker CLI runs on, the git
      # identity, and the credential store a pane agent shares (#34, #53). Four
      # mounts out of `/home/alp` used to say that, and none of them is here now.
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
      - tmux-sock:/run/curia-tmux
    depends_on:
      - tmux

  # Replaces KillMode=process: the tmux server that holds the agent panes lives
  # OUTSIDE the daemon's lifecycle. A daemon restart never touches it. The
  # attached `keeper` session is pid 1 (tty: true), so the server never exits
  # while the container runs — and if it dies, the restart policy re-parks it.
  tmux:
    build:
      context: ..
      dockerfile: deploy/tmux/Dockerfile
      args:
        CURIA_HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
    image: curia-tmux
    restart: unless-stopped
    # A stop is a deliberate act at zero live agents, but give anything still
    # winding down time before the SIGKILL.
    stop_grace_period: 2m
    network_mode: host
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?host docker group id — getent group docker | cut -d: -f3}"
    tty: true
    command: ["tmux", "-S", "/run/curia-tmux/default", "new-session", "-A", "-s", "keeper"]
    environment:
      HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
    volumes:
      # Panes run `docker run` for sandboxed agents, against host dockerd.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CURIA_REPO_ROOT:-/home/alp/curia}:${CURIA_REPO_ROOT:-/home/alp/curia}
      # A pane agent reads curia's HOME through this mount: it is `home/` inside
      # the workspace root, so the credential store the daemon points it at
      # resolves at the same path in here (#473).
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
      - tmux-sock:/run/curia-tmux

  # Shares the tmux image and the socket volume. The daemon no longer spawns
  # ttyd; reconcile health-checks port 7681 instead. THE ARGV BELOW IS THE
  # ATTACH SURFACE'S HARDENING and every flag is load-bearing — attach.test.mjs
  # pins this command, so edit both together:
  #   -O            refuse cross-origin WebSocket upgrades
  #   -i 127.0.0.1  loopback only; the tailnet reaches it through the identity
  #                 proxy (Serve :8443 → proxy :7682 → ttyd :7681)
  #   -a + wrapper  ?arg= picks the session, whitelisted to ^curia- by the wrapper
  #   -t/-I         the #69 surface: dom renderer, owned index
  # No build stanza: the tmux service owns the shared image. Two services
  # building one tag in parallel mint two image IDs, and the container left on
  # the untagged ID reads as "changed" to every later `up` — which is how a
  # deploy once recreated tmux (the #132 class). Recreate both together:
  # `docker compose up -d --build tmux ttyd`.
  ttyd:
    image: curia-tmux
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?host docker group id — getent group docker | cut -d: -f3}"
    command:
      [
        "ttyd", "-W", "-a", "-O", "-p", "7681", "-i", "127.0.0.1",
        "-t", "rendererType=dom",
        "-I", "${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/assets/attach-index.html",
        "${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin/curia-attach.sh",
      ]
    environment:
      HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
      CURIA_TMUX_SOCKET: /run/curia-tmux/default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CURIA_REPO_ROOT:-/home/alp/curia}:${CURIA_REPO_ROOT:-/home/alp/curia}
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
      - tmux-sock:/run/curia-tmux
    depends_on:
      - tmux

  # The #249 sidecar, stood up by #263. It stays up while the daemon restarts,
  # so the restart is a marker on the page rather than a dead tab. Secret-free:
  # no credentials on disk or in env — the tailscaled socket is a capability,
  # not a secret.
  #
  # host networking for the same reason the daemon needs it: tailscale Serve
  # targets host loopback, and the sidecar reads the daemon on 127.0.0.1:4271.
  dashboard:
    build:
      context: ..
      dockerfile: deploy/dashboard/Dockerfile
      args:
        NODE_VERSION: *node-version
        CURIA_HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
        CURIA_REPO_ROOT: ${CURIA_REPO_ROOT:-/home/alp/curia}
    image: curia-dashboard
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    working_dir: ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon
    command: ["node", "${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin/curia-dashboard.mjs"]
    environment:
      # This container mounts no workspace, so HOME here is the image's own
      # empty directory. The path still has to match the daemon's: the settings
      # screen validates a candidate config with the daemon's own loader (#265),
      # and that loader compares this against `dispatch.workspace_root` (#473).
      HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
      CURIA_WORKSPACE_ROOT: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      # THE MOUNT LIST IS THE SECRET-FREE CLAIM, so it names files rather than
      # trees. `daemon/` as a whole would carry `.env.daemon` (the Discord token) and
      # `data/` (the journal #249 keeps daemon-private) into a process that must
      # hold neither. So: the code it runs, the page it serves, and nothing
      # else. `node_modules` is baked into the image for the same reason.
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/src:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/src:ro
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin:ro
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/assets:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/assets:ro
      # Read-write, and the only writable path it has: the dashboard rewrites
      # curia.yaml and routing.yaml from the settings screens (#265).
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/config:${CURIA_REPO_ROOT:-/home/alp/curia}/config

  # The overseer (#327, building ADR-0015). One long-lived container beside the
  # dashboard, and many conversations pass through it. There is no pane and no
  # spawn path: compose owns its liveness, and the daemon only health-checks it,
  # the way it already treats ttyd. Recreating it kills no agent, so the routine
  # deploy names it.
  #
  # IT ANSWERS NO TURN YET. #314 carries the turn across this boundary. Until
  # then the container runs, routes its tokens and answers /ping, and every
  # other route is a 501 naming that ticket.
  #
  # NOT ON THE HOST NETWORK, and it is the only service that is not. That is the
  # containment ADR-0014 asks for: this container holds a SHELL, and on the host
  # network that shell reaches the daemon's own loopback surface, ttyd, the
  # identity proxy and the tailscaled socket. On the bridge it reaches none of
  # them. It still reaches the daemon at host.docker.internal, the path every
  # agent container already takes (#156), and the daemon reaches it on the one
  # published loopback port below.
  overseer:
    build:
      context: ..
      dockerfile: deploy/overseer/Dockerfile
      args:
        NODE_VERSION: *node-version
        CURIA_HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
        CURIA_REPO_ROOT: ${CURIA_REPO_ROOT:-/home/alp/curia}
    image: curia-overseer
    restart: unless-stopped
    user: "1000:1000"
    working_dir: ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon
    command: ["node", "${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin/curia-overseer.mjs"]
    # 127.0.0.1 and nothing else. The tailnet reaches the overseer through the
    # Chat screen, which is the dashboard's page over the daemon — never this
    # port.
    ports:
      - "127.0.0.1:4274:4274"
    # How the container reaches the daemon: the same host-gateway name the agent
    # containers use, because a listener on the box's 127.0.0.1 is the CONTAINER
    # itself from in here (#156).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # This container mounts three subtrees of the workspace and never the tree
      # itself, so HOME here is the image's own empty directory, as it always
      # was. A turn runs in the overseer's own home under the config dir
      # (overseerHomeFor), which is one of the three.
      HOME: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/home
      CURIA_WORKSPACE_ROOT: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}
      # Where the `gh` shim reads the owner's token (#392). The node process
      # derives the same path from the config; a bash script cannot, so compose
      # states it. It is a path and not a secret.
      CURIA_OVERSEER_TOKEN_DIR: ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/overseer/tokens
    # NO ENV FILE ENTERS THIS CONTAINER (#726). The daemon writes GitHub tokens
    # and the model credential into the read-only trees that follow. This keeps
    # a legacy environment token from becoming an untracked fallback.
    volumes:
      # The same mount list the dashboard runs on, and the same reason it names
      # files rather than trees: `daemon/` as a whole would carry `.env.daemon`
      # and the daemon-private journal into a container that must hold neither.
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/src:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/src:ro
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/bin:ro
      # The seed a turn writes into the config dir reads `voice.md` from here
      # (#314). It is the same agent seed the in-daemon host runs, so the
      # operator's communication rules cross the boundary with the model.
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/assets:${CURIA_REPO_ROOT:-/home/alp/curia}/daemon/assets:ro
      # The watch list, read-only: the overseer reads which repos to check out
      # and never rewrites the config the settings screens own. It is re-read
      # per turn, because the settings screen rewrites it. BOTH things it feeds
      # run per turn (#361): the checkout pass and the per-owner git routing.
      # Nothing in this container is held from its own boot.
      - ${CURIA_REPO_ROOT:-/home/alp/curia}/config:${CURIA_REPO_ROOT:-/home/alp/curia}/config:ro
      # ONE MOUNT LINE COVERS EVERY WATCHED REPO (#312). A named volume per repo
      # cannot be written here, because the watch list changes and this file is
      # static — so the set of clones inside this tree moves with the config.
      # Read-write: the container clones, fetches and prunes it every turn.
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/overseer/repos:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/overseer/repos
      # THE TOKENS, READ-ONLY, and this tree holds nothing else (#392). One file
      # per resource owner, named by the owner, written by the daemon and
      # rewritten about every fifty minutes — an installation token lives one
      # hour and this service runs for weeks. The container reads a file and
      # calls no endpoint: a shell that can mint is the capability ADR-0014
      # removed. Read-only because nothing in here has a reason to write a
      # credential, and the shell in here is the reason to say so.
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/overseer/tokens:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/overseer/tokens:ro
      # THE MODEL CREDENTIAL, READ-ONLY, and the same shape for the same reason
      # (#648). One file per provider, written by the daemon, re-read by every
      # turn — so a replaced credential reaches the next turn with nothing
      # restarted, which is what the env file above could never do.
      #
      # The tree is keyed by PROVIDER, not by consumer: this container and the
      # claude agent containers run on one value from one account, and two copies
      # would be two expiry answers free to disagree.
      #
      # Read-only because nothing in here has a reason to write a credential, and
      # the shell in here is the reason to say so.
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/credentials:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/credentials:ro
      # The config dir, at the SAME PATH on both sides, because the Chat screen
      # reads the overseer's transcript off it (ADR-0015).
      - ${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/cfg/curia-overseer:${CURIA_WORKSPACE_ROOT:-/home/alp/curia-work}/cfg/curia-overseer
