# Label-only model routing (#13). Two providers since #39, which restored the
# gpt/codex harness #33 shipped without.

defaults:
  # grilling and prototype ran on fable until 2026-08-02. Diagnosed in #126:
  # the "Fable 5 now uses usage credits / You don't have usage credits yet"
  # dialog is an ACCOUNT ENTITLEMENT, not a suppressible first-run prompt —
  # the menu's own option is "Request usage credits from your admin". No env
  # var or cached state beats it, so opus stands. The daemon no longer stalls
  # on it: the pane classifier cools fable and respawns down the chain (#126).
  # Flip these back to fable once the account holds fable usage credits.
  grilling: {model: opus, effort: high}
  prototype: {model: opus, effort: medium}
  research: {model: gpt, effort: high} # #13: spread quota on the bulk lane
  task: {model: opus, effort: high}
  untyped: {model: opus, effort: high}
  # The Test run's two tickets (#891). The live rehearsal dispatched the
  # acceptance on gpt-5.6-sol at high effort, and its cross-check on the same
  # tier; the owner ruled that a line appended to a README proves the loop on
  # the cheapest model there is. This row names the cheapest model of a
  # provider at its lowest effort, and the AI logins card's preset keeps it on
  # the cheapest tier when it moves the row to the other provider (`cheapest`
  # below). The cross-check of the type is `review.test-run`.
  test-run: {model: haiku, effort: low}
  # A map dispatch (#160): `start curia#<map>` on a `wayfinder:map` issue spawns
  # a CHARTING agent, which rewrites the map every later agent reads. #149
  # pinned it to the strongest claude-harness model, because no gate checks a
  # charting agent: the operator in the loop is the whole check.
  #
  # So this row states fable and NOT opus, unlike grilling and prototype above.
  # Those three moved to opus in #126 to stop the burnt spawn; here the operator
  # ruled the other way (2026-08-03), because charting is the one job worth the
  # strongest model even at that price. While the account holds no fable usage
  # credits, every map dispatch spends one spawn: the pane classifier reads the
  # credits dialog, cools fable, and respawns down the chain. The row needs no
  # edit on the day the credits arrive.
  #
  # The chain the operator asked for — fable, then opus, then gpt-5.6-sol — is
  # what `fallbacks` below already gives, transitively, with sonnet at the tail.
  #
  # A `model:<x>` label on the map still beats this row (resolveModel).
  map: {model: fable, effort: max}

# `context_window` feeds the status line's context % (#146), and it is the LAST
# resort for it since #178. It used to say 200000 for the three anthropic models
# here; the real window is 1000000, so every context figure the claude harness ever
# showed was five times too large and nothing on the box could notice.
#
# A hand-written denominator has nothing to correct it. So the daemon now takes
# the claude harness's window from two live facts instead: the model id the
# transcript states on every turn, and `max_input_tokens` from
# `GET /v1/models/<id>`. The codex transcript states its own
# `model_context_window`, which beats both.
#
# Set this only for a model no live source can reach. A model with no window
# from any source shows no context figure at all, which is the right failure:
# a guessed denominator is a wrong percentage on a line built to be trusted.
models:
  fable:
    provider: anthropic
    harness: claude
  opus:
    provider: anthropic
    harness: claude
  sonnet:
    provider: anthropic
    harness: claude
  # The cheapest claude-harness model (#891), named by the CLI's own alias.
  # Only the `test-run` row and its cross-check route here; no chain falls
  # into it, so nothing else ever runs on it by accident.
  haiku:
    provider: anthropic
    harness: claude
  # `gpt` is the label vocabulary (`model:gpt` on a ticket); `id` is what the
  # CLI is actually asked for, because `codex --model gpt` is not a model.
  # Since #179 `id` is also what a status line calls this agent, so a human
  # reads `gpt-5.6-sol` where the line used to say `gpt`.
  #
  # There is no plain `gpt-5.6` — the release is three models. `sol` is the
  # frontier coding one (priority 1); `terra` is the everyday one and `luna` the
  # cheap fast one, either of which is a defensible swap for a bulk lane.
  #
  # The effort is stated because a model's own default is not a constant:
  # gpt-5.5 defaults to medium and gpt-5.6-sol to low, so taking the default
  # here would have made this upgrade a quiet downgrade in thinking. `high`
  # rather than `xhigh`/`max`, because #13 sends the bulk lane here to SPREAD
  # quota, and burning it faster than the claude harness defeats that.
  gpt:
    provider: openai
    harness: codex
    id: gpt-5.6-sol
    reasoning_effort: high
    # Stated only as the fallback before the first turn — this is the one harness
    # where the config value is safe, because every token_count event the harness
    # writes carries the real window and overrides it within one turn.
    context_window: 258400
  # The cheapest codex-capable model (#891): `luna` is the cheap fast one of
  # the gpt-5.6 release, and the pinned codex binary names it. Low effort,
  # stated for the same reason `gpt` states its own. Only the `test-run` row
  # and its cross-check route here.
  luna:
    provider: openai
    harness: codex
    id: gpt-5.6-luna
    reasoning_effort: low
    context_window: 258400

# The cheapest model of each provider (#891). The AI logins card's routing
# preset moves a row that cannot run onto the connecting provider: onto the
# provider's first model above, or, for a row that sits on a provider's
# cheapest model, onto the cheapest model of the connecting provider. That is
# what keeps the Test run's tickets and their cross-check on the cheap tier
# whichever provider signs in first, without naming the type in code. Every
# entry names a model of that provider.
cheapest:
  openai: luna
  anthropic: haiku

# The cross-check pairing (#164, ADR-0010): which model reads a builder's diff
# when the operator asks for a second reading. Keyed by the BUILDER's provider,
# so an anthropic builder gets a reading on openai and an openai builder gets
# one on anthropic. That is the whole value of the check — one model reading its
# own family's work is the reading the operator already has.
#
# A `review-model:<name>` label on the ticket beats this table, for the one diff
# where the operator wants a named model.
#
# The values are routing labels like everything else here, so `gpt` is the model
# `gpt-5.6-sol` and `opus` is the strongest claude-harness model. The reviewer
# writes nothing and ends with a verdict, so it costs one read of the diff and
# one test run.
#
# A row that paired a provider with itself is refused at boot: the daemon falls
# back to the builder's own provider only when every model on the other one is
# cooling, and it stamps that on the verdict.
review:
  anthropic: gpt
  openai: opus
  # A row keyed by a TICKET TYPE holds that type's own pairing, keyed by the
  # builder's provider like the two rows above (#891): a `test-run` ticket
  # built on haiku is read on luna, and one built on luna is read on haiku,
  # so the acceptance's cross-check costs what its agent costs. A type with
  # no row here pairs by the provider rows.
  test-run:
    anthropic: luna
    openai: haiku

# Chains are explicit config, so two #13 rules stay STRUCTURAL rather than
# remembered: cross-provider first (a cooling provider must not strand a
# ticket), and "never upgrade bulk work to fable" — fable appears in no chain
# downstream of anything, so nothing can fall INTO it.
fallbacks:
  fable: [opus] # transitively reaches gpt through opus
  opus: [gpt, sonnet]
  sonnet: [gpt]
  gpt: [opus] # transitively reaches sonnet through opus
  # The cheap tier (#891) falls across providers and never up: a cooling
  # provider must not strand the Test run, and a cheap row must not climb.
  haiku: [luna]
  luna: [haiku]

harnesses:
  # EVERY harness runs in its own container (#148, retired at #195). There is no
  # per-harness `sandbox:` key any more: the rollout switch existed to soak
  # claude first (#156, #157) and codex after (#158), both harnesses held, and
  # #195 deleted the bare tmux path they replaced. `sandbox:` in
  # `config/curia.yaml` is what a container is built from, and it is required.
  #
  # `ready` is the pane text that says this harness reached its composer. It is
  # required, not defaulted: #33 lost readiness live to a marker that matched
  # nothing, and the symptom was silence.
  claude:
    template: 'claude --model {model} --permission-mode bypassPermissions "$(cat {prompt_file})"'
    resume_template: 'claude --model {model} --permission-mode bypassPermissions --continue "Continue the interrupted work."'
    ready: '⏵⏵|bypass permissions'
    # MEASURED on the box, two live dispatches, 2026-08-04 (#194,
    # docs/live-checks/194): the client's MCP handshake landed 3.7 s and 3.2 s
    # after spawn, and the composer marker 6.0 s after it both times — so the
    # handshake ran 2.4 s and 2.9 s AHEAD of the marker. This harness connects its
    # MCP servers at startup, it does not connect them lazily, which is what
    # #189 could not settle from the two readings on record.
    #
    # 15 s is that margin with room in it, and it still catches a mute agent
    # about 21 s after spawn. Raise it only against a new reading.
    tool_channel_grace_s: 15
  # `--dangerously-bypass-hook-trust` is what makes the Stop hook fire without an
  # interactive "Hooks need review" prompt that no one is there to answer. curia
  # writes that hook itself, into a config dir it owns; the flag is not scoped to
  # it, so the daemon refuses to dispatch onto a worktree carrying its own
  # `.codex/hooks.json` (see untrustedProjectHooks).
  # The marker is the codex status footer, `<model> <effort> · <cwd>`, keyed on
  # the middle dot followed by a path. NOT the composer placeholder: that is a
  # rotating tip ("Explain this codebase", "Implement {feature}", "Use /skills to
  # list available skills" all observed in one session), so keying on any one of
  # them would read ready only sometimes.
  codex:
    template: 'codex --model {model} --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust "$(cat {prompt_file})"'
    resume_template: 'codex resume --last --model {model} --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust "Continue the interrupted work."'
    ready: '·\s[~/]'
    # MEASURED on the box, three live dispatches, 2026-08-04 (#158,
    # docs/live-checks/158). This harness does NOT behave like the claude one. Its
    # handshake and its composer marker land within ~100 ms of each other and in
    # EITHER order: 844 ms ahead, 82 ms ahead, then 106 ms behind. Where the
    # claude handshake led the marker by 1.3-2.9 s in every sample, this one
    # straddles it.
    #
    # So this harness gets more room than the claude harness's 15 s, not because it is
    # slower but because its ordering is not established: 20 s is about 200x the
    # largest lag seen, and still catches a mute agent about 22 s after spawn.
    tool_channel_grace_s: 20
