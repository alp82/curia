# Label-only model routing (#13). Two providers since #39, which restored the
# gpt/codex lane #33 shipped without.

defaults:
  # grilling and prototype ran on fable until 2026-08-02. Diagnosed in #126:
  # the "Fable 5 now uses usage credits / You don't have usage credits yet"
  # dialog is an ACCOUNT ENTITLEMENT, not a suppressible first-run prompt —
  # the menu's own option is "Request usage credits from your admin". No env
  # var or cached state beats it, so opus stands. The daemon no longer stalls
  # on it: the pane classifier cools fable and respawns down the chain (#126).
  # Flip these back to fable once the account holds fable usage credits.
  grilling: opus
  prototype: opus
  research: gpt          # #13: spread quota — research is the bulk lane
  task: opus
  untyped: opus
  # A map dispatch (#160): `start curia#<map>` on a `wayfinder:map` issue spawns
  # a CHARTING worker, which rewrites the map every later worker reads. #149
  # pinned it to the strongest claude-backend model, because no gate checks a
  # charting worker: the operator in the loop is the whole check.
  #
  # So this row states fable and NOT opus, unlike grilling and prototype above.
  # Those three moved to opus in #126 to stop the burnt spawn; here the operator
  # ruled the other way (2026-08-03), because charting is the one job worth the
  # strongest model even at that price. While the account holds no fable usage
  # credits, every map dispatch spends one spawn: the pane classifier reads the
  # credits dialog, cools fable, and respawns down the chain. The row needs no
  # edit on the day the credits arrive.
  #
  # The chain the operator asked for — fable, then opus, then gpt-5.6-sol — is
  # what `fallbacks` below already gives, transitively, with sonnet at the tail.
  #
  # A `model:<x>` label on the map still beats this row (resolveModel).
  map: fable

# `context_window` feeds the status line's context % (#146), and it is the LAST
# resort for it since #178. It used to say 200000 for the three anthropic models
# here; the real window is 1000000, so every context figure the claude lane ever
# showed was five times too large and nothing on the box could notice.
#
# A hand-written denominator has nothing to correct it. So the daemon now takes
# the claude lane's window from two live facts instead: the model id the
# transcript states on every turn, and `max_input_tokens` from
# `GET /v1/models/<id>`. The codex transcript states its own
# `model_context_window`, which beats both.
#
# Set this only for a model no live source can reach. A model with no window
# from any source shows no context figure at all, which is the right failure:
# a guessed denominator is a wrong percentage on a line built to be trusted.
models:
  fable:
    provider: anthropic
    backend: claude
  opus:
    provider: anthropic
    backend: claude
  sonnet:
    provider: anthropic
    backend: claude
  # `gpt` is the label vocabulary (`model:gpt` on a ticket); `id` is what the
  # CLI is actually asked for, because `codex --model gpt` is not a model.
  #
  # There is no plain `gpt-5.6` — the release is three models. `sol` is the
  # frontier coding one (priority 1); `terra` is the everyday one and `luna` the
  # cheap fast one, either of which is a defensible swap for a bulk lane.
  #
  # The effort is stated because a model's own default is not a constant:
  # gpt-5.5 defaults to medium and gpt-5.6-sol to low, so taking the default
  # here would have made this upgrade a quiet downgrade in thinking. `high`
  # rather than `xhigh`/`max`, because #13 sends the bulk lane here to SPREAD
  # quota, and burning it faster than the anthropic lane defeats that.
  gpt:
    provider: openai
    backend: codex
    id: gpt-5.6-sol
    reasoning_effort: high
    # Stated only as the fallback before the first turn — this is the one lane
    # where the config value is safe, because every token_count event the lane
    # writes carries the real window and overrides it within one turn.
    context_window: 258400

# Chains are explicit config, so two #13 rules stay STRUCTURAL rather than
# remembered: cross-provider first (a cooling provider must not strand a
# ticket), and "never upgrade bulk work to fable" — fable appears in no chain
# downstream of anything, so nothing can fall INTO it.
fallbacks:
  fable: [opus]          # transitively reaches gpt through opus
  opus: [gpt, sonnet]
  sonnet: [gpt]
  gpt: [opus]            # transitively reaches sonnet through opus

backends:
  # `ready` is the pane text that says this backend reached its composer. It is
  # required, not defaulted: #33 lost readiness live to a marker that matched
  # nothing, and the symptom was silence.
  claude:
    template: 'claude --model {model} --permission-mode bypassPermissions "$(cat {prompt_file})"'
    ready: '⏵⏵|bypass permissions'
    # #156, from the sandbox decision (#148): `docker` puts each worker in its
    # own container, `none` runs the bare tmux pane every worker ran in before.
    #
    # ON since #157, which was the condition: a container worker binds its dev
    # server on one of the three ports its container publishes, and the daemon
    # reaches it there. The claude lane is the one that soaks first. The codex
    # lane follows at #158, and the bare path is deleted there rather than here.
    # `none` is the way back, and it needs no other change.
    sandbox: docker
  # `--dangerously-bypass-hook-trust` is what makes the Stop hook fire without an
  # interactive "Hooks need review" prompt that no one is there to answer. curia
  # writes that hook itself, into a config dir it owns; the flag is not scoped to
  # it, so the daemon refuses to dispatch onto a worktree carrying its own
  # `.codex/hooks.json` (see untrustedProjectHooks).
  # The marker is the codex status footer, `<model> <effort> · <cwd>`, keyed on
  # the middle dot followed by a path. NOT the composer placeholder: that is a
  # rotating tip ("Explain this codebase", "Implement {feature}", "Use /skills to
  # list available skills" all observed in one session), so keying on any one of
  # them would read ready only sometimes.
  codex:
    template: 'codex --model {model} --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust "$(cat {prompt_file})"'
    ready: '·\s[~/]'
    # The codex lane joins the container at #158, after the claude lane soaks.
    sandbox: none
