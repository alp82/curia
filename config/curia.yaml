# Curia daemon: watch list + dispatch + attach settings (#33).
# Hand-edited config — the daemon validates on load and refuses to boot on a bad shape.

watch:
  - repo: getalfredo/landing-page # mode auto (default): map-if-present
  - repo: alp82/alperortac.com
  - repo: alp82/aistack
  # mode auto since the repo hosts the dogfood map (#109);
  # the flat-lane pin from settled answer 3 hid it
  - repo: alp82/curia

dispatch:
  auto_dispatch: false # shipped OFF (settled answer 1)
  # #390, ADR-0018: who a claim assigns. The daemon calls GitHub as
  # `curia-sh[bot]` now, and GitHub does not let an App be an issue assignee —
  # so the claim names a real user, and this is the one place that says which.
  claim_login: alp82
  # #54 item 8: an agent awaiting review holds its slot on purpose — that is the
  # backpressure that beats a pile of unreviewed PRs — so this is a RESOURCE
  # number now: ~0.3-0.5 GB per agent plus ~0.3 GB per preview dev server
  # against 8 GB. Quota stays bounded separately by #13's reactive cooling.
  # The long-lived tenant is a grilling ticket (N blocking questions), not review.
  # #571: the operator raised the default to 10 with the overseer-pane decision
  # (ADR-0024). Live overseer panes have their own cap, a settings default of 3.
  max_concurrent: 10
  poll_interval_s: 60
  prototype_variations: 5
  workspace_root: /home/alp/curia-work # daemon-owned; never Alp's working tree
  ready_timeout_s: 45
  # #54: how often the Stop hook may hold an agent
  # at the ending before curia stops holding it
  stop_nudge_budget: 3

attach:
  ttyd_port: 7681
  # Retired by #714: the terminal is embedded in Curia app Chat through the
  # sidecar's same-origin /terminal/ route. The daemon only withdraws the
  # standalone Serve rule an older daemon asserted here. Defaults to 8443.
  serve_port: 8443
  # #70, landing #69: the attach page is an owned, BUILT asset, not whatever
  # index ttyd happens to ship. It carries the viewport meta (no flag can set
  # one), #69's sizing rule and the touch key-bar. Relative to this file.
  # Rebuild after editing daemon/assets/attach-chrome.html, or after upgrading
  # ttyd: `npm run build-attach-index --prefix daemon`.
  index: ../daemon/assets/attach-index.html

identity:
  # #151: the identity check in front of BOTH attach surfaces,
  # closing the deferral ADR-0003 booked and #74 restated.
  # Tailscale Serve stamps `Tailscale-User-Login` on every request it proxies,
  # including the WebSocket upgrade, and OVERWRITES the header when a client
  # forges it (measured — docs/live-checks/151-attach-surface-auth.md). That is
  # what makes it an identity rather than a client assertion like Origin.
  # A caller who is not on this list gets a 403, on the terminal and on the
  # timeline alike. Required: there is no safe default for this key.
  allow:
    - alportac@gmail.com
  # The loopback proxy that carries the check for ttyd, which is a C process
  # with nowhere to put one: Serve(:8443) → proxy → ttyd(:7681). The timeline is
  # the daemon's own server, so it applies the same check in-process.
  proxy_port: 7682
  # #168: the same check in front of preview rules, the third and last surface
  # curia publishes through Serve. A preview is the operator's alone, so the
  # `allow` list above serves it too and there is no second list.
  #
  # One proxy per LIVE preview, on a port DERIVED from this base: it pairs
  # index-for-index with the preview range below, so the preview on 8501 always
  # proxies through 7701 and `ss -ltn` on the box reads straight. The block is
  # as wide as that range. The daemon refuses to boot if it touches any other
  # port here, the preview range, or the sandbox range.
  preview_proxy_from: 7700

timeline:
  # #74, landing #73: the grid-less attach surface —
  port: 4272 # daemon-hosted loopback listener (transcript tail + send-keys)
  serve_port: 8444 # its own Serve rule, beside attach's, never inside the preview range
  # The page is a committed asset carrying a proto stamp; the daemon refuses to
  # serve or publish a page whose proto is not the one it speaks (#70's rule).
  index: ../daemon/assets/timeline.html

dashboard:
  # #263, building the where-it-lives decision #249:
  # the console sidecar. A process BESIDE the daemon, so it
  # stays up while the daemon restarts and the restart is a
  # marker on the page instead of a dead tab. The daemon
  # binds neither port. It validates this block and refuses
  # to boot on a bad shape, and both ports join the
  # collision check and `previews.reserved`.
  port: 4273 # loopback listener, the target of the Serve rule below
  serve_port: 8445 # its own Serve rule, beside attach's and the timeline's
  # How often the page re-reads the daemon. Every refresh costs one whole read
  # of the journal off disk through `dispatcher.status()`, plus one more per
  # open review gate through the pull-request lookup (#262), and the journal
  # grows without bound — so this number IS that read rate.
  #
  # It is a CEILING, not a clock: the sidecar refreshes only when a page asks
  # and the snapshot it holds is older than this. A browser asks while its tab
  # is visible and stops when it is hidden, so a forgotten tab costs nothing and
  # many open tabs still cost one read.
  poll_interval_s: 5

overseer:
  # #327 and #688: the overseer is one compose service. Live conversations
  # enter the shared container through tmux panes, while this port keeps the
  # existing health and turn boundary available during the staged cutover.
  # The container stays on the docker bridge, which keeps its shell away from
  # host loopback and the tailnet.
  port: 4274
  # #710, ADR-0024: how many conversations may hold a live pane at once. A pane
  # is a CACHE in front of a durable conversation, not the conversation itself,
  # so this bounds memory and never the number of conversations. At the cap
  # curia parks the least recently used idle pane; the next message rehydrates
  # it from the journalled session id. Separate from dispatch.max_concurrent,
  # which counts agents.
  live_pane_cap: 3

usage:
  # #146: the per-agent status-line meters
  # The 5 h / 7 d bars are ACCOUNT-level, and the claude harness states them in no
  # file and no transcript. They ride the response headers of any accepted
  # completion, so the daemon takes one minimal completion for its headers and
  # caches the reading (#162 — the OAuth usage endpoint answers only a `claude
  # /login` credential, which a headless box does not have). The probe uses
  # whatever credential the box already authenticates with, reads it and never
  # rewrites it, and shares the attempt stamp beside the cache with the
  # operator's statusline.sh, so the two throttle each other.
  #
  # Set false to stop the daemon spending anything on this: the bars then show
  # whatever reading is already cached on disk, and age.
  account_bars: true
  # The probe rides the cheapest model there is, asked for one token. Name
  # another only if a plan stops serving this one.
  probe_model: claude-haiku-4-5-20251001

aistack:
  # #695: the recurring publish of this box's harness usage to the operator's
  # measured layer on aistack.to.
  #
  # There is no `enabled` key here on purpose. The switch is the machine
  # credential at `<workspace_root>/home/.config/aistack/credentials.json`, which
  # the operator's one-time registration writes and `settings/machines` on
  # aistack.to revokes. A box that never registered runs nothing and says
  # nothing.
  #
  # A PIN, like every version in the `sandbox:` block. The aistack hook the CLI
  # installs runs `@latest`, which is a behavior change on a box nobody touched.
  # Read the current version with `npm view @use-aistack/cli version` before
  # bumping, and check the sync still publishes afterwards.
  cli_version: 0.7.2
  # How long one run stays fresh. This bounds spawned processes, not published
  # snapshots: the stack's own auto-sync frequency defaults to 24 hours, and the
  # CLI holds a run back until that window is open.
  interval_hours: 1

sandbox:
  # #154, building the decision at #148: one shared
  # agent image, one container per agent.
  # Every version here is a PIN, and the pins feed the image tag together with
  # the Dockerfile's own bytes (daemon/src/image.mjs). So a bump on any line
  # below names a tag that is not on the box, and the daemon rebuilds on the
  # next dispatch that wants a container. Nothing else needs touching.
  #
  # There is no default for any of them: an unpinned CLI inside an agent image
  # is an agent running whatever npm served that minute, which is the thing
  # this section exists to stop. Build it by hand ahead of a dispatch with
  # `npm run build-agent-image --prefix daemon`.
  image: curia-agent
  # ONE NODE PATCH VERSION RUNS EVERY CURIA IMAGE (#357, applied by #409). This
  # line is that pin for the agent image. The other three images take it from
  # the `x-node-version` anchor in deploy/compose.yaml. Move both in one commit.
  # The journal runs on `node:sqlite`, which Node marks Stability 1.2, and the
  # daemon suite runs in this image — so the suite that proves an upgrade must
  # run on the Node the daemon runs. The upgrade recipe is in the daemon README,
  # under "The Node pin".
  node_version: 24.19.0
  # These pins track the harnesses that routing can select. Read each version
  # from the matching command before you change a pin.
  claude_version: 2.1.220
  codex_version: 0.146.0
  # Debian 12 ships gh 2.23 (2023). Pinned from the upstream release instead,
  # for the same reason: one tracker CLI, one version of it.
  gh_version: 2.97.0
  # Only chromium's OS libraries go in the image. The browsers themselves
  # install on demand into the shared volume (#148), and this is the version
  # whose dependency list the build installs.
  playwright_version: 1.62.1
  # ttyd exists in the image only for the daemon's own test suite (#231):
  # attach.test.mjs reads the real binary. Pinned to what the box runs — read
  # it off the box with `ttyd --version` before bumping.
  ttyd_version: 1.7.7
  # The uid inside the container. It must equal the uid of the host user that
  # owns the mounted clone and cfg dir — the daemon runs as `alp` (1000) on
  # the box — or the agent cannot write its own worktree.
  agent_uid: 1000
  # #156: the loopback ports each container publishes, three per agent, as
  # `127.0.0.1:<p>:<p>` — the same number inside and out, so the port an agent
  # binds is the port a preview rule points at. The range must hold
  # 3 × max_concurrent, and it must not touch the preview range: those are the
  # tailnet-facing HTTPS ports, these are the plain ports they proxy to.
  port_from: 9000
  port_to: 9299

preview:
  # #40, implementing #8: one Serve port per preview
  port_from: 8500 # must not contain attach.serve_port — the sweep
  port_to: 8599 # withdraws every rule it finds in this range

skills:
  # #57, decision 1 of #49: what an agent can invoke
  # #268: the tree is VENDORED, at `skills/` beside this file, and no longer
  # read out of the operator's home. Relative to this config, so the one path
  # reads the same on the box, inside the daemon container and in the suite.
  # A skill upgrade is now a reviewable diff instead of an edit nobody sees —
  # see skills/UPSTREAM.md for the pinned release and how to bump it.
  root: ../skills
  install:
    # every name must exist at boot or the daemon refuses
    - ask-matt
    - code-review
    - codebase-design
    - diagnosing-bugs
    - domain-modeling
    - grill-me
    - grill-with-docs
    - grilling
    - handoff
    - implement
    - improve-codebase-architecture
    - prototype
    - research
    - resolving-merge-conflicts
    - setup-matt-pocock-skills
    - tdd
    - teach
    - to-questionnaire
    - to-spec
    - to-tickets
    - triage
    - wait-what
    - wayfinder
    - writing-for-agents
  # The install list excludes only wizard (#348). It writes an interactive bash script for a
  # human at a terminal, and a `wayfinder:task` ticket hands its checklist over
  # through `ask_human`, to a phone. The script writes `.env` and `gh secret`
  # where it runs, which is the agent container and not the operator's box, and
  # it reaches that box only after the merge that ends the ticket. A repeatable
  # setup path under `scripts/` is the case that survives, and it earns its own
  # ticket.
  # The review gate guards tracker writes. Skill installation does not grant a
  # tracker write before approval. `to-spec` and `to-tickets` carry
  # `disable-model-invocation`, so installation alone does not invoke them.
  # Curia types their slash commands in the dispatch prompt, as it does for
  # `/wayfinder` (#517).
  # The vendored tree carries all 25 promoted skills, because a hand session
  # reads the same tree. The seed builds <cfgDir>/skills from these 24 names.
