# Curia daemon: watch list + dispatch + attach settings (#33).
# Hand-edited config — the daemon validates on load and refuses to boot on a bad shape.

watch:
  - repo: getalfredo/landing-page          # mode auto (default): map-if-present
  - repo: alp82/alperortac.com
  - repo: alp82/curia                      # mode auto since the repo hosts the dogfood map (#109);
                                           # the flat-lane pin from settled answer 3 hid it

dispatch:
  auto_dispatch: false                     # shipped OFF (settled answer 1)
  # #54 item 8: an agent awaiting review holds its slot on purpose — that is the
  # backpressure that beats a pile of unreviewed PRs — so this is a RESOURCE
  # number now: ~0.3-0.5 GB per agent plus ~0.3 GB per preview dev server
  # against 8 GB. Quota stays bounded separately by #13's reactive cooling.
  # The long-lived tenant is a grilling ticket (N blocking questions), not review.
  max_concurrent: 6
  poll_interval_s: 60
  workspace_root: /home/alp/curia-work     # daemon-owned; never Alp's working tree
  ready_timeout_s: 45
  stop_nudge_budget: 3                     # #54: how often the Stop hook may hold an agent
                                           # at the ending before curia stops holding it

attach:
  ttyd_port: 7681
  serve_port: 8443
  # #70, landing #69: the attach page is an owned, BUILT asset, not whatever
  # index ttyd happens to ship. It carries the viewport meta (no flag can set
  # one), #69's sizing rule and the touch key-bar. Relative to this file.
  # Rebuild after editing daemon/assets/attach-chrome.html, or after upgrading
  # ttyd: `npm run build-attach-index --prefix daemon`.
  index: ../daemon/assets/attach-index.html

identity:                                  # #151: the identity check in front of BOTH attach surfaces,
                                           # closing the deferral ADR-0003 booked and #74 restated.
  # Tailscale Serve stamps `Tailscale-User-Login` on every request it proxies,
  # including the WebSocket upgrade, and OVERWRITES the header when a client
  # forges it (measured — docs/live-checks/151-attach-surface-auth.md). That is
  # what makes it an identity rather than a client assertion like Origin.
  # A caller who is not on this list gets a 403, on the terminal and on the
  # timeline alike. Required: there is no safe default for this key.
  allow:
    - alportac@gmail.com
  # The loopback proxy that carries the check for ttyd, which is a C process
  # with nowhere to put one: Serve(:8443) → proxy → ttyd(:7681). The timeline is
  # the daemon's own server, so it applies the same check in-process.
  proxy_port: 7682
  # #168: the same check in front of preview rules, the third and last surface
  # curia publishes through Serve. A preview is the operator's alone, so the
  # `allow` list above serves it too and there is no second list.
  #
  # One proxy per LIVE preview, on a port DERIVED from this base: it pairs
  # index-for-index with the preview range below, so the preview on 8501 always
  # proxies through 7701 and `ss -ltn` on the box reads straight. The block is
  # as wide as that range. The daemon refuses to boot if it touches any other
  # port here, the preview range, or the sandbox range.
  preview_proxy_from: 7700

timeline:                                  # #74, landing #73: the grid-less attach surface —
  port: 4272                               # daemon-hosted loopback listener (transcript tail + send-keys)
  serve_port: 8444                         # its own Serve rule, beside attach's, never inside the preview range
  # The page is a committed asset carrying a proto stamp; the daemon refuses to
  # serve or publish a page whose proto is not the one it speaks (#70's rule).
  index: ../daemon/assets/timeline.html

usage:                                     # #146: the per-agent status-line meters
  # The 5 h / 7 d bars are ACCOUNT-level, and the claude harness states them in no
  # file and no transcript. They ride the response headers of any accepted
  # completion, so the daemon takes one minimal completion for its headers and
  # caches the reading (#162 — the OAuth usage endpoint answers only a `claude
  # /login` credential, which a headless box does not have). The probe uses
  # whatever credential the box already authenticates with, reads it and never
  # rewrites it, and shares the attempt stamp beside the cache with the
  # operator's statusline.sh, so the two throttle each other.
  #
  # Set false to stop the daemon spending anything on this: the bars then show
  # whatever reading is already cached on disk, and age.
  account_bars: true
  # The probe rides the cheapest model there is, asked for one token. Name
  # another only if a plan stops serving this one.
  probe_model: claude-haiku-4-5-20251001

sandbox:                                   # #154, building the decision at #148: one shared
                                           # agent image, one container per agent.
  # Every version here is a PIN, and the pins feed the image tag together with
  # the Dockerfile's own bytes (daemon/src/image.mjs). So a bump on any line
  # below names a tag that is not on the box, and the daemon rebuilds on the
  # next dispatch that wants a container. Nothing else needs touching.
  #
  # There is no default for any of them: an unpinned CLI inside an agent image
  # is an agent running whatever npm served that minute, which is the thing
  # this section exists to stop. Build it by hand ahead of a dispatch with
  # `npm run build-agent-image --prefix daemon`.
  image: curia-agent
  # Both pins track what the box itself runs, so an agent and a hand session
  # meet the same CLI. Read them off the box with `claude --version` and
  # `codex --version` before bumping.
  claude_version: 2.1.220
  codex_version: 0.146.0
  # Debian 12 ships gh 2.23 (2023). Pinned from the upstream release instead,
  # for the same reason: one tracker CLI, one version of it.
  gh_version: 2.97.0
  # Only chromium's OS libraries go in the image. The browsers themselves
  # install on demand into the shared volume (#148), and this is the version
  # whose dependency list the build installs.
  playwright_version: 1.62.1
  # The uid inside the container. It must equal the uid of the host user that
  # owns the mounted clone and cfg dir — the daemon runs as `alp` (1000) on
  # the box — or the agent cannot write its own worktree.
  agent_uid: 1000
  # #156: the loopback ports each container publishes, three per agent, as
  # `127.0.0.1:<p>:<p>` — the same number inside and out, so the port an agent
  # binds is the port a preview rule points at. The range must hold
  # 3 × max_concurrent, and it must not touch the preview range: those are the
  # tailnet-facing HTTPS ports, these are the plain ports they proxy to.
  port_from: 9000
  port_to: 9299

preview:                                   # #40, implementing #8: one Serve port per preview
  port_from: 8500                          # must not contain attach.serve_port — the sweep
  port_to: 8599                            # withdraws every rule it finds in this range

skills:                                    # #57, decision 1 of #49: what an agent can invoke
  root: ~/.claude/skills                   # host skills, symlinked read-only into each agent
  install:                                 # every name must exist at boot or the daemon refuses
    - wayfinder
    - grilling
    - domain-modeling
    - research
    - prototype
    - implement
    - tdd
    - code-review
    - diagnosing-bugs
  # Withheld on purpose: to-tickets, triage, to-spec, handoff — the
  # charting-and-PM side. to-tickets is mass ticket creation in the hands of an
  # agent that now carries charting authority (#49).
