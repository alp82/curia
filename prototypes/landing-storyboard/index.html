<!doctype html>
<!--
  curia#567 — Storyboard the final landing page.
  On the map: The curia landing page (curia#109).
  Baseline: the saga acts picked at curia#508 round 10 (prototypes/living-organism/).
  Rules: docs/landing-page/positioning.md, sections "The final page rewrite" and
  "What the page is honest about".

  THROWAWAY PROTOTYPE. Not the live page. Wireframe fidelity on purpose:
  grey boxes stand for scenes, not for the design. One self-contained file,
  no build step, no CDN, no webfont, no image.

  What this is: a storyboard. Each card is ONE SCENE of the final page, in
  page order. Copy is OUT OF SCOPE here since round 1: the operator extracted
  the word decisions into their own prototype ticket, so a card names what the
  scene contains and what moves, and its "says" line is only the gist. Switch
  arcs with the bar at the bottom or ?arc=.

    story — the operator's story from round 1, the lead arc
    saga  — the five acts as picked at #508, proof moments folded in
    diary — the whole page follows one ticket, start to merge
    phone — the phone arrives first, the queue is revealed behind it
    drain — the page stays wide: three maps fill, run in parallel, drain

  Fixed by earlier decisions, not up for a vote here:
    - first screen: kicker, headline, skills line, two buttons, nothing else
    - the honesty block left the page at round 3; its facts live in the guide
    - no sound, no bottom bar on the final page (this bar is prototype chrome)
    - banned words and banned moves per positioning.md
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>curia#567 — landing page storyboard</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --accent: #7dd3a0;
    --dim: #949cab;
    --line: #ffffff1e;
    --c-takeable: #6ab0f3;
    --c-agent: #f0c987;
    --c-gate: #e08a8a;
    --c-merged: #a78bdb;
    --chrome: 1.75rem;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: calc(var(--chrome) + 1rem) 0 6.5rem;
    font: 1rem/1.55 var(--sans);
    background: #08090c; color: #e6e8ec;
    overflow-x: hidden;
  }
  a { color: var(--accent); }

  .protohead {
    position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--chrome);
    display: flex; align-items: center; gap: 0.5rem; padding: 0 0.7rem;
    background: #ffd66b; color: #1a1206;
    font: 600 0.7rem/1 var(--mono); white-space: nowrap; overflow: hidden;
  }
  .protohead b { font-weight: 700; }
  .protohead span { opacity: 0.72; overflow: hidden; text-overflow: ellipsis; }

  .wrap { max-width: 34rem; margin: 0 auto; padding: 0 1rem; }

  /* How to read this storyboard. */
  .intro { font-size: 0.9rem; color: #c1c8d3; padding: 0.5rem 0 0.75rem; }
  .intro b { color: #e6e8ec; }
  .intro p { margin: 0 0 0.6rem; }

  .archead { padding: 0.75rem 0 0.25rem; }
  .archead .k { font-family: var(--mono); font-size: 0.7rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
  .archead h1 { font-size: 1.45rem; margin: 0.2rem 0 0.3rem; letter-spacing: -0.02em; }
  .archead p { margin: 0; color: var(--dim); font-size: 0.92rem; }

  /* One scene of the final page. */
  .scene {
    margin: 1.4rem 0; border-radius: 14px;
    background: #ffffff06; box-shadow: inset 0 0 0 1px var(--line);
    padding: 1rem 1rem 1.1rem;
  }
  .scene-head {
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: #e2e9f1; margin: 0 0 0.75rem;
  }
  .scene-head .num { color: var(--accent); }
  .scene-head .tag { color: var(--dim); text-transform: none; letter-spacing: 0; margin-left: auto; }

  /* The sketch: grey boxes, dashed frames. Not the design. */
  .sketch {
    border-radius: 10px; background: #0d1015; box-shadow: inset 0 0 0 1px #ffffff12;
    padding: 0.9rem; margin: 0 0 0.8rem; position: relative; overflow: hidden;
    min-height: 7rem;
  }
  .note { font-size: 0.82rem; color: var(--dim); margin: 0.35rem 0; }
  .note b { color: #c1c8d3; font-weight: 600; }
  .note.proof b { color: var(--accent); }

  .lines { margin: 0.8rem 0 0; }
  .lines .lab { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0 0 0.4rem; }
  .cand {
    display: flex; gap: 0.6rem; align-items: baseline;
    padding: 0.45rem 0.6rem; border-radius: 8px; margin: 0.3rem 0;
    background: #ffffff05; box-shadow: inset 0 0 0 1px #ffffff10;
    font-size: 0.94rem;
  }
  .cand .key {
    font-family: var(--mono); font-size: 0.72rem; color: #08090c;
    background: var(--accent); border-radius: 5px; padding: 0.05rem 0.35rem; flex: none;
    font-weight: 700;
  }
  .cand .cur { font-family: var(--mono); font-size: 0.66rem; color: var(--dim); margin-left: auto; flex: none; }
  .cand q { quotes: none; }
  .under {
    font-family: var(--mono); font-size: 0.7rem; color: var(--dim); line-height: 1.8;
    margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  .under b { color: #c1c8d3; font-weight: 600; }

  /* Sketch parts. */
  .t-row {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-family: var(--mono); font-size: 0.62rem; color: #c1c8d3;
    background: #14171c; border: 1px solid #262b33; border-radius: 6px;
    padding: 0.22rem 0.45rem; white-space: nowrap;
  }
  .t-row i { width: 0.4rem; height: 0.4rem; border-radius: 999px; background: #4a515c; flex: none; }
  .t-row.hot { border-color: var(--accent); color: #e6e8ec; }
  .t-row.dim { opacity: 0.45; }
  .mapcard {
    border: 1px dashed #3a4150; border-radius: 8px; padding: 0.5rem;
    display: flex; flex-direction: column; gap: 0.3rem; align-items: flex-start;
  }
  .mapcard .mb {
    font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.1em; color: var(--dim);
    text-transform: uppercase;
  }
  .phone {
    width: 8.5rem; border: 2px solid #3a4150; border-radius: 14px;
    padding: 0.5rem; margin: 0 auto; background: #101318;
    display: flex; flex-direction: column; gap: 0.35rem;
  }
  .bubble {
    font-size: 0.62rem; line-height: 1.35; color: #c1c8d3;
    background: #1a1f27; border-radius: 8px; padding: 0.3rem 0.45rem;
    max-width: 92%;
  }
  .bubble.me { background: #24405c; align-self: flex-end; }
  .bubble .who { font-family: var(--mono); font-size: 0.52rem; color: var(--dim); display: block; }
  .btnrow { display: flex; gap: 0.25rem; }
  .btnrow span {
    font-family: var(--mono); font-size: 0.58rem; color: #e6e8ec;
    border: 1px solid #3a4150; border-radius: 5px; padding: 0.12rem 0.4rem;
  }
  .approve {
    font-family: var(--mono); font-size: 0.62rem; font-weight: 700; color: #06231a;
    background: var(--accent); border-radius: 6px; padding: 0.3rem 0.6rem;
    align-self: center; position: relative;
  }
  .pulse { position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: -4px; border-radius: 10px;
    border: 1px solid var(--accent); opacity: 0.6;
    animation: pu 1.6s ease-out infinite;
  }
  @keyframes pu { from { transform: scale(1); opacity: 0.6; } to { transform: scale(1.18); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
  .grey { background: #1a1f27; border-radius: 6px; color: #4a515c; font-family: var(--mono); font-size: 0.58rem; display: flex; align-items: center; justify-content: center; }
  .stageline { display: flex; align-items: center; gap: 0; margin: 0.9rem 0 0.4rem; }
  .stageline .seg { flex: 1; height: 2px; background: #262b33; }
  .stageline .dot { width: 0.55rem; height: 0.55rem; border-radius: 999px; flex: none; }
  .stagelabels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.55rem; color: var(--dim); }
  .scatter { position: relative; height: 8rem; }
  .scatter .t-row { position: absolute; }
  .colwrap { display: flex; gap: 0.5rem; }
  .colwrap .mapcard { flex: 1; min-width: 0; }
  .colwrap .t-row { max-width: 100%; overflow: hidden; }
  .center { text-align: center; }
  .caption { font-family: var(--mono); font-size: 0.6rem; color: var(--dim); text-align: center; margin-top: 0.6rem; }

  /* Hero sketch */
  .heroline { border-radius: 4px; background: #262b33; }
  .skills-note { font-size: 0.62rem; color: #c1c8d3; font-family: var(--mono); }

  /* The bottom arc switcher — prototype chrome, not part of any design. */
  .switch {
    position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
    bottom: calc(0.75rem + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0.25rem; padding: 0.3rem;
    background: #f2f4f7; color: #14171c; border-radius: 999px;
    box-shadow: 0 6px 28px #000000aa, 0 0 0 1px #ffffff30;
    font-family: var(--mono); max-width: calc(100vw - 1rem);
  }
  .switch button {
    border: 0; background: none; color: inherit; cursor: pointer;
    font-family: inherit; border-radius: 999px; flex: none;
    width: 2rem; height: 2rem; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .switch button:active { transform: scale(0.94); }
  .switch .label { padding: 0 0.55rem; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
  .switch .label .k { font-size: 0.62rem; opacity: 0.55; letter-spacing: 0.06em; text-transform: uppercase; }
  .switch .label .n { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>

<div class="protohead">
  <b>curia#567</b>
  <span>landing page storyboard &middot; prototype, not the live page</span>
</div>

<main id="main" class="wrap"></main>

<nav class="switch" aria-label="Arc switcher">
  <button type="button" data-step="-1" aria-label="Previous arc">&larr;</button>
  <span class="label"><span class="k" id="sw-k"></span><span class="n" id="sw-n"></span></span>
  <button type="button" data-step="1" aria-label="Next arc">&rarr;</button>
</nav>

<script>
(function () {
'use strict';

/* ================================================================
   Helpers
   ================================================================ */
function h(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}

/* ================================================================
   WORD CANDIDATES — shared by every arc, so a pick carries over.
   "current" marks the line of the picked saga baseline / live page.
   Every other line is new. The full list of new lines goes to the
   review gate, per positioning.md.
   ================================================================ */
/* Word candidates left with round 1: the operator extracted the copy
   decision into its own prototype ticket. A scene's `says` line below is
   the gist only, anchored to the approved copy where one exists. */

var UNDER = {
  facts: 'Your box · your subscription · your keys<br>GitHub issues in · merged pull requests out',
  queue: '3 repos watched · a label picks the model · blocked and claimed tickets drop out',
  seat: 'tickets · next · start 42 · status · attach 42 · resume 42 · cancel 42 · map 109 · review 42<br>~0.5 GB per agent measured · four at once on one small box',
  gate: 'resolved means merged · nothing lands without you'
};

/* ================================================================
   SKETCHES — grey boxes. Each stands for a scene, not a design.
   ================================================================ */
var SC = { takeable: 'var(--c-takeable)', agent: 'var(--c-agent)', gate: 'var(--c-gate)', merged: 'var(--c-merged)' };

function row(txt, mod, color) {
  var r = h('span', { class: 't-row' + (mod ? ' ' + mod : '') }, [h('i', color ? { style: 'background:' + color } : {}), document.createTextNode(txt)]);
  return r;
}

function skHero() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'skills-note', text: 'kicker' }),
    h('div', { class: 'heroline', style: 'height:1.6rem;width:88%;margin:0.45rem 0' }),
    h('div', { class: 'heroline', style: 'height:1.6rem;width:64%;margin:0 0 0.7rem' }),
    h('div', { class: 'skills-note', text: 'Curia is a wrapper for Matt Pocock’s skills.' }),
    h('div', { style: 'display:flex;gap:0.5rem;margin-top:0.7rem' }, [
      h('span', { class: 'approve', text: 'Set it up' }),
      h('span', { class: 't-row', text: 'Source' })
    ]),
    h('div', { class: 'caption', text: 'the first screen stays bare — fixed by the grilling' })
  ]);
}

function skMess(hotOne) {
  var pos = [
    ['#231 fix-login-redirect', '4%', '6%'], ['#88 rotate-api-keys', '52%', '2%'],
    ['#412 dark-mode-tokens', '12%', '34%'], ['#57 flaky-e2e-suite', '58%', '38%'],
    ['#199 bump-node-22', '30%', '64%'], ['#340 import-csv-orders', '2%', '72%'],
    ['#76 cache-invalidation', '62%', '70%']
  ];
  var box = h('div', { class: 'scatter' });
  pos.forEach(function (p, i) {
    var r = row(p[0], (hotOne && i === 3) ? 'hot' : 'dim');
    r.style.left = p[1]; r.style.top = p[2];
    box.appendChild(r);
  });
  return h('div', { class: 'sketch' }, [box, h('div', { class: 'caption', text: hotOne ? 'one ticket among many — the one the page follows' : 'tickets drift, unordered, across your repos' })]);
}

function skPull() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'center' }, [row('#57 flaky-e2e-suite', 'hot', SC.takeable)]),
    h('div', { style: 'margin:0.6rem 0' }, [
      h('div', { class: 'mapcard' }, [
        h('span', { class: 'mb', text: 'map · test reliability' }),
        row('#57 flaky-e2e-suite', 'hot', SC.takeable), row('#58 retry-budget', 'dim'), row('#61 ci-matrix', 'dim')
      ])
    ]),
    h('div', { class: 'colwrap' }, [
      h('div', { class: 'mapcard' }, [h('span', { class: 'mb', text: 'map · app' }), row('#412', 'dim'), row('#231', 'dim')]),
      h('div', { class: 'mapcard' }, [h('span', { class: 'mb', text: 'map · infra' }), row('#88', 'dim'), row('#199', 'dim')]),
      h('div', { class: 'mapcard' }, [h('span', { class: 'mb', text: 'map · tests' }), row('#57', 'hot', SC.takeable), row('#61', 'dim')])
    ]),
    h('div', { class: 'caption', text: 'camera pulls back: one ticket → its map → all your maps' })
  ]);
}

function skRun(withThread) {
  var lineB = h('div', {}, [
    h('div', { class: 'stageline' }, [
      h('span', { class: 'dot', style: 'background:' + SC.takeable }), h('span', { class: 'seg' }),
      h('span', { class: 'dot', style: 'background:' + SC.agent }), h('span', { class: 'seg' }),
      h('span', { class: 'dot', style: 'background:' + SC.gate }), h('span', { class: 'seg' }),
      h('span', { class: 'dot', style: 'background:' + SC.merged })
    ]),
    h('div', { class: 'stagelabels' }, ['takeable', 'agent', 'gate', 'merged'].map(function (s) { return h('span', { text: s }); }))
  ]);
  var kids = [lineB];
  if (withThread) {
    kids.push(h('div', { class: 'phone', style: 'margin-top:0.8rem' }, [
      h('div', { class: 'bubble me' }, [h('span', { class: 'who', text: 'you' }), document.createTextNode('start 57')]),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'curia' }), document.createTextNode('agent up on #57 flaky-e2e-suite')]),
      h('div', { class: 'bubble' }, [
        h('span', { class: 'who', text: 'agent' }),
        document.createTextNode('Which suite first?'),
        h('div', { class: 'btnrow' }, [h('span', { text: 'A checkout' }), h('span', { text: 'B auth' }), h('span', { text: 'C ✅ all' })])
      ]),
      h('div', { class: 'bubble me' }, [h('span', { class: 'who', text: 'you' }), document.createTextNode('C')])
    ]));
    kids.push(h('div', { class: 'caption', text: 'the thread writes itself while you scroll — built HTML, easy to animate' }));
  } else {
    kids.push(h('div', { class: 'caption', text: 'the ticket crosses the four stages, left to right' }));
  }
  return h('div', { class: 'sketch' }, kids);
}

function skGate() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'phone pulse' }, [
      h('div', { class: 'grey', style: 'height:4.2rem', text: 'running preview' }),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'curia' }), document.createTextNode('review gate on #57 — diff, preview, ticket')]),
      h('span', { class: 'approve', text: 'Approve' })
    ]),
    h('div', { class: 'caption', text: 'the phone with the live preview, then the gate — the needs-you pulse' })
  ]);
}

function skMerged() {
  return h('div', { class: 'sketch' }, [
    h('div', { style: 'display:flex;flex-direction:column;gap:0.3rem;align-items:center' }, [
      row('#57 flaky-e2e-suite · merged', 'hot', SC.merged),
      row('#412 dark-mode-tokens · merged', '', SC.merged),
      row('#88 rotate-api-keys · merged', '', SC.merged),
      row('#199 bump-node-22 · merged', '', SC.merged)
    ]),
    h('div', { class: 'caption', text: 'the stack of merged pull requests grows — the dogfood line sits here' })
  ]);
}

function skThread() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'phone' }, [
      h('div', { class: 'bubble me' }, [h('span', { class: 'who', text: 'you' }), document.createTextNode('start 57')]),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'curia' }), document.createTextNode('agent up on #57')]),
      h('div', { class: 'bubble' }, [
        h('span', { class: 'who', text: 'agent' }),
        document.createTextNode('Which suite first?'),
        h('div', { class: 'btnrow' }, [h('span', { text: 'A' }), h('span', { text: 'B' }), h('span', { text: 'C' })])
      ]),
      h('div', { class: 'bubble me' }, [h('span', { class: 'who', text: 'you' }), document.createTextNode('C')]),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'agent' }), document.createTextNode('preview: https://… (tap)')])
    ]),
    h('div', { class: 'caption', text: 'the Discord thread builds itself while you scroll' })
  ]);
}

function skPreview() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'phone' }, [
      h('div', { class: 'grey', style: 'height:6rem', text: 'running preview' }),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'agent' }), document.createTextNode('preview is live on your tailnet')])
    ]),
    h('div', { class: 'caption', text: 'the phone screen with a running preview — before any gate' })
  ]);
}

function skFlood() {
  function col(name, rows) {
    var kids = [h('span', { class: 'mb', text: 'map · ' + name })];
    rows.forEach(function (r) { kids.push(row(r[0], r[1] || '', r[2])); });
    return h('div', { class: 'mapcard' }, kids);
  }
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'colwrap' }, [
      col('app', [['#412', 'dim'], ['#231', 'dim'], ['#340', 'dim']]),
      col('infra', [['#88', 'dim'], ['#199', 'dim']]),
      col('tests', [['#57', 'dim'], ['#58', 'dim'], ['#61', 'dim']])
    ]),
    h('div', { class: 'caption', text: 'three maps fill with tickets as you scroll' })
  ]);
}

function skOrder() {
  function col(name, rows) {
    var kids = [h('span', { class: 'mb', text: 'map · ' + name })];
    rows.forEach(function (r) { kids.push(row(r[0], r[1] || '', r[2])); });
    return h('div', { class: 'mapcard' }, kids);
  }
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'colwrap' }, [
      col('app', [['#412 takeable', 'hot', SC.takeable], ['#231 blocked', 'dim'], ['#340 blocked', 'dim']]),
      col('infra', [['#88 takeable', 'hot', SC.takeable], ['#199 blocked', 'dim']]),
      col('tests', [['#57 takeable', 'hot', SC.takeable], ['#61 blocked', 'dim']])
    ]),
    h('div', { class: 'caption', text: 'dependency order: the takeable ones light up, the blocked ones wait' })
  ]);
}

function skLanes() {
  function lane(t, stage, color) {
    return h('div', { style: 'display:flex;align-items:center;gap:0.5rem' }, [
      row(t, 'hot', color),
      h('span', { class: 'skills-note', text: stage })
    ]);
  }
  return h('div', { class: 'sketch' }, [
    h('div', { style: 'display:flex;flex-direction:column;gap:0.4rem' }, [
      lane('#412 dark-mode-tokens', 'agent', SC.agent),
      lane('#88 rotate-api-keys', 'agent', SC.agent),
      lane('#57 flaky-e2e-suite', 'gate', SC.gate),
      lane('#199 bump-node-22', 'agent', SC.agent)
    ]),
    h('div', { class: 'caption', text: 'four lanes at once, one per running agent' })
  ]);
}

function skGates() {
  return h('div', { class: 'sketch' }, [
    h('div', { class: 'phone pulse' }, [
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'curia' }), document.createTextNode('gate on #57 — Approve?')]),
      h('div', { class: 'bubble' }, [h('span', { class: 'who', text: 'agent' }), document.createTextNode('question on #412 — A / B / C')]),
      h('span', { class: 'approve', text: 'Approve #57' })
    ]),
    h('div', { class: 'caption', text: 'every moment that needs you queues on one phone' })
  ]);
}

/* ================================================================
   RENDER
   ================================================================ */
function sceneCard(sc, i) {
  var kids = [
    h('div', { class: 'scene-head' }, [
      h('span', { class: 'num', text: 'scene ' + (i + 1) }),
      h('span', { text: sc.name }),
      sc.tag ? h('span', { class: 'tag', text: sc.tag }) : null
    ]),
    sc.sketch(),
    h('div', { class: 'note', html: '<b>moves:</b> ' + sc.moves })
  ];
  if (sc.proof) kids.push(h('div', { class: 'note proof', html: '<b>proof:</b> ' + sc.proof }));
  if (sc.says) kids.push(h('div', { class: 'note', html: '<b>says:</b> ' + sc.says }));
  if (sc.under) kids.push(h('div', { class: 'under', html: '<b>facts under:</b><br>' + sc.under }));
  return h('section', { class: 'scene' }, kids);
}

function render(arc) {
  var main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(h('div', { class: 'intro' }, [
    h('p', { html: '<b>How to read this:</b> each card is one scene of the final page, in page order. The grey boxes are sketches, not the design. The <b>says</b> line is the gist only: the words are decided later, in their own ticket.' }),
    h('p', { html: 'Switch arcs with the bar below. Arc 1 is your story from round 1.' })
  ]));
  main.appendChild(h('div', { class: 'archead' }, [
    h('div', { class: 'k', text: 'arc · ' + arc.key }),
    h('h1', { text: arc.name }),
    h('p', { text: arc.logic })
  ]));
  arc.scenes.forEach(function (sc, i) { main.appendChild(sceneCard(sc, i)); });
  document.getElementById('sw-k').textContent = 'arc ' + (ARCS.indexOf(arc) + 1) + '/' + ARCS.length;
  document.getElementById('sw-n').textContent = arc.name;
}

var m = location.search.match(/[?&]arc=([^&]+)/);
var idx = 0;
if (m) ARCS.forEach(function (a, i) { if (a.key === decodeURIComponent(m[1])) idx = i; });

function go(i) {
  idx = (i + ARCS.length) % ARCS.length;
  var url = location.pathname + '?arc=' + ARCS[idx].key;
  history.replaceState(null, '', url);
  render(ARCS[idx]);
  window.scrollTo(0, 0);
}

document.querySelectorAll('.switch [data-step]').forEach(function (b) {
  b.addEventListener('click', function () { go(idx + Number(b.getAttribute('data-step'))); });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
});

render(ARCS[idx]);
})();
