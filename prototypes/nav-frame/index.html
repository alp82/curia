<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#560 · the main layout and the page navigation</title>
<!--
  THROWAWAY PROTOTYPE — alp82/curia#560 · the main layout and the page navigation structure.
  Three navigation-frame variants (A tab row · B home the hub · C the strip) around simplified
  copies of the six approved screens (#519 #521 #522 #523 #524 #525). The screens are the
  approved material; only the frame differs per variant. Switch variants with the ‹ › controls,
  color mode and frame width beside them. The two ⇢ buttons play the Discord deep links (#526).
-->
<style>
/* ---------- reset ---------- */
*{margin:0;padding:0;box-sizing:border-box}
svg{display:block}
a{cursor:pointer}
button{cursor:pointer;font-family:inherit}
html,body{background:#08090c}

/* ---------- prototype shell (not part of the design) ---------- */
.proto-head{position:sticky;top:0;z-index:40;background:#0e1013;border-bottom:1px solid #1c2027;
  padding:8px 12px;color:#cfd6e2;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ph-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-ttl{font-weight:700;letter-spacing:.06em;margin-right:auto}
.ph-btn{background:#171b22;border:1px solid #262c36;color:#cfd6e2;border-radius:7px;
  padding:5px 9px;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ph-btn.wide{min-width:104px;text-align:center}
.ph-note{margin-top:6px;color:#8a93a3;line-height:1.5}
.stage{display:flex;justify-content:center;padding:22px 12px 60px}
.frame{border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.5);overflow:hidden;
  display:flex;flex-direction:column;background:var(--bg);
  font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.frame.w-phone{width:390px;height:800px}
.frame.w-desktop{width:1280px;height:820px}
.frame.w-desktop.v-a{flex-direction:row}
@media (max-width:480px){
  .stage{padding:0}
  .frame,.frame.w-phone,.frame.w-desktop{width:100%;height:calc(100dvh - 58px);border-radius:0;box-shadow:none}
  .frame.w-desktop.v-a{flex-direction:column}
  .ph-hide-sm{display:none}
}

/* ---------- tokens ---------- */
.frame.dark{--bg:#0b0c10;--ink:#e6e9ef;--mut:#8a93a3;--line:#20242c;
  --amber:#ffb454;--amberw:#ffb454;--amberink:#231a00;--green:#41d98d;--cyan:#5ec8e5;
  --crit:#f07a7a;--needbg:rgba(255,180,84,.07);--dim:#14161c;--field:#13161d;--float:#13161d;
  --glow:0 0 14px rgba(255,180,84,.35)}
.frame.light{--bg:#f6f6f4;--ink:#17181c;--mut:#6b7280;--line:#e3e3e0;
  --amber:#ffc233;--amberw:#b97900;--amberink:#231a00;--green:#1fbf6b;--cyan:#0b6f8f;
  --crit:#b3323a;--needbg:rgba(185,121,0,.08);--dim:#eeeeeb;--field:#ffffff;--float:#ffffff;
  --glow:none}

/* ---------- viewport ---------- */
.viewport{flex:1;overflow-y:auto;position:relative;background:var(--bg)}
.scr{min-height:100%;padding:20px 20px 44px}
.scr.fill{height:100%;display:flex;flex-direction:column;padding:0;min-height:0}
.w-desktop .scr{padding:26px 44px 60px}
.w-desktop .scr.fill{padding:0}

/* ---------- shared atoms (from the approved screens) ---------- */
.mono,h2,.num,time,.ht,.chip,.sub,.dsub,.reads,.meta,.state .st,.go.mut-sz,.fchip,.word,.tglance
  {font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ht{display:flex;justify-content:space-between;font:10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  text-transform:uppercase;letter-spacing:.24em;color:var(--mut)}
.ht a{color:var(--cyan);text-decoration:none;text-transform:uppercase}
h2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);
  font-weight:600;margin:30px 0 4px}
h2 a{color:var(--cyan);text-decoration:none;letter-spacing:.1em;float:right}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
h2+.row,h2+.quest,h2+.srow{border-top:0}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ttl .sub{display:block;font-size:10px;color:var(--mut);font-weight:400;margin-top:2px}
.num{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.go{flex:none;font-size:12px;color:var(--cyan);text-decoration:none}
.go.dimmed{color:var(--mut)}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.dot.on{background:var(--green)}
.dot.dim{background:var(--mut);opacity:.4}
.chip{flex:none;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 8px;border-radius:4px;background:var(--amber);color:var(--amberink);box-shadow:var(--glow)}
time{color:var(--mut)}
.spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--green)}
.reads-strip .spark polyline{stroke:var(--cyan)}
.tap{cursor:pointer}

/* ---------- home (V6 synthesis, #519) ---------- */
.home .core{text-align:center;padding:24px 0 8px}
.home .ring{width:150px;height:150px;margin:0 auto;position:relative}
.home .ring svg{position:absolute;inset:0}
.home .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.home .ring .n{font:700 52px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--amber);
  text-shadow:var(--glow);line-height:1}
.home .ring .k{font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.3em;
  color:var(--mut);text-transform:uppercase;margin-top:6px}
.home .core .csub{margin-top:10px;font-size:12px;color:var(--mut)}
.home .reads-strip{display:flex;justify-content:center;gap:32px;margin-top:16px}
.home .reads-strip .v{font:700 17px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.home .reads-strip .k{font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);margin:2px 0 5px}
.home .quest{padding:11px 0;border-top:1px solid var(--line)}
.home .quest .l1{display:flex;align-items:baseline;gap:10px;font-size:14px}
.home .quest .l1 .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.home .qbar{height:2px;margin-top:8px;background:var(--line);position:relative}
.home .qbar i{position:absolute;top:0;bottom:0;left:0;background:var(--cyan)}
.home .qbar .fog{position:absolute;top:0;bottom:0;border-top:2px dotted var(--mut);opacity:.6}
.home .log .row{font-size:12px;color:var(--mut);padding:7px 0}
.home .log .row .ttl{font-weight:400;white-space:normal}
.home time{flex:none;width:44px;font-size:10px}
.w-desktop .home .grid6{display:grid;grid-template-columns:340px minmax(0,1fr) minmax(0,1fr);
  gap:0 44px;align-items:start}
.w-desktop .home .core{grid-column:1;grid-row:1/span 3;padding-top:52px}
.w-desktop .home .s-need{grid-column:2/span 2}
.w-desktop .home .s-agents{grid-column:2}
.w-desktop .home .s-maps{grid-column:3}
.w-desktop .home .s-log{grid-column:2/span 2}

/* ---------- agents (Focus, #521) ---------- */
.ag .reads{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.ag .reads b{color:var(--ink);font-weight:600}
.ag .reads .hot{color:var(--amberw);font-weight:700}
.ag .row.pick{cursor:pointer}
.ag .row.sel{border-left:3px solid var(--cyan);padding-left:11px;margin-left:-14px}
.ag .phone-hint{font-size:10px;color:var(--mut);margin-top:8px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ag .dtt{font-size:17px;font-weight:700;margin-top:2px}
.ag .dsub{font-size:11px;color:var(--mut);margin-top:4px}
.ag .state{font-size:14px;margin-top:12px}
.ag .state .st{font-weight:700}
.ag .state .st.need{color:var(--amberw)}
.ag .mgrid{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.ag .mgrid .v{font:700 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ag .mgrid .v.hot{color:var(--amberw)}
.ag .mgrid .k{font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);margin-top:3px}
.ag .story .row{font-size:12px;color:var(--mut);padding:7px 0}
.ag .story .row .ttl{font-weight:400;white-space:normal}
.ag time{flex:none;width:44px;font-size:10px}
.ag .acts{display:flex;gap:18px;margin-top:20px}
.w-desktop .ag .grid-ag{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 56px}
.w-desktop .ag .s-list{grid-column:1}
.w-desktop .ag .s-done{grid-column:1}
.w-desktop .ag .s-detail{grid-column:2;grid-row:1/span 2;border-left:1px solid var(--line);
  padding-left:44px;min-height:520px}
.w-desktop .ag .phone-hint{display:none}

/* ---------- maps (#522) ---------- */
.mp .filters{display:flex;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.fchip{font-size:11px;padding:6px 10px;border-radius:999px;background:transparent;
  border:1px solid var(--line);color:var(--mut)}
.fchip.on{border-color:var(--cyan);color:var(--cyan);font-weight:600}
.mp .map{margin-top:34px}
.mp .mhead{display:flex;align-items:baseline;gap:14px}
.mp .mfrac{font:700 24px ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.mp .mfrac .of{color:var(--mut)}
.mp .mfrac .fogn{color:var(--mut);font-size:14px}
.mp .mtt{min-width:0}
.mp .mtt .nm{display:block;font-size:15px;font-weight:700}
.mp .mtt .meta{display:block;font-size:10px;color:var(--mut);margin-top:3px}
.mp .mtt .meta a{color:var(--cyan);text-decoration:none}
.mp .band{display:flex;gap:3px;margin-top:14px;height:34px}
.mp .bseg{border:0;border-radius:5px;min-width:34px;display:flex;align-items:center;justify-content:center;
  gap:6px;overflow:hidden;font:700 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:0 8px;white-space:nowrap}
.mp .bseg .wd{font-weight:400;font-size:10px;letter-spacing:.08em}
.mp .bseg.selseg{outline:2px solid var(--mut);outline-offset:3px}
.mp .b-walk{background:var(--cyan);color:var(--bg)}
.mp .b-flight{background:var(--green);color:var(--bg)}
.mp .b-flight.needs{background:var(--amber);color:var(--amberink);box-shadow:var(--glow)}
.mp .b-take{background:transparent;border:2px solid var(--cyan);color:var(--cyan)}
.mp .b-wait{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px);color:var(--mut)}
.mp .b-fog{background:transparent;border:2px dotted var(--mut);color:var(--mut)}
.mp .panel{margin-top:14px;border-left:2px solid var(--line);padding:4px 0 4px 16px}
.mp .phead{font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut)}
.mp .prow{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:14px;min-width:0}
.mp .prow .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp .prow.dim{color:var(--mut);font-size:12px}
.mp .prow .word{font-size:11px;font-weight:700}
.mp .word.run{color:var(--green)}
.mp .word.take{color:var(--cyan)}
.mp .g-take{flex:none;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--cyan);background:var(--bg)}
.mp .g-wait{flex:none;width:4px;height:11px;background:var(--mut);opacity:.5}
.mp .detailpane{display:none}
.w-desktop .mp .md{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:0 64px}
.w-desktop .mp .detailpane{display:block;position:sticky;top:24px;margin-top:34px}
.w-desktop .mp .inlinepanel{display:none}

/* ---------- feed (the Wire, #523) ---------- */
.fd .screen{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:18px 0 2px}
.fd .fsub{font-size:12px;color:var(--mut)}
.fd .pulse{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.fd .pulse .k{font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.fd .dens{display:flex;align-items:flex-end;gap:2px;height:26px}
.fd .dens i{width:6px;background:var(--cyan);opacity:.85;border-radius:1px 1px 0 0}
.fd .fchips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.fd .fchips .fchip{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.fd .fchips .fchip.on{color:var(--ink);border-color:var(--mut)}
.fd .news{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fd .news time{flex:none;width:44px;font-size:10px}
.fd .news .bd{flex:1;min-width:0}
.fd .news .l1{font-size:14px;font-weight:600;line-height:1.4}
.fd .news .l1 .word{font-size:11px;font-weight:700;margin-right:6px}
.fd .news .l2{font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);margin-top:3px}
.fd .word.ok{color:var(--green)}
.fd .word.bad{color:var(--crit)}
.fd .word.warn{color:var(--amberw)}
.fd .word.info{color:var(--cyan)}
.fd .news.need{background:var(--needbg);border-top-color:transparent;margin:0 -10px;
  padding-left:10px;padding-right:10px;border-radius:6px}
.fd .news.calm-ok{border-left:2px solid var(--green);padding-left:12px;margin-left:-14px}
.fd .news.calm-bad{border-left:2px solid var(--crit);padding-left:12px;margin-left:-14px}
.fd .micro{padding:2px 0 2px 54px}
.fd .micro .m{display:flex;gap:10px;align-items:baseline;padding:4px 0;font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut)}
.fd .micro time{flex:none;width:38px;font-size:9px}
.fd .mark{display:flex;align-items:center;gap:10px;margin:24px 0 4px;
  font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.fd .mark::before,.fd .mark::after{content:"";flex:1;border-top:1px dashed var(--cyan);opacity:.5}
.fd .tailnote{margin-top:26px;padding-top:10px;border-top:1px solid var(--line);
  font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);line-height:1.6}
.fd .hiddenrow{display:none}
.w-desktop .fd .wrap{max-width:760px;margin:0 auto}

/* ---------- chats (#524) ---------- */
.ch .list{padding-bottom:20px}
.ch .row .state{flex:none;font-size:10px;color:var(--mut)}
.ch .row{cursor:pointer}
.chpane{height:100%;display:flex;flex-direction:column;min-height:0}
.chead{flex:none;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.chead .back{display:inline-block;color:var(--cyan);font-size:13px;text-decoration:none;margin-bottom:8px}
.chead .t1{font-size:16px;font-weight:700}
.chead .t2{font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);margin-top:3px}
.chead .t2 .need{color:var(--amberw);font-weight:700}
.chead .links{display:flex;gap:16px;margin-top:10px}
.chead .links a{font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--cyan);text-decoration:none}
.tl{flex:1;overflow-y:auto;padding:8px 20px 24px;min-height:0}
.tl .meta{font-size:10px;color:var(--mut);margin:16px 0 4px}
.tl .say{font-size:14px;line-height:1.55}
.tl .think{font-size:12px;color:var(--mut);font-style:italic}
.tl .tool{font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);padding:2px 0}
.tl .prompt{font-size:14px;line-height:1.5;border-right:3px solid var(--cyan);
  padding-right:10px;margin-left:15%;text-align:right}
.esc{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;
  margin-top:8px;padding:12px 14px}
.esc .ehead{display:flex;align-items:center;gap:10px}
.esc .enum{font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut)}
.esc .q{margin-top:12px}
.esc .qn{font:400 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mut)}
.esc .qh{font-size:14px;font-weight:600;margin-top:3px}
.esc .opt{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);
  margin-top:6px;cursor:pointer;font-size:13px}
.esc .opt .radio{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mut);margin-top:1px}
.esc .opt.picked .radio{border-color:var(--amber);background:var(--amber);box-shadow:inset 0 0 0 3px var(--bg)}
.esc .opt .rec{font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--amberw);margin-left:6px}
.esc .opt .oc{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.esc .other{display:inline-block;font-size:11px;color:var(--cyan);margin-top:8px;text-decoration:none}
.esc .efoot{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);
  font:600 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 15px;border-radius:7px}
.btn.prime{background:var(--amber);color:var(--amberink);border-color:var(--amber);
  box-shadow:var(--glow);font-weight:800;border-radius:999px}
.esc .fvw{font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut)}
.comp{flex:none;display:flex;gap:10px;padding:12px 20px 20px;align-items:center}
.comp input{flex:1;background:var(--field);border:1px solid var(--line);border-radius:999px;
  padding:11px 16px;font-size:14px;color:var(--ink)}
.comp .send{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--cyan);
  color:var(--bg);font-size:15px}
.ro-note{flex:none;padding:12px 20px 20px;font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut)}
.w-desktop .chduo{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%;min-height:0}
.w-desktop .chduo .chrail{border-right:1px solid var(--line);overflow-y:auto;padding:20px 20px 40px}
.w-desktop .chduo .chpane{min-width:0}
.w-desktop .chduo .chead .back{display:none}
.w-desktop .ch .row.sel{border-left:3px solid var(--cyan);padding-left:10px;margin-left:-13px}

/* ---------- terminal (#537) ---------- */
.term{background:#0a0b0e}
.term .thead{flex:none;display:flex;align-items:center;gap:12px;padding:14px 20px 10px;
  border-bottom:1px solid var(--line)}
.term .thead .back{color:var(--cyan);font-size:13px;text-decoration:none}
.term .thead .tt{flex:1;font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut)}
.term .tscreen{flex:1;overflow:hidden;margin:0;padding:14px 16px;
  font:400 11px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#9fe8b8;white-space:pre-wrap}
.term .tscreen .tdim{color:#57606f}
.term .tkeys{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.term .tkeys span{flex:1;text-align:center;font:600 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:8px 0}
.w-desktop .term .tkeys{display:none}

/* ---------- settings (drill-in, #525) ---------- */
.st .sec-row{display:flex;align-items:center;gap:14px;padding:20px 2px;border-top:1px solid var(--line);
  text-decoration:none;color:var(--ink)}
.st .sec-row:first-of-type{border-top:0}
.st .sec-row .t{font-size:16px;font-weight:600}
.st .sec-row .g{display:block;font:400 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--mut);margin-top:5px}
.st .sec-row .g.okw{color:var(--green)}
.st .sec-row .chev{margin-left:auto;font-size:18px;color:var(--mut)}
.st .back{display:inline-block;color:var(--cyan);font-size:14px;margin:6px 0 22px;text-decoration:none}
.st .srow{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);font-size:14px}
.st .key{font:400 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.st .grow{flex:1;min-width:0}
.st select,.st input[type=number]{background:var(--field);border:1px solid var(--line);border-radius:7px;
  padding:7px 10px;font:400 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
.st input[type=number]{width:76px}
.st input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
.st .hint{font:400 12px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);
  padding:2px 0 12px;max-width:520px}
.st .btn.hot{background:var(--amber);color:var(--amberink);border-color:var(--amber);
  box-shadow:var(--glow);font-weight:800}
.dock{position:sticky;bottom:14px;z-index:6;width:max-content;max-width:100%;margin:28px auto 0;
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;
  background:var(--float);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.dock .toast{font-size:13px;color:var(--mut)}
.dock .toast b{color:var(--ink)}
.dock .okw{color:var(--green);font:700 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  text-transform:uppercase;letter-spacing:.08em}
.dock .discard{font-size:12px;color:var(--mut);text-decoration:none}
.st .scr-inner{padding-bottom:90px}
.w-desktop .st .st-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:0 64px}
.w-desktop .st .st-home{position:sticky;top:20px;align-self:start}
.w-desktop .st .back{display:none}
.w-desktop .st .sec-body{max-width:560px}

/* ---------- variant A · the tab row ---------- */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);
  padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.tabbar .tab{flex:1;position:relative;text-align:center;text-decoration:none;color:var(--mut);
  font:600 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 0}
.tabbar .tab.cur{color:var(--ink)}
.tabbar .tab.cur::before{content:"";position:absolute;top:-11px;left:22%;right:22%;border-top:2px solid var(--cyan)}
.tglance{font-size:9px;margin-left:4px}
.tglance.g-need{background:var(--amber);color:var(--amberink);font-weight:800;
  padding:1px 5px;border-radius:3px;box-shadow:var(--glow)}
.tglance.g-run{color:var(--green)}
.rail{flex:none;width:200px;border-right:1px solid var(--line);background:var(--bg);
  padding:24px 20px;display:flex;flex-direction:column;gap:4px}
.rail .wm{font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.24em;
  text-transform:uppercase;color:var(--mut)}
.rail .rneed{margin:18px 0 10px;font:700 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--amberw);text-decoration:none}
.rail .tab{position:relative;text-decoration:none;color:var(--mut);padding:9px 0 9px 12px;margin-left:-12px;
  font:600 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.rail .tab.cur{color:var(--ink);border-left:2px solid var(--cyan);padding-left:10px}
.rail .rdate{margin-top:auto;font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}

/* ---------- variant C · the strip ---------- */
.stripnav{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.stripnav .l1{display:flex;justify-content:space-between;align-items:baseline;
  font:400 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.24em;
  text-transform:uppercase;color:var(--mut)}
.stripnav .l1 .gl a{text-decoration:none;color:var(--mut);letter-spacing:.12em}
.stripnav .l1 .gl a.need{color:var(--amberw);font-weight:700}
.stripnav .l2{display:flex;gap:2px;margin-top:8px}
.stripnav .l2 a{flex:1;text-align:center;text-decoration:none;color:var(--mut);
  font:600 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 0 9px;border-bottom:2px solid transparent}
.stripnav .l2 a.cur{color:var(--ink);border-bottom-color:var(--cyan)}
</style>

function screen(){
  switch (S.page){
    case 'home': return scrHome();
    case 'agents': return scrAgents();
    case 'maps': return scrMaps();
    case 'feed': return scrFeed();
    case 'chats':
    case 'chat': return scrChats();
    case 'terminal': return scrTerminal();
    case 'settings': return scrSettings();
  }
}
function render(){
  frame.className = frame.className.replace(/v-[abc]/,'v-' + S.v);
  frame.innerHTML = chromeRail() + chromeTop() +
    `<div class="viewport" id="vp">${screen()}</div>` + chromeBottom();
  el('phNote').textContent = NOTES[S.v];
  el('bVar').textContent = { a:'A · tab row', b:'B · the hub', c:'C · the strip' }[S.v];
  buildSparks(); buildDens();
  const u = new URL(location); u.searchParams.set('v', S.v); history.replaceState(null,'',u);
}
function buildSparks(){
  frame.querySelectorAll('svg[data-spark]').forEach(svg => {
    const vals = svg.dataset.spark.split(',').map(Number);
    const W = +svg.getAttribute('width'), H = +svg.getAttribute('height');
    const max = Math.max(...vals), min = Math.min(...vals);
    const pts = vals.map((v,i) => {
      const x = (i/(vals.length-1))*(W-4)+2;
      const y = H-2-((v-min)/((max-min)||1))*(H-4);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points', pts);
    svg.appendChild(pl);
  });
}
function buildDens(){
  frame.querySelectorAll('.dens[data-dens]').forEach(d => {
    const vals = d.dataset.dens.split(',').map(Number), max = Math.max(...vals);
    d.innerHTML = vals.map(v => `<i style="height:${Math.max(2, v/max*26)}px;opacity:${v === 0 ? .18 : .85}"></i>`).join('');
  });
}

/* ----------------------------------------------------------------------
   events
---------------------------------------------------------------------- */
frame.addEventListener('click', ev => {
  const opt = ev.target.closest('[data-opt]');
  if (opt){
    const qBlock = opt.closest('.q');
    qBlock.querySelectorAll('.opt').forEach(o => o.classList.remove('picked'));
    opt.classList.add('picked');
    return;
  }
  const save = ev.target.closest('[data-save]');
  if (save){ S.setPhase = 'applied'; render(); return; }
  const disc = ev.target.closest('[data-discard]');
  if (disc){ S.setPhase = 'clean'; S.setDirty = 0; render(); return; }
  const agent = ev.target.closest('[data-agent]');
  if (agent && !ev.target.closest('[data-go]')){ S.agentsSel = agent.dataset.agent; render(); return; }
  const seg = ev.target.closest('[data-seg]');
  if (seg){ const [m,g] = seg.dataset.seg.split('|'); S.mapsSel = { map:m, group:g }; render(); return; }
  const fam = ev.target.closest('[data-fam]');
  if (fam){ S.feedFam = fam.dataset.fam; render(); return; }
  const go = ev.target.closest('[data-go]');
  if (!go) return;
  ev.preventDefault();
  const [kind, arg] = go.dataset.go.split(':');
  if (kind === 'page'){ S.page = arg; if (arg === 'settings'){ S.setSec = null; } scrollTop(); }
  else if (kind === 'chat'){ S.page = frame.classList.contains('w-desktop') ? 'chats' : 'chat'; S.chatId = arg; scrollTop(); }
  else if (kind === 'terminal'){ S.page = 'terminal'; S.termFrom = arg || S.chatId; }
  else if (kind === 'set'){ S.setSec = arg === 'home' ? null : arg; scrollTop(); }
  render();
});
frame.addEventListener('change', ev => {
  if (ev.target.closest('[data-set]')){
    S.setDirty += 1; S.setPhase = 'dirty';
    /* re-render would wipe the operator's edit — flip only the dock */
    const inner = frame.querySelector('.scr-inner');
    const old = inner.querySelector('.dock'); if (old) old.remove();
    inner.insertAdjacentHTML('beforeend',
      `<div class="dock"><span class="toast"><b>${S.setDirty}</b> unsaved change${S.setDirty > 1 ? 's' : ''}</span>
       <button class="btn prime" data-save>Save</button><a class="discard" data-discard>discard</a></div>`);
  }
});
function scrollTop(){ const vp = el('vp'); if (vp) vp.scrollTop = 0; }

const VARS = ['a','b','c'];
el('bPrev').onclick = () => { S.v = VARS[(VARS.indexOf(S.v)+2)%3]; render(); };
el('bNext').onclick = () => { S.v = VARS[(VARS.indexOf(S.v)+1)%3]; render(); };
el('bVar').onclick = () => el('bNext').onclick();
el('bMode').onclick = () => {
  const dark = frame.classList.toggle('dark');
  frame.classList.toggle('light', !dark);
  el('bMode').textContent = dark ? 'light' : 'dark';
};
el('bWidth').onclick = () => {
  const desk = frame.classList.toggle('w-desktop');
  frame.classList.toggle('w-phone', !desk);
  el('bWidth').textContent = desk ? 'phone' : 'desktop';
  if (S.page === 'chat' && desk) S.page = 'chats';
  render();
};
el('bDlChat').onclick = () => {   /* Discord → one agent's chat (#526) */
  S.chatId = '519';
  S.page = frame.classList.contains('w-desktop') ? 'chats' : 'chat';

};
el('bDlHome').onclick = () => {   /* Discord → plain Atlas home (#526) */
  S.page = 'home'; render();
};
