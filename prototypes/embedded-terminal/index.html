<!-- PROTOTYPE — wayfinder alp82/curia#537: The embedded terminal.
     VERDICT (operator, 2026-08-19): variant a Screen wins. The embedded terminal replaces
     the terminal page, so port 8443 and its Serve rule retire in the build. The touch key
     row shows only on phones.
     Question: the terminal moves inside the dashboard on a same-origin /terminal/ route (#536).
     Does the embedded terminal replace the terminal page, so port 8443 retires?
     Three variants of where the embedded terminal lives, switchable via the floating bar or #v=:
       a — Screen:   the terminal is a dashboard screen; the nav stays.
       b — Split:    the terminal is a drawer inside the chat screen; the chat stays visible.
       c — Takeover: the terminal covers the viewport; a floating pill closes it.
     Every variant opens from the SAME chat-header link. The cols×rows badge is measured live,
     so each variant shows its own chrome cost against the full viewport grid.
     LIVE MODE: when serve.mjs runs beside a loopback ttyd, the terminal box becomes a real
     same-origin iframe on /terminal/ — a real tmux session running a real Claude Code instance,
     through the same proxy shape the sidecar takes in #536. Without it the fake pane renders.
     Canned data only. Throwaway code. Do not wire, do not promote. -->

  .chat-wrap { max-width: 640px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }

  /* ---------- the terminal ---------- */
  .term-box { background: var(--term-bg); display: flex; flex-direction: column; min-height: 0; flex: 1; }

<div id="app"></div>

<script>
/* ================= canned data ================= */
const SESS = "curia-263";
const TICKET = "#263";
const TITLE = "The dashboard reads the daemon";
const TERM_URL = "box.tail07.ts.net:8445/terminal/?arg=" + SESS;

const AGENTS = [
  { sess: "curia-255", state: "needs-you", ticket: "#255", title: "The note queue drains in order", ctx: 68 },
  { sess: "curia-263", state: "working", ticket: "#263", title: "The dashboard reads the daemon", ctx: 41 },
  { sess: "curia-review-263", state: "reading", ticket: "#263", title: "Cross-check of curia-263", ctx: 23 }
];

const CHAT = [
  { who: "you", text: "where are you on 263?" },
  { who: "curia", text: "The sidecar route for the chat pages is in. I run the daemon suite now, 2,736 tests. Next is the reconnect path.", meta: "curia-263 · claude-opus-5" },
  { who: "you", text: "show me the raw session" },
  { who: "curia", text: "Open the terminal from the header above. It is the same tmux pane the daemon drives.", meta: "curia-263 · claude-opus-5" }
];

/* the fake tmux pane: a Claude Code run inside the session */
const TERM_LINES = [
  { html: ' <span class="g">✻</span> Claude Code · <b>curia-263</b> — The dashboard reads the daemon' },
  { html: '' },
  { html: ' <span class="d">●</span> <span class="b">Read</span>(daemon/src/dashboard.mjs)' },
  { html: '   <span class="d">└ 412 lines</span>' },
  { html: ' <span class="d">●</span> <span class="b">Edit</span>(daemon/src/dashboard.mjs)' },
  { html: '   <span class="d">└ added the /terminal/ proxy route</span>' },
  { html: ' <span class="g">✻</span> Bash: <span class="y">npm test</span>' },
  { html: '   <span class="d">└ 2,736 passed, 0 failed</span>' },
  { html: '' },
  { html: ' <span class="d">The proxy forwards Host and Origin unchanged, so' },
  { html: ' ttyd keeps its own origin check behind the sidecar.</span>' },
  { html: '' }
];
let typed = "";

/* ================= state ================= */
const VARIANTS = {
  a: "Screen · nav stays",
  b: "Split · chat stays",
  c: "Takeover · chrome gone"
};
/* live mode: a real ttyd answers on the same-origin /terminal/ route */
let live = false;
const LIVE_SESS = "curia-537-demo";
fetch("/terminal/", { method: "GET" }).then(r => { live = r.ok && _h.get("l") !== "0"; render(); }).catch(() => {});
const _h = new URLSearchParams(location.hash.slice(1));
let variant = VARIANTS[_h.get("v")] ? _h.get("v") : "a";
let screen = ["home", "chat"].includes(_h.get("s")) ? _h.get("s") : "chat";
let termOpen = _h.get("t") === "1";
let drawerTall = false;

function syncHash() {
  location.hash = "v=" + variant + "&s=" + screen + "&t=" + (termOpen ? "1" : "0");
}
const goto = s => { screen = s; syncHash(); render(); };
const setVariant = v => { variant = v; syncHash(); render(); };
function cycle(d) {
  const ks = Object.keys(VARIANTS);
  setVariant(ks[(ks.indexOf(variant) + d + ks.length) % ks.length]);
}
function openTerm() { termOpen = true; syncHash(); render(); }
function closeTerm() {
  /* the real dashboard removes the iframe here, so the hidden client
     stops holding an old size in tmux (#536) */
  termOpen = false; syncHash(); render();
}

/* ================= terminal mock ================= */
const escT = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function termScreen() {
  if (live) return `<iframe class="term-frame" src="/terminal/" allow="clipboard-read; clipboard-write"></iframe>`;
  const prompt = ' <span class="g">❯</span> ' + escT(typed) + '<span class="cur"> </span>';
  return `<div class="term-screen" id="term-screen" onclick="focusTerm()">
      <pre>${TERM_LINES.map(l => l.html).join("\n")}\n${prompt}</pre>
    </div>
    <div class="tmux-bar"><span>[${SESS}] 0:claude*</span><span>"box" 14:52</span></div>`;
}
function touchKeys() {
  if (live) return "";
  return `<div class="touch-keys">
    ${["Esc", "Tab", "Ctrl-C", "↑", "↓", "←", "→", "Enter", "/", "1", "2", "3"].map(k =>
      `<button onclick="touchKey('${k}')">${k}</button>`).join("")}
  </div>`;
}
function gridBadge() {
  if (live) return `<span class="grid-badge">live · ttyd</span>`;
  return `<span class="grid-badge" id="grid-badge">…×…</span>`;
}
const dispSess = () => live ? LIVE_SESS : SESS;
const dispUrl = () => live ? location.host + "/terminal/" : TERM_URL;

function touchKey(k) {
  if (k === "Enter") return keyEnter();
  if (k === "Ctrl-C") { typed = ""; }
  else if (["Esc", "Tab", "↑", "↓", "←", "→"].includes(k)) { /* keys go to tmux; no echo */ }
  else typed += k;
  patchPrompt();
}
function keyEnter() {
  if (typed.trim()) {
    TERM_LINES.push({ html: ' <span class="g">❯</span> ' + escT(typed) });
    TERM_LINES.push({ html: ' <span class="d">(canned — real keys go to tmux over /terminal/ws)</span>' });
  }
  typed = "";
  render();
}
function focusTerm() { /* the fake pane reads document keydown; nothing to focus */ }
document.addEventListener("keydown", e => {
  if (live || !termVisible()) return;
  if (e.target.closest("input")) return;
  if (["ArrowLeft", "ArrowRight"].includes(e.key) && e.altKey) return;
  if (e.key === "Enter") { keyEnter(); e.preventDefault(); return; }
  if (e.key === "Backspace") { typed = typed.slice(0, -1); patchPrompt(); e.preventDefault(); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { typed += e.key; patchPrompt(); e.preventDefault(); }
});
function termVisible() { return termOpen && screen === "chat"; }
function patchPrompt() { render(); }

/* the live grid: measure the pane against a real character cell */
function measureGrid() {
  const el = document.getElementById("term-screen");
  const badge = document.getElementById("grid-badge");
  if (!el || !badge) return;
  const probe = document.createElement("pre");
  probe.style.cssText = "position:absolute;visibility:hidden;margin:0";
  probe.textContent = "M".repeat(50) + "\n".repeat(9) + "M";
  probe.style.font = getComputedStyle(el.querySelector("pre")).font;
  el.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / 50;
  const lh = probe.getBoundingClientRect().height / 10;
  el.removeChild(probe);
  const r = el.getBoundingClientRect();
  const cols = Math.floor((r.width - 12) / cw), rows = Math.floor((r.height - 8) / lh) + 1; /* +1: the tmux bar row */
  const full = Math.floor(window.innerWidth / cw) + "×" + Math.floor(window.innerHeight / lh);
  badge.textContent = cols + "×" + rows + " of " + full;
}
window.addEventListener("resize", () => requestAnimationFrame(measureGrid));

/* ================= screens ================= */
function screenHome() {
  return `<div class="screen-head"><h2>Home</h2><span class="dim-note">stub — the home screen is the dashboard prototype's ticket</span></div>
    <div class="stat-tiles">
      <div class="tile warn"><div class="v">1</div><div class="l">needs you</div></div>
      <div class="tile"><div class="v">3</div><div class="l">agents running</div></div>
      <div class="tile"><div class="v">1</div><div class="l">open PRs</div></div>
    </div>
    <div class="h-sect"><h3>Fleet (3)</h3>
      ${AGENTS.map(a => `<div class="h-row"><span class="dot ${a.state}"></span>
        <span class="sess mono">${a.sess}</span>
        <span class="ticket"><span class="mono">${a.ticket}</span> ${escT(a.title)}</span>
        <a href="#" onclick="goto('chat');return false">chat</a></div>`).join("")}
    </div>`;
}

function chatHeader() {
  return `<div class="screen-head"><h2>Chat — <span class="mono">${SESS}</span></h2>
    <span class="links"><a href="#">thread</a><a href="#">PR #264</a><a href="#">preview :4310</a>
      <a href="#" class="term-link" onclick="openTerm();return false">terminal</a></span></div>`;
}
function chatThread() {
  return `<div class="chat-thread">${CHAT.map(m => `<div class="chat-msg ${m.who}">${escT(m.text)}
      ${m.meta ? `<span class="meta">${m.meta}</span>` : ""}</div>`).join("")}</div>`;
}
function chatInput() {
  return `<div class="chat-input"><input type="text" placeholder="talk to ${SESS}…">
    <button class="btn primary">send</button></div>`;
}

/* --- variant a: the terminal is its own screen; the chat-header link navigates to it --- */
function screenTermA() {
  return `<div class="term-box" style="flex:1">
    <div class="term-head">
      <button class="back" onclick="closeTerm()">‹ chat</button>
      <span class="sess">${dispSess()}</span>
      <span class="url">${dispUrl()}</span>
      ${gridBadge()}
      <button class="x" onclick="closeTerm()" title="close — detaches this tmux client">×</button>
    </div>
    ${termScreen()}${touchKeys()}
  </div>`;
}

/* --- variant b: the terminal is a drawer under the chat --- */
function screenChatB() {
  return `${chatHeader()}
    <div class="split-col">
      <div class="chat-part"><div class="chat-wrap" style="max-width:640px">
        ${chatThread()}${termOpen ? "" : chatInput()}</div></div>
      ${termOpen ? `<div class="drawer ${drawerTall ? "h85" : "h55"}">
        <div class="term-head">
          <span class="sess">${dispSess()}</span>
          <span class="url">${dispUrl()}</span>
          ${gridBadge()}
          <button class="back" onclick="drawerTall=!drawerTall;render()">${drawerTall ? "shrink" : "grow"}</button>
          <button class="x" onclick="closeTerm()" title="close — detaches this tmux client">×</button>
        </div>
        <div class="term-box">${termScreen()}</div>${touchKeys()}
      </div>` : ""}
    </div>`;
}

/* --- variant c: the takeover covers everything --- */
function takeoverC() {
  return `<div class="takeover">
      <div class="term-box">${termScreen()}</div>${touchKeys()}
    </div>
    <div class="pill-float">
      <span class="sess">${dispSess()}</span>${gridBadge()}
      <button class="x" onclick="closeTerm()" title="close — detaches this tmux client">×</button>
    </div>`;
}

function screenChatPlain() {
  return `${chatHeader()}
    <div class="chat-wrap">
      <div class="chat-note">The <b>terminal</b> link in this header is the judged affordance. It opens the
        same-origin <span class="mono">/terminal/</span> route — no port 8443. Flip variants with the black bar below.
        ${live ? `<b>Live:</b> a real ttyd serves a throwaway tmux session (<span class="mono">${LIVE_SESS}</span>)
        with a real Claude Code inside, through the same proxy shape as #536.` : ""}</div>
      ${chatThread()}${chatInput()}
    </div>`;
}

/* ================= shell ================= */
function render() {
  let main, termHost = false;
  if (screen === "home") main = screenHome();
  else if (variant === "a" && termOpen) { main = screenTermA(); termHost = true; }
  else if (variant === "b") { main = screenChatB(); termHost = false; }
  else main = screenChatPlain();

  const overlay = (variant === "c" && termOpen && screen === "chat") ? takeoverC() : "";

  document.getElementById("app").innerHTML = `<div class="frame">
    <div class="ticket-strip">prototype · alp82/curia#537 · the embedded terminal · canned data, throwaway</div>
    <div class="shell">
      <nav><span class="brand">curia</span>
        <button class="${screen === "home" ? "on" : ""}" onclick="goto('home')">Home <span class="n">1</span></button>
        <button disabled title="not in this prototype">Agents</button>
        <button disabled title="not in this prototype">Frontier</button>
        <button disabled title="not in this prototype">Feed</button>
        <button class="${screen === "chat" ? "on" : ""}" onclick="goto('chat')">Chat</button>
        <button disabled title="not in this prototype">Settings</button>
      </nav>
      <main class="${termHost ? "term-host" : ""}">${main}</main>
    </div>
    ${overlay}
    <div class="vswitch">
      <button onclick="cycle(-1)" title="previous variant">‹</button>
      <span class="lab">${variant} — ${VARIANTS[variant]}</span>
      <button onclick="cycle(1)" title="next variant">›</button>
    </div>
  </div>`;
  requestAnimationFrame(measureGrid);
}
document.addEventListener("keydown", e => {
  if (e.target.closest("input")) return;
  if (!e.altKey) return; /* plain arrows belong to the fake terminal */
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
