<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curia setup journey prototype</title>
  <style>
    /* Three variants of the installation setup journey, switchable via ?variant=, on this throwaway prototype route. */
    :root { --ink:#17231d; --muted:#66736b; --line:#dbe2dd; --paper:#fbfcfa; --green:#226b45; --lime:#dff35c; --red:#a33b31; --blue:#265c91; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1ed; font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .shell { min-height:100vh; padding-bottom:88px; }
    .topbar { height:58px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; background:#14251c; color:white; }
    .brand { display:flex; gap:10px; align-items:center; font-weight:750; letter-spacing:-.02em; }
    .mark { width:25px; height:25px; border-radius:8px 8px 8px 2px; background:var(--lime); color:#14251c; display:grid; place-items:center; font-size:13px; }
    .host { color:#b7c3bb; font-size:13px; }
    .main { max-width:1120px; margin:0 auto; padding:32px 24px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:30px; line-height:1.12; letter-spacing:-.035em; }
    h2 { font-size:20px; letter-spacing:-.02em; }
    h3 { font-size:15px; }
    .muted { color:var(--muted); }
    .eyebrow { color:var(--green); text-transform:uppercase; letter-spacing:.1em; font-size:11px; font-weight:800; }
    .card { background:white; border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 1px 2px #14251c0a; }
    .button { border:0; border-radius:9px; padding:10px 15px; background:#1d653f; color:white; font-weight:700; }
    .button.secondary { background:white; color:var(--ink); border:1px solid #bdc8c0; }
    .button.quiet { background:transparent; color:var(--muted); }
    .button:disabled { opacity:.45; cursor:not-allowed; }
    .actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .status { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:750; }
    .status.done { background:#dceee3; color:#155833; }
    .status.current { background:#fff2c2; color:#70540c; }
    .status.waiting { background:#edf0ed; color:#627068; }
    .status.problem { background:#f8e0dc; color:#87332a; }
    .notice { border-left:4px solid var(--blue); background:#edf5fc; padding:13px 15px; border-radius:5px; margin:16px 0; }
    .notice.problem { border-color:var(--red); background:#fff0ed; }
    .notice.success { border-color:var(--green); background:#e8f5ed; }
    .field { margin:15px 0; }
    .field label { display:block; font-size:13px; font-weight:750; margin-bottom:6px; }
    .field input, .field select { width:100%; border:1px solid #b8c3bb; border-radius:8px; background:white; padding:10px 11px; color:var(--ink); }
    .code { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; background:#15231c; color:#e7ede9; border-radius:8px; font:13px/1.4 ui-monospace, monospace; }
    .provider { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .provider button { text-align:left; border:1px solid var(--line); background:white; border-radius:10px; padding:14px; }
    .provider button.selected { border:2px solid var(--green); padding:13px; background:#f5faf6; }
    .state-dump { margin-top:24px; border-top:1px dashed #b7c0ba; padding-top:12px; color:#657169; font:11px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
    .switcher { position:fixed; z-index:50; left:50%; bottom:20px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:7px; border-radius:999px; color:white; background:#111b16; box-shadow:0 8px 30px #0d181199; }
    .switcher button { width:38px; height:38px; border:0; border-radius:50%; color:white; background:#2a3931; font-size:20px; }
    .switcher span { min-width:190px; text-align:center; font-weight:750; font-size:13px; }
    .reopen { position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; background:#132019f2; color:white; text-align:center; }
    .reopen .button { background:var(--lime); color:#16221b; }
    /* A: focused step with persistent progress rail. */
    .a-grid { display:grid; grid-template-columns:260px minmax(0,1fr); gap:24px; }
    .a-rail { padding:20px 0; }
    .a-step { display:flex; gap:11px; padding:12px 16px; border-left:3px solid transparent; }
    .a-step.active { background:#fff; border-color:var(--green); }
    .a-dot { flex:0 0 24px; height:24px; border-radius:50%; display:grid; place-items:center; background:#dce2dd; font-size:12px; font-weight:800; }
    .a-step.complete .a-dot { background:var(--green); color:white; }
    .a-work { max-width:690px; }
    .a-work .card { padding:30px; }
    /* B: operations console with timeline and evidence. */
    .b-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:20px; }
    .b-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(310px,.65fr); gap:18px; }
    .b-list { padding:0; overflow:hidden; }
    .b-row { display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:8px; padding:16px 18px; border-bottom:1px solid var(--line); }
    .b-row:last-child { border:0; }
    .b-row.active { background:#f6f9ec; }
    .b-number { font:700 13px ui-monospace,monospace; color:var(--muted); }
    .b-detail { min-height:340px; }
    .evidence { margin:10px 0; padding:10px; border-radius:8px; background:#f1f4f1; font:12px ui-monospace,monospace; }
    /* C: compact field guide with all context visible. */
    .c-layout { max-width:850px; margin:auto; }
    .c-intro { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:start; margin-bottom:18px; }
    .c-list { background:white; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .c-item { border-bottom:1px solid var(--line); }
    .c-item:last-child { border:0; }
    .c-summary { display:grid; grid-template-columns:28px 130px 1fr auto; gap:12px; align-items:center; padding:13px 16px; }
    .c-check { width:20px; height:20px; border:2px solid #9ca9a0; border-radius:4px; display:grid; place-items:center; font-size:12px; }
    .c-item.complete .c-check { background:var(--green); border-color:var(--green); color:white; }
    .c-detail { padding:4px 18px 20px 186px; }
    .c-item:not(.active) .c-detail { display:none; }
    @media (max-width:760px) {
      .a-grid,.b-grid { grid-template-columns:1fr; }
      .a-rail { display:flex; overflow:auto; padding:0; }
      .a-step { min-width:150px; border-left:0; border-bottom:3px solid transparent; }
      .c-summary { grid-template-columns:26px 1fr auto; }
      .c-summary .desc { display:none; }
      .c-detail { padding:4px 16px 18px 56px; }
      .topbar { padding:0 16px; }
      .host { display:none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const variants = [
      { key: 'A', name: 'Guided path' },
      { key: 'B', name: 'Verification console' },
      { key: 'C', name: 'Field checklist' }
    ];
    const steps = [
      { key:'github', name:'GitHub', summary:'Create and install the dedicated GitHub App' },
      { key:'discord', name:'Discord', summary:'Connect the bot and choose its command channel' },
      { key:'tailscale', name:'Tailscale', summary:'Confirm the operator identity for this Curia host' },
      { key:'model', name:'Model provider', summary:'Sign in to OpenAI or Anthropic' },
      { key:'full', name:'Full loop', summary:'Send one request from Discord and verify the result' }
    ];
    const state = { step:0, complete:[], provider:'openai', failed:false, corrected:false, closed:false };
    const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    const variantKey = () => new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A';
    const current = () => steps[state.step];
    const isDone = key => state.complete.includes(key);
    function setVariant(key) { const u=new URL(location); u.searchParams.set('variant',key); history.replaceState({},'',u); render(); }
    function cycle(amount) { const i=variants.findIndex(v=>v.key===variantKey()); setVariant(variants[(i+amount+variants.length)%variants.length].key); }
    function completeStep() { const key=current().key; if (!isDone(key)) state.complete.push(key); if (state.step < steps.length-1) state.step++; render(); }
    function selectStep(i) { if (i <= state.complete.length) { state.step=i; render(); } }
    function verify() {
      if (current().key==='tailscale' && !state.corrected) { state.failed=true; render(); return; }
      state.failed=false; completeStep();
    }
    function content() {
      const s=current();
      if (s.key==='github') return `<div class="eyebrow">Step 1 of 5</div><h2>Connect GitHub</h2><p>Curia creates a dedicated GitHub App. You review and approve it on GitHub, then install it for at least one repository owner.</p><div class="notice">You sign in and grant access on GitHub. Curia never sees your password or browser session.</div><div class="code"><span>Curia for alp-workstation</span><span>Prepared manifest</span></div><div class="actions"><button class="button" onclick="completeStep()">Open GitHub and continue</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`;
      if (s.key==='discord') return `<div class="eyebrow">Step 2 of 5</div><h2>Connect Discord</h2><p>Create Curia's dedicated bot, then choose where commands and results appear.</p><div class="field"><label>Bot token</label><input type="password" value="••••••••••••" aria-label="Bot token"><div class="muted">Saved directly to a protected file. Curia won't show it again.</div></div><div class="field"><label>Discord server</label><select><option>Alp's workshop</option><option>Curia testing</option></select></div><div class="field"><label>Command channel</label><input value="curia" aria-label="Command channel"></div><div class="actions"><button class="button" onclick="completeStep()">Save and verify Discord</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`;
      if (s.key==='tailscale') return `<div class="eyebrow">Step 3 of 5</div><h2>Confirm your Tailscale identity</h2><p>This identity opened Curia through Tailscale. Confirm that it should become the initial operator.</p><div class="card" style="background:#f7f9f7;padding:16px"><strong>alex@example.com</strong><br><span class="muted">alp-workstation · 100.91.24.8</span></div>${state.failed ? `<div class="notice problem"><strong>Curia couldn't verify Tailscale Serve.</strong><br>Run <code>tailscale serve --bg 3000</code> on this host, then try again.</div><div class="actions"><button class="button secondary" onclick="state.corrected=true;state.failed=false;render()">I've run the command</button><button class="button" ${state.corrected?'':'disabled'} onclick="verify()">Try again</button></div>` : `<div class="actions"><button class="button" onclick="verify()">Confirm and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
      if (s.key==='model') return `<div class="eyebrow">Step 4 of 5</div><h2>Choose one model provider</h2><p>One verified provider is required. You can add the other after setup.</p><div class="provider"><button class="${state.provider==='openai'?'selected':''}" onclick="state.provider='openai';render()"><strong>OpenAI</strong><br><span class="muted">Use subscription sign-in</span></button><button class="${state.provider==='anthropic'?'selected':''}" onclick="state.provider='anthropic';render()"><strong>Anthropic</strong><br><span class="muted">Use subscription sign-in</span></button></div><div class="actions"><button class="button" onclick="completeStep()">Sign in to ${state.provider==='openai'?'OpenAI':'Anthropic'} and test</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`;
      return `<div class="eyebrow">Final verification</div><h2>Complete the first Full loop</h2><p>Curia is connected. Send one real request through Discord to verify the complete operator journey.</p><div class="code"><span>#curia</span><span>@Curia summarize alp82/curia issue 848</span></div>${isDone('full') ? `<div class="notice success"><strong>Full loop verified.</strong><br>Discord request received · agent started · result posted to #curia in 42 seconds.</div><div class="actions"><button class="button">Open Curia</button><button class="button secondary">View verification details</button></div>` : `<div class="actions"><button class="button" onclick="completeStep()">Simulate request and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
    }
    function stateDump() { return `<div class="state-dump">PROTOTYPE STATE  ${esc(JSON.stringify({active:current().key,completed:state.complete,provider:state.provider,verificationFailure:state.failed,resumed:!state.closed},null,2))}</div>`; }
    function header() { return `<header class="topbar"><div class="brand"><span class="mark">C</span> Curia setup</div><div class="host">alp-workstation · local installation</div></header>`; }
    function variantA() { return `${header()}<main class="main"><div class="a-grid"><aside class="a-rail">${steps.map((s,i)=>`<div class="a-step ${i===state.step?'active':''} ${isDone(s.key)?'complete':''}"><span class="a-dot">${isDone(s.key)?'✓':i+1}</span><div><strong>${s.name}</strong><div class="muted">${isDone(s.key)?'Verified':i===state.step?'In progress':'Waiting'}</div></div></div>`).join('')}</aside><section class="a-work"><p class="muted">Your progress is saved. You can close this page at any time.</p><div class="card">${content()}${stateDump()}</div></section></div></main>`; }
    function variantB() { return `${header()}<main class="main"><div class="b-head"><div><div class="eyebrow">Installation verification</div><h1>Bring Curia online</h1><p class="muted">Complete each external connection, then prove the Full loop.</p></div><button class="button secondary" onclick="state.closed=true;render()">Close and resume later</button></div><div class="b-grid"><section class="card b-list">${steps.map((s,i)=>`<div class="b-row ${i===state.step?'active':''}"><span class="b-number">0${i+1}</span><div><strong>${s.name}</strong><div class="muted">${s.summary}</div></div><span class="status ${isDone(s.key)?'done':i===state.step?(state.failed?'problem':'current'):'waiting'}">${isDone(s.key)?'Verified':i===state.step?(state.failed?'Action required':'Ready'):'Locked'}</span></div>`).join('')}</section><aside class="card b-detail"><div class="eyebrow">Selected check</div>${content()}<div class="evidence">${isDone(current().key)?'Evidence: current external fact verified':'Evidence appears here after verification'}</div>${stateDump()}</aside></div></main>`; }
    function variantC() { return `${header()}<main class="main c-layout"><div class="c-intro"><div><div class="eyebrow">Setup field guide</div><h1>Five checks to a working Curia</h1><p class="muted">Work from top to bottom. Every check explains what leaves this host.</p></div><span class="status current">${state.complete.length}/5 verified</span></div><section class="c-list">${steps.map((s,i)=>`<article class="c-item ${isDone(s.key)?'complete':''} ${i===state.step?'active':''}"><div class="c-summary" onclick="selectStep(${i})"><span class="c-check">${isDone(s.key)?'✓':''}</span><strong>${s.name}</strong><span class="desc muted">${s.summary}</span><span>${isDone(s.key)?'Verified':i===state.step?'Open':'Pending'}</span></div>${i===state.step?`<div class="c-detail">${content()}${stateDump()}</div>`:''}</article>`).join('')}</section></main>`; }
    function switcher() { const v=variants.find(v=>v.key===variantKey())||variants[0]; return `<nav class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span>${v.key} · ${v.name}</span><button onclick="cycle(1)" aria-label="Next variant">→</button></nav>`; }
    function reopen() { return state.closed ? `<div class="reopen"><div><div class="mark" style="margin:0 auto 18px">C</div><h1>Setup paused</h1><p>Your completed checks and current step are saved on this host.</p><button class="button" onclick="state.closed=false;render()">Resume with ${current().name}</button></div></div>` : ''; }
    function render() { const key=variantKey(); document.getElementById('app').innerHTML=(key==='B'?variantB():key==='C'?variantC():variantA())+switcher()+reopen(); }
    addEventListener('keydown', e => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable) return; if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1); });
    addEventListener('popstate',render);
    render();
  </script>
</body>
</html>
