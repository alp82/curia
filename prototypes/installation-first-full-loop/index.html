<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curia setup journey prototype</title>
  <style>
    /* Eight variants of the installation setup journey, switchable via ?variant=, on this throwaway prototype route. */
    :root { --ink:#17231d; --muted:#66736b; --line:#dbe2dd; --paper:#fbfcfa; --green:#226b45; --lime:#dff35c; --red:#a33b31; --blue:#265c91; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef1ed; font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .shell { min-height:100vh; padding-bottom:88px; }
    .topbar { height:58px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; background:#14251c; color:white; }
    .brand { display:flex; gap:10px; align-items:center; font-weight:750; letter-spacing:-.02em; }
    .mark { width:25px; height:25px; border-radius:8px 8px 8px 2px; background:var(--lime); color:#14251c; display:grid; place-items:center; font-size:13px; }
    .host { color:#b7c3bb; font-size:13px; }
    .main { max-width:1120px; margin:0 auto; padding:32px 24px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:30px; line-height:1.12; letter-spacing:-.035em; }
    h2 { font-size:20px; letter-spacing:-.02em; }
    h3 { font-size:15px; }
    .muted { color:var(--muted); }
    .eyebrow { color:var(--green); text-transform:uppercase; letter-spacing:.1em; font-size:11px; font-weight:800; }
    .card { background:white; border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:0 1px 2px #14251c0a; }
    .button { border:0; border-radius:9px; padding:10px 15px; background:#1d653f; color:white; font-weight:700; }
    .button.secondary { background:white; color:var(--ink); border:1px solid #bdc8c0; }
    .button.quiet { background:transparent; color:var(--muted); }
    .button:disabled { opacity:.45; cursor:not-allowed; }
    .actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .status { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:750; }
    .status.done { background:#dceee3; color:#155833; }
    .status.current { background:#fff2c2; color:#70540c; }
    .status.waiting { background:#edf0ed; color:#627068; }
    .status.problem { background:#f8e0dc; color:#87332a; }
    .notice { border-left:4px solid var(--blue); background:#edf5fc; padding:13px 15px; border-radius:5px; margin:16px 0; }
    .notice.problem { border-color:var(--red); background:#fff0ed; }
    .notice.success { border-color:var(--green); background:#e8f5ed; }
    .field { margin:15px 0; }
    .field label { display:block; font-size:13px; font-weight:750; margin-bottom:6px; }
    .field input, .field select { width:100%; border:1px solid #b8c3bb; border-radius:8px; background:white; padding:10px 11px; color:var(--ink); }
    .code { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; background:#15231c; color:#e7ede9; border-radius:8px; font:13px/1.4 ui-monospace, monospace; }
    .provider { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .provider button { text-align:left; border:1px solid var(--line); background:white; border-radius:10px; padding:14px; }
    .provider button.selected { border:2px solid var(--green); padding:13px; background:#f5faf6; }
    .state-dump { margin-top:24px; border-top:1px dashed #b7c0ba; padding-top:12px; color:#657169; font:11px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
    .switcher { position:fixed; z-index:50; left:50%; bottom:20px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:7px; border-radius:999px; color:white; background:#111b16; box-shadow:0 8px 30px #0d181199; }
    .switcher button { width:38px; height:38px; border:0; border-radius:50%; color:white; background:#2a3931; font-size:20px; }
    .switcher span { min-width:190px; text-align:center; font-weight:750; font-size:13px; }
    .reopen { position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; background:#132019f2; color:white; text-align:center; }
    .reopen .button { background:var(--lime); color:#16221b; }
    /* A: focused step with persistent progress rail. */
    .a-grid { display:grid; grid-template-columns:390px minmax(0,1fr); gap:24px; }
    .a-rail { display:flex; flex-direction:column; gap:12px; padding:20px 0; }
    .a-step { display:flex; gap:11px; height:190px; padding:15px 16px; overflow:hidden; border-left:3px solid transparent; align-items:flex-start; }
    .a-step.active { background:#fff; border-color:var(--green); }
    .a-dot { flex:0 0 24px; height:24px; border-radius:50%; display:grid; place-items:center; background:#dce2dd; font-size:12px; font-weight:800; }
    .a-step.complete .a-dot { background:var(--green); color:white; }
    .a-copy { min-width:0; flex:1; }
    .a-evidence { margin-top:7px; color:#526158; font-size:12px; line-height:1.4; }
    .a-evidence code { color:#335141; font-size:11px; }
    .a-step.active .a-evidence { color:#34473c; }
    .native-preview { margin-top:7px; border-radius:9px; overflow:hidden; text-align:left; }
    .ticket-stub { display:flex; align-items:center; gap:9px; padding:9px 10px; border:1px solid #cfd8d2; border-left:4px solid #59636e; background:#fff; }
    .ticket-body { min-width:0; flex:1; }
    .ticket-stub .ticket-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#29312d; font-weight:700; }
    .ticket-stub .ticket-meta { display:flex; justify-content:space-between; margin-top:5px; color:#69756e; font-size:10px; }
    .discord-preview { padding:9px 10px; color:#eceefc; background:#5865f2; }
    .discord-preview .channel { display:flex; align-items:center; gap:8px; font-weight:800; }.discord-preview .message { margin-top:5px; padding-left:37px; font-size:11px; }
    .brand-logo { width:28px; height:28px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; }
    .github-logo { color:white; background:#24292f; }.github-logo svg { width:19px; height:19px; fill:currentColor; }
    .discord-logo { color:#5865f2; background:#fff; border-radius:9px; }.discord-logo svg { width:19px; height:19px; fill:currentColor; }
    .tail-preview { display:flex; align-items:center; gap:11px; padding:9px 10px; color:#f2f4f3; background:#252525; }
    .tail-logo { width:29px; display:grid; grid-template-columns:repeat(3,5px); gap:3px; flex:0 0 auto; }
    .tail-logo i { width:5px; height:5px; border-radius:50%; background:white; }.tail-logo i:nth-child(2n) { opacity:.35; }
    .model-preview { display:flex; align-items:center; gap:8px; padding:9px 10px; color:#202723; background:#eee9df; }
    .model-mark { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:white; background:#111; font-weight:800; }
    .model-mark.anthropic { border-radius:6px; color:#1d1d1b; background:#d8c6ac; }
    .loop-preview { display:flex; align-items:center; justify-content:space-between; gap:5px; padding:10px; color:#e8f7ed; background:#174e32; font-size:10px; }
    .loop-preview b { color:var(--lime); font-size:14px; }
    .visual-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:9px; }
    .visual-metric { min-width:0; padding:8px 5px; border-radius:7px; text-align:center; color:#314038; background:#e9eeea; }
    .visual-metric b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }.visual-metric small { font-size:9px; text-transform:uppercase; letter-spacing:.04em; }
    .service-icon { display:inline-flex; align-items:center; gap:6px; margin-bottom:3px; color:#38473f; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    .service-icon .glyph { width:19px; height:19px; border-radius:5px; display:grid; place-items:center; color:white; background:#202722; font-size:10px; text-transform:none; }
    .service-icon.discord .glyph { background:#5865f2; }.service-icon.tailscale .glyph { background:#252525; }.service-icon.model .glyph { color:#252525; background:#d8c6ac; }.service-icon.full .glyph { background:#1d653f; }
    .visual-empty { margin-top:8px; color:#69756e; font-size:12px; }
    .combo-side { height:120px; display:grid; grid-template-columns:minmax(0,1fr) 102px; gap:7px; align-items:stretch; }
    .combo-side > * { min-width:0; }
    .combo-side .native-preview { height:100%; margin:0; align-content:center; }
    .combo-side .visual-metrics { grid-template-columns:1fr; margin:0; }
    .combo-side .visual-metric { display:flex; align-items:center; justify-content:space-between; gap:4px; padding:4px 7px; text-align:left; }
    .combo-side .visual-metric b { font-size:12px; }.combo-side .visual-metric small { text-align:right; font-size:8px; }
    .combo-unified { margin-top:7px; overflow:hidden; border:1px solid #ccd5cf; border-radius:10px; background:white; }
    .combo-unified .native-preview { margin:0; border:0; border-radius:0; }
    .metric-line { display:flex; justify-content:space-around; gap:5px; padding:8px 7px; color:#435149; font-size:10px; }
    .metric-line span { flex:1; text-align:center; border-right:1px solid #dce2dd; }.metric-line span:last-child { border:0; }.metric-line b { display:block; font-size:12px; }
    .service-card { --brand:#24292f; --on-brand:white; width:100%; height:190px; padding:0; overflow:hidden; border:1px solid #cfd7d1; border-radius:14px; color:var(--ink); background:white; text-align:left; box-shadow:0 1px 2px #14251c0a; }
    .service-card.discord { --brand:#5865f2; }.service-card.tailscale { --brand:#252525; }.service-card.model { --brand:#d8c6ac; --on-brand:#20231f; }.service-card.full { --brand:#1d653f; }
    .service-card.active { outline:3px solid var(--lime); outline-offset:2px; }
    .service-card-head { height:68px; padding:13px 15px; color:var(--on-brand); background:var(--brand); }
    .service-card-title { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:800; }
    .service-card-title > span:nth-last-child(2) { min-width:0; flex:1; }
    .service-card-title .brand-logo { color:var(--brand); background:var(--on-brand); }
    .service-card-title .tail-logo { width:28px; padding:4px; }
    .service-card-title .model-logos { display:flex; gap:4px; }.service-card-title .model-mark { width:27px; height:27px; font-size:11px; }
    .service-card-subtitle { flex:0 0 auto; padding:4px 7px; border-radius:999px; color:inherit; background:#ffffff20; opacity:.88; font-size:10px; font-weight:650; }
    .service-card-footer { height:120px; padding:15px; background:white; }
    .service-card-footer strong { display:block; margin-bottom:4px; }
    .service-card-footer code { color:inherit; font-size:10px; }
    .connection-primary { display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:750; }
    .connection-primary .emoji { flex:0 0 19px; font-size:15px; line-height:1.2; }
    .connection-secondary { margin:8px 0 0 27px; color:#67746c; font-size:11px; line-height:1.45; }
    .connection-secondary code { display:block; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty-footer { display:flex; gap:8px; color:#718078; font-size:12px; line-height:1.45; }
    .treatment-b:not(.complete) .service-card-head { color:#536159; background:color-mix(in srgb,var(--brand) 22%,#eef1ee); }
    .treatment-b:not(.complete) .service-card-title .brand-logo { color:#68756e; background:#fff9; }
    .treatment-b.complete .service-card-footer { background:color-mix(in srgb,var(--brand) 8%,white); }
    .treatment-c:not(.complete) .service-card-head { color:#4f5d55; background:#e7ebe8; }
    .treatment-c:not(.complete) .service-card-title .brand-logo { color:#647169; background:white; }
    .treatment-c.complete { color:var(--on-brand); background:var(--brand); border-color:var(--brand); }
    .treatment-c.complete .service-card-footer { color:var(--on-brand); background:var(--brand); }
    .treatment-c.complete .service-card-footer .metric-line { color:inherit; border-color:#ffffff35; }
    .treatment-c.complete .muted { color:inherit; opacity:.72; }
    .treatment-b:not(.complete) .tail-logo i,.treatment-c:not(.complete) .tail-logo i { background:#647169; }
    .service-card.error { border:2px solid #b64b42; background:#fff2ef; }
    .service-card.error.active { outline-color:#b64b42; }
    .service-card.error .service-card-head { color:#762d27; background:#f3cbc6; }
    .service-card.error .service-card-title .brand-logo { color:#762d27; background:#fff8; }
    .service-card.error .service-card-subtitle { color:#762d27; background:#fff7; opacity:1; }
    .service-card.error .service-card-footer { color:#762d27; background:#fff0ed; }
    .service-card.error .connection-secondary { color:#873e37; }
    .a-work { max-width:690px; }
    .a-work .card { padding:30px; }
    .reward-panel { min-height:210px; margin-bottom:16px; overflow:hidden; position:relative; border-radius:18px; padding:22px; background:#13231b; color:white; }
    .reward-title { display:flex; justify-content:space-between; gap:16px; align-items:start; position:relative; z-index:2; }
    .reward-title .eyebrow { color:var(--lime); }
    .reward-count { font:700 12px ui-monospace,monospace; color:#bccbc1; }
    .constellation { width:100%; height:135px; }
    .constellation line { stroke:#506158; stroke-width:2; }.constellation line.lit { stroke:var(--lime); }
    .constellation circle { fill:#25372e; stroke:#718078; stroke-width:2; }.constellation circle.lit { fill:var(--lime); stroke:var(--lime); }
    .constellation text { fill:#d8e2dc; font:10px system-ui; text-anchor:middle; }.constellation text.lit { fill:#14251c; font-weight:800; }
    .mosaic { height:125px; margin-top:12px; display:grid; grid-template-columns:1fr 1.2fr 1fr; grid-template-rows:1fr 1fr; gap:5px; transform:rotate(-2deg); }
    .mosaic-piece { display:grid; place-items:center; border:1px dashed #65766d; color:#718078; background:#1b3026; transition:.2s; }
    .mosaic-piece:nth-child(2) { grid-row:span 2; font-size:34px; }.mosaic-piece.done { border-style:solid; color:#14251c; background:var(--lime); }
    .diorama { height:128px; display:flex; align-items:end; justify-content:space-around; gap:8px; padding-top:18px; border-bottom:3px solid #809087; }
    .diorama-part { flex:1; min-height:42px; display:grid; place-items:center; border:1px dashed #62736a; border-radius:10px 10px 0 0; color:#819188; background:#1b3026; font-size:11px; text-align:center; }
    .diorama-part.done { color:#14251c; border-style:solid; border-color:#b9cf4a; background:var(--lime); }
    .boot-grid { margin-top:15px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .boot-module { min-height:84px; border:1px solid #506158; border-radius:9px; padding:10px; color:#77887f; font:11px ui-monospace,monospace; }
    .boot-module.done { border-color:#8aa22b; color:#e9f5a6; box-shadow:inset 0 -4px 0 var(--lime); }
    .seal-row { margin-top:18px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
    .seal { width:82px; height:82px; border-radius:50%; display:grid; place-items:center; text-align:center; border:2px dashed #506158; color:#708178; font-size:10px; transform:rotate(-5deg); }
    .seal:nth-child(even) { transform:rotate(5deg); }.seal.done { color:#14251c; border:4px double #14251c; background:var(--lime); }
    .value-panel { min-height:230px; margin-bottom:16px; overflow:hidden; border:1px solid var(--line); border-radius:18px; padding:20px; background:white; }
    .value-head { display:flex; justify-content:space-between; align-items:start; gap:18px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .value-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
    .value-card { min-height:82px; padding:13px; border-radius:10px; background:#f2f5f2; }
    .value-card strong { display:block; margin-bottom:4px; }
    .value-card.action { background:#edf5fc; border-left:3px solid var(--blue); }
    .brief { margin:14px 0 0; font-size:17px; line-height:1.5; }
    .brief strong { color:var(--green); }
    .attention-item { display:grid; grid-template-columns:90px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    .attention-item:last-child { border:0; }
    .composer { margin-top:14px; padding:16px; border-radius:12px; background:#14251c; color:white; }
    .composer-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .chip { padding:6px 9px; border-radius:999px; color:#14251c; background:var(--lime); font-size:12px; font-weight:750; }
    .chip.missing { color:#738078; background:#e6ebe7; }
    .feed-item { display:grid; grid-template-columns:58px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .feed-time { color:var(--muted); font:11px ui-monospace,monospace; }
    .trace { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:16px; }
    .trace-step { min-height:92px; padding:10px; border-radius:8px; color:#768179; background:#edf1ee; font:11px/1.35 ui-monospace,monospace; }
    .trace-step.live { color:#163e27; background:#ddf0e4; }
    /* B: operations console with timeline and evidence. */
    .b-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:20px; }
    .b-grid { display:grid; grid-template-columns:minmax(260px,.7fr) minmax(520px,1.3fr); gap:18px; }
    .b-list { padding:0; overflow:hidden; }
    .b-row { display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:8px; padding:16px 18px; border-bottom:1px solid var(--line); }
    .b-row:last-child { border:0; }
    .b-row.active { background:#f6f9ec; }
    .b-number { font:700 13px ui-monospace,monospace; color:var(--muted); }
    .b-detail { min-height:340px; }
    .evidence { margin:10px 0; padding:10px; border-radius:8px; background:#f1f4f1; font:12px ui-monospace,monospace; }
    /* C: compact field guide with all context visible. */
    .c-layout { max-width:850px; margin:auto; }
    .c-intro { display:grid; grid-template-columns:1fr auto; gap:20px; align-items:start; margin-bottom:18px; }
    .c-list { background:white; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .c-item { border-bottom:1px solid var(--line); }
    .c-item:last-child { border:0; }
    .c-summary { display:grid; grid-template-columns:28px 130px 1fr auto; gap:12px; align-items:center; padding:13px 16px; }
    .c-check { width:20px; height:20px; border:2px solid #9ca9a0; border-radius:4px; display:grid; place-items:center; font-size:12px; }
    .c-item.complete .c-check { background:var(--green); border-color:var(--green); color:white; }
    .c-detail { padding:4px 18px 20px 186px; }
    .c-item:not(.active) .c-detail { display:none; }
    /* D: independent bento tiles with rewards on the surface. */
    .d-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
    .d-tile { min-height:180px; text-align:left; border:1px solid var(--line); border-radius:18px; background:white; padding:20px; color:var(--ink); }
    .d-tile:nth-child(1),.d-tile:nth-child(4) { grid-column:span 4; }
    .d-tile:nth-child(2),.d-tile:nth-child(3),.d-tile:nth-child(5) { grid-column:span 2; }
    .d-tile.active { outline:3px solid var(--lime); }
    .d-detail { margin-top:16px; }
    /* E: command palette that starts with operator intent. */
    .e-wrap { max-width:780px; margin:auto; padding-top:8vh; }
    .e-palette { padding:10px; border-radius:20px; background:#17231d; box-shadow:0 25px 70px #17231d40; }
    .e-search { padding:16px 18px; color:#dce7df; border-bottom:1px solid #425048; font-size:18px; }
    .e-option { width:100%; display:grid; grid-template-columns:38px 1fr auto; gap:12px; align-items:center; padding:14px; text-align:left; border:0; border-radius:10px; color:white; background:transparent; }
    .e-option:hover,.e-option.active { background:#304139; }
    .e-form { margin-top:18px; }
    /* F: a non-linear connection map. */
    .f-board { min-height:620px; position:relative; overflow:hidden; border-radius:28px; background:#102019; color:white; }
    .f-center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:190px; height:190px; border-radius:50%; display:grid; place-items:center; text-align:center; background:#dff35c; color:#14251c; padding:25px; }
    .f-node { position:absolute; width:155px; height:115px; border:1px solid #ffffff40; border-radius:18px; padding:14px; color:white; background:#21352b; text-align:left; }
    .f-node.done { border-color:var(--lime); }
    .f-node:nth-of-type(1) { left:8%; top:13%; }.f-node:nth-of-type(2) { right:8%; top:13%; }.f-node:nth-of-type(3) { left:8%; bottom:13%; }.f-node:nth-of-type(4) { right:8%; bottom:13%; }.f-node:nth-of-type(5) { left:50%; bottom:4%; transform:translateX(-50%); }
    .f-drawer { position:absolute; inset:24px 24px 24px auto; z-index:2; width:min(470px,calc(100% - 48px)); overflow:auto; color:var(--ink); }
    /* G: provider lanes feeding a shared launch gate. */
    .g-board { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .g-lane { min-height:520px; padding:28px; border-radius:22px; }
    .g-lane.identity { background:#e7ecff; }.g-lane.runtime { background:#e5f3df; }
    .g-choice { display:block; width:100%; margin:10px 0; padding:14px; border:0; border-radius:12px; background:#ffffffb8; text-align:left; }
    .g-choice.active { outline:3px solid #17231d; }
    .g-form { grid-column:1/-1; }
    /* H: receipt-first setup. */
    .h-wrap { max-width:960px; margin:auto; }
    .h-receipt { background:#fff; border:1px solid #c9d1cb; box-shadow:8px 8px 0 #17231d; padding:32px; }
    .h-row { display:grid; grid-template-columns:1fr auto auto; gap:18px; align-items:center; padding:16px 0; border-bottom:1px dashed #aeb8b1; }
    .h-row button { border:0; background:transparent; color:var(--green); font-weight:800; }
    .h-detail { margin-top:24px; border-top:5px solid var(--ink); padding-top:22px; }
    @media (max-width:760px) {
      .a-grid,.b-grid,.g-board { grid-template-columns:1fr; }
      .a-rail { flex-direction:column; overflow:visible; padding:0; }
      .a-step { min-width:150px; border-left:0; border-bottom:3px solid transparent; }
      .service-card { width:100%; }
      .c-summary { grid-template-columns:26px 1fr auto; }
      .c-summary .desc { display:none; }
      .c-detail { padding:4px 16px 18px 56px; }
      .topbar { padding:0 16px; }
      .host { display:none; }
      .d-tile { grid-column:span 6 !important; }
      .value-grid,.trace { grid-template-columns:1fr; }
      .f-node { position:static; width:auto; height:auto; margin:10px; }
      .f-center { position:static; transform:none; margin:20px auto; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const variants = [
      { key: 'A', name: 'Brand header' },
      { key: 'B', name: 'Tinted footer' },
      { key: 'C', name: 'Connected color' }
    ];
    const steps = [
      { key:'github', name:'GitHub', summary:'Create and install the dedicated GitHub App' },
      { key:'discord', name:'Discord', summary:'Connect the bot and choose its command channel' },
      { key:'tailscale', name:'Tailscale', summary:'Confirm the operator identity for this Curia host' },
      { key:'model', name:'Model provider', summary:'Sign in to OpenAI or Anthropic' },
      { key:'full', name:'Full loop', summary:'Send one request from Discord and verify the result' }
    ];
    const state = { step:0, complete:[], provider:'openai', providers:[], failed:false, corrected:false, closed:false, reward:null, tailnetName:'curia.sh' };
    const demo = new URLSearchParams(location.search).get('demo');
    const hasGitHubTickets = new URLSearchParams(location.search).get('tickets')!=='none';
    const errorService = new URLSearchParams(location.search).get('error');
    if (demo==='partial') state.complete.push('github','discord');
    if (demo==='ready') { state.complete.push('github','discord','tailscale','model','full'); state.providers.push('openai','anthropic'); }
    const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    const variantKey = () => new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A';
    const current = () => steps[state.step];
    const isDone = key => state.complete.includes(key);
    function setVariant(key) { const u=new URL(location); u.searchParams.set('variant',key); history.replaceState({},'',u); render(); }
    function cycle(amount) { const i=variants.findIndex(v=>v.key===variantKey()); setVariant(variants[(i+amount+variants.length)%variants.length].key); }
    function completeStep(key=current().key) { if (!isDone(key)) state.complete.push(key); state.reward=key; render(); }
    function selectStep(i) { state.step=i; state.reward=null; render(); }
    function nextOpen() { const i=steps.findIndex(s=>!isDone(s.key)); selectStep(i<0?4:i); }
    function addProvider() { if (!state.providers.includes(state.provider)) state.providers.push(state.provider); completeStep('model'); }
    function verify() {
      if (current().key==='tailscale' && !state.corrected) { state.failed=true; render(); return; }
      state.failed=false; completeStep();
    }
    function reward(key) {
      const rewards = {
        github:`<strong>GitHub is connected.</strong><br>1 watched repository · 9 open tickets · 1 agent-ready ticket found.`,
        discord:`<strong>Discord is ready.</strong><br>Curia posted a confirmation in #curia and registered 6 commands.`,
        tailscale:`<strong>Your private Curia address is ready.</strong><br><code>https://${state.tailnetName}.example-tailnet.ts.net</code> · allowed operator alex@example.com`,
        model:`<strong>${state.providers.map(p=>p==='openai'?'OpenAI':'Anthropic').join(' and ')} ${state.providers.length>1?'are':'is'} ready.</strong><br>Curia completed a live model request and installed a working routing preset.`,
        full:`<strong>Full loop verified.</strong><br>Discord request received · agent started · result posted to #curia in 42 seconds.`
      };
      return `<div class="notice success">${rewards[key]}</div>`;
    }
    function doneActions() { if(isDone('full')) return `<div class="actions"><button class="button">Open Curia</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`; const integrationsReady=['github','discord','tailscale','model'].every(isDone); return `<div class="actions"><button class="button" onclick="nextOpen()">${integrationsReady?'Run Full loop':'Continue setup'}</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`; }
    function content() {
      const s=current();
      if (s.key==='github') return `<div class="eyebrow">Independent connection</div><h2>Connect GitHub</h2><p>Curia creates a dedicated GitHub App. You review and approve it on GitHub, then install it for at least one repository owner.</p><div class="notice">You sign in and grant access on GitHub. Curia never sees your password or browser session.</div><div class="code"><span>Curia for alp-workstation</span><span>Prepared manifest</span></div>${isDone('github')?doneActions():`<div class="actions"><button class="button" onclick="completeStep()">Open GitHub and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
      if (s.key==='discord') return `<div class="eyebrow">Independent connection</div><h2>Connect Discord</h2><p>Discord adds Curia's bot to your selected server and creates its bot role. You approve only the permissions Curia needs.</p><div class="notice"><strong>Requested access</strong><br><code>bot</code> and <code>applications.commands</code> scopes · View Channels · Send Messages · Read Message History · Embed Links · Attach Files · Manage Channels.</div><div class="field"><label>Bot token</label><input type="password" value="••••••••••••" aria-label="Bot token"><div class="muted">Saved directly to a protected file. Curia won't show it again.</div></div><div class="field"><label>Add bot to server</label><select><option>Alp's workshop</option><option>Curia testing</option></select></div><div class="field"><label>Command channel</label><input value="curia" aria-label="Command channel"><div class="muted">Curia reuses a usable channel or creates one. Channel overrides must allow the Curia role.</div></div>${isDone('discord')?doneActions():`<div class="actions"><button class="button" onclick="completeStep()">Authorize bot and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
      if (s.key==='tailscale') return `<div class="eyebrow">Independent connection</div><h2>Name and verify Curia in Tailscale</h2><p>Changing this Tailscale machine name doesn't change the host's operating-system hostname. It also changes Curia's MagicDNS name.</p><div class="field"><label>Tailscale machine name</label><input value="${state.tailnetName}" oninput="state.tailnetName=this.value" aria-label="Tailscale machine name"><div class="muted">Default: curia.sh · current device: alp-workstation · 100.91.24.8</div></div><div class="card" style="background:#f7f9f7;padding:16px"><strong>Initial allowed operator</strong><br><span class="muted">alex@example.com</span></div>${isDone('tailscale')?doneActions():state.failed ? `<div class="notice problem"><strong>Curia couldn't verify Tailscale Serve.</strong><br>Run <code>tailscale serve --bg 3000</code> on this host, then try again.</div><div class="actions"><button class="button secondary" onclick="state.corrected=true;render()">I've run the command</button><button class="button" ${state.corrected?'':'disabled'} onclick="verify()">Try again</button></div>` : `<div class="actions"><button class="button" onclick="verify()">Apply name and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
      if (s.key==='model') return `<div class="eyebrow">Independent connection</div><h2>Add model providers</h2><p>Add either provider to meet the requirement. Stay here to add the second provider for fallback and independent review.</p><div class="provider"><button class="${state.provider==='openai'?'selected':''}" onclick="state.provider='openai';render()"><strong>${state.providers.includes('openai')?'✓ ':''}OpenAI</strong><br><span class="muted">Subscription sign-in</span></button><button class="${state.provider==='anthropic'?'selected':''}" onclick="state.provider='anthropic';render()"><strong>${state.providers.includes('anthropic')?'✓ ':''}Anthropic</strong><br><span class="muted">Subscription sign-in</span></button></div><div class="actions"><button class="button" ${state.providers.includes(state.provider)?'disabled':''} onclick="addProvider()">${state.providers.includes(state.provider)?'Already connected':`Sign in to ${state.provider==='openai'?'OpenAI':'Anthropic'} and test`}</button>${state.providers.length?`<button class="button secondary" onclick="nextOpen()">Continue setup</button>`:''}<button class="button quiet" onclick="state.closed=true;render()">Close setup</button></div>`;
      return `<div class="eyebrow">Final verification</div><h2>Complete the first Full loop</h2><p>This check uses the connections that are ready now. You can configure integrations in any order, but Full loop needs GitHub, Discord, Tailscale, and one model provider.</p><div class="code"><span>#curia</span><span>@Curia summarize the installation map</span></div>${isDone('full') ? `<div class="actions"><button class="button">Open Curia</button><button class="button secondary">View verification details</button></div>` : `<div class="actions"><button class="button" ${state.complete.filter(k=>k!=='full').length<4?'disabled':''} onclick="completeStep()">Simulate request and verify</button><button class="button secondary" onclick="state.closed=true;render()">Close setup</button></div>`}`;
    }
    function stateDump() { return `<div class="state-dump">PROTOTYPE STATE  ${esc(JSON.stringify({active:current().key,completed:state.complete,providers:state.providers,verificationFailure:state.failed,resumed:!state.closed},null,2))}</div>`; }
    function header() { return `<header class="topbar"><div class="brand"><span class="mark">C</span> Curia setup</div><div class="host">alp-workstation · local installation</div></header>`; }
    function cumulativeReward(kind) {
      const count=state.complete.length;
      const title={A:'Your first operator briefing',B:'What needs attention',C:'Your first useful action',D:'What Curia can see now',E:'Full-loop evidence'}[kind];
      const caption={A:'A live summary assembled from every connected service.',B:'Real work Curia discovered, ordered by what you can act on.',C:'Each connection contributes context or a delivery path to one action.',D:'Provider events become one operational feed.',E:'The exact data path from operator request to delivered result.'}[kind];
      const head=`<div class="value-head"><div><div class="eyebrow">Setup payoff</div><strong>${title}</strong><br><small class="muted">${caption}</small></div><span class="status ${count?'done':'waiting'}">${count?'Live data':'Waiting for data'}</span></div>`;
      if(!count) return `<div class="value-panel">${head}<p class="brief muted">Complete any connection to replace this explanation with data from that service.</p></div>`;
      if(kind==='A') return `<div class="value-panel">${head}<p class="brief">${isDone('github')?`<strong>GitHub:</strong> Curia has 9 open tickets. “Chart Curia’s backup and replacement-host recovery lifecycle” is ready for an agent. `:''}${isDone('discord')?`<strong>Discord:</strong> #curia is ready and the setup confirmation reached your server. `:''}${isDone('tailscale')?`<strong>Access:</strong> ${state.tailnetName}.example-tailnet.ts.net is reachable only through your tailnet. `:''}${isDone('model')?`<strong>Models:</strong> ${state.providers.map(p=>p==='openai'?'OpenAI':'Anthropic').join(' and ')} can start work. `:''}${isDone('full')?`<strong>Result:</strong> The first request completed in 42 seconds.`:''}</p><div class="value-grid">${isDone('github')?`<div class="value-card action"><strong>Ready to start</strong>1 agent-ready ticket · 8 unassigned</div>`:''}${isDone('discord')?`<div class="value-card"><strong>Command surface</strong>#curia · 6 commands registered</div>`:''}${isDone('tailscale')?`<div class="value-card"><strong>Private access</strong>alex@example.com · 38 ms</div>`:''}${isDone('model')?`<div class="value-card"><strong>Available route</strong>${state.providers.length||1} provider · test response 1.4 s</div>`:''}</div></div>`;
      if(kind==='B') return `<div class="value-panel">${head}${isDone('github')?`<div class="attention-item"><span class="status current">Ready</span><div><strong>Chart Curia’s backup and replacement-host recovery lifecycle</strong><br><span class="muted">Agent-ready · no assignee · opened yesterday</span></div><button class="button secondary">Start</button></div><div class="attention-item"><span class="status waiting">Map</span><div><strong>Specify Curia’s supported installation lifecycle</strong><br><span class="muted">5 decisions recorded · 7 still open</span></div><button class="button quiet">Open</button></div>`:''}${isDone('discord')?`<div class="attention-item"><span class="status problem">Mention</span><div><strong>alex asked “Can Curia pick up the recovery map?”</strong><br><span class="muted">#curia · 2 minutes ago</span></div><button class="button secondary">Reply</button></div>`:''}${isDone('tailscale')?`<div class="attention-item"><span class="status done">Access</span><div><strong>No access action needed</strong><br><span class="muted">${state.tailnetName}.example-tailnet.ts.net is reachable by alex@example.com.</span></div><button class="button quiet">Open</button></div>`:''}${isDone('model')?`<div class="attention-item"><span class="status done">Ready</span><div><strong>${state.providers.length||1} model provider can handle the ready ticket</strong><br><span class="muted">Verification request completed in 1.4 seconds.</span></div><button class="button secondary">Draft</button></div>`:''}${isDone('full')?`<div class="attention-item"><span class="status done">Done</span><div><strong>First Full loop delivered</strong><br><span class="muted">Result posted to #curia in 42 seconds.</span></div><button class="button quiet">View</button></div>`:''}</div>`;
      if(kind==='C') return `<div class="value-panel">${head}<div class="composer"><div class="eyebrow">Prepared first action</div><h3 style="font-size:17px;margin:8px 0">Plan the next decision in Curia’s recovery lifecycle</h3><div class="composer-row"><span class="chip ${isDone('github')?'':'missing'}">${isDone('github')?'Issue 861 attached':'Add GitHub context'}</span><span class="chip ${isDone('discord')?'':'missing'}">${isDone('discord')?'Deliver to #curia':'Add delivery channel'}</span><span class="chip ${isDone('tailscale')?'':'missing'}">${isDone('tailscale')?'Private operator verified':'Verify operator'}</span><span class="chip ${isDone('model')?'':'missing'}">${isDone('model')?'GPT route ready':'Add model'}</span></div><div class="actions"><button class="button" ${['github','discord','tailscale','model'].every(isDone)?'':'disabled'}>Start this work</button><span style="color:#aebdb4">${['github','discord','tailscale','model'].filter(isDone).length}/4 inputs ready</span></div></div></div>`;
      if(kind==='D') return `<div class="value-panel">${head}${isDone('github')?`<div class="feed-item"><span class="feed-time">14:08</span><div><strong>GitHub indexed 9 open tickets</strong><br><span class="muted">1 is ready for an agent. 1 active Wayfinder map found.</span></div></div>`:''}${isDone('discord')?`<div class="feed-item"><span class="feed-time">14:11</span><div><strong>Discord confirmation posted in #curia</strong><br><span class="muted">Operator alex found. 6 commands registered.</span></div></div>`:''}${isDone('tailscale')?`<div class="feed-item"><span class="feed-time">14:14</span><div><strong>Private app reachable at ${state.tailnetName}.example-tailnet.ts.net</strong><br><span class="muted">Tailscale identity verified from 100.91.24.8.</span></div></div>`:''}${isDone('model')?`<div class="feed-item"><span class="feed-time">14:16</span><div><strong>Model answered its verification request</strong><br><span class="muted">${state.providers.map(p=>p==='openai'?'OpenAI':'Anthropic').join(' + ')} · 1.4 seconds · routing preset active.</span></div></div>`:''}${isDone('full')?`<div class="feed-item"><span class="feed-time">14:18</span><div><strong>First Full loop completed</strong><br><span class="muted">Issue context read, agent ran, and result reached #curia.</span></div></div>`:''}</div>`;
      const trace=[['Discord',isDone('discord'),'request 1842','#curia'],['Tailscale',isDone('tailscale'),'alex@example.com','38 ms'],['GitHub',isDone('github'),'issue 861','9 open'],['Model',isDone('model'),'response 7fa2','1.4 s'],['Result',isDone('full'),'message 991','42 s total']];
      return `<div class="value-panel">${head}<div class="trace">${trace.map(t=>`<div class="trace-step ${t[1]?'live':''}"><strong>${t[0]}</strong><br><br>${t[1]?`${t[2]}<br>${t[3]}`:'No evidence yet'}</div>`).join('')}</div>${isDone('full')?`<div class="notice success"><strong>The evidence joins up.</strong> Request 1842 produced response 7fa2 and Discord message 991.</div>`:''}</div>`;
    }
    function railDetail(step,kind) {
      if(!isDone(step.key)) return `<div class="visual-empty">${step.key==='full'&&state.complete.filter(k=>k!=='full').length<4?'Available after the four connections are ready.':step.summary}</div>`;
      const dots='<i></i>'.repeat(9);
      const native={
        github:`<div class="native-preview ticket-stub"><span class="brand-logo github-logo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.51-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.2-3.64-.9-3.64-4.01 0-.89.31-1.62.82-2.19-.08-.2-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.92c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.01.29.25.54.73.54 1.49 0 1.08-.01 1.95-.01 2.22 0 .22.15.47.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/></svg></span><span class="ticket-body">${hasGitHubTickets?`<span class="ticket-title">#861 · Chart backup and recovery lifecycle</span><span class="ticket-meta"><span>ready-for-agent</span><span>9 open · 1 ready</span></span>`:`<span class="ticket-title">alp82/curia is connected</span><span class="ticket-meta"><span>Issues, pull requests, and Actions ready</span><span>No open tickets</span></span>`}</span></div>`,
        discord:`<div class="native-preview discord-preview"><span class="channel"><span class="brand-logo discord-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.618-1.25.077.077 0 0 0-.078-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.319 13.58.099 18.058a.082.082 0 0 0 .031.056c2.053 1.508 4.041 2.423 5.993 3.03a.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 12.3 12.3 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.007.128c-.598.343-1.22.645-1.873.891a.077.077 0 0 0-.041.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029c1.961-.607 3.95-1.522 6.002-3.03a.077.077 0 0 0 .031-.055c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.956 2.419-2.157 2.419Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.946 2.419-2.157 2.419Z"/></svg></span><span># curia</span></span><div class="message"><strong>Curia</strong> Setup complete. I’m ready for your first request.</div></div>`,
        tailscale:`<div class="native-preview tail-preview"><span class="tail-logo">${dots}</span><span><strong>${state.tailnetName}</strong><br><small>Online · alex@example.com · 38 ms</small></span></div>`,
        model:`<div class="native-preview model-preview"><span class="model-mark">◎</span><span class="model-mark anthropic">A</span><span><strong>OpenAI + Anthropic</strong><br><small>Routing ready · 1.4 s test</small></span></div>`,
        full:`<div class="native-preview loop-preview"><span>Discord<br><small>request 1842</small></span><b>→</b><span>GitHub<br><small>issue 861</small></span><b>→</b><span>Model<br><small>response 7fa2</small></span><b>→</b><span>#curia<br><small>42 s</small></span></div>`
      }[step.key];
      const metrics={
        github:hasGitHubTickets?[['1','repository'],['9','open tickets'],['1','agent-ready']]:[['1','repository'],['0','open tickets'],['ready','automation']],
        discord:[['#curia','channel'],['6','commands'],['1','message sent']],
        tailscale:[['38 ms','private access'],['1','operator'],['online','Serve']],
        model:[['2','providers'],['1.4 s','test request'],['ready','routing']],
        full:[['42 s','end to end'],['3','linked IDs'],['1','result posted']]
      }[step.key];
      const metricStrip=`<div class="visual-metrics">${metrics.map(m=>`<span class="visual-metric"><b>${m[0]}</b><small>${m[1]}</small></span>`).join('')}</div>`;
      const metricLine=`<div class="metric-line">${metrics.map(m=>`<span><b>${m[0]}</b>${m[1]}</span>`).join('')}</div>`;
      if(kind==='A') return `${native}${metricStrip}`;
      if(kind==='B') return `<div class="combo-side"><div>${native}</div>${metricStrip}</div>`;
      return `<div class="combo-unified">${native}${metricLine}</div>`;
    }
    function brandLogo(key) {
      if(key==='github') return `<span class="brand-logo github-logo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.51-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.2-3.64-.9-3.64-4.01 0-.89.31-1.62.82-2.19-.08-.2-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.92c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.96.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.01.29.25.54.73.54 1.49 0 1.08-.01 1.95-.01 2.22 0 .22.15.47.55.39A8.14 8.14 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/></svg></span>`;
      if(key==='discord') return `<span class="brand-logo discord-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.618-1.25.077.077 0 0 0-.078-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.319 13.58.099 18.058a.082.082 0 0 0 .031.056c2.053 1.508 4.041 2.423 5.993 3.03a.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 12.3 12.3 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.007.128c-.598.343-1.22.645-1.873.891a.077.077 0 0 0-.041.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029c1.961-.607 3.95-1.522 6.002-3.03a.077.077 0 0 0 .031-.055c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.956 2.419-2.157 2.419Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.946 2.419-2.157 2.419Z"/></svg></span>`;
      if(key==='tailscale') return `<span class="tail-logo">${'<i></i>'.repeat(9)}</span>`;
      if(key==='model') return `<span class="model-logos"><span class="model-mark">◎</span><span class="model-mark anthropic">A</span></span>`;
      return `<span class="brand-logo"><strong>C</strong></span>`;
    }
    function connectionFooter(step) {
      if(hasError(step)) return `<div class="connection-primary"><span class="emoji">⚠️</span><span>${{
        github:'GitHub access could not be verified',discord:'Curia cannot post in #curia',tailscale:'Tailscale Serve is not reachable',model:'The model verification request failed',full:'The first Full loop did not complete'
      }[step.key]}</span></div><div class="connection-secondary">${{
        github:'Check the GitHub App installation, then try again.',discord:'Allow View Channel and Send Messages for the Curia role.',tailscale:'Run tailscale serve --bg 3000, then try again.',model:'Reconnect the provider subscription, then try again.',full:'Open the failed stage and retry from its last verified boundary.'
      }[step.key]}</div>`;
      if(!isDone(step.key)) return `<div class="empty-footer"><span>○</span><span>${{
        github:'Repository and discovered-work data will appear after GitHub verifies.',
        discord:'The channel and command result will appear after Discord verifies.',
        tailscale:'The private address and operator will appear after Tailscale verifies.',
        model:'Connected providers and the tested route will appear after sign-in.',
        full:'Request-to-result evidence will appear after the Full loop completes.'
      }[step.key]}</span></div>`;
      return {
        github:hasGitHubTickets?`<div class="connection-primary"><span class="emoji">🎫</span><span>#861 · Chart backup and recovery lifecycle</span></div><div class="connection-secondary">ready-for-agent · alp82/curia · 9 open tickets</div>`:`<div class="connection-primary"><span class="emoji">📦</span><span>alp82/curia</span></div><div class="connection-secondary">No open tickets · Issues, pull requests, and Actions ready</div>`,
        discord:`<div class="connection-primary"><span class="emoji">💬</span><span>#curia</span></div><div class="connection-secondary">Confirmation delivered · 6 commands registered</div>`,
        tailscale:`<div class="connection-primary"><span class="emoji">🔒</span><span>${state.tailnetName}.example-tailnet.ts.net</span></div><div class="connection-secondary">alex@example.com · Serve reachable in 38 ms</div>`,
        model:`<div class="connection-primary"><span class="emoji">⚡</span><span>${state.providers.map(p=>p==='openai'?'OpenAI':'Anthropic').join(' + ')||'OpenAI'}</span></div><div class="connection-secondary">Routing ready · verification request completed in 1.4 s</div>`,
        full:`<div class="connection-primary"><span class="emoji">✅</span><span>Result delivered to #curia in 42 seconds</span></div><div class="connection-secondary"><code>request 1842 → response 7fa2 → message 991</code></div>`
      }[step.key];
    }
    function hasError(step) { return errorService===step.key || (step.key==='tailscale'&&state.failed); }
    function serviceSubtitle(step) {
      if(hasError(step)) return 'Action required';
      if(isDone(step.key)) return step.key==='full'?'Full loop verified':step.key==='model'?(state.providers.length>1?'Two providers verified':'Provider verified'):'Connected and verified';
      if(step.key==='full'&&state.complete.filter(k=>k!=='full').length<4) return 'Waiting for required connections';
      return 'Ready to connect';
    }
    function serviceCard(step,i,kind) { return `<button class="service-card ${step.key} treatment-${kind.toLowerCase()} ${isDone(step.key)?'complete':''} ${hasError(step)?'error':''} ${i===state.step?'active':''}" onclick="selectStep(${i})"><header class="service-card-head"><div class="service-card-title">${brandLogo(step.key)}<span>${step.name}</span><span class="service-card-subtitle">${serviceSubtitle(step)}</span></div></header><div class="service-card-footer">${connectionFooter(step)}</div></button>`; }
    function guidedVariant(kind) { const label={A:'brand-colored headers',B:'dimmed headers and tinted connected footers',C:'full brand color only after connection'}[kind]; return `${header()}<main class="main"><div class="a-grid"><aside class="a-rail"><div style="padding:0 16px 2px"><div class="eyebrow">Your installation</div><h2 style="margin:4px 0">${state.complete.length}/5 verified</h2><p class="muted">Comparing ${label}.</p></div>${steps.map((s,i)=>serviceCard(s,i,kind)).join('')}</aside><section class="a-work"><p class="muted">Choose any connection. The header, state, and data stay within one fixed-height card.</p><div class="card">${content()}${stateDump()}</div></section></div></main>`; }
    function variantA() { return guidedVariant('A'); }
    function variantB() { return guidedVariant('B'); }
    function variantC() { return guidedVariant('C'); }
    function variantD() { return guidedVariant('A'); }
    function rewardText(key) { return ({github:'2 frontier decisions are ready.',discord:'6 commands are live in #curia.',tailscale:'Your private address is active.',model:`${state.providers.length||1} provider ready.`,full:'A real request completed in 42 seconds.'})[key]; }
    function variantE() { return guidedVariant('B'); }
    function variantF() { return `${header()}<main class="main"><div class="f-board">${steps.map((s,i)=>`<button class="f-node ${isDone(s.key)?'done':''}" onclick="selectStep(${i})"><strong>${s.name}</strong><br><small>${isDone(s.key)?rewardText(s.key):'Not connected'}</small></button>`).join('')}<div class="f-center"><div><strong style="font-size:22px">Curia</strong><br>${state.complete.length}/5 signals ready</div></div><aside class="card f-drawer">${content()}${stateDump()}</aside></div></main>`; }
    function variantG() { return `${header()}<main class="main"><div class="c-intro"><div><div class="eyebrow">Two sides of Curia</div><h1>Connect identity and intelligence</h1></div><span class="status current">Any order</span></div><section class="g-board"><div class="g-lane identity"><h2>Where you work</h2><p>Connect the people, repositories, and private network Curia acts within.</p>${steps.slice(0,3).map((s,i)=>`<button class="g-choice ${state.step===i?'active':''}" onclick="selectStep(${i})"><strong>${isDone(s.key)?'✓ ':''}${s.name}</strong><br><span class="muted">${isDone(s.key)?rewardText(s.key):s.summary}</span></button>`).join('')}</div><div class="g-lane runtime"><h2>How Curia thinks</h2><p>Connect one or both model providers, then verify the complete loop.</p>${steps.slice(3).map((s,j)=>`<button class="g-choice ${state.step===j+3?'active':''}" onclick="selectStep(${j+3})"><strong>${isDone(s.key)?'✓ ':''}${s.name}</strong><br><span class="muted">${isDone(s.key)?rewardText(s.key):s.summary}</span></button>`).join('')}</div><div class="card g-form">${content()}${stateDump()}</div></section></main>`; }
    function variantH() { return `${header()}<main class="main h-wrap"><div class="eyebrow">Installation receipt</div><h1>What Curia can do on this host</h1><p class="muted">Configure any missing capability. Verified rows become a living receipt of this installation.</p><section class="h-receipt">${steps.map((s,i)=>`<div class="h-row"><div><strong>${s.name}</strong><br><span class="muted">${isDone(s.key)?rewardText(s.key):s.summary}</span></div><span class="status ${isDone(s.key)?'done':'waiting'}">${isDone(s.key)?'Verified':'Missing'}</span><button onclick="selectStep(${i})">${isDone(s.key)?'Inspect':'Configure'} →</button></div>`).join('')}<div class="h-detail">${content()}${stateDump()}</div></section></main>`; }
    function switcher() { const v=variants.find(v=>v.key===variantKey())||variants[0]; return `<nav class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span>${v.key} · ${v.name}</span><button onclick="cycle(1)" aria-label="Next variant">→</button></nav>`; }
    function reopen() { return state.closed ? `<div class="reopen"><div><div class="mark" style="margin:0 auto 18px">C</div><h1>Setup paused</h1><p>Your completed checks and current step are saved on this host.</p><button class="button" onclick="state.closed=false;render()">Resume with ${current().name}</button></div></div>` : ''; }
    function render() { const views={A:variantA,B:variantB,C:variantC}; document.getElementById('app').innerHTML=(views[variantKey()]||variantA)()+switcher()+reopen(); }
    addEventListener('keydown', e => { if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable) return; if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1); });
    addEventListener('popstate',render);
    render();
  </script>
</body>
</html>
