    ],
    frontier:[
      { t:"#589", title:"The global search bar", typ:"prototype", model:"claude-opus-5" },
      { t:"#590", title:"The alert load at volume", typ:"prototype", model:"claude-opus-5" },

    ],

    ],

  {
    repo:"alp82/aistack", num:"#29",
    name:"The measured layer", short:"measured",
    dest:"readings with a freshness stamp and a decided store",
    closed:3, total:9, fog:4, ago:"3h",
    recent:[ { t:"#28", title:"The neighbors survey" } ],
    flight:[],
    frontier:[
      { t:"#31", title:"The measured layer gets a freshness stamp", typ:"task", model:"claude-sonnet-5" },

    ],

      { t:"#32", title:"Stale readings gray out", behind:["#31"] },

    ],

/* ---------- helpers ---------- */
const allOpen = m => [...m.flight, ...m.frontier];
const titleOf = (m, id) => (allOpen(m).find(x => x.t === id) || { title:id }).title;
const kidsOf = (m, id) => m.blocked.filter(b => b.behind.includes(id));
const cutTxt = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const gh = t => `<a class="go" href="#" onclick="return false">${t} →</a>`;
const start = () => `<a class="go" href="#" onclick="return false">start →</a>`;
const route = f => `<span class="route">${f.typ} · → <b>${f.model}</b></span>`;
const head = m => `<div class="mhead">
  <div class="mfrac">${m.closed}<span class="of">/${m.total}</span>${m.fog ? `<span class="fogn">+${m.fog}</span>` : ""}</div>
  <div class="mtt"><span class="nm">${m.name}</span>
    <span class="meta">${m.repo} · ${m.ago} ago · <a href="#" onclick="return false">${m.num} →</a></span></div>
</div>`;
const ht = `<div class="ht"><span>curia · atlas · maps</span><span>sat 22 aug · 09:12</span></div>`;
const col = inner => `<div class="col">${inner}</div>`;

/* the band, as decided in #522 */
let sel = { map:"#511", key:"take" };
function bandHTML(m, selOn, mapKey) {
  const segs = [
    { key:"walk", cls:"b-walk", n:m.closed, word:"walked" },
    { key:"flight", cls:"b-flight", n:m.flight.length, word:"in flight" },
    { key:"take", cls:"b-take", n:m.frontier.length, word:"takeable" },
    { key:"wait", cls:"b-wait", n:m.blocked.length, word:"blocked" },
    { key:"fog", cls:"b-fog", n:m.fog, word:"fog" }
  ].filter(x => x.n > 0);
  const total = segs.reduce((a, x) => a + x.n, 0);
  return `<div class="band">${segs.map(x => `<button
    class="bseg ${x.cls} ${selOn && sel && sel.map === mapKey && sel.key === x.key ? "sel" : ""}"
    style="flex-grow:${x.n}" data-sel="${mapKey}|${x.key}" aria-label="${x.word} ${x.n}">${x.n}${
      x.n / total >= .2 ? `<span class="wd">${x.word}</span>` : ""}</button>`).join("")}</div>`;
}
function rowsFor(m, key) {
  if (key === "walk") return `
    ${m.recent.map(r => `<div class="prow dim"><span class="num">✓</span><span class="ttl">${r.title}</span>${gh(r.t)}</div>`).join("")}
    <div class="prow dim"><span class="num">… ${m.closed - m.recent.length} more on GitHub</span></div>`;
  if (key === "fog") return m.fogNotes.map(n =>
    `<div class="prow dim"><span class="num">╌</span><span class="ttl">${n}</span><span class="word">not yet specified</span></div>`).join("");
  if (key === "flight") return m.flight.map(f => `
    <div class="prow"><span class="dot on"></span><span class="ttl">${f.title}</span>${gh(f.t)}</div>
    <div class="prow dim"><span class="word run">runs</span><span class="ttl">${f.agent} · ${f.mins}m</span></div>`).join("")
    || `<div class="prow dim"><span class="ttl">nothing in flight</span></div>`;
  if (key === "take") return m.frontier.map(f => `
    <div class="prow"><i class="g-take"></i><span class="ttl">${f.title}</span>${gh(f.t)}</div>
    <div class="prow dim"><span class="ttl">${f.typ} · ${route(f)}</span>${start()}</div>
    ${kidsOf(m, f.t).map(k => `<div class="prow dim"><span class="word">unblocks</span><span class="ttl">${k.title}</span>${gh(k.t)}</div>`).join("")}`).join("")
    || `<div class="prow dim"><span class="ttl">nothing takeable</span></div>`;
  return m.blocked.map(b => `
    <div class="prow dim"><i class="g-wait"></i><span class="ttl">${b.title}<span class="sub">${b.t} · behind ${b.behind.join(" ")}</span></span></div>`).join("")
    || `<div class="prow dim"><span class="ttl">nothing blocked</span></div>`;
}

/* ================================================================
   1a — THE STOPS: the round-1 line, refined. Walked collapses to one
   dim stop, the rule carries the takeable count, the takeable stops
   carry start, the blocked say whom they wait for by name.
   ================================================================ */
function renderR1a() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="rl">
      <div class="rrow dim"><span class="stop s-walk"></span><span class="ttl">${m.closed} walked</span>${gh(m.num)}</div>
      ${m.flight.map(f => `<div class="rrow"><span class="stop s-run"></span>
        <span class="ttl">${f.title}<span class="sub">runs · ${f.agent} · ${f.mins}m</span></span>${gh(f.t)}</div>`).join("")}
      <div class="front"><span class="frontlbl">the frontier</span><span class="frule"></span>
        <span class="fcap">${m.frontier.length} takeable</span></div>
      ${m.frontier.map(f => `<div class="rrow below"><span class="stop s-take"></span>
        <span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
      ${m.blocked.map(b => `<div class="rrow below dim"><span class="stop s-wait"></span>
        <span class="ttl">${b.title}<span class="sub">behind ${b.behind.map(x => cutTxt(titleOf(m, x), 24)).join(" · ")}</span></span></div>`).join("")}
      <div class="rrow fogr dim"><span class="stop s-fog"></span>
        <span class="ttl">${m.fog} in the fog<span class="sub">${m.fogNotes.join(" · ")}</span></span></div>
    </div>
  </div>`).join(""));
}

/* ================================================================
   1b — THE BRANCHING LINE: the line as a graph. Blocked tickets hang
   on a second rail, and a curve runs from every ticket that holds one
   of their keys — so the handoff shows its three converging edges.
   ================================================================ */
function branchSVG(m) {
  const W = 342, rail = 10, rail2 = 30, rowH = 44;
  let y = 24; const frag = []; const yOf = {};
  frag.push(`<circle cx="${rail}" cy="${y}" r="6" fill="var(--cyan)"/>
    <text x="${rail2 + 14}" y="${y + 4}" fill="var(--mut)" font-size="13">${m.closed} walked</text>`);
  y += rowH;
  m.flight.forEach(f => {
    yOf[f.t] = y;
    frag.push(`<circle cx="${rail}" cy="${y}" r="6" fill="var(--green)"/>
      <text x="${rail2 + 14}" y="${y}" fill="var(--ink)" font-size="13" font-weight="600">${cutTxt(f.title, 34)}</text>
      <text x="${rail2 + 14}" y="${y + 15}" fill="var(--mut)" font-size="10"
        font-family="ui-monospace,Menlo,monospace">runs · ${f.agent} · ${f.mins}m</text>`);
    y += rowH;
  });
  const yRule = y - 12;
  frag.push(`<line x1="0" y1="${yRule}" x2="${W}" y2="${yRule}" stroke="var(--cyan)" stroke-width="2"/>
    <text x="0" y="${yRule - 8}" fill="var(--cyan)" font-size="9" letter-spacing="2.5"
      font-family="ui-monospace,Menlo,monospace">THE FRONTIER</text>`);
  y += 18;
  m.frontier.forEach(f => {
    yOf[f.t] = y;
    frag.push(`<circle cx="${rail}" cy="${y}" r="6" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2.5"/>
      <text x="${rail2 + 14}" y="${y}" fill="var(--ink)" font-size="13" font-weight="600">${cutTxt(f.title, 30)}</text>
      <text x="${rail2 + 14}" y="${y + 15}" fill="var(--mut)" font-size="10"
        font-family="ui-monospace,Menlo,monospace">${f.typ} · → ${f.model}</text>
      <text x="${W - 4}" y="${y + 4}" fill="var(--cyan)" font-size="11" text-anchor="end"
        font-family="ui-monospace,Menlo,monospace">start →</text>`);
    y += rowH;
  });
  y += 4;
  m.blocked.forEach(b => {
    const edges = b.behind.map(id => yOf[id] !== undefined
      ? `<path d="M ${rail} ${yOf[id] + 8} C ${rail} ${yOf[id] + 30}, ${rail2} ${y - 30}, ${rail2} ${y - 8}"
          fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>` : "").join("");
    frag.push(edges + `<rect x="${rail2 - 5}" y="${y - 5}" width="10" height="10" rx="2"
        fill="var(--line)" stroke="var(--mut)" opacity="0.85"/>
      <text x="${rail2 + 14 + 20}" y="${y}" fill="var(--mut)" font-size="13">${cutTxt(b.title, 30)}</text>
      <text x="${rail2 + 14 + 20}" y="${y + 15}" fill="var(--mut)" font-size="10" opacity="0.8"
        font-family="ui-monospace,Menlo,monospace">${b.behind.length} ${b.behind.length > 1 ? "keys" : "key"} to turn</text>`);
    y += rowH;
  });
  frag.push(`<circle cx="${rail}" cy="${y}" r="6" fill="none" stroke="var(--mut)"
      stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="${rail2 + 14}" y="${y + 4}" fill="var(--mut)" font-size="13">${m.fog} in the fog</text>`);
  const H = y + 22;
  const lines = `<line x1="${rail}" y1="24" x2="${rail}" y2="${yRule}" stroke="var(--cyan)" stroke-width="2"/>
    <line x1="${rail}" y1="${yRule}" x2="${rail}" y2="${yOf[m.frontier[m.frontier.length - 1].t] || yRule}"
      stroke="var(--mut)" stroke-width="2" stroke-dasharray="2 5" opacity="0.6"/>
    <line x1="${rail}" y1="${yOf[m.frontier[m.frontier.length - 1].t] || yRule}" x2="${rail}" y2="${y - 8}"
      stroke="var(--mut)" stroke-width="2" stroke-dasharray="1 7" opacity="0.4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px">${lines}${frag.join("")}</svg>`;
}
function renderR1b() {
  return ht + col(MAPS.map(m => `<div class="map">${head(m)}
    <div style="margin-top:12px">${branchSVG(m)}</div></div>`).join(""));
}

/* ================================================================
   1c — THE SECTIONS: the line runs through labeled stations. The
   takeable are cards hanging on the line, the blocked are chips on
   the card that opens them.
   ================================================================ */
function renderR1c() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="rl">
      <div class="seclbl">walked · ${m.closed}</div>
      <div class="rrow dim"><span class="stop s-walk"></span>
        <span class="ttl">latest: ${m.recent[0].title}</span>${gh(m.recent[0].t)}</div>
      ${m.flight.length ? `<div class="seclbl">in flight · ${m.flight.length}</div>
      ${m.flight.map(f => `<div class="rrow"><span class="stop s-run"></span>
        <span class="ttl">${f.title}<span class="sub">runs · ${f.agent} · ${f.mins}m</span></span>${gh(f.t)}</div>`).join("")}` : ""}
      <div class="front" style="margin-top:14px"><span class="frontlbl">the frontier</span><span class="frule"></span></div>
      ${m.frontier.map(f => {
        const kids = kidsOf(m, f.t);
        return `<div class="tcard"><span class="stop s-take"></span>
        <div class="crow"><span class="ttl">${f.title}</span>${gh(f.t)}</div>
        <div class="cmeta">${route(f)}<span style="flex:1"></span>${start()}</div>
        ${kids.length ? `<div class="bchips"><span class="word">opens</span>
          ${kids.map(k => `<span class="bchip">${cutTxt(k.title, 26)}${k.behind.length > 1 ? ` · ${k.behind.length} keys` : ""}</span>`).join("")}</div>` : ""}
      </div>`; }).join("")}
      <div class="seclbl below">the fog · ${m.fog}</div>
      <div class="rrow fogr dim"><span class="stop s-fog"></span>
        <span class="ttl">${m.fogNotes.join(" · ")}</span></div>
    </div>
  </div>`).join(""));
}

/* ================================================================
   1d — THE ASCENT: the line turned upside down. The destination flies
   at the top, the fog and the blocked hang under it, the takeable sit
   right above the frontier rule, and the walked ground closes the map.
   Reading order is the future first.
   ================================================================ */
function renderR1d() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="rl">
      <div class="rrow bare dim"><span class="stop s-dest">⚑</span>
        <span class="ttl" style="color:var(--cyan);font-weight:600">${m.dest}</span></div>
      <div class="rrow fogr dim"><span class="stop s-fog"></span>
        <span class="ttl">${m.fog} in the fog<span class="sub">${m.fogNotes.join(" · ")}</span></span></div>
      ${m.blocked.map(b => `<div class="rrow fogr dim"><span class="stop s-wait"></span>
        <span class="ttl">${b.title}<span class="sub">behind ${b.behind.map(x => cutTxt(titleOf(m, x), 24)).join(" · ")}</span></span></div>`).join("")}
      ${m.frontier.map(f => `<div class="rrow below"><span class="stop s-take"></span>
        <span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
      <div class="front"><span class="frontlbl">the frontier</span><span class="frule"></span>
        <span class="fcap">${m.frontier.length} takeable</span></div>
      ${m.flight.map(f => `<div class="rrow"><span class="stop s-run"></span>
        <span class="ttl">${f.title}<span class="sub">runs · ${f.agent} · ${f.mins}m</span></span>${gh(f.t)}</div>`).join("")}
      <div class="rrow"><span class="stop s-walk"></span><span class="ttl" >${m.closed} walked</span>${gh(m.num)}</div>
    </div>
  </div>`).join(""));
}

/* ================================================================
   1e — THE METRO BAND: the decided band, sharpened into a line. One
   horizontal strip of stops per map: the walked terminus, the running
   dots, the frontier tick, one ring per takeable, the blocked, the
   fog. A tap opens the same panel the mock has.
   ================================================================ */
function renderR1e() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="metro">
      <button class="mstop ${sel && sel.map === m.num && sel.key === "walk" ? "sel" : ""}" data-sel="${m.num}|walk">
        <span class="micon"><i class="s-walk" style="display:block"></i></span>
        <span class="mn">${m.closed}</span><span class="mw">walked</span></button>
      ${m.flight.length ? `<button class="mstop ${sel && sel.map === m.num && sel.key === "flight" ? "sel" : ""}" data-sel="${m.num}|flight">
        <span class="micon"><i class="s-run" style="display:block"></i></span>
        <span class="mn">${m.flight.length}</span><span class="mw">flight</span></button>` : ""}
      <span class="ftickwrap"><span class="ftick"></span><span class="mw">frontier</span></span>
      ${m.frontier.map(() => `<button class="mstop ${sel && sel.map === m.num && sel.key === "take" ? "sel" : ""}" data-sel="${m.num}|take">
        <span class="micon"><i class="s-take" style="display:block"></i></span></button>`).join("")}
      ${m.blocked.length ? `<button class="mstop ${sel && sel.map === m.num && sel.key === "wait" ? "sel" : ""}" data-sel="${m.num}|wait">
        <span class="micon"><i class="s-wait" style="display:block"></i></span>
        <span class="mn">${m.blocked.length}</span><span class="mw">blocked</span></button>` : ""}
      <button class="mstop ${sel && sel.map === m.num && sel.key === "fog" ? "sel" : ""}" data-sel="${m.num}|fog">
        <span class="micon"><i class="s-fog" style="display:block"></i></span>
        <span class="mn">${m.fog}</span><span class="mw">fog</span></button>
    </div>
    ${sel && sel.map === m.num ? `<div class="panel">${rowsFor(m, sel.key)}</div>` : ""}
  </div>`).join(""));
}

/* ================================================================
   3a — THE EDGE, SIZED: the round-1 terrain with the desktop fault
   fixed. The picture caps at 520px and the page keeps one column.
   ================================================================ */
function terrainSVG(m) {
  const W = 342, edgeX = 118;
  const rows = Math.max(m.frontier.length, m.blocked.length, 1);
  const H = Math.max(96, rows * 34 + 28);
  const yTake = i => 24 + i * ((H - 44) / Math.max(m.frontier.length - 1, 1) || 0);
  const yWait = i => 24 + i * ((H - 44) / Math.max(m.blocked.length - 1, 1) || 0);
  const waitX = W - 116, fogX = W - 58;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="walked ${m.closed}, in flight ${m.flight.length}, takeable ${m.frontier.length}, blocked ${m.blocked.length}, fog ${m.fog}">
    <rect x="0" y="0" width="${edgeX - 22}" height="${H}" rx="6" fill="var(--cyan)" opacity="0.92"/>
    <text x="16" y="${H / 2 + 8}" fill="var(--bg)" font-size="22" font-weight="700"
      font-family="ui-monospace,Menlo,monospace">${m.closed}</text>
    <text x="16" y="${H / 2 + 24}" fill="var(--bg)" font-size="9" letter-spacing="1"
      font-family="ui-monospace,Menlo,monospace">WALKED</text>
    ${m.flight.map((f, i) => `<circle cx="${edgeX - 36}" cy="${20 + i * 18}" r="6" fill="var(--green)"/>`).join("")}
    <line x1="${edgeX}" y1="6" x2="${edgeX}" y2="${H - 6}" stroke="var(--cyan)" stroke-width="3"/>
    ${m.frontier.map((f, i) => {
      const links = kidsOf(m, f.t).map(k => {
        const j = m.blocked.indexOf(k);
        return `<line x1="${edgeX + 7}" y1="${yTake(i)}" x2="${waitX - 6}" y2="${yWait(j)}"
          stroke="var(--mut)" stroke-width="1" opacity="0.5" stroke-dasharray="3 3"/>`;
      }).join("");
      return links + `<circle cx="${edgeX}" cy="${yTake(i)}" r="7" fill="var(--bg)"
        stroke="var(--cyan)" stroke-width="2.5"/>`;
    }).join("")}
    ${m.blocked.map((b, i) => `<rect x="${waitX - 5}" y="${yWait(i) - 5}" width="10" height="10" rx="2"
      fill="var(--line)" stroke="var(--mut)" stroke-width="1" opacity="0.85"/>`).join("")}
    ${Array.from({ length: m.fog * 2 }, (_, i) => `<circle
      cx="${fogX + (i * 37) % 46}" cy="${(14 + i * 26.7) % (H - 16) + 8}" r="2.5"
      fill="none" stroke="var(--mut)" stroke-width="1" opacity="0.55"/>`).join("")}
  </svg>`;
}
function renderR3a() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="terrain">${terrainSVG(m)}</div>
    <div class="tlegend"><span><b>${m.closed}</b> walked</span><span><b>${m.flight.length}</b> in flight</span>
      <span><b>${m.frontier.length}</b> takeable</span><span><b>${m.blocked.length}</b> blocked</span>
      <span><b>${m.fog}</b> fog</span></div>
    <div class="tlist">
      ${m.frontier.map(f => `
        <div class="prow"><i class="g-take"></i><span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
    </div>
  </div>`).join(""));
}

/* ================================================================
   3b — THE LABELED CHART: the terrain carries its own names. No list
   below: the picture is the whole read, tall enough for text.
   ================================================================ */
function labeledSVG(m) {
  const W = 342, edgeX = 96, tx = edgeX + 18, rowH = 42;
  let y = 26; const frag = []; const yOf = {};
  m.frontier.forEach(f => {
    yOf[f.t] = y;
    frag.push(`<circle cx="${edgeX}" cy="${y}" r="7" fill="var(--bg)" stroke="var(--cyan)" stroke-width="2.5"/>
      <text x="${tx}" y="${y}" fill="var(--ink)" font-size="13" font-weight="600">${cutTxt(f.title, 26)}</text>
      <text x="${tx}" y="${y + 15}" fill="var(--mut)" font-size="10"
        font-family="ui-monospace,Menlo,monospace">→ ${f.model}</text>
      <text x="${W - 4}" y="${y + 2}" fill="var(--cyan)" font-size="11" text-anchor="end"
        font-family="ui-monospace,Menlo,monospace">start →</text>`);
    y += rowH;
  });
  y += 6;
  m.blocked.forEach(b => {
    const edges = b.behind.map(id => yOf[id] !== undefined
      ? `<path d="M ${edgeX} ${yOf[id] + 8} C ${edgeX} ${yOf[id] + 26}, ${edgeX + 12} ${y - 24}, ${edgeX + 12} ${y - 7}"
          fill="none" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>` : "").join("");
    frag.push(edges + `<rect x="${edgeX + 7}" y="${y - 5}" width="10" height="10" rx="2"
        fill="var(--line)" stroke="var(--mut)" opacity="0.85"/>
      <text x="${tx + 12}" y="${y}" fill="var(--mut)" font-size="12">${cutTxt(b.title, 28)}</text>
      <text x="${tx + 12}" y="${y + 14}" fill="var(--mut)" font-size="9" opacity="0.8"
        font-family="ui-monospace,Menlo,monospace">${b.behind.length} ${b.behind.length > 1 ? "keys" : "key"} to turn</text>`);
    y += rowH;
  });
  m.fogNotes.slice(0, 3).forEach(n => {
    frag.push(`<circle cx="${edgeX + 12}" cy="${y - 2}" r="5" fill="none" stroke="var(--mut)"
        stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7"/>
      <text x="${tx + 12}" y="${y + 2}" fill="var(--mut)" font-size="11" opacity="0.75">${cutTxt(n, 30)}</text>`);
    y += 26;
  });
  if (m.fogNotes.length > 3) {
    frag.push(`<text x="${tx + 12}" y="${y}" fill="var(--mut)" font-size="10" opacity="0.6"
      font-family="ui-monospace,Menlo,monospace">+${m.fogNotes.length - 3} more in the fog</text>`);
    y += 22;
  }
  const H = y + 8;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img"
      aria-label="the frontier of ${m.short}">
    <rect x="0" y="0" width="${edgeX - 20}" height="${H}" rx="6" fill="var(--cyan)" opacity="0.92"/>
    <text x="14" y="${H / 2}" fill="var(--bg)" font-size="22" font-weight="700"
      font-family="ui-monospace,Menlo,monospace">${m.closed}</text>
    <text x="14" y="${H / 2 + 16}" fill="var(--bg)" font-size="9" letter-spacing="1"
      font-family="ui-monospace,Menlo,monospace">WALKED</text>
    ${m.flight.map((f, i) => `<circle cx="${edgeX - 34}" cy="${18 + i * 16}" r="5" fill="var(--green)"/>`).join("")}
    <line x1="${edgeX}" y1="6" x2="${edgeX}" y2="${H - 6}" stroke="var(--cyan)" stroke-width="3"/>
    ${frag.join("")}
  </svg>`;
}
function renderR3b() {
  return ht + col(MAPS.map(m => `<div class="map">${head(m)}
    <div style="margin-top:12px">${labeledSVG(m)}</div></div>`).join(""));
}

/* ================================================================
   3c — THE COASTLINE: the edge goes organic. Walked is the landmass,
   the takeable are harbors on the coast, the blocked are islands on
   dashed ferry lines, and the fog is the open sea.
   ================================================================ */
function coastSVG(m) {
  const W = 342, H = 190;
  const coastX = y => 118 + 16 * Math.sin(y / 30) + 8 * Math.sin(y / 71);
  let landPath = "M 0 0 ";
  for (let y = 0; y <= H; y += 8) landPath += `L ${coastX(y).toFixed(1)} ${y} `;
  landPath += `L 0 ${H} Z`;
  const yTake = i => 30 + i * ((H - 60) / Math.max(m.frontier.length - 1, 1) || 0);
  const yWait = i => 40 + i * ((H - 80) / Math.max(m.blocked.length - 1, 1) || 0);
  const islX = 236;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img"
      aria-label="walked ${m.closed}, takeable ${m.frontier.length}, blocked ${m.blocked.length}, fog ${m.fog}">
    <path d="${landPath}" fill="var(--cyan)" opacity="0.92"/>
    <text x="16" y="${H / 2}" fill="var(--bg)" font-size="22" font-weight="700"
      font-family="ui-monospace,Menlo,monospace">${m.closed}</text>
    <text x="16" y="${H / 2 + 16}" fill="var(--bg)" font-size="9" letter-spacing="1"
      font-family="ui-monospace,Menlo,monospace">WALKED</text>
    ${m.flight.map((f, i) => `<circle cx="${coastX(30 + i * 22) - 22}" cy="${30 + i * 22}" r="6" fill="var(--green)"/>`).join("")}
    ${m.frontier.map((f, i) => {
      const y = yTake(i);
      const links = kidsOf(m, f.t).map(k => {
        const j = m.blocked.indexOf(k);
        return `<line x1="${coastX(y) + 6}" y1="${y}" x2="${islX - 8}" y2="${yWait(j)}"
          stroke="var(--mut)" stroke-width="1" opacity="0.5" stroke-dasharray="4 4"/>`;
      }).join("");
      return links + `<circle cx="${coastX(y)}" cy="${y}" r="7" fill="var(--bg)"
        stroke="var(--cyan)" stroke-width="2.5"/>`;
    }).join("")}
    ${m.blocked.map((b, i) => `<rect x="${islX - 7}" y="${yWait(i) - 6}" width="14" height="12" rx="5"
      fill="var(--line)" stroke="var(--mut)" opacity="0.9"/>`).join("")}
    ${Array.from({ length: m.fog * 3 }, (_, i) => `<circle
      cx="${292 + (i * 29) % 44}" cy="${(16 + i * 21.3) % (H - 20) + 10}" r="2.2"
      fill="none" stroke="var(--mut)" stroke-width="1" opacity="0.5"/>`).join("")}
    <text x="${W - 6}" y="${H - 8}" fill="var(--mut)" font-size="9" text-anchor="end" opacity="0.8"
      letter-spacing="1.5" font-family="ui-monospace,Menlo,monospace">THE FOG</text>
  </svg>`;
}
function renderR3c() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="terrain">${coastSVG(m)}</div>
    <div class="tlist">
      ${m.frontier.map(f => `
        <div class="prow"><i class="g-take"></i><span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
      ${m.blocked.map(b => `
        <div class="prow dim"><i class="g-wait"></i><span class="ttl">${b.title}<span class="sub">behind ${b.behind.map(x => cutTxt(titleOf(m, x), 24)).join(" · ")}</span></span></div>`).join("")}
    </div>
  </div>`).join(""));
}

/* ================================================================
   3d — THE COLUMNS: five lanes, and the frontier is the glowing wall
   between the flight lane and the takeable lane. Marks stack in each
   lane, names live in the list below.
   ================================================================ */
function laneMarks(n, icon, max = 7) {
  const shown = Math.min(n, max);
  return Array.from({ length: shown }, () => icon).join("") +
    (n > max ? `<span class="num">+${n - max}</span>` : "");
}
function renderR3d() {
  const ic = cls => `<i class="${cls}" style="display:block"></i>`;
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="lanes">
      <div class="lane walk"><div class="lc">${m.closed}</div><div class="lw">walked</div></div>
      <div class="lane flight"><div class="lc">${m.flight.length}</div><div class="lw">flight</div>
        <div class="marks">${laneMarks(m.flight.length, ic("s-run"))}</div></div>
      <div class="lane take"><div class="lc">${m.frontier.length}</div><div class="lw">takeable</div>
        <div class="marks">${laneMarks(m.frontier.length, ic("s-take"))}</div></div>
      <div class="lane wait"><div class="lc">${m.blocked.length}</div><div class="lw">blocked</div>
        <div class="marks">${laneMarks(m.blocked.length, ic("s-wait"))}</div></div>
      <div class="lane fog"><div class="lc">${m.fog}</div><div class="lw">fog</div>
        <div class="marks">${laneMarks(m.fog, ic("s-fog"))}</div></div>
    </div>
    <div class="tlist">
      ${m.frontier.map(f => `
        <div class="prow"><i class="g-take"></i><span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
    </div>
  </div>`).join(""));
}

/* ================================================================
   3e — THE CROSS-SECTION: the map as strata. Fog on top, blocked
   under it, the takeable resting on the glowing frontier line, the
   flight beneath, and the walked ground carrying it all.
   ================================================================ */
function renderR3e() {
  return ht + col(MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="strata">
      <div class="stratum fogb"><div class="slbl">the fog · ${m.fog}</div>${m.fogNotes.join(" · ")}</div>
      <div class="stratum waitb"><div class="slbl">blocked · ${m.blocked.length}</div>
        ${m.blocked.map(b => `<div class="prow dim"><i class="g-wait"></i>
          <span class="ttl">${b.title}<span class="sub">behind ${b.behind.map(x => cutTxt(titleOf(m, x), 24)).join(" · ")}</span></span></div>`).join("")}</div>
      <div class="stratum takeb"><div class="slbl" style="color:var(--cyan)">takeable · ${m.frontier.length}</div>
        ${m.frontier.map(f => `<div class="prow"><i class="g-take"></i>
          <span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}</div>
      <div class="frontline"><span class="frontlbl">the frontier</span></div>
      ${m.flight.length ? `<div class="stratum flightb"><div class="slbl" style="color:var(--green)">in flight · ${m.flight.length}</div>
        ${m.flight.map(f => `<div class="prow"><span class="dot on"></span>
          <span class="ttl">${f.title}<span class="sub">runs · ${f.agent} · ${f.mins}m</span></span>${gh(f.t)}</div>`).join("")}</div>` : ""}
      <div class="stratum walkb"><span class="big">${m.closed}</span><span class="w">walked</span>
        <span style="flex:1"></span>${gh(m.num)}</div>
    </div>
  </div>`).join(""));
}

/* ================================================================
   round 1, kept for reference
   ================================================================ */
function renderV0() {
  return ht + MAPS.map(m => `<div class="map">
    ${head(m)}
    ${bandHTML(m, true, m.num)}
    ${sel && sel.map === m.num ? `<div class="panel">${rowsFor(m, sel.key)}</div>` : ""}
  </div>`).join("");
}
function renderV1() {
  return ht + MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="rl">
      <div class="rrow dim"><span class="stop s-walk"></span><span class="ttl">${m.closed} walked</span>${gh(m.num)}</div>
      ${m.flight.map(f => `<div class="rrow"><span class="stop s-run"></span>
        <span class="ttl">${f.title}<span class="sub">runs · ${f.agent} · ${f.mins}m</span></span>${gh(f.t)}</div>`).join("")}
      <div class="front"><span class="frontlbl">the frontier</span><span class="frule"></span>
        <span class="fcap">${m.frontier.length} takeable</span></div>
      ${m.frontier.map(f => `<div class="rrow below"><span class="stop s-take"></span>
        <span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
      ${m.blocked.map(b => `<div class="rrow below dim"><span class="stop s-wait"></span>
        <span class="ttl">${b.title}<span class="sub">behind ${b.behind.map(x => titleOf(m, x)).join(" · ")}</span></span></div>`).join("")}
      <div class="rrow fogr dim"><span class="stop s-fog"></span>
        <span class="ttl">${m.fog} in the fog<span class="sub">${m.fogNotes.join(" · ")}</span></span></div>
    </div>
  </div>`).join("");
}
function renderV2() {
  return ht + MAPS.map(m => {
    const shown = new Set();
    return `<div class="map">
    ${head(m)}
    ${bandHTML(m, false, m.num)}
    <div class="tree">
      ${m.frontier.map(f => {
        const kids = kidsOf(m, f.t);
        kids.forEach(k => shown.add(k.t));
        return `
        <div class="tp"><i class="g-take"></i><span class="ttl">${f.title}</span>${gh(f.t)}</div>
        <div class="tmeta">${route(f)}${start()}</div>
        ${kids.map((k, i) => `<div class="kid ${i < kids.length - 1 ? "more" : ""}">
          <span class="ttl">opens ${k.title}</span>
          ${k.behind.length > 1 ? `<span class="keys">key <b>${k.behind.indexOf(f.t) + 1}</b>/${k.behind.length}</span>` : ""}
        </div>`).join("")}`;
      }).join("")}
      ${(() => {
        const rest = m.blocked.filter(b => !shown.has(b.t));
        return rest.length ? `<div class="rest"><div class="resthead">further back</div>
          ${rest.map(b => `<div class="prow dim"><i class="g-wait"></i><span class="ttl">${b.title}<span class="sub">behind ${b.behind.join(" ")}</span></span></div>`).join("")}</div>` : "";
      })()}
    </div>
  </div>`; }).join("");
}
function renderV3() {
  return ht + MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="terrain" style="max-width:none">${terrainSVG(m)}</div>
    <div class="tlegend"><span><b>${m.closed}</b> walked</span><span><b>${m.flight.length}</b> in flight</span>
      <span><b>${m.frontier.length}</b> takeable</span><span><b>${m.blocked.length}</b> blocked</span>
      <span><b>${m.fog}</b> fog</span></div>
    <div class="tlist">
      ${m.frontier.map(f => `
        <div class="prow"><i class="g-take"></i><span class="ttl">${f.title}<span class="sub">${f.typ} · → ${f.model}</span></span>${start()}</div>`).join("")}
    </div>
  </div>`).join("");
}
function renderV4() {
  return ht + MAPS.map(m => `<div class="map">
    ${head(m)}
    <div class="calm"><span class="cw">■ ${m.closed} walked</span>
      ${m.flight.length ? `<span class="cr">● ${m.flight.length} in flight</span>` : ""}
      <span>▫ ${m.blocked.length} blocked</span></div>
    <div class="sect">takeable — ${m.frontier.length}</div>
    ${m.frontier.map(f => {
      const kids = kidsOf(m, f.t);
      return `<div class="stack deep${Math.min(kids.length, 2)}">
      <div class="card">
        <div class="crow"><i class="g-take"></i><span class="ttl">${f.title}</span>${gh(f.t)}</div>
        <div class="cmeta">${route(f)}<span style="flex:1"></span>${start()}</div>
        ${kids.length ? `<div class="opens"><span class="k">opens</span>
          <span class="names">${kids.map(k => k.title).join(" · ")}</span>
          ${kids.some(k => k.behind.length > 1) ? `<span class="keys">${kids.filter(k => k.behind.length > 1)
            .map(k => `key ${k.behind.indexOf(f.t) + 1}/${k.behind.length}`).join(" · ")}</span>` : ""}
        </div>` : ""}
      </div>
    </div>`; }).join("")}
    <div class="fogcard"><span class="k">the fog · ${m.fog}</span>${m.fogNotes.join(" · ")}</div>
  </div>`).join("");
}

/* ---------- shell wiring ---------- */
const RENDER = { r1a: renderR1a, r1b: renderR1b, r1c: renderR1c, r1d: renderR1d, r1e: renderR1e,
  r3a: renderR3a, r3b: renderR3b, r3c: renderR3c, r3d: renderR3d, r3e: renderR3e,
  v0: renderV0, v1: renderV1, v2: renderV2, v3: renderV3, v4: renderV4 };
const VIEWS = ["r1a", "r1b", "r1c", "r1d", "r1e", "r3a", "r3b", "r3c", "r3d", "r3e",
  "v0", "v1", "v2", "v3", "v4"];
const frame = document.getElementById("frame");
const wrap = document.getElementById("wrap");
const q = new URLSearchParams(location.search);
let v = VIEWS.includes(q.get("v")) ? q.get("v") : "r1a";
let mode = q.get("mode") === "light" ? "light" : "dark";
let w = q.get("w") === "desktop" ? "desktop" : "phone";

function render() {
  document.querySelectorAll(".view").forEach(sec => {
    const on = sec.dataset.view === v;
    sec.classList.toggle("active", on);
    if (!on) return;
    sec.querySelector("[data-body]").innerHTML = RENDER[v]();
    sec.querySelectorAll("[data-sel]").forEach(b =>
      b.onclick = e => {
        e.stopPropagation();
        const [mn, k] = b.dataset.sel.split("|");
        sel = sel && sel.map === mn && sel.key === k ? null : { map: mn, key: k };
        render();
      });
  });
  frame.className = "frame w-" + w + " " + mode;
  document.getElementById("vname").textContent =
    document.querySelector(".view.active").dataset.name;
  document.getElementById("mode").textContent = mode === "dark" ? "☾" : "☀";
  document.getElementById("width").textContent = w === "phone" ? "📱" : "🖥";
  const p = new URLSearchParams({ v, mode, w });
  history.replaceState(null, "", "?" + p);
  requestAnimationFrame(rescale);
}
function rescale() {
  const fw = w === "desktop" ? 1280 : 390;
  const s = Math.min(1, (window.innerWidth - 16) / fw);
  wrap.style.transform = "scale(" + s + ")";
  wrap.style.height = (frame.offsetHeight * s) + "px";
}
function cycle(dir) {
  v = VIEWS[(VIEWS.indexOf(v) + dir + VIEWS.length) % VIEWS.length];
  render();
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("mode").onclick = () => { mode = mode === "dark" ? "light" : "dark"; render(); };
document.getElementById("width").onclick = () => { w = w === "phone" ? "desktop" : "phone"; render(); };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
window.addEventListener("resize", rescale);
render();
</script>
</body>
</html>
