<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map overview prototype</title>
<!--
  THROWAWAY PROTOTYPE for alp82/curia#1022 "Choose a map overview for the full plan and its execution".
  Four variants of the Maps page inside the chosen variant D shell (#1021), switchable via ?variant=A|B|C|D,
  device via ?device=desktop|phone, plan via ?plan=1..7. Static mock data, in-memory state, no persistence.
    A: Lanes    (where each ticket stands: done, active, ready, blocked, fog)
    B: Route    (phases in order toward the destination; tickets are stops on the way)
    C: Outline  (the map as a readable page: needs you, now, next, later, fog, decided)
    D: Focus    (one ticket at the center, what it waits on and what it unlocks; a whole-plan strip above)
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#191c22; }
body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#e6e9ef; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:inherit; }
input { font:inherit; color:inherit; }

/* ===== prototype shell (not part of any design) ===== */
.proto-head { position:sticky; top:0; z-index:40; background:#0e1013; color:#8b94a3; font:11px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-bottom:1px solid #23272f; display:flex; gap:16px; flex-wrap:wrap; }
.proto-head b { color:#cdd5e0; }
.layout { display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 34px); }
@media (max-width:1100px){ .layout { grid-template-columns:1fr; } .guide { position:static !important; height:auto !important; } }
.stage { padding:16px 8px 120px; display:flex; justify-content:center; align-items:flex-start; overflow:auto; }
.frame { box-shadow:0 8px 40px rgba(0,0,0,.5); border-radius:14px; overflow:hidden; position:relative; background:var(--bg); color:var(--ink); }
.frame.desktop { width:1280px; height:800px; }
.frame.phone { width:390px; height:780px; border-radius:36px; border:6px solid #2a2f38; }
.guide { position:sticky; top:34px; height:calc(100vh - 34px); overflow:auto; background:#0e1013; border-left:1px solid #23272f; padding:14px; font-size:13px; color:#cdd5e0; line-height:1.45; }
.guide h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b94a3; margin:16px 0 6px; }
.guide .plans button { display:block; width:100%; text-align:left; padding:7px 9px; border-radius:6px; background:#12151b; margin-bottom:4px; }
.guide .plans button.on { background:#1f3a2f; outline:1px solid #2f7a5a; }
.guide .plans .k { color:#8b94a3; font-size:11px; display:block; }
.guide .stmt { background:#12151b; border-radius:8px; padding:10px; margin-bottom:8px; }
.guide .stmt b { color:#9fd1ff; }
.guide ul { padding-left:18px; }
.guide li { margin-bottom:4px; }
.bar { position:fixed; left:calc((100vw - 340px)/2); bottom:14px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:4px; padding:6px; background:#0e1013; border:1px solid #2c313b; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.55); font:12px/1 ui-monospace,Menlo,monospace; color:#cdd5e0; white-space:nowrap; }
@media (max-width:1100px){ .bar { left:50%; } }
.bar button { min-width:40px; min-height:40px; border-radius:999px; padding:0 10px; }
.bar button:hover { background:#1c212a; }
.bar .name { min-width:150px; text-align:center; font-weight:600; }
.bar .sep { width:1px; height:22px; background:#2c313b; }
.bar .tog.on { background:#273043; color:#fff; }

/* ===== app tokens (variant D register) ===== */
.frame { --bg:#0b0c10; --raise:#15181f; --inset:#08090c; --line:#232833; --ink:#e6e9ef; --dim:#8b94a3; --faint:#555d6b; --accent:#5ec8e5;
  --warn:#f2c14e; --bad:#ff6b6b; --good:#5ad38a; --run:#9d8cff; font-size:13.5px; line-height:1.45; }
.dim { color:var(--dim); } .h { font-weight:600; }
.num { color:var(--faint); font-size:11.5px; font-variant-numeric:tabular-nums; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.s-done .dot, .dot.s-done { background:var(--good); }
.s-run .dot, .dot.s-run { background:var(--run); box-shadow:0 0 0 3px rgba(157,140,255,.2); }
.s-wait .dot, .dot.s-wait { background:var(--warn); }
.s-fail .dot, .dot.s-fail { background:var(--bad); }
.s-review .dot, .dot.s-review { background:var(--accent); }
.s-front .dot, .dot.s-front { background:transparent; border:2px solid var(--ink); }
.s-blocked .dot, .dot.s-blocked { background:transparent; border:2px solid var(--faint); }
.pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
.pill.s-wait { color:var(--warn); border-color:var(--warn); } .pill.s-run { color:var(--run); border-color:var(--run); }
.pill.s-fail { color:var(--bad); border-color:var(--bad); } .pill.s-review { color:var(--accent); border-color:var(--accent); }
.pill.s-done { color:var(--good); border-color:var(--good); } .pill.s-front { color:var(--ink); border-color:var(--ink); }
.chg { font-size:10.5px; color:var(--accent); border:1px solid rgba(94,200,229,.4); border-radius:4px; padding:0 4px; white-space:nowrap; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--raise); font-size:12px; }
.btn.primary { background:var(--accent); color:#08090c; border-color:var(--accent); font-weight:600; }
.btn.warn { color:var(--bad); }
.sec { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:16px 0 6px; display:flex; gap:8px; align-items:center; }
.sec .n { color:var(--faint); }
.ty { font:10.5px ui-monospace,Menlo,monospace; color:var(--faint); }
.rail { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--line); gap:1px; }
.rail i { display:block; height:100%; }

/* ticket row, shared */
.tk { display:flex; align-items:flex-start; gap:8px; width:100%; padding:6px 8px; border-radius:8px; font-size:13px; line-height:1.35; }
.tk:hover { background:var(--raise); }
.tk .dot { margin-top:5px; }
.tk .t { flex:1; min-width:0; }
.tk .sub { display:block; font-size:11.5px; color:var(--dim); margin-top:1px; }
.tk.s-blocked .t { color:var(--dim); }
.tk.on { background:var(--raise); outline:1px solid var(--accent); }
.tk .x { color:var(--bad); font-size:12px; padding:0 4px; border-radius:4px; }
.tk .go { color:var(--accent); font-size:12px; padding:0 4px; }
.fogi { display:flex; gap:8px; padding:6px 8px; border:1px dashed var(--line); border-radius:8px; color:var(--dim); font-size:12.5px; margin-bottom:5px; align-items:flex-start; }
.fogi .t { flex:1; }
.add { display:flex; gap:6px; margin-top:6px; }
.add input { flex:1; min-width:0; background:var(--bg); border:1px dashed var(--accent); border-radius:8px; padding:5px 8px; font-size:12.5px; }
.more { font-size:12px; color:var(--accent); padding:4px 8px; }

/* D shell */
.D { display:grid; grid-template-columns:240px 1fr; height:100%; font-size:14px; }
.side { background:var(--inset); display:flex; flex-direction:column; padding:14px 10px; gap:2px; }
.side .brand { font-weight:700; font-size:15px; padding:6px 10px 12px; }
.side .row { display:flex; gap:8px; padding:8px 10px; border-radius:10px; color:var(--dim); font-size:13.5px; align-items:center; }
.side .row.on { background:var(--raise); color:var(--ink); }
.side .grp { font-size:11px; color:var(--dim); padding:14px 10px 4px; letter-spacing:.06em; text-transform:uppercase; }
.side .ch { padding:6px 10px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:8px; align-items:center; }
.side .ch .dot { width:6px; height:6px; }
.main { display:flex; flex-direction:column; overflow:hidden; min-width:0; position:relative; }
.mhd { display:flex; align-items:center; gap:10px; padding:12px 24px 6px; }
.mhd .title { font-weight:600; font-size:14.5px; }
.mhd .sp { flex:1; }
.mapstrip { display:flex; gap:8px; padding:4px 24px 10px; overflow-x:auto; border-bottom:1px solid var(--line); }
.mapchip { flex:none; width:176px; padding:8px 10px; border-radius:10px; background:var(--raise); border:1px solid transparent; display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
.mapchip.on { border-color:var(--accent); }
.mapchip .top { display:flex; gap:6px; align-items:center; }
.mapchip .top .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.mapchip .par { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { display:inline-flex; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--warn); color:#000; font-size:11px; font-weight:700; align-items:center; justify-content:center; }
.page { flex:1; overflow:auto; padding:14px 24px 30px; }
.ovh { display:flex; gap:16px; align-items:flex-start; margin-bottom:12px; }
.ovh .l { flex:1; min-width:0; }
.ovh .ttl { font-size:17px; font-weight:600; }
.ovh .dest { color:var(--dim); font-size:13px; margin-top:2px; }
.ovh .stats { font-size:12.5px; color:var(--dim); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
.ovh .stats b { color:var(--ink); font-weight:600; }
.since { font-size:12.5px; color:var(--dim); margin-top:4px; }
.since b { color:var(--accent); font-weight:500; }
.rel { font-size:12.5px; margin-top:6px; }
.rel button { color:var(--accent); }
.toast { position:absolute; left:50%; transform:translateX(-50%); bottom:18px; background:#1d2230; border:1px solid var(--line); border-radius:12px; padding:9px 14px; font-size:12.5px; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.5); max-width:90%; }

/* peek (detail) */
.peek { position:absolute; top:0; right:0; bottom:0; width:360px; background:var(--inset); border-left:1px solid var(--line); z-index:20; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.4); }
.peek .bd { flex:1; overflow:auto; padding:16px; }
.peek .ft { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; }
.sheet { position:absolute; left:0; right:0; bottom:0; max-height:78%; background:var(--inset); border-top:1px solid var(--line); border-radius:18px 18px 0 0; z-index:20; display:flex; flex-direction:column; box-shadow:0 -12px 40px rgba(0,0,0,.5); }
.sheet .bd { flex:1; overflow:auto; padding:14px; }
.sheet .ft { padding:10px 14px 16px; display:flex; gap:6px; flex-wrap:wrap; }
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:19; }

/* conversation stub */
.conv { max-width:760px; margin:0 auto; }
.conv .status { display:flex; gap:10px; align-items:center; padding:8px 14px; border-radius:14px; background:var(--raise); color:var(--dim); font-size:13px; margin-bottom:16px; }
.conv .msg { margin-bottom:16px; line-height:1.6; }
.conv .who { font-size:12px; color:var(--dim); margin-bottom:4px; }

/* phone shell */
.P { display:flex; flex-direction:column; height:100%; font-size:14px; position:relative; }
.P .phd { display:flex; align-items:center; gap:8px; padding:12px 12px 8px; }
.P .phd .title { font-weight:600; flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
.P .phd .title span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.P .ib { width:32px; height:32px; border-radius:8px; color:var(--dim); display:inline-flex; align-items:center; justify-content:center; flex:none; }
.P .ib.on { color:var(--accent); background:var(--raise); }
.P .page { padding:6px 14px 30px; }
.P .ovh .ttl { font-size:16px; }
.P .ovh { flex-direction:column; gap:8px; }
.P .ovh > div:last-child { width:100% !important; padding-top:0 !important; }
.P .ovh .stats { gap:4px 12px; }

/* ===== A: Lanes ===== */
.A-lanes { display:grid; grid-template-columns:1fr 1.15fr 1fr 1fr .9fr; gap:10px; align-items:start; }
.A-lane { background:var(--raise); border-radius:12px; padding:8px; }
.A-lane .tk:hover { background:var(--bg); }
.A-lane h5 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); padding:2px 6px 6px; display:flex; justify-content:space-between; }
.A-lane .fogi { border-color:#2d3340; }

/* ===== B: Route ===== */
.B-route { display:grid; gap:0; align-items:start; position:relative; }
.B-ph { padding:0 10px; border-left:1px solid var(--line); min-width:0; }
.B-ph:first-child { border-left:0; padding-left:0; }
.B-ph .hd { padding:0 0 8px; }
.B-ph .hd .nm { font-weight:600; display:flex; align-items:center; gap:6px; }
.B-ph .hd .here { font-size:10.5px; background:var(--accent); color:#08090c; border-radius:4px; padding:0 5px; font-weight:700; }
.B-ph .hd .pr { font-size:11.5px; color:var(--dim); margin:3px 0 5px; }
.B-ph.ahead .hd .nm { color:var(--dim); }
.B-stops { position:relative; padding-left:4px; }
.B-stops::before { content:""; position:absolute; left:15px; top:8px; bottom:8px; width:2px; background:var(--line); }
.B-stops .tk { position:relative; }
.B-stops .tk .dot { position:relative; z-index:1; outline:3px solid var(--bg); }
.B-donegrp { display:flex; gap:8px; align-items:center; padding:6px 8px; font-size:12.5px; color:var(--good); width:100%; }
.B-dest { padding:0 0 0 12px; border-left:1px solid var(--line); }
.B-dest .flag { font-size:18px; }
.B-empty { color:var(--faint); font-size:12.5px; padding:6px 8px; }
.B-vert .B-ph { border-left:0; padding:0; margin-bottom:6px; }
.B-vert .B-phrow { display:flex; gap:10px; align-items:center; width:100%; padding:8px 0; }
.B-vert .B-phrow .bar2 { flex:1; }

/* ===== C: Outline ===== */
.C-doc { max-width:760px; margin:0 auto; }
.C-doc .sec { margin-top:22px; font-size:11.5px; }
.C-doc .grp { font-size:12.5px; color:var(--dim); margin:10px 0 2px 8px; }
.C-doc .grp b { color:var(--ink); font-weight:500; }
.C-doc .dec { display:flex; gap:8px; padding:5px 8px; font-size:13px; }
.C-doc .dec .t { flex:1; }
.C-doc .dec .g { color:var(--dim); }
.C-chg { background:var(--raise); border-radius:12px; padding:10px 14px; font-size:13px; }
.C-chg div { margin:2px 0; }
.C-ord { display:flex; flex-direction:column; }
.C-ord button { font-size:10px; color:var(--dim); line-height:1; padding:1px 3px; }

/* ===== D: Focus ===== */
.F-strip { background:var(--raise); border-radius:12px; padding:10px 12px; margin-bottom:14px; }
.F-row { display:flex; gap:8px; align-items:center; margin:3px 0; }
.F-row .lb { width:68px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; flex:none; }
.F-row .sq { display:flex; flex-wrap:wrap; gap:3px; }
.F-sq { width:16px; height:16px; border-radius:4px; background:var(--faint); position:relative; }
.F-sq.s-done { background:var(--good); opacity:.55; } .F-sq.s-run { background:var(--run); } .F-sq.s-wait { background:var(--warn); }
.F-sq.s-fail { background:var(--bad); } .F-sq.s-review { background:var(--warn); box-shadow:inset 0 0 0 3px var(--bg); } .F-sq.s-front { background:transparent; border:2px solid var(--ink); }
.F-sq.s-blocked { background:transparent; border:2px solid var(--faint); } .F-sq.fog { background:transparent; border:1px dashed var(--faint); }
.F-sq.on { outline:2px solid var(--accent); outline-offset:2px; }
.F-sq.nb { box-shadow:0 0 0 1px var(--accent); }
.F-sq.ch::after { content:""; position:absolute; right:-3px; top:-3px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.F-grid { display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:14px; align-items:start; }
.F-col h5 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:4px 0 6px 8px; }
.F-card { background:var(--raise); border-radius:14px; padding:14px 16px; }
.F-card .q { color:var(--dim); margin:8px 0; font-size:13px; }
.F-card .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.F-path { font-size:12px; color:var(--dim); padding:4px 8px; }
.F-jump { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; align-items:center; }
.F-jump button { border:1px solid var(--line); border-radius:999px; padding:3px 9px; display:inline-flex; gap:6px; align-items:center; }
.F-legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-top:6px; }
.F-legend span { display:inline-flex; gap:4px; align-items:center; }
.F-legend .F-sq { width:10px; height:10px; }

/* ===== round 2: real states, selectors, D family ===== */
.s-review .dot, .dot.s-review { background:var(--warn); box-shadow:inset 0 0 0 2px var(--bg); }
.pill.s-review { color:var(--warn); border-color:var(--warn); }
.split { flex:1; display:grid; grid-template-columns:250px minmax(0,1fr); min-height:0; border-top:1px solid var(--line); }
.maplist { overflow:auto; padding:10px 8px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
.mi { display:flex; flex-direction:column; gap:6px; padding:9px 10px; border-radius:10px; width:100%; }
.mi:hover { background:var(--raise); } .mi.on { background:var(--raise); outline:1px solid var(--accent); }
.mi.child { margin-left:14px; width:calc(100% - 14px); }
.mi .top { display:flex; gap:6px; align-items:flex-start; } .mi .nm { flex:1; font-weight:600; font-size:13px; line-height:1.3; }
.mi .par { font-size:11px; color:var(--dim); margin-top:-3px; }
.msq { display:flex; flex-wrap:wrap; gap:2px; }
.msq i { width:7px; height:7px; border-radius:2px; background:var(--faint); }
.msq i.s-done { background:var(--good); opacity:.55; } .msq i.s-run { background:var(--run); } .msq i.s-wait, .msq i.s-review { background:var(--warn); }
.msq i.s-front { background:transparent; box-shadow:inset 0 0 0 1.5px var(--ink); } .msq i.s-blocked { background:transparent; box-shadow:inset 0 0 0 1.5px var(--faint); }
.msq i.fog { background:transparent; outline:1px dashed var(--faint); outline-offset:-1px; }
.mi .ml { font-size:11.5px; color:var(--dim); }
.mtitle { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; padding:4px 8px; border-radius:8px; } .mtitle:hover { background:var(--raise); }
.menu { position:absolute; top:46px; left:70px; width:340px; max-height:600px; overflow:auto; background:var(--inset); border:1px solid var(--line); border-radius:14px; padding:8px; z-index:25; box-shadow:0 16px 40px rgba(0,0,0,.5); }
.pv { background:var(--bg); border-radius:10px; padding:8px 10px; margin:8px 0; font-size:12.5px; line-height:1.5; }
.pvm + .pvm { margin-top:4px; } .pv .who { color:var(--dim); font-size:11px; margin-right:6px; }
.E-box { background:var(--raise); border-radius:12px; padding:12px; margin-bottom:14px; overflow-x:auto; }
.E-cap { font-size:12px; color:var(--dim); margin-bottom:10px; }
.E-g { position:relative; margin-bottom:4px; }
.E-g svg { position:absolute; inset:0; overflow:visible; }
.E-g path { fill:none; stroke:#2c3340; stroke-width:1.2; }
.E-g path.hot { stroke:var(--accent); stroke-width:2; }
.Fb-wrap { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
.Fb-side { position:sticky; top:0; display:flex; flex-direction:column; gap:8px; }
.Fb-ph { margin-bottom:14px; }
.Fb-ph h4 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin-bottom:6px; display:flex; gap:10px; align-items:center; font-weight:500; }
.Fb-closed { display:flex; gap:3px; flex-wrap:wrap; align-items:center; margin-bottom:6px; } .Fb-closed .F-sq { width:14px; height:14px; }
.Fb-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; }
.Fb-tile { display:flex; flex-direction:column; gap:4px; padding:8px 10px; border-radius:10px; background:var(--raise); border-left:3px solid var(--faint); min-height:62px; font-size:12.5px; line-height:1.3; }
.Fb-tile .st { font-size:11px; color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap; } .Fb-tile .st .dot { width:6px; height:6px; }
.Fb-tile.s-run { border-left-color:var(--run); } .Fb-tile.s-wait, .Fb-tile.s-review { border-left-color:var(--warn); } .Fb-tile.s-front { border-left-color:var(--ink); } .Fb-tile.s-blocked { color:var(--dim); }
.Fb-tile.on { outline:2px solid var(--accent); } .Fb-tile.nb { outline:1px dashed var(--accent); }

  return `<div class="F-strip">${PHS.map(k=>{ const list=ts.filter(t=>phase(t)===k), fg=fog.filter(x=>x.ph===k); if(!list.length&&!fg.length) return '';
    return `<div class="F-row"><span class="lb">${PH[k]}</span><span class="sq">${list.map(t=>sqBtn(p,t,f,nb)).join('')}${fg.map(x=>`<span class="F-sq fog" title="${esc(x.t)} (not yet specified)"></span>`).join('')}</span></div>`; }).join('')}${legend?LEGEND:''}</div>`; }
function jumpHtml(p,phone){ const ts=all(p); const jump=['wait','review','front'].flatMap(s=>ts.filter(t=>st(p,t)===s)).slice(0,phone?4:6);
  return jump.length?`<div class="F-jump"><span class="dim">Jump to</span>${jump.map(t=>`<button data-focus="${t.n}"><span class="dot s-${st(p,t)}"></span>${esc(short(t.t))}</button>`).join('')}</div>`:''; }
function focusSheet(p,f){ if(S.device!=='phone'||!S.fsheet||!f) return ''; return `<div class="scrim" data-act="closef"></div><div class="sheet"><div class="bd">${card(p,f,{preview:true})}${col(p,'Waits on',waitsOf(p,f),'Nothing. It can start.',f)}${col(p,'Unlocks',unlocks(p,f),'Nothing charted after it.',f)}</div><div class="ft"><button class="btn" data-act="closef">Close</button></div></div>`; }

/* ==================== D — FOCUS ==================== */
function D(p, phone){ const f=focusOf(p);
  if(!f) return `${headHtml(p)}${stripHtml(p,f)}`;
  const w=col(p,'Waits on',waitsOf(p,f),'Nothing. It can start.',f), u=col(p,'Unlocks',unlocks(p,f),'Nothing charted after it.',f);
  if(phone) return `${headHtml(p)}${stripHtml(p,f)}${jumpHtml(p,true)}${card(p,f)}${w}${u}`;
  return `${headHtml(p)}${stripHtml(p,f)}${jumpHtml(p)}<div class="F-grid">${w}${card(p,f)}${u}</div>`; }

/* ==================== E — LAYERS ==================== */
function levels(p){ const L={}; const lv=t=>{ if(L[t.n]!=null) return L[t.n]; const bs=t.by.map(b=>find(p,b)).filter(x=>x&&!isOut(p,x.n)); return L[t.n]=bs.length?1+Math.max(...bs.map(lv)):0; }; all(p).forEach(lv); return L; }
function E(p, phone){ const f=focusOf(p), ts=all(p), L=levels(p), fog=fogOf(p), nb=nbOf(p,f);
  const nL=Math.max(0,...Object.values(L))+1, cols=[...Array(nL)].map(()=>[]);
  ts.forEach(t=>cols[L[t.n]].push(t)); cols.forEach(c=>c.sort((a,b)=>PHS.indexOf(phase(a))-PHS.indexOf(phase(b))));
  const nc=nL+(fog.length?1:0), SQ=phone?14:20, CW=phone?Math.min(40,Math.floor(320/nc)):Math.min(64,Math.floor(700/nc)), RH=phone?20:28;
  const pos={}; cols.forEach((c,i)=>c.forEach((t,j)=>pos[t.n]={x:i*CW,y:j*RH}));
  const W=(nc-1)*CW+SQ, H=(Math.max(...cols.map(c=>c.length),fog.length)-1)*RH+SQ;
  let edges=''; ts.forEach(t=>t.by.forEach(b=>{ const a=pos[b], z=pos[t.n]; if(!a||!z) return; const hot=f&&(t.n===f.n||b===f.n);
    const x1=a.x+SQ, y1=a.y+SQ/2, x2=z.x, y2=z.y+SQ/2, mx=(x1+x2)/2; edges+=`<path class="${hot?'hot':''}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`; }));
  const sq=ts.map(t=>sqBtn(p,t,f,nb,`position:absolute;left:${pos[t.n].x}px;top:${pos[t.n].y}px;width:${SQ}px;height:${SQ}px`)).join('');
  const fg=fog.map((x,j)=>`<span class="F-sq fog" style="position:absolute;left:${nL*CW}px;top:${j*RH}px;width:${SQ}px;height:${SQ}px" title="${esc(x.t)} (not yet specified)"></span>`).join('');
  const graph=`<div class="E-box"><div class="E-cap">Tickets in dependency order, left to right. A column can start when the columns before it close.${fog.length?' The dashed column is not yet specified.':''}</div><div class="E-g" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}">${edges}</svg>${sq}${fg}</div>${LEGEND}</div>`;
  if(!f) return `${headHtml(p)}${graph}`;
  const w=col(p,'Waits on',waitsOf(p,f),'Nothing. It can start.',f), u=col(p,'Unlocks',unlocks(p,f),'Nothing charted after it.',f);
  if(phone) return `${headHtml(p)}${graph}${card(p,f)}${w}${u}`;
  return `${headHtml(p)}${graph}<div class="F-grid">${w}${card(p,f)}${u}</div>`; }

/* ==================== F — BOARD ==================== */
function Fb(p, phone){ const f=focusOf(p), ts=all(p), fog=fogOf(p), nb=nbOf(p,f);
  const secs=PHS.map(k=>{ const list=ts.filter(t=>phase(t)===k), fg=fog.filter(x=>x.ph===k); if(!list.length&&!fg.length) return '';
    const d=list.filter(t=>st(p,t)==='done'), open=list.filter(t=>st(p,t)!=='done').sort((a,b)=>['wait','review','run','front','blocked'].indexOf(st(p,a))-['wait','review','run','front','blocked'].indexOf(st(p,b)));
    return `<div class="Fb-ph"><h4>${PH[k]}<span class="num">${list.length?`${d.length} of ${list.length} closed`:'not charted yet'}</span></h4>${d.length?`<div class="Fb-closed">${d.map(t=>sqBtn(p,t,f,nb)).join('')}<span class="dim" style="font-size:11.5px;margin-left:4px">${d.length} closed</span></div>`:''}
      <div class="Fb-tiles">${open.map(t=>{ const s=st(p,t); return `<button class="Fb-tile s-${s} ${f&&f.n===t.n&&!phone?'on':''} ${nb.has(t.n)?'nb':''}" data-focus="${t.n}"><span class="st"><span class="dot"></span>${LBL[s]}${chOf(p,t.n)?` <span class="chg">${CHL[chOf(p,t.n)]}</span>`:''}</span><span>${esc(t.t)}</span></button>`; }).join('')}${fg.map(x=>`<div class="Fb-tile fog"><span class="st">not yet specified</span><span>${esc(x.t)}</span></div>`).join('')}</div>${addBox('ph-'+k)}</div>`; }).join('');
  if(phone) return `${headHtml(p)}${secs}`;
  return `${headHtml(p)}<div class="Fb-wrap"><div>${secs}</div><aside class="Fb-side">${card(p,f,{preview:true})}${col(p,'Waits on',waitsOf(p,f),'Nothing. It can start.',f)}${col(p,'Unlocks',f?unlocks(p,f):[],'Nothing charted after it.',f)}</aside></div>`; }

/* ==================== G — PATH ==================== */
function pathFrom(p,f){ const m={}, chain=[]; let cur=f, guard=0; while(guard++<40){ const u=unlocks(p,cur); if(!u.length) break; const nx=[...u].sort((a,b)=>depth(p,b,m)-depth(p,a,m))[0]; chain.push({t:nx,others:u.length-1}); cur=nx; } return chain; }
function G(p, phone){ const f=focusOf(p), ts=all(p);
  if(!f) return `${headHtml(p)}${stripHtml(p,f,false)}`;
  const anc=ancestors(p,f), ancOpen=[...anc].filter(n=>st(p,find(p,n))!=='done').length, chain=pathFrom(p,f), open=S.expand[K(p,'gb')];
  const later=fogOf(p).filter(x=>PHS.indexOf(x.ph)>=PHS.indexOf(phase(chain.length?chain[chain.length-1].t:f)));
  const main=`<div class="G-main">${anc.size?`<button class="G-before" data-exp="gb">${open?'▾':'▸'} ${anc.size-ancOpen} closed${ancOpen?` and ${ancOpen} open`:''} ticket${anc.size>1?'s':''} before it</button>${open?`<div style="margin-bottom:8px">${waitsOf(p,f).map(t=>nav(p,t,f)).join('')}</div>`:''}`:''}
    ${card(p,f,{preview:true})}
    <div class="G-then">Then, on the longest route to the end</div>
    <div class="G-path">${chain.map(c=>`<div class="G-step">${nav(p,c.t,f)}${c.others?`<div class="note">${c.others} other ticket${c.others>1?'s':''} also open here</div>`:''}</div>`).join('')||'<div class="F-path">Nothing charted after it.</div>'}
      ${later.map(x=>`<div class="fogi" style="margin-left:4px"><span>░</span><span class="t">${esc(x.t)} (not yet specified)</span></div>`).join('')}
      <div class="G-dest"><span>⚑</span><span>${esc(p.dest)}</span></div></div></div>`;
  const grp=(h,s)=>{ const l=ts.filter(t=>s.includes(st(p,t))); return l.length?`<div class="sec">${h} <span class="n">${l.length}</span></div>${l.map(t=>nav(p,t,f)).join('')}`:''; };
  const side=`<aside class="G-side">${grp('Needs you',NEED)}${grp('Working',['run'])}${grp('Ready',['front'])}${addBox('next')}</aside>`;
  if(phone) return `${headHtml(p)}${stripHtml(p,f,false)}${jumpHtml(p,true)}${main}`;
  return `${headHtml(p)}${stripHtml(p,f,false)}<div class="G-wrap">${main}${side}</div>`; }

/* ==================== H — SPLIT ==================== */
function H(p, phone){ const f=focusOf(p), ts=all(p), fog=fogOf(p);
  const list=`<div class="H-list">${PHS.map(k=>{ const l=ts.filter(t=>phase(t)===k), fg=fog.filter(x=>x.ph===k); if(!l.length&&!fg.length) return '';
      const d=l.filter(t=>st(p,t)==='done'), o=l.filter(t=>st(p,t)!=='done'), key='hd'+k, open=S.expand[K(p,key)];
      return `<div class="phh"><span>${PH[k]}</span><span>${l.length?`${d.length} of ${l.length} closed`:'not charted yet'}</span></div>${d.length?(open?d.map(t=>nav(p,t,phone?null:f)).join(''):`<button class="more" data-exp="${key}">${d.length} closed ▸</button>`):''}${o.map(t=>nav(p,t,phone?null:f)).join('')}${fg.map(x=>fogRow(p,x)).join('')}`; }).join('')}${addBox('next')}</div>`;
  if(phone) return `${headHtml(p)}${list}`;
  return `${headHtml(p)}<div class="H-wrap">${list}<div>${card(p,f,{preview:true})}<div class="H-2">${col(p,'Waits on',waitsOf(p,f),'Nothing. It can start.',f)}${col(p,'Unlocks',f?unlocks(p,f):[],'Nothing charted after it.',f)}</div></div></div>`; }

/* ==================== SHELL ==================== */
const V={A:['Lanes',A],B:['Route',B],C:['Outline',C],D:['Focus',D],E:['Layers',E],F:['Board',Fb],G:['Path',G],H:['Split',H]};
function needCount(p){ return all(p).filter(t=>NEED.includes(st(p,t))).length; }
function phaseNow(p){ const ts=all(p); for(const k of PHS){ if(ts.some(t=>phase(t)===k&&['wait','review','run','front'].includes(st(p,t)))) return PH[k]; } return ts.every(t=>st(p,t)==='done')?'All closed':'Blocked'; }
function miniSq(p){ const ts=all(p); return `<span class="msq">${PHS.flatMap(k=>ts.filter(t=>phase(t)===k)).map(t=>`<i class="s-${st(p,t)}"></i>`).join('')}${fogOf(p).map(()=>'<i class="fog"></i>').join('')}</span>`; }
function mapItem(p){ const c=counts(p), n=all(p).length, need=needCount(p);
  return `<button class="mi ${p===P()?'on':''} ${p.parent?'child':''}" data-plan="${p.id}"><span class="top"><span class="nm">${esc(p.title)}</span>${need?`<span class="badge">${need}</span>`:''}</span>${p.parent?`<span class="par">↳ build map of ${esc(byId(p.parent).title)}</span>`:''}${miniSq(p)}<span class="ml">${phaseNow(p)}${c.run?` · ${c.run} working`:''} · ${c.done} of ${n} closed</span></button>`; }
function side(){ const needs=PLANS.flatMap(p=>all(p).filter(t=>NEED.includes(st(p,t))).map(t=>[t.t,st(p,t)])).slice(0,5);
  return `<div class="side"><div class="brand">Curia</div><div class="row">✎ New conversation</div><div class="row on">◫ Maps</div><div class="row">◉ Overseer</div>
    <div class="grp">Needs you</div>${needs.map(t=>`<div class="ch"><span class="dot s-${t[1]}"></span>${esc(t[0])}</div>`).join('')}
    <div class="grp">Recent</div><div class="ch"><span class="dot s-run"></span>Qdrant as a sidecar</div><div class="ch"><span class="dot s-run"></span>Claude adapter</div><div class="ch"><span class="dot s-done"></span>Fix the ttyd font size</div></div>`; }
function peekHtml(p){ if(FAM.includes(S.variant)) return ''; const t=find(p,S.peek); if(!t) return ''; const s=st(p,t), w=t.by.map(b=>find(p,b)).filter(Boolean), u=unlocks(p,t);
  const bd=`<div style="display:flex;gap:8px;align-items:center"><span class="pill s-${s}">${LBL[s]}</span><span class="ty">${TY[t.ty]} · ${PH[phase(t)]}</span><span class="num">#${t.n}</span></div>
    <div class="h" style="font-size:16px;margin:8px 0">${esc(t.t)}</div>${t.g?`<div class="dim">Answer: ${esc(t.g)}</div>`:''}
    <div class="sec">Waits on</div>${w.map(x=>row(p,x,{sub:''})).join('')||'<div class="B-empty">Nothing</div>'}
    <div class="sec">Unlocks</div>${u.map(x=>row(p,x,{sub:''})).join('')||'<div class="B-empty">Nothing charted after it</div>'}`;
  const ft=`${acts(p,t).replace('<div class="acts">','').replace(/<\/div>$/,'')}<button class="btn" data-act="closepeek">Close</button>`;
  return S.device==='phone'?`<div class="scrim" data-act="closepeek"></div><div class="sheet"><div class="bd">${bd}</div><div class="ft">${ft}</div></div>`:`<div class="peek"><div class="bd">${bd}</div><div class="ft">${ft}</div></div>`; }
function convHtml(p){ const t=S.conv==='dest'?null:find(p,S.conv); const title=t?t.t:'Change the destination of '+p.title; const s=t?st(p,t):'run';
  return `<div class="conv"><div class="status"><span class="dot s-${s}"></span>${t?LBL[s]:'charting agent'}<span style="flex:1"></span><button class="btn" data-act="back">← Back to the map</button></div>
    <div class="h" style="font-size:16px;margin-bottom:14px">${esc(title)}</div>${t?preview(p,t):''}
    <div class="dim" style="font-size:12.5px">Mock: the real page is the variant D conversation. The back button returns to the same map, variant, and selection.</div></div>`; }
function desktop(){ const p=P(), need=PLANS.reduce((a,x)=>a+needCount(x),0);
  const view=`<div class="page">${V[S.variant][1](p,false)}</div>${peekHtml(p)}`;
  const hd=S.sel==='menu'
    ? `<div class="mhd"><span class="dim" style="font-size:13px">Maps /</span><button class="mtitle" data-act="menu">${esc(p.title)} <span class="dim">▾</span>${need-needCount(p)?`<span class="badge" title="need you on other maps">${need-needCount(p)}</span>`:''}</button><span class="sp"></span><button class="btn ${S.reshape?'primary':''}" data-act="reshape">${S.reshape?'Done reshaping':'✎ Reshape'}</button></div>`
    : `<div class="mhd"><span class="title">Maps</span><span class="dim" style="font-size:12.5px">· ${PLANS.length} maps · ${need} need you</span><span class="sp"></span><button class="btn ${S.reshape?'primary':''}" data-act="reshape">${S.reshape?'Done reshaping':'✎ Reshape'}</button></div>`;
  const body=S.conv?`<div class="page">${convHtml(p)}</div>`:S.sel==='menu'?`<div style="flex:1;display:flex;flex-direction:column;min-height:0;position:relative;border-top:1px solid var(--line)">${view}</div>${S.menu?`<div class="scrim" style="background:transparent" data-act="closemenu"></div><div class="menu">${PLANS.map(mapItem).join('')}</div>`:''}`
    : `<div class="split"><nav class="maplist">${PLANS.map(mapItem).join('')}</nav><div style="display:flex;flex-direction:column;min-height:0;min-width:0;position:relative">${view}</div></div>`;
  return `<div class="D">${side()}<div class="main">${hd}${body}${S.toast?`<div class="toast">${S.toast}</div>`:''}</div></div>`; }
function phone(){ const p=P();
  if(S.conv) return `<div class="P"><div class="phd"><button class="ib" data-act="back">‹</button><span class="title"><span>Conversation</span></span></div><div class="page">${convHtml(p)}</div></div>`;
  const others=PLANS.filter(x=>x!==p).reduce((a,x)=>a+needCount(x),0);
  const sheet=S.sheet==='maps'?`<div class="scrim" data-act="closesheet"></div><div class="sheet"><div class="bd"><div class="sec" style="margin-top:0">Maps</div>${PLANS.map(mapItem).join('')}</div></div>`:'';
  return `<div class="P"><div class="phd"><button class="ib">☰</button><button class="title" data-act="maps"><span>${esc(p.title)}</span><span class="dim">▾</span>${others?`<span class="badge">${others}</span>`:''}</button><button class="ib ${S.reshape?'on':''}" data-act="reshape" title="Reshape">✎</button></div>
    <div class="page">${V[S.variant][1](p,true)}</div>${peekHtml(p)}${focusSheet(p,focusOf(p))}${sheet}${S.toast?`<div class="toast">${S.toast}</div>`:''}</div>`; }

const FOCUS_ACTS='Selecting a ticket selects it in place. The selected ticket carries its actions: answer or review in the conversation, start, rule out of scope.';
const STMT={
 A:{ name:'Lanes', always:'Five lanes by state: closed (latest few), active, ready, blocked, not yet specified.', shows:'Where every ticket stands. No phases or order.', scale:'Closed and blocked collapse.' },
 B:{ name:'Route', always:'Four phases in order, then the destination, with a marker for the live phase.', shows:'How far the plan is from the destination.', scale:'Closed collapses per phase.' },
 C:{ name:'Outline', always:'The map as a readable page: changes, needs you, working, up next, later by blocker, fog, decided.', shows:'What to do next and why the rest waits.', scale:'Groups collapse.' },
 D:{ name:'Focus', always:'A strip of every ticket as a square, by phase. Below it, the selected ticket in the middle, what it waits on to the left, and what it unlocks to the right.', shows:'Why a ticket is where it is and what closing it frees. '+FOCUS_ACTS, scale:'One square per ticket, so 40 tickets fit on two rows. Deep chains read one step at a time.' },
 E:{ name:'Layers', always:'The squares laid out in dependency order: each column can start when the columns before it close. Faint lines connect every ticket to its blockers, and the selected ticket’s lines are bright. Focus card, waits on, and unlocks below.', shows:'The shape of the plan: wide fan-outs, deep chains, and where work converges. '+FOCUS_ACTS, scale:'A deep plan gets many narrow columns; a wide plan gets tall ones. The whole plan stays on one screen.' },
 F:{ name:'Board', always:'Every open ticket as a tile with its title and state, by phase. Closed tickets shrink to squares. The selected ticket sits in a side panel with the latest from its conversation.', shows:'The titles of everything open, readable without selecting. '+FOCUS_ACTS, scale:'Tiles wrap. A large build phase takes most of the page; closed phases shrink to one row of squares.' },
 G:{ name:'Path', always:'The selected ticket with what came before it collapsed, then the longest route from it to the destination, step by step. A side list of what needs you, what runs, and what is ready picks the next ticket.', shows:'How far a ticket is from the destination and what stands between. '+FOCUS_ACTS, scale:'The path shows one route; the other open tickets at each step are counted, not listed.' },
 H:{ name:'Split', always:'A text list of every ticket by phase on the left, closed collapsed. The selected ticket on the right with the latest from its conversation, what it waits on, and what it unlocks.', shows:'Every title at a glance, like a mail client. '+FOCUS_ACTS, scale:'The list scrolls on its own. No visual of the shape.' },
};
function guideHtml(){ const s=STMT[S.variant]; if(CALM.includes(S.variant)) return guideCalm(s);
  return `<h3>Variant ${S.variant}: ${s.name}</h3><div class="stmt"><b>On the page:</b> ${s.always}</div><div class="stmt"><b>What it shows first:</b> ${s.shows}</div><div class="stmt"><b>At scale:</b> ${s.scale}</div>
  <h3>Map selector (m)</h3><div class="stmt"><b>${S.sel==='list'?'List':'Menu'}:</b> ${S.sel==='list'?'A column of every map beside the overview. Each map shows its tickets as small squares, the live phase, and what needs you. Build maps sit under their planning map.':'The map name in the header opens a menu with the same entries. The overview gets the full width, and a badge counts what needs you on other maps.'}</div>
  <h3>Plan shapes</h3><div class="plans">${PLANS.map((p,i)=>`<button class="${i===S.plan?'on':''}" data-plan="${p.id}"><span class="k">${i+1}</span>${esc(p.title)}<span class="k">${esc(p.shape)}</span></button>`).join('')}</div>
  <h3>Ticket states</h3><div class="stmt">Closed. Open and working (claimed, live session). Open and needs you (a question, or a review gate on a PR). Open and ready (takeable). Open and blocked. A session that dies releases its claim, so the ticket goes back to ready, and the map shows “claim released” as a change.</div>
  <h3>Try on each variant</h3><ul><li>Say which phase the plan is in and how far the destination is.</li><li>Find what needs you on this map and on the others.</li><li>Say why a blocked ticket waits, and what closing it frees.</li><li>Read what changed since your last look.</li><li>Rule a ticket out of scope and add one (r).</li><li>Start a ready ticket.</li><li>Do all of it on the phone, on plan 1 and plan 3.</li></ul>
  <h3>Earlier round</h3><div class="stmt">A Lanes, B Route, and C Outline are still at <code>?variant=A</code>, <code>B</code>, and <code>C</code>.</div>`; }

/* ==================== ROUND 3: CALM (I–L) ==================== */
const CALM=['I','J','K','L'];
const CYCLE=['L','I','J','K'];
const ORDER=['wait','review','run','front','blocked'];
function waves(p){ const W={}; const w=t=>{ if(W[t.n]!=null) return W[t.n]; const ob=openBlockers(p,t); return W[t.n]=ob.length?1+Math.max(...ob.map(w)):0; };
  all(p).filter(t=>st(p,t)!=='done').forEach(w); return W; }
function waveLists(p){ const W=waves(p), open=all(p).filter(t=>st(p,t)!=='done'); const L=[[],[],[],[]];
  open.forEach(t=>L[Math.min(3,W[t.n])].push(t)); L.forEach(l=>l.sort((a,b)=>ORDER.indexOf(st(p,a))-ORDER.indexOf(st(p,b))||PHS.indexOf(phase(a))-PHS.indexOf(phase(b)))); return L; }
const WAVE=['Now','Next','After that','Later'];
function zSel(p){ const t=S.zsel&&find(p,S.zsel); return t&&!isOut(p,t.n)?t:null; }
function zRel(p,t){ return t?new Set([...t.by, ...unlocks(p,t).map(x=>x.n)]):new Set(); }
function zCls(p,t){ const s=zSel(p); if(!s) return ''; if(s.n===t.n) return 'zsel'; return zRel(p,s).has(t.n)?'zrel':'zdim'; }
const zWord=s=>({wait:['needs you','need'],review:['review','need'],run:['working',''],front:['ready',''],blocked:['',''],done:['closed','']}[s]);
let zrow=function(p,t){ const s=st(p,t), w=zWord(s);
  return `<button class="zrow ${s==='blocked'?'blk':''} ${zCls(p,t)}" data-z="${t.n}"><span class="zd s-${s}"></span><span class="zt">${esc(t.t)}</span>${w[0]?`<span class="zs ${w[1]}">${w[0]}</span>`:''}</button>`; }
function zSummary(p){ const c=counts(p), n=all(p).length, need=needCount(p), ph=phaseNow(p);

  else if(d.focus||(d.tk&&FAM.includes(S.variant))){ S.focus[p.id]=+(d.focus||d.tk); S.peek=null; if(S.device==='phone'&&['F','H'].includes(S.variant)) S.fsheet=true; }
  else if(d.tk){ S.peek=S.peek===+d.tk?null:+d.tk; }
  else if(d.exp){ const k=K(p,d.exp); S.expand[k]=S.expand[k]===undefined&&d.default!==undefined?!(+d.default):!S.expand[k]; }
  else if(d.conv){ S.conv=d.conv==='dest'?'dest':+d.conv; S.peek=null; S.fsheet=false; }
  else if(d.up||d.dn){ const next=all(p).filter(x=>st(p,x)==='front'); let ord=S.order[p.id]||next.map(x=>x.n); next.forEach(x=>{ if(!ord.includes(x.n)) ord.push(x.n); });
    const n=+(d.up||d.dn), i=ord.indexOf(n), j=d.up?i-1:i+1; if(j>=0&&j<ord.length){ [ord[i],ord[j]]=[ord[j],ord[i]]; } S.order[p.id]=ord; toast('Frontier order changed. Would reorder the sub-issues on GitHub.'); }
  else { const a=d.act; if(a==='reshape') S.reshape=!S.reshape; if(a==='closepeek') S.peek=null; if(a==='back') S.conv=null; if(a==='maps') S.sheet='maps'; if(a==='closesheet') S.sheet=null;
    if(a==='menu') S.menu=!S.menu; if(a==='closemenu') S.menu=false; if(a==='closef') S.fsheet=false; }
  render();
});
document.body.addEventListener('keydown',e=>{ if(e.target.matches('[data-addin]')&&e.key==='Enter'){ addTicket(e.target.dataset.addin,e.target.value); render(); } });
const setVariant=v=>{ S.variant=v; S.peek=null; S.fsheet=false; S.zmore=false; render(); };
const step=k=>{ const i=CYCLE.indexOf(S.variant); setVariant(i<0?CYCLE[0]:CYCLE[(i+k+CYCLE.length)%CYCLE.length]); };
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('dDesk').onclick=()=>{S.device='desktop';render();};
document.getElementById('dPhone').onclick=()=>{S.device='phone';render();};
document.getElementById('selL').onclick=()=>{S.sel='list';S.menu=false;render();};
document.getElementById('selM').onclick=()=>{S.sel='menu';render();};
document.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1);
  if(e.key==='d'){ S.device=S.device==='phone'?'desktop':'phone'; render(); } if(e.key==='r'){ S.reshape=!S.reshape; render(); }
  const cyc=k=>{ const l=ENC5[k].map(x=>x[0]); S[k]=l[(l.indexOf(S[k])+1)%l.length]; render(); }; if(e.key==='f') cyc('fm'); if(e.key==='b') cyc('bm'); if(e.key==='w') cyc('wm'); if(e.key==='g') cyc('gm');
  if(e.key==='m'){ S.sel=S.sel==='list'?'menu':'list'; S.menu=false; render(); }
  if(/^[1-7]$/.test(e.key)){ S.plan=+e.key-1; S.zsel=null; S.zmore=false; S.peek=null; S.fsheet=false; render(); } });
render();
