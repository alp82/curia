<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#1029 Conversation states — prototype</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<!--
  THROWAWAY PROTOTYPE — alp82/curia#1029 "Define the conversation surface's interaction states and density".
  Three density variants of the variant D conversation surface, switchable via ?variant=A|B|C, device via ?device=desktop|phone,
  scenario via ?s=1..6 and step via ?step=n. Static mock data, in-memory state, no persistence.
    A — Full log          every agent step is a line in the conversation; a toast carries interrupts
    B — Folded work       agent steps fold into one "Worked for …" row per turn; the sidebar alone carries interrupts
    C — Docked questions  the conversation holds only prose and results; open questions dock above the composer,
                          interrupts join that dock, and steps live in an Activity panel
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#191c22; }
body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#e6e9ef; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a { color:inherit; }

/* ===== prototype shell (not part of any design) ===== */
.proto-head { position:sticky; top:0; z-index:40; background:#0e1013; color:#8b94a3; font:11px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-bottom:1px solid #23272f; display:flex; gap:16px; flex-wrap:wrap; }
.proto-head b { color:#cdd5e0; }
.layout { display:grid; grid-template-columns:1fr 360px; min-height:calc(100vh - 34px); }
@media (max-width:1100px){ .layout{ grid-template-columns:1fr; } .guide{ position:static !important; height:auto !important; } }
.stage { min-width:0; padding:16px 8px 120px; display:flex; justify-content:center; align-items:flex-start; overflow:auto; }
.frame { box-shadow:0 8px 40px rgba(0,0,0,.5); border-radius:14px; overflow:hidden; position:relative; background:var(--bg); color:var(--ink); }
.frame.desktop { width:1280px; height:800px; }
.frame.phone { width:390px; height:780px; border-radius:36px; border:6px solid #2a2f38; }
.guide { position:sticky; top:34px; height:calc(100vh - 34px); overflow:auto; background:#0e1013; border-left:1px solid #23272f; padding:14px; font-size:13px; color:#cdd5e0; }
.guide h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b94a3; margin:14px 0 6px; }
.guide .tabs { display:flex; flex-wrap:wrap; gap:4px; }
.guide .tabs button { padding:5px 8px; border-radius:6px; background:#161a21; font-size:12px; }
.guide .tabs button.on { background:#273043; color:#fff; }
.guide ol { list-style:none; display:flex; flex-direction:column; gap:4px; }
.guide li button { display:block; width:100%; text-align:left; padding:7px 9px; border-radius:6px; background:#12151b; line-height:1.4; }
.guide li button.on { background:#1f3a2f; outline:1px solid #2f7a5a; }
.guide li button .k { color:#8b94a3; font-size:11px; display:block; margin-top:2px; }
.guide .stmt { background:#12151b; border-radius:8px; padding:10px; line-height:1.45; margin-bottom:8px; }
.guide .stmt b { color:#9fd1ff; }
.guide pre { background:#12151b; border-radius:8px; padding:8px; font:11px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; color:#9aa4b2; }
.bar { position:fixed; left:calc((100vw - 360px)/2); bottom:14px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:4px; padding:6px; background:#0e1013; border:1px solid #2c313b; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.55); font:12px/1 ui-monospace,Menlo,monospace; color:#cdd5e0; white-space:nowrap; }
@media (max-width:1100px){ .bar{ left:50%; } }
.bar button { min-width:40px; min-height:40px; border-radius:999px; padding:0 10px; }
.bar button:hover { background:#1c212a; }
.bar .name { min-width:210px; text-align:center; font-weight:600; }
.bar .sep { width:1px; height:22px; background:#2c313b; }
.bar .tog.on { background:#273043; color:#fff; }

/* ===== app tokens (variant D register) ===== */
.frame { --bg:#0b0c10; --raise:#15181f; --inset:#08090c; --line:#232833; --ink:#e6e9ef; --dim:#8b94a3; --faint:#5b6371; --accent:#5ec8e5; --accent-ink:#08090c;
  --warn:#f2c14e; --bad:#ff6b6b; --good:#5ad38a; --run:#9d8cff; font-size:14px; line-height:1.5; }
.mono { font-family: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; }
.dim { color:var(--dim); }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--faint); flex-shrink:0; }
.dot.wait { background:var(--warn); } .dot.run { background:var(--run); box-shadow:0 0 0 3px rgba(157,140,255,.2); animation:pulse 1.6s infinite; }
.dot.done { background:var(--good); } .dot.bad { background:var(--bad); } .dot.review { background:var(--accent); } .dot.hold { background:var(--dim); }
@keyframes pulse { 50% { box-shadow:0 0 0 5px rgba(157,140,255,.05); } }
.btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; border:1px solid var(--line); background:var(--raise); font-size:13px; }
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; }
.btn.chosen { background:var(--good); color:#000; border-color:var(--good); }
.btn.small { padding:4px 10px; font-size:12px; }
.badge { display:inline-flex; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--warn); color:#000; font-size:11px; font-weight:700; align-items:center; justify-content:center; }
.sec { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:14px 0 6px; }
.card { background:var(--raise); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }

/* shell */
.app { display:grid; grid-template-columns:260px 1fr; height:100%; }
.side { background:var(--inset); display:flex; flex-direction:column; padding:14px 10px; gap:1px; overflow:hidden; }
.side .brand { font-weight:700; font-size:15px; padding:6px 10px 12px; display:flex; justify-content:space-between; }
.side .row { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; color:var(--dim); font-size:13.5px; width:100%; text-align:left; }
.side .row:hover, .side .row.on { background:var(--raise); color:var(--ink); }
.side .row .ic { width:18px; text-align:center; opacity:.8; }
.side .grp { font-size:11px; color:var(--dim); padding:14px 10px 4px; letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between; }
.side .ch { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:6px 10px; border-radius:10px; font-size:13.5px; }
.side .ch span.t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.side .ch.quiet { color:var(--dim); }
.side .ch:hover, .side .ch.on { background:var(--raise); }
.side .ch .unread { width:6px; height:6px; border-radius:50%; background:var(--accent); }
.side .ch.flash { animation:flash 1.2s 2; }
@keyframes flash { 50% { background:#3a3218; } }
.side .list { overflow:auto; flex:1; }
.side .foot { border-top:1px solid var(--line); padding-top:8px; }
.side .foot .fact { font-size:12px; color:var(--dim); padding:4px 10px; }
.main { display:flex; flex-direction:column; overflow:hidden; min-width:0; position:relative; }
.hd { display:flex; align-items:center; gap:10px; padding:12px 24px; min-height:56px; }
.hd .title { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hd .sub { color:var(--dim); font-size:12.5px; white-space:nowrap; }
.hd .sp { flex:1; }
.ib { width:34px; height:34px; border-radius:8px; color:var(--dim); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ib:hover, .ib.on { background:var(--raise); color:var(--ink); }
.scroll { flex:1; overflow:auto; padding:4px 24px 24px; }
.col { max-width:760px; margin:0 auto; }

/* status line */
.status { display:flex; align-items:center; gap:10px; padding:8px 8px 8px 14px; border-radius:14px; background:var(--raise); margin:0 auto 16px; max-width:760px; font-size:13px; color:var(--dim); }
.status b { color:var(--ink); font-weight:500; }
.status .sp { flex:1; }
.status button { color:var(--ink); padding:5px 11px; border-radius:9px; white-space:nowrap; }
.status button:hover { background:var(--bg); }
.status button.go { background:var(--ink); color:var(--bg); font-weight:600; }
.status.sticky { position:sticky; top:0; z-index:5; box-shadow:0 6px 16px var(--bg); }
.status.bad { background:#2a1719; } .status.warn { background:#2a2414; }

/* messages */
.msg { margin-bottom:18px; }
.msg .who { font-size:12px; color:var(--dim); margin-bottom:5px; }
.msg.me { text-align:right; }
.msg.me .body { background:var(--raise); border-radius:16px; padding:10px 16px; display:inline-block; text-align:left; max-width:80%; }
.msg.queued .body { border:1px dashed var(--line); background:transparent; color:var(--dim); }
.msg .note { font-size:11.5px; color:var(--dim); margin-top:4px; }
.msg table { border-collapse:collapse; margin:8px 0; font-size:13px; }
.msg th,.msg td { border:1px solid var(--line); padding:4px 10px; text-align:left; }
.sys { text-align:center; color:var(--dim); font-size:12.5px; margin:14px 0 18px; }
.sys span { background:var(--bg); padding:0 10px; }
.sys.line { border-top:1px solid var(--line); height:0; margin:22px 0; }
.sys.line span { position:relative; top:-10px; }
.newdiv { display:flex; align-items:center; gap:10px; color:var(--accent); font-size:12px; margin:18px 0; }
.newdiv::before, .newdiv::after { content:''; flex:1; border-top:1px solid #1f4b57; }
.pic { margin:8px 0; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#1a1f28; max-width:420px; }
.pic svg { display:block; width:100%; }
.cap { font-size:11.5px; color:var(--dim); padding:5px 10px; }
.att { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.att a { display:inline-flex; gap:6px; align-items:center; padding:5px 10px; border:1px solid var(--line); border-radius:10px; font-size:12.5px; text-decoration:none; }
.pr { margin-top:8px; }
.pr .h { font-weight:600; }

/* question card */
.q { background:var(--raise); border-radius:14px; padding:12px 16px; margin-bottom:18px; border:1px solid var(--line); }
.q .qh { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); margin-bottom:6px; }
.q .qt { font-weight:500; }
.q .opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.q .rec { font-size:10.5px; color:var(--good); margin-left:4px; }
.q.done { background:transparent; border-style:dashed; padding:9px 14px; }
.q.done .qt { color:var(--dim); font-weight:400; }
.q.cancel { opacity:.6; background:transparent; border-style:dashed; }
.q .free { margin-top:10px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--dim); font-size:13px; }

/* A — full log */
.steps { margin:0 0 18px; border-left:2px solid var(--line); padding-left:12px; }
.step { font-size:12.5px; color:var(--dim); display:flex; gap:8px; padding:2px 0; white-space:nowrap; overflow:hidden; }
.step .tool { color:var(--ink); min-width:52px; }
.step .b { overflow:hidden; text-overflow:ellipsis; }
.step .r { margin-left:auto; padding-left:8px; }
.step .r.ok { color:var(--good); } .step .r.no { color:var(--bad); }
.step.live .tool::after { content:' ⋯'; color:var(--run); }
.step.out { white-space:pre; color:var(--faint); padding-left:60px; }
.think { font-size:12.5px; color:var(--faint); font-style:italic; margin:2px 0; }

/* B — folded */
.fold { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; margin:0 0 16px; padding:4px 0; width:100%; text-align:left; }
.fold:hover { color:var(--ink); }
.fold .chev { transition:transform .15s; display:inline-block; }
.fold.open .chev { transform:rotate(90deg); }
.fold .fail { color:var(--bad); }
.shimmer { background:linear-gradient(90deg,var(--dim) 0%,var(--ink) 50%,var(--dim) 100%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sh 2s linear infinite; }
@keyframes sh { to { background-position:-200% 0; } }

/* C — docked */
.dock { max-width:760px; margin:0 auto 8px; width:100%; }
.dock .q { margin-bottom:0; border-color:#4a3f1c; box-shadow:0 -8px 24px rgba(0,0,0,.35); }
.dock .pager { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); margin-left:auto; }
.dock .ctx { font-size:12.5px; color:var(--dim); border-left:2px solid var(--line); padding-left:10px; margin:4px 0 8px; }
.dock .from { color:var(--warn); }
.answered { font-size:12.5px; color:var(--dim); margin:-6px 0 18px; }
.answered b { color:var(--ink); font-weight:500; }
.panel { position:absolute; top:0; right:0; bottom:0; width:340px; background:var(--inset); border-left:1px solid var(--line); z-index:15; display:flex; flex-direction:column; }
.panel .ph { display:flex; align-items:center; padding:14px 16px; gap:8px; }
.panel .pb { overflow:auto; padding:0 16px 16px; flex:1; }
.panel .turn { color:var(--dim); font-size:12px; margin:12px 0 4px; }

/* composer */
.compose { padding:0 24px 20px; }
.compose .box { max-width:760px; margin:0 auto; background:var(--raise); border:1px solid var(--line); border-radius:22px; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
.compose .box .in { color:var(--dim); font-size:14px; min-height:21px; }
.compose .box .in.typed { color:var(--ink); }
.compose .box .tools { display:flex; gap:6px; align-items:center; }
.compose .box .tools .sp { flex:1; }
.compose .send { width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-weight:700; }
.compose .send.off { background:var(--line); color:var(--dim); }
.compose .stat { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dim); padding:0 4px; }
.compose .stat .sp { flex:1; }
.compose .stat button { white-space:nowrap; color:var(--ink); padding:3px 9px; border-radius:8px; }
.compose .stat button:hover { background:var(--bg); }
.compose .stat button.go { background:var(--ink); color:var(--bg); font-weight:600; }

/* toast (A) */
.toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:30; background:#1b2230; border:1px solid #2f3a4f; border-radius:14px; padding:10px 12px 10px 14px; box-shadow:0 8px 30px rgba(0,0,0,.5); display:flex; gap:10px; align-items:center; width:min(540px, calc(100% - 24px)); font-size:13px; }
.toast .t { flex:1; min-width:0; }
.toast .t div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* landing */
.home { max-width:760px; margin:36px auto 0; }
.home h2 { font-size:22px; font-weight:600; margin-bottom:20px; text-align:center; }
.home .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
.home .card { cursor:pointer; }
.home .card .k { font-size:12px; color:var(--dim); margin-bottom:4px; display:flex; gap:8px; align-items:center; }
.home .digest { margin-top:22px; }
.home .drow { display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
.home .drow .t { flex:1; min-width:0; }
.home .drow .t .x { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.home .drow .t .y { color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.home .quiet { text-align:center; color:var(--dim); margin-top:18px; }
.home .sugg { display:flex; flex-direction:column; gap:6px; margin-top:16px; }
.home .sugg button { text-align:left; padding:10px 14px; border:1px solid var(--line); border-radius:12px; color:var(--dim); }
.home .sugg button:hover { color:var(--ink); background:var(--raise); }
.empty { text-align:center; color:var(--dim); margin:80px auto 0; max-width:420px; }
.empty .big { font-size:28px; margin-bottom:10px; opacity:.6; }
.empty .h { color:var(--ink); font-weight:600; margin-bottom:6px; }

/* phone */
.phone .app { display:block; }
.phone .hd { padding:10px 12px; min-height:52px; }
.phone .scroll { padding:4px 14px 14px; }
.phone .compose { padding:4px 10px 12px; }
.phone .compose .box { border-radius:20px; padding:10px 14px; }
.phone .home { margin-top:18px; }
.phone .home .grid { grid-template-columns:1fr; }
.phone .main { height:100%; }
.phone .status { font-size:12.5px; }
.status > span:nth-child(2), .compose .stat > span:nth-child(2) { min-width:0; }
.drawer { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:25; }
.drawer .side { width:84%; height:100%; }
.sheet { position:absolute; left:0; right:0; bottom:0; max-height:70%; background:var(--inset); border-radius:18px 18px 0 0; z-index:26; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.6); }
.sheet .pb { overflow:auto; padding:0 16px 16px; }
.phone .toast { top:8px; }
.phone .ib { width:44px; height:44px; }

/* ===================== round 2: tidier takes on A ===================== */
.v-D, .v-E, .v-F { font-family:"Geist", ui-sans-serif, system-ui, sans-serif; letter-spacing:-.005em; }
.v-D .mono, .v-E .mono, .v-F .mono { font-family:"Geist Mono", ui-monospace, Menlo, monospace; }
.v-D, .v-E, .v-F { --raise:#14161c; --line:#20242d; --ink:#e8eaee; --dim:#8a919d; --faint:#555c68; }
.v-D .side, .v-E .side, .v-F .side { background:#0a0b0e; border-right:1px solid #16181e; }
.v-D .side .grp, .v-E .side .grp, .v-F .side .grp { font-size:11px; letter-spacing:.04em; text-transform:none; color:var(--faint); font-weight:500; }
.v-D .badge, .v-E .badge, .v-F .badge { background:transparent; color:var(--warn); min-width:0; padding:0; font-weight:600; }
.v-D .msg .who, .v-E .msg .who, .v-F .msg .who { font-weight:500; color:var(--ink); font-size:12.5px; }
.v-D .msg .body, .v-E .msg .body, .v-F .msg .body { line-height:1.62; }
.v-D .btn, .v-E .btn, .v-F .btn { border-radius:8px; }
.v-D .q, .v-E .q, .v-F .q { border-radius:12px; }

/* D — quiet log */
.v-D .slim { display:flex; align-items:center; gap:10px; max-width:760px; margin:0 auto; padding:0 0 10px; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--line); margin-bottom:22px; position:sticky; top:0; background:var(--bg); z-index:5; padding-top:4px; }
.v-D .slim b { color:var(--ink); font-weight:500; }
.v-D .slim .sp { flex:1; }
.v-D .slim button { color:var(--dim); padding:3px 8px; border-radius:6px; font-size:12.5px; white-space:nowrap; }
.v-D .slim button:hover { color:var(--ink); background:var(--raise); }
.v-D .slim button.go { color:var(--bg); background:var(--ink); font-weight:500; }
.v-D .slim.bad b { color:var(--bad); } .v-D .slim.warn b { color:var(--warn); }
.qlog { margin:-4px 0 20px; display:flex; flex-direction:column; gap:1px; }
.qlog .row { display:grid; grid-template-columns:18px 1fr auto; gap:10px; align-items:center; font-size:12.5px; color:var(--dim); padding:2px 0; }
.qlog .g { width:18px; height:18px; border-radius:5px; background:var(--raise); color:var(--dim); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-family:"Geist Mono",monospace; }
.qlog .p { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qlog .p em { font-style:normal; color:var(--ink); }
.qlog .r { font-size:11.5px; font-variant-numeric:tabular-nums; }
.qlog .r.ok { color:var(--faint); } .qlog .r.no { color:var(--bad); } .qlog .r.add { color:var(--faint); }
.qlog .row.live .g { color:var(--run); box-shadow:0 0 0 1px var(--run) inset; }
.qlog .row.live .p { color:var(--ink); }
.qlog .row.think .p { font-style:italic; color:var(--faint); }
.qlog .row.out .p { color:var(--bad); opacity:.8; }
.qlog .more { font-size:12px; color:var(--faint); padding:2px 0 2px 28px; text-align:left; }
.qlog .more:hover { color:var(--ink); }
.v-D .toast.bottom { top:auto; bottom:108px; border-radius:12px; background:#191c24; border-color:#2a2f3a; padding:8px 8px 8px 14px; }
.v-D .home .card, .v-F .home .card { border-radius:12px; background:transparent; display:flex; flex-direction:column; gap:4px; min-height:108px; }
.v-D .home .card:hover, .v-F .home .card:hover { background:var(--raise); }
.v-D .home .card .k, .v-F .home .card .k { justify-content:space-between; }

    case 'spawnfail': return {cls:'bad', dot:'bad', text:`<b>Didn’t start</b> · ${c.cause}`, btns:[['Try again','retry','go']]};
    case 'closed': return {cls:'', dot:'done', text:`<b>Closed</b> · ${c.ago} · resolved on the ticket`, btns:[[c.ticket+' ↗','ticket']]};
  }
  return {cls:'',dot:'',text:'',btns:[]};
}
function statusLine(c, sticky){
  const s = statusInfo(c);
  return `<div class="status ${s.cls} ${sticky?'sticky':''}"><span class="dot ${s.dot}"></span><span>${s.text}</span><span class="sp"></span>${s.btns.map(b=>`<button class="${b[2]||''}" data-act="${b[1]}" data-c="${c.id}">${b[0]}</button>`).join('')}</div>`;
}

/* ---------- stream per variant ---------- */
function workA(it, key){
  return `<div class="steps">${it.steps.map((s,i)=>{
    if(s[0]==='Think') return `<div class="think">${esc(s[1])}</div>`;
    if(s[0]==='Out') return `<div class="step out">${esc(s[1])}</div>`;
    const live = s[2]==='live';
    return `<div class="step ${live?'live':''}"><span class="tool mono">${s[0]}</span><span class="b mono">${esc(s[1])}</span><span class="r ${s[2]==='ok'?'ok':s[2]==='no'?'no':''}">${s[2]==='ok'?'✓':s[2]==='no'?'✗':live?'':esc(s[2])}</span></div>`; }).join('')}</div>`;
}
const GL = { Read:'R', Edit:'E', Write:'W', Bash:'$' };
function stepRes(r){ if(r==='ok') return ['ok','✓']; if(r==='no') return ['no','failed']; if(r==='live'||!r) return ['','']; return ['add', r]; }
function workD(it, key){
  const all = it.steps, cap = 4, open = S.open[key];
  const shown = open || all.length<=cap ? all : all.slice(-cap);
  const hidden = all.length - shown.length;
  return `<div class="qlog">${hidden?`<button class="more" data-fold="${key}">${hidden} earlier step${hidden>1?'s':''}</button>`:''}${shown.map(s=>{
    if(s[0]==='Think') return `<div class="row think"><span class="g">✱</span><span class="p">${esc(s[1])}</span><span></span></div>`;
    if(s[0]==='Out') return `<div class="row out"><span></span><span class="p mono">${esc(s[1])}</span><span></span></div>`;
    const [rc, rt] = stepRes(s[2]); const parts = s[1].split(' · ');
    return `<div class="row ${s[2]==='live'?'live':''}"><span class="g">${GL[s[0]]||'·'}</span><span class="p mono"><em>${esc(parts[0])}</em>${parts[1]?' · '+esc(parts[1]):''}</span><span class="r ${rc}">${rt}</span></div>`; }).join('')}</div>`;
}
function workB(it, key){
  const open = S.open[key];
  const n = it.steps.filter(s=>s[0]!=='Think'&&s[0]!=='Out').length;
  const head = it.live ? `<span class="shimmer">Working for ${it.min} min · ${esc(it.steps[it.steps.length-1][1])}</span>` : it.fail ? `Worked for ${it.min} min · ${n} steps · <span class="fail">last step failed</span>` : `Worked for ${it.min} min · ${n} steps`;
  return `<button class="fold ${open?'open':''}" data-fold="${key}"><span class="chev">›</span>${head}</button>${open?workA(it,key):''}`;
}
function tstamp(c,i){ const base = {c2:7*60+2, c3:3*60+10, c4:8*60+49, c5:8*60+20, c6:2*60+41, c7:8*60+5, c9:5*60+50, c10:8*60+36}[c.id]||8*60; const m = base + i*9; return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function itemHtml(c, it, i, V){
  const key = c.id+':'+i;
  if(it.k==='me') return `<div class="msg me"><div class="body">${esc(it.t)}</div>${it.via?`<div class="note">sent from ${it.via}</div>`:''}</div>`;
  if(it.k==='queued') return `<div class="msg me queued"><div class="body">${esc(it.t)}</div><div class="note">${c.state==='paused'?'Waits until you resume':'Delivered when the agent finishes its current step'}</div></div>`;
  if(it.k==='say') return sayHtml(c,it);
  if(it.k==='sys') return `<div class="sys line"><span>${esc(it.t)}</span></div>`;
  if(it.k==='work'){ if(V==='A') return workA(it,key); if(V==='B') return workB(it,key); if(V==='D'||V==='F') return workD(it,key); return ''; }
  if(it.k==='q'){
    if(V==='C'){ if(it.ans) return `<div class="answered">You answered <b>${esc(it.ans)}</b> to “${esc(it.q)}”${it.via?` · in ${it.via}`:''}</div>`; if(it.cancelled) return qHtml(c,it); return ''; }
    return qHtml(c,it);
  }
  return '';
}
function stream(c){
  const V = S.variant; let h='';
  const newdiv = i => S.newAt[c.id]===i ? `<div class="newdiv">${S.unread[c.id]||'New'} since you left</div>` : '';
  if(V==='E'){
    c.items.forEach((it,i)=>{
      h += newdiv(i);
      if(it.k==='work'){ it.steps.forEach((st,j)=>{ const last = j===it.steps.length-1; const [rc,rt]=stepRes(st[2]);
        if(st[0]==='Think'||st[0]==='Out') h += `<div class="tl stepl ${last?'gap':''}"><div class="tm"></div><div class="nd step"><i></i></div><div class="tc"><span class="p" style="${st[0]==='Out'?'color:var(--bad)':'font-style:italic'}">${esc(st[1])}</span></div></div>`;
        else h += `<div class="tl stepl ${last?'gap':''}"><div class="tm">${j===0?tstamp(c,i):''}</div><div class="nd step ${st[2]==='live'?'live':''}"><i></i></div><div class="tc"><span class="t">${st[0]}</span><span class="p mono">${esc(st[1])}</span><span class="r ${rc}">${rt}</span></div></div>`; }); return; }
      const nd = it.k==='me'||it.k==='queued' ? 'me' : it.k==='q' ? (it.ans||it.cancelled?'':'q') : it.k==='sys' ? 'sys' : '';
      h += `<div class="tl"><div class="tm">${tstamp(c,i)}</div><div class="nd ${nd}"><i></i></div><div class="tc">${itemHtml(c,it,i,V)}</div></div>`;
    });
    return h;
  }
  if(V==='F'){
    let i=0; const items=c.items;
    while(i<items.length){
      h += newdiv(i);
      const it = items[i];
      if(it.k==='work' || it.k==='say'){
        let work = it.k==='work' ? it : null, wi = i; let j = work ? i+1 : i; let says='';
        while(j<items.length && items[j].k==='say'){ says += sayHtml(c, items[j]); j++; }
        const n = work ? work.steps.filter(x=>x[0]!=='Think'&&x[0]!=='Out').length : 0;
        const head = work ? (work.live?`<span class="dot run"></span><b>${esc(c.agent)}</b> · working ${work.min} min · ${n} steps so far`:`<b>${esc(c.agent)}</b> · ${work.min} min · ${n} steps${work.fail?' · <span style="color:var(--bad)">last step failed</span>':''}`) : `<b>${esc(c.agent||'Overseer')}</b>`;
        h += `<div class="turnc ${work&&work.live?'live':''} ${work&&work.fail?'fail':''}"><div class="th">${head}<span class="sp"></span><span class="mono" style="font-size:11px;color:var(--faint)">${tstamp(c,wi)}</span></div>${work?`<div class="ts">${workD(work, c.id+':'+wi)}</div>`:''}${says?`<div class="tb">${says}</div>`:''}</div>`;
        i = j; continue;
      }
      h += itemHtml(c,it,i,V); i++;
    }
    return h;
  }
  let prevAgent = false;
  c.items.forEach((it,i)=>{
    h += newdiv(i);
    let x = itemHtml(c,it,i,V);
    if(V==='D' && it.k==='say'){ if(prevAgent) x = x.replace(/<div class="who">[^<]*<\/div>/,''); }
    if(it.k!=='work') prevAgent = it.k==='say';
    h += x;
  });
  return h;
}
/* the dock (C): open questions of this conversation, plus interrupts from others */
function dockItems(c){
  const own = c ? openQs(c).map(q=>({c, q})) : [];
  const other = S.interrupt && (!c || S.interrupt!==c.id) ? openQs(byId(S.interrupt)).map(q=>({c:byId(S.interrupt), q, from:true})) : [];
  return [...own, ...other];
}
function dockHtml(items){
  if(!items.length) return '';
  const ix = Math.min(S.dockIx, items.length-1), d = items[ix];
  const ctxIdx = d.c.items.indexOf(d.q); let ctx=''; for(let j=ctxIdx-1;j>=0;j--){ if(d.c.items[j].k==='say'){ ctx=d.c.items[j].t; break; } }
  const pager = items.length>1 ? `<span class="pager"><button class="ib" style="width:26px;height:26px" data-dock="-1">‹</button>${ix+1} of ${items.length}<button class="ib" style="width:26px;height:26px" data-dock="1">›</button></span>` : '';
  return `<div class="dock">${qHtml(d.c, d.q, {from:d.from?d.c:null, pager, ctx:(d.from||S.view==='home')?ctx:''})}</div>`;
}

  const slim = V==='D' && hasStatus ? `<div class="slim ${st.cls}"><span class="dot ${st.dot}"></span><span>${st.text}</span><span class="sp"></span>${btns}</div>` : '';
  const dock = V==='C' ? dockHtml(dockItems(c)) : '';
  const info = S.info ? `<div class="${phone?'sheet':'panel'}"><div class="ph" style="display:flex;padding:14px 16px"><b>Details</b><span style="flex:1"></span><button class="ib" data-act="info">✕</button></div><div class="pb"><div class="sec" style="margin-top:0">On the map</div><div>${m?esc(m.title)+' · '+c.ticket:'Quick task, no map'}</div><div class="sec">Artifacts</div><div class="dim">${c.items.some(i=>i.pic||i.att||i.pr)?'🖼 picture · 📄 notes · 🔗 preview':'none yet'}</div><div class="sec">Session</div><div class="dim">${esc(c.agent||'')} · branch ${c.ticket?'ticket/'+c.ticket.slice(1):'quick/'+c.id} · <a href="#">terminal</a> · <a href="#">take back last message</a></div></div></div>` : '';
  const act = V==='C' && S.activity ? `<div class="${phone?'sheet':'panel'}"><div class="ph"><b>Activity</b><span class="dim" style="font-size:12px">every agent step</span><span style="flex:1"></span><button class="ib" data-act="activity">✕</button></div><div class="pb">${c.items.map((it,i)=>it.k==='work'?`<div class="turn">${it.live?'Now':'Turn'} · ${it.min} min${it.fail?' · last step failed':''}</div>${workA(it)}`:'').join('')}</div></div>` : '';
  const ph = c.state==='waiting' ? 'Answer, or say something else…' : c.state==='working' ? 'Steer the agent…' : c.state==='closed' ? 'Start a follow-up conversation…' : 'Message the agent…';
  return `<div class="main">${hd}<div class="scroll"><div class="col">${statusTop?statusLine(c, true):''}${slim}${body}</div></div>${dock?`<div style="padding:0 ${phone?10:24}px">${dock}</div>`:''}${c.state==='closed'?'':composeBox(ph,false,c.kind==='overseer'?null:c)}${info}${act}</div>`;
}
function toastHtml(){
  if(!['A','D','E'].includes(S.variant) || !S.toast) return '';
  const c = byId(S.toast), q = openQs(c)[0];
  const cls = S.variant==='D' ? 'bottom' : S.variant==='E' ? 'stack' : '';
  return `<div class="toast ${cls}"><span class="dot wait"></span><div class="t"><div><b>${esc(c.title)}</b></div><div class="dim">${esc(q?q.q:c.last)}</div></div><button class="btn small primary" data-open="${c.id}">Answer</button><button class="btn small" data-act="later">Later</button></div>`;
}
function app(){
  const phone = S.device==='phone';
  const c = byId(S.chat);
  let main;
  if(S.view==='maps') main = `<div class="main"><div class="hd">${phone?`<button class="ib" data-act="menu">☰</button>`:''}<span class="title">Maps</span></div><div class="scroll">${mapsPage()}</div></div>`;
  else if(c) main = conversation(c);
  else { const dock = S.variant==='C' && S.interrupt && S.view!=='home' ? dockHtml(dockItems(null)) : '';
    main = `<div class="main"><div class="hd">${phone?`<button class="ib" data-act="menu">☰</button><span class="title">Curia</span>`:''}</div><div class="scroll">${landing()}</div>${dock}</div>`; }
  if(phone) return `<div class="app">${main}${S.menu?`<div class="drawer" data-act="menu">${sidebar()}</div>`:''}</div>${toastHtml()}`;
  return `<div class="app">${sidebar()}${main}</div>${toastHtml()}`;
}

/* ==================== SCENARIOS ==================== */
const go = id => { S.chat=id; S.view='chat'; S.info=false; S.activity=false; S.dockIx=0; delete S.unread[id]; };
const set = (id, patch) => Object.assign(byId(id), patch);
const push = (id, it) => byId(id).items.push(it);
const answer = (cid, qid, o, via) => { const q = byId(cid).items.find(i=>i.qid===qid); q.ans=o; if(via){ q.via=via; q.viaAgo='just now'; } };
const SC = [
 { n:1, name:'Landing after a return', note:'The first thing you see after ten hours away, and its quieter cousins.', steps:[
   ['Land after 10 hours away', 'Two conversations wait on questions, one on a review, one ended, one didn’t start, one lost its sign-in.', ()=>{ reset(); }],
   ['Reopen a conversation you left mid-way', 'The conversation marks where you stopped reading.', ()=>{ reset(); S.newAt.c2=3; S.unread.c2='2 messages and 2 turns'; go('c2'); }],
   ['Land when nothing needs you', 'Agents are working. Nothing waits.', ()=>{ reset(); S.quiet=true; CONV.forEach(c=>{ if(c.id!=='c2'&&c.kind!=='overseer') c.state=c.state==='closed'?'closed':'done'; c.items.forEach(i=>{ if(i.k==='q'&&!i.cancelled&&!i.ans) i.ans=i.opts[0]; }); }); }],
   ['Land on the first day', 'The Work gate just opened. No conversations and no maps yet.', ()=>{ reset(); S.empty='first'; }],
 ]},
 { n:2, name:'Interrupts', note:'A question arrives in another conversation while you work in this one.', steps:[
   ['Review a pull request', 'You’re reading the quick task’s pull request. Nothing else asks yet.', ()=>{ reset(); set('c4',{state:'working', since:'52 min', doing:'publishing the preview'}); byId('c4').items.pop(); go('c5'); }],
   ['Another conversation asks a question', 'The graph bake-off publishes a preview and asks which graph to use.', ()=>{ reset(); go('c5'); S.toast='c4'; S.interrupt='c4'; S.flash='c4'; S.unread.c4=1; }],
   ['Answer it', 'Answer opens the other conversation. Later keeps you where you are.', ()=>{ reset(); if(S.variant==='C'){ go('c5'); S.interrupt='c4'; } else { go('c4'); } }],
   ['Two questions open in one conversation', 'The grilling agent asked two things at once.', ()=>{ reset(); go('c3'); }],
   ['A question gets answered in Discord', 'You answered the first one on your phone in Discord while this page was open.', ()=>{ reset(); answer('c3','q31a','Own type: build','Discord'); go('c3'); }],
   ['A question closes because its session ended', 'The recovery ticket’s session died with a question open.', ()=>{ reset(); go('c6'); }],
 ]},
 { n:3, name:'Parallel conversations', note:'Six conversations alive at once. Moving between them keeps your place.', steps:[
   ['Six conversations are alive', 'The sidebar is the only overview. States come from the dots.', ()=>{ reset(); set('c9',{state:'working', since:'8 min', doing:'editing CONTEXT.md'}); go('c2'); }],
   ['Start a quick task while others run', 'You type the task on the landing page.', ()=>{ reset(); S.view='home'; S.typed='Add a --json flag to curia doctor'; }],
   ['The new conversation starts', 'It shows up in Recent and opens straight away.', ()=>{ reset(); CONV.splice(1,0,{ id:'c11', map:null, title:'Add a --json flag to curia doctor', type:'quick', state:'starting', agent:'Claude', ago:'now', last:'Starting…', items:[{k:'me', t:'Add a --json flag to curia doctor'}] }); go('c11'); }],
   ['Switch back to the long run', 'The long run kept working. The unread dot is on its row.', ()=>{ reset(); S.newAt.c2=5; S.unread.c2='1 turn'; go('c2'); }],
   ['Message an agent that’s working', 'Your message waits for the current step to finish.', ()=>{ reset(); push('c2',{k:'queued', t:'Also show the paused state on the phone.'}); go('c2'); }],
 ]},
 { n:4, name:'Long-running work', note:'A session that runs for hours, and the states it passes through.', steps:[
   ['Two hours in', 'The agent is still working. Its turns so far are in the conversation.', ()=>{ reset(); go('c2'); }],
   ['Pause it', 'Pause stops after the current step. New messages wait.', ()=>{ reset(); set('c2',{state:'paused'}); push('c2',{k:'queued', t:'Use the real item kinds from the timeline.'}); go('c2'); }],
   ['No output for 30 minutes', 'The stall watchdog noticed. The agent may be stuck on a test.', ()=>{ reset(); set('c2',{state:'stalled'}); go('c2'); }],
   ['Cross-checking a pull request', 'The second provider reviews the pull request before you do.', ()=>{ reset(); set('c5',{state:'crosscheck'}); go('c5'); }],
   ['At a usage limit', 'The Claude window is spent. The session resumes by itself.', ()=>{ reset(); go('c9'); }],
 ]},
 { n:5, name:'Failure and recovery', note:'A ticket has no failed state. A dead session releases its claim; the conversation offers the way back.', steps:[
   ['A session died overnight', 'The container lost its network during npm install.', ()=>{ reset(); go('c6'); }],
   ['Start it again', 'Same branch, same conversation. The closed question is asked again.', ()=>{ reset(); const c=byId('c6'); set('c6',{state:'working', since:'1 min', doing:'npm install'}); push('c6',{k:'sys', t:'Started again at 09:14 on the same branch'}); push('c6',{k:'q', qid:'q6b', kind:'choice', q:'Should the recovery card also show when the bot is missing entirely?', opts:['Yes','No']}); set('c6',{state:'waiting', ago:'now'}); go('c6'); }],
   ['A sign-in expired mid-task', 'The quick task pauses. Nothing is lost.', ()=>{ reset(); go('c7'); }],
   ['Signed in again', 'The task picks up where it paused.', ()=>{ reset(); set('c7',{state:'working', since:'19 min', doing:'editing openaisetup.test.mjs'}); push('c7',{k:'sys', t:'Signed in to Claude again at 09:20 · continuing'}); go('c7'); }],
   ['A task didn’t start', 'The agent image failed to pull. There is no agent to talk to yet.', ()=>{ reset(); go('c10'); }],
 ]},
 { n:6, name:'Empty states', note:'What each surface says when it has nothing to show.', steps:[
   ['A new conversation', 'The landing page with nothing typed.', ()=>{ reset(); S.quiet=true; CONV.forEach(c=>{ if(c.kind!=='overseer') c.state='done'; c.items.forEach(i=>{ if(i.k==='q'&&!i.cancelled) i.ans=i.opts[0]; }); }); }],
   ['A conversation that just started', 'Sent, but the agent hasn’t said anything yet.', ()=>{ reset(); CONV.splice(1,0,{ id:'c11', map:null, title:'Add a --json flag to curia doctor', type:'quick', state:'starting', agent:'Claude', ago:'now', last:'Starting…', items:[{k:'me', t:'Add a --json flag to curia doctor'}] }); go('c11'); }],
   ['A closed ticket’s conversation', 'The transcript ends with the session. Keeping it readable is still fog on the map.', ()=>{ reset(); go('c8'); }],
   ['No maps yet', 'Maps in the sidebar and the Maps page, empty.', ()=>{ reset(); S.noMaps=true; S.view='maps'; }],
   ['First day', 'No conversations, no maps.', ()=>{ reset(); S.empty='first'; }],
 ]},
];
const VS = {
  D:{ always:'Still a full log, but quieter. Each step is one line with a tool glyph (R read, E edit, W write, $ command), the file in bright text, and the result in faint text on the right. A run of more than four steps shows the last four and “6 earlier steps”. Consecutive agent messages drop the repeated name.', questions:'In the conversation, where asked.', interrupt:'A compact toast sits just above the composer, where your eyes already are.', landing:'At most four cards in two even columns: the first three from Needs you in the sidebar's order, then the overseer. State and time on top, title, then two lines of the latest message. The rest are one link, “N more need you · in the sidebar”.' },
  E:{ always:'Everything hangs on one rail with times in the left gutter. Messages are nodes; steps are small dots with their tool and file. A question is an amber diamond. The status is a pill in the header with its controls.', questions:'In the conversation, on the rail, where asked.', interrupt:'A card stacks at the top right, under the header, so it never covers the conversation’s text column.', landing:'Grouped by what they need: waiting for you, stopped and needs a hand, still going, overseer.' },
  F:{ always:'Each agent turn is one card: a header with agent, minutes, and step count, the step log, then what the agent said. The live turn has a violet edge, a failed one a red edge. Your messages and questions sit between cards.', questions:'In the conversation, between turn cards, on an amber ground.', interrupt:'No floating toast. The strip on top of the composer switches from this conversation’s status to the other conversation’s question, with Answer and Later.', landing:'One sentence from the overseer under the greeting, the prompt box, then cards.' },
  A:{ always:'Every agent step is a monospaced line in the conversation, with thinking in italics and failed output in place. The status line sticks to the top of the conversation.', questions:'Open questions sit in the conversation where the agent asked them.', interrupt:'A toast names the other conversation and its question, with <b>Answer</b> and <b>Later</b>. The sidebar row flashes and moves to Needs you.', landing:'Cards for everything that needs you, each with its last line, plus the overseer.' },
  B:{ always:'Each agent turn folds into one row: “Worked for 48 min · 7 steps ›”. The live turn shimmers with its current step. A failed turn says so on the folded row. The status line sticks to the top.', questions:'Open questions sit in the conversation where the agent asked them.', interrupt:'No toast. The sidebar row flashes, moves to Needs you, and the count goes up. You finish what you’re doing.', landing:'A “Since you left” list, one row per conversation with one verb (Answer, Review, Start again, Sign in).' },
  C:{ always:'The conversation holds only what people and agents said, pictures, and results. Every agent step lives behind <b>Activity</b> (≡). The status line joins the composer at the bottom.', questions:'Open questions dock above the composer with the message that asked them, one at a time with a pager. Answered ones leave one line in the conversation.', interrupt:'The other conversation’s question joins the dock, marked with where it’s from. Answer it without leaving.', landing:'The questions that wait, answerable in the dock with their context, then cards for the rest.' },
};

/* ==================== RENDER ==================== */
function render(){
  const f = document.getElementById('frame');
  f.className = 'frame '+S.device+' v-'+S.variant; f.innerHTML = app();
  document.getElementById('vname').textContent = `${S.variant} — ${VN[S.variant]}`;
  document.getElementById('tdesk').classList.toggle('on', S.device==='desktop');
  document.getElementById('tphone').classList.toggle('on', S.device==='phone');
  const sc = SC[scenario-1], v = VS[S.variant];
  const c = byId(S.chat);
  document.getElementById('ph').textContent = `variant=${S.variant} device=${S.device} s=${scenario} step=${step}`;
  document.getElementById('guide').innerHTML = `<h3>Variant ${S.variant} — ${VN[S.variant]}</h3>
    <div class="stmt"><b>Agent steps:</b> ${v.always}</div><div class="stmt"><b>Questions:</b> ${v.questions}</div><div class="stmt"><b>Interrupts:</b> ${v.interrupt}</div><div class="stmt"><b>Landing after a return:</b> ${v.landing}</div>
    <h3>Scenario</h3><div class="tabs">${SC.map(x=>`<button class="${x.n===scenario?'on':''}" data-sc="${x.n}">${x.n} ${x.name}</button>`).join('')}</div>
    <p style="margin:10px 0;color:#8b94a3">${sc.note}</p>
    <ol>${sc.steps.map((s,i)=>`<li><button class="${i===step?'on':''}" data-step="${i}">${i+1}. ${s[0]}<span class="k">${s[1]}</span></button></li>`).join('')}</ol>
    <h3>State shown</h3><pre>${esc(JSON.stringify({ view:S.view, conversation:c?c.title:null, state:c?c.state:null, open_questions:c?openQs(c).length:null, interrupt:S.interrupt?byId(S.interrupt).title:null, needs_you:CONV.filter(x=>x.kind!=='overseer'&&needsYou(x)&&!S.quiet).length }, null, 1))}</pre>
    <h3>Every state on the status line</h3><div class="stmt" style="font-size:12px">starting · working · paused · no output · cross-checking · waiting for you · pull request open · at a limit · sign-in expired · ended · didn’t start · finished · closed</div>`;
  const u = new URL(location.href); ['variant','device','s','step'].forEach((k,i)=>u.searchParams.set(k,[S.variant,S.device,scenario,step][i])); history.replaceState(null,'',u);
}
function runStep(){ SC[scenario-1].steps[step][2](); render(); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-sc],[data-step],[data-open],[data-view],[data-map],[data-act],[data-ans],[data-fold],[data-dock]'); if(!t) return;
  const d = t.dataset;
  if(d.sc){ scenario=+d.sc; step=0; runStep(); return; }
  if(d.step){ step=+d.step; runStep(); return; }
  if(d.ans){ answer(d.c, d.ans, d.o); const c=byId(d.c); if(!openQs(c).length && c.state==='waiting'){ c.state='working'; c.since='0 min'; c.doing='reading your answer'; } if(S.interrupt===d.c && !openQs(c).length) S.interrupt=null; S.dockIx=0; render(); return; }
  if(d.fold){ S.open[d.fold]=!S.open[d.fold]; render(); return; }
  if(d.dock){ S.dockIx=Math.max(0,S.dockIx+(+d.dock)); render(); return; }
  if(d.open){ go(d.open); S.menu=false; if(S.toast===d.open) S.toast=null; if(S.interrupt===d.open) S.interrupt=null; S.flash=null; render(); return; }
  if(d.view){ S.view=d.view; S.chat=null; S.menu=false; render(); return; }
  if(d.map){ S.view='maps'; S.mapSel=d.map; S.chat=null; S.menu=false; render(); return; }
  const a=d.act, c=d.c&&byId(d.c);
  if(a==='menu'){ if(e.target.closest('.side') && !e.target.closest('[data-act="menu"]')) return; S.menu=!S.menu; }
  else if(a==='info'){ S.info=!S.info; S.activity=false; }
  else if(a==='activity'){ S.activity=!S.activity; S.info=false; }
  else if(a==='later'){ S.toast=null; }
  else if(a==='flashneeds'){ S.flash='needs'; setTimeout(()=>{ S.flash=null; render(); }, 2600); }
  else if(a==='pause'){ c.state='paused'; }
  else if(a==='resume'){ c.state='working'; c.items.forEach(i=>{ if(i.k==='queued') i.k='me'; }); }
  else if(a==='stop'){ c.state='died'; c.diedAt='now'; c.cause='you stopped it · the branch and the conversation stay'; }
  else if(a==='restart'||a==='retry'){ c.state='starting'; c.items.push({k:'sys', t:'Starting again on the same branch'}); }
  else if(a==='signin'){ c.state='working'; c.since='19 min'; c.doing='continuing'; c.items.push({k:'sys', t:'Signed in again · continuing'}); }
  else if(a==='switch'){ c.state='working'; c.agent='Codex'; c.since='11 min'; c.doing='continuing on OpenAI'; c.items.push({k:'sys', t:'Switched to OpenAI · continuing'}); }
  else if(a==='nudge'){ c.state='working'; c.items.push({k:'queued', t:'Are you stuck? Say what you’re waiting on.'}); }
  else if(a==='xcheck'){ c.state='crosscheck'; }
  else if(a==='merge'){ c.state='done'; c.items.push({k:'sys', t:'Merged #1036'}); }
  else if(a==='startquick'){ SC[2].steps[2][2](); }
  render();
});
function setVariant(v){ S.variant=v; runStep(); }
document.getElementById('prev').onclick=()=>setVariant(VARS[(VARS.indexOf(S.variant)+VARS.length-1)%VARS.length]);
document.getElementById('next').onclick=()=>setVariant(VARS[(VARS.indexOf(S.variant)+1)%VARS.length]);
document.getElementById('tdesk').onclick=()=>{ S.device='desktop'; render(); };
document.getElementById('tphone').onclick=()=>{ S.device='phone'; render(); };
document.addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
  if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='d'){ S.device=S.device==='desktop'?'phone':'desktop'; render(); }
});
runStep();
</script>
