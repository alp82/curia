<!doctype html>
<!--
  curia#508 — Take the living-organism run further, on a second model.
  Continues curia#363, which locked in the vertical run and the descent variant.

  THROWAWAY PROTOTYPE. Not the live page. Not served from docs/.
  One self-contained file: no build step, no CDN, no npm, no webfont, no image.

  The baseline is locked (#363 round 4, #508 round 1): the vertical run,
  the reader's own ticket held still as a big left-aligned card, and its
  state changing as each stage passes. #508 round 2 rebuilt the variant
  set on the operator's order: the baseline plus five storytelling
  techniques, switchable with ?variant= and the bottom bar:

    base  — the locked baseline alone, no traffic
    braid — three repo lines run in parallel and join into the one queue
    tree  — the map card is pinned at the top and every ticket is born from it
    acts  — the run grows in acts: one ticket, more tickets, more repo lines
    stack — the queue is a visible pile that sends tickets down the line
    trail — the line keeps the color of every stage the ticket has passed

  The variants cut at #363 (live, grow, lanes) and at #508 round 1
  (descent, story, cards) live on in git history and in NOTES.md.

  Every variant renders the SAME copy from the CONTENT object below, so the
  comparison is presentation only. The prompt changes the presentation, not
  the claims (docs/landing-page/positioning.md).

  Sound is off until you turn it on. Motion honors prefers-reduced-motion.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>curia#508 — living-organism experiment</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --accent: #7dd3a0;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --chrome: 1.75rem;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    padding-top: var(--chrome);
    font: 1rem/1.6 var(--sans);
    background: #08090c;
    color: #e6e8ec;
    overflow-x: hidden;
  }
  main { position: relative; z-index: 1; }
  img, canvas { max-width: 100%; }

  /* ================================================================
     PROTOTYPE CHROME — deliberately not part of any design below.
     ================================================================ */
  .skip {
    position: fixed; left: 0.5rem; top: calc(var(--chrome) + 0.5rem); z-index: 60;
    background: #ffd66b; color: #111; padding: 0.5rem 0.8rem; border-radius: 6px;
    font: 600 0.85rem var(--sans); text-decoration: none;
    transform: translateY(-250%);
  }
  .skip:focus { transform: none; }

  .protohead {
    position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--chrome);
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0 0.7rem;
    background: #ffd66b; color: #1a1206;
    font: 600 0.7rem/1 var(--mono);
    letter-spacing: 0.01em;
    white-space: nowrap; overflow: hidden;
  }
  .protohead b { font-weight: 700; }
  .protohead span { opacity: 0.72; overflow: hidden; text-overflow: ellipsis; }

  .switch {
    position: fixed; z-index: 50;
    left: 50%; transform: translateX(-50%);
    bottom: calc(0.75rem + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 0.25rem;
    padding: 0.3rem;
    background: #f2f4f7; color: #14171c;
    border-radius: 999px;
    box-shadow: 0 6px 28px #000000aa, 0 0 0 1px #ffffff30;
    font-family: var(--mono);
    max-width: calc(100vw - 1rem);
  }
  .switch button {
    border: 0; background: none; color: inherit; cursor: pointer;
    font-family: inherit; font-size: 0.8rem;
    border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .switch .arrow { width: 2rem; height: 2rem; font-size: 1rem; }
  .switch .arrow:hover { background: #00000012; }
  .switch .arrow:active { transform: scale(0.94); }
  .switch .label {
    padding: 0 0.55rem; min-width: 0;
    display: flex; flex-direction: column; align-items: center; line-height: 1.25;
  }
  .switch .label .k { font-size: 0.62rem; opacity: 0.55; letter-spacing: 0.06em; text-transform: uppercase; }
  .switch .label .n { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .switch .toggle {
    width: 2rem; height: 2rem; font-size: 0.9rem;
    background: #00000010;
  }
  .switch .toggle[aria-pressed="true"] { background: #14171c; color: #f2f4f7; }
  .switch .sep { width: 1px; height: 1.5rem; background: #00000018; flex: none; margin: 0 0.15rem; }
  .switch button:focus-visible, .protohead a:focus-visible { outline: 2px solid #2f6bff; outline-offset: 2px; }

  /* Every variant needs room to scroll past the floating bar. */
  main { padding-bottom: 5.5rem; }

  /* Decorative full-screen layers sit behind the content of a variant. */
  .layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    width: 100%; height: 100%;
  }

  /* ================================================================
     Shared guide document. Same words in every variant; each variant
     restyles it. The pitch above it is what the variants disagree on.
     ================================================================ */
  .guide .step { margin: 0 0 2rem; }
  .guide .step h3 { font-size: 1.02rem; margin: 0 0 0.5rem; font-weight: 600; }
  .guide .step h3 .num { font-family: var(--mono); opacity: 0.6; margin-right: 0.5rem; font-size: 0.9em; }
  .guide .step p { font-size: 0.95rem; }
  .guide pre { border-radius: 6px; padding: 0.8rem 0.9rem; overflow-x: auto; margin: 0.7rem 0; }
  .guide pre code { font-family: var(--mono); font-size: 0.8rem; }
  .guide .warn { color: #f0c987; }
  .guide .need { border-radius: 8px; padding: 1rem 1.15rem; font-size: 0.95rem; margin: 0 0 2.25rem; }
  .guide details.full { padding: 0.25rem 0; margin: 0.5rem 0 1.75rem; }
  .guide details.full > summary {
    cursor: pointer; padding: 1.1rem 0; font-family: var(--mono); font-size: 0.82rem;
    color: var(--accent); list-style: none;
  }
  .guide details.full > summary::-webkit-details-marker { display: none; }
  .guide details.full > summary::before { content: "+ "; }
  .guide details.full[open] > summary::before { content: "\2212 "; }
  .guide details.full .step h3 { font-size: 0.98rem; }
  .guide .tabletitle { font-size: 0.98rem; margin: 2.25rem 0 0.75rem; }
  .guide table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
  .guide td { padding: 0.6rem 0.6rem 0.6rem 0; vertical-align: top; }
  .guide td:first-child { width: 45%; }
  .guide td code { overflow-wrap: anywhere; font-family: var(--mono); font-size: 0.86em; }
  .guide .readmore { font-size: 0.9rem; }

  /* ================================================================
     THE VERTICAL RUN — the layout every variation shares.
     The gutter holds the spine and the ticket cards. A stage name sits
     on the same line as its node, so a card parked on the node reads
     its state straight off the label beside it. The gutter is wide
     enough for the left-aligned reader's card, so no phone cuts it off.
     ================================================================ */
  .v-run { --line: #ffffff1c; --dim: #949cab; color: #e9ecf1; }
  .v-run a { color: var(--accent); }
  .v-run .q-wrap { max-width: 52rem; margin: 0 auto; padding: 0 1.1rem 0 6.5rem; }
  .v-run .q-hero { padding: 3.5rem 0 3rem; }
  .v-run .q-mark { font-family: var(--mono); font-size: 0.8rem; color: var(--dim); }
  .v-run .q-mark b { color: var(--accent); font-weight: 600; }
  .v-run h1 {
    font-size: clamp(1.7rem, 8.2vw, 3.4rem); line-height: 1.06; letter-spacing: -0.035em;
    font-weight: 620; margin: 1.15rem 0 0; text-wrap: balance;
  }
  .v-run .q-lede { font-size: 1.06rem; color: #c1c8d3; margin: 1.15rem 0 0; max-width: 33rem; text-wrap: pretty; }
  .v-run .q-facts { font-family: var(--mono); font-size: 0.74rem; color: var(--dim); margin: 1.5rem 0 0; line-height: 2; }
  .v-run .q-links { margin: 1.75rem 0 0; display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .v-run .q-cta {
    text-decoration: none; font-weight: 600; font-size: 0.98rem;
    padding: 0.7rem 1.1rem; border-radius: 10px; background: var(--accent); color: #06231a;
    transition: transform 0.7s var(--ease);
  }
  .v-run .q-cta:active { transform: scale(0.98); }
  .v-run .q-cta.ghost { background: none; color: #e9ecf1; box-shadow: inset 0 0 0 1px var(--line); }

  .v-run h2 {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--dim); margin: 0 0 1.5rem;
  }
  .v-run .q-station { position: relative; padding: 0 0 2.5rem; }
  /* The stage name. It brightens when the run reaches it, and that is the
     state transition the reader is meant to see. */
  .v-run .q-tag {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim);
    margin: 0 0 0.75rem; padding: 0.15rem 0;
    display: flex; align-items: center; gap: 0.45rem;
    transition: color 0.6s var(--ease);
  }
  .v-run .q-tag .q-dot {
    width: 0.44rem; height: 0.44rem; border-radius: 999px; flex: none;
    opacity: 0.55; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
  }
  .v-run .q-tag.hot { color: #e2e9f1; }
  .v-run .q-tag.hot .q-dot { opacity: 1; transform: scale(1.35); }
  /* The color code, spelled out once, so no dot needs guessing. */
  .v-run .q-key {
    display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem;
    font-family: var(--mono); font-size: 0.68rem; color: var(--dim);
    margin: 0 0 1.9rem;
  }
  .v-run .q-keyitem { display: inline-flex; align-items: center; gap: 0.35rem; }
  .v-run .q-keyitem i { width: 0.44rem; height: 0.44rem; border-radius: 999px; }
  .v-run .q-card {
    border-radius: 14px; padding: 1.4rem 1.35rem;
    background: #ffffff07; box-shadow: inset 0 0 0 1px var(--line);
  }
  .v-run .q-card h3 { font-size: 1.28rem; margin: 0 0 0.55rem; letter-spacing: -0.02em; font-weight: 600; }
  .v-run .q-card p { color: #c1c8d3; margin: 0; text-wrap: pretty; }
  .v-run .q-card .under {
    font-family: var(--mono); font-size: 0.72rem; color: var(--dim); line-height: 1.9;
    margin-top: 0.95rem; padding-top: 0.85rem; border-top: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  .v-run .q-frames { display: grid; grid-template-columns: 1fr 1fr; gap: 1.15rem 0.85rem; }
  .v-run .q-box {
    width: 100%; padding: 0; aspect-ratio: 9 / 16; border-radius: 10px;
    background: #ffffff06; box-shadow: inset 0 0 0 1px var(--line);
    color: #666e7c; font-family: var(--mono); font-size: 0.68rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .v-run .q-box:active { transform: scale(0.985); }
  .v-run .q-cap { font-size: 0.79rem; color: var(--dim); margin-top: 0.45rem; line-height: 1.45; }
  .v-run .q-cap .n { color: var(--accent); font-family: var(--mono); }
  .v-run .q-note { color: var(--dim); font-size: 0.85rem; margin-top: 1.3rem; }
  .v-run .q-legend { color: var(--dim); font-size: 0.79rem; margin-top: 0.9rem; font-family: var(--mono); }
  .v-run .q-stats {
    font-family: var(--mono); font-size: 0.74rem; color: var(--dim); line-height: 1.95;
    margin-top: 1.15rem; padding-top: 1.05rem; border-top: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  .v-run .q-honest { border-radius: 14px; padding: 1.4rem 1.35rem; box-shadow: inset 0 0 0 1px var(--line); }
  .v-run .q-honest ul { margin: 0; padding-left: 1.1rem; }
  .v-run .q-honest li { margin: 0 0 0.7rem; color: #c1c8d3; }
  .v-run .q-honest li:last-child { margin: 0; }
  .v-run .q-honest li b { color: #e9ecf1; font-weight: 600; }
  .v-run section { padding: 3rem 0 0; }
  .v-run .guide pre { background: #ffffff08; box-shadow: inset 0 0 0 1px var(--line); }
  .v-run .guide pre code { color: #cfd5de; }
  .v-run .guide .step p { color: #c1c8d3; }
  .v-run .guide .need { box-shadow: inset 0 0 0 1px var(--line); color: #c1c8d3; }
  .v-run .guide details.full { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .v-run .guide details.full[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 1.75rem; }
  .v-run .guide td { border-top: 1px solid var(--line); color: #c1c8d3; }
  .v-run .guide .readmore { color: var(--dim); }
  .v-run footer { padding: 3rem 0 4rem; color: var(--dim); font-size: 0.85rem; }
  @media (min-width: 40rem) {
    .v-run .q-wrap { padding-left: 10rem; padding-right: 1.25rem; }
  }

  /* ================================================================
     Scroll reveal, used by the three experiment variants.
     ================================================================ */
  .rv { opacity: 0; transform: translateY(2.5rem); filter: blur(6px); }
  .rv.in {
    opacity: 1; transform: none; filter: none;
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease), filter 0.9s var(--ease);
  }

  /* ================================================================
     Lightbox — shared by every variant, same behavior as the live page.
     ================================================================ */
  .lightbox {
    position: fixed; inset: 0; background: #05060898;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; flex-direction: column; z-index: 55;
  }
  .lightbox[open] { display: flex; }
  .lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem; min-height: 0; }
  .lb-shot {
    background: #14171c; border: 1px dashed #262b33; border-radius: 8px;
    height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
    display: flex; align-items: center; justify-content: center;
    color: #4a515c; font-family: var(--mono); font-size: 0.8rem;
  }
  .lb-bar {
    display: flex; align-items: center; gap: 1rem; justify-content: space-between;
    padding: 0.9rem 1.25rem calc(1.6rem + env(safe-area-inset-bottom));
    color: #969ba5; font-size: 0.85rem;
  }
  .lb-cap { flex: 1; text-align: center; line-height: 1.4; }
  .lb-bar button {
    background: none; border: 1px solid #262b33; color: #e6e8ec;
    border-radius: 999px; width: 2.6rem; height: 2.6rem; font-size: 1.1rem; cursor: pointer; flex: none;
  }
  .lb-close {
    align-self: flex-end; background: none; border: 0; color: #969ba5;
    font-family: var(--mono); font-size: 0.85rem; cursor: pointer;
    padding: calc(1rem + var(--chrome)) 1.25rem 1rem;
  }
  .lb-count { font-family: var(--mono); font-size: 0.75rem; }

  /* Nothing moves for a reader who asked for no motion. */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rv { opacity: 1; transform: none; filter: none; }
    * { animation-duration: 0.001ms !important; }
  }
  body.nomotion .rv { opacity: 1; transform: none; filter: none; }
  body.nomotion .layer { display: none; }
</style>
</head>

<script>
(function () {
'use strict';

/* ==================================================================
   1. CONTENT
   One copy of every word, rendered by all four variants. The claims,
   the proof, the honesty block and the guide are the approved page
   text (docs/landing-page/positioning.md, docs/index.html). A variant
   may re-arrange these strings. It may not rewrite them.
   ================================================================== */

var CONTENT = {
  wordmark: 'curia',
  kicker: 'self-hosted agent dispatcher',
  headline: ['Many repos, one queue,', 'driven from a phone.'],
  lede: 'You already run coding agents every day. Curia reads what is takeable across every repo ' +
        'you watch, sends an agent at it, and brings every question, every preview and every ' +
        'approval to the device in your hand.',
  facts: [
    'Your box · your subscription · your keys',
    'GitHub issues in · merged pull requests out'
  ],
  cta: { label: 'Set it up', href: '#setup' },
  source: { label: 'Source', href: 'https://github.com/alp82/curia' },

  /* The four stages of the run. Every word already appears in the page copy. */
  stages: ['takeable', 'agent', 'gate', 'merged'],
  claimsHeading: 'What it gives you',
  claims: [
    {
      station: 'takeable',
      title: 'Your tracker is the queue',
      body: 'GitHub issues hold every ticket, every claim and every dependency edge. Curia reads ' +
            'what is takeable across every watched repo, in dependency order, and picks the model ' +
            'for each ticket from a label. There is no second app, and no board to keep in sync.',
      under: ['3 repos watched today · label decides the model · blocked and claimed tickets drop out']
    },
    {
      station: 'agent',
      title: 'Any device is a full seat',
      body: 'Nine verbs over Discord, one thread per ticket. Questions arrive with buttons. ' +
            'Results arrive as HTTPS links on your tailnet. You can attach to a live agent’s ' +
            'terminal from a phone and from a desktop at the same time, and neither one is the ' +
            'lesser seat.',
      under: [
        'tickets · next · start 42 · status · attach 42 · resume 42 · cancel 42 · map 109 · review 42',
        '~0.5 GB per agent measured · four at once on one small box'
      ]
    },
    {
      station: 'gate',
      title: 'An agent cannot finish by talking',
      body: 'Every ticket ends the same way: commit, pull request, live preview, your approval, ' +
            'merge. A rejection comes back in your own words and turns into new commits on the ' +
            'same pull request. A stop hook refuses an agent that tries to quit early.',
      under: ['resolved means merged · nothing lands without you']
    }
  ],


  proofHeading: 'One ticket, done',
  frames: [
    'The ticket goes out from a Discord thread.',
    'The agent asks. You answer in the thread.',
    'The preview link, open on the phone.',
    'The review gate. Approved.'
  ],
  shotnote: 'Four phone screenshots of one real ticket, on a repo that is not this one. Tap one to read it.',
  /* Names what the dots on the spine are. The queue variant alone shows it. */
  spineLegend: 'The numbers moving down the left are this page\u2019s own tickets.',
  railLegend: 'The numbers moving along the rail are this page\u2019s own tickets.',
  trail: {
    text: 'This page was planned, decided and written by curia agents. Each one ended at a review gate, and none of them merged itself. ',
    link: { label: 'Read the merged pull requests', href: 'https://github.com/alp82/curia/pulls?q=is%3Apr+is%3Amerged' }
  },
  stats: [
    'From GitHub, since the first commit on 21 Jul 2026 — 33 merged agent pull requests · 175 issues closed · 3 repos watched.',
    'From the daemon journal, since 1 Aug 2026 — 62 agents spawned · 88 questions asked · 31 review gates answered.',
    'Counted 5 Aug 2026.'
  ],

  honestHeading: 'What you are getting into',
  honest: [
    ['Curia is fifteen days old.', ' First commit 21 July 2026.'],
    ['One person runs it.', ' You would be the second.'],
    ['Setup is manual and takes an evening.', ' Node, tmux, Tailscale, a Discord bot, a harness, a GitHub repo. It gets simpler. There is no package yet.'],
    ['Tailscale and Discord are required.', ' There is no web UI.'],
    ['Agents use your own harness login.', ' An agent can do what you can do with it.']
  ],

  guideHeading: 'Set it up',
  need: 'a Linux box that stays on · Node 22 or newer · tmux · ttyd · a Tailscale account · a Discord server you control · Claude Code or Codex CLI, logged in · an evening.',

  steps5: [
    { t: 'Tailscale on the box and on your phone',
      body: [
        { p: 'Turn on HTTPS certificates for your tailnet, then let the daemon publish links without root.' },
        { code: 'tailscale set --operator=$USER' },
        { p: 'Every attach link and every preview link is a Tailscale link. Skip this and none of them work.' }
      ] },
    { t: 'Log in, as the user that runs the daemon',
      body: [
        { code: 'gh auth login && gh auth setup-git\nclaude' },
        { p: 'Agents use this harness login and this GitHub account. The account needs write access to every repo you watch.' }
      ] },
    { t: 'A Discord bot',
      body: [
        { html: 'Create an application, add a bot, copy the token. Turn on <b>message content intent</b> — without it your replies arrive empty and no question is ever answered. Invite the bot to your server with the <code>bot</code> and <code>applications.commands</code> scopes. It creates the <code>#curia</code> channel itself on first boot.' }
      ] },
    { t: 'The code, and two files',
      body: [
        { code: 'git clone https://github.com/alp82/curia.git\ncd curia/daemon && npm install' },
        { html: '<code>daemon/.env</code> takes the bot token, your Discord user id, and <code>TTYD_BIN</code>. <code>config/curia.yaml</code> takes the repos you watch and a <code>workspace_root</code> curia can own.' },
        { html: '<span class="warn">Both files ship pointing at another person’s home directory.</span> Change them, or attach is dead and worktrees land in the wrong place.' }
      ] },
    { t: 'Run it',
      body: [
        { code: 'npm start' },
        { html: 'A good boot logs <code>[bridge] ready</code>. Send a message in <code>#curia</code>: a thread opens and answers you. Then <code>tickets</code>, <code>start 42</code>, <code>status</code>, <code>attach 42</code>.' }
      ] }

function h(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 4) === 'data' || k === 'role' || k.slice(0, 5) === 'aria-') n.setAttribute(k, attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function frag(kids) {
  var f = document.createDocumentFragment();
  kids.forEach(function (c) { if (c) f.appendChild(c); });
  return f;
}
function words(s) { return s.split(/(\s+)/); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

/* ==================================================================
   3. MOTION AND SOUND
   Motion follows prefers-reduced-motion, and the bar can override it.
   Sound is OFF until the operator turns it on: the ticket requires it,
   and a browser needs the gesture anyway.
   ================================================================== */

var prefersStill = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var Motion = {
  on: !prefersStill,
  set: function (v) {
    Motion.on = v;
    document.body.classList.toggle('nomotion', !v);
  }
};

var Sound = {
  on: false, ctx: null, master: null, drone: null, droneFilter: null,
  enable: function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!Sound.ctx) {
      Sound.ctx = new AC();
      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = 0;
      Sound.master.connect(Sound.ctx.destination);
    }
    if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
    Sound.on = true;
    Sound.master.gain.cancelScheduledValues(Sound.ctx.currentTime);
    Sound.master.gain.linearRampToValueAtTime(0.5, Sound.ctx.currentTime + 0.6);
    return true;
  },
  disable: function () {
    Sound.on = false;
    if (Sound.ctx && Sound.master) {
      Sound.master.gain.cancelScheduledValues(Sound.ctx.currentTime);
      Sound.master.gain.linearRampToValueAtTime(0, Sound.ctx.currentTime + 0.35);
    }
  },
  /* One short synthesized note. No audio file, so the page stays self-contained. */
  tone: function (freq, dur, type, vol) {
    if (!Sound.on || !Sound.ctx) return;
    var t = Sound.ctx.currentTime;
    var o = Sound.ctx.createOscillator();
    var g = Sound.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.14 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.35));
    o.connect(g); g.connect(Sound.master);
    o.start(t); o.stop(t + (dur || 0.35) + 0.05);
  },
  /* A low bed the scroll position filters. Only the WebGL variant asks for it. */
  startDrone: function () {
    if (!Sound.ctx || Sound.drone) return;
    var o = Sound.ctx.createOscillator();
    var o2 = Sound.ctx.createOscillator();
    var f = Sound.ctx.createBiquadFilter();
    var g = Sound.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 55;
    o2.type = 'sine'; o2.frequency.value = 82.5;
    f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 6;
    g.gain.value = 0.07;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(Sound.master);
    o.start(); o2.start();
    Sound.drone = [o, o2]; Sound.droneFilter = f;
  },
  stopDrone: function () {
    if (!Sound.drone) return;
    Sound.drone.forEach(function (o) { try { o.stop(); } catch (e) {} });
    Sound.drone = null; Sound.droneFilter = null;
  },
  filterTo: function (hz) {
    if (Sound.droneFilter && Sound.ctx) {
      Sound.droneFilter.frequency.setTargetAtTime(hz, Sound.ctx.currentTime, 0.4);
    }
  }
};

/* ==================================================================
   4. REVEAL
   IntersectionObserver, never a scroll listener (B7 of the design skill).
   ================================================================== */

function makeRevealer() {
  var obs = null;
  if (window.IntersectionObserver) {
    obs = new window.IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
  }
  return {
    add: function (node, delay) {
      if (!Motion.on || !obs) { node.classList.add('in'); return node; }
      node.classList.add('rv');
      if (delay) node.style.transitionDelay = delay + 'ms';
      obs.observe(node);
      return node;
    },
    stop: function () { if (obs) obs.disconnect(); }
  };
}

/* ==================================================================
   6. LIGHTBOX — same behavior in all four variants.
   ================================================================== */

var LB = (function () {
  var lb = document.getElementById('lb');
  var shot = document.getElementById('lb-shot');
  var cap = document.getElementById('lb-cap');
  var count = document.getElementById('lb-count');
  var at = 0;
  function draw() {
    shot.textContent = 'frame ' + (at + 1);
    cap.textContent = CONTENT.frames[at];
    count.textContent = (at + 1) + ' / ' + CONTENT.frames.length;
  }
  function open(i) { at = i; draw(); lb.setAttribute('open', ''); document.body.style.overflow = 'hidden'; }
  function close() { lb.removeAttribute('open'); document.body.style.overflow = ''; }
  function step(d) { at = (at + d + CONTENT.frames.length) % CONTENT.frames.length; draw(); Sound.tone(560, 0.12, 'sine', 0.05); }
  lb.querySelectorAll('[data-lb-step]').forEach(function (b) {
    b.addEventListener('click', function () { step(Number(b.getAttribute('data-lb-step'))); });
  });
  lb.querySelector('[data-lb-close]').addEventListener('click', close);
  lb.addEventListener('click', function (e) {
    if (e.target === lb || e.target.className === 'lb-stage') close();
  });
  document.addEventListener('keydown', function (e) {
    if (!lb.hasAttribute('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  var x0 = null;
  lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
  return { open: open, close: close };
})();

function frameButton(cls, i) {
  var b = h('button', { class: cls, type: 'button', text: 'frame ' + (i + 1) });
  b.addEventListener('click', function () { LB.open(i); });

}

/* ==================================================================
   7. A SHARED POINTER
   One source of truth for cursor and touch, so a variant never needs
   its own listener set. Values are in 0..1 screen space.
   ================================================================== */

var Pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, active: 0, down: false };
(function () {
  function set(x, y) {
    Pointer.tx = x / window.innerWidth;
    Pointer.ty = y / window.innerHeight;
    Pointer.active = 1;
  }
  window.addEventListener('pointermove', function (e) { set(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('pointerdown', function (e) { set(e.clientX, e.clientY); Pointer.down = true; }, { passive: true });
  window.addEventListener('pointerup', function () { Pointer.down = false; }, { passive: true });
  window.addEventListener('pointerleave', function () { Pointer.active = 0; }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0]) set(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
})();
function pointerStep() {
  /* A spring, so the field lags the finger instead of snapping to it. */
  Pointer.x = lerp(Pointer.x, Pointer.tx, 0.08);
  Pointer.y = lerp(Pointer.y, Pointer.ty, 0.08);
}

function scrollProgress() {
  var max = document.documentElement.scrollHeight - window.innerHeight;
  return max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}

/* ==================================================================
   10. THE VERTICAL RUN
   The locked baseline (#363 round 4, #508 round 1): the vertical line
   carries the story, the reader's own ticket holds still as a big
   left-aligned card, and its state changes as each stage passes it.

   #508 round 1 verdict: bigger card in, but left-aligned instead of
   cut off at the left edge. The growth story was too weak, multiple
   repos had no visible evidence, and the map -> ticket hierarchy was
   missing. Round 2 rebuilds the set on the operator's order: the
   baseline plus five storytelling techniques, one per variation.

     base  — the baseline alone. No traffic.
     braid — three repo lines run in parallel from the first screen and
             join into the one queue just above the reader's ticket.
     tree  — the map card sits pinned at the top and every ticket is
             born from it. The hierarchy is the picture.
     acts  — the run grows in acts as the reader descends: one ticket,
             then more tickets, then a second repo line, then a third.
     stack — the queue is a visible pile at the top. It sends one
             ticket at a time down the line.
     trail — the line behind the reader's ticket keeps the color of
             every stage it has passed. The journey paints itself.

   Every variation shares the page, the four stages and real numbers.
   ================================================================== */

/* Real tickets from this map. A card that reaches merged is a ticket
   curia really did merge. The reader's own card is THIS ticket, and
   the map card is the real map both belong to. The words "map 109"
   already sit in the page copy, so the label adds no vocabulary. */
var SPINE_TICKETS = ['110', '111', '112', '113', '114', '115', '117', '137', '363'];
var MY_TICKET = '508';
var MAP_ID = 'map 109';

/* One color per state, so the state reads before the word does. Merged
   lands on the page's own accent, because merged is the good end. */
var STATE_COLOR = ['#8b9bb0', '#e0ae4c', '#79a6f2', '#7dd3a0'];
var STATE_RGB = ['139,155,176', '224,174,76', '121,166,242', '125,211,160'];

function startSpine(canvas, heads, mode, onStage) {
  var ctx = canvas.getContext('2d');
  if (!ctx) return null;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function size() {
    var w = canvas.clientWidth, hgt = canvas.clientHeight;
    if (W !== w || H !== hgt) {
      W = w; H = hgt;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(hgt * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  var narrow = function () { return window.innerWidth < 640; };
  var spineX = function () { return narrow() ? 20 : 52; };
  /* Repo lines sit this far from the queue, wide enough to read apart. */
  var laneGap = function () { return narrow() ? 13 : 22; };

  var nodes = heads.map(function (hd) {
    return { el: hd.el, stage: hd.stage, y: 0, ty: 0, vy: 0, on: 0, onT: 0, hit: 0, pulse: 0, hot: false };
  });
  var cards = [], spawnAt = 0, seq = 0, raf = 0, last = 0, clock = 0;
  var laneShown = (mode === 'braid') ? 3 : 1;
  /* The reader's ticket. It holds still and the page runs under it. */
  var solo = { id: MY_TICKET, at: 0, pop: 0 };
  /* The visible queue of the stack mode. Index 0 leaves first. */
  var pile = [];
  if (mode === 'stack') while (pile.length < 4) pile.push(SPINE_TICKETS[seq++]);
  function pileY(i) { return 84 + (3 - i) * 27; }

  function layout() {
    var vh = window.innerHeight;
    nodes.forEach(function (n) {
      var r = n.el.getBoundingClientRect();
      n.ty = r.top + r.height * 0.5;
      n.onT = (r.top < vh * 0.6 && r.bottom > 0) ? 1 : 0;
    });
  }

  function accent(a) { return 'rgba(125,211,160,' + a + ')'; }
  function state(i, a) { return 'rgba(' + STATE_RGB[Math.min(i, 3)] + ',' + a + ')'; }

  function roundRect(x, y, w, hgt, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + hgt - r); ctx.quadraticCurveTo(x + w, y + hgt, x + w - r, y + hgt);
    ctx.lineTo(x + r, y + hgt); ctx.quadraticCurveTo(x, y + hgt, x, y + hgt - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /* A companion ticket: a small chip whose dot sits on its line, with
     the box extending right so the left page edge never cuts it. */
  function drawChip(lx, y, id, st, a, swell) {
    var label = '#' + id;
    ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
    var tw = ctx.measureText(label).width;
    var w = 16 + tw + 9 + swell * 3;
    var hgt = 22 + swell * 2;
    var rx = lx - 8, ry = y - hgt / 2;

    roundRect(rx, ry, w, hgt, 6);
    ctx.fillStyle = 'rgba(10,13,17,' + (0.94 * a).toFixed(3) + ')';
    ctx.fill();
    ctx.strokeStyle = state(st, (0.7 + swell * 0.3) * a);
    ctx.lineWidth = 1;
    ctx.stroke();

    if (swell > 0.02) {
      ctx.beginPath(); ctx.arc(lx, y, w * 0.6 + swell * 8, 0, 6.2832);
      ctx.fillStyle = state(st, (0.10 * swell * a).toFixed(3));
      ctx.fill();
    }

    ctx.beginPath(); ctx.arc(lx, y, 3.4, 0, 6.2832);
    ctx.fillStyle = state(st, (0.95 * a).toFixed(3));
    ctx.fill();
    ctx.fillStyle = 'rgba(226,233,241,' + (0.92 * a).toFixed(3) + ')';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + 8, y + 0.5);
  }

  /* The reader's card, locked at #508 round 1: bigger than a chip,
     left-aligned so no phone cuts it off, and it names its stage in
     the stage color. The spine passes through its dot. */
  function drawMine(y, st, pop) {
    var sx = spineX();
    var label = '#' + solo.id;
    var word = CONTENT.stages[Math.min(st, 3)];
    ctx.font = '700 13px ui-monospace, SFMono-Regular, Menlo, monospace';
    var tw = ctx.measureText(label).width;
    ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
    var ww = ctx.measureText(word).width;
    var w = (sx - 5) + 10 + Math.max(tw, ww) + 12 + pop * 3;
    var hgt = 46 + pop * 3;
    var ry = y - hgt / 2;

    if (pop > 0.02) {
      ctx.beginPath(); ctx.arc(sx, y, 30 + pop * 12, 0, 6.2832);
      ctx.fillStyle = state(st, (0.12 * pop).toFixed(3));
      ctx.fill();
    }
    roundRect(5, ry, w, hgt, 9);
    ctx.fillStyle = 'rgba(10,13,17,0.95)';
    ctx.fill();
    ctx.strokeStyle = state(st, (0.9 + pop * 0.1).toFixed(3));
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath(); ctx.arc(sx, y, 5, 0, 6.2832);
    ctx.fillStyle = state(st, 0.95);
    ctx.fill();

    var tx = sx + 10;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 13px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = 'rgba(226,233,241,0.96)';
    ctx.fillText(label, tx, y - 9);
    ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = state(st, 0.95);
    ctx.fillText(word, tx, y + 10);
  }

  /* The map card of the tree mode: pinned at the top, on the line,
     so every ticket visibly comes out of the map. */
  function drawMapCard() {
    var sx = spineX();
    var y = 56;
    ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, monospace';
    var tw = ctx.measureText(MAP_ID).width;
    var w = (sx - 5) + 10 + tw + 12;
    roundRect(5, y - 15, w, 30, 8);
    ctx.fillStyle = 'rgba(10,13,17,0.95)';
    ctx.fill();
    ctx.strokeStyle = accent(0.75);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, y, 4, 0, 6.2832);
    ctx.fillStyle = accent(0.9);
    ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(226,233,241,0.95)';
    ctx.fillText(MAP_ID, sx + 10, y + 0.5);
  }

  /* The pile of the stack mode: the queue, visible, waiting its turn.
     The chip nearest the run leaves next, so the queue reads downward. */
  function drawPile() {
    for (var i = pile.length - 1; i >= 0; i--) {
      drawChip(spineX(), pileY(i), pile[i], 0, 0.9 - i * 0.12, 0);
    }
  }

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    if (document.hidden) return;
    var dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts; clock += dt;
    size(); layout(); pointerStep();
    ctx.clearRect(0, 0, W, H);

    var sx = spineX(), vh = window.innerHeight;
    var breath = 0.5 + 0.5 * Math.sin(clock * 0.7);
    /* Only the transient answers to depth. The steady green does not,
       which is what round 2 lost and round 3 keeps. */
    var flashScale = clamp(1 - window.scrollY / (vh * 1.6), 0.34, 1);

    /* The reader's card and the join point both hold still on screen. */
    var cy = H * 0.46;
    var conv = cy - 64;

    /* How far down the run the reader has come. It drives the growth. */
    var phase = 0;
    for (var k = 0; k < nodes.length; k++) if (nodes[k].y <= vh * 0.55) phase = k + 1;
    var laneWant = (mode === 'braid') ? 3
      : (mode === 'acts') ? (phase >= 3 ? 3 : phase >= 2 ? 2 : 1)
      : 1;
    laneShown = lerp(laneShown, laneWant, 0.05);

    /* The stages the reader's ticket has passed. */
    var reached = 0;
    for (var m = 0; m < nodes.length; m++) if (nodes[m].y <= cy + 2) reached = m + 1;
    if (reached !== solo.at) {
      if (reached > solo.at) {
        nodes[Math.min(reached - 1, nodes.length - 1)].pulse = 1;
        solo.pop = 1;
        if (onStage) onStage(reached - 1);
      }
      solo.at = reached;
    }
    solo.pop *= 0.9;

    /* Ambience: a column of light on the spine that never leaves. */
    var grad = ctx.createLinearGradient(sx - 30, 0, sx + 30, 0);
    grad.addColorStop(0, accent(0));
    grad.addColorStop(0.5, accent((0.055 + 0.02 * breath).toFixed(3)));
    grad.addColorStop(1, accent(0));
    ctx.fillStyle = grad;
    ctx.fillRect(sx - 30, 0, 60, H);

    ctx.strokeStyle = accent((0.20 + 0.08 * breath).toFixed(3));
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();

    /* Repo lines. They join the queue just above the reader's card, so
       the join stays on screen wherever the reader is. */
    if (laneShown > 1.02) {
      for (var li = 1; li < 3; li++) {
        var open = clamp(laneShown - li, 0, 1);
        if (open <= 0.01) continue;
        var lx = sx + (li === 1 ? -1 : 1) * laneGap() * open;
        ctx.strokeStyle = accent((0.16 * open + 0.05 * breath * open).toFixed(3));
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, conv - 44);
        ctx.quadraticCurveTo(lx, conv, sx, conv);
        ctx.stroke();
      }
    }

    /* The trail mode paints the line with the story so far: each span
       the ticket has crossed keeps the color of the stage it ended at. */
    if (mode === 'trail') {
      ctx.lineWidth = 3;
      for (var t2 = 0; t2 < reached; t2++) {
        var top2 = t2 === 0 ? -20 : nodes[t2 - 1].y;
        ctx.strokeStyle = state(t2, 0.8);
        ctx.beginPath(); ctx.moveTo(sx, top2); ctx.lineTo(sx, nodes[t2].y); ctx.stroke();
      }
      if (reached > 0) {
        ctx.strokeStyle = state(Math.min(reached, 3), 0.8);
        ctx.beginPath(); ctx.moveTo(sx, nodes[reached - 1].y); ctx.lineTo(sx, cy - 28); ctx.stroke();
      }
      ctx.lineWidth = 1;
    }

    nodes.forEach(function (n) {
      var stiff = 120, damp = 18;
      n.vy += ((n.ty - n.y) * stiff - n.vy * damp) * dt;
      n.y += n.vy * dt;
      n.on = lerp(n.on, n.onT, 0.07);
      n.pulse *= 0.94;
      n.hit = lerp(n.hit, n.pulse, 0.22);

      var hot = n.on > 0.5 || n.hit > 0.12;
      if (hot !== n.hot) { n.hot = hot; n.el.classList.toggle('hot', hot); }

      var si = Math.min(n.stage, 3);
      var glow = 0.11 + n.on * 0.10 + n.hit * 0.12 * flashScale;
      ctx.beginPath(); ctx.arc(sx, n.y, 11 + n.on * 2 + n.hit * 8, 0, 6.2832);
      ctx.fillStyle = state(si, glow.toFixed(3));
      ctx.fill();
      ctx.beginPath(); ctx.arc(sx, n.y, 4 + n.on * 1.2 + n.hit * 1.8, 0, 6.2832);
      ctx.fillStyle = state(si, (0.55 + n.on * 0.4).toFixed(3));
      ctx.fill();
    });

    if (mode === 'tree') drawMapCard();
    if (mode === 'stack') drawPile();

    /* Traffic. Each mode tells its story with a different flow: the
       braid runs three lines from the start, the tree births tickets
       from the map card, the acts thicken with depth, the stack drains
       its visible pile, and the trail stays sparse so the paint reads. */
    var gap = (mode === 'braid') ? 1700
      : (mode === 'tree') ? 1900
      : (mode === 'acts') ? (phase >= 1 ? Math.max(1200, 3800 - phase * 800) : 0)
      : (mode === 'stack') ? 2600
      : (mode === 'trail') ? 4800
      : 0;
    if (Motion.on && gap && ts > spawnAt) {
      spawnAt = ts + gap + Math.random() * gap * 0.5;
      var lane = (mode === 'braid') ? (1 + seq) % 3
        : (mode === 'acts') ? seq % clamp(Math.round(laneShown), 1, 3)
        : 0;
      var startY = (mode === 'tree') ? 76 : (mode === 'stack') ? pileY(0) : -26;
      var id = SPINE_TICKETS[seq % SPINE_TICKETS.length];
      if (mode === 'stack' && pile.length) {
        id = pile.shift();
        pile.push(SPINE_TICKETS[seq % SPINE_TICKETS.length]);
      }
      seq++;
      cards.push({
        id: id, y: startY, v: 150 + Math.random() * 60,
        hold: 0, at: 0, fade: 1, lane: lane,
        pop: (mode === 'tree' || mode === 'stack') ? 1 : 0
      });
    }
    for (var i = cards.length - 1; i >= 0; i--) {
      var c = cards[i];
      if (c.hold > 0) c.hold -= dt;
      else {
        c.y += c.v * dt;
        for (var j = 0; j < nodes.length; j++) {
          if (j < c.at || nodes[j].y <= 0) continue;
          if (c.lane > 0 && c.y < conv - 10) break;
          if (Math.abs(c.y - nodes[j].y) < 9) {
            c.at = j + 1; c.hold = 0.9; c.pop = 1;
            nodes[j].pulse = 1;
            if (onStage) onStage(j);
            break;
          }
        }
      }
      c.pop *= 0.9;
      if (c.at >= nodes.length && c.hold <= 0) c.fade -= dt * 1.1;
      if (c.fade <= 0 || c.y > H + 44) { cards.splice(i, 1); continue; }

      var cx = sx;
      if (c.lane > 0) {
        var t = clamp((conv - c.y) / 90, 0, 1);
        cx = sx + (c.lane === 1 ? -1 : 1) * laneGap() * t * clamp(laneShown - c.lane, 0, 1);
      }
      drawChip(cx, c.y, c.id, c.at, c.fade, c.pop);
    }
    if (cards.length > 16) cards.splice(0, cards.length - 16);

    /* The reader's own ticket, drawn last so nothing covers it. */
    drawMine(cy, solo.at, solo.pop);
  }

  size(); layout();
  nodes.forEach(function (n) { n.y = n.ty; n.on = n.onT; });
  if (Motion.on) raf = requestAnimationFrame(frame);
  else { requestAnimationFrame(function (ts) { frame(ts); cancelAnimationFrame(raf); }); }

  return {
    destroy: function () {
      cancelAnimationFrame(raf);
      nodes.forEach(function (n) { n.el.classList.remove('hot'); });
    }
  };
}

/* One page builder for every variation. Only the spine mode differs. */
function makeRun(mode) {
  return function (root) {
    root.className = 'v-run';
    var canvas = h('canvas', { class: 'layer', 'aria-hidden': 'true' });
    document.body.insertBefore(canvas, document.getElementById('main'));

    var rv = makeRevealer();
    function wrap(kids) { return h('div', { class: 'q-wrap' }, kids); }

    var head = h('section', { class: 'q-hero' }, [wrap([
      rv.add(h('div', { class: 'q-mark' }, [
        h('b', { text: CONTENT.wordmark }), document.createTextNode(' — ' + CONTENT.kicker)
      ])),
      rv.add(h('h1', { html: CONTENT.headline[0] + ' ' + CONTENT.headline[1] }), 60),
      rv.add(h('p', { class: 'q-lede', text: CONTENT.lede }), 120),
      rv.add(h('div', { class: 'q-facts', html: CONTENT.facts[0] + '<br>' + CONTENT.facts[1] }), 180),
      rv.add(h('div', { class: 'q-links' }, [
        h('a', { class: 'q-cta', href: CONTENT.cta.href, text: CONTENT.cta.label }),
        h('a', { class: 'q-cta ghost', href: CONTENT.source.href, text: CONTENT.source.label })
      ]), 240)
    ])]);

    /* The color code, spelled out once. Intuitive understanding is the goal,
       so the reader never has to guess what a colored dot means. */
    var key = h('div', { class: 'q-key' });
    CONTENT.stages.forEach(function (name, i) {
      key.appendChild(h('span', { class: 'q-keyitem' }, [
        h('i', { style: 'background:' + STATE_COLOR[i] }),
        document.createTextNode(name)
      ]));
    });

    var headEls = [];
    function stage(name, kids) {
      var hd = h('p', { class: 'q-tag' }, [
        h('i', { class: 'q-dot', style: 'background:' + STATE_COLOR[headEls.length] }),
        document.createTextNode(name)
      ]);
      headEls.push(hd);
      return h('div', { class: 'q-station' }, [hd].concat(kids));
    }

    var stations = CONTENT.claims.map(function (c, i) {
      return stage(c.station, [rv.add(h('div', { class: 'q-card' }, [
        h('h3', { text: c.title }),
        h('p', { text: c.body }),
        h('div', { class: 'under', html: c.under.join('<br>') })
      ]), i * 60)]);
    });
    var s1 = h('section', {}, [wrap(
      [rv.add(h('h2', { text: CONTENT.claimsHeading })), rv.add(key, 40)].concat(stations)
    )]);

    var frames = h('div', { class: 'q-frames' });
    CONTENT.frames.forEach(function (cap, i) {
      frames.appendChild(h('figure', { style: 'margin:0' }, [
        frameButton('q-box', i),
        h('figcaption', { class: 'q-cap' }, [
          h('span', { class: 'n', text: String(i + 1) }), document.createTextNode(' ' + cap)
        ])
      ]));
    });
    var proof = stage('merged', [
      rv.add(frames),
      rv.add(h('p', { class: 'q-note', text: CONTENT.shotnote }), 80),
      rv.add(trailNode('q-note'), 120),
      rv.add(h('p', { class: 'q-legend', text: CONTENT.spineLegend }), 140),
      rv.add(statsNode('q-stats'), 180)
    ]);
    var s2 = h('section', {}, [wrap([rv.add(h('h2', { text: CONTENT.proofHeading })), proof])]);

    /* The run ends at merged. What follows is the cost and the setup, so
       those sections carry no stage and the spine runs on as a plain line. */
    var s3 = h('section', {}, [wrap([
      rv.add(h('h2', { text: CONTENT.honestHeading })), rv.add(honestList('q-honest'), 60)
    ])]);
    var s4 = h('section', { id: 'setup' }, [wrap([
      rv.add(h('h2', { text: CONTENT.guideHeading })), rv.add(guideNode(), 60)
    ])]);
    var foot = h('footer', {}, [h('div', { class: 'q-wrap', html: CONTENT.footer })]);

    root.appendChild(frag([head, s1, s2, s3, s4, foot]));

    var heads = headEls.map(function (el, i) { return { el: el, stage: i }; });
    var notes = [220, 277.18, 329.63, 392];
    var spine = startSpine(canvas, heads, mode, function (i) {
      Sound.tone(notes[clamp(i, 0, 3) % notes.length], 0.55, 'triangle', 0.06);
    });

    return {
      destroy: function () {
        if (spine) spine.destroy();
        rv.stop();
        canvas.remove();
      }
    };
  };
}

/* ==================================================================
   12. THE SWITCHER
   ?variant= keeps a choice shareable and reload stable, which is how
   the operator sends back "the header from B with the spine from C".
   ================================================================== */

/* base is the locked baseline. The five others each explore one
   storytelling technique on top of it (#508 round 2). The cut variants
   live on in git history and in NOTES.md. */
var VARIANTS = [
  { key: 'base', name: 'You move the ticket', note: 'the locked baseline', mount: makeRun('base') },
  { key: 'braid', name: 'Three lines, one queue', note: '#508 candidate', mount: makeRun('braid') },
  { key: 'tree', name: 'The map births tickets', note: '#508 candidate', mount: makeRun('tree') },
  { key: 'acts', name: 'The run grows in acts', note: '#508 candidate', mount: makeRun('acts') },
  { key: 'stack', name: 'The queue drains', note: '#508 candidate', mount: makeRun('stack') },
  { key: 'trail', name: 'The line remembers', note: '#508 candidate', mount: makeRun('trail') }
];

var main = document.getElementById('main');
var swK = document.getElementById('sw-k');
var swN = document.getElementById('sw-n');
var current = null, at = 0;

function indexFromUrl() {
  var m = /[?&]variant=([^&]+)/.exec(location.search);
  var key = m ? decodeURIComponent(m[1]) : 'base';
  for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].key === key) return i;
  return 0;
}

/* A reveal that never fires leaves the page blank, and nobody working this
   ticket has a browser to catch that. Two nets, and neither one cancels the
   scroll reveal for a reader whose browser is behaving. */
function reveal(nodes) {
  nodes.forEach(function (n) {
    n.style.transitionDelay = '0ms';
    n.classList.add('in');
    n.classList.add('lit');
  });
}
function revealEverything() {
  reveal([].slice.call(document.querySelectorAll('.rv')));
}
/* Net 1: any uncaught error shows the whole page at once. */
window.addEventListener('error', revealEverything);
/* Net 2: anything still hidden two seconds after mount, while it sits on
   screen, was missed rather than not reached yet. */
function revealStuck() {
  var vh = window.innerHeight;
  reveal([].slice.call(document.querySelectorAll('.rv:not(.in)')).filter(function (n) {
    var r = n.getBoundingClientRect();
    return r.top < vh && r.bottom > 0;
  }));
}
var failsafe = 0;

function show(i, push) {
  clearTimeout(failsafe);
  if (current && current.destroy) {
    try { current.destroy(); } catch (e) {}
  }
  main.innerHTML = '';
  at = (i + VARIANTS.length) % VARIANTS.length;
  var v = VARIANTS[at];
  document.body.setAttribute('data-variant', v.key);
  swK.textContent = (at + 1) + ' / ' + VARIANTS.length + ' · ' + v.note;
  swN.textContent = v.name;
  window.scrollTo(0, 0);
  try {
    current = v.mount(main) || {};
  } catch (e) {
    current = {};
    revealEverything();
    throw e;
  }
  failsafe = setTimeout(revealStuck, 2000);
  if (push !== false) {
    try { history.replaceState(null, '', '?variant=' + v.key); } catch (e) {}
  }
}

document.querySelectorAll('.switch [data-step]').forEach(function (b) {
  b.addEventListener('click', function () { show(at + Number(b.getAttribute('data-step'))); });
});

document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (document.getElementById('lb').hasAttribute('open')) return;
  if (e.key === 'ArrowRight') show(at + 1);
  if (e.key === 'ArrowLeft') show(at - 1);
});

var soundBtn = document.getElementById('sw-sound');
soundBtn.addEventListener('click', function () {
  if (Sound.on) {
    Sound.disable();
    soundBtn.setAttribute('aria-pressed', 'false');
    soundBtn.setAttribute('aria-label', 'Sound, off');
    if (current && current.onSound) current.onSound(false);
  } else {
    if (!Sound.enable()) return;
    soundBtn.setAttribute('aria-pressed', 'true');
    soundBtn.setAttribute('aria-label', 'Sound, on');
    if (current && current.onSound) current.onSound(true);
    Sound.tone(523.25, 0.3, 'sine', 0.08);
  }
});

var motionBtn = document.getElementById('sw-motion');
motionBtn.setAttribute('aria-pressed', String(Motion.on));
motionBtn.setAttribute('aria-label', Motion.on ? 'Motion, on' : 'Motion, off');
Motion.set(Motion.on);
motionBtn.addEventListener('click', function () {
  Motion.set(!Motion.on);
  motionBtn.setAttribute('aria-pressed', String(Motion.on));
  motionBtn.setAttribute('aria-label', Motion.on ? 'Motion, on' : 'Motion, off');
  show(at, false);
});

show(indexFromUrl(), false);

})();
</script>
