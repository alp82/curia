<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps full-rail interaction prototype</title>
<!--
  THROWAWAY PROTOTYPE.
  Three variants of whole-map selection and a complete detail rail, switchable with ?variant=.
  Static mock data. No link or action mutates real state.
-->
<style>
* { box-sizing:border-box; }
:root {
  --bg:#090b0f; --panel:#11151b; --panel2:#151a22; --line:#242a34;
  --ink:#e8ebf0; --muted:#8892a3; --cyan:#5ec8e5; --green:#43d594;
  --walk:#34404a; --blocked:#501d24; --fog:#8992a3; --red:#ef596f;
}
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
body { font:14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
button, input { font:inherit; }
button { color:inherit; }
.shell { min-height:100vh; display:grid; grid-template-columns:218px minmax(0, 1fr); }
.side { border-right:1px solid var(--line); padding:22px 10px; }
.brand { margin:0 8px 28px; color:#a8b2c2; font:11px ui-monospace, monospace; letter-spacing:.16em; }
.side a { display:block; padding:11px 9px; border-radius:7px; color:#909aaa; text-decoration:none;
  font:600 12px ui-monospace, monospace; letter-spacing:.06em; }
.side a.on { color:var(--cyan); background:var(--panel2); }
.main { min-width:0; padding:18px 22px 100px; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:17px; }
.top h1 { margin:0; font-size:15px; }
.search { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:7px 12px; font-size:11px; }
.fresh { display:flex; justify-content:space-between; align-items:center; gap:20px; border:1px solid var(--line);
  background:var(--panel); border-radius:8px; padding:9px 12px; color:var(--muted); font:12px ui-monospace, monospace; }
.live { display:flex; align-items:center; gap:9px; }
.live::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
.filters { display:flex; align-items:center; gap:8px; margin:14px 0 34px; }
.filter { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:11px; }
.filter.on { color:var(--cyan); border-color:var(--cyan); background:transparent; }
.computed { color:var(--muted); font-size:11px; margin-left:2px; }
.view { display:none; }
.view.active { display:block; }

/* Every map card is the selection target. */
.map-card { width:100%; text-align:left; appearance:none; border:1px solid transparent; background:transparent;
  padding:14px 10px 16px; border-radius:10px; cursor:pointer; transition:background .12s, border-color .12s; }
.map-card + .map-card { margin-top:13px; }
.map-card:hover { background:var(--panel); }
.map-card.selected { background:var(--panel); border-color:#394353; box-shadow:inset 3px 0 var(--cyan); }
.map-head { display:grid; grid-template-columns:58px minmax(0,1fr); gap:16px; align-items:start; }
.fraction { font:700 24px/1 ui-monospace, monospace; }
.fraction .of, .fraction .fog-n { color:var(--muted); font-weight:400; }
.fraction .fog-n { font-size:13px; }
.map-title { min-width:0; }
.map-title strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meta { margin-top:4px; color:var(--muted); font:10px ui-monospace, monospace; }
.meta .issue { color:var(--cyan); }

/* One grid track equals one item. No minimum segment width, flex basis, or corrective padding. */
.band { display:grid; height:44px; gap:0; margin-top:12px; }
.segment { position:relative; min-width:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
  border-radius:5px; font:700 11px ui-monospace, monospace; }
.segment + .segment { border-left:3px solid var(--bg); }
.segment small { margin-left:6px; font-size:9px; font-weight:400; white-space:nowrap; }
.segment > * { position:relative; z-index:1; }
.walk { color:#a9cabc; background:#29463b; box-shadow:inset 0 0 0 1px rgba(119,177,151,.16); }
.flight { color:#a9ddf3; background:#142b38; box-shadow:inset 0 0 0 1px rgba(83,166,202,.4); }
.flight::before { content:""; position:absolute; inset:0; transform:translateX(-110%);
  background:linear-gradient(100deg,transparent 25%,rgba(128,215,248,.28) 48%,transparent 72%);
  animation:working 3.1s ease-in-out infinite; }
.flight.needs::after { content:"!"; position:absolute; right:5px; top:4px; z-index:2; display:grid;
  place-items:center; width:13px; height:13px; border-radius:50%; background:#ffd166; color:#251b00; font-size:9px; }
.take { color:#9fe6f7; background:#10252d; box-shadow:inset 0 0 0 2px rgba(94,200,229,.72), 0 0 14px rgba(94,200,229,.08); }
.blocked { color:#bd7b86; background-color:#180f12;
  background-image:repeating-linear-gradient(0deg,transparent 0 8px,rgba(204,74,94,.25) 8px 10px); }
.fog { color:#8e97a3; background:repeating-linear-gradient(45deg,#2b3037 0 8px,#20242a 8px 16px); }
.zeroes { display:flex; gap:12px; min-height:17px; margin-top:4px; color:var(--muted); font:9px ui-monospace, monospace; }
@keyframes working { 0%,22% { transform:translateX(-110%); } 72%,100% { transform:translateX(110%); } }

.split { display:grid; grid-template-columns:minmax(500px, 1.15fr) minmax(400px, .9fr); gap:42px; align-items:start; }
.detail { min-width:0; }
.detail.sticky { position:sticky; top:18px; }
.detail-head { margin-bottom:16px; }
.detail-kicker { color:var(--muted); font:700 10px ui-monospace, monospace; text-transform:uppercase; letter-spacing:.17em; }
.detail-head h2 { margin:6px 0 0; font-size:17px; line-height:1.3; }

/* Full rail: all five stages always render from the first stage through fog. */
.full-rail { position:relative; padding-left:29px; }
.full-rail::before { content:""; position:absolute; left:7px; top:12px; bottom:12px; width:2px; background:var(--line); }
.stage-row { position:relative; padding:0 0 22px 18px; }
.stage-row:last-child { padding-bottom:0; }
.stage-dot { position:absolute; left:-27px; top:5px; width:13px; height:13px; border-radius:50%; background:var(--bg); border:3px solid var(--stage); z-index:1; }
.stage-title { display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:7px; }
.stage-title b { color:var(--stage); font:700 11px ui-monospace, monospace; text-transform:uppercase; letter-spacing:.12em; }
.stage-title span { color:var(--muted); font:11px ui-monospace, monospace; }
.stage-summary { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.stage-title .activity { display:inline-flex; align-items:center; gap:6px; color:#65b8db; }
.stage-title .activity::before { content:""; width:6px; height:6px; border-radius:50%; background:#65b8db;
  box-shadow:0 0 0 0 rgba(101,184,219,.4); animation:online 2s ease-out infinite; }
.needs-badge { border:1px solid #69551f; border-radius:999px; background:#2b240f; color:#ffd166;
  padding:2px 7px; font:700 9px ui-monospace, monospace; text-transform:uppercase; }
.ticket { display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:8px; padding:8px 0; border-bottom:1px solid #191e26; }
.ticket-id { color:var(--cyan); font:11px ui-monospace, monospace; }
.ticket-title { min-width:0; font-size:12px; }
.ticket-state { color:var(--muted); font-size:10px; white-space:nowrap; }
.empty { padding:8px 0 0; color:#5f6979; font-size:11px; font-style:italic; }
.stage-walk { opacity:.72; }
.stage-take { margin:2px 0 22px; padding:13px 14px 15px 18px; border:1px solid rgba(94,200,229,.34);
  border-radius:8px; background:rgba(31,104,123,.09); box-shadow:0 0 24px rgba(94,200,229,.04); }
.stage-take .stage-dot { left:-27px; }
.stage-take .ticket { border-color:rgba(94,200,229,.14); }
.stage-take .ticket-title { color:#f4fbfd; font-weight:650; }
.frontier-ticket { min-height:76px; align-items:center; padding:12px 0; }
.frontier-copy { min-width:0; }
.frontier-copy .ticket-title { display:block; }
.frontier-meta { display:block; margin-top:7px; color:#7aa4b0; font:10px ui-monospace, monospace; }
.start-button { align-self:stretch; min-width:68px; border:1px solid rgba(94,200,229,.62); border-radius:6px;
  background:#173844; color:#b9effb; cursor:pointer; font:700 11px ui-monospace, monospace; }
.start-button:hover { background:#205061; border-color:var(--cyan); }
.start-button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
.stage-blocked .stage-title b, .stage-blocked .ticket-id { color:var(--red); }
.stage-blocked .ticket { opacity:.74; }
.stage-fog { opacity:.66; }
.stage-flight .ticket { position:relative; overflow:hidden; border-left:2px solid #65b8db; padding-left:9px; }
@keyframes online { 70%,100% { box-shadow:0 0 0 6px rgba(101,184,219,0); } }

/* Variant B expands the selected map in the list. */
.inline-list { max-width:1160px; }
.inline-card { border:1px solid transparent; border-radius:10px; overflow:hidden; }
.inline-card + .inline-card { margin-top:12px; }
.inline-card.selected { border-color:#394353; background:var(--panel); }
.inline-card .map-card.selected { box-shadow:none; border:0; border-radius:0; }
.inline-detail { border-top:1px solid var(--line); padding:22px 26px 28px 95px; }
.inline-detail .full-rail { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:18px; padding:0; }
.inline-detail .full-rail::before { left:6px; right:6px; top:7px; bottom:auto; width:auto; height:2px; }
.inline-detail .stage-row { padding:27px 0 0; }
.inline-detail .stage-dot { left:0; top:1px; }
.inline-detail .stage-title { display:block; min-height:53px; }
.inline-detail .stage-title span { display:block; margin-top:4px; }
.inline-detail .ticket { display:block; padding:9px 0; }
.inline-detail .ticket-id { display:block; margin-bottom:3px; }
.inline-detail .ticket-state { display:block; margin-top:3px; }
.inline-detail .frontier-ticket { display:grid; }

/* Variant C combines A's persistent selection list with C's focused map view. */
.focus-layout { display:grid; grid-template-columns:370px minmax(0,1fr); gap:42px; align-items:start; }
.map-index { position:sticky; top:18px; border-right:1px solid var(--line); padding-right:20px; }
.index-card { width:100%; text-align:left; border:1px solid transparent; border-radius:9px; background:transparent;
  padding:15px 13px 13px; cursor:pointer; transition:background .12s, border-color .12s; }
.index-card + .index-card { margin-top:8px; }
.index-card:hover { background:var(--panel); }
.index-card.selected { background:var(--panel2); border-color:#394353; box-shadow:inset 3px 0 var(--cyan); }
.index-card strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.index-meta { display:block; margin-top:4px; color:var(--muted); font:10px ui-monospace, monospace; }
.index-card .band { height:25px; margin-top:11px; }
.index-card .segment { border-radius:3px; font-size:9px; }
.index-card .segment small, .index-card .zeroes { display:none; }
.focus-detail .band { margin:18px 0 30px; height:56px; }
.focus-detail .full-rail { max-width:850px; }
.focus-detail .stage-row { padding-bottom:28px; }

.switcher { position:fixed; z-index:50; left:50%; bottom:18px; transform:translateX(-50%); display:flex;
  align-items:center; gap:5px; padding:6px; border:1px solid #3a4350; border-radius:999px;
  background:#e9edf3; color:#15191f; box-shadow:0 8px 34px rgba(0,0,0,.55); }
.switcher button { width:42px; height:38px; border:0; border-radius:999px; background:transparent; cursor:pointer; }
.switcher button:hover { background:#d4dae3; }
.switcher output { min-width:210px; text-align:center; font:700 12px ui-monospace, monospace; }

@media (max-width:900px) {
  .shell { grid-template-columns:1fr; }
  .side { display:none; }
  .main { padding:16px 12px 100px; }
  .fresh span:last-child { display:none; }
  .split, .focus-layout { display:block; }
  .split .detail { margin-top:28px; }
  .map-index { display:flex; overflow:auto; border-right:0; border-bottom:1px solid var(--line); padding:0 0 12px; margin-bottom:24px; }
  .index-card { min-width:210px; border:1px solid var(--line); }
  .inline-detail { padding:20px; }
  .inline-detail .full-rail { display:block; padding-left:29px; }
  .inline-detail .full-rail::before { left:7px; right:auto; top:12px; bottom:12px; width:2px; height:auto; }
  .inline-detail .stage-row { padding:0 0 22px 18px; }
  .inline-detail .stage-dot { left:-27px; top:5px; }
  .inline-detail .stage-title { display:flex; min-height:0; }
  .inline-detail .stage-title span { display:inline; margin:0; }
  .inline-detail .ticket { display:grid; }
  .inline-detail .ticket-id, .inline-detail .ticket-state { display:block; margin:0; }
  .segment small { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  .flight::before, .stage-title .activity::before { animation:none; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Primary">
    <div class="brand">curia · atlas</div>
    <a href="#">Home</a><a class="on" href="#">Maps</a><a href="#">Agents</a><a href="#">Feed</a>
    <a href="#">Chat</a><a href="#">Credentials</a><a href="#">Settings</a>
  </nav>
  <main class="main">
    <header class="top"><h1>Atlas · Maps</h1><button class="search">⌕ Search</button></header>
    <div class="fresh"><span class="live">read 0s ago</span><span>refreshing every 5s while this tab is visible</span></div>
    <div class="filters"><button class="filter on">all projects</button><button class="filter">landing-page</button>
      <button class="filter">aistack</button><span class="computed">computed 44s ago</span></div>
    <section class="view" data-variant="A"></section>
    <section class="view" data-variant="B"></section>
    <section class="view" data-variant="C"></section>
  </main>
</div>
<nav class="switcher" aria-label="Prototype variants">
  <button id="previous" aria-label="Previous variant">←</button><output id="variant-name"></output>
  <button id="next" aria-label="Next variant">→</button>
</nav>
<script>
const MAPS = [
  { id:"293", ratio:"2/7", fog:2, title:"Wayfinder: Feedback round, stack page and login", repo:"alp82/aistack", age:"3h ago", issue:"#292",
    stages:[
      {key:"walk", label:"done", count:2, color:"#77b197", items:[["#288","Define the by-harness comparison rows","merged"],["#289","Measure suggestions against the stack","merged"]]},
      {key:"flight", label:"running", count:1, color:"#65b8db", needs:true, items:[["#294","Fix the model match for measured suggestions","waiting for you"]]},
      {key:"take", label:"frontier", count:3, color:"#5ec8e5", items:[["#295","Show stack mismatches as decisions","ready"],["#296","Add the login return path","ready"],["#297","Separate measured and suggested models","ready"]]},
      {key:"blocked", label:"blocked", count:1, color:"#b66b78", items:[["#299","Compare the final harness matrix","behind #295"]]},
      {key:"fog", label:"fog", count:2, color:"#77808c", items:[["","What belongs in a saved stack?","not specified"],["","How should stale measurements age?","not specified"]]}
    ]},
  { id:"199", ratio:"0/8", fog:7, title:"Wayfinder: Build the Discord bot", repo:"alp82/aistack", age:"17h ago", issue:"#199",
    stages:[
      {key:"walk", label:"done", count:0, color:"#77b197", items:[]},
      {key:"flight", label:"running", count:1, color:"#65b8db", items:[["#200","Register commands with Discord","working · 18m"]]},
      {key:"take", label:"frontier", count:2, color:"#5ec8e5", items:[["#201","Create the Discord application shell","ready"],["#202","Route a message into one agent turn","ready"]]},
      {key:"blocked", label:"blocked", count:5, color:"#b66b78", items:[["#203","Stream replies into a thread","behind #202"],["#204","Authorize operators","behind #201"],["#205","Add question buttons","behind #202"],["#206","Attach preview links","behind #203"],["#207","Resume an interrupted turn","behind #203"]]},
      {key:"fog", label:"fog", count:7, color:"#77808c", items:[["","Thread naming","not specified"],["","Rate limits","not specified"],["","Message retention","not specified"],["","Multiple guilds","not specified"],["","Attachment limits","not specified"],["","Command discovery","not specified"],["","Operator handoff","not specified"]]}
    ]},
  { id:"72", ratio:"0/2", fog:1, title:"Map: Alfredo sim - playable pain, shipped", repo:"gelalfredo/landing-page", age:"858h ago", issue:"#72", paused:true,
    stages:[
      {key:"walk", label:"done", count:0, color:"#77b197", items:[]},
      {key:"flight", label:"running", count:0, color:"#65b8db", items:[]},
      {key:"take", label:"frontier", count:1, color:"#5ec8e5", items:[["#73","Make the pain loop playable","ready"]]},
      {key:"blocked", label:"blocked", count:1, color:"#b66b78", items:[["#74","Ship the simulation page","behind #73"]]},
      {key:"fog", label:"fog", count:1, color:"#77808c", items:[["","What proves that the loop is fun?","not specified"]]}
    ]}
];
const VARIANTS = ["A","B","C"];
const NAMES = {A:"A · Split full rail", B:"B · Inline full rail", C:"C · A/C synthesis"};
let selected = MAPS[0].id;
const params = new URLSearchParams(location.search);
let variant = VARIANTS.includes(params.get("variant")) ? params.get("variant") : "C";

function total(map) { return map.stages.reduce((sum, stage) => sum + stage.count, 0); }
function band(map) {
  const size = Math.max(total(map), 1);
  const nonzero = map.stages.filter(stage => stage.count);
  const zeroes = map.stages.filter(stage => !stage.count);
  return `<div class="band" style="grid-template-columns:repeat(${size},minmax(0,1fr))" aria-label="${size} total items">${nonzero.map(stage =>
    `<div class="segment ${stage.key} ${stage.needs ? "needs" : ""}" style="grid-column:span ${stage.count}" title="${stage.count} ${stage.label}${stage.needs ? ", needs you" : ""}">
      <span>${stage.count}</span>${stage.count / size >= .18 ? `<small>${stage.label}</small>` : ""}</div>`).join("")}</div>
    <div class="zeroes">${zeroes.map(stage => `<span>0 ${stage.label}</span>`).join("")}</div>`;
}
function mapButton(map) {
  return `<article class="map-card ${selected === map.id ? "selected" : ""}" data-map="${map.id}" role="button" tabindex="0" aria-pressed="${selected === map.id}">
    <div class="map-head"><div class="fraction">${map.ratio.replace("/",'<span class="of">/</span>')}<span class="fog-n">+${map.fog}</span></div>
      <div class="map-title"><strong>${map.title}</strong><div class="meta">${map.repo} · ${map.age} · <span class="issue">${map.issue}</span>${map.paused ? " · paused" : ""}</div></div></div>
    ${band(map)}</article>`;
}
function fullRail(map) {
  return `<div class="full-rail">${map.stages.map(stage => `<section class="stage-row stage-${stage.key}" style="--stage:${stage.color}">
    <i class="stage-dot"></i><header class="stage-title"><b>${stage.label}</b><span class="stage-summary">
      ${stage.key === "flight" && stage.count ? stage.needs ? `<mark class="needs-badge">needs you</mark>` : `<span class="activity">working</span>` : ""}
      <span>${stage.count} ${stage.count === 1 ? "item" : "items"}</span></span></header>
    ${stage.items.length ? stage.items.map(item => stage.key === "take"
      ? `<div class="ticket frontier-ticket"><span class="ticket-id">${item[0]}</span><span class="frontier-copy"><span class="ticket-title">${item[1]}</span><span class="frontier-meta">${item[2]} · routed to claude-opus-5</span></span><button class="start-button" aria-label="Start ${item[1]}">Start</button></div>`
      : `<div class="ticket"><span class="ticket-id">${item[0]}</span><span class="ticket-title">${item[1]}</span><span class="ticket-state">${item[2]}</span></div>`).join("") : `<div class="empty">Nothing ${stage.label}</div>`}
  </section>`).join("")}</div>`;
}
function detailHead(map) {
  return `<header class="detail-head"><div class="detail-kicker">full map · ${map.repo} · ${map.issue}</div><h2>${map.title}</h2></header>`;
}
function renderA() {
  const map = MAPS.find(item => item.id === selected);
  return `<div class="split"><div>${MAPS.map(mapButton).join("")}</div><aside class="detail sticky">${detailHead(map)}${fullRail(map)}</aside></div>`;
}
function renderB() {
  return `<div class="inline-list">${MAPS.map(map => `<article class="inline-card ${selected === map.id ? "selected" : ""}">${mapButton(map)}${selected === map.id ? `<div class="inline-detail">${detailHead(map)}${fullRail(map)}</div>` : ""}</article>`).join("")}</div>`;
}
function renderC() {
  const map = MAPS.find(item => item.id === selected);
  return `<div class="focus-layout"><nav class="map-index" aria-label="Maps">${MAPS.map(item => `<article class="index-card ${item.id === selected ? "selected" : ""}" data-map="${item.id}" role="button" tabindex="0" aria-pressed="${item.id === selected}"><strong>${item.title}</strong><span class="index-meta">${item.ratio}+${item.fog} · ${item.repo}</span>${band(item)}</article>`).join("")}</nav>
    <article class="focus-detail">${detailHead(map)}${band(map)}${fullRail(map)}</article></div>`;
}
const RENDER = {A:renderA, B:renderB, C:renderC};
function render() {
  document.querySelectorAll(".view").forEach(view => {
    const active = view.dataset.variant === variant;
    view.classList.toggle("active", active);
    if (active) view.innerHTML = RENDER[variant]();
  });
  document.getElementById("variant-name").textContent = NAMES[variant];
  document.querySelectorAll("[data-map]").forEach(button => {
    const choose = () => { selected = button.dataset.map; render(); };
    button.addEventListener("click", choose);
    button.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault(); choose();
    });
  });
  const next = new URLSearchParams(location.search); next.set("variant", variant);
  history.replaceState(null, "", `?${next}`);
}
function cycle(direction) { variant = VARIANTS[(VARIANTS.indexOf(variant) + direction + VARIANTS.length) % VARIANTS.length]; render(); }
document.getElementById("previous").addEventListener("click", () => cycle(-1));
document.getElementById("next").addEventListener("click", () => cycle(1));
window.addEventListener("keydown", event => {
  if (event.target.matches("input, textarea, [contenteditable]")) return;
  if (event.key === "ArrowLeft") cycle(-1);
  if (event.key === "ArrowRight") cycle(1);
});
document.querySelectorAll("a[href='#']").forEach(link => link.addEventListener("click", event => event.preventDefault()));
render();
</script>
</body>
</html>
